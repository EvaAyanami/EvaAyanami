# ------------------------------------------------------------------------------
# Construit et publie les images Docker de Codemori sur le registre GitHub
# (ghcr.io/<propriétaire>/codemori-*), pour un déploiement sans compilation
# sur le serveur (TrueNAS SCALE, Portainer, Unraid…). Voir docs/truenas.md.
# ------------------------------------------------------------------------------
name: Images Docker

on:
  push:
    branches: [main, master, 'claude/codemori-learning-platform-jtj4qf']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx --workspace apps/api prisma generate
      - run: npm test
      - run: npm run content:validate
      - run: npm run build

  images:
    needs: tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - nom: app
            contexte: .
            dockerfile: Dockerfile
          - nom: runner
            contexte: .
            dockerfile: apps/runner/Dockerfile
          - nom: sandbox-rust
            contexte: apps/runner/images
            dockerfile: apps/runner/images/rust/Dockerfile
          - nom: sandbox-cpp
            contexte: apps/runner/images
            dockerfile: apps/runner/images/cpp/Dockerfile
          - nom: sandbox-java
            contexte: apps/runner/images
            dockerfile: apps/runner/images/java/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Nom du propriétaire en minuscules
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.owner }}/codemori-${{ matrix.nom }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexte }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.nom }}
          cache-to: type=gha,mode=max,scope=${{ matrix.nom }}
