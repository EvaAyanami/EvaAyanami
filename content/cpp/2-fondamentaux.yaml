    project:
      id: cpp-ctor-projet
      type: code
      title: Date valide
      difficulty: 3
      prompt: |
        Écris une classe `Date` dont le constructeur `Date(int j, int m, int a)` **lève** `std::invalid_argument("date invalide")` si la date n’existe pas (années bissextiles comprises), et une méthode `Date lendemain() const`. Affichage `JJ/MM/AAAA`.

        Pour chaque ligne `j m a`, affiche `JJ/MM/AAAA -> lendemain` ou `date invalide` (attrape l’exception).
      starter: |
        #include <iostream>
        #include <iomanip>
        #include <stdexcept>

        int main() {
            int j, m, a;
            while (std::cin >> j >> m >> a) {
            }
        }
      solution: |
        #include <iostream>
        #include <iomanip>
        #include <stdexcept>

        class Date {
        public:
            Date(int j, int m, int a) : jour(j), mois(m), annee(a) {
                if (m < 1 || m > 12 || j < 1 || j > joursDansMois(m, a)) throw std::invalid_argument("date invalide");
            }
            Date lendemain() const {
                if (jour < joursDansMois(mois, annee)) return Date(jour + 1, mois, annee);
                if (mois < 12) return Date(1, mois + 1, annee);
                return Date(1, 1, annee + 1);
            }
            void afficher(std::ostream& o) const {
                o << std::setfill('0') << std::setw(2) << jour << "/" << std::setw(2) << mois << "/" << annee;
            }
        private:
            static bool bissextile(int a) { return (a % 4 == 0 && a % 100 != 0) || a % 400 == 0; }
            static int joursDansMois(int m, int a) {
                static const int j[] = {31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31};
                return m == 2 && bissextile(a) ? 29 : j[m - 1];
            }
            int jour, mois, annee;
        };

        int main() {
            int j, m, a;
            while (std::cin >> j >> m >> a) {
                try {
                    Date d(j, m, a);
                    d.afficher(std::cout);
                    std::cout << " -> ";
                    d.lendemain().afficher(std::cout);
                    std::cout << "\n";
                } catch (const std::invalid_argument& e) {
                    std::cout << e.what() << "\n";
                }
            }
        }
      tests:
        - { input: "28 2 2024\n31 12 2025\n30 2 2023", output: "28/02/2024 -> 29/02/2024\n31/12/2025 -> 01/01/2026\ndate invalide" }
        - { input: "29 2 1900\n29 2 2000\n31 4 2026", output: "date invalide\n29/02/2000 -> 01/03/2000\ndate invalide", hidden: true }
