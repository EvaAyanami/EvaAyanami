      - id: cpp-ptr-fill
        type: fill
        prompt: Complète pour modifier `n` via un pointeur.
        code: |
          #include <iostream>
          int main() {
              int n = 1;
              int* p = {{?}}n;
              {{?}}p = 100;
              std::cout << n << "\n";
          }
        blanks: [['&'], ['*']]
        tests:
          - { input: '', output: '100' }
      - id: cpp-ptr-bug
        type: bugfix
        prompt: Ce programme plante (segmentation fault). Trouve la ligne fautive.
        code: |
          #include <iostream>
          int main() {
              int* p = nullptr;
              int valeur = 3;
              *p = valeur;
              std::cout << *p << "\n";
          }
        bugLines: [5]
        choices:
          - On déréférence un pointeur nul ; il faut d’abord le faire pointer vers une variable valide
          - Il faut écrire &p
          - valeur doit être un pointeur
        answer: 0
        solution: |
          #include <iostream>
          int main() {
              int cible = 0;
              int* p = &cible;
              int valeur = 3;
              *p = valeur;
              std::cout << *p << "\n";
          }
        tests:
          - { input: '', output: '3' }
      - id: cpp-ptr-code
        type: code
        title: Minimum et maximum par pointeurs
        prompt: |
          Écris `void minMax(const int* debut, int n, int* mini, int* maxi)` qui parcourt le tableau **avec de l’arithmétique de pointeurs** et écrit les résultats via `mini` et `maxi`.

          Le programme lit `n` puis `n` entiers et affiche `min max`.
        starter: |
          #include <iostream>
          #include <vector>

          int main() {
              int n;
              std::cin >> n;
              std::vector<int> v(n);
              for (auto& x : v) std::cin >> x;
              int mi, ma;
              minMax(v.data(), n, &mi, &ma);
              std::cout << mi << " " << ma << "\n";
          }
        solution: |
          #include <iostream>
          #include <vector>

          void minMax(const int* debut, int n, int* mini, int* maxi) {
              *mini = *debut;
              *maxi = *debut;
              for (const int* p = debut; p != debut + n; ++p) {
                  if (*p < *mini) *mini = *p;
                  if (*p > *maxi) *maxi = *p;
              }
          }

          int main() {
              int n;
              std::cin >> n;
              std::vector<int> v(n);
              for (auto& x : v) std::cin >> x;
              int mi, ma;
              minMax(v.data(), n, &mi, &ma);
              std::cout << mi << " " << ma << "\n";
          }
        tests:
          - { input: "4\n4 -2 9 7", output: -2 9 }
          - { input: "1\n5", output: 5 5, hidden: true }
        require:
          - { pattern: 'int\s*\*\s*mini', message: 'minMax doit recevoir des pointeurs' }
        concepts: [pointeurs]
    project:
      id: cpp-ptr-projet
      type: code
      title: Inversion en place
      difficulty: 2
      prompt: |
        Écris `void inverser(int* debut, int* fin)` qui inverse le tableau `[debut, fin)` en échangeant les éléments depuis les deux extrémités avec deux pointeurs qui se rapprochent.

        Lis `n` puis `n` entiers et affiche le tableau inversé (séparé par des espaces).
      starter: |
        #include <iostream>
        #include <vector>

        int main() {
            int n;
            std::cin >> n;
            std::vector<int> v(n);
            for (auto& x : v) std::cin >> x;
        }
      solution: |
        #include <iostream>
        #include <vector>

        void inverser(int* debut, int* fin) {
            while (debut < fin) {
                --fin;
                if (debut >= fin) break;
                int t = *debut;
                *debut = *fin;
                *fin = t;
                ++debut;
            }
        }

        int main() {
            int n;
            std::cin >> n;
            std::vector<int> v(n);
            for (auto& x : v) std::cin >> x;
            inverser(v.data(), v.data() + n);
            for (int i = 0; i < n; ++i) std::cout << (i ? " " : "") << v[i];
            std::cout << "\n";
        }
      tests:
        - { input: "5\n1 2 3 4 5", output: 5 4 3 2 1 }
        - { input: "4\n7 8 9 10", output: 10 9 8 7, hidden: true }
        - { input: "1\n42", output: '42', hidden: true }
      require:
        - { pattern: 'void\s+inverser\s*\(\s*int\s*\*', message: 'inverser doit recevoir des pointeurs' }
