          };
          int main() {
              Notes n;
              n.ajouter(15);
              n.ajouter(25);
              n.ajouter(-3);
              std::cout << n.toutes().size() << "\n";
          }
        bugLines: [5]
        choices:
          - La condition utilise || au lieu de && et laisse passer des notes invalides
          - Le vecteur devrait être public
          - toutes() devrait renvoyer une copie
        answer: 0
        solution: |
          #include <iostream>
          #include <vector>
          class Notes {
          public:
              void ajouter(int n) { if (n >= 0 && n <= 20) notes.push_back(n); }
              const std::vector<int>& toutes() const { return notes; }
          private:
