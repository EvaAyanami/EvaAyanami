              std::cout << compter() << "\n";
          }
        output: '31'
      - id: cpp-mem-bug
        type: bugfix
        prompt: Cette fonction renvoie un pointeur invalide. Trouve la ligne fautive.
        code: |
          #include <iostream>
          int* creer() {
