        explanation: La seule méthode qui modifie l’état doit garantir l’invariant ; une erreur de logique dans la validation suffit à le casser.
      - id: cpp-enc-code
        type: code
        title: Thermostat
        prompt: |
          Écris une classe `Thermostat` dont la consigne reste **toujours entre 5 et 30 °C** (invariant). Méthodes : `void regler(double c)` (ignore une valeur hors limites et renvoie false), `void augmenter()` / `void diminuer()` (pas de 0.5, bornés), `double consigne() const`. Consigne initiale : 19.

          Commandes : `regler X`, `+`, `-`. Affiche la consigne (1 décimale) après chaque commande.
        starter: |
          #include <iostream>
          #include <string>
          #include <iomanip>

          int main() {
              std::string cmd;
              while (std::cin >> cmd) {
              }
          }
        solution: |
          #include <iostream>
          #include <string>
          #include <iomanip>
          #include <algorithm>

          class Thermostat {
          public:
              bool regler(double c) {
                  if (c < 5 || c > 30) return false;
                  consigne_ = c;
                  return true;
              }
              void augmenter() { consigne_ = std::min(30.0, consigne_ + 0.5); }
              void diminuer() { consigne_ = std::max(5.0, consigne_ - 0.5); }
              double consigne() const { return consigne_; }
          private:
              double consigne_ = 19;
          };

          int main() {
              Thermostat t;
              std::string cmd;
              std::cout << std::fixed << std::setprecision(1);
              while (std::cin >> cmd) {
                  if (cmd == "regler") { double c; std::cin >> c; t.regler(c); }
                  else if (cmd == "+") t.augmenter();
                  else t.diminuer();
                  std::cout << t.consigne() << "\n";
              }
