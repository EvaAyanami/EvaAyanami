  - slug: cpp-objets
    title: Objets
    summary: Instancier, copier et comparer des objets, objets sur la pile et dans des conteneurs, membres statiques et objets temporaires.
    minutes: 25
    concepts: [classes]
    sections:
      - title: Des objets comme des valeurs
        body: |
          En C++, les objets se comportent comme des **valeurs** : l’affectation **copie** l’objet (contrairement à Java où l’on copie une référence).

          ```cpp
          struct Point { int x, y; };
          Point a{1, 2};
          Point b = a;      // COPIE indépendante
          b.x = 100;
          std::cout << a.x; // 1
          ```

          Pour partager un même objet : références (`Point& r = a;`) ou pointeurs.

          Les objets se rangent dans des conteneurs : `std::vector<Point> pts{{1, 2}, {3, 4}};`, `pts.emplace_back(5, 6)` (construit directement dans le vecteur, si un constructeur existe).
      - title: Membres statiques et comparaison
        body: |
          Un membre **`static`** est partagé par toutes les instances :

          ```cpp
          class Joueur {
          public:
              Joueur() { ++nombre; }
              static int total() { return nombre; }
          private:
              static inline int nombre = 0;   // C++17 : définition dans la classe
          };
          Joueur j1, j2;
          std::cout << Joueur::total();     // 2
          ```

          Comparer des objets : il faut définir `operator==` — ou demander au compilateur de le générer (C++20) :

          ```cpp
          struct Point {
              int x, y;
              bool operator==(const Point&) const = default;
              auto operator<=>(const Point&) const = default;  // <, <=, >, >= générés
          };
          ```
