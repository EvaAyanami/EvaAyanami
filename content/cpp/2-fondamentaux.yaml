            }
          output: 6 12 3

  # ------------------------------------------------------------------
  - slug: cpp-references
    title: Références
    summary: Alias avec les références, passage par référence et par référence constante, différence avec les pointeurs et références pendantes.
    minutes: 25
    concepts: [references]
    sections:
      - title: Un autre nom pour une variable
        body: |
          Une **référence** est un **alias** : un second nom pour une variable existante.

          ```cpp
          int x = 10;
          int& r = x;     // r EST x
          r += 5;
          std::cout << x; // 15
          ```

          | | Référence `T&` | Pointeur `T*` |
          |---|---|---|
          | Doit être initialisée | ✅ | non |
          | Peut être nulle | ❌ | ✅ (`nullptr`) |
          | Peut changer de cible | ❌ | ✅ |
          | Syntaxe | comme la variable | `*p`, `p->` |

          Les références sont plus simples et plus sûres : préfère-les aux pointeurs quand un objet est forcément présent.
      - title: Usages et pièges
        body: |
          ```cpp
          void doubler(int& n) { n *= 2; }                        // modifier l’argument
          int longueur(const std::string& s) { return s.size(); } // lire sans copier

          for (auto& x : v) x += 1;                               // modifier les éléments
          ```

          **Référence pendante** : ne jamais renvoyer une référence vers une variable locale !

          ```cpp
          const std::string& mauvais() {
              std::string s = "temporaire";
              return s;          // ⚠️ s est détruite : référence invalide (UB)
          }
          ```

          Une `const T&` peut se lier à une valeur temporaire (`const int& r = 5;`), une `T&` non.
    exercises:
      - id: cpp-ref-predict
        type: predict
        prompt: Que va afficher ce programme ?
        code: |
          #include <iostream>
          #include <vector>
          int main() {
              std::vector<int> v{1, 2, 3};
              for (auto x : v) x *= 10;
              for (auto& x : v) x += 1;
