              return &valeur;
          }
          int main() {
              int* p = creer();
              std::cout << *p << "\n";
          }
        bugLines: [4]
        choices:
          - On renvoie l’adresse d’une variable locale détruite à la fin de la fonction
          - Il faut renvoyer *valeur
          - main ne peut pas recevoir de pointeur
        answer: 0
        solution: |
          #include <iostream>
          int creer() {
              int valeur = 42;
              return valeur;
          }
          int main() {
              int v = creer();
              std::cout << v << "\n";
          }
        tests:
          - { input: '', output: '42' }
      - id: cpp-mem-code
        type: code
        title: Compteur d’appels
        prompt: |
          Écris `int prochainIdentifiant()` qui renvoie 1, puis 2, puis 3… à chaque appel, grâce à une variable locale `static` (pas de variable globale).

          Pour chaque nom lu, affiche `#id nom`.
        starter: |
          #include <iostream>
          #include <string>

          int main() {
              std::string nom;
              while (std::cin >> nom) {
                  std::cout << "#" << prochainIdentifiant() << " " << nom << "\n";
              }
          }
        solution: |
          #include <iostream>
          #include <string>

          int prochainIdentifiant() {
              static int compteur = 0;
              return ++compteur;
          }

          int main() {
              std::string nom;
              while (std::cin >> nom) {
                  std::cout << "#" << prochainIdentifiant() << " " << nom << "\n";
              }
          }
        tests:
          - { input: Ada Bob Kiri, output: "#1 Ada\n#2 Bob\n#3 Kiri" }
          - { input: Solo, output: '#1 Solo', hidden: true }
        require:
          - { pattern: 'static\s+int', message: Utiliser une variable locale static }
    project:
      id: cpp-mem-projet
      type: code
      title: Profondeur de récursion
      difficulty: 2
      prompt: |
        Écris une fonction récursive `long long sommeRec(int n)` (somme de 1 à n) et une version itérative `long long sommeIter(int n)`.

        Pour chaque `n` lu : si `n <= 10000`, affiche `récursif : S` ; sinon affiche `itératif : S` (pour éviter un débordement de pile avec une récursion trop profonde).
      starter: |
        #include <iostream>

        int main() {
            int n;
            while (std::cin >> n) {
            }
        }
      solution: |
        #include <iostream>

        long long sommeRec(int n) {
            return n <= 0 ? 0 : n + sommeRec(n - 1);
        }

        long long sommeIter(int n) {
            long long s = 0;
            for (int i = 1; i <= n; ++i) s += i;
            return s;
        }

        int main() {
            int n;
            while (std::cin >> n) {
                if (n <= 10000) std::cout << "récursif : " << sommeRec(n) << "\n";
                else std::cout << "itératif : " << sommeIter(n) << "\n";
            }
        }
      tests:
        - { input: "10\n100000", output: "récursif : 55\nitératif : 5000050000" }
        - { input: "0\n10000\n50000000", output: "récursif : 0\nrécursif : 50005000\nitératif : 1250000025000000", hidden: true }
