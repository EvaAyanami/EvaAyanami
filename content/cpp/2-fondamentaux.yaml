    project:
      id: cpp-her-projet
      type: code
      title: Comptes bancaires spécialisés
      difficulty: 3
      prompt: |
        Classe de base `Compte` (titulaire, solde protégé, `deposer`, `bool retirer(double)` qui refuse un solde négatif). Classe dérivée `CompteEpargne` qui ajoute un taux et une méthode `void appliquerInterets()` (solde × (1 + taux)). Classe dérivée `CompteCourant` avec un **découvert autorisé** : elle fournit sa propre méthode `bool retirerAvecDecouvert(double)`.

        Commandes : `epargne taux`, `courant decouvert` (crée le compte — un seul compte par exécution, solde initial 0), puis `depot X`, `retrait X`, `interets`. Affiche le solde (2 décimales) après chaque opération, ou `refusé` pour un retrait impossible.
      starter: |
        #include <iostream>
        #include <iomanip>
        #include <string>

        int main() {
            std::string type;
            double param;
            std::cin >> type >> param;
        }
      solution: |
        #include <iostream>
        #include <iomanip>
        #include <string>

        class Compte {
        public:
            void deposer(double m) { solde_ += m; }
            bool retirer(double m) {
                if (m > solde_) return false;
                solde_ -= m;
                return true;
            }
            double solde() const { return solde_; }
        protected:
            double solde_ = 0;
        };

        class CompteEpargne : public Compte {
        public:
            explicit CompteEpargne(double taux) : taux_(taux) {}
            void appliquerInterets() { solde_ *= 1 + taux_; }
        private:
            double taux_;
        };

        class CompteCourant : public Compte {
        public:
            explicit CompteCourant(double decouvert) : decouvert_(decouvert) {}
            bool retirerAvecDecouvert(double m) {
                if (solde_ - m < -decouvert_) return false;
                solde_ -= m;
                return true;
            }
        private:
            double decouvert_;
        };

        int main() {
            std::string type;
            double param;
            std::cin >> type >> param;
            CompteEpargne ep(param);
            CompteCourant cc(param);
            bool epargne = type == "epargne";
            std::string cmd;
            std::cout << std::fixed << std::setprecision(2);
            while (std::cin >> cmd) {
                bool ok = true;
                if (cmd == "depot") {
                    double x; std::cin >> x;
                    if (epargne) ep.deposer(x); else cc.deposer(x);
                } else if (cmd == "retrait") {
                    double x; std::cin >> x;
                    ok = epargne ? ep.retirer(x) : cc.retirerAvecDecouvert(x);
                } else if (epargne) {
                    ep.appliquerInterets();
                }
                if (!ok) std::cout << "refusé\n";
                else std::cout << (epargne ? ep.solde() : cc.solde()) << "\n";
            }
        }
      tests:
        - { input: "epargne 0.1\ndepot 100\ninterets\nretrait 200\nretrait 10", output: "100.00\n110.00\nrefusé\n100.00" }
        - { input: "courant 50\nretrait 30\nretrait 30\ndepot 100", output: "-30.00\nrefusé\n70.00", hidden: true }
