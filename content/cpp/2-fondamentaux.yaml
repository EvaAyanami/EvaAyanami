  # ------------------------------------------------------------------
  - slug: cpp-allocation
    title: Allocation mémoire
    summary: new et delete, tableaux dynamiques new[]/delete[], fuites mémoire, double libération et premiers pas vers unique_ptr.
    minutes: 30
    concepts: [memoire, pointeurs]
    sections:
      - title: new et delete
        body: |
          ```cpp
          int* p = new int(42);        // alloue un int sur le tas
          std::cout << *p;
          delete p;                    // libère
          p = nullptr;                 // évite un pointeur pendant

          int n = 5;
          int* t = new int[n]{};       // tableau dynamique initialisé à 0
          t[2] = 7;
          delete[] t;                  // ⚠️ delete[] pour un tableau
          ```

          Chaque `new` doit correspondre à **exactement un** `delete` (et `new[]` à `delete[]`).
      - title: Les erreurs classiques
        body: |
          | Erreur | Conséquence |
          |---|---|
          | Oublier `delete` | **fuite mémoire** |
          | `delete` deux fois | **double free** → plantage / faille |
          | Utiliser après `delete` | **use-after-free** → UB |
          | `delete` au lieu de `delete[]` | UB |
          | Exception entre `new` et `delete` | fuite |

          C’est pourquoi le C++ moderne **évite `new`/`delete` explicites** au profit de :

          ```cpp
          #include <memory>
          auto p = std::make_unique<int>(42);         // libéré automatiquement
          auto t = std::make_unique<int[]>(5);
          std::vector<int> v(5);                      // encore plus simple
          ```

          Outils : `-fsanitize=address` (AddressSanitizer), **Valgrind**.
    exercises:
      - id: cpp-alloc-q1
        type: mcq
        prompt: Comment libérer un tableau alloué avec `new int[10]` ?
