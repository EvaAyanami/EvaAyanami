      - id: cpp-ctor-code
        type: code
        title: Horloge
        prompt: |
          Écris une classe `Horloge` avec un constructeur `Horloge(int h, int m)` qui **normalise** l’heure (par ex. `(25, 70)` → `02:10`), une méthode `void avancer(int minutes)` et `void afficher() const` au format `HH:MM`.

          Entrée : `h m` puis plusieurs durées en minutes. Affiche l’heure initiale puis l’heure après chaque avance.
        starter: |
