      - id: cpp-ref-q2
        type: mcq
        prompt: Pourquoi renvoyer une référence vers une variable locale est-il dangereux ?
        choices: [La variable est détruite à la fin de la fonction (référence pendante), C’est trop lent, Ça ne compile jamais, Ce n’est pas dangereux]
        answer: 0
      - id: cpp-ref-bug
        type: bugfix
        prompt: La fonction est censée incrémenter le compteur mais n’a aucun effet. Trouve la ligne à corriger.
        code: |
          #include <iostream>
          void incrementer(int c) {
              c++;
          }
          int main() {
              int compteur = 0;
              incrementer(compteur);
              incrementer(compteur);
              std::cout << compteur << "\n";
          }
        bugLines: [2]
        choices:
          - Le paramètre est passé par valeur (copie) ; il faut int&
          - c++ ne fonctionne pas sur un int
          - Il faut appeler incrementer(&compteur)
        answer: 0
        solution: |
          #include <iostream>
          void incrementer(int& c) {
              c++;
          }
          int main() {
              int compteur = 0;
              incrementer(compteur);
              incrementer(compteur);
              std::cout << compteur << "\n";
          }
        tests:
          - { input: '', output: '2' }
      - id: cpp-ref-code
        type: code
        title: Normaliser des notes
        prompt: |
          Écris `void normaliser(std::vector<double>& notes, double bareme)` qui ramène chaque note sur 20 (note × 20 / bareme), **en modifiant le vecteur en place**, et `double moyenne(const std::vector<double>& notes)`.

          Entrée : le barème, puis `n`, puis `n` notes. Affiche les notes normalisées (1 décimale, séparées par des espaces) puis la moyenne (2 décimales).
        starter: |
          #include <iostream>
          #include <vector>
          #include <iomanip>

          int main() {
              double bareme;
              int n;
              std::cin >> bareme >> n;
              std::vector<double> notes(n);
              for (auto& x : notes) std::cin >> x;
          }
        solution: |
          #include <iostream>
          #include <vector>
          #include <iomanip>

          void normaliser(std::vector<double>& notes, double bareme) {
              for (auto& x : notes) x = x * 20 / bareme;
          }

          double moyenne(const std::vector<double>& notes) {
              double s = 0;
              for (double x : notes) s += x;
              return s / notes.size();
          }

          int main() {
              double bareme;
              int n;
              std::cin >> bareme >> n;
              std::vector<double> notes(n);
              for (auto& x : notes) std::cin >> x;
              normaliser(notes, bareme);
              std::cout << std::fixed << std::setprecision(1);
              for (int i = 0; i < n; ++i) std::cout << (i ? " " : "") << notes[i];
              std::cout << "\n" << std::setprecision(2) << moyenne(notes) << "\n";
          }
        tests:
          - { input: "40\n3\n20 30 35", output: "10.0 15.0 17.5\n14.17" }
          - { input: "10\n2\n10 0", output: "20.0 0.0\n10.00", hidden: true }
        require:
          - { pattern: 'std::vector<double>\s*&\s*notes', message: 'normaliser doit recevoir le vecteur par référence' }
          - { pattern: 'const\s+std::vector<double>\s*&', message: 'moyenne doit recevoir une référence constante' }
        concepts: [references]
    project:
      id: cpp-ref-projet
      type: code
      title: Compte bancaire par références
      difficulty: 2
      prompt: |
        Écris `bool appliquer(long long& solde, const std::string& op, long long montant)` : `depot` ajoute, `retrait` retire si le solde suffit (sinon renvoie false sans modifier).

        Première ligne : solde initial. Lignes suivantes : `op montant`. Affiche `Refusé : retrait N` pour chaque refus, puis `Solde final : X`.
      starter: |
        #include <iostream>
        #include <string>

        int main() {
            long long solde;
            std::cin >> solde;
            std::string op;
            long long m;
            while (std::cin >> op >> m) {
            }
        }
      solution: |
        #include <iostream>
        #include <string>

        bool appliquer(long long& solde, const std::string& op, long long montant) {
            if (op == "depot") {
                solde += montant;
                return true;
            }
            if (solde >= montant) {
                solde -= montant;
                return true;
            }
            return false;
        }

        int main() {
            long long solde;
            std::cin >> solde;
            std::string op;
            long long m;
            while (std::cin >> op >> m) {
                if (!appliquer(solde, op, m)) std::cout << "Refusé : " << op << " " << m << "\n";
            }
            std::cout << "Solde final : " << solde << "\n";
        }
      tests:
        - { input: "100\ndepot 50\nretrait 120\nretrait 40", output: "Refusé : retrait 40\nSolde final : 30" }
        - { input: "0\nretrait 1\ndepot 1\nretrait 1", output: "Refusé : retrait 1\nSolde final : 0", hidden: true }
