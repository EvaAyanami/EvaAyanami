    project:
      id: cpp-enc-projet
      type: code
      title: Pile bornée
      difficulty: 3
      prompt: |
        Écris une classe `PileBornee` (capacité fixée au constructeur) avec `bool empiler(int x)` (false si pleine), `std::optional<int> depiler()` (vide si la pile est vide), `int taille() const`, `bool pleine() const`. Les données sont privées.

        Première ligne : capacité. Commandes : `push X` (affiche `ok` ou `pleine`), `pop` (affiche la valeur ou `vide`), `taille`.
      starter: |
        #include <iostream>
        #include <optional>
        #include <string>
        #include <vector>

        int main() {
            int cap;
            std::cin >> cap;
        }
      solution: |
        #include <iostream>
        #include <optional>
        #include <string>
        #include <vector>

        class PileBornee {
        public:
            explicit PileBornee(int capacite) : capacite_(capacite) {}
            bool empiler(int x) {
                if (pleine()) return false;
                donnees_.push_back(x);
                return true;
            }
            std::optional<int> depiler() {
                if (donnees_.empty()) return std::nullopt;
                int v = donnees_.back();
                donnees_.pop_back();
                return v;
            }
            int taille() const { return static_cast<int>(donnees_.size()); }
            bool pleine() const { return taille() >= capacite_; }
        private:
            int capacite_;
            std::vector<int> donnees_;
        };

        int main() {
            int cap;
            std::cin >> cap;
            PileBornee p(cap);
            std::string cmd;
            while (std::cin >> cmd) {
                if (cmd == "push") {
                    int x;
                    std::cin >> x;
                    std::cout << (p.empiler(x) ? "ok" : "pleine") << "\n";
                } else if (cmd == "pop") {
                    auto v = p.depiler();
                    if (v) std::cout << *v << "\n"; else std::cout << "vide\n";
                } else {
                    std::cout << p.taille() << "\n";
                }
            }
        }
      tests:
        - { input: "2\npush 1\npush 2\npush 3\npop\ntaille\npop\npop", output: "ok\nok\npleine\n2\n1\n1\nvide" }
        - { input: "0\npush 5\ntaille", output: "pleine\n0", hidden: true }
