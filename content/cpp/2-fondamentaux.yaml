      - id: cpp-poly-code
        type: code
        title: Formes polymorphes
        prompt: |
          Écris une classe abstraite `Forme` (`aire()`, `perimetre()`, `nom()` virtuelles pures, destructeur virtuel) et trois classes `Cercle`, `Rectangle`, `Triangle` (côtés, formule de Héron). Utilise π = 3.141592653589793.

          Chaque ligne : `cercle r`, `rectangle l h` ou `triangle a b c`. Stocke les formes dans un `std::vector<std::unique_ptr<Forme>>`, affiche `nom : aire A, périmètre P` (2 décimales), puis `Plus grande aire : nom`.
        starter: |
          #include <iostream>
          #include <memory>
          #include <vector>
          #include <string>
          #include <cmath>
          #include <iomanip>

          int main() {
              std::string type;
              while (std::cin >> type) {
              }
          }
        solution: |
          #include <iostream>
          #include <memory>
          #include <vector>
          #include <string>
          #include <cmath>
          #include <iomanip>

          constexpr double PI = 3.141592653589793;

          class Forme {
          public:
              virtual ~Forme() = default;
              virtual double aire() const = 0;
              virtual double perimetre() const = 0;
              virtual std::string nom() const = 0;
          };

          class Cercle : public Forme {
          public:
              explicit Cercle(double r) : r_(r) {}
              double aire() const override { return PI * r_ * r_; }
              double perimetre() const override { return 2 * PI * r_; }
              std::string nom() const override { return "cercle"; }
          private:
              double r_;
          };

          class Rectangle : public Forme {
          public:
              Rectangle(double l, double h) : l_(l), h_(h) {}
              double aire() const override { return l_ * h_; }
              double perimetre() const override { return 2 * (l_ + h_); }
              std::string nom() const override { return "rectangle"; }
          private:
              double l_, h_;
          };

          class Triangle : public Forme {
          public:
              Triangle(double a, double b, double c) : a_(a), b_(b), c_(c) {}
              double perimetre() const override { return a_ + b_ + c_; }
              double aire() const override {
                  double s = perimetre() / 2;
                  return std::sqrt(s * (s - a_) * (s - b_) * (s - c_));
              }
              std::string nom() const override { return "triangle"; }
          private:
              double a_, b_, c_;
          };

          int main() {
              std::vector<std::unique_ptr<Forme>> formes;
              std::string type;
              while (std::cin >> type) {
                  if (type == "cercle") { double r; std::cin >> r; formes.push_back(std::make_unique<Cercle>(r)); }
                  else if (type == "rectangle") { double l, h; std::cin >> l >> h; formes.push_back(std::make_unique<Rectangle>(l, h)); }
                  else { double a, b, c; std::cin >> a >> b >> c; formes.push_back(std::make_unique<Triangle>(a, b, c)); }
              }
              std::cout << std::fixed << std::setprecision(2);
              const Forme* meilleure = nullptr;
              for (const auto& f : formes) {
                  std::cout << f->nom() << " : aire " << f->aire() << ", périmètre " << f->perimetre() << "\n";
                  if (!meilleure || f->aire() > meilleure->aire()) meilleure = f.get();
              }
              if (meilleure) std::cout << "Plus grande aire : " << meilleure->nom() << "\n";
          }
        tests:
          - { input: "cercle 1\nrectangle 2 3\ntriangle 3 4 5", output: "cercle : aire 3.14, périmètre 6.28\nrectangle : aire 6.00, périmètre 10.00\ntriangle : aire 6.00, périmètre 12.00\nPlus grande aire : rectangle" }
          - { input: "triangle 2 2 2\ncercle 2", output: "triangle : aire 1.73, périmètre 6.00\ncercle : aire 12.57, périmètre 12.57\nPlus grande aire : cercle", hidden: true }
        require:
          - { pattern: 'virtual\s+double\s+aire\s*\(\s*\)\s*const\s*=\s*0', message: 'aire doit être virtuelle pure' }
          - { pattern: 'override', message: Utiliser override }
        concepts: [polymorphisme]
    project:
      id: cpp-poly-projet
      type: code
      title: Zoo virtuel
      difficulty: 3
      prompt: |
        Classe abstraite `Animal` (nom, `virtual std::string cri() const = 0`, `virtual int nourriture() const = 0` en grammes/jour, méthode non virtuelle `std::string presentation() const` qui renvoie `"<nom> le <espece> fait <cri>"` en appelant une méthode virtuelle `espece()`).

        Dérivées : `Lion` (roar, 7000 g), `Perroquet` (coco, 50 g), `Tortue` (…, 200 g).

        Chaque ligne : `espece nom`. Affiche la présentation de chaque animal puis `Nourriture totale : N g`.
      starter: |
        #include <iostream>
        #include <memory>
        #include <string>
        #include <vector>

        int main() {
            std::string espece, nom;
            while (std::cin >> espece >> nom) {
            }
        }
      solution: |
        #include <iostream>
        #include <memory>
        #include <string>
        #include <vector>

        class Animal {
        public:
            explicit Animal(std::string nom) : nom_(std::move(nom)) {}
            virtual ~Animal() = default;
            virtual std::string cri() const = 0;
            virtual int nourriture() const = 0;
            virtual std::string espece() const = 0;
            std::string presentation() const { return nom_ + " le " + espece() + " fait " + cri(); }
        private:
            std::string nom_;
        };

        class Lion : public Animal {
        public:
            using Animal::Animal;
            std::string cri() const override { return "roar"; }
            int nourriture() const override { return 7000; }
            std::string espece() const override { return "lion"; }
        };

        class Perroquet : public Animal {
        public:
            using Animal::Animal;
            std::string cri() const override { return "coco"; }
            int nourriture() const override { return 50; }
            std::string espece() const override { return "perroquet"; }
        };

        class Tortue : public Animal {
        public:
            using Animal::Animal;
            std::string cri() const override { return "…"; }
            int nourriture() const override { return 200; }
            std::string espece() const override { return "tortue"; }
        };

        int main() {
            std::vector<std::unique_ptr<Animal>> zoo;
            std::string espece, nom;
            while (std::cin >> espece >> nom) {
                if (espece == "lion") zoo.push_back(std::make_unique<Lion>(nom));
                else if (espece == "perroquet") zoo.push_back(std::make_unique<Perroquet>(nom));
                else zoo.push_back(std::make_unique<Tortue>(nom));
            }
            int total = 0;
            for (const auto& a : zoo) {
                std::cout << a->presentation() << "\n";
                total += a->nourriture();
            }
            std::cout << "Nourriture totale : " << total << " g\n";
        }
      tests:
        - { input: "lion Simba\nperroquet Coco\ntortue Franklin", output: "Simba le lion fait roar\nCoco le perroquet fait coco\nFranklin le tortue fait …\nNourriture totale : 7250 g" }
        - { input: '', output: 'Nourriture totale : 0 g', hidden: true }
      require:
        - { pattern: 'virtual\s+~Animal', message: Destructeur virtuel dans Animal }
