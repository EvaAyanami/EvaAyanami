  # ------------------------------------------------------------------
  - slug: cpp-stack-heap
    title: Stack et Heap
    summary: Durée de vie des objets, pile et tas, portée automatique, objets statiques et pourquoi le tas est nécessaire.
    minutes: 25
    concepts: [memoire]
    sections:
      - title: Pile et tas en C++
        body: |
          - **Pile (stack)** : variables locales, durée de vie **automatique** — détruites à la fin de leur bloc. Allocation quasi gratuite, taille limitée (souvent 1 à 8 Mo).
          - **Tas (heap)** : mémoire allouée **dynamiquement** (`new`, conteneurs comme `std::vector`), qui vit jusqu’à sa libération explicite (ou par un propriétaire RAII).
          - **Mémoire statique** : variables globales et `static`, vivantes pendant tout le programme.

          ```cpp
          void f() {
              int local = 5;                 // pile
              std::vector<int> v(1000);      // l’objet v sur la pile, ses 1000 int sur le tas
              static int appels = 0;         // statique : conserve sa valeur entre les appels
              ++appels;
          } // local et v détruits ici ; le vector libère automatiquement son tas
          ```
      - title: Pourquoi le tas ?
        body: |
          On utilise le tas quand :

          - la taille n’est connue qu’à l’exécution (un fichier, une saisie) ;
          - la donnée est très grosse (risque de *stack overflow*) ;
          - l’objet doit survivre à la fonction qui le crée.

          ⚠️ Une récursion trop profonde ou un énorme tableau local (`int t[10'000'000];`) provoque un **débordement de pile**.

          En C++ moderne, on manipule rarement le tas directement : `std::vector`, `std::string`, `std::unique_ptr` le gèrent pour nous (**RAII**, voir le niveau Intermédiaire).
    exercises:
      - id: cpp-mem-q1
        type: mcq
        prompt: Quand une variable locale est-elle détruite ?
        choices: [À la fin du bloc où elle est déclarée, À la fin du programme, Quand on appelle delete, Jamais]
        answer: 0
        concepts: [memoire]
      - id: cpp-mem-q2
        type: mcq
        prompt: Où sont stockés les éléments d’un std::vector ?
        choices: [Sur le tas, Sur la pile, Dans les registres, Dans le binaire]
        answer: 0
      - id: cpp-mem-predict
        type: predict
        prompt: Que va afficher ce programme ?
        code: |
          #include <iostream>
          int compter() {
              static int n = 0;
              int local = 0;
