    project:
      id: cpp-obj-projet
      type: code
      title: Points et distances
      difficulty: 2
      prompt: |
        Définis `struct Point { double x, y; }` avec `operator==` par défaut et une fonction `double distance(const Point& a, const Point& b)`.

        Entrée : `n` puis `n` points. Affiche la distance totale du chemin qui relie les points dans l’ordre (2 décimales), puis le nombre de points en double (points égaux à un point précédent).
      starter: |
        #include <iostream>
        #include <vector>
        #include <cmath>
        #include <iomanip>

        int main() {
            int n;
            std::cin >> n;
        }
      solution: |
        #include <iostream>
        #include <vector>
        #include <cmath>
        #include <iomanip>

        struct Point {
            double x, y;
            bool operator==(const Point&) const = default;
        };

        double distance(const Point& a, const Point& b) {
            return std::hypot(a.x - b.x, a.y - b.y);
        }

        int main() {
            int n;
            std::cin >> n;
            std::vector<Point> pts(n);
            for (auto& p : pts) std::cin >> p.x >> p.y;
            double total = 0;
            int doublons = 0;
            for (int i = 0; i < n; ++i) {
                if (i > 0) total += distance(pts[i - 1], pts[i]);
                for (int j = 0; j < i; ++j) {
                    if (pts[j] == pts[i]) { ++doublons; break; }
                }
            }
            std::cout << std::fixed << std::setprecision(2) << total << "\n" << doublons << "\n";
        }
