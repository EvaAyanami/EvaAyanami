      - id: cpp-class-code
        type: code
        title: Classe Fraction
        prompt: |
          Écris une classe `Fraction` (attributs privés `num`, `den`) avec une méthode `void fixer(long long n, long long d)` qui simplifie la fraction (utilise `std::gcd` de `<numeric>`, dénominateur positif), `Fraction plus(const Fraction& o) const` et `void afficher() const` (format `num/den`).

          Lis deux fractions `a b` et `c d` et affiche leur somme.
        starter: |
          #include <iostream>
          #include <numeric>

          int main() {
              long long a, b, c, d;
              std::cin >> a >> b >> c >> d;
              Fraction f, g;
              f.fixer(a, b);
              g.fixer(c, d);
              f.plus(g).afficher();
          }
        solution: |
          #include <iostream>
          #include <numeric>

          class Fraction {
          public:
              void fixer(long long n, long long d) {
                  if (d < 0) { n = -n; d = -d; }
                  long long g = std::gcd(n, d);
                  if (g == 0) g = 1;
                  num = n / g;
                  den = d / g;
              }
              Fraction plus(const Fraction& o) const {
                  Fraction r;
                  r.fixer(num * o.den + o.num * den, den * o.den);
                  return r;
              }
              void afficher() const { std::cout << num << "/" << den << "\n"; }
          private:
              long long num = 0, den = 1;
          };

          int main() {
              long long a, b, c, d;
              std::cin >> a >> b >> c >> d;
              Fraction f, g;
              f.fixer(a, b);
              g.fixer(c, d);
              f.plus(g).afficher();
          }
        tests:
          - { input: 1 2 1 3, output: 5/6 }
          - { input: 1 4 1 4, output: 1/2, hidden: true }
          - { input: -1 2 1 2, output: 0/1, hidden: true }
        concepts: [classes]
