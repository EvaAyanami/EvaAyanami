  - slug: cpp-classes
    title: Classes
    summary: Définir une classe avec attributs et méthodes, sections public/private, méthodes const et séparation déclaration/définition.
    minutes: 35
    concepts: [classes, structs]
    sections:
      - title: Une première classe
        body: |
          ```cpp
          class Rectangle {
          public:                                  // accessible de l’extérieur
              double aire() const { return largeur * hauteur; }
              void redimensionner(double l, double h) {
                  if (l > 0 && h > 0) { largeur = l; hauteur = h; }
              }
          private:                                 // réservé à la classe
              double largeur = 1.0;
              double hauteur = 1.0;
          };                                       // ⚠️ point-virgule final

          Rectangle r;
          r.redimensionner(3, 4);
          std::cout << r.aire();   // 12
          ```

          - `class` : membres **privés** par défaut ; `struct` : **publics** par défaut. C’est la seule différence.
          - Une méthode `const` promet de ne pas modifier l’objet : elle peut être appelée sur un objet `const`.
      - title: Organisation en fichiers
        body: |
          ```cpp
          // rectangle.hpp
          #pragma once
          class Rectangle {
          public:
              double aire() const;
          private:
              double largeur = 1, hauteur = 1;
          };

          // rectangle.cpp
          #include "rectangle.hpp"
          double Rectangle::aire() const { return largeur * hauteur; }
          ```

          `Rectangle::aire` (opérateur de portée `::`) définit la méthode en dehors de la classe. `#pragma once` évite les inclusions multiples.

          `this` est un pointeur vers l’objet courant : `this->largeur`.
