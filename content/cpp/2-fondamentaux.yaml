  # ------------------------------------------------------------------
  - slug: cpp-heritage
    title: Héritage
    summary: Classes dérivées, héritage public, appel du constructeur parent, membres protected, redéfinition et ordre de construction.
    minutes: 30
    concepts: [heritage, classes]
    sections:
      - title: Dériver une classe
        body: |
          ```cpp
          class Animal {
          public:
              explicit Animal(std::string nom) : nom_(std::move(nom)) {}
              void presenter() const { std::cout << "Je suis " << nom_ << "\n"; }
          protected:                       // accessible aux classes dérivées
              std::string nom_;
          };

          class Chien : public Animal {      // héritage public
          public:
              Chien(std::string nom, std::string race) : Animal(std::move(nom)), race_(std::move(race)) {}
              void aboyer() const { std::cout << nom_ << " (" << race_ << ") : Wouf !\n"; }
          private:
              std::string race_;
          };

          Chien rex("Rex", "berger");
          rex.presenter();   // hérité
          rex.aboyer();
          ```

          Un `Chien` **est un** `Animal` (relation « est-un »). Si la relation est « a-un » (une voiture **a un** moteur), préfère la **composition** (un membre).
      - title: Construction et visibilité
        body: |
          - Construction : **la base d’abord**, puis les membres de la dérivée, puis le corps du constructeur dérivé. Destruction : dans l’ordre inverse.
          - Le constructeur parent s’appelle dans la liste d’initialisation : `Chien(...) : Animal(nom)`.
          - `protected` : visible par les dérivées, pas de l’extérieur.
          - `using Animal::Animal;` hérite des constructeurs de la base.
          - Une méthode de même nom dans la dérivée **masque** celle de la base ; pour un vrai polymorphisme, elle doit être `virtual` (chapitre suivant).
          - `final` interdit de dériver une classe (ou de redéfinir une méthode).
