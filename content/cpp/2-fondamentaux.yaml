    project:
      id: cpp-alloc-projet
      type: code
      title: Vecteur dynamique maison
      difficulty: 3
      prompt: |
        Implémente une petite structure `struct Tableau { int* donnees; int taille; int capacite; };` avec :

        - `void ajouter(Tableau& t, int x)` : si plein, alloue une zone **deux fois plus grande** (`new int[]`), copie, libère l’ancienne (`delete[]`) ;
        - `void liberer(Tableau& t)`.

        Capacité initiale : 1. Pour chaque entier lu, ajoute-le et affiche `taille/capacité`. Termine par la somme des éléments.
      starter: |
        #include <iostream>

        struct Tableau {
            int* donnees;
            int taille;
            int capacite;
        };

        int main() {
            Tableau t{new int[1], 0, 1};
            int x;
            while (std::cin >> x) {
            }
        }
      solution: |
        #include <iostream>

        struct Tableau {
            int* donnees;
            int taille;
            int capacite;
        };

        void ajouter(Tableau& t, int x) {
            if (t.taille == t.capacite) {
                int* nouveau = new int[t.capacite * 2];
                for (int i = 0; i < t.taille; ++i) nouveau[i] = t.donnees[i];
                delete[] t.donnees;
                t.donnees = nouveau;
                t.capacite *= 2;
            }
            t.donnees[t.taille++] = x;
        }

        void liberer(Tableau& t) {
            delete[] t.donnees;
            t.donnees = nullptr;
            t.taille = t.capacite = 0;
        }

        int main() {
            Tableau t{new int[1], 0, 1};
            int x;
            while (std::cin >> x) {
                ajouter(t, x);
                std::cout << t.taille << "/" << t.capacite << "\n";
            }
            long long s = 0;
            for (int i = 0; i < t.taille; ++i) s += t.donnees[i];
            std::cout << s << "\n";
            liberer(t);
        }
      tests:
        - { input: 5 6 7 8 9, output: "1/1\n2/2\n3/4\n4/4\n5/8\n35" }
        - { input: '42', output: "1/1\n42", hidden: true }
      require:
        - { pattern: 'delete\s*\[\s*\]', message: 'Libérer l’ancienne zone avec delete[]' }
