  # ------------------------------------------------------------------
  - slug: cpp-destructeurs
    title: Destructeurs
    summary: Le destructeur, ordre de destruction, libération de ressources et naissance du principe RAII.
    minutes: 25
    concepts: [classes, memoire]
    sections:
      - title: Le destructeur
        body: |
          Le **destructeur** `~NomClasse()` est appelé automatiquement quand l’objet est détruit (fin de portée, `delete`, destruction du conteneur). Il libère les ressources :

          ```cpp
          class Fichier {
          public:
              explicit Fichier(const char* nom) : f(std::fopen(nom, "w")) {}
              ~Fichier() { if (f) std::fclose(f); }      // fermeture garantie
              Fichier(const Fichier&) = delete;          // non copiable
              Fichier& operator=(const Fichier&) = delete;
          private:
              std::FILE* f;
          };
          ```

          Ordre : les objets locaux sont détruits dans l’**ordre inverse** de leur construction ; les membres d’un objet après le corps de son destructeur, en ordre inverse de déclaration.
      - title: RAII
        body: |
          **RAII** (*Resource Acquisition Is Initialization*) : une ressource (mémoire, fichier, verrou, socket) est **acquise par un constructeur** et **libérée par le destructeur**. Comme les destructeurs sont appelés même en cas d’exception, aucune fuite n’est possible.

          C’est **le** principe central du C++ : `std::vector`, `std::string`, `std::unique_ptr`, `std::lock_guard`, `std::fstream` l’appliquent tous.

          **Règle de trois** : si une classe a besoin d’un destructeur personnalisé, elle a probablement aussi besoin d’un constructeur de copie et d’un opérateur d’affectation personnalisés (ou de les supprimer).
    exercises:
