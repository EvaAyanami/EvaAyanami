        output: 100 3 4
        explanation: La première boucle modifie des copies ; la seconde modifie les éléments.
        concepts: [references]
      - id: cpp-ref-q1
        type: mcq
        prompt: Une référence peut-elle être réassignée pour désigner une autre variable ?
        choices: [Non, Oui, Seulement si elle est const, Seulement avec &=]
