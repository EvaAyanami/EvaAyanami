language: cpp
level: 2
chapters:
  # ------------------------------------------------------------------
  - slug: cpp-pointeurs
    title: Pointeurs
    summary: Adresses mémoire, déclaration et déréférencement de pointeurs, nullptr, arithmétique de pointeurs et pointeurs vers des structures.
    minutes: 35
    concepts: [pointeurs]
    sections:
      - title: Adresses et pointeurs
        body: |
          Chaque variable occupe une place en mémoire, repérée par une **adresse**. Un **pointeur** est une variable qui contient une adresse.

          ```cpp
          int x = 42;
          int* p = &x;        // & : « adresse de » ; p pointe vers x
          std::cout << *p;    // * : « valeur pointée » → 42
          *p = 7;             // modifie x à travers p
          std::cout << x;     // 7

          int* vide = nullptr;   // pointeur qui ne pointe sur rien
          if (vide != nullptr) { /* … */ }
          ```

          ⚠️ Déréférencer `nullptr` ou un pointeur non initialisé est un **comportement indéfini** (souvent un plantage « Segmentation fault »).
      - title: Arithmétique et tableaux
        body: |
          Un nom de tableau se convertit en pointeur vers son premier élément :

          ```cpp
          int t[4] = {10, 20, 30, 40};
          int* p = t;            // &t[0]
          std::cout << *(p + 2); // 30 : avance de 2 ÉLÉMENTS (pas octets)
          p++;                   // pointe maintenant sur t[1]
          ```

          Pointeur vers une structure : l’opérateur `->` combine déréférencement et accès au membre :

          ```cpp
          struct Point { int x, y; };
          Point pt{3, 4};
          Point* pp = &pt;
          pp->x = 10;            // équivalent à (*pp).x = 10
          ```

          `const` et pointeurs : `const int* p` (valeur pointée non modifiable), `int* const p` (pointeur non réassignable).
    exercises:
