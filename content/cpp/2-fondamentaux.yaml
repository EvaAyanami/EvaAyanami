      solution: |
        #include <iostream>
        #include <string>
        #include <vector>
        #include <iomanip>

        class Inventaire {
        public:
            void ajouter(const std::string& nom, int q, double prix) {
                for (auto& o : objets) {
                    if (o.nom == nom) { o.quantite += q; return; }
                }
                objets.push_back({nom, q, prix});
            }
            double valeurTotale() const {
                double t = 0;
                for (const auto& o : objets) t += o.quantite * o.prix;
                return t;
            }
            void afficher() const {
                for (const auto& o : objets) std::cout << o.nom << " x " << o.quantite << "\n";
            }
        private:
            struct Objet { std::string nom; int quantite; double prix; };
            std::vector<Objet> objets;
        };

        int main() {
            Inventaire inv;
            std::string nom;
            int q;
            double prix;
            while (std::cin >> nom >> q >> prix) inv.ajouter(nom, q, prix);
            inv.afficher();
            std::cout << "Total : " << std::fixed << std::setprecision(2) << inv.valeurTotale() << "\n";
