        solution: |
          #include <iostream>
          #include <iomanip>

          class Horloge {
          public:
              Horloge(int h, int m) : minutes(0) { avancer(h * 60 + m); }
              void avancer(int m) {
                  minutes = ((minutes + m) % 1440 + 1440) % 1440;
              }
              void afficher() const {
                  std::cout << std::setw(2) << std::setfill('0') << minutes / 60 << ":" << std::setw(2) << std::setfill('0') << minutes % 60 << "\n";
              }
          private:
              int minutes;
          };

          int main() {
              int h, m;
              std::cin >> h >> m;
              Horloge c(h, m);
              c.afficher();
              int d;
              while (std::cin >> d) {
                  c.avancer(d);
                  c.afficher();
              }
          }
        tests:
