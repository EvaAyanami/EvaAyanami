      - id: cpp-dtor-code
        type: code
        title: Journal de portée
        prompt: |
          Écris une classe `Chrono` qui affiche `début <nom>` à sa construction et `fin <nom>` à sa destruction.

          Chaque mot lu crée un `Chrono` dans un **bloc imbriqué** dans le précédent (fonction récursive `imbriquer(mots, i)`). Les affichages montrent l’imbrication.
        starter: |
          #include <iostream>
          #include <string>
          #include <vector>

          int main() {
              std::vector<std::string> mots;
              std::string m;
              while (std::cin >> m) mots.push_back(m);
              imbriquer(mots, 0);
          }
        solution: |
          #include <iostream>
          #include <string>
          #include <vector>

          class Chrono {
          public:
              explicit Chrono(std::string n) : nom(std::move(n)) { std::cout << "début " << nom << "\n"; }
              ~Chrono() { std::cout << "fin " << nom << "\n"; }
          private:
              std::string nom;
          };

          void imbriquer(const std::vector<std::string>& mots, std::size_t i) {
              if (i >= mots.size()) return;
              Chrono c(mots[i]);
              imbriquer(mots, i + 1);
          }

          int main() {
              std::vector<std::string> mots;
              std::string m;
              while (std::cin >> m) mots.push_back(m);
              imbriquer(mots, 0);
          }
        tests:
          - { input: main calcul, output: "début main\ndébut calcul\nfin calcul\nfin main" }
          - { input: a b c, output: "début a\ndébut b\ndébut c\nfin c\nfin b\nfin a", hidden: true }
    project:
      id: cpp-dtor-projet
      type: code
      title: Gestionnaire de ressources
      difficulty: 3
      prompt: |
        Simule un pool de connexions. Une classe `Connexion` reçoit un identifiant et une référence vers un compteur global de connexions actives : le constructeur incrémente et affiche `ouverture #id (actives : N)`, le destructeur décrémente et affiche `fermeture #id (actives : N)`. La classe est **non copiable**.

        Chaque ligne d’entrée est un entier `k` : ouvre `k` connexions dans un `std::vector<std::unique_ptr<Connexion>>`, puis les détruit en vidant le vecteur (`clear()`), qui les détruit dans l’ordre des éléments. Les ids sont globaux et croissants. Termine par `actives finales : 0`.
      starter: |
        #include <iostream>
        #include <memory>
        #include <vector>

        int main() {
            int actives = 0;
            int k;
            while (std::cin >> k) {
            }
        }
      solution: |
        #include <iostream>
        #include <memory>
        #include <vector>

        class Connexion {
        public:
            Connexion(int i, int& compteur) : id(i), actives(compteur) {
                ++actives;
                std::cout << "ouverture #" << id << " (actives : " << actives << ")\n";
            }
            ~Connexion() {
                --actives;
                std::cout << "fermeture #" << id << " (actives : " << actives << ")\n";
            }
            Connexion(const Connexion&) = delete;
            Connexion& operator=(const Connexion&) = delete;
        private:
            int id;
            int& actives;
        };

        int main() {
            int actives = 0;
            int prochain = 1;
            int k;
            while (std::cin >> k) {
                std::vector<std::unique_ptr<Connexion>> pool;
                for (int i = 0; i < k; ++i) pool.push_back(std::make_unique<Connexion>(prochain++, actives));
                pool.clear();
            }
            std::cout << "actives finales : " << actives << "\n";
        }
      tests:
        - { input: "2\n1", output: "ouverture #1 (actives : 1)\nouverture #2 (actives : 2)\nfermeture #1 (actives : 1)\nfermeture #2 (actives : 0)\nouverture #3 (actives : 1)\nfermeture #3 (actives : 0)\nactives finales : 0" }
        - { input: '0', output: 'actives finales : 0', hidden: true }
      require:
        - { pattern: '~Connexion', message: Écrire le destructeur }
        - { pattern: '=\s*delete', message: Rendre la classe non copiable }
