  # ------------------------------------------------------------------
  - slug: cpp-constructeurs
    title: Constructeurs
    summary: Constructeurs par défaut et paramétrés, liste d’initialisation, délégation, explicit, constructeur de copie et règle de zéro.
    minutes: 30
    concepts: [classes, constructeurs]
    sections:
      - title: Construire un objet valide
        body: |
          ```cpp
          class Temperature {
          public:
              Temperature() : Temperature(20.0) {}                 // délégation
              explicit Temperature(double c) : celsius(c) {        // liste d’initialisation
                  if (c < -273.15) celsius = -273.15;
              }
              double valeur() const { return celsius; }
          private:
              double celsius;
          };

          Temperature t1;          // 20
          Temperature t2{36.6};
          // Temperature t3 = 5.0; // ❌ interdit grâce à explicit
          ```

          - La **liste d’initialisation** (`: celsius(c)`) initialise les membres **avant** le corps : obligatoire pour les membres `const` et les références, plus efficace pour les objets.
          - Les membres sont initialisés dans **l’ordre de leur déclaration** dans la classe.
          - `explicit` empêche les conversions implicites surprenantes.
      - title: Copie et règle de zéro
        body: |
          Le compilateur génère automatiquement le **constructeur de copie** et l’**affectation par copie** (copie membre à membre) :

          ```cpp
          Temperature a{10};
          Temperature b = a;     // constructeur de copie
          b = Temperature{30};   // affectation
          ```

          **Règle de zéro** : si tes membres gèrent eux-mêmes leurs ressources (`std::string`, `std::vector`, `std::unique_ptr`), n’écris **aucune** de ces fonctions spéciales : les versions générées sont correctes.

          On peut aussi les contrôler explicitement : `= default` ou `= delete` (interdire la copie d’un objet non copiable).
