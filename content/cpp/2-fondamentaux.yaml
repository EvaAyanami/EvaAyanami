  # ------------------------------------------------------------------
  - slug: cpp-polymorphisme
    title: Polymorphisme
    summary: Méthodes virtuelles, override, classes abstraites, destructeur virtuel, liaison dynamique et collections polymorphes.
    minutes: 35
    concepts: [polymorphisme, heritage]
    sections:
      - title: virtual et override
        body: |
          ```cpp
          class Forme {
          public:
              virtual ~Forme() = default;               // ⚠️ destructeur virtuel indispensable
              virtual double aire() const = 0;          // virtuelle PURE → classe abstraite
              virtual std::string nom() const { return "forme"; }
          };

          class Cercle : public Forme {
          public:
              explicit Cercle(double r) : r_(r) {}
              double aire() const override { return 3.14159 * r_ * r_; }
              std::string nom() const override { return "cercle"; }
          private:
              double r_;
          };
          ```

          - `virtual` : l’appel est résolu **à l’exécution** selon le type réel de l’objet (via une table virtuelle, *vtable*).
          - `override` : demande au compilateur de vérifier qu’on redéfinit bien une méthode virtuelle (attrape les fautes de frappe).
          - `= 0` : méthode virtuelle pure ; la classe devient **abstraite** (non instanciable).
      - title: Collections polymorphes
        body: |
          Le polymorphisme passe par des **pointeurs ou références** vers la base :

          ```cpp
          std::vector<std::unique_ptr<Forme>> formes;
          formes.push_back(std::make_unique<Cercle>(1.0));
          formes.push_back(std::make_unique<Carre>(2.0));
          for (const auto& f : formes) std::cout << f->nom() << " : " << f->aire() << "\n";
          ```

          ⚠️ **Découpage (slicing)** : copier une dérivée dans une variable de type base (`Forme f = cercle;`) perd la partie dérivée. Toujours manipuler par pointeur ou référence.

          ⚠️ Sans destructeur virtuel, détruire une dérivée via un pointeur de base est un comportement indéfini (le destructeur dérivé n’est pas appelé).
    exercises:
      - id: cpp-poly-predict
        type: predict
        prompt: Que va afficher ce programme ?
        code: |
          #include <iostream>
          #include <memory>
          #include <vector>
          struct Animal {
              virtual ~Animal() = default;
              virtual const char* cri() const { return "..."; }
              const char* type() const { return "animal"; }
          };
          struct Chat : Animal {
              const char* cri() const override { return "miaou"; }
              const char* type() const { return "chat"; }
          };
          int main() {
              std::unique_ptr<Animal> a = std::make_unique<Chat>();
              Chat c;
              std::cout << a->cri() << " " << a->type() << " " << c.type() << "\n";
          }
        output: miaou animal chat
        explanation: '`cri` est virtuelle (type réel), `type` ne l’est pas (type statique du pointeur).'
        concepts: [polymorphisme]
      - id: cpp-poly-q1
        type: mcq
        prompt: Qu’est-ce qu’une classe abstraite ?
        choices: [Une classe avec au moins une méthode virtuelle pure (non instanciable), Une classe sans attribut, Une classe privée, Une classe template]
