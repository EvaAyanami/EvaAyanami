      - id: cpp-alloc-code
        type: code
        title: Tableau dynamique
        prompt: |
          Lis `n` puis `n` entiers dans un tableau alloué avec `new int[n]`. Affiche les valeurs à l’envers puis libère correctement la mémoire avec `delete[]`.
