  # ------------------------------------------------------------------
  - slug: cpp-encapsulation
    title: Encapsulation
    summary: Protéger les invariants d’une classe — membres privés, accesseurs, validation, const-correctness et interfaces minimales.
    minutes: 25
    concepts: [classes, encapsulation]
    sections:
      - title: Protéger les invariants
        body: |
          Un **invariant** est une règle toujours vraie pour un objet valide (un solde jamais négatif, une date existante, un âge positif). L’encapsulation le garantit : les données sont **privées**, et seules des méthodes contrôlées peuvent les modifier.

          ```cpp
          class CompteBancaire {
          public:
              explicit CompteBancaire(std::string titulaire) : titulaire_(std::move(titulaire)) {}
              void deposer(long long montant) {
                  if (montant <= 0) throw std::invalid_argument("montant invalide");
                  solde_ += montant;
              }
              bool retirer(long long montant) {
                  if (montant <= 0 || montant > solde_) return false;
                  solde_ -= montant;
                  return true;
              }
              long long solde() const { return solde_; }            // lecture seule
              const std::string& titulaire() const { return titulaire_; }
          private:
              std::string titulaire_;
              long long solde_ = 0;
          };
          ```
      - title: Bonnes pratiques
        body: |
          - Exposer des **actions** (`deposer`, `retirer`) plutôt que des setters bruts (`setSolde`).
          - Une interface **minimale** : chaque méthode publique est une promesse à maintenir.
          - **const-correctness** : toutes les méthodes qui ne modifient rien sont `const`.
          - Renvoyer des `const T&` (ou des copies) plutôt que des références modifiables vers l’état interne.
          - `friend` donne accès aux membres privés à une fonction ou classe précise : à utiliser avec parcimonie (par ex. `operator<<`).
    exercises:
      - id: cpp-enc-q1
        type: mcq
        prompt: Qu’est-ce qu’un invariant de classe ?
        choices: [Une règle toujours vraie pour tout objet valide, Une constante globale, Un membre static, Une méthode virtuelle]
        answer: 0
        concepts: [encapsulation]
      - id: cpp-enc-q2
        type: mcq
        prompt: Pourquoi préférer `retirer(montant)` à `setSolde(valeur)` ?
        choices: [La méthode peut vérifier les règles métier, C’est plus court, setSolde est interdit, Pour la vitesse]
        answer: 0
      - id: cpp-enc-bug
        type: bugfix
        prompt: L’invariant « toutes les notes sont entre 0 et 20 » n’est pas respecté. Trouve la ligne fautive.
        code: |
          #include <iostream>
          #include <vector>
          class Notes {
          public:
              void ajouter(int n) { if (n >= 0 || n <= 20) notes.push_back(n); }
              const std::vector<int>& toutes() const { return notes; }
          private:
