      - id: cpp-str-code
        type: code
        title: Palindrome
        prompt: |
          Pour chaque ligne, affiche `oui` si c’est un palindrome en ignorant les espaces et la casse (lettres ASCII), `non` sinon.
        starter: |
          #include <iostream>
          #include <string>
          #include <cctype>

          int main() {
              std::string ligne;
              while (std::getline(std::cin, ligne)) {
              }
