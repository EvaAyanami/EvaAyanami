      solution: |
        #include <iostream>
        #include <vector>
        #include <algorithm>
        #include <numeric>
        #include <iomanip>

        int main() {
            int n;
            std::cin >> n;
            std::vector<int> notes(n);
            for (auto& x : notes) std::cin >> x;
            double moyenne = static_cast<double>(std::accumulate(notes.begin(), notes.end(), 0)) / n;
            std::cout << std::fixed << std::setprecision(2) << "Moyenne : " << moyenne << "\n";
            std::cout << "Min : " << *std::min_element(notes.begin(), notes.end()) << "\n";
            std::cout << "Max : " << *std::max_element(notes.begin(), notes.end()) << "\n";
            std::cout << "Au-dessus de la moyenne : " << std::count_if(notes.begin(), notes.end(), [&](int x) { return x > moyenne; }) << "\n";
            std::sort(notes.begin(), notes.end());
            std::cout << "Notes triées :";
            for (int x : notes) std::cout << " " << x;
            std::cout << "\n";
        }
      tests:
