  - slug: cpp-tableaux
    title: Tableaux
    summary: Tableaux C, std::array et std::vector — déclaration, accès sécurisé avec at(), parcours, tri et tableaux à deux dimensions.
    minutes: 30
    concepts: [collections, tableaux]
    sections:
      - title: Trois sortes de tableaux
        body: |
          ```cpp
          int notes[3] = {12, 15, 9};          // tableau C : taille fixe, à éviter
          std::array<int, 3> a{12, 15, 9};     // taille fixe, sûr (#include <array>)
          std::vector<int> v{12, 15, 9};       // taille dynamique (#include <vector>)

          v.push_back(18);                     // ajoute à la fin
          v.pop_back();                        // retire le dernier
          std::cout << v.size() << " " << v[0] << " " << v.at(1) << "\n";
          ```

          - `v[i]` **ne vérifie pas** les bornes : un indice invalide est un comportement indéfini.
          - `v.at(i)` vérifie et lève `std::out_of_range`.
          - Préfère `std::vector` (dynamique) ou `std::array` (fixe) aux tableaux C.
      - title: Algorithmes et 2D
        body: |
          ```cpp
          #include <algorithm>
          #include <numeric>

          std::sort(v.begin(), v.end());                       // tri croissant
          std::reverse(v.begin(), v.end());
          int somme = std::accumulate(v.begin(), v.end(), 0);
          int maxi = *std::max_element(v.begin(), v.end());
          auto n = std::count(v.begin(), v.end(), 12);

          std::vector<std::vector<int>> grille(3, std::vector<int>(4, 0)); // 3 lignes × 4 colonnes
          grille[1][2] = 7;
          ```
