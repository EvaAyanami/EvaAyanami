  # ------------------------------------------------------------------
  - slug: cpp-fonctions
    title: Fonctions
    summary: Déclaration, définition, paramètres par valeur et par référence, valeurs par défaut, surcharge et récursivité.
    minutes: 30
    concepts: [fonctions]
    sections:
      - title: Déclarer et définir
        body: |
          ```cpp
          double moyenne(double a, double b);        // déclaration (prototype)

          int main() {
              std::cout << moyenne(4, 7) << "\n";     // 5.5
          }

          double moyenne(double a, double b) {        // définition
              return (a + b) / 2;
          }
          ```

          Une fonction doit être **déclarée avant son utilisation**. Dans un projet, les déclarations vont dans un en-tête `.h`/`.hpp`, les définitions dans un `.cpp`.

          `void` signifie « ne renvoie rien ».
      - title: Passage des paramètres
        body: |
          ```cpp
          void parValeur(int x) { x = 99; }           // modifie une COPIE
          void parReference(int& x) { x = 99; }       // modifie l’original
          void lectureSeule(const std::string& s) {}  // sans copie, non modifiable
          ```

          Règle pratique :

          - types simples (`int`, `double`) → par valeur ;
          - gros objets en lecture → `const T&` ;
          - paramètre à modifier → `T&`.

          **Valeurs par défaut** et **surcharge** :

          ```cpp
          void saluer(const std::string& nom = "inconnu");
          int    maximum(int a, int b)       { return a > b ? a : b; }
          double maximum(double a, double b) { return a > b ? a : b; }   // surcharge
          ```
    exercises:
      - id: cpp-fn-predict
        type: predict
        prompt: Que va afficher ce programme ?
        code: |
          #include <iostream>
          void f(int x) { x += 10; }
