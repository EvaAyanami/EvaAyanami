        solution: |
          #include <iostream>
          #include <string>
          #include <cctype>

          int main() {
              std::string ligne;
              while (std::getline(std::cin, ligne)) {
                  std::string t;
                  for (unsigned char c : ligne) {
                      if (!std::isspace(c)) t += static_cast<char>(std::tolower(c));
                  }
                  std::string r(t.rbegin(), t.rend());
                  std::cout << (t == r ? "oui" : "non") << "\n";
              }
          }
        tests:
          - { input: "Esope reste ici et se repose\nRust", output: "oui\nnon" }
          - { input: "kayak\nA b A\nab", output: "oui\noui\nnon", hidden: true }
    project:
      id: cpp-str-projet
      type: code
      title: Chiffrement de César
      difficulty: 2
      prompt: |
        Première ligne : un décalage `k` (peut être négatif). Lignes suivantes : du texte. Chiffre chaque ligne avec le code de César : chaque lettre ASCII est décalée de `k` positions dans l’alphabet (en conservant la casse, avec retour au début), les autres caractères sont inchangés.
      starter: |
        #include <iostream>
        #include <string>

        int main() {
            int k;
            std::cin >> k;
            std::string ligne;
            std::getline(std::cin, ligne); // fin de la première ligne
            while (std::getline(std::cin, ligne)) {
            }
        }
      solution: |
        #include <iostream>
        #include <string>

        char decaler(char c, int k) {
            if (c >= 'a' && c <= 'z') return static_cast<char>('a' + ((c - 'a' + k) % 26 + 26) % 26);
            if (c >= 'A' && c <= 'Z') return static_cast<char>('A' + ((c - 'A' + k) % 26 + 26) % 26);
            return c;
        }

        int main() {
            int k;
            std::cin >> k;
            std::string ligne;
            std::getline(std::cin, ligne);
            while (std::getline(std::cin, ligne)) {
                for (char& c : ligne) c = decaler(c, k);
                std::cout << ligne << "\n";
            }
        }
      tests:
        - { input: "3\nBonjour, Kiri !", output: 'Erqmrxu, Nlul !' }
        - { input: "-1\nabc XYZ\nzA", output: "zab WXY\nyZ", hidden: true }
        - { input: "29\nHello", output: Khoor, hidden: true }
