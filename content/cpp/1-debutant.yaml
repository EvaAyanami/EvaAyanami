language: cpp
level: 1
chapters:
  # ------------------------------------------------------------------
  - slug: cpp-presentation
    title: Présentation du C++
    summary: Histoire, philosophie et domaines d’utilisation du C++, le langage qui allie contrôle du matériel et abstractions puissantes.
    minutes: 15
    concepts: [cpp, compilation]
    sections:
      - title: Un langage incontournable
        body: |
          Le **C++** a été créé par **Bjarne Stroustrup** à partir de 1979 (« C with Classes »), puis standardisé en 1998. Il étend le langage C avec la programmation orientée objet, la programmation générique et de nombreuses abstractions.

          On le retrouve partout où la **performance** compte :

          - moteurs de jeux vidéo (Unreal Engine), logiciels 3D ;
          - navigateurs (Chrome, Firefox), bases de données (MySQL, MongoDB) ;
          - finance haute fréquence, systèmes embarqués, automobile, aérospatial ;
          - bibliothèques scientifiques et d’IA (TensorFlow, PyTorch en interne).

          Philosophie : « **on ne paie pas pour ce qu’on n’utilise pas** » (*zero-overhead*).
      - title: Le C++ moderne
        body: |
          Le langage évolue tous les trois ans :

          | Norme | Apports majeurs |
          |---|---|
          | C++98 | STL, templates |
          | **C++11** | `auto`, lambdas, pointeurs intelligents, move semantics |
          | C++14 / 17 | `make_unique`, `std::optional`, `string_view`, structured bindings |
          | **C++20** | concepts, ranges, coroutines, modules |
          | C++23 | `std::print`, `std::expected`, `std::mdspan` |

          Sur Codemori, tu apprends le **C++ moderne** (C++20/23) compilé avec **GCC** : moins de pièges, plus de sécurité, sans renoncer à la performance.

          > ⚠️ Le C++ donne beaucoup de pouvoir… et de responsabilités : certaines erreurs (accès hors limites, mémoire libérée) ne sont pas détectées et provoquent un **comportement indéfini**. Les bonnes pratiques modernes évitent la plupart de ces pièges.
    exercises:
      - id: cpp-pres-q1
        type: mcq
        prompt: Qui a créé le C++ ?
        choices: [Dennis Ritchie, Bjarne Stroustrup, James Gosling, Guido van Rossum]
        answer: 1
        explanation: Dennis Ritchie a créé le C, James Gosling Java, Guido van Rossum Python.
      - id: cpp-pres-q2
        type: mcq
        prompt: Quelle version a introduit `auto`, les lambdas et les pointeurs intelligents ?
        choices: [C++98, C++11, C++20, C++23]
        answer: 1
      - id: cpp-pres-q3
        type: mcq
        prompt: Que signifie le principe « zero-overhead » ?
        choices: [On ne paie pas (en performance) pour ce qu’on n’utilise pas, Le C++ est gratuit, Le programme n’utilise aucune mémoire, Les erreurs sont impossibles]
        answer: 0
      - id: cpp-pres-code
        type: code
        title: Bonjour, C++ !
        prompt: |
          Modifie le programme pour qu’il affiche exactement :

          ```
          Bonjour, C++ !
          ```
        starter: |
          #include <iostream>

          int main() {
              std::cout << "Hello" << std::endl;
              return 0;
          }
        solution: |
          #include <iostream>

          int main() {
              std::cout << "Bonjour, C++ !" << std::endl;
              return 0;
          }
        tests:
          - { input: '', output: 'Bonjour, C++ !' }
        require:
          - { pattern: 'std::cout|cout', message: Utiliser std::cout }
    project:
      id: cpp-pres-projet
      type: code
      title: Carte de visite
      difficulty: 1
      prompt: |
        Lis un prénom (une ligne) et affiche :

        ```
        **********
        Bonjour, <prénom> !
        **********
        ```
      starter: |
        #include <iostream>
        #include <string>

        int main() {
            std::string prenom;
            std::getline(std::cin, prenom);
            // À toi !
            return 0;
        }
      solution: |
        #include <iostream>
        #include <string>

        int main() {
            std::string prenom;
            std::getline(std::cin, prenom);
            std::cout << "**********\n";
            std::cout << "Bonjour, " << prenom << " !\n";
            std::cout << "**********\n";
            return 0;
        }
      tests:
        - { input: Kiri, output: "**********\nBonjour, Kiri !\n**********" }
        - { input: Bjarne, output: "**********\nBonjour, Bjarne !\n**********", hidden: true }
      hints: ['Enchaîne les éléments avec `<<` : `std::cout << "Bonjour, " << prenom << " !\n";`']
    exam:
      pass: 70
      questions:
        - id: cpp-pres-ex1
          type: mcq
          prompt: Le C++ est un langage…
          choices: [interprété, compilé en code machine, exécuté uniquement par une machine virtuelle, de balisage]
          answer: 1
        - id: cpp-pres-ex2
          type: mcq
          prompt: Quelle norme a introduit les concepts et les coroutines ?
          choices: [C++11, C++14, C++17, C++20]
          answer: 3
        - id: cpp-pres-ex3
          type: mcq
          prompt: Qu’est-ce qu’un comportement indéfini (undefined behavior) ?
          choices: [Une situation où la norme ne garantit rien sur ce que fait le programme, Une erreur de compilation, Une exception, Un avertissement]
          answer: 0
        - id: cpp-pres-ex4
          type: predict
          prompt: Que va afficher ce programme ?
          code: |
            #include <iostream>
            int main() {
                std::cout << "C" << "++" << std::endl;
                std::cout << 2 + 3 << std::endl;
            }
          output: "C++\n5"

  # ------------------------------------------------------------------
  - slug: cpp-compilation
    title: Compilation
    summary: Du code source à l’exécutable — préprocesseur, compilation, édition de liens, options de GCC/Clang et messages d’erreur.
    minutes: 20
    concepts: [compilation, build]
    sections:
      - title: Les étapes de la compilation
        body: |
          1. **Préprocesseur** : traite les directives `#include`, `#define`, `#ifdef` (remplacement textuel).
          2. **Compilation** : chaque fichier `.cpp` devient un fichier objet `.o` (code machine).
          3. **Édition de liens** (*linker*) : assemble les `.o` et les bibliothèques en un exécutable.

          ```bash
          g++ -std=c++23 -Wall -Wextra -O2 main.cpp -o programme
          ./programme
          ```

          | Option | Rôle |
          |---|---|
          | `-std=c++23` | version de la norme |
          | `-Wall -Wextra` | active de nombreux avertissements (indispensable !) |
          | `-O2` | optimisations |
          | `-g` | informations de débogage |
          | `-fsanitize=address,undefined` | détecte les erreurs mémoire à l’exécution |
      - title: Erreurs de compilation et de liens
        body: |
          ```text
          main.cpp:5:5: error: 'cout' was not declared in this scope
          ```

          Format `fichier:ligne:colonne`. Ici, il manque `std::` ou l’`#include <iostream>`.

          Une erreur d’**édition de liens** ressemble à :

          ```text
          undefined reference to `calculer(int)'
          ```

          La fonction est **déclarée** mais jamais **définie** (ou le fichier qui la contient n’a pas été compilé avec le reste).

          Compilateurs principaux : **GCC** (`g++`), **Clang** (`clang++`), **MSVC** (Visual Studio). Sur Codemori, ton code est compilé avec `g++ -std=c++23 -Wall -Wextra`.
    exercises:
      - id: cpp-comp-order
        type: order
        prompt: Remets dans l’ordre les étapes de fabrication d’un exécutable.
        lines:
          - 'Préprocesseur (#include, #define)'
          - Compilation en fichiers objets
          - Édition de liens
          - Exécutable prêt
      - id: cpp-comp-q1
        type: mcq
        prompt: Que signifie l’erreur « undefined reference to … » ?
        choices: [Une fonction déclarée n’a pas été définie (erreur d’édition de liens), Une faute de frappe dans un mot-clé, Un point-virgule manquant, Une division par zéro]
        answer: 0
      - id: cpp-comp-q2
        type: mcq
        prompt: Quelle option active des avertissements supplémentaires ?
        choices: ['-O2', '-Wall', '-o', '-std=c++23']
        answer: 1
      - id: cpp-comp-bug
        type: bugfix
        prompt: Ce programme ne compile pas. Trouve la ligne fautive.
        code: |
          #include <iostream>

          int main() {
              cout << "Bonjour" << std::endl;
              return 0;
          }
        bugLines: [4]
        choices:
          - cout appartient à l’espace de noms std ; il faut écrire std::cout
          - 'Il manque un #include <string>'
          - return 0 est interdit
        answer: 0
        solution: |
          #include <iostream>

          int main() {
              std::cout << "Bonjour" << std::endl;
              return 0;
          }
        tests:
          - { input: '', output: Bonjour }
      - id: cpp-comp-fill
        type: fill
        prompt: Complète la commande qui compile en C++23 avec les avertissements et produit l’exécutable `jeu`.
        code: 'g++ -std={{?}} -Wall main.cpp {{?}} jeu'
        blanks: [['c++23'], ['-o']]
    project:
      id: cpp-comp-projet
      type: code
      title: Fonction séparée
      difficulty: 1
      prompt: |
        Déclare une fonction `int carre(int x);` **avant** `main` (prototype), utilise-la dans `main`, et **définis-la après** `main`.

        Le programme lit un entier et affiche son carré.
      starter: |
        #include <iostream>

        int main() {
            int n;
            std::cin >> n;
            return 0;
        }
      solution: |
        #include <iostream>

        int carre(int x);

        int main() {
            int n;
            std::cin >> n;
            std::cout << carre(n) << "\n";
            return 0;
        }

        int carre(int x) {
            return x * x;
        }
      tests:
        - { input: '7', output: '49' }
        - { input: '-12', output: '144', hidden: true }
        - { input: '0', output: '0', hidden: true }
      require:
        - { pattern: 'int\s+carre\s*\(\s*int\s+\w*\s*\)\s*;', message: 'Déclarer le prototype int carre(int x);' }
    exam:
      pass: 70
      questions:
        - id: cpp-comp-ex1
          type: mcq
          prompt: Que fait le préprocesseur avec `#include <iostream>` ?
          choices: [Il insère le contenu de l’en-tête dans le fichier, Il télécharge la bibliothèque, Il compile iostream, Rien]
          answer: 0
        - id: cpp-comp-ex2
          type: mcq
          prompt: Quelle option aide à détecter les erreurs mémoire à l’exécution ?
          choices: ['-fsanitize=address', '-O3', '-std=c++11', '-o']
          answer: 0
        - id: cpp-comp-ex3
          type: mcq
          prompt: Quelle extension porte un fichier objet produit par GCC ?
          choices: ['.o', '.cpp', '.h', '.exe uniquement']
          answer: 0
        - id: cpp-comp-ex4
          type: mcq
          prompt: Quel compilateur est fourni par le projet LLVM ?
          choices: [Clang, GCC, MSVC, javac]
          answer: 0

  # ------------------------------------------------------------------
  - slug: cpp-premier-programme
    title: Premier programme
    summary: La fonction main, les en-têtes, std::cout et std::cin, les flux d’entrée/sortie et les retours à la ligne.
    minutes: 20
    concepts: [affichage, main]
    sections:
      - title: Anatomie
        body: |
          ```cpp
          #include <iostream>   // bibliothèque d’entrées/sorties

          int main() {          // point d’entrée, renvoie un int
              std::cout << "Bonjour !" << std::endl;
              return 0;         // 0 = succès
          }
          ```

          - `#include` importe un **en-tête** de la bibliothèque standard.
          - `std::` désigne l’**espace de noms** standard (`std::cout` = « le cout de std »).
          - `<<` envoie des données dans le flux de sortie.
          - `std::endl` passe à la ligne **et vide le tampon** ; `'\n'` passe à la ligne (plus rapide).
          - Chaque instruction se termine par `;`.
      - title: Lire au clavier
        body: |
          ```cpp
          #include <iostream>
          #include <string>

          int main() {
              int age;
              std::cout << "Ton âge ? ";
              std::cin >> age;                    // lit un entier (s’arrête aux espaces)

              std::string nom;
              std::cin >> nom;                    // lit UN mot
              std::string ligne;
              std::getline(std::cin >> std::ws, ligne); // lit toute la ligne suivante
              std::cout << nom << " a " << age << " ans\n";
          }
          ```

          `using namespace std;` permet d’écrire `cout` au lieu de `std::cout`, mais c’est **déconseillé** dans les gros projets (risque de conflits de noms).
    exercises:
      - id: cpp-pp-predict
        type: predict
        prompt: Que va afficher ce programme ?
        code: |
          #include <iostream>
          int main() {
              std::cout << "A" << "B";
              std::cout << "C\n" << "D" << std::endl;
              std::cout << 1 + 2 << " " << 7 / 2 << '\n';
          }
        output: "ABC\nD\n3 3"
      - id: cpp-pp-q1
        type: mcq
        prompt: Quelle différence entre `std::endl` et `'\n'` ?
        choices: [endl vide aussi le tampon de sortie, Aucune, '\n ne fonctionne pas sur Windows', endl ajoute deux lignes]
        answer: 0
      - id: cpp-pp-fill
        type: fill
        prompt: Complète pour lire un entier puis afficher son double.
        code: |
          #include <iostream>
          int main() {
              int n;
              std::{{?}} >> n;
              std::cout << n * 2 << "\n";
          }
        blanks: [[cin]]
        tests:
          - { input: '21', output: '42' }
      - id: cpp-pp-bug
        type: bugfix
        prompt: Ce programme ne compile pas. Trouve l’erreur.
        code: |
          #include <iostream>
          int main() {
              std::cout << "Ligne 1\n"
              std::cout << "Ligne 2\n";
              return 0;
          }
        bugLines: [3]
        choices:
          - Il manque le point-virgule à la fin de l’instruction
          - '\n est interdit'
          - main doit renvoyer void
        answer: 0
        solution: |
          #include <iostream>
          int main() {
              std::cout << "Ligne 1\n";
              std::cout << "Ligne 2\n";
              return 0;
          }
        tests:
          - { input: '', output: "Ligne 1\nLigne 2" }
      - id: cpp-pp-code
        type: code
        title: Addition
        prompt: |
          Lis deux entiers et affiche `a + b = résultat`.
        starter: |
          #include <iostream>

          int main() {
              long long a, b;
              std::cin >> a >> b;
              return 0;
          }
        solution: |
          #include <iostream>

          int main() {
              long long a, b;
              std::cin >> a >> b;
              std::cout << a << " + " << b << " = " << a + b << "\n";
              return 0;
          }
        tests:
          - { input: '2 3', output: 2 + 3 = 5 }
          - { input: "10\n-4", output: 10 + -4 = 6, hidden: true }
          - { input: 1000000000 2000000000, output: 1000000000 + 2000000000 = 3000000000, hidden: true }
    project:
      id: cpp-pp-projet
      type: code
      title: Ticket de caisse
      difficulty: 1
      prompt: |
        Lis un nom d’article (une ligne, peut contenir des espaces) puis un prix en centimes. Affiche :

        ```
        Article : <nom>
        Prix : <prix> centimes
        Merci de votre visite !
        ```
      starter: |
        #include <iostream>
        #include <string>

        int main() {
            std::string nom;
            std::getline(std::cin, nom);
            int prix;
            std::cin >> prix;
            return 0;
        }
      solution: |
        #include <iostream>
        #include <string>

        int main() {
            std::string nom;
            std::getline(std::cin, nom);
            int prix;
            std::cin >> prix;
            std::cout << "Article : " << nom << "\n";
            std::cout << "Prix : " << prix << " centimes\n";
            std::cout << "Merci de votre visite !\n";
            return 0;
        }
      tests:
        - { input: "Pain au chocolat\n130", output: "Article : Pain au chocolat\nPrix : 130 centimes\nMerci de votre visite !" }
        - { input: "Clé USB\n999", output: "Article : Clé USB\nPrix : 999 centimes\nMerci de votre visite !", hidden: true }
    exam:
      pass: 70
      questions:
        - id: cpp-pp-ex1
          type: mcq
          prompt: Que renvoie `main` par convention en cas de succès ?
          choices: ['0', '1', '-1', 'true']
          answer: 0
        - id: cpp-pp-ex2
          type: mcq
          prompt: Comment lire une ligne entière contenant des espaces ?
          choices: ['std::getline(std::cin, s)', 'std::cin >> s', 'std::read(s)', 'scanf(s)']
          answer: 0
        - id: cpp-pp-ex3
          type: predict
          prompt: Que va afficher ce programme ?
          code: |
            #include <iostream>
            int main() {
                int a = 5, b = 2;
                std::cout << a << b << '\n' << a * b << std::endl;
            }
          output: "52\n10"
        - id: cpp-pp-ex4
          type: mcq
          prompt: Pourquoi éviter `using namespace std;` dans les gros projets ?
          choices: [Risque de conflits de noms, Ralentit le programme, Interdit par la norme, Augmente la mémoire]
          answer: 0

  # ------------------------------------------------------------------
  - slug: cpp-variables
    title: Variables
    summary: Déclaration, initialisation (y compris par accolades), auto, const, constexpr et portée des variables.
    minutes: 25
    concepts: [variables]
    sections:
      - title: Déclarer et initialiser
        body: |
          ```cpp
          int age = 25;          // initialisation par copie
          double taille{1.62};   // initialisation par accolades (recommandée)
          char initiale = 'K';
          bool actif{true};
          std::string nom{"Kiri"};

          int x;                 // ⚠️ NON initialisée : valeur indéterminée !
          int y{};               // initialisée à 0
          ```

          L’initialisation par accolades `{}` **interdit les conversions avec perte** :

          ```cpp
          int a = 3.7;   // compile (a vaut 3) — avertissement
          int b{3.7};    // ❌ erreur : narrowing conversion
          ```

          Contrairement à Rust, les variables C++ sont **modifiables par défaut**.
      - title: auto, const et constexpr
        body: |
          ```cpp
          auto n = 42;            // int (type déduit)
          auto pi = 3.14159;      // double
          const int MAX = 100;    // non modifiable
          constexpr int CARRE = 12 * 12;   // calculé À LA COMPILATION
          ```

          - `const` : la valeur ne peut plus changer après l’initialisation.
          - `constexpr` : la valeur doit être connue à la compilation (plus fort que `const`).

          **Portée** : une variable vit jusqu’à la fin du bloc `{ }` où elle est déclarée. Une variable déclarée dans un bloc intérieur peut **masquer** une variable extérieure du même nom (à éviter, `-Wshadow` le signale).
    exercises:
      - id: cpp-var-q1
        type: mcq
        prompt: Quelle est la valeur de `int x;` déclarée dans une fonction sans initialisation ?
        choices: ['0', Indéterminée (la lire est un comportement indéfini), '-1', 'null']
        answer: 1
      - id: cpp-var-q2
        type: mcq
        prompt: Que se passe-t-il avec `int b{3.7};` ?
        choices: [b vaut 3, b vaut 4, Erreur de compilation (conversion avec perte), b vaut 3.7]
        answer: 2
      - id: cpp-var-predict
        type: predict
        prompt: Que va afficher ce programme ?
        code: |
          #include <iostream>
          int main() {
              int a = 5;
              {
                  int a = 10;
                  a += 1;
                  std::cout << a << " ";
              }
              a *= 2;
              auto b = a / 4;
              std::cout << a << " " << b << "\n";
          }
        output: 11 10 2
      - id: cpp-var-bug
        type: bugfix
        prompt: Ce programme ne compile pas. Trouve l’erreur.
        code: |
          #include <iostream>
          int main() {
              const int vies = 3;
              vies = vies - 1;
              std::cout << vies << "\n";
          }
        bugLines: [3, 4]
        choices:
          - vies est const, on ne peut pas la modifier
          - const doit s’écrire CONST
          - On ne peut pas soustraire 1
        answer: 0
        solution: |
          #include <iostream>
          int main() {
              int vies = 3;
              vies = vies - 1;
              std::cout << vies << "\n";
          }
        tests:
          - { input: '', output: '2' }
      - id: cpp-var-code
        type: code
        title: Échange de valeurs
        prompt: |
          Lis deux entiers `a` et `b`, échange leurs valeurs à l’aide d’une variable temporaire, puis affiche `a b`.
        starter: |
          #include <iostream>

          int main() {
              int a, b;
              std::cin >> a >> b;
              // échange
              std::cout << a << " " << b << "\n";
          }
        solution: |
          #include <iostream>

          int main() {
              int a, b;
              std::cin >> a >> b;
              int tmp = a;
              a = b;
              b = tmp;
              std::cout << a << " " << b << "\n";
          }
        tests:
          - { input: '3 8', output: '8 3' }
          - { input: '-1 0', output: '0 -1', hidden: true }
        forbid:
          - { pattern: 'swap', message: Ne pas utiliser std::swap ici }
    project:
      id: cpp-var-projet
      type: code
      title: Convertisseur de durée
      difficulty: 2
      prompt: |
        Lis un nombre de secondes. Avec des constantes `constexpr` `SECONDES_PAR_MINUTE` et `SECONDES_PAR_HEURE`, affiche la durée au format `H h M min S s`.
      starter: |
        #include <iostream>

        int main() {
            long long total;
            std::cin >> total;
            return 0;
        }
      solution: |
        #include <iostream>

        constexpr long long SECONDES_PAR_MINUTE = 60;
        constexpr long long SECONDES_PAR_HEURE = 60 * SECONDES_PAR_MINUTE;

        int main() {
            long long total;
            std::cin >> total;
            long long h = total / SECONDES_PAR_HEURE;
            long long m = (total % SECONDES_PAR_HEURE) / SECONDES_PAR_MINUTE;
            long long s = total % SECONDES_PAR_MINUTE;
            std::cout << h << " h " << m << " min " << s << " s\n";
            return 0;
        }
      tests:
        - { input: '3725', output: 1 h 2 min 5 s }
        - { input: '59', output: 0 h 0 min 59 s, hidden: true }
        - { input: '90061', output: 25 h 1 min 1 s, hidden: true }
      require:
        - { pattern: 'constexpr', message: Utiliser constexpr pour les constantes }
    exam:
      pass: 70
      questions:
        - id: cpp-var-ex1
          type: mcq
          prompt: Quelle est la différence entre const et constexpr ?
          choices: [constexpr exige une valeur connue à la compilation, Aucune, const est plus rapide, constexpr permet la modification]
          answer: 0
        - id: cpp-var-ex2
          type: mcq
          prompt: Quel type déduit `auto x = 2.5;` ?
          choices: [float, double, int, auto]
          answer: 1
        - id: cpp-var-ex3
          type: predict
          prompt: Que va afficher ce programme ?
          code: |
            #include <iostream>
            int main() {
                int x{};
                int y = 7;
                x += y++;
                std::cout << x << " " << y << "\n";
            }
          output: 7 8
          explanation: '`y++` renvoie l’ancienne valeur (7) puis incrémente y.'
        - id: cpp-var-ex4
          type: mcq
          prompt: Par défaut, une variable C++ est…
          choices: [modifiable, constante, globale, initialisée à zéro]
          answer: 0

  # ------------------------------------------------------------------
  - slug: cpp-types
    title: Types
    summary: Types fondamentaux, tailles, entiers signés/non signés, flottants, char, bool, conversions et static_cast.
    minutes: 25
    concepts: [types]
    sections:
      - title: Les types fondamentaux
        body: |
          | Type | Taille typique | Exemple |
          |---|---|---|
          | `bool` | 1 octet | `true` |
          | `char` | 1 octet | `'a'` |
          | `int` | 4 octets | `42` |
          | `long long` | 8 octets | `9'000'000'000LL` |
          | `float` | 4 octets | `3.14f` |
          | `double` | 8 octets | `3.14` |

          Les tailles exactes dépendent de la plateforme ; `<cstdint>` fournit des types de taille fixe : `int32_t`, `uint8_t`, `int64_t`…

          `sizeof(T)` donne la taille en octets. Les apostrophes `1'000'000` séparent les chiffres (C++14).
      - title: Pièges et conversions
        body: |
          - **Division entière** : `7 / 2 == 3`, mais `7.0 / 2 == 3.5`.
          - **Dépassement** d’un entier signé : comportement indéfini ; d’un non signé : retour à 0 (modulo).
          - Mélanger signé et non signé : `-1 < 0u` est **faux** (le -1 est converti en très grand nombre) !
          - Les flottants sont approximatifs : `0.1 + 0.2 != 0.3`.

          Conversion explicite recommandée :

          ```cpp
          int total = 31, n = 4;
          double moyenne = static_cast<double>(total) / n;   // 7.75
          int tronque = static_cast<int>(9.99);             // 9
          ```

          Les casts « à la C » `(double)total` existent mais sont déconseillés (moins visibles, moins sûrs).
