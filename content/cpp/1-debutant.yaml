  - slug: cpp-boucles
    title: Boucles
    summary: for classique, while, do…while, boucle sur intervalle (range-based for), break, continue et pièges des indices.
    minutes: 25
    concepts: [boucles]
    sections:
      - title: Les boucles
        body: |
          ```cpp
          for (int i = 0; i < 5; ++i) { std::cout << i << ' '; }   // 0 1 2 3 4

          int n = 3;
          while (n > 0) { std::cout << n-- << "… "; }               // 3… 2… 1…

          int choix;
          do {
              std::cin >> choix;
          } while (choix < 1 || choix > 3);   // exécutée au moins une fois

          std::vector<int> notes{12, 17, 9};
          for (int x : notes) { std::cout << x << ' '; }          // boucle sur intervalle
          for (const auto& x : notes) { /* sans copie */ }
          ```

          `break` sort de la boucle, `continue` passe au tour suivant.
      - title: Pièges
        body: |
          - Erreur « un de trop » (*off-by-one*) : `for (int i = 0; i <= n; ++i)` fait n+1 tours.
          - Comparer un `int` avec `v.size()` (non signé) : avertissement `-Wsign-compare` ; utilise `std::size_t` ou la boucle sur intervalle.
          - Boucle infinie : la variable de contrôle ne change jamais.
          - Modifier un conteneur pendant qu’on le parcourt (ajout/suppression) : comportement indéfini.
    exercises:
      - id: cpp-loop-predict
        type: predict
        prompt: Que va afficher ce programme ?
        code: |
          #include <iostream>
          int main() {
              int s = 0;
              for (int i = 1; i <= 10; ++i) {
                  if (i % 2 == 0) continue;
                  if (i > 7) break;
                  s += i;
              }
              std::cout << s << "\n";
          }
        output: '16'
        explanation: 1 + 3 + 5 + 7 = 16.
      - id: cpp-loop-q1
        type: mcq
        prompt: Quelle boucle s’exécute au moins une fois ?
        choices: [do … while, while, for, for sur intervalle]
        answer: 0
