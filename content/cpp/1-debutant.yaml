  - slug: cpp-chaines
    title: Chaînes de caractères
    summary: std::string, concaténation, sous-chaînes, recherche, conversion nombre ↔ texte, caractères et std::string_view.
    minutes: 30
    concepts: [chaines]
    sections:
      - title: std::string
        body: |
          ```cpp
          #include <string>

          std::string s = "Bonjour";
          s += " Kiri";                          // concaténation
          std::cout << s.size() << "\n";         // nombre d’octets
          std::cout << s[0] << s.back() << "\n"; // 'B' 'i'
          std::string mot = s.substr(0, 7);      // "Bonjour"
          auto pos = s.find("Kiri");             // 8 (std::string::npos si absent)
          s.replace(0, 7, "Salut");              // "Salut Kiri"
          bool vide = s.empty();
          ```

          Conversions : `std::to_string(42)`, `std::stoi("42")`, `std::stod("3.14")`. Comparaison : `==`, `<` (ordre lexicographique).

          ⚠️ `std::string` stocke des **octets** : « é » en UTF-8 occupe 2 octets.
      - title: Caractères et string_view
        body: |
          ```cpp
          #include <cctype>
          char c = 'a';
          std::toupper(c);         // 'A' (renvoie un int, à convertir en char)
          std::isdigit('7');       // vrai
          std::isalpha('x');       // vrai

          for (char& ch : s) ch = static_cast<char>(std::toupper(static_cast<unsigned char>(ch)));
          ```

          `std::string_view` (C++17) : une **vue** non possédante sur une chaîne — idéale pour les paramètres en lecture seule (comme `&str` en Rust) :

          ```cpp
          bool commencePar(std::string_view s, std::string_view p) { return s.starts_with(p); } // C++20
          ```

          ⚠️ Une `string_view` ne doit pas survivre à la chaîne qu’elle regarde.
