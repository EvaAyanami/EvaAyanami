  # ------------------------------------------------------------------
  - slug: cpp-operateurs
    title: Opérateurs
    summary: Arithmétique, incrémentation pré/post, comparaisons, logique, affectations composées, opérateur ternaire et priorités.
    minutes: 20
    concepts: [operateurs]
    sections:
      - title: Les opérateurs
        body: |
          | Catégorie | Opérateurs |
          |---|---|
          | Arithmétiques | `+ - * / %` |
          | Incrémentation | `++x`, `x++`, `--x`, `x--` |
          | Comparaison | `== != < <= > >=`, `<=>` (C++20) |
          | Logiques | `&&`, `\|\|`, `!` |
          | Affectation | `= += -= *= /= %=` |
          | Ternaire | `condition ? a : b` |
          | Bit à bit | `& \| ^ ~ << >>` |

          **Pré vs post-incrémentation** :

          ```cpp
          int a = 5;
          int b = a++;   // b = 5, puis a = 6
          int c = ++a;   // a = 7, puis c = 7
          ```
      - title: Pièges
        body: |
          - `=` (affectation) au lieu de `==` (comparaison) : `if (x = 0)` compile mais affecte 0 ! (`-Wall` avertit).
          - Modifier une variable deux fois dans la même expression (`i = i++ + 1`) : comportement indéfini ou non spécifié.
          - `&&` et `||` sont **paresseux** : `p != nullptr && p->valeur > 0` est sûr.
          - En cas de doute sur les priorités, ajoute des parenthèses.

          ```cpp
          int note = 14;
          std::string mention = note >= 16 ? "très bien" : note >= 12 ? "bien" : "passable";
          ```
    exercises:
      - id: cpp-op-predict
        type: predict
        prompt: Que va afficher ce programme ?
        code: |
          #include <iostream>
          int main() {
              int a = 5;
              int b = a++;
              int c = ++a;
              std::cout << a << " " << b << " " << c << " " << (a > 6 && b < 6) << "\n";
          }
        output: 7 5 7 1
        explanation: '`true` s’affiche `1` avec cout (sauf avec `std::boolalpha`).'
