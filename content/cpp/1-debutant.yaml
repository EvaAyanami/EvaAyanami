      - id: cpp-fn-bug
        type: bugfix
        prompt: Ce programme ne compile pas. Trouve la cause.
        code: |
          #include <iostream>
          int main() {
              std::cout << triple(4) << "\n";
          }
          int triple(int x) {
              return 3 * x;
          }
        bugLines: [3]
        choices:
          - triple est utilisée avant d’être déclarée
          - On ne peut pas multiplier par 3
          - main doit être définie en dernier
        answer: 0
        solution: |
          #include <iostream>
          int triple(int x);
          int main() {
              std::cout << triple(4) << "\n";
          }
          int triple(int x) {
              return 3 * x;
          }
        tests:
          - { input: '', output: '12' }
      - id: cpp-fn-code
        type: code
        title: Nombres premiers
        prompt: |
          Écris `bool estPremier(long long n)`. Pour chaque nombre lu, affiche `premier` ou `pas premier`.
        starter: |
          #include <iostream>

          int main() {
              long long n;
              while (std::cin >> n) {
                  std::cout << (estPremier(n) ? "premier" : "pas premier") << "\n";
              }
          }
        solution: |
          #include <iostream>

          bool estPremier(long long n) {
              if (n < 2) return false;
              for (long long d = 2; d * d <= n; ++d) {
                  if (n % d == 0) return false;
              }
              return true;
          }

          int main() {
              long long n;
              while (std::cin >> n) {
                  std::cout << (estPremier(n) ? "premier" : "pas premier") << "\n";
              }
          }
        tests:
          - { input: "7\n8", output: "premier\npas premier" }
          - { input: "0 1 2 97 91 1000003", output: "pas premier\npas premier\npremier\npremier\npas premier\npremier", hidden: true }
        concepts: [fonctions]
    project:
      id: cpp-fn-projet
      type: code
      title: Convertisseur de températures
      difficulty: 2
      prompt: |
        Écris `double celsiusVersFahrenheit(double c)` et `double fahrenheitVersCelsius(double f)`. Chaque ligne contient `valeur unité` (`C` ou `F`). Affiche `100.0 C = 212.0 F` (une décimale).
      starter: |
        #include <iostream>
        #include <iomanip>

        int main() {
            double v;
            char u;
            std::cout << std::fixed << std::setprecision(1);
            while (std::cin >> v >> u) {
            }
        }
      solution: |
        #include <iostream>
        #include <iomanip>

        double celsiusVersFahrenheit(double c) { return c * 9 / 5 + 32; }
        double fahrenheitVersCelsius(double f) { return (f - 32) * 5 / 9; }

        int main() {
            double v;
            char u;
            std::cout << std::fixed << std::setprecision(1);
            while (std::cin >> v >> u) {
                if (u == 'C') std::cout << v << " C = " << celsiusVersFahrenheit(v) << " F\n";
                else std::cout << v << " F = " << fahrenheitVersCelsius(v) << " C\n";
            }
        }
      tests:
        - { input: "100 C\n212 F", output: "100.0 C = 212.0 F\n212.0 F = 100.0 C" }
        - { input: "-40 C\n0 F", output: "-40.0 C = -40.0 F\n0.0 F = -17.8 C", hidden: true }
      require:
        - { pattern: 'celsiusVersFahrenheit\s*\(', message: Définir celsiusVersFahrenheit }
