    project:
      id: cpp-cond-projet
      type: code
      title: Calculatrice à opérateur
      difficulty: 2
      prompt: |
        Chaque ligne contient `a op b` (op parmi `+ - * / %`). Utilise un `switch` sur `op` et affiche le résultat, `erreur : division par zéro` ou `erreur : opérateur inconnu`.
      starter: |
        #include <iostream>

        int main() {
            long long a, b;
            char op;
            while (std::cin >> a >> op >> b) {
            }
        }
      solution: |
        #include <iostream>

        int main() {
            long long a, b;
            char op;
            while (std::cin >> a >> op >> b) {
                switch (op) {
                    case '+': std::cout << a + b << "\n"; break;
                    case '-': std::cout << a - b << "\n"; break;
                    case '*': std::cout << a * b << "\n"; break;
                    case '/':
                    case '%':
                        if (b == 0) std::cout << "erreur : division par zéro\n";
                        else std::cout << (op == '/' ? a / b : a % b) << "\n";
                        break;
                    default: std::cout << "erreur : opérateur inconnu\n";
                }
            }
        }
      tests:
        - { input: "6 * 7\n10 / 0\n9 % 4", output: "42\nerreur : division par zéro\n1" }
        - { input: "1 ^ 2\n-5 + 3", output: "erreur : opérateur inconnu\n-2", hidden: true }
