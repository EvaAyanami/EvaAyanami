      type: code
      title: Bulletin de notes
      difficulty: 2
      prompt: |
        Lis `n` puis `n` notes (entiers 0–20). Affiche :

        ```
        Moyenne : X.XX
        Min : …
        Max : …
        Au-dessus de la moyenne : K
        Notes triées : a b c …
        ```
      starter: |
        #include <iostream>
        #include <vector>
        #include <algorithm>
        #include <numeric>
        #include <iomanip>

