  - slug: cpp-conditions
    title: Conditions
    summary: if / else if / else, switch avec break et fallthrough, if avec initialisation (C++17) et comparaisons de chaînes.
    minutes: 25
    concepts: [conditions]
    sections:
      - title: if et else
        body: |
          ```cpp
          int t = 22;
          if (t > 30) {
              std::cout << "chaud\n";
          } else if (t > 15) {
              std::cout << "bon\n";
          } else {
              std::cout << "frais\n";
          }
          ```

          - Les parenthèses autour de la condition sont **obligatoires**.
          - Toute valeur non nulle est « vraie » (`if (n)` ⇔ `if (n != 0)`) — pratique mais source de confusion.
          - C++17 : **if avec initialisation** : `if (auto r = calculer(); r > 0) { … }` — `r` n’existe que dans le if.
      - title: switch
        body: |
          ```cpp
          char op = '+';
          switch (op) {
              case '+': std::cout << "addition\n"; break;
              case '-': std::cout << "soustraction\n"; break;
              case '*':
              case 'x': std::cout << "multiplication\n"; break;   // deux cas
              default:  std::cout << "inconnu\n";
          }
          ```

          ⚠️ Sans `break`, l’exécution **continue** dans le cas suivant (*fallthrough*). `switch` ne fonctionne qu’avec des entiers, `char` et énumérations — pas avec `std::string`.
    exercises:
      - id: cpp-cond-predict
        type: predict
        prompt: Que va afficher ce programme ?
        code: |
          #include <iostream>
          int main() {
              int n = 2;
              switch (n) {
                  case 1: std::cout << "un ";
                  case 2: std::cout << "deux ";
                  case 3: std::cout << "trois ";
                      break;
                  default: std::cout << "autre ";
              }
              std::cout << "\n";
          }
        output: deux trois
        explanation: Sans `break` après `case 2`, l’exécution continue dans `case 3`.
