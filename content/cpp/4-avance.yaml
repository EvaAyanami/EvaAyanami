      - id: cpp-thr-code
        type: code
        title: Travail partagé
        prompt: |
          Lis `n` et `t`. Lance `t` threads (`std::jthread`) : le thread `i` calcule la somme des carrés des entiers `k` de 1 à n tels que `k % t == i` et l’écrit dans `resultats[i]`. Après la fin des threads (fin de portée), affiche chaque résultat puis le total.
        starter: |
          #include <iostream>
          #include <thread>
          #include <vector>

          int main() {
              long long n;
              int t;
              std::cin >> n >> t;
              std::vector<long long> resultats(t);
          }
        solution: |
          #include <iostream>
          #include <thread>
          #include <vector>

          int main() {
              long long n;
              int t;
              std::cin >> n >> t;
              std::vector<long long> resultats(t);
              {
                  std::vector<std::jthread> ts;
                  for (int i = 0; i < t; ++i) {
                      ts.emplace_back([i, n, t, &resultats] {
                          long long s = 0;
                          for (long long k = 1; k <= n; ++k) if (k % t == i) s += k * k;
                          resultats[i] = s;
                      });
                  }
              }
              long long total = 0;
              for (int i = 0; i < t; ++i) { std::cout << resultats[i] << "\n"; total += resultats[i]; }
              std::cout << total << "\n";
          }
        tests:
          - { input: 4 2, output: "20\n10\n30" }
          - { input: 3 1, output: "14\n14", hidden: true }
        require:
          - { pattern: 'jthread', message: Utiliser std::jthread }
    project:
      id: cpp-thr-projet
      type: code
      title: Arrêt coopératif
      difficulty: 3
      prompt: |
        Lance un `std::jthread` « travailleur » qui, tant que l’arrêt n’est pas demandé (`stop_token`), retire des tâches d’une file protégée par un mutex et les traite (une tâche = un entier ; le traitement ajoute sa valeur à un total). Le thread principal pousse toutes les tâches lues dans la file, attend que la file soit vide (attente active courte avec `std::this_thread::yield()`), puis demande l’arrêt et attend la fin du thread.

        Affiche `traitées : N` puis `total : S`.
      starter: |
        #include <iostream>
        #include <mutex>
        #include <queue>
        #include <thread>

        int main() {
        }
      solution: |
        #include <iostream>
        #include <mutex>
        #include <queue>
        #include <thread>

        int main() {
            std::queue<long long> file;
            std::mutex m;
            long long total = 0;
            int traitees = 0;
            int enCours = 0;
            {
                std::jthread travailleur([&](std::stop_token st) {
                    while (!st.stop_requested()) {
                        long long x = 0;
                        bool a = false;
                        {
                            std::lock_guard<std::mutex> g(m);
                            if (!file.empty()) { x = file.front(); file.pop(); a = true; ++enCours; }
                        }
                        if (a) {
                            std::lock_guard<std::mutex> g(m);
                            total += x;
                            ++traitees;
                            --enCours;
                        } else {
                            std::this_thread::yield();
                        }
                    }
                });
                long long v;
                while (std::cin >> v) {
                    std::lock_guard<std::mutex> g(m);
                    file.push(v);
                }
                while (true) {
                    {
                        std::lock_guard<std::mutex> g(m);
                        if (file.empty() && enCours == 0) break;
                    }
                    std::this_thread::yield();
                }
                travailleur.request_stop();
            }
            std::cout << "traitées : " << traitees << "\n" << "total : " << total << "\n";
        }
      tests:
        - { input: 1 2 3 4, output: "traitées : 4\ntotal : 10" }
        - { input: '', output: "traitées : 0\ntotal : 0", hidden: true }
      require:
