      - id: cpp-conc-code
        type: code
        title: Somme parallèle avec async
        prompt: |
          Lis `n` puis `n` entiers. Découpe le vecteur en **4** morceaux et calcule la somme de chacun avec `std::async(std::launch::async, …)`, puis additionne les 4 `future`. Affiche la somme totale.
        starter: |
          #include <iostream>
          #include <future>
          #include <numeric>
          #include <vector>

          int main() {
              std::size_t n;
              std::cin >> n;
              std::vector<long long> v(n);
              for (auto& x : v) std::cin >> x;
