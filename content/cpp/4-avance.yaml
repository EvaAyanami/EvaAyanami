  # ------------------------------------------------------------------
  - slug: cpp-concurrence
    title: Concurrence
    summary: Problèmes de la concurrence — data races, comportement indéfini, std::atomic, modèle mémoire, async et futures.
    minutes: 30
    concepts: [concurrence]
    sections:
      - title: Data races et atomiques
        body: |
          Deux threads qui accèdent à la même variable, dont au moins un en écriture, sans synchronisation = **data race** = **comportement indéfini** en C++ (aucune vérification à la compilation, contrairement à Rust).

          ```cpp
          int compteur = 0;                     // ❌ ++compteur depuis 2 threads : UB
          std::atomic<int> compteurSur{0};      // ✅ opérations indivisibles
          compteurSur.fetch_add(1);             // ou ++compteurSur
          ```

          `std::atomic<T>` garantit des opérations indivisibles (`load`, `store`, `fetch_add`, `exchange`, `compare_exchange_strong`) sans mutex, pour les types simples.

          Le **modèle mémoire** (`std::memory_order_relaxed`, `acquire`, `release`, `seq_cst` par défaut) contrôle les garanties d’ordre — `seq_cst` est le plus simple et le plus sûr.
      - title: async et future
        body: |
          ```cpp
          #include <future>
          std::future<long long> f = std::async(std::launch::async, [] { return calculLong(); });
          // … autre travail …
          long long r = f.get();          // attend le résultat (relance l’exception éventuelle)

          std::promise<int> p;
          std::future<int> fut = p.get_future();
          std::thread t([&p] { p.set_value(42); });
          std::cout << fut.get();
          t.join();
          ```

          Outils de détection : **ThreadSanitizer** (`-fsanitize=thread`) détecte les data races à l’exécution.
    exercises:
      - id: cpp-conc-q1
        type: mcq
        prompt: Qu’est-ce qu’une data race en C++ ?
        choices: ['Des accès concurrents non synchronisés dont au moins une écriture : comportement indéfini', 'Une course entre deux programmes', 'Une erreur de compilation', 'Un deadlock']
        answer: 0
        concepts: [concurrence]
