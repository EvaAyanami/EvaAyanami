    project:
      id: cpp-gen-projet
      type: code
      title: Tuple d’accumulateurs
      difficulty: 3
      prompt: |
        Écris trois accumulateurs (`Somme`, `Max`, `Compte`) qui ont chacun `void ajouter(long long)`, `long long valeur() const` et `static constexpr const char* nom`. Puis `template <typename... Acc> class Statistiques` qui stocke un `std::tuple<Acc...>`, avec `ajouter(x)` qui appelle `ajouter` sur **tous** les accumulateurs (`std::apply` + fold) et `rapport()` qui affiche `nom=valeur` séparés par des espaces.

        Instancie `Statistiques<Somme, Max, Compte>`, ajoute tous les entiers lus et affiche le rapport. `Max` d’un ensemble vide vaut 0.
      starter: |
        #include <iostream>
        #include <tuple>
        #include <algorithm>
        #include <climits>

        int main() {
        }
      solution: |
        #include <iostream>
        #include <tuple>
        #include <algorithm>
        #include <climits>

        struct Somme {
            static constexpr const char* nom = "somme";
            long long s = 0;
            void ajouter(long long x) { s += x; }
            long long valeur() const { return s; }
        };
        struct Max {
            static constexpr const char* nom = "max";
            long long m = LLONG_MIN;
            void ajouter(long long x) { m = std::max(m, x); }
            long long valeur() const { return m == LLONG_MIN ? 0 : m; }
        };
        struct Compte {
            static constexpr const char* nom = "compte";
            long long n = 0;
            void ajouter(long long) { ++n; }
            long long valeur() const { return n; }
        };

        template <typename... Acc>
        class Statistiques {
        public:
            void ajouter(long long x) {
                std::apply([x](auto&... a) { (a.ajouter(x), ...); }, accs_);
            }
            void rapport() const {
                bool premier = true;
                std::apply([&](const auto&... a) {
                    ((std::cout << (premier ? "" : " ") << a.nom << "=" << a.valeur(), premier = false), ...);
                }, accs_);
                std::cout << "\n";
            }
        private:
            std::tuple<Acc...> accs_;
        };

        int main() {
            Statistiques<Somme, Max, Compte> st;
            long long x;
            while (std::cin >> x) st.ajouter(x);
            st.rapport();
        }
      tests:
        - { input: 4 -2 9 1, output: somme=12 max=9 compte=4 }
        - { input: '', output: somme=0 max=0 compte=0, hidden: true }
      require:
        - { pattern: 'std::apply', message: Utiliser std::apply }
