        solution: |
          #include <iostream>
          #include <array>

          constexpr std::array<bool, 10001> crible() {
              std::array<bool, 10001> p{};
              for (auto& x : p) x = true;
              p[0] = p[1] = false;
              for (int i = 2; i * i <= 10000; ++i)
                  if (p[i])
                      for (int j = i * i; j <= 10000; j += i) p[j] = false;
              return p;
          }

          constexpr auto PREMIERS = crible();
          static_assert(PREMIERS[9973]);

          int main() {
              int n;
              while (std::cin >> n) std::cout << (PREMIERS[n] ? "premier" : "composé") << "\n";
          }
