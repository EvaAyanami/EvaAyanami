language: cpp
level: 4
chapters:
  # ------------------------------------------------------------------
  - slug: cpp-move
    title: Move semantics
    summary: Déplacer au lieu de copier — std::move, constructeur et affectation par déplacement, règle de cinq et état « déplacé ».
    minutes: 35
    concepts: [move, memoire]
    sections:
      - title: Copier coûte cher
        body: |
          Copier un `std::vector` d’un million d’éléments copie… un million d’éléments. Or souvent, l’objet source n’est plus utilisé ensuite (valeur temporaire, variable qu’on abandonne). C++11 permet alors de **déplacer** : on « vole » ses ressources internes (le pointeur vers le tas) en O(1).

          ```cpp
          std::vector<int> a(1'000'000, 7);
          std::vector<int> b = std::move(a);   // déplacement : b récupère le tampon de a
          // a est maintenant dans un état valide mais non spécifié (ici : vide)
          ```

          `std::move` ne déplace rien par lui-même : c’est un **cast** qui dit « tu peux piller cet objet ». Le déplacement est effectué par le constructeur (ou l’affectation) de déplacement.
      - title: Écrire une classe déplaçable
        body: |
          ```cpp
          class Tampon {
          public:
              explicit Tampon(std::size_t n) : n_(n), d_(new int[n]{}) {}
              ~Tampon() { delete[] d_; }
              Tampon(const Tampon& o) : n_(o.n_), d_(new int[o.n_]) { std::copy(o.d_, o.d_ + n_, d_); }
              Tampon& operator=(Tampon o) noexcept { swap(o); return *this; }      // copie-et-échange
              Tampon(Tampon&& o) noexcept : n_(o.n_), d_(o.d_) { o.n_ = 0; o.d_ = nullptr; }
              void swap(Tampon& o) noexcept { std::swap(n_, o.n_); std::swap(d_, o.d_); }
          private:
              std::size_t n_;
              int* d_;
          };
          ```

          **Règle de cinq** : si tu écris l’un parmi destructeur, copie (constructeur/affectation) ou déplacement (constructeur/affectation), pense aux cinq. Mieux : la **règle de zéro** (membres RAII, rien à écrire).

          Marque le déplacement `noexcept` : `std::vector` ne l’utilisera lors d’une réallocation que s’il est garanti sans exception.
    exercises:
      - id: cpp-move-predict
        type: predict
        prompt: Que va afficher ce programme ?
        code: |
          #include <iostream>
          #include <string>
          #include <vector>
          #include <utility>
          int main() {
              std::string a = "kiri";
              std::string b = std::move(a);
              std::vector<std::string> v;
              v.push_back(std::move(b));
              std::cout << b.size() << " " << v[0] << " " << v.size() << "\n";
          }
        output: 0 kiri 1
        explanation: Une std::string déplacée est laissée vide en pratique (état valide mais non spécifié par la norme).
      - id: cpp-move-q1
        type: mcq
        prompt: Que fait std::move ?
        choices: ['Un cast qui autorise le déplacement (il ne déplace rien lui-même)', 'Il copie l’objet', 'Il libère l’objet', 'Il déplace l’objet en mémoire']
        answer: 0
      - id: cpp-move-q2
        type: mcq
        prompt: Pourquoi marquer le constructeur de déplacement noexcept ?
        choices: ['std::vector ne l’utilise lors des réallocations que s’il est noexcept', 'C’est obligatoire', 'Pour qu’il soit plus court', 'Pour la copie']
        answer: 0
      - id: cpp-move-code
        type: code
        title: Compter copies et déplacements
        prompt: |
          Écris une classe `Trace` avec un constructeur par défaut, un constructeur de copie et un constructeur de déplacement qui incrémentent des compteurs **statiques** `copies` et `deplacements`.

          Pour chaque ligne `n`, crée un `std::vector<Trace>` après `reserve(n)`, puis ajoute `n` éléments avec `push_back(Trace())` ; enfin copie le vecteur (`auto w = v;`). Affiche `copies=C deplacements=D` (compteurs remis à zéro à chaque ligne).
        starter: |
          #include <iostream>
          #include <vector>

          int main() {
              int n;
              while (std::cin >> n) {
              }
          }
        solution: |
          #include <iostream>
          #include <vector>

          struct Trace {
              static inline int copies = 0;
              static inline int deplacements = 0;
              Trace() = default;
              Trace(const Trace&) { ++copies; }
              Trace(Trace&&) noexcept { ++deplacements; }
          };

          int main() {
              int n;
              while (std::cin >> n) {
                  Trace::copies = Trace::deplacements = 0;
                  std::vector<Trace> v;
                  v.reserve(n);
                  for (int i = 0; i < n; ++i) v.push_back(Trace());
                  auto w = v;
                  std::cout << "copies=" << Trace::copies << " deplacements=" << Trace::deplacements << "\n";
              }
          }
        tests:
          - { input: '3', output: copies=3 deplacements=3 }
          - { input: "0\n5", output: "copies=0 deplacements=0\ncopies=5 deplacements=5", hidden: true }
    project:
      id: cpp-move-projet
      type: code
      title: Tampon déplaçable
      difficulty: 3
      prompt: |
        Implémente `class Tampon` (taille + `int*` alloué avec `new[]`) avec la **règle de cinq** : destructeur, copie (profonde), affectation (copie-et-échange), déplacement `noexcept`. Ajoute `int& operator[](std::size_t)`, `std::size_t taille() const`.

        Entrée : `n` puis `n` entiers. Remplis un `Tampon a`, crée `b` par **copie** puis multiplie chaque case de `b` par 2, crée `c` par **déplacement** de `a`. Affiche `a.taille()`, le contenu de `b` puis celui de `c`.
      starter: |
        #include <iostream>
        #include <utility>
        #include <algorithm>

        int main() {
            std::size_t n;
            std::cin >> n;
        }
      solution: |
        #include <iostream>
        #include <utility>
        #include <algorithm>

        class Tampon {
        public:
            explicit Tampon(std::size_t n) : n_(n), d_(new int[n]{}) {}
            ~Tampon() { delete[] d_; }
            Tampon(const Tampon& o) : n_(o.n_), d_(new int[o.n_]) { std::copy(o.d_, o.d_ + n_, d_); }
            Tampon(Tampon&& o) noexcept : n_(o.n_), d_(o.d_) { o.n_ = 0; o.d_ = nullptr; }
            Tampon& operator=(Tampon o) noexcept { swap(o); return *this; }
            void swap(Tampon& o) noexcept { std::swap(n_, o.n_); std::swap(d_, o.d_); }
            int& operator[](std::size_t i) { return d_[i]; }
            std::size_t taille() const { return n_; }
        private:
            std::size_t n_;
            int* d_;
        };

        void afficher(Tampon& t) {
            for (std::size_t i = 0; i < t.taille(); ++i) std::cout << (i ? " " : "") << t[i];
            std::cout << "\n";
        }

        int main() {
            std::size_t n;
            std::cin >> n;
            Tampon a(n);
            for (std::size_t i = 0; i < n; ++i) std::cin >> a[i];
            Tampon b = a;
            for (std::size_t i = 0; i < b.taille(); ++i) b[i] *= 2;
            Tampon c = std::move(a);
            std::cout << a.taille() << "\n";
            afficher(b);
            afficher(c);
        }
      tests:
        - { input: "3\n1 2 3", output: "0\n2 4 6\n1 2 3" }
        - { input: "1\n-5", output: "0\n-10\n-5", hidden: true }
      require:
        - { pattern: 'Tampon\s*\(\s*Tampon\s*&&', message: 'Écrire le constructeur de déplacement' }
        - { pattern: 'noexcept', message: 'Marquer le déplacement noexcept' }
    exam:
      pass: 70
      questions:
        - id: cpp-move-ex1
          type: mcq
          prompt: Dans quel état est un objet après avoir été déplacé ?
          choices: ['Valide mais non spécifié (on peut le détruire ou lui réaffecter une valeur)', 'Détruit', 'Inchangé', 'Indéfini : on ne peut plus rien en faire']
          answer: 0
        - id: cpp-move-ex2
          type: mcq
          prompt: Que dit la règle de cinq ?
          choices: ['Destructeur, copie et déplacement (constructeurs et affectations) vont ensemble', 'Cinq constructeurs maximum', 'Cinq membres par classe', 'Cinq niveaux d’héritage']
          answer: 0
        - id: cpp-move-ex3
          type: mcq
          prompt: Quel est le coût typique du déplacement d’un std::vector ?
          choices: ['O(1) : on transfère le pointeur interne', 'O(n)', 'O(n log n)', 'Il est impossible']
          answer: 0

  # ------------------------------------------------------------------
  - slug: cpp-rvalue
    title: Rvalue references
    summary: lvalues et rvalues, références T&&, références universelles, std::forward et transfert parfait (perfect forwarding).
    minutes: 30
    concepts: [move, generiques]
    sections:
      - title: lvalue, rvalue
        body: |
          - **lvalue** : a un nom / une adresse durable (`x`, `v[0]`, `*p`).
          - **rvalue** : valeur temporaire sans nom (`42`, `a + b`, `std::string("x")`, résultat de `std::move(x)`).

          ```cpp
          void f(int& x)       { std::cout << "lvalue\n"; }
          void f(int&& x)      { std::cout << "rvalue\n"; }
          void f(const int& x) { }   // accepte les deux (si pas d’autre surcharge)

          int a = 1;
          f(a);            // lvalue
          f(2);            // rvalue
          f(std::move(a)); // rvalue
          ```

          ⚠️ À l’intérieur de `f(int&& x)`, `x` a un nom : c’est une **lvalue** ! Pour la transmettre comme rvalue, il faut `std::move(x)`.
      - title: Références universelles et forward
        body: |
          Dans un template, `T&&` avec `T` **déduit** est une **référence universelle** (*forwarding reference*) : elle accepte lvalues et rvalues.

          ```cpp
          template <typename T>
          void emballer(T&& arg) {
              cible(std::forward<T>(arg));   // conserve la « catégorie » d’origine
          }

          template <typename T, typename... Args>
          std::unique_ptr<T> fabriquer(Args&&... args) {           // comme make_unique
              return std::unique_ptr<T>(new T(std::forward<Args>(args)...));
          }
          ```

          `std::forward<T>` est un cast conditionnel : rvalue si l’argument d’origine était une rvalue, lvalue sinon. C’est le **transfert parfait**.
    exercises:
      - id: cpp-rv-predict
        type: predict
        prompt: Que va afficher ce programme ?
        code: |
          #include <iostream>
          #include <utility>
          void f(int&) { std::cout << "L"; }
          void f(int&&) { std::cout << "R"; }
          template <typename T> void g(T&& x) { f(std::forward<T>(x)); }
          template <typename T> void h(T&& x) { f(x); }
          int main() {
              int a = 1;
              f(a); f(3); g(a); g(3); h(3);
              std::cout << "\n";
          }
        output: LRLRL
        explanation: 'Dans h, x a un nom (lvalue) : sans forward, l’information « rvalue » est perdue.'
      - id: cpp-rv-q1
        type: mcq
        prompt: Dans `void f(std::string&& s)`, quelle est la catégorie de l’expression `s` ?
        choices: ['lvalue (elle a un nom)', 'rvalue', 'prvalue', 'Ni l’une ni l’autre']
        answer: 0
      - id: cpp-rv-q2
        type: mcq
        prompt: Quand T&& est-il une référence universelle ?
        choices: ['Quand T est un paramètre template déduit', 'Toujours', 'Jamais', 'Seulement pour les classes']
        answer: 0
      - id: cpp-rv-code
        type: code
        title: Fabrique avec transfert parfait
        prompt: |
          Écris `template <typename T, typename... Args> std::unique_ptr<T> fabriquer(Args&&... args)` qui construit un `T` en transférant parfaitement ses arguments.

          La classe `Info` (fournie) affiche si son nom a été copié ou déplacé. Pour chaque mot lu, appelle `fabriquer<Info>(mot, 1)` (lvalue) puis `fabriquer<Info>(std::string(mot), 2)` (rvalue).
        starter: |
          #include <iostream>
          #include <memory>
          #include <string>
          #include <utility>

          struct Info {
              Info(const std::string& n, int id) { std::cout << "copie " << n << " #" << id << "\n"; }
              Info(std::string&& n, int id) { std::cout << "déplacement " << n << " #" << id << "\n"; }
          };

          int main() {
              std::string mot;
              while (std::cin >> mot) {
                  auto a = fabriquer<Info>(mot, 1);
                  auto b = fabriquer<Info>(std::string(mot), 2);
              }
          }
        solution: |
          #include <iostream>
          #include <memory>
          #include <string>
          #include <utility>

          struct Info {
              Info(const std::string& n, int id) { std::cout << "copie " << n << " #" << id << "\n"; }
              Info(std::string&& n, int id) { std::cout << "déplacement " << n << " #" << id << "\n"; }
          };

          template <typename T, typename... Args>
          std::unique_ptr<T> fabriquer(Args&&... args) {
              return std::unique_ptr<T>(new T(std::forward<Args>(args)...));
          }

          int main() {
              std::string mot;
              while (std::cin >> mot) {
                  auto a = fabriquer<Info>(mot, 1);
                  auto b = fabriquer<Info>(std::string(mot), 2);
              }
          }
        tests:
          - { input: kiri, output: "copie kiri #1\ndéplacement kiri #2" }
          - { input: a b, output: "copie a #1\ndéplacement a #2\ncopie b #1\ndéplacement b #2", hidden: true }
        require:
          - { pattern: 'std::forward', message: Utiliser std::forward }
    project:
      id: cpp-rv-projet
      type: code
      title: Conteneur avec emplace
      difficulty: 3
      prompt: |
        Écris `template <typename T> class Sac` (basé sur un `std::vector<T>`) avec :

        - `void ajouter(const T&)` qui affiche `ajout par copie` ;
        - `void ajouter(T&&)` qui affiche `ajout par déplacement` ;
        - `template <typename... Args> T& emplacer(Args&&...)` qui construit en place (`emplace_back` + `std::forward`) et affiche `construction en place`.

        Utilise `Sac<std::string>`. Pour chaque ligne `mode mot` (`copie`, `deplacement`, `place`), appelle la méthode correspondante (`place` construit une chaîne de 3 répétitions du mot grâce au constructeur `std::string(count, char)`… non : utilise `emplacer(mot + mot + mot)`). Termine en affichant le contenu séparé par des virgules.
      starter: |
        #include <iostream>
        #include <string>
        #include <utility>
        #include <vector>

        int main() {
        }
      solution: |
        #include <iostream>
        #include <string>
        #include <utility>
        #include <vector>

        template <typename T>
        class Sac {
        public:
            void ajouter(const T& x) { std::cout << "ajout par copie\n"; d_.push_back(x); }
            void ajouter(T&& x) { std::cout << "ajout par déplacement\n"; d_.push_back(std::move(x)); }
            template <typename... Args>
            T& emplacer(Args&&... args) {
                std::cout << "construction en place\n";
                return d_.emplace_back(std::forward<Args>(args)...);
            }
            const std::vector<T>& contenu() const { return d_; }
        private:
            std::vector<T> d_;
        };

        int main() {
            Sac<std::string> sac;
            std::string mode, mot;
            while (std::cin >> mode >> mot) {
                if (mode == "copie") sac.ajouter(mot);
                else if (mode == "deplacement") sac.ajouter(std::move(mot));
                else sac.emplacer(mot + mot + mot);
            }
            const auto& c = sac.contenu();
            for (std::size_t i = 0; i < c.size(); ++i) std::cout << (i ? "," : "") << c[i];
            std::cout << "\n";
        }
      tests:
        - { input: "copie a\ndeplacement b\nplace c", output: "ajout par copie\najout par déplacement\nconstruction en place\na,b,ccc" }
        - { input: place xy, output: "construction en place\nxyxyxy", hidden: true }
    exam:
      pass: 70
      questions:
        - id: cpp-rv-ex1
          type: mcq
          prompt: Lequel est une rvalue ?
          choices: ['a + b', 'x', 'v[0]', '*p']
          answer: 0
        - id: cpp-rv-ex2
          type: mcq
          prompt: Que fait std::forward<T>(x) ?
          choices: ['Un cast conditionnel qui préserve la catégorie de valeur d’origine', 'Il copie toujours', 'Il déplace toujours', 'Il avance un itérateur']
          answer: 0
        - id: cpp-rv-ex3
          type: mcq
          prompt: Quelle surcharge accepte à la fois lvalues et rvalues ?
          choices: ['f(const T&)', 'f(T&)', 'f(T&&) avec T non déduit', 'Aucune']
          answer: 0

  # ------------------------------------------------------------------
  - slug: cpp-lambdas
    title: Lambdas
    summary: Fonctions anonymes, captures par valeur et par référence, mutable, lambdas génériques, std::function et pièges de durée de vie.
    minutes: 30
    concepts: [closures]
    sections:
      - title: Syntaxe et captures
        body: |
          ```cpp
          auto carre = [](int x) { return x * x; };
          int seuil = 10, total = 0;
          auto grand = [seuil](int x) { return x > seuil; };      // capture par valeur
          auto ajouter = [&total](int x) { total += x; };          // par référence
          auto tout = [=](int x) { return x + seuil; };             // tout par valeur
          auto toutRef = [&] { total = 0; };                        // tout par référence
          auto init = [n = 5](int x) { return x * n; };             // capture avec initialisation (C++14)
          auto deplace = [v = std::move(vecteur)] { return v.size(); };

          int c = 0;
          auto compteur = [c]() mutable { return ++c; };            // modifie SA copie
          ```

          Type de retour explicite : `[](double x) -> int { return x; }`.
      - title: Génériques et std::function
        body: |
          ```cpp
          auto max2 = [](auto a, auto b) { return a > b ? a : b; };  // lambda générique (C++14)
          auto cmp = []<typename T>(const T& a, const T& b) { return a < b; }; // C++20

          #include <functional>
          std::function<int(int)> op = carre;          // stocke n’importe quel « appelable »
          std::vector<std::function<double(double)>> pipeline;
          ```

          Chaque lambda a un **type unique** : `auto` ou un template pour la stocker sans surcoût ; `std::function` pour l’effacement de type (un peu plus coûteux).

          ⚠️ Capturer par référence une variable locale puis **renvoyer** la lambda = référence pendante !
    exercises:
      - id: cpp-lam-predict
        type: predict
        prompt: Que va afficher ce programme ?
        code: |
          #include <iostream>
          int main() {
              int a = 1, b = 1;
              auto parValeur = [a]() { return a * 10; };
              auto parRef = [&b]() { return b * 10; };
              a = 5; b = 5;
              int c = 0;
              auto compteur = [c]() mutable { return ++c; };
              compteur(); compteur();
              std::cout << parValeur() << " " << parRef() << " " << compteur() << " " << c << "\n";
          }
        output: 10 50 3 0
        concepts: [closures]
      - id: cpp-lam-q1
        type: mcq
        prompt: Que capture `[=]` ?
        choices: ['Toutes les variables utilisées, par valeur', 'Toutes, par référence', 'Rien', 'Seulement this']
        answer: 0
      - id: cpp-lam-fill
        type: fill
        prompt: Complète pour trier par valeur absolue.
        code: |
          #include <iostream>
          #include <vector>
          #include <algorithm>
          #include <cstdlib>
          int main() {
              std::vector<int> v{-5, 2, -1, 4};
              std::sort(v.begin(), v.end(), {{?}}(int a, int b) { return std::abs(a) < std::abs(b); });
              for (int x : v) std::cout << x << " ";
              std::cout << "\n";
          }
        blanks: [['[]']]
        tests:
          - { input: '', output: -1 2 4 -5 }
      - id: cpp-lam-code
        type: code
        title: Fabrique de fonctions
        prompt: |
          Écris `std::function<long long(long long)> composer(std::vector<std::function<long long(long long)>> fs)` qui renvoie une lambda appliquant les fonctions **dans l’ordre**.

          Chaque ligne : une valeur `x` puis des opérations `+N`, `*N`, `^2` (carré). Construis une lambda par opération (capture de N par valeur), compose-les et affiche le résultat.
        starter: |
          #include <iostream>
          #include <functional>
          #include <sstream>
          #include <string>
          #include <vector>

          int main() {
              std::string ligne;
              while (std::getline(std::cin, ligne)) {
              }
          }
        solution: |
          #include <iostream>
          #include <functional>
          #include <sstream>
          #include <string>
          #include <vector>

          using Fn = std::function<long long(long long)>;

          Fn composer(std::vector<Fn> fs) {
              return [fs = std::move(fs)](long long x) {
                  for (const auto& f : fs) x = f(x);
                  return x;
              };
          }

          int main() {
              std::string ligne;
              while (std::getline(std::cin, ligne)) {
                  std::istringstream is(ligne);
                  long long x;
                  is >> x;
                  std::vector<Fn> fs;
                  std::string op;
                  while (is >> op) {
                      if (op == "^2") fs.push_back([](long long v) { return v * v; });
                      else {
                          long long n = std::stoll(op.substr(1));
                          if (op[0] == '+') fs.push_back([n](long long v) { return v + n; });
                          else fs.push_back([n](long long v) { return v * n; });
                      }
                  }
                  std::cout << composer(fs)(x) << "\n";
              }
          }
        tests:
          - { input: "2 +3 ^2 *2\n5", output: "50\n5" }
          - { input: "-1 *-3 +1 ^2", output: '16', hidden: true }
        concepts: [closures]
    project:
      id: cpp-lam-projet
      type: code
      title: Système d’événements
      difficulty: 3
      prompt: |
        Écris une classe `Bus` qui associe des noms d’événements à des listes d’abonnés `std::function<void(const std::string&)>` : `abonner(evt, fn)`, `publier(evt, donnee)`.

        Lis d’abord une ligne d’abonnements : des paires `evenement action` où action est `afficher`, `compter` ou `majuscules`. Chaque action est une lambda (`compter` incrémente un compteur capturé **par référence** dans `main`). Les lignes suivantes sont des publications `evenement donnee`.

        `afficher` affiche `[evt] donnee`, `majuscules` affiche la donnée en majuscules. Termine par `compteur : N`.
      starter: |
        #include <iostream>
        #include <functional>
        #include <map>
        #include <sstream>
        #include <string>
        #include <vector>
        #include <cctype>

        int main() {
        }
      solution: |
        #include <iostream>
        #include <functional>
        #include <map>
        #include <sstream>
        #include <string>
        #include <vector>
        #include <cctype>

        class Bus {
        public:
            using Abonne = std::function<void(const std::string&)>;
            void abonner(const std::string& evt, Abonne fn) { abonnes_[evt].push_back(std::move(fn)); }
            void publier(const std::string& evt, const std::string& d) const {
                if (auto it = abonnes_.find(evt); it != abonnes_.end())
                    for (const auto& f : it->second) f(d);
            }
        private:
            std::map<std::string, std::vector<Abonne>> abonnes_;
        };

        int main() {
            Bus bus;
