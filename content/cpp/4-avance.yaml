  - slug: cpp-metaprogrammation
    title: Métaprogrammation
    summary: Calculer à la compilation avec constexpr et consteval, static_assert, templates récursifs, SFINAE et tables générées à la compilation.
    minutes: 35
    concepts: [macros, generiques]
    sections:
      - title: constexpr et consteval
        body: |
          ```cpp
          constexpr long long factorielle(int n) { return n <= 1 ? 1 : n * factorielle(n - 1); }
          static_assert(factorielle(5) == 120);       // vérifié À LA COMPILATION

          consteval int carreCompil(int x) { return x * x; }   // C++20 : OBLIGATOIREMENT à la compilation
          constexpr int c = carreCompil(9);

          constexpr auto table = [] {
              std::array<int, 10> t{};
              for (int i = 0; i < 10; ++i) t[i] = i * i;
              return t;
          }();                                        // tableau calculé à la compilation
          ```

          En C++20, `constexpr` accepte boucles, `std::vector` et `std::string` temporaires, algorithmes : on peut calculer beaucoup de choses avant l’exécution, pour un coût nul au moment de l’exécution.
      - title: Templates récursifs et SFINAE
        body: |
          La métaprogrammation « historique » utilise les templates comme un langage fonctionnel exécuté par le compilateur :

          ```cpp
          template <int N> struct Fib { static constexpr int valeur = Fib<N - 1>::valeur + Fib<N - 2>::valeur; };
          template <> struct Fib<0> { static constexpr int valeur = 0; };
          template <> struct Fib<1> { static constexpr int valeur = 1; };
          ```

          **SFINAE** (*Substitution Failure Is Not An Error*) : une surcharge dont la substitution échoue est ignorée silencieusement, ce qui permet de sélectionner une fonction selon des propriétés du type :

          ```cpp
          template <typename T, std::enable_if_t<std::is_integral_v<T>, int> = 0>
          T moitie(T x) { return x / 2; }
          ```

          Les **concepts** (chapitre suivant) remplacent avantageusement SFINAE.
