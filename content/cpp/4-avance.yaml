          type: mcq
          prompt: Le compilateur C++ réordonne-t-il les membres d’une struct pour réduire le remplissage ?
          choices: ['Non, l’ordre de déclaration est conservé', 'Oui, toujours', 'Seulement en -O3', 'Seulement pour les classes']
          answer: 0
        - id: cpp-memav-ex2
          type: mcq
          prompt: Quel est l’intérêt d’une monotonic_buffer_resource ?
          choices: ['Allocations très rapides dans un tampon, libérées en bloc à la fin', 'Libérer chaque objet individuellement', 'Partager la mémoire entre processus', 'Chiffrer la mémoire']
          answer: 0
