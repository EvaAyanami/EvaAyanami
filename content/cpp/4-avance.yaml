          type: mcq
          prompt: Quel est le principal bénéfice des concepts ?
          choices: ['Des contraintes explicites et des messages d’erreur lisibles', 'Des programmes plus rapides à l’exécution', 'Le polymorphisme dynamique', 'La gestion mémoire']
          answer: 0
        - id: cpp-concept-ex2
