  # ------------------------------------------------------------------
  - slug: cpp-threads
    title: Threads
    summary: std::thread, std::jthread et l’arrêt coopératif, join/detach, passage d’arguments, thread_local et coût des threads.
    minutes: 30
    concepts: [concurrence]
    sections:
      - title: std::thread et jthread
        body: |
          ```cpp
          #include <thread>

          void travail(int id, std::string& sortie) { sortie = "fini " + std::to_string(id); }

          std::string res;
          std::thread t(travail, 1, std::ref(res));   // std::ref pour passer une référence
          t.join();                                    // attendre la fin (obligatoire avant destruction)

          std::jthread j([](std::stop_token st) {      // C++20 : join automatique
              while (!st.stop_requested()) { /* … */ }
          });
          j.request_stop();                            // arrêt coopératif
          ```

          ⚠️ Détruire un `std::thread` encore joignable appelle `std::terminate` : il faut `join()` ou `detach()`. `std::jthread` corrige ce piège (RAII).
      - title: Bonnes pratiques
        body: |
          - `std::thread::hardware_concurrency()` : nombre de threads matériels.
          - Créer un thread coûte (pile, appel système) : pour beaucoup de petites tâches, utiliser un **pool**.
          - `thread_local int x;` : une variable distincte par thread.
          - Éviter `detach()` : un thread détaché qui accède à des objets détruits provoque des bugs subtils.
          - L’ordre d’exécution des threads n’est **pas déterministe** : ne jamais supposer qu’un thread s’exécute avant un autre sans synchronisation.
