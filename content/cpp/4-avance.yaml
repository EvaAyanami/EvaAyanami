    project:
      id: cpp-memav-projet
      type: code
      title: Pool d’objets
      difficulty: 3
      prompt: |
        Implémente `template <typename T, std::size_t N> class Pool` : un tableau de `N` emplacements alignés (`alignas(T) std::byte stockage[N][sizeof(T)]`) et une liste des emplacements libres. `template <typename... A> T* creer(A&&...)` construit un objet par **placement new** (renvoie `nullptr` si plein) ; `void detruire(T*)` appelle le destructeur et libère l’emplacement (réutilisé en priorité, ordre LIFO).

        La classe `Particule(int id)` affiche `+id` à la construction et `-id` à la destruction. Commandes : `creer id` (affiche aussi `pool plein` si échec), `detruire id`, `libres`. Pool de capacité 3.
      starter: |
        #include <cstddef>
        #include <iostream>
        #include <map>
        #include <new>
        #include <string>
        #include <utility>
        #include <vector>

        int main() {
        }
      solution: |
        #include <cstddef>
        #include <iostream>
        #include <map>
        #include <new>
        #include <string>
        #include <utility>
        #include <vector>

        template <typename T, std::size_t N>
        class Pool {
        public:
            Pool() { for (std::size_t i = N; i-- > 0;) libres_.push_back(i); }
            template <typename... A>
            T* creer(A&&... args) {
                if (libres_.empty()) return nullptr;
                std::size_t i = libres_.back();
                libres_.pop_back();
                return new (stockage_[i]) T(std::forward<A>(args)...);
            }
            void detruire(T* p) {
                p->~T();
                std::size_t i = (reinterpret_cast<std::byte*>(p) - &stockage_[0][0]) / sizeof(T);
                libres_.push_back(i);
            }
            std::size_t libres() const { return libres_.size(); }
        private:
            alignas(T) std::byte stockage_[N][sizeof(T)];
            std::vector<std::size_t> libres_;
        };

        struct Particule {
            int id;
            explicit Particule(int i) : id(i) { std::cout << "+" << id << "\n"; }
            ~Particule() { std::cout << "-" << id << "\n"; }
        };

        int main() {
            Pool<Particule, 3> pool;
            std::map<int, Particule*> vivantes;
            std::string cmd;
            while (std::cin >> cmd) {
                if (cmd == "creer") {
                    int id;
                    std::cin >> id;
                    if (auto* p = pool.creer(id)) vivantes[id] = p;
                    else std::cout << "pool plein\n";
                } else if (cmd == "detruire") {
                    int id;
                    std::cin >> id;
                    if (auto it = vivantes.find(id); it != vivantes.end()) {
                        pool.detruire(it->second);
                        vivantes.erase(it);
                    }
                } else {
                    std::cout << "libres : " << pool.libres() << "\n";
                }
            }
            for (auto& [id, p] : vivantes) pool.detruire(p);
        }
      tests:
        - { input: "creer 1\ncreer 2\ncreer 3\ncreer 4\nlibres\ndetruire 2\ncreer 5\nlibres", output: "+1\n+2\n+3\npool plein\nlibres : 0\n-2\n+5\nlibres : 0\n-1\n-3\n-5" }
        - { input: libres, output: 'libres : 3', hidden: true }
      require:
        - { pattern: 'new\s*\(', message: Utiliser le placement new }
