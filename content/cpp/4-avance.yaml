      - id: cpp-mtx-code
        type: code
        title: Producteur et consommateur
        prompt: |
          Un thread producteur pousse dans une file (protégée par mutex) chaque entier lu, puis signale la fin. Un thread consommateur attend avec une `std::condition_variable`, retire les valeurs et accumule leur somme et leur maximum, jusqu’à ce que la file soit vide **et** la production terminée.

          Affiche `reçus : N`, `somme : S`, `max : M` (`max : -` si aucun).
        starter: |
          #include <iostream>
          #include <condition_variable>
          #include <mutex>
          #include <queue>
          #include <thread>
          #include <vector>

          int main() {
              std::vector<long long> donnees;
              long long x;
              while (std::cin >> x) donnees.push_back(x);
          }
        solution: |
          #include <iostream>
          #include <condition_variable>
          #include <mutex>
          #include <queue>
          #include <thread>
          #include <vector>
          #include <optional>

          int main() {
              std::vector<long long> donnees;
              long long x;
              while (std::cin >> x) donnees.push_back(x);
              std::mutex m;
              std::condition_variable cv;
              std::queue<long long> file;
              bool fini = false;
              long long somme = 0;
              int recus = 0;
              std::optional<long long> mx;
              std::thread consommateur([&] {
                  while (true) {
                      std::unique_lock<std::mutex> lk(m);
                      cv.wait(lk, [&] { return !file.empty() || fini; });
                      if (file.empty() && fini) break;
                      long long v = file.front();
                      file.pop();
                      lk.unlock();
                      somme += v;
                      ++recus;
                      if (!mx || v > *mx) mx = v;
                  }
              });
              std::thread producteur([&] {
                  for (long long v : donnees) {
                      { std::lock_guard<std::mutex> g(m); file.push(v); }
                      cv.notify_one();
                  }
                  { std::lock_guard<std::mutex> g(m); fini = true; }
                  cv.notify_one();
              });
              producteur.join();
              consommateur.join();
              std::cout << "reçus : " << recus << "\nsomme : " << somme << "\nmax : ";
              if (mx) std::cout << *mx; else std::cout << "-";
              std::cout << "\n";
          }
        tests:
          - { input: 3 9 -2 5, output: "reçus : 4\nsomme : 15\nmax : 9" }
          - { input: '', output: "reçus : 0\nsomme : 0\nmax : -", hidden: true }
        require:
          - { pattern: 'condition_variable', message: Utiliser une condition_variable }
    project:
      id: cpp-mtx-projet
      type: code
      title: Virements sans interblocage
      difficulty: 3
      prompt: |
        Des comptes (chacun protégé par son propre `std::mutex`) subissent des virements simultanés. Première ligne : `n` comptes et leur solde initial commun. Lignes suivantes : `de vers montant`.

        Exécute **chaque virement dans son propre thread** (tous lancés puis tous joints). Un virement verrouille les deux comptes avec `std::scoped_lock` (pas de deadlock même si A→B et B→A sont simultanés) ; il est ignoré si le solde est insuffisant, ou si `de == vers`. Affiche les soldes finaux séparés par des espaces puis le total (qui doit être conservé).

        Les tests sont conçus pour que le résultat ne dépende pas de l’ordre d’exécution.
      starter: |
        #include <iostream>
        #include <mutex>
        #include <thread>
        #include <vector>

        int main() {
        }
      solution: |
        #include <iostream>
        #include <memory>
        #include <mutex>
        #include <thread>
        #include <vector>

        struct Compte {
            std::mutex m;
            long long solde;
        };

        int main() {
            int n;
            long long initial;
            std::cin >> n >> initial;
            std::vector<std::unique_ptr<Compte>> comptes;
            for (int i = 0; i < n; ++i) {
                auto c = std::make_unique<Compte>();
                c->solde = initial;
                comptes.push_back(std::move(c));
            }
            std::vector<std::thread> ts;
            int de, vers;
            long long montant;
            while (std::cin >> de >> vers >> montant) {
                ts.emplace_back([&comptes, de, vers, montant] {
                    if (de == vers) return;
                    Compte& a = *comptes[de];
                    Compte& b = *comptes[vers];
                    std::scoped_lock verrou(a.m, b.m);
                    if (a.solde >= montant) {
                        a.solde -= montant;
                        b.solde += montant;
                    }
                });
            }
            for (auto& t : ts) t.join();
            long long total = 0;
            for (int i = 0; i < n; ++i) {
                std::cout << (i ? " " : "") << comptes[i]->solde;
                total += comptes[i]->solde;
            }
            std::cout << "\n" << total << "\n";
        }
      tests:
        - { input: "3 100\n0 1 30\n1 2 20\n2 0 10", output: "80 110 110\n300" }
        - { input: "2 50\n0 1 10\n1 0 10\n0 0 5", output: "50 50\n100", hidden: true }
      require:
        - { pattern: 'scoped_lock', message: Utiliser std::scoped_lock }
