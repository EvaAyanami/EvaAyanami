        title: Table de nombres premiers à la compilation
        prompt: |
          Calcule **à la compilation** un crible d’Ératosthène jusqu’à 10 000 dans une fonction `constexpr` qui renvoie un `std::array<bool, 10001>`, stocké dans une variable `constexpr`. Vérifie avec un `static_assert` que 9973 est premier.

