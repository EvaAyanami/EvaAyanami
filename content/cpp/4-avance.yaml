  - slug: cpp-concepts
    title: Concepts
    summary: Contraindre les templates avec les concepts C++20 — requires, concepts standards, concepts personnalisés et messages d’erreur lisibles.
    minutes: 30
    concepts: [generiques, traits]
    sections:
      - title: Contraindre un template
        body: |
          ```cpp
          #include <concepts>

          template <std::integral T>                     // syntaxe courte
          T pgcd(T a, T b) { return b == 0 ? a : pgcd(b, a % b); }

          template <typename T>
            requires std::floating_point<T>              // clause requires
          T moyenne(T a, T b) { return (a + b) / 2; }

          auto doubler(std::integral auto x) { return 2 * x; }   // abrégé (C++20)

          pgcd(12, 18);      // ✅
          // pgcd(1.5, 2.0); // ❌ erreur claire : « constraints not satisfied: std::integral<double> »
          ```

          Concepts standards : `std::integral`, `std::floating_point`, `std::same_as`, `std::convertible_to`, `std::derived_from`, `std::totally_ordered`, `std::invocable`, `std::ranges::range`…
      - title: Écrire ses concepts
        body: |
          ```cpp
          template <typename T>
          concept Forme = requires(const T& f) {
              { f.aire() } -> std::convertible_to<double>;
              { f.nom() } -> std::convertible_to<std::string>;
          };

          template <typename T>
          concept Additionnable = requires(T a, T b) { a + b; };

          double totalAires(const std::vector<Carre>& v) requires Forme<Carre>;

          template <Forme F>
          void decrire(const F& f) { std::cout << f.nom() << " : " << f.aire() << "\n"; }
          ```

          Les concepts remplacent SFINAE et les classes de base abstraites quand le polymorphisme peut être **statique** : aucune vtable, et des erreurs de compilation compréhensibles.
    exercises:
      - id: cpp-concept-q1
        type: mcq
        prompt: Quel concept standard accepte int, long et char mais pas double ?
        choices: ['std::integral', 'std::floating_point', 'std::totally_ordered', 'std::same_as<int>']
