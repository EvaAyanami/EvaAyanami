  - slug: cpp-generique
    title: Programmation générique
    summary: Templates variadiques, fold expressions, if constexpr, traits de type, déduction de classes (CTAD) et polymorphisme statique (CRTP).
    minutes: 35
    concepts: [generiques]
    sections:
      - title: Variadiques et fold
        body: |
          ```cpp
          template <typename... Ts>
          auto somme(Ts... xs) { return (xs + ... + 0); }          // fold expression (C++17)

          template <typename... Ts>
          void afficherTout(const Ts&... xs) {
              ((std::cout << xs << ' '), ...);                       // fold sur l’opérateur virgule
              std::cout << '\n';
          }

          somme(1, 2, 3.5);           // 6.5
          sizeof...(Ts);              // nombre d’arguments
          ```
      - title: if constexpr, traits et CRTP
        body: |
          ```cpp
          #include <type_traits>
          template <typename T>
          std::string decrire(const T& x) {
              if constexpr (std::is_integral_v<T>) return "entier " + std::to_string(x);
              else if constexpr (std::is_floating_point_v<T>) return "réel";
              else return "autre";              // les branches écartées ne sont pas compilées
          }

          std::pair p{1, 2.5};                  // CTAD : std::pair<int, double> déduit

          // CRTP : polymorphisme statique, sans vtable
          template <typename Derivee>
          struct Forme {
              double aire() const { return static_cast<const Derivee*>(this)->aireImpl(); }
          };
          struct Carre : Forme<Carre> { double c; double aireImpl() const { return c * c; } };
