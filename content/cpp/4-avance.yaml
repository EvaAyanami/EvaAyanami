      - id: cpp-concept-predict
        type: predict
        prompt: Que va afficher ce programme ?
        code: |
          #include <iostream>
          #include <concepts>
          #include <string>
          template <typename T> concept Parlant = requires(T t) { { t.parler() } -> std::convertible_to<std::string>; };
          struct Chat { std::string parler() const { return "miaou"; } };
          struct Pierre {};
          template <Parlant T> std::string dire(const T& t) { return t.parler(); }
          std::string dire(...) { return "..."; }
          auto triple(std::integral auto x) { return x * 3; }
          int main() {
              std::cout << dire(Chat{}) << " " << dire(Pierre{}) << " " << triple(7) << "\n";
          }
        output: miaou ... 21
      - id: cpp-concept-fill
        type: fill
        prompt: Complète la clause qui contraint T aux types flottants.
        code: |
          #include <iostream>
          #include <concepts>
          template <typename T>
            {{?}} std::floating_point<T>
          T moitie(T x) { return x / 2; }
          int main() { std::cout << moitie(5.0) << "\n"; }
        blanks: [[requires]]
        tests:
          - { input: '', output: '2.5' }
      - id: cpp-concept-code
        type: code
        title: Formes contraintes
        prompt: |
          Écris le concept `Forme` (exige `aire()` convertible en `double` et `nom()` convertible en `std::string`), deux structs `Carre` et `Disque` qui le satisfont, et une fonction `template <Forme F> void decrire(const F&)` qui affiche `nom : aire` (2 décimales). Ajoute `static_assert(!Forme<int>);`. Utilise π = 3.141592653589793.

          Chaque ligne : `carre c` ou `disque r`.
        starter: |
          #include <iostream>
          #include <concepts>
          #include <iomanip>
          #include <string>

          int main() {
              std::string type;
              double x;
              std::cout << std::fixed << std::setprecision(2);
              while (std::cin >> type >> x) {
              }
          }
        solution: |
          #include <iostream>
          #include <concepts>
          #include <iomanip>
          #include <string>

          template <typename T>
          concept Forme = requires(const T& f) {
              { f.aire() } -> std::convertible_to<double>;
              { f.nom() } -> std::convertible_to<std::string>;
          };

          struct Carre {
              double c;
              double aire() const { return c * c; }
              std::string nom() const { return "carré"; }
          };
          struct Disque {
              double r;
              double aire() const { return 3.141592653589793 * r * r; }
              std::string nom() const { return "disque"; }
          };

          static_assert(Forme<Carre> && Forme<Disque>);
          static_assert(!Forme<int>);

          template <Forme F>
          void decrire(const F& f) { std::cout << f.nom() << " : " << f.aire() << "\n"; }

          int main() {
              std::string type;
              double x;
              std::cout << std::fixed << std::setprecision(2);
              while (std::cin >> type >> x) {
                  if (type == "carre") decrire(Carre{x});
                  else decrire(Disque{x});
              }
          }
        tests:
          - { input: "carre 3\ndisque 1", output: "carré : 9.00\ndisque : 3.14" }
          - { input: disque 2, output: 'disque : 12.57', hidden: true }
        require:
          - { pattern: 'concept\s+Forme', message: Définir le concept Forme }
    project:
      id: cpp-concept-projet
      type: code
      title: Algorithmes contraints
      difficulty: 3
      prompt: |
        Écris deux fonctions génériques contraintes :

        - `template <std::ranges::range R> requires std::totally_ordered<std::ranges::range_value_t<R>> auto maxElement(const R& r)` qui renvoie un `std::optional` (vide si la plage est vide) ;
        - `template <typename T> requires std::integral<T> || std::floating_point<T> double moyenne(const std::vector<T>&)`.

        Entrée : une ligne d’entiers puis une ligne de mots. Affiche le max des entiers, la moyenne des entiers (2 décimales), puis le max des mots (ordre lexicographique). Pour une plage vide, affiche `-`.
      starter: |
        #include <iostream>
        #include <concepts>
        #include <iomanip>
        #include <optional>
        #include <ranges>
        #include <sstream>
        #include <string>
        #include <vector>

        int main() {
        }
      solution: |
        #include <iostream>
        #include <concepts>
        #include <iomanip>
        #include <optional>
        #include <ranges>
        #include <sstream>
        #include <string>
        #include <vector>

        template <std::ranges::range R>
            requires std::totally_ordered<std::ranges::range_value_t<R>>
        auto maxElement(const R& r) {
            std::optional<std::ranges::range_value_t<R>> m;
            for (const auto& x : r) if (!m || x > *m) m = x;
            return m;
        }

        template <typename T>
            requires std::integral<T> || std::floating_point<T>
        double moyenne(const std::vector<T>& v) {
            double s = 0;
            for (T x : v) s += x;
            return v.empty() ? 0 : s / v.size();
        }

        template <typename T>
        std::vector<T> lire(const std::string& l) {
            std::istringstream is(l);
            std::vector<T> v;
            T x;
            while (is >> x) v.push_back(x);
            return v;
        }

        int main() {
            std::string l1, l2;
            std::getline(std::cin, l1);
            std::getline(std::cin, l2);
            auto entiers = lire<long long>(l1);
            auto mots = lire<std::string>(l2);
            auto m = maxElement(entiers);
            if (m) std::cout << *m << "\n"; else std::cout << "-\n";
            if (entiers.empty()) std::cout << "-\n";
            else std::cout << std::fixed << std::setprecision(2) << moyenne(entiers) << "\n";
            auto mm = maxElement(mots);
            std::cout << (mm ? *mm : std::string("-")) << "\n";
        }
      tests:
        - { input: "3 9 -2\npomme kiwi abricot", output: "9\n3.33\npomme" }
        - { input: "\nzèbre", output: "-\n-\nzèbre", hidden: true }
    exam:
      pass: 70
      questions:
