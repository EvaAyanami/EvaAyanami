  # ------------------------------------------------------------------
  - slug: cpp-mutex
    title: Mutex
    summary: Protéger des données partagées — mutex, lock_guard, unique_lock, scoped_lock, shared_mutex et variables de condition.
    minutes: 35
    concepts: [concurrence]
    sections:
      - title: Verrouiller avec RAII
        body: |
          ```cpp
          #include <mutex>
          std::mutex m;
          std::vector<int> partage;

          void ajouter(int x) {
              std::lock_guard<std::mutex> verrou(m);   // verrouille, déverrouille en fin de portée
              partage.push_back(x);
          }

          std::scoped_lock tous(m1, m2);              // C++17 : plusieurs mutex sans deadlock
          std::unique_lock<std::mutex> ul(m);          // déverrouillable, déplaçable (pour les conditions)

          std::shared_mutex rw;                        // plusieurs lecteurs OU un écrivain
          std::shared_lock lecture(rw);
          std::unique_lock ecriture(rw);
          ```

          Ne jamais appeler `m.lock()` / `m.unlock()` à la main : une exception ou un `return` oublierait de déverrouiller.
      - title: Variables de condition
        body: |
          Pour **attendre** qu’une condition devienne vraie sans boucle active :

          ```cpp
          std::condition_variable cv;
          std::queue<int> file;
          bool fini = false;

          // Consommateur
          std::unique_lock<std::mutex> lk(m);
          cv.wait(lk, [&] { return !file.empty() || fini; });  // gère les réveils intempestifs

          // Producteur
          { std::lock_guard<std::mutex> g(m); file.push(42); }
          cv.notify_one();
          ```

          Le prédicat passé à `wait` protège contre les **réveils intempestifs** (*spurious wakeups*).
    exercises:
      - id: cpp-mtx-q1
        type: mcq
        prompt: Pourquoi utiliser lock_guard plutôt que lock()/unlock() ?
        choices: ['Le déverrouillage est garanti même en cas d’exception ou de return', 'C’est plus rapide', 'unlock n’existe pas', 'Pour plusieurs mutex']
        answer: 0
      - id: cpp-mtx-q2
        type: mcq
        prompt: Quel outil verrouille plusieurs mutex sans risque d’interblocage ?
        choices: ['std::scoped_lock', 'std::lock_guard', 'std::unique_lock seul', 'std::atomic']
        answer: 0
      - id: cpp-mtx-predict
        type: predict
        prompt: Que va afficher ce programme ?
