    project:
      id: cpp-meta-projet
      type: code
      title: Unités physiques vérifiées à la compilation
      difficulty: 3
      prompt: |
        Modélise des grandeurs physiques avec leurs dimensions dans le **type** : `template <int M, int S> struct Grandeur { double v; };` (M = exposant des mètres, S = exposant des secondes).

        - `+` n’est défini que pour des grandeurs de **mêmes** dimensions ;
        - `*` et `/` combinent les exposants (`Grandeur<M1+M2, S1+S2>`) ;
        - alias : `Longueur = Grandeur<1,0>`, `Duree = Grandeur<0,1>`, `Vitesse = Grandeur<1,-1>`, `Acceleration = Grandeur<1,-2>`.

        Ajoute un `static_assert` qui vérifie que `Longueur / Duree` a le type `Vitesse`. Pour chaque ligne `d1 d2 t` (mètres, mètres, secondes), affiche (2 décimales) la vitesse `(d1 + d2) / t` puis l’accélération `vitesse / t`.
      starter: |
        #include <iostream>
        #include <iomanip>
        #include <type_traits>

        int main() {
        }
      solution: |
        #include <iostream>
        #include <iomanip>
        #include <type_traits>

        template <int M, int S>
        struct Grandeur {
            double v;
        };

        template <int M, int S>
        Grandeur<M, S> operator+(Grandeur<M, S> a, Grandeur<M, S> b) { return {a.v + b.v}; }

        template <int M1, int S1, int M2, int S2>
        Grandeur<M1 + M2, S1 + S2> operator*(Grandeur<M1, S1> a, Grandeur<M2, S2> b) { return {a.v * b.v}; }

        template <int M1, int S1, int M2, int S2>
        Grandeur<M1 - M2, S1 - S2> operator/(Grandeur<M1, S1> a, Grandeur<M2, S2> b) { return {a.v / b.v}; }

        using Longueur = Grandeur<1, 0>;
        using Duree = Grandeur<0, 1>;
        using Vitesse = Grandeur<1, -1>;
        using Acceleration = Grandeur<1, -2>;

        static_assert(std::is_same_v<decltype(Longueur{} / Duree{}), Vitesse>);
        static_assert(std::is_same_v<decltype(Vitesse{} / Duree{}), Acceleration>);

        int main() {
            double d1, d2, t;
            std::cout << std::fixed << std::setprecision(2);
            while (std::cin >> d1 >> d2 >> t) {
                Longueur a{d1}, b{d2};
                Duree duree{t};
                Vitesse vit = (a + b) / duree;
                Acceleration acc = vit / duree;
                std::cout << vit.v << " " << acc.v << "\n";
            }
        }
      tests:
        - { input: 60 40 10, output: 10.00 1.00 }
        - { input: "1 2 3\n0 0 1", output: "1.00 0.33\n0.00 0.00", hidden: true }
      require:
        - { pattern: 'static_assert', message: Utiliser static_assert pour vérifier les dimensions }
