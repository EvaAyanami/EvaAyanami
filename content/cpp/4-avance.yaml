        solution: |
          #include <iostream>
          #include <future>
          #include <numeric>
          #include <vector>

          int main() {
              std::size_t n;
              std::cin >> n;
              std::vector<long long> v(n);
              for (auto& x : v) std::cin >> x;
              std::vector<std::future<long long>> fs;
              std::size_t taille = (n + 3) / 4;
              for (std::size_t k = 0; k < 4; ++k) {
                  std::size_t d = std::min(n, k * taille), f = std::min(n, d + taille);
                  fs.push_back(std::async(std::launch::async, [&v, d, f] { return std::accumulate(v.begin() + d, v.begin() + f, 0LL); }));
              }
              long long total = 0;
              for (auto& f : fs) total += f.get();
              std::cout << total << "\n";
          }
