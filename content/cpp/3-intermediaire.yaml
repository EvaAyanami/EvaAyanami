          #include <iostream>
          #include <map>
          #include <memory>
          #include <string>
          #include <vector>

          struct Personne {
              std::string nom;
              std::vector<std::shared_ptr<Personne>> enfants;
              std::weak_ptr<Personne> parent;
          };

          int main() {
              std::map<std::string, std::shared_ptr<Personne>> m;
              auto obtenir = [&](const std::string& n) {
                  auto& p = m[n];
                  if (!p) p = std::make_shared<Personne>(Personne{n, {}, {}});
                  return p;
              };
              std::string a, b, dernier;
              while (std::cin >> a >> b) {
                  auto p = obtenir(a), e = obtenir(b);
                  e->parent = p;
                  p->enfants.push_back(e);
                  dernier = b;
              }
              std::string chemin;
              for (auto p = m[dernier]; p; p = p->parent.lock()) chemin += (chemin.empty() ? "" : " <- ") + p->nom;
              std::cout << chemin << "\n";
          }
