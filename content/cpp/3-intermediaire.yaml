        solution: |
          #include <iostream>

          struct Complexe {
              double re, im;
              Complexe operator+(const Complexe& o) const { return {re + o.re, im + o.im}; }
              Complexe operator-(const Complexe& o) const { return {re - o.re, im - o.im}; }
              Complexe operator*(const Complexe& o) const { return {re * o.re - im * o.im, re * o.im + im * o.re}; }
              bool operator==(const Complexe&) const = default;
          };

          std::ostream& operator<<(std::ostream& o, const Complexe& z) {
              o << z.re;
              if (z.im < 0) o << "-" << -z.im << "i";
              else o << "+" << z.im << "i";
              return o;
          }

          int main() {
              double a, b, c, d;
              char op;
              while (std::cin >> a >> b >> op >> c >> d) {
                  Complexe x{a, b}, y{c, d};
                  if (op == '+') std::cout << x + y << "\n";
                  else if (op == '-') std::cout << x - y << "\n";
                  else if (op == '*') std::cout << x * y << "\n";
                  else std::cout << (x == y ? "vrai" : "faux") << "\n";
              }
          }
        tests:
          - { input: "1 2 + 3 4\n1 2 * 3 4\n1 1 = 1 1", output: "4+6i\n-5+10i\nvrai" }
          - { input: 0 1 * 0 1, output: -1+0i, hidden: true }
          - { input: 5 5 - 1 9, output: 4-4i, hidden: true }
    project:
      id: cpp-ops-projet
      type: code
      title: Polynômes
      difficulty: 3
      prompt: |
        Écris une classe `Polynome` (coefficients du degré 0 au degré n dans un `std::vector<long long>`) avec `operator+`, `operator*`, `operator()(long long x)` (évaluation, schéma de Horner) et `operator<<` (format `3x^2 + 2x + 1`, en omettant les termes nuls ; `0` pour le polynôme nul ; coefficient 1 omis devant x ; termes négatifs affichés `- 4x`).

        Entrée : deux lignes de coefficients (degré croissant) puis une valeur `x`. Affiche P, Q, P+Q, P×Q, puis `P(x) = …`.
      starter: |
        #include <iostream>
        #include <sstream>
        #include <string>
        #include <vector>

        int main() {
        }
      solution: |
        #include <iostream>
        #include <sstream>
        #include <string>
        #include <vector>
        #include <algorithm>
        #include <cstdlib>

        class Polynome {
        public:
            explicit Polynome(std::vector<long long> c) : c_(std::move(c)) { normaliser(); }
            Polynome operator+(const Polynome& o) const {
                std::vector<long long> r(std::max(c_.size(), o.c_.size()), 0);
                for (std::size_t i = 0; i < c_.size(); ++i) r[i] += c_[i];
                for (std::size_t i = 0; i < o.c_.size(); ++i) r[i] += o.c_[i];
                return Polynome(r);
            }
            Polynome operator*(const Polynome& o) const {
                std::vector<long long> r(c_.size() + o.c_.size(), 0);
                for (std::size_t i = 0; i < c_.size(); ++i)
                    for (std::size_t j = 0; j < o.c_.size(); ++j) r[i + j] += c_[i] * o.c_[j];
                return Polynome(r);
            }
            long long operator()(long long x) const {
                long long r = 0;
                for (std::size_t i = c_.size(); i-- > 0;) r = r * x + c_[i];
                return r;
            }
            friend std::ostream& operator<<(std::ostream& o, const Polynome& p) {
                bool premier = true;
                for (std::size_t i = p.c_.size(); i-- > 0;) {
                    long long c = p.c_[i];
                    if (c == 0) continue;
                    if (premier) { if (c < 0) o << "-"; }
                    else o << (c < 0 ? " - " : " + ");
                    long long a = std::llabs(c);
                    if (a != 1 || i == 0) o << a;
                    if (i >= 1) o << "x";
                    if (i >= 2) o << "^" << i;
                    premier = false;
                }
                if (premier) o << "0";
                return o;
            }
        private:
            void normaliser() { while (!c_.empty() && c_.back() == 0) c_.pop_back(); }
            std::vector<long long> c_;
        };

        Polynome lire() {
            std::string l;
            std::getline(std::cin, l);
            std::istringstream is(l);
            std::vector<long long> c;
            long long x;
            while (is >> x) c.push_back(x);
            return Polynome(c);
        }

        int main() {
            Polynome p = lire(), q = lire();
            long long x;
            std::cin >> x;
            std::cout << p << "\n" << q << "\n" << p + q << "\n" << p * q << "\n";
            std::cout << "P(" << x << ") = " << p(x) << "\n";
        }
      tests:
        - { input: "1 2 3\n-1 1\n2", output: "3x^2 + 2x + 1\nx - 1\n3x^2 + 3x\n3x^3 - x^2 - x - 1\nP(2) = 17" }
        - { input: "0\n5\n10", output: "0\n5\n5\n0\nP(10) = 0", hidden: true }
