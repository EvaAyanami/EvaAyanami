    project:
      id: cpp-sp-projet
      type: code
      title: Cache de textures partagées
      difficulty: 3
      prompt: |
        Un gestionnaire de ressources garde des `std::weak_ptr<Texture>` dans une `std::map` : `charger(nom)` renvoie la texture existante si elle est encore vivante (`lock()`), sinon en crée une nouvelle (afficher `chargement nom`). La `Texture` affiche `libération nom` dans son destructeur.

        Les objets du jeu (« sprites ») gardent des `shared_ptr<Texture>`. Commandes : `sprite id texture` (crée/remplace un sprite), `supprimer id`, `stats` (affiche `textures vivantes : N`). Les sprites sont dans une `std::map<std::string, std::shared_ptr<Texture>>`.
      starter: |
        #include <iostream>
        #include <map>
        #include <memory>
        #include <string>

        int main() {
        }
      solution: |
        #include <iostream>
        #include <map>
        #include <memory>
        #include <string>

        struct Texture {
            std::string nom;
            explicit Texture(std::string n) : nom(std::move(n)) { std::cout << "chargement " << nom << "\n"; }
            ~Texture() { std::cout << "libération " << nom << "\n"; }
        };

        class Gestionnaire {
        public:
            std::shared_ptr<Texture> charger(const std::string& nom) {
                if (auto t = cache_[nom].lock()) return t;
                auto t = std::make_shared<Texture>(nom);
                cache_[nom] = t;
                return t;
            }
            int vivantes() const {
                int n = 0;
                for (const auto& [k, w] : cache_) if (!w.expired()) ++n;
                return n;
            }
        private:
            std::map<std::string, std::weak_ptr<Texture>> cache_;
        };

        int main() {
            Gestionnaire g;
            std::map<std::string, std::shared_ptr<Texture>> sprites;
            std::string cmd, id, tex;
            while (std::cin >> cmd) {
                if (cmd == "sprite") { std::cin >> id >> tex; sprites[id] = g.charger(tex); }
                else if (cmd == "supprimer") { std::cin >> id; sprites.erase(id); }
                else std::cout << "textures vivantes : " << g.vivantes() << "\n";
            }
            sprites.clear();
            std::cout << "fin\n";
        }
      tests:
        - { input: "sprite a herbe\nsprite b herbe\nsprite c eau\nstats\nsupprimer a\nsupprimer b\nstats\nsprite c lave", output: "chargement herbe\nchargement eau\ntextures vivantes : 2\nlibération herbe\ntextures vivantes : 1\nchargement lave\nlibération eau\nlibération lave\nfin" }
        - { input: stats, output: "textures vivantes : 0\nfin", hidden: true }
