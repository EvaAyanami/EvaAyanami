  # ------------------------------------------------------------------
  - slug: cpp-set
    title: Set
    summary: Ensembles triés et non triés, unicité, opérations ensemblistes, multiset et comparateurs personnalisés.
    minutes: 25
    concepts: [collections]
    sections:
      - title: std::set et unordered_set
        body: |
          ```cpp
          #include <set>
          std::set<int> s{5, 1, 3, 1};        // {1, 3, 5} : trié, sans doublon
          s.insert(4);
          bool present = s.contains(3);        // C++20 (sinon s.count(3))
          s.erase(1);
          auto it = s.lower_bound(4);          // premier élément >= 4
          for (int x : s) std::cout << x;      // 345

          std::unordered_set<std::string> vus; // hachage, O(1) moyen, sans ordre
          if (!vus.insert("kiri").second) std::cout << "déjà vu";
          ```

          `std::multiset` autorise les doublons tout en restant trié.
      - title: Opérations ensemblistes et comparateurs
        body: |
          Sur des intervalles **triés** (`<algorithm>`) :

          ```cpp
          std::set<int> a{1, 2, 3}, b{2, 3, 4}, r;
          std::set_intersection(a.begin(), a.end(), b.begin(), b.end(), std::inserter(r, r.begin())); // {2, 3}
          // set_union, set_difference, set_symmetric_difference
          ```

          Ordre personnalisé :

          ```cpp
          struct ParLongueur {
              bool operator()(const std::string& x, const std::string& y) const {
                  return x.size() != y.size() ? x.size() < y.size() : x < y;
              }
          };
          std::set<std::string, ParLongueur> mots;
          ```

          Les éléments d’un set sont **constants** : pour « modifier », on retire puis on réinsère.
