      - id: cpp-set-code
        type: code
        title: Élèves communs
        prompt: |
          Deux lignes : les élèves inscrits au club A, puis au club B (noms séparés par des espaces). Affiche sur trois lignes : les élèves dans les deux clubs, ceux seulement dans A, et le nombre total d’élèves distincts. Les listes sont triées ; une liste vide affiche `-`.
        starter: |
          #include <iostream>
          #include <set>
          #include <sstream>
          #include <string>
          #include <algorithm>
          #include <iterator>

          int main() {
              std::string ligneA, ligneB;
              std::getline(std::cin, ligneA);
              std::getline(std::cin, ligneB);
          }
        solution: |
          #include <iostream>
          #include <set>
          #include <sstream>
          #include <string>
          #include <algorithm>
          #include <iterator>

          std::set<std::string> lire(const std::string& l) {
              std::istringstream is(l);
              std::set<std::string> s;
              std::string m;
              while (is >> m) s.insert(m);
              return s;
          }

          void afficher(const std::set<std::string>& s) {
              if (s.empty()) { std::cout << "-\n"; return; }
              bool premier = true;
              for (const auto& x : s) { std::cout << (premier ? "" : " ") << x; premier = false; }
              std::cout << "\n";
          }

          int main() {
              std::string ligneA, ligneB;
              std::getline(std::cin, ligneA);
              std::getline(std::cin, ligneB);
              auto a = lire(ligneA), b = lire(ligneB);
              std::set<std::string> inter, diff, uni;
              std::set_intersection(a.begin(), a.end(), b.begin(), b.end(), std::inserter(inter, inter.begin()));
              std::set_difference(a.begin(), a.end(), b.begin(), b.end(), std::inserter(diff, diff.begin()));
              std::set_union(a.begin(), a.end(), b.begin(), b.end(), std::inserter(uni, uni.begin()));
              afficher(inter);
              afficher(diff);
              std::cout << uni.size() << "\n";
          }
        tests:
          - { input: "Zoe Ada Bob\nBob Kiri Ada", output: "Ada Bob\nZoe\n4" }
          - { input: "X\nY", output: "-\nX\n2", hidden: true }
