  # ------------------------------------------------------------------
  - slug: cpp-exceptions
    title: Exceptions
    summary: throw, try, catch, hiérarchie std::exception, exceptions personnalisées, noexcept et sûreté face aux exceptions.
    minutes: 30
    concepts: [erreurs]
    sections:
      - title: Lever et attraper
        body: |
          ```cpp
          #include <stdexcept>

          double diviser(double a, double b) {
              if (b == 0) throw std::invalid_argument("division par zéro");
              return a / b;
          }

          try {
              std::cout << diviser(1, 0);
          } catch (const std::invalid_argument& e) {      // attraper par référence const
              std::cerr << "Erreur : " << e.what() << "\n";
          } catch (const std::exception& e) {             // plus général ensuite
              std::cerr << "Autre : " << e.what() << "\n";
          } catch (...) {                                 // tout le reste
              std::cerr << "Inconnue\n";
          }
          ```

          Hiérarchie : `std::exception` → `std::logic_error` (`invalid_argument`, `out_of_range`, `domain_error`) et `std::runtime_error` (`overflow_error`, `range_error`…). `std::bad_alloc` signale un échec d’allocation.
      - title: Exceptions personnalisées et sûreté
        body: |
          ```cpp
          class SoldeInsuffisant : public std::runtime_error {
          public:
              explicit SoldeInsuffisant(double manque)
                  : std::runtime_error("solde insuffisant"), manque_(manque) {}
              double manque() const { return manque_; }
          private:
              double manque_;
          };
          ```

          - Grâce à **RAII**, les destructeurs libèrent les ressources pendant la remontée de l’exception.
          - `noexcept` promet qu’une fonction ne lève pas (destructeurs, constructeurs de déplacement) ; si elle le fait quand même, le programme s’arrête.
          - Garanties : **forte** (en cas d’échec, l’état est inchangé), **de base** (pas de fuite, objet valide), **aucune levée**.
          - Les exceptions sont faites pour les situations **exceptionnelles**, pas pour le flux normal du programme.
    exercises:
      - id: cpp-exc-predict
        type: predict
        prompt: Que va afficher ce programme ?
        code: |
          #include <iostream>
          #include <stdexcept>
          #include <vector>
          int main() {
              std::vector<int> v{1, 2, 3};
              try {
                  std::cout << v.at(1) << " ";
                  std::cout << v.at(5) << " ";
                  std::cout << "jamais ";
              } catch (const std::out_of_range&) {
                  std::cout << "hors limites ";
              } catch (const std::exception&) {
                  std::cout << "autre ";
              }
              std::cout << "fin\n";
          }
        output: 2 hors limites fin
      - id: cpp-exc-q1
        type: mcq
        prompt: Pourquoi attraper par `const std::exception&` plutôt que par valeur ?
        choices: [Pour éviter le découpage (slicing) et une copie, Par obligation syntaxique, Pour aller plus vite à la compilation, C’est équivalent]
        answer: 0
      - id: cpp-exc-q2
        type: mcq
        prompt: Dans quel ordre écrire les blocs catch ?
        choices: [Du plus spécifique au plus général, Du plus général au plus spécifique, Ordre alphabétique, L’ordre n’a pas d’importance]
        answer: 0
      - id: cpp-exc-fill
        type: fill
        prompt: Complète pour lever une exception.
        code: |
          #include <iostream>
          #include <stdexcept>
          int racine(int x) {
              if (x < 0) {{?}} std::domain_error("négatif");
              return x;
          }
          int main() {
              try { racine(-4); } catch (const std::exception& e) { std::cout << e.what() << "\n"; }
          }
        blanks: [[throw]]
