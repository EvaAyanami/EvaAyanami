    project:
      id: cpp-file-projet
      type: code
      title: Analyse d’un CSV
      difficulty: 3
      prompt: |
        L’entrée est un fichier CSV (séparateur `;`) dont la première ligne est l’en-tête `produit;quantite;prix`. Écris-le d’abord dans `/tmp/ventes.csv`, puis relis-le avec un `ifstream` en découpant chaque ligne avec un `istringstream`.

        Affiche le chiffre d’affaires par produit (quantité × prix, cumulé), trié par produit (`produit : X.XX`), puis `Total : X.XX`. Les lignes mal formées (champ manquant ou nombre invalide) sont ignorées et comptées : `lignes ignorées : N`.
      starter: |
        #include <iostream>
        #include <fstream>
        #include <sstream>
        #include <string>
        #include <map>
        #include <iomanip>

        int main() {
        }
      solution: |
        #include <iostream>
        #include <fstream>
        #include <sstream>
        #include <string>
        #include <map>
        #include <iomanip>
        #include <filesystem>

        int main() {
            const std::string chemin = "/tmp/ventes.csv";
            {
                std::ofstream out(chemin);
                std::string l;
                while (std::getline(std::cin, l)) out << l << "\n";
            }
            std::ifstream in(chemin);
            std::string ligne;
            std::getline(in, ligne);
            std::map<std::string, double> ca;
            int ignorees = 0;
            while (std::getline(in, ligne)) {
                std::istringstream is(ligne);
                std::string p, q, pr;
                if (!std::getline(is, p, ';') || !std::getline(is, q, ';') || !std::getline(is, pr, ';') || p.empty()) { ++ignorees; continue; }
                try {
                    std::size_t a = 0, b = 0;
                    int quantite = std::stoi(q, &a);
                    double prix = std::stod(pr, &b);
                    if (a != q.size() || b != pr.size()) throw std::invalid_argument("x");
                    ca[p] += quantite * prix;
                } catch (const std::exception&) {
                    ++ignorees;
                }
            }
            double total = 0;
            std::cout << std::fixed << std::setprecision(2);
            for (const auto& [p, v] : ca) { std::cout << p << " : " << v << "\n"; total += v; }
            std::cout << "Total : " << total << "\n";
            std::cout << "lignes ignorées : " << ignorees << "\n";
            std::filesystem::remove(chemin);
        }
      tests:
        - { input: "produit;quantite;prix\nstylo;10;1.5\ncahier;2;3.2\nstylo;4;1.5\ngomme;x;1\nrègle", output: "cahier : 6.40\nstylo : 21.00\nTotal : 27.40\nlignes ignorées : 2" }
        - { input: "produit;quantite;prix", output: "Total : 0.00\nlignes ignorées : 0", hidden: true }
