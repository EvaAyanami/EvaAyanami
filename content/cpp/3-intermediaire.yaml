  - slug: cpp-templates
    title: Templates
    summary: Fonctions et classes génériques, déduction des paramètres, spécialisation, paramètres non-types et premières contraintes.
    minutes: 35
    concepts: [generiques]
    sections:
      - title: Fonctions et classes templates
        body: |
          ```cpp
          template <typename T>
          T maximum(T a, T b) { return a > b ? a : b; }

          maximum(3, 7);          // T = int (déduit)
          maximum<double>(2, 3.5);// explicite

          template <typename T>
          class Pile {
          public:
              void empiler(const T& x) { d.push_back(x); }
              T depiler() { T x = d.back(); d.pop_back(); return x; }
              bool vide() const { return d.empty(); }
          private:
              std::vector<T> d;
          };
          Pile<std::string> p;
          ```

          Le compilateur **instancie** une version par type utilisé. Le code template doit donc être visible là où il est utilisé : on le place généralement **entièrement dans les en-têtes**.
      - title: Spécialisation et paramètres non-types
        body: |
          ```cpp
          template <typename T>
          std::string decrire(const T&) { return "valeur"; }
          template <>
          std::string decrire<bool>(const bool& b) { return b ? "vrai" : "faux"; }   // spécialisation

          template <typename T, std::size_t N>
          constexpr std::size_t taille(const T (&)[N]) { return N; }                   // paramètre non-type

          template <typename T, typename U = int>       // paramètre par défaut
          struct Paire { T premier; U second; };
          ```

          Les erreurs de templates sont souvent longues et obscures ; les **concepts** C++20 (niveau Avancé) les rendent lisibles : `template <std::integral T>`.
