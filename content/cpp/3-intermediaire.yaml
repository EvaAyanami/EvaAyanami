  # ------------------------------------------------------------------
  - slug: cpp-raii
    title: RAII
    summary: Le principe fondamental du C++ — lier toute ressource à la durée de vie d’un objet, gardes de portée, verrous et transactions.
    minutes: 30
    concepts: [memoire, raii]
    sections:
      - title: Toute ressource est un objet
        body: |
          **RAII** : *Resource Acquisition Is Initialization*. Une ressource (mémoire, fichier, socket, verrou, transaction, connexion…) est :

          1. **acquise** dans le constructeur d’un objet ;
          2. **libérée** dans son destructeur.

          Comme le destructeur est appelé **automatiquement** à la fin de la portée — y compris lors d’un `return` anticipé ou d’une **exception** —, les fuites deviennent impossibles.

          ```cpp
          void traiter() {
              std::lock_guard<std::mutex> verrou(m);        // verrouille
              std::ifstream f("donnees.txt");                // ouvre
              auto buffer = std::make_unique<char[]>(4096);  // alloue
              if (!f) return;                                // tout est libéré
              risque();                                      // même si exception
          }                                                  // libération en ordre inverse
          ```
      - title: Écrire ses propres gardes
        body: |
          ```cpp
          template <typename F>
          class GardePortee {                       // exécute une action en sortie de portée
          public:
              explicit GardePortee(F f) : f_(std::move(f)) {}
              ~GardePortee() { if (actif_) f_(); }
              void annuler() { actif_ = false; }    // pour « valider » une transaction
              GardePortee(const GardePortee&) = delete;
              GardePortee& operator=(const GardePortee&) = delete;
          private:
              F f_;
              bool actif_ = true;
          };

          auto annulation = GardePortee([&] { compte.solde = ancien; });   // rollback par défaut
          operationRisquee();
          annulation.annuler();                                          // succès : on garde
          ```

          Une classe RAII est généralement **non copiable** (ou déplaçable seulement) pour éviter la double libération.
    exercises:
      - id: cpp-raii-q1
        type: mcq
        prompt: Quel est l’avantage décisif de RAII face aux exceptions ?
        choices: [Les destructeurs libèrent les ressources même quand une exception remonte, Les exceptions sont désactivées, Le programme est plus rapide, Les ressources ne sont jamais libérées]
        answer: 0
      - id: cpp-raii-predict
        type: predict
        prompt: Que va afficher ce programme ?
        code: |
          #include <iostream>
          #include <stdexcept>
          struct Verrou {
              Verrou() { std::cout << "verrouille "; }
              ~Verrou() { std::cout << "déverrouille "; }
          };
