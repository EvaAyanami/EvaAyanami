  # ------------------------------------------------------------------
  - slug: cpp-smart-pointers
    title: Smart pointers
    summary: unique_ptr, shared_ptr et weak_ptr — propriété exclusive ou partagée, make_unique/make_shared et cycles de références.
    minutes: 35
    concepts: [smart-pointers, memoire]
    sections:
      - title: unique_ptr
        body: |
          `std::unique_ptr<T>` **possède** seul un objet du tas et le détruit automatiquement :

          ```cpp
          #include <memory>
          auto p = std::make_unique<Joueur>("Kiri");   // jamais de new explicite
          p->jouer();
          // auto q = p;                // ❌ non copiable
          auto q = std::move(p);        // ✅ transfert de propriété ; p devient nullptr
          ```

          - Coût nul par rapport à un pointeur brut.
          - Idéal pour les objets polymorphes : `std::vector<std::unique_ptr<Forme>>`.
          - Pour passer un objet **sans** transférer la propriété : `Joueur&` ou `Joueur*` (pointeur brut = « observateur »).
      - title: shared_ptr et weak_ptr
        body: |
          `std::shared_ptr<T>` : propriété **partagée** avec comptage de références (atomique) :

          ```cpp
          auto a = std::make_shared<Texture>("herbe.png");
          auto b = a;                         // compteur = 2
          std::cout << a.use_count();         // 2
          b.reset();                          // compteur = 1
          ```

          ⚠️ Deux `shared_ptr` qui se référencent mutuellement ne sont jamais libérés (**cycle**). On casse le cycle avec `std::weak_ptr` :

          ```cpp
          struct Noeud {
              std::vector<std::shared_ptr<Noeud>> enfants;
              std::weak_ptr<Noeud> parent;    // ne possède pas
          };
          if (auto p = noeud->parent.lock()) { /* parent encore vivant */ }
          ```

          Règle : **unique_ptr par défaut**, shared_ptr seulement si la propriété est réellement partagée.
