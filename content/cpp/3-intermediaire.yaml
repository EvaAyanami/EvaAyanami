  # ------------------------------------------------------------------
  - slug: cpp-namespaces
    title: Namespaces
    summary: Organiser le code avec les espaces de noms, imbrication, alias, using et espaces de noms anonymes.
    minutes: 20
    concepts: [modules]
    sections:
      - title: Espaces de noms
        body: |
          Les **espaces de noms** évitent les collisions de noms entre bibliothèques :

          ```cpp
          namespace geometrie {
              constexpr double PI = 3.14159;
              double aireCercle(double r) { return PI * r * r; }

              namespace volumes {                // imbriqué
                  double cube(double c) { return c * c * c; }
              }
          }
          namespace geometrie::plans { /* C++17 : imbrication compacte */ }

          std::cout << geometrie::aireCercle(2);
          std::cout << geometrie::volumes::cube(3);
          ```
      - title: using, alias et anonymes
        body: |
          ```cpp
          using geometrie::aireCercle;      // importe un seul nom (OK dans un .cpp)
          namespace vol = geometrie::volumes; // alias
          vol::cube(2);

          namespace {                       // anonyme : visible uniquement dans ce fichier
              int compteurInterne = 0;      // (équivalent de static pour les globales)
          }
          ```

          Bonnes pratiques :

          - ne **jamais** écrire `using namespace …;` dans un en-tête ;
          - un espace de noms par bibliothèque ou module (`monprojet::reseau`) ;
          - les fonctions libres liées à un type dans le même espace de noms que lui (*ADL* : la recherche dépendante des arguments les trouvera).
    exercises:
      - id: cpp-ns-predict
        type: predict
        prompt: Que va afficher ce programme ?
        code: |
          #include <iostream>
          int x = 1;
          namespace a {
              int x = 2;
              namespace b { int x = 3; }
          }
          int main() {
              namespace ab = a::b;
              int x = 4;
              std::cout << x << ::x << a::x << ab::x << "\n";
          }
        output: '4123'
        explanation: '`::x` désigne la variable globale.'
      - id: cpp-ns-q1
        type: mcq
        prompt: Pourquoi ne pas écrire `using namespace std;` dans un fichier d’en-tête ?
        choices: [Il polluerait tous les fichiers qui incluent l’en-tête, C’est une erreur de compilation, Cela ralentit le programme, Pour la lisibilité seulement]
        answer: 0
      - id: cpp-ns-fill
        type: fill
        prompt: Complète l’alias d’espace de noms.
        code: |
          #include <iostream>
          namespace tres::longue::adresse { int valeur() { return 7; } }
          int main() {
              {{?}} t = tres::longue::adresse;
              std::cout << t::valeur() << "\n";
          }
        blanks: [[namespace]]
        tests:
          - { input: '', output: '7' }
      - id: cpp-ns-code
        type: code
        title: Bibliothèque de conversions
        prompt: |
          Crée `namespace conversions` contenant `namespace longueur { double kmVersMiles(double); }` et `namespace masse { double kgVersLivres(double); }` (facteurs 0.621371 et 2.20462).

          Chaque ligne : `valeur unite` (`km` ou `kg`). Affiche `5.00 km = 3.11 mi` ou `2.00 kg = 4.41 lb`.
        starter: |
          #include <iostream>
          #include <iomanip>
          #include <string>

          int main() {
              double v;
              std::string u;
              std::cout << std::fixed << std::setprecision(2);
              while (std::cin >> v >> u) {
              }
          }
        solution: |
          #include <iostream>
          #include <iomanip>
          #include <string>

          namespace conversions {
              namespace longueur {
                  double kmVersMiles(double km) { return km * 0.621371; }
              }
              namespace masse {
                  double kgVersLivres(double kg) { return kg * 2.20462; }
              }
          }

          int main() {
              double v;
              std::string u;
              std::cout << std::fixed << std::setprecision(2);
              while (std::cin >> v >> u) {
                  if (u == "km") std::cout << v << " km = " << conversions::longueur::kmVersMiles(v) << " mi\n";
                  else std::cout << v << " kg = " << conversions::masse::kgVersLivres(v) << " lb\n";
              }
          }
        tests:
          - { input: "5 km\n2 kg", output: "5.00 km = 3.11 mi\n2.00 kg = 4.41 lb" }
          - { input: 0 kg, output: 0.00 kg = 0.00 lb, hidden: true }
        require:
          - { pattern: 'namespace\s+conversions', message: Créer le namespace conversions }
    project:
      id: cpp-ns-projet
      type: code
      title: Deux bibliothèques, un nom
      difficulty: 2
      prompt: |
        Deux « bibliothèques » définissent chacune une fonction `formater(double)` : `namespace fr` (virgule décimale, 2 décimales, symbole `€` après : `3,50 €`) et `namespace us` (point, `$` avant : `$3.50`).

        Chaque ligne : `fr X` ou `us X`. Affiche le montant formaté. Utilise un espace de noms **anonyme** pour une fonction utilitaire interne `arrondi2(double) -> std::string` qui produit `3.50`.
      starter: |
        #include <iostream>
        #include <string>
        #include <sstream>
        #include <iomanip>

        int main() {
            std::string pays;
            double x;
            while (std::cin >> pays >> x) {
            }
        }
      solution: |
        #include <iostream>
        #include <string>
        #include <sstream>
        #include <iomanip>

        namespace {
            std::string arrondi2(double x) {
                std::ostringstream os;
                os << std::fixed << std::setprecision(2) << x;
                return os.str();
            }
        }

        namespace fr {
            std::string formater(double x) {
                std::string s = arrondi2(x);
                s[s.find('.')] = ',';
                return s + " €";
            }
        }

        namespace us {
            std::string formater(double x) { return "$" + arrondi2(x); }
        }

        int main() {
            std::string pays;
            double x;
            while (std::cin >> pays >> x) {
                std::cout << (pays == "fr" ? fr::formater(x) : us::formater(x)) << "\n";
            }
