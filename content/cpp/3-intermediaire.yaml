                bool ok = std::is_sorted(v.begin(), v.end());
                std::cout << v[0] << " " << ok << " " << *std::max_element(v.begin(), v.end()) << "\n";
            }
          output: 2 0 3
        - id: cpp-stl-ex4
          type: mcq
          prompt: Quel en-tête fournit les vues filter et transform (C++20) ?
          choices: ['<ranges>', '<views>', '<algorithm>', '<functional>']
          answer: 0

  # ------------------------------------------------------------------
  - slug: cpp-vector
    title: std::vector en profondeur
    summary: Capacité et réallocation, reserve, emplace_back, insertion et suppression, l’idiome erase-remove et l’invalidation des itérateurs.
    minutes: 30
    concepts: [collections, vecteurs]
    sections:
      - title: Taille, capacité, réallocation
        body: |
          ```cpp
          std::vector<int> v;
          v.reserve(100);              // réserve la place, size() reste 0
          std::cout << v.size() << " " << v.capacity();   // 0 100
          v.push_back(1);
          v.emplace_back(2);           // construit sur place
          v.resize(5);                 // taille 5, complète avec 0
          v.shrink_to_fit();           // demande à libérer la capacité inutile
          ```

          Quand `size() == capacity()`, un ajout **réalloue** (souvent ×2) et copie/déplace tous les éléments : `reserve` évite ces réallocations si la taille finale est connue.
      - title: Supprimer et invalider
        body: |
          ```cpp
          v.erase(v.begin() + 2);                       // supprime l’indice 2
          v.insert(v.begin(), 99);                      // insère en tête (O(n))
          std::erase_if(v, [](int x) { return x < 0; }); // C++20 : supprime selon un critère
          // Avant C++20 : l’idiome erase-remove
          v.erase(std::remove(v.begin(), v.end(), 0), v.end());
          ```

          ⚠️ **Invalidation** : une réallocation invalide **tous** les itérateurs, pointeurs et références vers les éléments ; `erase`/`insert` invalident ceux qui suivent la position. Ne jamais garder `&v[0]` puis faire `push_back` !
    exercises:
      - id: cpp-vec-predict
        type: predict
        prompt: Que va afficher ce programme ?
        code: |
          #include <iostream>
          #include <vector>
          #include <algorithm>
          int main() {
              std::vector<int> v{1, 0, 2, 0, 3};
              v.erase(std::remove(v.begin(), v.end(), 0), v.end());
              v.insert(v.begin() + 1, 9);
              v.resize(5, 7);
              for (int x : v) std::cout << x;
              std::cout << " " << v.size() << "\n";
          }
        output: '19237 5'
      - id: cpp-vec-q1
        type: mcq
        prompt: Que fait reserve(n) ?
        choices: [Réserve de la capacité sans changer la taille, Ajoute n éléments, Supprime n éléments, Trie le vecteur]
        answer: 0
      - id: cpp-vec-bug
        type: bugfix
        prompt: Ce programme garde un pointeur qui peut être invalidé. Trouve la ligne à l’origine du problème.
        code: |
          #include <iostream>
          #include <vector>
          int main() {
              std::vector<int> v{1, 2, 3};
              int* premier = &v[0];
              for (int i = 0; i < 1000; ++i) v.push_back(i);
              std::cout << *premier << "\n";
          }
        bugLines: [6]
        choices:
          - Les push_back peuvent réallouer le vecteur et invalider le pointeur premier
          - '&v[0] est interdit'
          - La boucle est infinie
        answer: 0
        solution: |
          #include <iostream>
          #include <vector>
          int main() {
              std::vector<int> v{1, 2, 3};
              for (int i = 0; i < 1000; ++i) v.push_back(i);
              int* premier = &v[0];
              std::cout << *premier << "\n";
          }
        tests:
          - { input: '', output: '1' }
      - id: cpp-vec-code
        type: code
        title: Nettoyage de données
        prompt: |
          Lis `n` puis `n` entiers. Supprime les valeurs négatives avec `std::erase_if`, supprime les doublons (après tri, avec `std::unique` + `erase`), puis affiche la taille et les valeurs restantes.
        starter: |
          #include <iostream>
          #include <vector>
          #include <algorithm>

          int main() {
              int n;
              std::cin >> n;
              std::vector<int> v(n);
              for (auto& x : v) std::cin >> x;
          }
        solution: |
          #include <iostream>
          #include <vector>
          #include <algorithm>

          int main() {
              int n;
              std::cin >> n;
              std::vector<int> v(n);
              for (auto& x : v) std::cin >> x;
              std::erase_if(v, [](int x) { return x < 0; });
              std::sort(v.begin(), v.end());
              v.erase(std::unique(v.begin(), v.end()), v.end());
              std::cout << v.size() << "\n";
              for (std::size_t i = 0; i < v.size(); ++i) std::cout << (i ? " " : "") << v[i];
              std::cout << "\n";
          }
        tests:
          - { input: "8\n5 -1 3 5 0 -7 3 9", output: "4\n0 3 5 9" }
          - { input: "2\n-1 -2", output: "0\n", hidden: true }
        require:
          - { pattern: 'erase_if', message: Utiliser std::erase_if }
          - { pattern: 'unique', message: Utiliser std::unique }
    project:
      id: cpp-vec-projet
      type: code
      title: Matrice et transposée
      difficulty: 3
      prompt: |
        Lis `l c` puis une matrice `l × c` d’entiers. Stocke-la dans un **unique** `std::vector<int>` de taille `l*c` (indice `i*c + j`). Affiche la transposée (`c × l`), puis la somme de chaque ligne de la matrice d’origine séparées par des espaces.
      starter: |
        #include <iostream>
        #include <vector>

        int main() {
            int l, c;
            std::cin >> l >> c;
            std::vector<int> m(l * c);
            for (auto& x : m) std::cin >> x;
        }
      solution: |
        #include <iostream>
        #include <vector>

        int main() {
            int l, c;
            std::cin >> l >> c;
            std::vector<int> m(l * c);
            for (auto& x : m) std::cin >> x;
            for (int j = 0; j < c; ++j) {
                for (int i = 0; i < l; ++i) std::cout << (i ? " " : "") << m[i * c + j];
                std::cout << "\n";
            }
            for (int i = 0; i < l; ++i) {
                long long s = 0;
                for (int j = 0; j < c; ++j) s += m[i * c + j];
                std::cout << (i ? " " : "") << s;
            }
            std::cout << "\n";
        }
      tests:
        - { input: "2 3\n1 2 3\n4 5 6", output: "1 4\n2 5\n3 6\n6 15" }
        - { input: "1 1\n7", output: "7\n7", hidden: true }
    exam:
      pass: 70
      questions:
        - id: cpp-vec-ex1
          type: mcq
          prompt: Qu’invalide une réallocation de vector ?
          choices: ['Tous les itérateurs, pointeurs et références vers les éléments', 'Rien', 'Seulement end()', 'Seulement le premier élément']
          answer: 0
        - id: cpp-vec-ex2
          type: mcq
          prompt: Que fait std::remove seul (sans erase) ?
          choices: [Déplace les éléments conservés au début et renvoie la nouvelle fin logique, Supprime réellement les éléments, Trie le vecteur, Vide le vecteur]
          answer: 0
        - id: cpp-vec-ex3
          type: mcq
          prompt: Complexité d’un insert en tête de vector ?
          choices: ['O(n)', 'O(1)', 'O(log n)', 'O(n²)']
          answer: 0
        - id: cpp-vec-ex4
          type: mcq
          prompt: Quelle fonction C++20 supprime les éléments vérifiant un critère ?
          choices: ['std::erase_if', 'std::remove_all', 'v.filter', 'std::drop']
          answer: 0

  # ------------------------------------------------------------------
  - slug: cpp-map
    title: Map
    summary: std::map (trié) et std::unordered_map (hachage) — insertion, recherche, piège de operator[], parcours et comptage.
    minutes: 30
    concepts: [hashmap, collections]
    sections:
      - title: map et unordered_map
        body: |
          ```cpp
          #include <map>
          #include <unordered_map>

          std::map<std::string, int> ages{{"Ada", 36}, {"Bob", 25}};
          ages["Kiri"] = 16;                      // insère ou modifie
          ages.insert({"Zoe", 30});               // n’écrase pas si la clé existe
          if (auto it = ages.find("Bob"); it != ages.end()) std::cout << it->second;
          if (ages.contains("Ada")) { /* C++20 */ }
          ages.erase("Bob");
          for (const auto& [nom, age] : ages) std::cout << nom << " " << age << "\n"; // trié par clé
          ```

          | | `std::map` | `std::unordered_map` |
          |---|---|---|
          | Structure | arbre rouge-noir | table de hachage |
          | Ordre | trié par clé | aucun |
          | Recherche | O(log n) | O(1) en moyenne |
      - title: Le piège de operator[]
        body: |
          `m[cle]` **crée** l’entrée (avec une valeur par défaut) si elle n’existe pas — même pour une simple lecture !

          ```cpp
          std::map<std::string, int> m;
          if (m["absent"] == 0) { }   // ⚠️ insère "absent" → 0
          std::cout << m.size();     // 1
          ```

          Pour lire sans insérer : `find`, `contains`, `count` ou `at` (qui lève `std::out_of_range`).

          Le comptage d’occurrences, lui, profite de ce comportement : `++compteur[mot];`.
    exercises:
      - id: cpp-map-predict
        type: predict
        prompt: Que va afficher ce programme ?
        code: |
          #include <iostream>
          #include <map>
          #include <string>
          int main() {
              std::map<std::string, int> m;
              for (std::string mot : {"b", "a", "b", "c", "b"}) ++m[mot];
              if (m["z"] == 0) std::cout << "absent ";
              for (const auto& [k, v] : m) std::cout << k << v;
              std::cout << " " << m.size() << "\n";
          }
        output: absent a1b3c1z0 4
      - id: cpp-map-q1
        type: mcq
        prompt: Quelle structure garantit le parcours dans l’ordre des clés ?
        choices: ['std::map', 'std::unordered_map', 'std::vector', 'std::unordered_set']
        answer: 0
      - id: cpp-map-fill
        type: fill
        prompt: Complète la boucle avec des structured bindings.
        code: |
          #include <iostream>
          #include <map>
          int main() {
              std::map<int, char> m{{2, 'b'}, {1, 'a'}};
              for (const auto& [{{?}}, {{?}}] : m) std::cout << k << v;
              std::cout << "\n";
          }
        blanks: [[k], [v]]
        tests:
          - { input: '', output: 1a2b }
      - id: cpp-map-code
        type: code
        title: Mots les plus fréquents
        prompt: |
          Lis un texte (mots séparés par des espaces, en minuscules), compte les occurrences avec un `std::unordered_map`, puis affiche les 3 mots les plus fréquents (`mot : n`), par fréquence décroissante puis ordre alphabétique.
        starter: |
          #include <iostream>
          #include <string>
          #include <unordered_map>
          #include <vector>
          #include <algorithm>

          int main() {
              std::unordered_map<std::string, int> freq;
              std::string mot;
              while (std::cin >> mot) ++freq[mot];
          }
        solution: |
          #include <iostream>
          #include <string>
          #include <unordered_map>
          #include <vector>
          #include <algorithm>

          int main() {
              std::unordered_map<std::string, int> freq;
              std::string mot;
              while (std::cin >> mot) ++freq[mot];
              std::vector<std::pair<std::string, int>> v(freq.begin(), freq.end());
              std::sort(v.begin(), v.end(), [](const auto& a, const auto& b) {
                  return a.second != b.second ? a.second > b.second : a.first < b.first;
              });
              for (std::size_t i = 0; i < v.size() && i < 3; ++i) std::cout << v[i].first << " : " << v[i].second << "\n";
          }
        tests:
          - { input: le chat voit le chien et le chat fuit, output: "le : 3\nchat : 2\nchien : 1" }
          - { input: solo, output: 'solo : 1', hidden: true }
    project:
      id: cpp-map-projet
      type: code
      title: Annuaire
      difficulty: 3
      prompt: |
        Commandes : `ajouter nom numero` (refuse si le nom existe : `existe déjà`), `chercher nom` (`nom : numero` ou `inconnu`), `supprimer nom` (`supprimé` ou `inconnu`), `lister` (tous les contacts triés `nom : numero`, ou `(vide)`). Utilise un `std::map` et **jamais** `operator[]` pour la lecture.
      starter: |
        #include <iostream>
        #include <map>
        #include <string>

        int main() {
            std::map<std::string, std::string> annuaire;
            std::string cmd;
            while (std::cin >> cmd) {
            }
        }
      solution: |
        #include <iostream>
        #include <map>
        #include <string>

        int main() {
            std::map<std::string, std::string> annuaire;
            std::string cmd, nom, num;
            while (std::cin >> cmd) {
                if (cmd == "ajouter") {
                    std::cin >> nom >> num;
                    if (!annuaire.insert({nom, num}).second) std::cout << "existe déjà\n";
                } else if (cmd == "chercher") {
                    std::cin >> nom;
                    if (auto it = annuaire.find(nom); it != annuaire.end()) std::cout << nom << " : " << it->second << "\n";
                    else std::cout << "inconnu\n";
                } else if (cmd == "supprimer") {
                    std::cin >> nom;
                    std::cout << (annuaire.erase(nom) ? "supprimé" : "inconnu") << "\n";
                } else {
                    if (annuaire.empty()) std::cout << "(vide)\n";
                    for (const auto& [n, t] : annuaire) std::cout << n << " : " << t << "\n";
                }
            }
        }
      tests:
        - { input: "ajouter Zoe 01\najouter Ada 02\najouter Ada 03\nchercher Ada\nchercher Bob\nsupprimer Zoe\nlister", output: "existe déjà\nAda : 02\ninconnu\nsupprimé\nAda : 02" }
        - { input: "lister\nsupprimer X", output: "(vide)\ninconnu", hidden: true }
    exam:
      pass: 70
      questions:
        - id: cpp-map-ex1
          type: mcq
          prompt: Que se passe-t-il avec `m["x"]` si "x" n’existe pas ?
          choices: [Une entrée est créée avec une valeur par défaut, Exception, Renvoie nullptr, Erreur de compilation]
          answer: 0
        - id: cpp-map-ex2
