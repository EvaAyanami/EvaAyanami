  - slug: cpp-surcharge-operateurs
    title: Surcharge d’opérateurs
    summary: Donner un sens aux opérateurs pour ses types — arithmétique, comparaison, flux <<, indexation, appel et règles de conception.
    minutes: 30
    concepts: [operateurs, classes]
    sections:
      - title: Les opérateurs courants
        body: |
          ```cpp
          struct Vec2 {
              double x, y;
              Vec2 operator+(const Vec2& o) const { return {x + o.x, y + o.y}; }
              Vec2& operator+=(const Vec2& o) { x += o.x; y += o.y; return *this; }
              Vec2 operator*(double k) const { return {x * k, y * k}; }
              bool operator==(const Vec2&) const = default;
          };
          Vec2 operator*(double k, const Vec2& v) { return v * k; }   // k * v (fonction libre)

          std::ostream& operator<<(std::ostream& o, const Vec2& v) {   // affichage
              return o << "(" << v.x << ", " << v.y << ")";
          }
          ```

          Règle : implémenter `+` à partir de `+=`, et `<<` comme **fonction libre** (le membre de gauche est le flux).
      - title: Indexation, appel et comparaison
        body: |
          ```cpp
          class Matrice {
          public:
              double& operator()(int i, int j) { return d[i * c + j]; }        // m(1, 2)
              double operator()(int i, int j) const { return d[i * c + j]; }
          };

          class Polynome {
          public:
              double operator()(double x) const;   // un objet « appelable » (foncteur)
              double& operator[](std::size_t i) { return coef[i]; }
          };
          ```

          C++20 : `auto operator<=>(const T&) const = default;` génère `<`, `<=`, `>`, `>=`.

          Bonnes pratiques : respecter la **sémantique attendue** (`+` ne doit pas soustraire !), offrir les versions `const`, ne pas surcharger `&&`, `||` ou `,`.
