          #include <iostream>
          #include <vector>
          #include <algorithm>
          #include <numeric>
          int main() {
              std::vector<int> v{4, 7, 1, 8, 3};
              std::sort(v.begin(), v.end());
              int n = std::count_if(v.begin(), v.end(), [](int x) { return x > 3; });
              int s = std::accumulate(v.begin(), v.end(), 0);
              std::cout << v[0] << v[4] << " " << n << " " << s << "\n";
          }
        output: 18 3 23
      - id: cpp-stl-fill
        type: fill
        prompt: Complète pour doubler chaque élément avec std::transform.
        code: |
          #include <iostream>
          #include <vector>
          #include <algorithm>
          int main() {
              std::vector<int> v{1, 2, 3};
              std::{{?}}(v.begin(), v.end(), v.begin(), [](int x) { return x * 2; });
              for (int x : v) std::cout << x;
              std::cout << "\n";
          }
        blanks: [[transform]]
        tests:
          - { input: '', output: '246' }
      - id: cpp-stl-code
        type: code
        title: Statistiques avec la STL
        prompt: |
          Lis `n` puis `n` entiers. **Sans écrire de boucle for/while pour les calculs** (seulement pour la lecture), affiche : la somme, le nombre de valeurs négatives, et les valeurs triées par ordre décroissant (séparées par des espaces). Utilise `accumulate`, `count_if`, `sort` avec `std::greater<int>()`.
        starter: |
          #include <iostream>
          #include <vector>
          #include <algorithm>
          #include <numeric>
          #include <functional>

          int main() {
              int n;
              std::cin >> n;
              std::vector<long long> v(n);
              for (auto& x : v) std::cin >> x;
          }
        solution: |
          #include <iostream>
          #include <vector>
          #include <algorithm>
          #include <numeric>
          #include <functional>

          int main() {
              int n;
              std::cin >> n;
              std::vector<long long> v(n);
              for (auto& x : v) std::cin >> x;
              std::cout << std::accumulate(v.begin(), v.end(), 0LL) << "\n";
              std::cout << std::count_if(v.begin(), v.end(), [](long long x) { return x < 0; }) << "\n";
              std::sort(v.begin(), v.end(), std::greater<long long>());
              for (std::size_t i = 0; i < v.size(); ++i) std::cout << (i ? " " : "") << v[i];
              std::cout << "\n";
          }
        tests:
          - { input: "5\n3 -1 4 -1 5", output: "10\n2\n5 4 3 -1 -1" }
          - { input: "1\n0", output: "0\n0\n0", hidden: true }
        require:
          - { pattern: 'accumulate', message: Utiliser std::accumulate }
          - { pattern: 'count_if', message: Utiliser std::count_if }
    project:
      id: cpp-stl-projet
      type: code
      title: Classement de joueurs
      difficulty: 3
      prompt: |
        Chaque ligne : `nom score`. Avec les algorithmes de la STL :

        - trie les joueurs par score décroissant puis nom croissant (`std::sort` + lambda) ;
        - affiche le podium (`1. nom (score)` … jusqu’à 3) ;
        - affiche `Moyenne : X.X` ;
        - affiche `Au-dessus : a, b, …` (joueurs dont le score dépasse la moyenne, dans l’ordre du classement) en utilisant `std::copy_if` vers un vecteur.
      starter: |
        #include <iostream>
        #include <vector>
        #include <string>
        #include <algorithm>
        #include <numeric>
        #include <iomanip>

        struct Joueur { std::string nom; int score; };

        int main() {
            std::vector<Joueur> js;
            Joueur j;
            while (std::cin >> j.nom >> j.score) js.push_back(j);
        }
      solution: |
        #include <iostream>
        #include <vector>
        #include <string>
        #include <algorithm>
        #include <numeric>
        #include <iomanip>

        struct Joueur { std::string nom; int score; };

        int main() {
            std::vector<Joueur> js;
            Joueur j;
            while (std::cin >> j.nom >> j.score) js.push_back(j);
            std::sort(js.begin(), js.end(), [](const Joueur& a, const Joueur& b) {
                return a.score != b.score ? a.score > b.score : a.nom < b.nom;
            });
            for (std::size_t i = 0; i < js.size() && i < 3; ++i)
                std::cout << i + 1 << ". " << js[i].nom << " (" << js[i].score << ")\n";
            double moyenne = std::accumulate(js.begin(), js.end(), 0.0, [](double s, const Joueur& x) { return s + x.score; }) / js.size();
            std::cout << "Moyenne : " << std::fixed << std::setprecision(1) << moyenne << "\n";
            std::vector<Joueur> dessus;
            std::copy_if(js.begin(), js.end(), std::back_inserter(dessus), [&](const Joueur& x) { return x.score > moyenne; });
            std::cout << "Au-dessus : ";
            for (std::size_t i = 0; i < dessus.size(); ++i) std::cout << (i ? ", " : "") << dessus[i].nom;
            std::cout << "\n";
        }
      tests:
        - { input: "Ada 90\nBob 70\nZoe 90\nKiri 85", output: "1. Ada (90)\n2. Zoe (90)\n3. Kiri (85)\nMoyenne : 83.8\nAu-dessus : Ada, Zoe, Kiri" }
        - { input: "Solo 10", output: "1. Solo (10)\nMoyenne : 10.0\nAu-dessus : ", hidden: true }
      require:
        - { pattern: 'copy_if', message: Utiliser std::copy_if }
    exam:
