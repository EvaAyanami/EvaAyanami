  # ------------------------------------------------------------------
  - slug: cpp-iterateurs
    title: Itérateurs
    summary: Catégories d’itérateurs, begin/end, itérateurs inverses et constants, adaptateurs d’insertion et écriture de son propre itérateur.
    minutes: 30
    concepts: [iterateurs]
    sections:
      - title: Le concept d’itérateur
        body: |
          Un itérateur généralise le pointeur : `*it` (valeur), `++it` (suivant), `it == fin`.

          ```cpp
          std::vector<int> v{1, 2, 3};
          for (auto it = v.begin(); it != v.end(); ++it) *it *= 2;
          for (auto it = v.rbegin(); it != v.rend(); ++it) std::cout << *it;  // à l’envers
          for (auto it = v.cbegin(); it != v.cend(); ++it) { /* lecture seule */ }
          ```

          | Catégorie | Opérations | Exemple |
          |---|---|---|
          | input / output | lecture ou écriture, un seul passage | `istream_iterator` |
          | forward | `++`, plusieurs passages | `forward_list` |
          | bidirectionnel | `++`, `--` | `list`, `map`, `set` |
          | accès aléatoire | `it + n`, `it[n]`, `<` | `vector`, `deque` |
          | contigu (C++20) | mémoire contiguë | `vector`, `array` |

          `std::sort` exige un accès aléatoire : il ne fonctionne pas sur une `std::list` (qui a sa propre méthode `sort`).
      - title: Outils autour des itérateurs
        body: |
          ```cpp
          std::distance(v.begin(), it);            // nombre de pas
          std::advance(it, 2); auto j = std::next(it);
          std::copy(v.begin(), v.end(), std::back_inserter(w));   // ajoute à w
          std::copy(v.begin(), v.end(), std::ostream_iterator<int>(std::cout, " "));
          std::vector<int> lus{std::istream_iterator<int>(std::cin), {}}; // lit tout stdin
          ```

          Un type devient itérable dans une boucle `for (x : obj)` s’il fournit `begin()` et `end()` renvoyant des objets qui supportent `*`, `++` et `!=`.
