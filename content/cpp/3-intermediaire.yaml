          - { input: '', output: négatif }
      - id: cpp-exc-code
        type: code
        title: Conversion robuste
        prompt: |
          Pour chaque mot lu, convertis-le en entier avec `std::stoi` et attrape les exceptions : affiche le double de la valeur, `invalide : <mot>` (`std::invalid_argument`) ou `trop grand : <mot>` (`std::out_of_range`). Un mot comme `12abc` est accepté par stoi (il lit `12`) : refuse-le aussi en vérifiant le nombre de caractères lus (`pos`).
        starter: |
          #include <iostream>
          #include <string>
          #include <stdexcept>

          int main() {
              std::string mot;
              while (std::cin >> mot) {
              }
          }
        solution: |
          #include <iostream>
          #include <string>
          #include <stdexcept>

          int main() {
              std::string mot;
              while (std::cin >> mot) {
                  try {
                      std::size_t pos = 0;
                      int n = std::stoi(mot, &pos);
                      if (pos != mot.size()) throw std::invalid_argument("reste");
                      std::cout << 2LL * n << "\n";
                  } catch (const std::invalid_argument&) {
                      std::cout << "invalide : " << mot << "\n";
                  } catch (const std::out_of_range&) {
                      std::cout << "trop grand : " << mot << "\n";
                  }
              }
          }
        tests:
          - { input: 21 abc 99999999999 12abc -4, output: "42\ninvalide : abc\ntrop grand : 99999999999\ninvalide : 12abc\n-8" }
          - { input: '0', output: '0', hidden: true }
        concepts: [erreurs]
    project:
      id: cpp-exc-projet
      type: code
      title: Banque avec exceptions
      difficulty: 3
      prompt: |
        Définis une exception `SoldeInsuffisant` (dérivée de `std::runtime_error`) qui stocke le montant manquant, et une classe `Compte` dont `retirer` lève cette exception et `deposer` lève `std::invalid_argument` pour un montant ≤ 0.

        Commandes `depot X` / `retrait X` (solde initial 0). Affiche le solde après chaque opération réussie, `erreur : montant invalide` ou `erreur : solde insuffisant (manque M)`.
      starter: |
        #include <iostream>
        #include <stdexcept>
        #include <string>

        int main() {
            std::string cmd;
            long long x;
            while (std::cin >> cmd >> x) {
            }
        }
      solution: |
        #include <iostream>
        #include <stdexcept>
        #include <string>

        class SoldeInsuffisant : public std::runtime_error {
        public:
            explicit SoldeInsuffisant(long long manque) : std::runtime_error("solde insuffisant"), manque_(manque) {}
            long long manque() const { return manque_; }
        private:
            long long manque_;
        };

        class Compte {
        public:
            void deposer(long long m) {
                if (m <= 0) throw std::invalid_argument("montant invalide");
                solde_ += m;
            }
            void retirer(long long m) {
                if (m <= 0) throw std::invalid_argument("montant invalide");
                if (m > solde_) throw SoldeInsuffisant(m - solde_);
                solde_ -= m;
            }
            long long solde() const { return solde_; }
        private:
            long long solde_ = 0;
        };

        int main() {
            Compte c;
            std::string cmd;
            long long x;
            while (std::cin >> cmd >> x) {
                try {
                    if (cmd == "depot") c.deposer(x); else c.retirer(x);
                    std::cout << c.solde() << "\n";
                } catch (const SoldeInsuffisant& e) {
                    std::cout << "erreur : " << e.what() << " (manque " << e.manque() << ")\n";
                } catch (const std::invalid_argument& e) {
                    std::cout << "erreur : " << e.what() << "\n";
                }
            }
        }
      tests:
        - { input: "depot 100\nretrait 30\nretrait 100\ndepot -5", output: "100\n70\nerreur : solde insuffisant (manque 30)\nerreur : montant invalide" }
        - { input: "retrait 1", output: 'erreur : solde insuffisant (manque 1)', hidden: true }
      require:
        - { pattern: 'class\s+SoldeInsuffisant\s*:\s*public\s+std::runtime_error', message: SoldeInsuffisant doit dériver de std::runtime_error }
    exam:
      pass: 70
      questions:
        - id: cpp-exc-ex1
          type: mcq
          prompt: Que garantit noexcept ?
          choices: [La fonction ne lève pas d’exception (sinon arrêt du programme), Elle est plus rapide, Elle est const, Elle attrape tout]
          answer: 0
        - id: cpp-exc-ex2
          type: mcq
          prompt: Que fait catch (...) ?
          choices: [Attrape n’importe quelle exception, Ne compile pas, Relance l’exception, Ignore les erreurs de compilation]
          answer: 0
        - id: cpp-exc-ex3
          type: mcq
          prompt: Qu’est-ce que la garantie forte ?
          choices: ['En cas d’exception, l’état reste celui d’avant l’opération', 'Aucune exception possible', 'Le programme s’arrête', 'La mémoire est libérée']
          answer: 0

  # ------------------------------------------------------------------
  - slug: cpp-fichiers
    title: Fichiers
    summary: Lire et écrire des fichiers avec fstream, lecture ligne par ligne, flux de chaînes, mode binaire et std::filesystem.
    minutes: 30
    concepts: [fichiers, systeme]
    sections:
      - title: fstream
        body: |
          ```cpp
          #include <fstream>

          {
              std::ofstream out("notes.txt");               // ouvre (et crée) en écriture
              out << "Ada 18\nBob 12\n";
          }                                                  // fermé automatiquement (RAII)

          std::ifstream in("notes.txt");
          if (!in) { std::cerr << "ouverture impossible\n"; return 1; }
          std::string nom; int note;
          while (in >> nom >> note) std::cout << nom << " : " << note << "\n";

          std::ofstream journal("app.log", std::ios::app); // ajout en fin de fichier
          ```

          Lecture ligne par ligne : `std::string ligne; while (std::getline(in, ligne)) { … }`.
      - title: Flux de chaînes et filesystem
        body: |
          `std::istringstream` découpe une ligne comme un flux ; `std::ostringstream` construit une chaîne :

          ```cpp
          std::istringstream is("12;34;56");
          std::string champ;
          while (std::getline(is, champ, ';')) std::cout << std::stoi(champ) << "\n";
          ```

          `<filesystem>` (C++17) manipule les chemins et répertoires :

          ```cpp
          namespace fs = std::filesystem;
          fs::create_directories("donnees/cache");
          for (const auto& e : fs::directory_iterator(".")) std::cout << e.path().filename() << "\n";
          std::cout << fs::file_size("notes.txt") << " " << fs::path("a/b.txt").extension();
          ```

          Mode binaire : `std::ifstream f("img.bin", std::ios::binary); f.read(buffer, n);`.
