      - id: cpp-it-code
        type: code
        title: Un intervalle itérable
        prompt: |
          Écris une classe `Intervalle(debut, fin, pas)` utilisable dans une boucle `for (int x : Intervalle(…))` : elle fournit `begin()` et `end()` renvoyant un itérateur maison (opérateurs `*`, `++`, `!=`). L’itération s’arrête dès que la valeur atteint ou dépasse `fin` (pas positif).

          Pour chaque ligne `debut fin pas`, affiche les valeurs séparées par des espaces.
        starter: |
          #include <iostream>

          int main() {
              int d, f, p;
              while (std::cin >> d >> f >> p) {
                  bool premier = true;
                  for (int x : Intervalle(d, f, p)) { std::cout << (premier ? "" : " ") << x; premier = false; }
                  std::cout << "\n";
              }
          }
        solution: |
          #include <iostream>

          class Intervalle {
          public:
              Intervalle(int d, int f, int p) : d_(d), f_(f), p_(p) {}
              class Iterateur {
              public:
                  Iterateur(int v, int f, int p) : v_(v), f_(f), p_(p) {}
                  int operator*() const { return v_; }
                  Iterateur& operator++() { v_ += p_; return *this; }
                  bool operator!=(const Iterateur&) const { return v_ < f_; }
              private:
                  int v_, f_, p_;
              };
              Iterateur begin() const { return {d_, f_, p_}; }
              Iterateur end() const { return {f_, f_, p_}; }
          private:
              int d_, f_, p_;
          };

          int main() {
              int d, f, p;
              while (std::cin >> d >> f >> p) {
                  bool premier = true;
                  for (int x : Intervalle(d, f, p)) { std::cout << (premier ? "" : " ") << x; premier = false; }
                  std::cout << "\n";
              }
          }
        tests:
          - { input: "0 10 3\n5 6 1", output: "0 3 6 9\n5" }
          - { input: "4 4 1\n-3 3 2", output: "\n-3 -1 1", hidden: true }
        concepts: [iterateurs]
