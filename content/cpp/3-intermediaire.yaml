      - id: cpp-ops-code
        type: code
        title: Nombres complexes
        prompt: |
          Écris une struct `Complexe { double re, im; }` avec `+`, `-`, `*`, `==` et `<<` (format `a+bi` ou `a-bi`, nombres affichés tels quels par cout).

          Chaque ligne : `a b op c d`. Affiche le résultat de `(a+bi) op (c+di)` (op parmi `+ - * =`; pour `=` affiche `vrai` ou `faux`).
        starter: |
