              if (echec) throw std::runtime_error("x");
              std::cout << "travail ";
          }
          int main() {
              travail(false);
              try { travail(true); } catch (...) { std::cout << "erreur "; }
              std::cout << "\n";
          }
        output: verrouille travail déverrouille verrouille déverrouille erreur
      - id: cpp-raii-q2
        type: mcq
        prompt: Pourquoi une classe RAII est-elle souvent non copiable ?
        choices: [Pour éviter que deux objets libèrent la même ressource, Pour économiser de la mémoire, C’est imposé par le compilateur, Pour l’héritage]
        answer: 0
      - id: cpp-raii-code
        type: code
        title: Transaction annulable
        prompt: |
          Écris une classe `Transaction` qui mémorise le solde d’un compte à sa construction et le **restaure** dans son destructeur, sauf si `valider()` a été appelée.

          Chaque ligne d’entrée est une suite d’opérations à appliquer de façon atomique au compte (solde initial 100) : `+X` ou `-X`. Si un retrait rend le solde négatif, lève une exception : la transaction est annulée. Affiche `ok : solde` ou `annulée : solde`.
        starter: |
          #include <iostream>
          #include <sstream>
          #include <stdexcept>
          #include <string>

          int main() {
              long long solde = 100;
              std::string ligne;
              while (std::getline(std::cin, ligne)) {
              }
          }
        solution: |
          #include <iostream>
          #include <sstream>
          #include <stdexcept>
          #include <string>

          class Transaction {
          public:
              explicit Transaction(long long& solde) : solde_(solde), sauvegarde_(solde) {}
              ~Transaction() { if (!valide_) solde_ = sauvegarde_; }
              void valider() { valide_ = true; }
              Transaction(const Transaction&) = delete;
              Transaction& operator=(const Transaction&) = delete;
          private:
              long long& solde_;
              long long sauvegarde_;
              bool valide_ = false;
          };

          int main() {
              long long solde = 100;
              std::string ligne;
              while (std::getline(std::cin, ligne)) {
                  try {
                      Transaction t(solde);
                      std::istringstream is(ligne);
                      std::string op;
                      while (is >> op) {
                          long long v = std::stoll(op.substr(1));
                          if (op[0] == '+') solde += v;
                          else {
                              solde -= v;
                              if (solde < 0) throw std::runtime_error("découvert");
                          }
                      }
                      t.valider();
                      std::cout << "ok : " << solde << "\n";
                  } catch (const std::exception&) {
                      std::cout << "annulée : " << solde << "\n";
                  }
              }
          }
        tests:
          - { input: "+50 -30\n-500 +1000\n-120", output: "ok : 120\nannulée : 120\nok : 0" }
          - { input: "-101", output: 'annulée : 100', hidden: true }
        require:
          - { pattern: '~Transaction', message: Écrire le destructeur de Transaction }
    project:
      id: cpp-raii-projet
      type: code
      title: Pool de connexions RAII
      difficulty: 3
      prompt: |
        Un pool possède `N` connexions numérotées de 1 à N. `Pool::emprunter()` renvoie un objet RAII `Bail` (non copiable, mais **déplaçable**) qui contient le numéro de la connexion empruntée et la **rend au pool** dans son destructeur. S’il n’y a plus de connexion libre, `emprunter` lève `std::runtime_error("pool épuisé")`. Le pool redonne toujours la plus petite connexion libre.

        Première ligne : N. Commandes : `prendre nom` (stocke le bail sous ce nom dans une `std::map<std::string, Bail>` ; affiche `nom -> connexion k` ou `nom : pool épuisé`), `rendre nom` (supprime le bail ; affiche `nom a rendu`), `libres` (affiche le nombre de connexions libres).
      starter: |
        #include <iostream>
        #include <map>
        #include <set>
        #include <stdexcept>
        #include <string>

        int main() {
            int n;
            std::cin >> n;
        }
      solution: |
        #include <iostream>
        #include <map>
        #include <set>
        #include <stdexcept>
        #include <string>

        class Pool;

        class Bail {
        public:
            Bail(Pool* p, int id) : pool_(p), id_(id) {}
            Bail(Bail&& o) noexcept : pool_(o.pool_), id_(o.id_) { o.pool_ = nullptr; }
            Bail& operator=(Bail&&) = delete;
            Bail(const Bail&) = delete;
            ~Bail();
            int id() const { return id_; }
        private:
            Pool* pool_;
            int id_;
        };

        class Pool {
        public:
            explicit Pool(int n) { for (int i = 1; i <= n; ++i) libres_.insert(i); }
            Bail emprunter() {
                if (libres_.empty()) throw std::runtime_error("pool épuisé");
                int id = *libres_.begin();
                libres_.erase(libres_.begin());
                return Bail(this, id);
            }
            void rendre(int id) { libres_.insert(id); }
            std::size_t nbLibres() const { return libres_.size(); }
        private:
            std::set<int> libres_;
        };

        Bail::~Bail() { if (pool_) pool_->rendre(id_); }

        int main() {
            int n;
            std::cin >> n;
            Pool pool(n);
            std::map<std::string, Bail> baux;
            std::string cmd, nom;
            while (std::cin >> cmd) {
                if (cmd == "prendre") {
                    std::cin >> nom;
                    try {
                        auto [it, ok] = baux.emplace(nom, pool.emprunter());
                        std::cout << nom << " -> connexion " << it->second.id() << "\n";
                    } catch (const std::runtime_error& e) {
                        std::cout << nom << " : " << e.what() << "\n";
                    }
                } else if (cmd == "rendre") {
                    std::cin >> nom;
                    baux.erase(nom);
                    std::cout << nom << " a rendu\n";
                } else {
                    std::cout << pool.nbLibres() << "\n";
                }
            }
        }
      tests:
        - { input: "2\nprendre a\nprendre b\nprendre c\nlibres\nrendre a\nprendre c\nlibres", output: "a -> connexion 1\nb -> connexion 2\nc : pool épuisé\n0\na a rendu\nc -> connexion 1\n0" }
        - { input: "1\nlibres\nprendre x\nrendre x\nlibres", output: "1\nx -> connexion 1\nx a rendu\n1", hidden: true }
