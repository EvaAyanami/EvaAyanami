    project:
      id: cpp-tpl-projet
      type: code
      title: File circulaire générique
      difficulty: 3
      prompt: |
        Implémente `template <typename T, std::size_t N> class FileCirculaire` basée sur un `std::array<T, N>` : `bool enfiler(const T&)` (false si pleine), `std::optional<T> defiler()`, `std::size_t taille() const`.

        Instancie une `FileCirculaire<int, 3>` et une `FileCirculaire<std::string, 2>`. Commandes : `+i X`, `-i`, `+s MOT`, `-s`. Affiche `ok`/`pleine` pour un ajout, la valeur ou `vide` pour un retrait. Termine par les tailles des deux files.
      starter: |
        #include <iostream>
        #include <array>
        #include <optional>
        #include <string>

        int main() {
            std::string cmd;
            while (std::cin >> cmd) {
            }
        }
      solution: |
        #include <iostream>
        #include <array>
        #include <optional>
        #include <string>

        template <typename T, std::size_t N>
        class FileCirculaire {
        public:
            bool enfiler(const T& x) {
                if (n_ == N) return false;
                d_[(tete_ + n_) % N] = x;
                ++n_;
                return true;
            }
            std::optional<T> defiler() {
                if (n_ == 0) return std::nullopt;
                T v = d_[tete_];
                tete_ = (tete_ + 1) % N;
                --n_;
                return v;
            }
            std::size_t taille() const { return n_; }
        private:
            std::array<T, N> d_{};
            std::size_t tete_ = 0, n_ = 0;
        };

        int main() {
            FileCirculaire<int, 3> fi;
            FileCirculaire<std::string, 2> fs;
            std::string cmd;
            while (std::cin >> cmd) {
                if (cmd == "+i") { int x; std::cin >> x; std::cout << (fi.enfiler(x) ? "ok" : "pleine") << "\n"; }
                else if (cmd == "+s") { std::string x; std::cin >> x; std::cout << (fs.enfiler(x) ? "ok" : "pleine") << "\n"; }
                else if (cmd == "-i") { auto v = fi.defiler(); if (v) std::cout << *v << "\n"; else std::cout << "vide\n"; }
                else { auto v = fs.defiler(); if (v) std::cout << *v << "\n"; else std::cout << "vide\n"; }
            }
            std::cout << fi.taille() << " " << fs.taille() << "\n";
        }
      tests:
