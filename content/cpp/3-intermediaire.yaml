language: cpp
level: 3
chapters:
  # ------------------------------------------------------------------
  - slug: cpp-stl
    title: La STL
    summary: Vue d’ensemble de la bibliothèque standard — conteneurs, itérateurs, algorithmes et foncteurs, et comment ils s’articulent.
    minutes: 25
    concepts: [collections, stl]
    sections:
      - title: Trois piliers
        body: |
          La **STL** (*Standard Template Library*) repose sur trois briques indépendantes :

          1. **Conteneurs** : `vector`, `deque`, `list`, `array`, `map`, `set`, `unordered_map`, `unordered_set`, `stack`, `queue`, `priority_queue`…
          2. **Itérateurs** : des objets qui parcourent les conteneurs (`begin()`, `end()`).
          3. **Algorithmes** (`<algorithm>`, `<numeric>`) : `sort`, `find`, `count_if`, `transform`, `accumulate`… qui travaillent sur des **intervalles d’itérateurs** `[début, fin)`.

          ```cpp
          std::vector<int> v{5, 2, 8, 1};
          std::sort(v.begin(), v.end());
          auto it = std::find(v.begin(), v.end(), 8);
          if (it != v.end()) std::cout << "trouvé à l’indice " << (it - v.begin());
          ```

          Grâce aux itérateurs, **un seul** `std::sort` fonctionne pour tous les conteneurs à accès aléatoire.
      - title: Algorithmes avec lambdas et ranges
        body: |
          ```cpp
          int pairs = std::count_if(v.begin(), v.end(), [](int x) { return x % 2 == 0; });
          std::transform(v.begin(), v.end(), v.begin(), [](int x) { return x * 10; });
          bool tous = std::all_of(v.begin(), v.end(), [](int x) { return x > 0; });
          ```

          **C++20 ranges** : on passe directement le conteneur, et on compose des vues paresseuses :

          ```cpp
          #include <ranges>
          std::ranges::sort(v);
          for (int x : v | std::views::filter([](int x) { return x > 2; })
                         | std::views::transform([](int x) { return x * x; }))
              std::cout << x << ' ';
          ```
    exercises:
      - id: cpp-stl-q1
        type: mcq
        prompt: Quels sont les trois piliers de la STL ?
        choices: ['Conteneurs, itérateurs, algorithmes', 'Classes, objets, méthodes', 'Pointeurs, références, valeurs', 'Flux, fichiers, chaînes']
        answer: 0
      - id: cpp-stl-predict
        type: predict
        prompt: Que va afficher ce programme ?
