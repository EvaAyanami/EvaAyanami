    project:
      id: cpp-dbg-projet
      type: code
      title: Réduction de cas d’échec
      difficulty: 3
      prompt: |
        Implémente un mini **delta debugging** : on te donne une fonction « boguée » `bool plante(const std::vector<int>& v)` qui renvoie vrai si la liste contient **à la fois** un nombre négatif **et** un multiple de 7 (non nul).

        À partir d’une entrée qui plante, trouve une sous-liste **minimale** qui plante encore, en retirant les éléments **un par un de gauche à droite** : on retire un élément si la liste plante toujours sans lui, sinon on le garde ; on recommence tant qu’on arrive à retirer quelque chose.

        Affiche `plante : oui|non` pour l’entrée, puis (si oui) `minimal : a b …` et `retirés : N`.
      starter: |
        #include <iostream>
        #include <vector>

        bool plante(const std::vector<int>& v) {
            bool negatif = false, sept = false;
            for (int x : v) {
                if (x < 0) negatif = true;
                if (x != 0 && x % 7 == 0) sept = true;
            }
            return negatif && sept;
        }

        int main() {
            std::vector<int> v;
            int x;
            while (std::cin >> x) v.push_back(x);
        }
      solution: |
        #include <iostream>
        #include <vector>

        bool plante(const std::vector<int>& v) {
            bool negatif = false, sept = false;
            for (int x : v) {
                if (x < 0) negatif = true;
                if (x != 0 && x % 7 == 0) sept = true;
            }
            return negatif && sept;
        }

        int main() {
            std::vector<int> v;
            int x;
            while (std::cin >> x) v.push_back(x);
            bool p = plante(v);
            std::cout << "plante : " << (p ? "oui" : "non") << "\n";
            if (!p) return 0;
            std::size_t initial = v.size();
            bool change = true;
            while (change) {
                change = false;
                for (std::size_t i = 0; i < v.size();) {
                    std::vector<int> essai = v;
                    essai.erase(essai.begin() + i);
                    if (plante(essai)) { v = essai; change = true; }
                    else ++i;
                }
            }
            std::cout << "minimal :";
            for (int y : v) std::cout << " " << y;
            std::cout << "\nretirés : " << initial - v.size() << "\n";
        }
      tests:
        - { input: 3 14 -2 8 21 -5, output: "plante : oui\nminimal : 21 -5\nretirés : 4" }
        - { input: 1 2 3, output: 'plante : non', hidden: true }
        - { input: -7, output: "plante : oui\nminimal : -7\nretirés : 0", hidden: true }
