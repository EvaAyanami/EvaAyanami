  # ------------------------------------------------------------------
  - slug: cpp-moderne
    title: C++ moderne (C++20 et C++23)
    summary: Tour d’horizon des nouveautés — ranges, std::format, std::span, std::expected, designated initializers, three-way comparison, modules et std::print.
    minutes: 35
    concepts: [cpp20]
    sections:
      - title: C++20
        body: |
          ```cpp
          #include <format>
          #include <ranges>
          #include <span>

          std::string s = std::format("{} a {} ans, π ≈ {:.2f}", "Kiri", 16, 3.14159);

          auto pairs = std::views::iota(1, 20)
                     | std::views::filter([](int x) { return x % 2 == 0; })
                     | std::views::transform([](int x) { return x * x; });

          void traiter(std::span<const int> donnees);      // vue sur tableau, vector, array…

          struct Config { int port = 80; bool tls = false; };
          Config c{.port = 8443, .tls = true};             // designated initializers

          auto operator<=>(const Point&) const = default;  // comparaisons générées
          if (s.starts_with("Kiri") && s.contains('a')) {} // contains : C++23
          ```

          Plus : concepts, coroutines, modules, `consteval`, `std::jthread`, `std::bit_cast`, `[[likely]]`…
      - title: C++23
        body: |
          ```cpp
          #include <expected>
          std::expected<int, std::string> lire(std::string_view s) {
              int v{};
              auto [p, ec] = std::from_chars(s.data(), s.data() + s.size(), v);
              if (ec != std::errc{}) return std::unexpected("pas un nombre");
              return v;
          }

          #include <print>
          std::println("Bonjour {} !", nom);     // C++23 (GCC 14+)
          ```

          Aussi : `std::mdspan` (tableaux multidimensionnels), `std::flat_map`, `std::generator`, *deducing this*, `std::ranges::to<std::vector>()`, `import std;`.

          > La compatibilité dépend du compilateur : vérifie le tableau de support sur cppreference avant d’adopter une fonctionnalité.
