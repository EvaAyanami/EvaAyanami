      - id: cpp-sys-q2
        type: mcq
        prompt: Que doit faire un gestionnaire de signal ?
        choices: ['Le minimum, par exemple positionner un drapeau atomique', 'Des affichages complexes', 'Allouer de la mémoire', 'Appeler exit après un long traitement']
        answer: 0
      - id: cpp-sys-predict
        type: predict
        prompt: Que va afficher ce programme ?
        code: |
          #include <filesystem>
          #include <iostream>
          namespace fs = std::filesystem;
          int main() {
              fs::path p = "/home/kiri/projets/rapport.final.pdf";
              std::cout << p.extension() << " " << p.stem() << " " << (p.parent_path() / "images").string() << "\n";
          }
        output: '".pdf" "rapport.final" /home/kiri/projets/images'
      - id: cpp-sys-code
        type: code
        title: Arborescence temporaire
        prompt: |
          Crée sous `/tmp/codemori-sys-<pid>` (pid via `getpid()` de `<unistd.h>`) l’arborescence décrite par l’entrée : chaque ligne `chemin taille` crée un fichier (et ses dossiers parents) contenant `taille` octets `x`.

          Parcours ensuite le dossier récursivement et affiche, triés par chemin relatif, `chemin : taille`, puis `total : T octets`. Supprime tout avec `remove_all`.
        starter: |
          #include <filesystem>
          #include <fstream>
          #include <iostream>
          #include <string>
          #include <unistd.h>

          int main() {
          }
        solution: |
          #include <algorithm>
          #include <filesystem>
          #include <fstream>
          #include <iostream>
          #include <string>
          #include <vector>
          #include <unistd.h>

          namespace fs = std::filesystem;

          int main() {
              fs::path racine = fs::path("/tmp") / ("codemori-sys-" + std::to_string(getpid()));
              std::string chemin;
              std::size_t taille;
              while (std::cin >> chemin >> taille) {
                  fs::path p = racine / chemin;
                  fs::create_directories(p.parent_path());
                  std::ofstream(p) << std::string(taille, 'x');
              }
              std::vector<std::pair<std::string, std::uintmax_t>> fichiers;
              if (fs::exists(racine))
                  for (const auto& e : fs::recursive_directory_iterator(racine))
                      if (e.is_regular_file()) fichiers.emplace_back(fs::relative(e.path(), racine).string(), e.file_size());
              std::sort(fichiers.begin(), fichiers.end());
              std::uintmax_t total = 0;
              for (const auto& [c, t] : fichiers) { std::cout << c << " : " << t << "\n"; total += t; }
              std::cout << "total : " << total << " octets\n";
              fs::remove_all(racine);
          }
        tests:
          - { input: "src/main.cpp 120\nREADME.md 40\nsrc/lib/util.cpp 15", output: "README.md : 40\nsrc/lib/util.cpp : 15\nsrc/main.cpp : 120\ntotal : 175 octets" }
          - { input: '', output: 'total : 0 octets', hidden: true }
    project:
      id: cpp-sys-projet
      type: code
      title: Mini shell (analyse de commandes)
      difficulty: 3
      prompt: |
        Écris l’analyseur d’un mini shell. Chaque ligne est une commande pouvant contenir des **guillemets** (`"…"` regroupe des mots, sans les guillemets), des redirections `> fichier` / `< fichier` et des tubes `|`.

        Pour chaque ligne, affiche chaque commande du pipeline sur une ligne : `[i] programme args=[a1, a2] in=… out=…` (`in=-`/`out=-` sans redirection), ou `erreur : guillemet non fermé` / `erreur : commande vide` (tube sans commande).
      starter: |
        #include <iostream>
        #include <string>
        #include <vector>

        int main() {
            std::string ligne;
            while (std::getline(std::cin, ligne)) {
            }
        }
      solution: |
        #include <iostream>
        #include <optional>
        #include <string>
        #include <vector>

        struct Commande {
            std::vector<std::string> args;
            std::string in = "-", out = "-";
        };

        std::optional<std::vector<std::string>> jetons(const std::string& l) {
            std::vector<std::string> r;
            std::string cur;
            bool dans = false, a = false;
            for (char c : l) {
                if (dans) {
                    if (c == '"') dans = false; else cur += c;
                } else if (c == '"') { dans = true; a = true; }
                else if (c == ' ') { if (a || !cur.empty()) r.push_back(cur); cur.clear(); a = false; }
                else if (c == '|' || c == '<' || c == '>') {
                    if (a || !cur.empty()) r.push_back(cur);
                    cur.clear(); a = false;
                    r.push_back(std::string(1, c));
                } else cur += c;
            }
            if (dans) return std::nullopt;
            if (a || !cur.empty()) r.push_back(cur);
            return r;
        }

        int main() {
            std::string ligne;
            while (std::getline(std::cin, ligne)) {
                auto j = jetons(ligne);
                if (!j) { std::cout << "erreur : guillemet non fermé\n"; continue; }
                std::vector<Commande> pipeline(1);
                bool erreur = false;
                for (std::size_t i = 0; i < j->size(); ++i) {
                    const std::string& t = (*j)[i];
                    if (t == "|") { pipeline.emplace_back(); }
                    else if ((t == "<" || t == ">") && i + 1 < j->size()) { (t == "<" ? pipeline.back().in : pipeline.back().out) = (*j)[++i]; }
                    else pipeline.back().args.push_back(t);
                }
                for (const auto& c : pipeline) if (c.args.empty()) erreur = true;
                if (erreur) { std::cout << "erreur : commande vide\n"; continue; }
                for (std::size_t i = 0; i < pipeline.size(); ++i) {
                    const auto& c = pipeline[i];
                    std::cout << "[" << i << "] " << c.args[0] << " args=[";
                    for (std::size_t k = 1; k < c.args.size(); ++k) std::cout << (k > 1 ? ", " : "") << c.args[k];
                    std::cout << "] in=" << c.in << " out=" << c.out << "\n";
                }
            }
        }
      tests:
        - { input: "grep \"bonjour le monde\" < notes.txt | sort | uniq -c > res.txt\necho \"oups\nls |", output: "[0] grep args=[bonjour le monde] in=notes.txt out=-\n[1] sort args=[] in=- out=-\n[2] uniq args=[-c] in=- out=res.txt\nerreur : guillemet non fermé\nerreur : commande vide" }
        - { input: ls -la, output: '[0] ls args=[-la] in=- out=-', hidden: true }
    exam:
      pass: 70
      questions:
        - id: cpp-sys-ex1
          type: mcq
          prompt: Pourquoi éviter system() avec des données utilisateur ?
          choices: ['Risque d’injection de commandes', 'C’est trop lent', 'Ça ne compile pas', 'Ça ne fonctionne que sous Windows']
