    project:
      id: cpp-lib-projet
      type: code
      title: Bibliothèque de validation versionnée
      difficulty: 3
      prompt: |
        Écris une bibliothèque `valide` (espace de noms) en deux versions : `valide::v1::email(std::string_view)` (contient un `@`) et `valide::v2::email` (version par défaut via `inline namespace`) : exactement un `@`, au moins un caractère avant, et un domaine contenant un `.` qui n’est ni en premier ni en dernier.

        Les deux renvoient `[[nodiscard]] bool`. Pour chaque ligne, affiche `v1=oui|non v2=oui|non` (en appelant `valide::v1::email` et `valide::email`).
      starter: |
        #include <iostream>
        #include <string>
        #include <string_view>

        int main() {
        }
      solution: |
        #include <algorithm>
        #include <iostream>
        #include <string>
        #include <string_view>

        namespace valide {
            namespace v1 {
                [[nodiscard]] inline bool email(std::string_view s) { return s.find('@') != std::string_view::npos; }
            }
            inline namespace v2 {
                [[nodiscard]] inline bool email(std::string_view s) {
                    if (std::count(s.begin(), s.end(), '@') != 1) return false;
                    auto at = s.find('@');
                    if (at == 0) return false;
                    auto domaine = s.substr(at + 1);
                    auto point = domaine.find('.');
                    return point != std::string_view::npos && point != 0 && domaine.back() != '.';
                }
            }
        }

        int main() {
            std::string l;
            while (std::getline(std::cin, l)) {
                std::cout << "v1=" << (valide::v1::email(l) ? "oui" : "non") << " v2=" << (valide::email(l) ? "oui" : "non") << "\n";
            }
        }
      tests:
        - { input: "kiri@codemori.fr\n@x.fr\na@b\nsans-arobase", output: "v1=oui v2=oui\nv1=oui v2=non\nv1=oui v2=non\nv1=non v2=non" }
        - { input: "a@@b.fr\nx@.fr\ny@z.", output: "v1=oui v2=non\nv1=oui v2=non\nv1=oui v2=non", hidden: true }
      require:
        - { pattern: 'inline\s+namespace', message: Versionner avec un inline namespace }
