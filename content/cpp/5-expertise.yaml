          prompt: Quelle est la première chose à faire avant d’optimiser ?
          choices: ['Mesurer et profiler', 'Passer en -O3', 'Réécrire en assembleur', 'Supprimer les classes']
          answer: 0

  # ------------------------------------------------------------------
  - slug: cpp-multithreading
    title: Multithreading en production
    summary: Pools de threads, files de tâches, parallélisme des algorithmes standard, conception lock-free et patrons de concurrence.
    minutes: 40
    concepts: [concurrence, performance]
    sections:
      - title: Pool de threads et algorithmes parallèles
        body: |
          Créer un thread par tâche coûte cher : un **pool** garde N threads qui consomment une **file de tâches** (mutex + variable de condition).

          C++17 parallélise les algorithmes standard avec les **politiques d’exécution** :

          ```cpp
          #include <execution>
          std::sort(std::execution::par, v.begin(), v.end());
          auto s = std::reduce(std::execution::par_unseq, v.begin(), v.end(), 0LL);
          std::transform(std::execution::par, a.begin(), a.end(), b.begin(), f);
          ```

          (Avec GCC, `par` repose sur Intel TBB : il faut lier `-ltbb`.)
      - title: Patrons et pièges
        body: |
          - **Producteur/consommateur** avec file bornée (contre-pression) ;
          - **Fork/join** : découper, traiter en parallèle, assembler (`std::async`, `std::reduce`) ;
          - **Données immuables partagées** : aucune synchronisation nécessaire en lecture ;
          - **Lock-free** (`std::atomic`, `compare_exchange`) : très délicat (problème ABA, ordre mémoire) — à réserver aux experts et à mesurer ;
          - Éviter le **faux partage** (`alignas(std::hardware_destructive_interference_size)`) ;
          - Granularité : des tâches trop petites passent plus de temps à se synchroniser qu’à calculer.
    exercises:
      - id: cpp-mt-q1
        type: mcq
        prompt: Quel est l’avantage d’un pool de threads ?
        choices: ['Réutiliser des threads existants au lieu d’en créer un par tâche', 'Éviter les mutex', 'Supprimer les data races', 'Rendre le code séquentiel']
        answer: 0
      - id: cpp-mt-q2
        type: mcq
        prompt: Qu’est-ce que le problème ABA en programmation lock-free ?
        choices: ['Une valeur repasse à son état initial et trompe un compare_exchange', 'Un deadlock entre deux threads', 'Une fuite mémoire', 'Une erreur de compilation']
        answer: 0
      - id: cpp-mt-code
        type: code
        title: Pool de threads
        prompt: |
          Implémente une classe `PoolThreads(int n)` avec une file de `std::function<void()>`, un mutex, une variable de condition et `n` threads travailleurs ; `void soumettre(std::function<void()>)` ; le destructeur termine proprement (traite les tâches restantes puis joint les threads).

          Pour chaque entier `k` lu, soumets une tâche qui calcule la somme des diviseurs propres de `k` et la stocke dans un vecteur de résultats (indice = position). Après destruction du pool (fin de portée), affiche `k : somme` dans l’ordre d’entrée.
        starter: |
          #include <condition_variable>
          #include <functional>
          #include <iostream>
          #include <mutex>
          #include <queue>
          #include <thread>
          #include <vector>

          int main() {
              std::vector<long long> ks;
              long long k;
              while (std::cin >> k) ks.push_back(k);
              std::vector<long long> res(ks.size());
          }
        solution: |
          #include <condition_variable>
          #include <functional>
          #include <iostream>
          #include <mutex>
          #include <queue>
          #include <thread>
          #include <vector>

          class PoolThreads {
          public:
              explicit PoolThreads(int n) {
                  for (int i = 0; i < n; ++i) {
                      ts_.emplace_back([this] {
                          while (true) {
                              std::function<void()> t;
                              {
                                  std::unique_lock<std::mutex> lk(m_);
                                  cv_.wait(lk, [this] { return arret_ || !file_.empty(); });
                                  if (arret_ && file_.empty()) return;
                                  t = std::move(file_.front());
                                  file_.pop();
                              }
                              t();
                          }
                      });
                  }
              }
              void soumettre(std::function<void()> t) {
                  { std::lock_guard<std::mutex> g(m_); file_.push(std::move(t)); }
                  cv_.notify_one();
              }
              ~PoolThreads() {
                  { std::lock_guard<std::mutex> g(m_); arret_ = true; }
                  cv_.notify_all();
                  for (auto& t : ts_) t.join();
              }
          private:
              std::vector<std::thread> ts_;
              std::queue<std::function<void()>> file_;
              std::mutex m_;
              std::condition_variable cv_;
              bool arret_ = false;
          };

          int main() {
              std::vector<long long> ks;
              long long k;
              while (std::cin >> k) ks.push_back(k);
              std::vector<long long> res(ks.size());
              {
                  PoolThreads pool(3);
                  for (std::size_t i = 0; i < ks.size(); ++i) {
                      pool.soumettre([&res, &ks, i] {
                          long long s = 0;
                          for (long long d = 1; d < ks[i]; ++d) if (ks[i] % d == 0) s += d;
                          res[i] = s;
                      });
                  }
              }
              for (std::size_t i = 0; i < ks.size(); ++i) std::cout << ks[i] << " : " << res[i] << "\n";
          }
        tests:
          - { input: 6 12 7 28, output: "6 : 6\n12 : 16\n7 : 1\n28 : 28" }
          - { input: '1', output: '1 : 0', hidden: true }
    project:
      id: cpp-mt-projet
      type: code
      title: Map-reduce de fréquences
      difficulty: 3
      prompt: |
        Implémente un mini **map-reduce** : le texte (toutes les lignes de l’entrée) est découpé en 4 morceaux de lignes contiguës ; chaque morceau est traité par une tâche `std::async` qui renvoie une `std::unordered_map<std::string, int>` de fréquences de mots (en minuscules ASCII) — phase *map* ; puis les 4 maps sont fusionnées — phase *reduce*.

        Affiche les 5 mots les plus fréquents (`mot n`), par fréquence décroissante puis ordre alphabétique, et `distincts : D`.
      starter: |
        #include <algorithm>
        #include <cctype>
        #include <future>
        #include <iostream>
        #include <sstream>
        #include <string>
        #include <unordered_map>
        #include <vector>

        int main() {
        }
      solution: |
        #include <algorithm>
        #include <cctype>
        #include <future>
        #include <iostream>
        #include <sstream>
        #include <string>
        #include <unordered_map>
        #include <vector>

        using Freq = std::unordered_map<std::string, int>;

        Freq compter(const std::vector<std::string>& lignes, std::size_t d, std::size_t f) {
            Freq m;
            for (std::size_t i = d; i < f; ++i) {
                std::istringstream is(lignes[i]);
                std::string mot;
                while (is >> mot) {
                    for (char& c : mot) c = static_cast<char>(std::tolower(static_cast<unsigned char>(c)));
                    ++m[mot];
                }
            }
            return m;
        }

        int main() {
            std::vector<std::string> lignes;
            std::string l;
            while (std::getline(std::cin, l)) lignes.push_back(l);
            std::size_t n = lignes.size(), taille = (n + 3) / 4;
            std::vector<std::future<Freq>> fs;
            for (std::size_t k = 0; k < 4; ++k) {
                std::size_t d = std::min(n, k * taille), f = std::min(n, d + taille);
                fs.push_back(std::async(std::launch::async, compter, std::cref(lignes), d, f));
            }
            Freq total;
            for (auto& f : fs) for (const auto& [m, c] : f.get()) total[m] += c;
            std::vector<std::pair<std::string, int>> v(total.begin(), total.end());
            std::sort(v.begin(), v.end(), [](const auto& a, const auto& b) { return a.second != b.second ? a.second > b.second : a.first < b.first; });
            for (std::size_t i = 0; i < v.size() && i < 5; ++i) std::cout << v[i].first << " " << v[i].second << "\n";
            std::cout << "distincts : " << v.size() << "\n";
        }
      tests:
        - { input: "Le chat\nle chien et le chat\nUn oiseau\nle chat dort", output: "le 4\nchat 3\nchien 1\ndort 1\net 1\ndistincts : 7" }
        - { input: a, output: "a 1\ndistincts : 1", hidden: true }
      require:
        - { pattern: 'std::async', message: Utiliser std::async pour la phase map }
    exam:
      pass: 70
      questions:
        - id: cpp-mt-ex1
          type: mcq
          prompt: Quelle politique d’exécution autorise parallélisme et vectorisation ?
