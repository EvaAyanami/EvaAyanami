  # ------------------------------------------------------------------
  - slug: cpp-profiling
    title: Profiling
    summary: Mesurer les performances — chronométrage avec chrono, benchmarks, perf, gprof, flamegraphs et interprétation des résultats.
    minutes: 30
    concepts: [performance]
    sections:
      - title: Mesurer correctement
        body: |
          ```cpp
          #include <chrono>
          auto t0 = std::chrono::steady_clock::now();     // horloge monotone
          travail();
          auto t1 = std::chrono::steady_clock::now();
          auto ms = std::chrono::duration_cast<std::chrono::milliseconds>(t1 - t0).count();
          ```

          Pièges : mesurer en **Release**, répéter (variance), chauffer les caches, empêcher le compilateur d’éliminer le calcul (utiliser le résultat), isoler la machine. **Google Benchmark** gère tout cela :

          ```cpp
          static void BM_Tri(benchmark::State& s) {
              for (auto _ : s) { auto v = donnees; std::sort(v.begin(), v.end()); benchmark::DoNotOptimize(v); }
          }
          BENCHMARK(BM_Tri);
          ```
      - title: Profileurs
        body: |
          - **perf** (Linux) : `perf stat ./prog` (cycles, cache-misses, branch-misses), `perf record -g ./prog` puis `perf report` ;
          - **Flamegraphs** (Brendan Gregg) : visualiser où le temps est passé ;
          - **gprof** (`-pg`), **Valgrind/Callgrind** + KCachegrind, **Intel VTune**, **Tracy** (jeux vidéo) ;
          - Mémoire : **heaptrack**, **Massif**.

          Lire un profil : chercher les fonctions au **temps inclusif** élevé, puis descendre ; la règle des 90/10 (90 % du temps dans 10 % du code).
    exercises:
      - id: cpp-prof-q1
        type: mcq
        prompt: Quelle horloge utiliser pour mesurer une durée ?
        choices: ['std::chrono::steady_clock', 'std::chrono::system_clock', 'time(nullptr)', 'rand()']
        answer: 0
      - id: cpp-prof-q2
        type: mcq
        prompt: Pourquoi utiliser benchmark::DoNotOptimize ?
        choices: ['Empêcher le compilateur d’éliminer un calcul dont le résultat n’est pas utilisé', 'Désactiver les optimisations globales', 'Accélérer le benchmark', 'Afficher les résultats']
        answer: 0
      - id: cpp-prof-code
        type: code
        title: Profileur d’appels maison
        prompt: |
          Écris une classe RAII `Sonde(const std::string& nom)` qui, à sa destruction, ajoute 1 au **compteur d’appels** de `nom` dans une `std::map` statique (on n’affichera pas les durées, non déterministes).

          Instrumente une fonction récursive `long long fib(int n)` (une `Sonde s("fib")` au début) et une fonction `long long fibMemo(int n, std::vector<long long>& memo)` (sonde `"fibMemo"`). Pour chaque `n` lu, appelle les deux, affiche `fib(n) = valeur`, puis à la fin le rapport `nom : appels` trié par nom.
        starter: |
          #include <iostream>
          #include <map>
          #include <string>
          #include <vector>

          int main() {
          }
        solution: |
          #include <iostream>
          #include <map>
          #include <string>
          #include <vector>

          class Sonde {
          public:
              explicit Sonde(std::string nom) : nom_(std::move(nom)) {}
              ~Sonde() { ++compteurs()[nom_]; }
              static std::map<std::string, long long>& compteurs() { static std::map<std::string, long long> m; return m; }
          private:
              std::string nom_;
          };

          long long fib(int n) {
              Sonde s("fib");
              return n < 2 ? n : fib(n - 1) + fib(n - 2);
          }

          long long fibMemo(int n, std::vector<long long>& memo) {
              Sonde s("fibMemo");
              if (n < 2) return n;
              if (memo[n] >= 0) return memo[n];
              return memo[n] = fibMemo(n - 1, memo) + fibMemo(n - 2, memo);
          }

          int main() {
              int n;
              while (std::cin >> n) {
                  long long a = fib(n);
                  std::vector<long long> memo(n + 1, -1);
                  long long b = fibMemo(n, memo);
                  std::cout << "fib(" << n << ") = " << a << (a == b ? "" : " ?!") << "\n";
              }
              for (const auto& [nom, c] : Sonde::compteurs()) std::cout << nom << " : " << c << "\n";
          }
        tests:
          - { input: '10', output: "fib(10) = 55\nfib : 177\nfibMemo : 19" }
          - { input: "1\n5", output: "fib(1) = 1\nfib(5) = 5\nfib : 16\nfibMemo : 10", hidden: true }
    project:
      id: cpp-prof-projet
      type: code
      title: Comparaison d’algorithmes de tri
      difficulty: 3
      prompt: |
        Compte le nombre de **comparaisons** effectuées par trois tris sur la même entrée (mesure déterministe de leur coût) : tri par insertion, tri fusion (fusion classique, comparaisons comptées dans la fusion) et `std::sort` (avec un comparateur qui incrémente un compteur — la valeur dépend de l’implémentation : n’affiche pour lui que `ok` si le résultat est trié).

        Entrée : des entiers. Affiche `insertion : C1`, `fusion : C2`, `std::sort : ok`, puis la liste triée.
      starter: |
        #include <algorithm>
        #include <iostream>
        #include <vector>

        int main() {
        }
      solution: |
        #include <algorithm>
        #include <iostream>
        #include <vector>

        long long compInsertion = 0, compFusion = 0;

        void insertion(std::vector<int> v) {
            for (std::size_t i = 1; i < v.size(); ++i) {
                int x = v[i];
                std::size_t j = i;
                while (j > 0) {
                    ++compInsertion;
                    if (v[j - 1] > x) { v[j] = v[j - 1]; --j; } else break;
                }
                v[j] = x;
            }
        }

        void fusion(std::vector<int>& v, std::size_t g, std::size_t d) {
            if (d - g < 2) return;
            std::size_t m = (g + d) / 2;
            fusion(v, g, m);
            fusion(v, m, d);
            std::vector<int> r;
            std::size_t i = g, j = m;
            while (i < m && j < d) {
                ++compFusion;
                r.push_back(v[i] <= v[j] ? v[i++] : v[j++]);
            }
            while (i < m) r.push_back(v[i++]);
            while (j < d) r.push_back(v[j++]);
            std::copy(r.begin(), r.end(), v.begin() + g);
        }

        int main() {
            std::vector<int> v;
            int x;
            while (std::cin >> x) v.push_back(x);
            insertion(v);
            std::vector<int> f = v;
            fusion(f, 0, f.size());
            std::vector<int> s = v;
            long long c = 0;
            std::sort(s.begin(), s.end(), [&c](int a, int b) { ++c; return a < b; });
            std::cout << "insertion : " << compInsertion << "\n";
            std::cout << "fusion : " << compFusion << "\n";
            std::cout << "std::sort : " << (std::is_sorted(s.begin(), s.end()) && s == f ? "ok" : "erreur") << "\n";
            for (std::size_t i = 0; i < f.size(); ++i) std::cout << (i ? " " : "") << f[i];
            std::cout << "\n";
        }
      tests:
        - { input: 5 2 4 6 1 3, output: "insertion : 12\nfusion : 11\nstd::sort : ok\n1 2 3 4 5 6" }
        - { input: 1 2 3 4, output: "insertion : 3\nfusion : 4\nstd::sort : ok\n1 2 3 4", hidden: true }
    exam:
      pass: 70
      questions:
        - id: cpp-prof-ex1
          type: mcq
          prompt: Quelle commande donne un résumé des compteurs matériels (cycles, défauts de cache) ?
          choices: ['perf stat', 'gdb', 'ls', 'cmake']
