          choices: ['nullptr', 'Une chaîne vide', 'Une exception', '0']
          answer: 0

  # ------------------------------------------------------------------
  - slug: cpp-cmake
    title: CMake
    summary: Construire des projets C++ avec CMake moderne — cibles, dépendances, options, tests avec CTest et gestion de paquets.
    minutes: 30
    concepts: [build]
    sections:
      - title: CMake moderne, orienté cibles
        body: |
          ```cmake
          cmake_minimum_required(VERSION 3.25)
          project(Codemori VERSION 1.0 LANGUAGES CXX)

          set(CMAKE_CXX_STANDARD 23)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)

          add_library(noyau src/compte.cpp src/banque.cpp)          # bibliothèque
          target_include_directories(noyau PUBLIC include)
          target_compile_options(noyau PRIVATE -Wall -Wextra -Wpedantic)

          add_executable(app src/main.cpp)                           # exécutable
          target_link_libraries(app PRIVATE noyau)

          find_package(fmt REQUIRED)                                 # dépendance externe
          target_link_libraries(app PRIVATE fmt::fmt)
          ```

          ```bash
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
          ctest --test-dir build
          ```
      - title: PUBLIC, PRIVATE, INTERFACE
        body: |
          La visibilité des propriétés d’une cible se **propage** aux cibles qui la lient :

          | Mot-clé | Utilisé par la cible | Propagé aux dépendants |
          |---|---|---|
          | `PRIVATE` | ✅ | ❌ |
          | `PUBLIC` | ✅ | ✅ |
          | `INTERFACE` | ❌ | ✅ (bibliothèques header-only) |

          Tests : `enable_testing()` + `add_test(NAME unitaires COMMAND tests_unitaires)`. Dépendances : `FetchContent` (télécharge à la configuration), **vcpkg** ou **Conan**. Éviter l’ancien style global (`include_directories`, `CMAKE_CXX_FLAGS`) au profit des commandes `target_*`.
    exercises:
      - id: cpp-cmake-q1
        type: mcq
        prompt: Quel mot-clé utiliser pour un répertoire d’en-têtes nécessaire aux utilisateurs d’une bibliothèque ?
        choices: ['PUBLIC', 'PRIVATE', 'STATIC', 'GLOBAL']
        answer: 0
      - id: cpp-cmake-order
        type: order
        prompt: Remets dans l’ordre les commandes pour configurer, compiler et tester un projet CMake.
        lines:
          - cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          - cmake --build build -j
          - ctest --test-dir build
      - id: cpp-cmake-fill
        type: fill
        prompt: Complète le CMakeLists.txt qui lie l’exécutable à la bibliothèque.
        code: |
          add_library(maths src/maths.cpp)
          add_{{?}}(calculatrice src/main.cpp)
          target_link_libraries(calculatrice {{?}} maths)
        blanks: [[executable], [PRIVATE, PUBLIC]]
      - id: cpp-cmake-q2
        type: mcq
        prompt: Quand utiliser INTERFACE pour une bibliothèque ?
        choices: ['Pour une bibliothèque header-only', 'Pour un exécutable', 'Pour les tests', 'Jamais']
        answer: 0
      - id: cpp-cmake-code
        type: code
        title: Analyseur de CMakeLists
        prompt: |
          Écris un petit analyseur de fichiers CMake. Pour chaque appel `add_library(nom …)` et `add_executable(nom …)`, enregistre une cible ; pour chaque `target_link_libraries(cible [PRIVATE|PUBLIC|INTERFACE] dep…)`, enregistre les dépendances (on ignore les mots-clés).

          Affiche chaque cible dans l’ordre de déclaration au format `nom (bibliothèque|exécutable) -> dep1, dep2` (ou `-> aucune`), puis l’**ordre de compilation** (tri topologique : une cible après ses dépendances, à égalité l’ordre de déclaration), les dépendances externes (non déclarées) étant ignorées.
        starter: |
          #include <iostream>
          #include <map>
          #include <sstream>
          #include <string>
          #include <vector>

          int main() {
          }
        solution: |
          #include <algorithm>
          #include <iostream>
          #include <map>
          #include <set>
          #include <sstream>
          #include <string>
          #include <vector>

          int main() {
              std::string texte, l;
              while (std::getline(std::cin, l)) texte += l + " ";
              std::vector<std::string> ordre;
              std::map<std::string, std::string> type;
              std::map<std::string, std::vector<std::string>> deps;
              std::size_t pos = 0;
              while ((pos = texte.find('(', pos)) != std::string::npos) {
                  std::size_t debut = texte.rfind(' ', pos);
                  std::string cmd = texte.substr(debut == std::string::npos ? 0 : debut + 1, pos - (debut == std::string::npos ? 0 : debut + 1));
                  std::size_t fin = texte.find(')', pos);
                  std::istringstream is(texte.substr(pos + 1, fin - pos - 1));
                  std::vector<std::string> args;
                  std::string a;
                  while (is >> a) args.push_back(a);
                  if ((cmd == "add_library" || cmd == "add_executable") && !args.empty()) {
                      ordre.push_back(args[0]);
                      type[args[0]] = cmd == "add_library" ? "bibliothèque" : "exécutable";
                  } else if (cmd == "target_link_libraries" && !args.empty()) {
                      for (std::size_t i = 1; i < args.size(); ++i)
                          if (args[i] != "PRIVATE" && args[i] != "PUBLIC" && args[i] != "INTERFACE") deps[args[0]].push_back(args[i]);
                  }
                  pos = fin;
              }
              for (const auto& c : ordre) {
                  std::cout << c << " (" << type[c] << ") -> ";
                  if (deps[c].empty()) std::cout << "aucune";
                  for (std::size_t i = 0; i < deps[c].size(); ++i) std::cout << (i ? ", " : "") << deps[c][i];
                  std::cout << "\n";
              }
              std::set<std::string> fait;
              std::vector<std::string> res;
              while (res.size() < ordre.size()) {
                  bool progres = false;
                  for (const auto& c : ordre) {
                      if (fait.count(c)) continue;
                      bool pret = std::all_of(deps[c].begin(), deps[c].end(), [&](const std::string& d) { return !type.count(d) || fait.count(d); });
                      if (pret) { fait.insert(c); res.push_back(c); progres = true; break; }
                  }
                  if (!progres) break;
              }
              std::cout << "ordre :";
              for (const auto& c : res) std::cout << " " << c;
              std::cout << "\n";
          }
        tests:
          - { input: "project(Demo)\nadd_executable(app main.cpp)\nadd_library(reseau reseau.cpp)\nadd_library(noyau noyau.cpp)\ntarget_link_libraries(app PRIVATE reseau noyau fmt::fmt)\ntarget_link_libraries(reseau PUBLIC noyau)", output: "app (exécutable) -> reseau, noyau, fmt::fmt\nreseau (bibliothèque) -> noyau\nnoyau (bibliothèque) -> aucune\nordre : noyau reseau app" }
          - { input: "add_library(a a.cpp)", output: "a (bibliothèque) -> aucune\nordre : a", hidden: true }
    project:
      id: cpp-cmake-projet
      type: code
      title: Générateur de CMakeLists
      difficulty: 3
      prompt: |
        Génère un `CMakeLists.txt` moderne à partir d’une description. Première ligne : `projet NOM STANDARD` (ex. `projet Jeu 23`). Lignes suivantes : `lib NOM fichiers…`, `exe NOM fichiers…`, `lien CIBLE DEP…`.

        Sortie attendue (respecte exactement le format) :

        ```
        cmake_minimum_required(VERSION 3.25)
        project(NOM LANGUAGES CXX)
        set(CMAKE_CXX_STANDARD STANDARD)
        set(CMAKE_CXX_STANDARD_REQUIRED ON)

        add_library(NOM fichiers…)
        target_compile_options(NOM PRIVATE -Wall -Wextra)
        …
        target_link_libraries(CIBLE PRIVATE DEP…)
        ```

        Les cibles dans l’ordre de déclaration (chacune suivie de sa ligne `target_compile_options`), puis une ligne vide, puis les liens dans l’ordre.
      starter: |
        #include <iostream>
        #include <sstream>
        #include <string>
        #include <vector>

        int main() {
        }
      solution: |
        #include <iostream>
        #include <sstream>
        #include <string>
        #include <vector>

        int main() {
            std::string mot, nom, standard;
            std::cin >> mot >> nom >> standard;
            std::string ligne;
            std::getline(std::cin, ligne);
            std::vector<std::string> cibles, liens;
            while (std::getline(std::cin, ligne)) {
                std::istringstream is(ligne);
                std::string type, cible, x, reste;
                is >> type >> cible;
                while (is >> x) reste += " " + x;
                if (type == "lib" || type == "exe") {
                    cibles.push_back(std::string(type == "lib" ? "add_library(" : "add_executable(") + cible + reste + ")\ntarget_compile_options(" + cible + " PRIVATE -Wall -Wextra)");
                } else if (type == "lien") {
                    liens.push_back("target_link_libraries(" + cible + " PRIVATE" + reste + ")");
                }
            }
            std::cout << "cmake_minimum_required(VERSION 3.25)\n";
            std::cout << "project(" << nom << " LANGUAGES CXX)\n";
            std::cout << "set(CMAKE_CXX_STANDARD " << standard << ")\n";
            std::cout << "set(CMAKE_CXX_STANDARD_REQUIRED ON)\n\n";
            for (const auto& c : cibles) std::cout << c << "\n";
            std::cout << "\n";
            for (const auto& l : liens) std::cout << l << "\n";
        }
