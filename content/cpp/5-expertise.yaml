  - slug: cpp-systeme
    title: Programmation système
    summary: Dialoguer avec le système — fichiers et répertoires, processus, variables d’environnement, codes de sortie, signaux et API POSIX.
    minutes: 35
    concepts: [systeme]
    sections:
      - title: Les briques du système
        body: |
          ```cpp
          #include <cstdlib>
          #include <filesystem>
          namespace fs = std::filesystem;

          int main(int argc, char* argv[]) {          // arguments de la ligne de commande
              if (argc < 2) { std::cerr << "usage : " << argv[0] << " <dossier>\n"; return 2; }
              const char* home = std::getenv("HOME");   // variable d’environnement (peut être nullptr)
              for (const auto& e : fs::recursive_directory_iterator(argv[1]))
                  if (e.is_regular_file()) std::cout << e.path() << " " << e.file_size() << "\n";
              return EXIT_SUCCESS;                       // 0
          }
          ```

          Bas niveau POSIX (`<unistd.h>`, `<fcntl.h>`) : `open`, `read`, `write`, `close`, `fork`, `execvp`, `pipe`, `waitpid`. Les signaux (`SIGINT`, `SIGTERM`) se gèrent avec `sigaction` ; dans un gestionnaire, on ne fait presque rien (positionner un `std::atomic<bool>`).
      - title: Robustesse
        body: |
          - Vérifier **chaque** appel système (valeur de retour, `errno`, exceptions de `std::filesystem` ou surcharges avec `std::error_code`).
          - Encapsuler les descripteurs de fichiers dans des classes RAII.
          - Écritures atomiques : fichier temporaire + `fs::rename`.
          - Ne jamais construire une commande shell avec des données non fiables (injection) : utiliser `execvp` avec un tableau d’arguments.
          - Résultats sur `stdout`, diagnostics sur `stderr`, code de sortie significatif.
    exercises:
      - id: cpp-sys-q1
        type: mcq
        prompt: Que contient argv[0] ?
        choices: ['Le nom (chemin) du programme', 'Le premier argument utilisateur', 'Le nombre d’arguments', 'Rien']
