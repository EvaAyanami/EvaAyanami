language: cpp
level: 5
chapters:
  # ------------------------------------------------------------------
  - slug: cpp-architecture
    title: Architecture C++
    summary: Structurer un projet C++ — séparation interface/implémentation, PImpl, inversion de dépendances, valeur vs entité et gestion des dépendances de compilation.
    minutes: 40
    concepts: [architecture, classes]
    sections:
      - title: Interfaces et dépendances
        body: |
          Un grand projet C++ souffre vite de **temps de compilation** élevés et de couplage. Principes :

          - **En-têtes minimaux** : déclarer (`class Moteur;`) plutôt qu’inclure quand un pointeur/référence suffit ;
          - **Inversion de dépendances** : le cœur métier dépend d’interfaces abstraites (classes virtuelles pures ou concepts), pas des détails (base de données, réseau) ;
          - **Composition** plutôt qu’héritage profond ;
          - **Types valeur** (copiables, comparables : `Date`, `Argent`) vs **entités** (identité, non copiables : `Session`, `Connexion`).

          ```cpp
          class Depot {                       // port (interface)
          public:
              virtual ~Depot() = default;
              virtual std::optional<Compte> charger(int id) const = 0;
              virtual void sauver(const Compte&) = 0;
          };
          class ServiceVirement {             // métier, testable avec un dépôt en mémoire
          public:
              explicit ServiceVirement(Depot& d) : depot_(d) {}
          private:
              Depot& depot_;
          };
          ```
      - title: L’idiome PImpl
        body: |
          **PImpl** (*Pointer to Implementation*) cache les détails privés derrière un pointeur, pour stabiliser l’ABI et réduire les recompilations :

          ```cpp
          // widget.hpp — ne change jamais quand l’implémentation évolue
          class Widget {
          public:
              Widget();
              ~Widget();                         // défini dans le .cpp (Impl y est complet)
              Widget(Widget&&) noexcept;
              Widget& operator=(Widget&&) noexcept;
              void dessiner();
          private:
              struct Impl;
              std::unique_ptr<Impl> impl_;
          };

          // widget.cpp
          struct Widget::Impl { std::vector<Point> points; Texture texture; };
          Widget::Widget() : impl_(std::make_unique<Impl>()) {}
          Widget::~Widget() = default;
          ```

          Coût : une indirection et une allocation. Les **modules C++20** (`export module`) réduisent aussi les temps de compilation.
    exercises:
      - id: cpp-arch-q1
        type: mcq
        prompt: Pourquoi le destructeur d’une classe PImpl doit-il être défini dans le .cpp ?
        choices: ['unique_ptr<Impl> a besoin du type Impl complet pour le détruire', 'Pour la performance', 'C’est une convention sans effet', 'Pour l’héritage']
        answer: 0
      - id: cpp-arch-q2
        type: mcq
        prompt: Quel est l’intérêt d’une déclaration anticipée (class Moteur;) dans un en-tête ?
        choices: ['Réduire les dépendances et les temps de compilation', 'Définir la classe', 'Allouer la classe', 'Rendre la classe privée']
        answer: 0
      - id: cpp-arch-predict
        type: predict
        prompt: Que va afficher ce programme ?
        code: |
          #include <iostream>
          #include <memory>
          #include <string>
          class Journal { public: virtual ~Journal() = default; virtual void ecrire(const std::string&) = 0; };
          class JournalConsole : public Journal { public: void ecrire(const std::string& m) override { std::cout << "[log] " << m << "\n"; } };
          class JournalMuet : public Journal { public: int n = 0; void ecrire(const std::string&) override { ++n; } };
          class Service {
          public:
              explicit Service(Journal& j) : j_(j) {}
              int calculer(int x) { j_.ecrire("calcul " + std::to_string(x)); return x * 2; }
          private:
              Journal& j_;
          };
          int main() {
              JournalConsole c; JournalMuet m;
              Service a(c), b(m);
              int r = a.calculer(3) + b.calculer(4) + b.calculer(5);
              std::cout << r << " " << m.n << "\n";
          }
        output: "[log] calcul 3\n24 2"
      - id: cpp-arch-code
        type: code
        title: Service testable
        prompt: |
          Écris une interface `Depot` (`virtual std::optional<long long> solde(const std::string&) const`, `virtual void definir(const std::string&, long long)`), une implémentation `DepotMemoire` (`std::map`) et une fonction `std::string virer(Depot&, de, vers, montant)` qui renvoie `ok`, `compte inconnu`, `solde insuffisant` ou `montant invalide` (montant ≤ 0). Un virement d’un compte vers lui-même valide ne change rien et renvoie `ok`.

          Commandes : `ouvrir id solde`, `virer de vers montant`. Termine par les soldes triés (`id=solde`).
        starter: |
          #include <iostream>
          #include <map>
          #include <optional>
          #include <string>

          int main() {
          }
        solution: |
          #include <iostream>
          #include <map>
          #include <optional>
          #include <string>

          class Depot {
          public:
              virtual ~Depot() = default;
              virtual std::optional<long long> solde(const std::string& id) const = 0;
              virtual void definir(const std::string& id, long long s) = 0;
          };

          class DepotMemoire : public Depot {
          public:
              std::optional<long long> solde(const std::string& id) const override {
                  auto it = m_.find(id);
                  if (it == m_.end()) return std::nullopt;
                  return it->second;
              }
              void definir(const std::string& id, long long s) override { m_[id] = s; }
              const std::map<std::string, long long>& tous() const { return m_; }
          private:
              std::map<std::string, long long> m_;
          };

          std::string virer(Depot& d, const std::string& de, const std::string& vers, long long montant) {
              if (montant <= 0) return "montant invalide";
              auto s1 = d.solde(de), s2 = d.solde(vers);
              if (!s1 || !s2) return "compte inconnu";
              if (*s1 < montant) return "solde insuffisant";
              if (de == vers) return "ok";
              d.definir(de, *s1 - montant);
              d.definir(vers, *s2 + montant);
              return "ok";
          }

          int main() {
              DepotMemoire depot;
              std::string cmd;
              while (std::cin >> cmd) {
                  if (cmd == "ouvrir") {
                      std::string id; long long s;
                      std::cin >> id >> s;
                      depot.definir(id, s);
                  } else {
                      std::string a, b; long long m;
                      std::cin >> a >> b >> m;
                      std::cout << virer(depot, a, b, m) << "\n";
                  }
              }
              bool premier = true;
              for (const auto& [id, s] : depot.tous()) { std::cout << (premier ? "" : " ") << id << "=" << s; premier = false; }
              std::cout << "\n";
          }
        tests:
          - { input: "ouvrir a 100\nouvrir b 0\nvirer a b 30\nvirer b a 50\nvirer a z 1\nvirer a b -5", output: "ok\nsolde insuffisant\ncompte inconnu\nmontant invalide\na=70 b=30" }
          - { input: "ouvrir x 5\nvirer x x 5", output: "ok\nx=5", hidden: true }
        require:
          - { pattern: 'class\s+Depot', message: Définir l’interface Depot }
          - { pattern: 'virtual', message: Utiliser des méthodes virtuelles }
    project:
      id: cpp-arch-projet
      type: code
      title: Moteur de règles de promotion
      difficulty: 3
      prompt: |
        Conçois un moteur de promotions extensible : une interface `Regle` (`virtual std::optional<long long> remise(const Panier&) const` en centimes, `virtual std::string nom() const`), et trois règles :

        - `PourcentageDes(seuil, pct)` : `pct` % du total si le total ≥ `seuil` ;
        - `TroisPourDeux(article)` : un article offert (le prix unitaire) pour chaque lot de 3 du même article ;
        - `CodePromo(code, montant)` : remise fixe si le code saisi correspond.

        Le moteur applique **la meilleure** règle (la plus grosse remise ; la première en cas d’égalité).

        Entrée : lignes `article prix_centimes quantite`, puis une ligne `code XYZ`. Règles fixes : `PourcentageDes(5000, 10)`, `TroisPourDeux("cafe")`, `CodePromo("KIRI", 700)`. Affiche `total : T`, `règle : nom` (ou `aucune`), `à payer : P`.
      starter: |
        #include <iostream>
        #include <memory>
        #include <optional>
        #include <string>
        #include <vector>

        int main() {
        }
      solution: |
        #include <iostream>
        #include <memory>
        #include <optional>
        #include <string>
        #include <vector>

        struct Ligne { std::string article; long long prix; int quantite; };
        struct Panier { std::vector<Ligne> lignes; std::string code; long long total() const { long long t = 0; for (auto& l : lignes) t += l.prix * l.quantite; return t; } };

        class Regle {
        public:
            virtual ~Regle() = default;
            virtual std::optional<long long> remise(const Panier&) const = 0;
            virtual std::string nom() const = 0;
        };

        class PourcentageDes : public Regle {
        public:
            PourcentageDes(long long seuil, int pct) : seuil_(seuil), pct_(pct) {}
            std::optional<long long> remise(const Panier& p) const override {
                if (p.total() < seuil_) return std::nullopt;
                return p.total() * pct_ / 100;
            }
            std::string nom() const override { return std::to_string(pct_) + " % dès " + std::to_string(seuil_); }
        private:
            long long seuil_;
            int pct_;
        };

        class TroisPourDeux : public Regle {
        public:
            explicit TroisPourDeux(std::string a) : article_(std::move(a)) {}
            std::optional<long long> remise(const Panier& p) const override {
                long long r = 0;
                for (const auto& l : p.lignes) if (l.article == article_) r += (l.quantite / 3) * l.prix;
                if (r == 0) return std::nullopt;
                return r;
            }
            std::string nom() const override { return "3 pour 2 sur " + article_; }
        private:
            std::string article_;
        };

        class CodePromo : public Regle {
        public:
            CodePromo(std::string c, long long m) : code_(std::move(c)), montant_(m) {}
            std::optional<long long> remise(const Panier& p) const override {
                if (p.code != code_) return std::nullopt;
                return std::min(montant_, p.total());
            }
            std::string nom() const override { return "code " + code_; }
        private:
            std::string code_;
            long long montant_;
        };

        int main() {
            Panier p;
            std::string mot;
            while (std::cin >> mot) {
                if (mot == "code") { std::cin >> p.code; break; }
                Ligne l{mot, 0, 0};
                std::cin >> l.prix >> l.quantite;
                p.lignes.push_back(l);
            }
            std::vector<std::unique_ptr<Regle>> regles;
            regles.push_back(std::make_unique<PourcentageDes>(5000, 10));
            regles.push_back(std::make_unique<TroisPourDeux>("cafe"));
            regles.push_back(std::make_unique<CodePromo>("KIRI", 700));
            const Regle* meilleure = nullptr;
            long long best = 0;
            for (const auto& r : regles) {
                auto v = r->remise(p);
                if (v && *v > best) { best = *v; meilleure = r.get(); }
            }
            std::cout << "total : " << p.total() << "\n";
            std::cout << "règle : " << (meilleure ? meilleure->nom() : "aucune") << "\n";
            std::cout << "à payer : " << p.total() - best << "\n";
        }
      tests:
        - { input: "cafe 450 6\nlivre 2000 1\ncode NON", output: "total : 4700\nrègle : 3 pour 2 sur cafe\nà payer : 3800" }
        - { input: "tv 60000 1\ncode KIRI", output: "total : 60000\nrègle : 10 % dès 5000\nà payer : 54000", hidden: true }
        - { input: "stylo 100 2\ncode KIRI", output: "total : 200\nrègle : code KIRI\nà payer : 0", hidden: true }
    exam:
      pass: 70
      questions:
        - id: cpp-arch-ex1
