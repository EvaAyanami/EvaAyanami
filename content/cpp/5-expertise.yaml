          choices: ['Une allocation et une indirection supplémentaires', 'Aucun', 'Des fuites mémoire', 'L’impossibilité de copier']
          answer: 0
        - id: cpp-arch-ex3
          type: mcq
          prompt: Une Date est plutôt…
          choices: ['Un type valeur (copiable, comparable)', 'Une entité avec identité', 'Une interface', 'Un singleton']
          answer: 0

  # ------------------------------------------------------------------
  - slug: cpp-optimisation
    title: Optimisation
    summary: Écrire du C++ rapide — complexité, cache, allocations, déplacement, inlining, vectorisation et options de compilation.
    minutes: 35
    concepts: [performance]
    sections:
      - title: Les leviers, dans l’ordre
        body: |
          1. **Algorithme et structure** : O(n log n) plutôt que O(n²) ; `unordered_map` pour les recherches ; trier une fois plutôt que chercher n fois.
          2. **Mémoire contiguë et cache** : `std::vector` plutôt que `std::list` ; parcours séquentiels ; structure de tableaux pour les calculs massifs.
          3. **Allocations** : `reserve`, réutiliser les tampons, éviter les copies (références `const&`, `std::move`, `string_view`).
          4. **E/S** : `std::ios::sync_with_stdio(false); std::cin.tie(nullptr);`, `'\n'` plutôt que `std::endl`.
          5. **Compilateur** : `-O2`/`-O3`, `-march=native`, LTO (`-flto`), PGO (`-fprofile-generate` puis `-fprofile-use`).
          6. **Micro** : branches prévisibles, `[[likely]]`, éviter les appels virtuels dans les boucles chaudes.

          Toujours **mesurer** (benchmark, profileur) avant et après.
      - title: Exemples concrets
        body: |
          ```cpp
          // ❌ O(n²) : erase en tête de vector dans une boucle
          while (!v.empty()) { traiter(v.front()); v.erase(v.begin()); }
          // ✅ O(n)
          for (auto& x : v) traiter(x); v.clear();

          // ❌ copie à chaque itération
          for (auto s : chaines) total += s.size();
          // ✅
          for (const auto& s : chaines) total += s.size();

          // ❌ endl vide le tampon à chaque ligne
          for (int i = 0; i < n; ++i) std::cout << i << std::endl;
          // ✅
          for (int i = 0; i < n; ++i) std::cout << i << '\n';
          ```
    exercises:
      - id: cpp-optim-q1
        type: mcq
        prompt: Quelles lignes accélèrent fortement les E/S avec cin/cout ?
        choices: ['std::ios::sync_with_stdio(false); std::cin.tie(nullptr);', 'std::cout.flush() partout', '#pragma fast', 'Utiliser std::endl']
        answer: 0
      - id: cpp-optim-q2
        type: mcq
        prompt: Qu’est-ce que la PGO ?
        choices: ['Une optimisation guidée par un profil d’exécution réel', 'Un garbage collector', 'Un format de fichier', 'Un type de pointeur']
        answer: 0
      - id: cpp-optim-code
        type: code
        title: Paires de somme cible
        prompt: |
          Première ligne : `n cible`. Seconde ligne : `n` entiers distincts. Compte les paires (i < j) de somme `cible`.

          ⚠️ Les tests cachés vont jusqu’à 200 000 nombres : une solution O(n²) est trop lente. Utilise un `std::unordered_set` (avec `reserve`) et des E/S rapides.
        starter: |
          #include <iostream>
          #include <unordered_set>

          int main() {
              std::ios::sync_with_stdio(false);
              std::cin.tie(nullptr);
          }
        solution: |
          #include <iostream>
          #include <unordered_set>

          int main() {
              std::ios::sync_with_stdio(false);
              std::cin.tie(nullptr);
              std::size_t n;
              long long cible;
              std::cin >> n >> cible;
              std::unordered_set<long long> vus;
              vus.reserve(n * 2);
              long long paires = 0;
              for (std::size_t i = 0; i < n; ++i) {
                  long long x;
                  std::cin >> x;
                  if (vus.count(cible - x)) ++paires;
                  vus.insert(x);
              }
              std::cout << paires << "\n";
          }
        tests:
          - { input: "5 10\n1 9 3 7 5", output: '2' }
          - { input: "4 0\n-2 2 -5 5", output: '2', hidden: true }
        concepts: [performance]
    project:
      id: cpp-optim-projet
      type: code
      title: Requêtes de sommes sur intervalles
      difficulty: 3
      prompt: |
        Première ligne : `n q`. Seconde ligne : `n` entiers. Puis `q` requêtes `g d` (indices 1-indexés, g ≤ d) : affiche la somme des éléments de `g` à `d`.

        Avec n, q jusqu’à 200 000, un calcul naïf O(n·q) est trop lent : utilise des **sommes préfixes** (O(n + q)) et des E/S rapides.
      starter: |
        #include <iostream>
        #include <vector>

        int main() {
            std::ios::sync_with_stdio(false);
            std::cin.tie(nullptr);
        }
      solution: |
        #include <iostream>
        #include <vector>

        int main() {
            std::ios::sync_with_stdio(false);
            std::cin.tie(nullptr);
            std::size_t n, q;
            std::cin >> n >> q;
            std::vector<long long> prefixe(n + 1, 0);
            for (std::size_t i = 1; i <= n; ++i) {
                long long x;
                std::cin >> x;
                prefixe[i] = prefixe[i - 1] + x;
            }
            while (q--) {
                std::size_t g, d;
                std::cin >> g >> d;
                std::cout << prefixe[d] - prefixe[g - 1] << '\n';
            }
        }
      tests:
        - { input: "5 3\n1 2 3 4 5\n1 5\n2 3\n4 4", output: "15\n5\n4" }
        - { input: "3 2\n-1 -2 10\n1 2\n1 3", output: "-3\n7", hidden: true }
    exam:
      pass: 70
      questions:
