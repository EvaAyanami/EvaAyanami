  # ------------------------------------------------------------------
  - slug: cpp-debugging
    title: Debugging
    summary: Trouver les bugs méthodiquement — GDB, points d’arrêt, sanitizers, assertions, journaux et reproduction minimale.
    minutes: 30
    concepts: [debug]
    sections:
      - title: GDB et sanitizers
        body: |
          Compiler avec `-g -O0` pour déboguer confortablement, puis :

          ```bash
          gdb ./programme
          (gdb) break main.cpp:42        # point d’arrêt
          (gdb) run < entree.txt
          (gdb) next / step / finish     # pas à pas
          (gdb) print v.size()           # inspecter
          (gdb) backtrace                # pile d’appels (après un crash)
          (gdb) watch compteur           # s’arrêter quand la variable change
          ```

          Les **sanitizers** instrumentent le programme et signalent l’erreur exactement où elle se produit :

          | Option | Détecte |
          |---|---|
          | `-fsanitize=address` | dépassements, use-after-free, fuites |
          | `-fsanitize=undefined` | dépassements signés, divisions par zéro, décalages invalides… |
          | `-fsanitize=thread` | data races |
      - title: Une méthode
        body: |
          1. **Reproduire** de façon fiable (entrée minimale).
          2. **Isoler** : réduire le programme/l’entrée jusqu’au cas minimal (bisection, `git bisect` pour une régression).
          3. **Formuler une hypothèse** et la tester (assertion, point d’arrêt, journal).
          4. **Corriger la cause**, pas le symptôme.
          5. **Ajouter un test** de non-régression.

          `assert(condition)` (`<cassert>`) vérifie les invariants en mode debug (désactivé avec `-DNDEBUG`). Les journaux (`std::clog`, bibliothèques comme spdlog) aident en production.
