  # ------------------------------------------------------------------
  - slug: cpp-bibliotheques
    title: Développement de bibliothèques
    summary: Concevoir une bibliothèque C++ — API, ABI, header-only vs compilée, versionnement, documentation, tests et distribution.
    minutes: 35
    concepts: [build, architecture]
    sections:
      - title: API et ABI
        body: |
          - **API** : ce que le code source utilise (noms, signatures). Un changement d’API casse la **compilation** des utilisateurs.
          - **ABI** : la forme binaire (disposition des classes, noms décorés, conventions d’appel). Un changement d’ABI casse les programmes déjà **compilés** contre l’ancienne version (bibliothèques partagées `.so`/`.dll`).

          Ajouter un membre privé à une classe change sa taille → **rupture d’ABI**. Protections : PImpl, interfaces abstraites, `inline namespace v2 { … }` pour versionner.

          Formes de distribution :

          | | Header-only | Compilée (statique/partagée) |
          |---|---|---|
          | Intégration | triviale | nécessite build/liens |
          | Temps de compilation | plus long | plus court |
          | Templates | naturels | doivent être dans les en-têtes |
      - title: Une bonne bibliothèque
        body: |
          - Un **espace de noms** dédié, des en-têtes autonomes (s’incluent seuls), pas de `using namespace` dans les en-têtes.
          - Une API **difficile à mal utiliser** : types forts, `[[nodiscard]]`, `explicit`, `noexcept`, erreurs explicites (`std::expected`/exceptions documentées).
          - **SemVer** et changelog ; tests unitaires (GoogleTest, Catch2), CI multi-compilateurs, sanitizers.
          - Documentation (Doxygen), exemples, `README`.
          - Packaging CMake (`install(TARGETS …)`, `find_package` côté utilisateur), vcpkg/Conan.
    exercises:
      - id: cpp-lib-q1
        type: mcq
        prompt: Ajouter un membre de données privé à une classe exportée par une bibliothèque partagée…
        choices: ['Casse l’ABI (taille et disposition changent)', 'Ne change rien', 'Casse seulement l’API', 'Accélère le programme']
        answer: 0
      - id: cpp-lib-q2
        type: mcq
        prompt: Que signale [[nodiscard]] ?
        choices: ['Ignorer la valeur de retour provoque un avertissement', 'La fonction ne renvoie rien', 'La fonction est obsolète', 'La fonction est inline']
        answer: 0
      - id: cpp-lib-predict
        type: predict
        prompt: Que va afficher ce programme ?
        code: |
          #include <iostream>
          namespace bib {
              inline namespace v2 { int version() { return 2; } }
              namespace v1 { int version() { return 1; } }
          }
          int main() {
              std::cout << bib::version() << bib::v1::version() << bib::v2::version() << "\n";
          }
        output: '212'
        explanation: Un inline namespace rend sa version accessible directement — c’est la version « par défaut ».
      - id: cpp-lib-code
        type: code
        title: API difficile à mal utiliser
        prompt: |
          Conçois une petite API de durée : `class Duree` (constructeur **privé**, fabriques statiques `secondes(long long)`, `minutes(long long)`, `heures(long long)`), `[[nodiscard]] long long enSecondes() const`, `operator+`, comparaison par défaut (`<=>`), et un `operator<<` qui affiche `HhMMmSSs` (ex. `1h02m05s`).

          Chaque ligne : une suite de termes `5s`, `3m`, `2h`. Affiche leur somme formatée, puis `max : …` (la plus grande somme parmi toutes les lignes).
        starter: |
          #include <compare>
          #include <iomanip>
          #include <iostream>
          #include <sstream>
          #include <string>

          int main() {
          }
        solution: |
          #include <compare>
          #include <iomanip>
          #include <iostream>
          #include <optional>
          #include <sstream>
          #include <string>

          class Duree {
          public:
              static Duree secondes(long long s) { return Duree(s); }
              static Duree minutes(long long m) { return Duree(m * 60); }
              static Duree heures(long long h) { return Duree(h * 3600); }
              [[nodiscard]] long long enSecondes() const { return s_; }
              Duree operator+(const Duree& o) const { return Duree(s_ + o.s_); }
              auto operator<=>(const Duree&) const = default;
          private:
              explicit Duree(long long s) : s_(s) {}
              long long s_;
          };

          std::ostream& operator<<(std::ostream& o, const Duree& d) {
              long long s = d.enSecondes();
              return o << s / 3600 << "h" << std::setw(2) << std::setfill('0') << (s % 3600) / 60 << "m" << std::setw(2) << s % 60 << "s" << std::setfill(' ');
          }

          int main() {
              std::string ligne;
              std::optional<Duree> max;
              while (std::getline(std::cin, ligne)) {
                  std::istringstream is(ligne);
                  std::string t;
                  Duree total = Duree::secondes(0);
                  while (is >> t) {
                      long long v = std::stoll(t.substr(0, t.size() - 1));
                      char u = t.back();
                      total = total + (u == 'h' ? Duree::heures(v) : u == 'm' ? Duree::minutes(v) : Duree::secondes(v));
                  }
                  std::cout << total << "\n";
                  if (!max || total > *max) max = total;
              }
              if (max) std::cout << "max : " << *max << "\n";
          }
        tests:
