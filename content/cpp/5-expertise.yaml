      - id: cpp-mod-code
        type: code
        title: Rapport formaté
        prompt: |
          Chaque ligne : `nom quantite prix`. Avec `std::format`, affiche un tableau aligné : nom aligné à gauche sur 12 caractères, quantité alignée à droite sur 5, prix (2 décimales) à droite sur 9, total (quantité × prix, 2 décimales) à droite sur 10, colonnes séparées par ` | `.

          Termine par une ligne `TOTAL` formatée de la même façon (quantité totale, prix vide, total général).
        starter: |
          #include <format>
          #include <iostream>
          #include <string>

          int main() {
          }
        solution: |
          #include <format>
          #include <iostream>
          #include <string>

          int main() {
              std::string nom;
              int q;
              double p;
              int qt = 0;
              double total = 0;
              while (std::cin >> nom >> q >> p) {
                  std::cout << std::format("{:<12} | {:>5} | {:>9.2f} | {:>10.2f}", nom, q, p, q * p) << "\n";
                  qt += q;
                  total += q * p;
              }
              std::cout << std::format("{:<12} | {:>5} | {:>9} | {:>10.2f}", "TOTAL", qt, "", total) << "\n";
          }
        tests:
          - { input: "stylo 10 1.5\ncahier 2 3.25", output: "stylo        |    10 |      1.50 |      15.00\ncahier       |     2 |      3.25 |       6.50\nTOTAL        |    12 |           |      21.50" }
          - { input: '', output: 'TOTAL        |     0 |           |       0.00', hidden: true }
        require:
          - { pattern: 'std::format', message: Utiliser std::format }
    project:
      id: cpp-mod-projet
      type: code
      title: Analyse avec expected et ranges
      difficulty: 3
      prompt: |
        Écris `std::expected<int, std::string> lireEntier(std::string_view)` (avec `std::from_chars` ; erreurs `"vide"`, `"pas un nombre : X"` si la conversion échoue ou ne consomme pas tout le jeton).

        L’entrée contient des jetons séparés par des espaces. Pour chaque jeton invalide, affiche l’erreur. Puis, avec les **ranges** sur les entiers valides : affiche les carrés des nombres pairs (séparés par des espaces, ou `-` si aucun) et la somme de tous les entiers valides (via `std::format("somme = {}", …)`).
      starter: |
        #include <charconv>
        #include <expected>
        #include <format>
        #include <iostream>
        #include <ranges>
        #include <string>
        #include <string_view>
        #include <vector>

        int main() {
        }
      solution: |
        #include <charconv>
        #include <expected>
        #include <format>
        #include <iostream>
        #include <numeric>
        #include <ranges>
        #include <string>
        #include <string_view>
        #include <vector>

        std::expected<int, std::string> lireEntier(std::string_view s) {
            if (s.empty()) return std::unexpected("vide");
            int v{};
            auto [p, ec] = std::from_chars(s.data(), s.data() + s.size(), v);
            if (ec != std::errc{} || p != s.data() + s.size()) return std::unexpected("pas un nombre : " + std::string(s));
            return v;
        }

        int main() {
            std::vector<int> valides;
            std::string jeton;
            while (std::cin >> jeton) {
                auto r = lireEntier(jeton);
                if (r) valides.push_back(*r);
                else std::cout << r.error() << "\n";
            }
            auto carres = valides | std::views::filter([](int x) { return x % 2 == 0; }) | std::views::transform([](int x) { return x * x; });
            std::string sortie;
            for (int x : carres) sortie += (sortie.empty() ? "" : " ") + std::to_string(x);
            std::cout << (sortie.empty() ? "-" : sortie) << "\n";
            std::cout << std::format("somme = {}", std::accumulate(valides.begin(), valides.end(), 0)) << "\n";
        }
      tests:
        - { input: 3 4 abc -6 7x 10, output: "pas un nombre : abc\npas un nombre : 7x\n16 36 100\nsomme = 11" }
        - { input: 1 3, output: "-\nsomme = 4", hidden: true }
      require:
        - { pattern: 'std::expected', message: Utiliser std::expected }
        - { pattern: 'views::', message: Utiliser les ranges/views }
