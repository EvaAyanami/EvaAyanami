  - id: pl-java-5c
    level: 5
    type: predict
    prompt: Que va afficher ce programme ?
    code: |
      import java.lang.annotation.*;
      import java.lang.reflect.*;
      import java.util.*;
      public class Main {
          @Retention(RetentionPolicy.RUNTIME) @interface Route { String value(); }
          static class Ctrl {
              @Route("/a") public void a() {}
              public void b() {}
              @Route("/c") public void c() {}
          }
          public static void main(String[] args) {
              List<String> r = new ArrayList<>();
              for (Method m : Ctrl.class.getDeclaredMethods()) {
                  Route x = m.getAnnotation(Route.class);
                  if (x != null) r.add(x.value());
              }
              Collections.sort(r);
              System.out.println(r);
          }
      }
    output: '[/a, /c]'
