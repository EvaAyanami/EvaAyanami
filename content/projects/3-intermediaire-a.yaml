                            let c: Vec<&str> = l.split(';').collect();
                            if c.len() == 3 && !c[0].is_empty() && verifier(&carnet, c[0], c[1], c[2]).is_ok() {
                                carnet.insert(c[0].to_string(), Contact { tel: c[1].to_string(), email: c[2].to_string() });
