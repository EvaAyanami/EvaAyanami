                    if (gagne(l, c)) { afficher(); System.out.println(joueur + " gagne !"); return; }
                    if (pions == LIGNES * COLONNES) { afficher(); System.out.println("Match nul !"); return; }
                    joueur = joueur == 'R' ? 'J' : 'R';
                }
                afficher();
                System.out.println("Partie en cours (au tour de " + joueur + ")");
            }
        }
