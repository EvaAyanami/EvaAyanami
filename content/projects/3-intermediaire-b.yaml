        int main() {
            for (auto& ligne : g) for (char& c : ligne) c = '.';
            char joueur = 'X';
            int coups = 0;
            string s;
            while (getline(cin, s)) {
                istringstream in(s);
                int i, j;
                string reste;
                if (!(in >> i >> j) || (in >> reste) || i < 1 || i > 3 || j < 1 || j > 3 || g[i - 1][j - 1] != '.') {
                    cout << "Coup invalide\n";
                    continue;
                }
                g[i - 1][j - 1] = joueur;
                coups++;
                if (char c = gagnant()) { afficher(); cout << c << " gagne !\n"; return 0; }
