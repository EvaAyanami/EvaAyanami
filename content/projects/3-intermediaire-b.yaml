# Projets — niveau intermédiaire (2/2)
# Chaque étape a un énoncé, des tests (dont cachés) et une solution par langage.
- slug: petit-serveur-http
  level: 3
  title: Petit serveur HTTP
  summary: 'Comprendre le protocole du Web en écrivant le cœur d’un serveur HTTP : analyse des requêtes, routage et réponses.'
  description: |-
    Le Web repose sur **HTTP**, un protocole texte. Une requête ressemble à ceci :

    ```http
    GET /bonjour?nom=Kiri HTTP/1.1
    Host: codemori.local
    Accept: text/plain

    ```

    — une **ligne de requête** (méthode, chemin, version), des **en-têtes** `Nom: valeur`, puis une ligne vide. La réponse suit le même principe :

    ```http
    HTTP/1.1 200 OK
    Content-Type: text/plain; charset=utf-8
    Content-Length: 12

    Bonjour Kiri
    ```

    Pour pouvoir tester ton serveur sans réseau, les requêtes arrivent sur l’**entrée standard**, les unes après les autres, et les réponses partent sur la sortie standard. Après chaque réponse, affiche une ligne `---`. Le cœur du code est identique à celui d’un vrai serveur : il suffirait de brancher une socket TCP.

    `Content-Length` est la taille du corps **en octets** (UTF-8). Les codes utilisés : `200 OK`, `400 Bad Request`, `404 Not Found`, `405 Method Not Allowed`.
  objectives:
  - Comprendre la structure d’une requête et d’une réponse HTTP
  - Analyser du texte structuré (ligne de requête, en-têtes, paramètres)
  - Router des requêtes
  - Choisir le bon code de statut
  constraints:
  - Les noms d’en-têtes ne sont pas sensibles à la casse
  - Les paramètres de requête sont décodés (%20 et + deviennent des espaces)
  - Content-Length compte les octets UTF-8 du corps
  languages:
  - rust
  - cpp
  - java
  steps:
