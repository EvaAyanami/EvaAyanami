  - id: quiz-plateforme
    title: Plateforme multi-utilisateurs
    prompt: |-
      Les réponses deviennent `utilisateur | id | réponse`. Une deuxième réponse d’un même utilisateur à une même question est ignorée (`utilisateur / id : doublon ignoré`) ; une question inconnue → `utilisateur / id : question inconnue` (ces messages s’affichent pendant la lecture).

      Ensuite :

      - `== Scores ==` puis `nom : S/T` (par nom) ;
      - `== Classement ==` puis `rang. nom (S pts)` par score décroissant puis nom ; les ex æquo **partagent le rang** (1, 1, 3) ;
      - `== Questions ==` puis `id : R/N réussite(s) (P%)` (N = nombre de réponses reçues) ou `id : aucune réponse` ;
      - `question la plus difficile : id` (plus faible taux de réussite ; à égalité, la première).
    hints:
    - Mémorise les couples (utilisateur, question) déjà vus dans un ensemble.
    - 'Pour comparer ok₁/n₁ et ok₂/n₂ sans flottants : compare ok₁ × n₂ et ok₂ × n₁.'
    starters: *id001
    solutions:
      rust: |
        use std::collections::{BTreeMap, HashSet};
        use std::io::{self, BufRead};

        // ---- modèle ----
        struct Question {
            id: String,
            reponse: String,
            points: u32,
        }

        // ---- chargement ----
        fn champs(l: &str) -> Vec<String> {
            l.split('|').map(|s| s.trim().to_string()).collect()
        }

        /// Lit les questions jusqu'à la ligne « --- », puis renvoie les lignes de réponses.
        fn charger() -> (Vec<Question>, Vec<Vec<String>>) {
            let stdin = io::stdin();
            let mut questions = vec![];
            let mut reponses = vec![];
            let mut dans_reponses = false;
            for l in stdin.lock().lines() {
                let l = l.unwrap();
                if l.trim().is_empty() {
                    continue;
                }
                if l.trim() == "---" {
                    dans_reponses = true;
                } else if dans_reponses {
                    reponses.push(champs(&l));
                } else {
                    let c = champs(&l);
                    // Q id | énoncé | réponse | points
                    questions.push(Question { id: c[0].trim_start_matches("Q ").trim().to_string(), reponse: c[2].clone(), points: c[3].parse().unwrap() });
                }
            }
            (questions, reponses)
        }

        // ---- correction ----
        fn normaliser(s: &str) -> String {
            s.split_whitespace().collect::<Vec<_>>().join(" ").to_lowercase()
        }

        fn correcte(q: &Question, r: &str) -> bool {
            normaliser(&q.reponse) == normaliser(r)
        }

        // ---- statistiques ----
        fn main() {
            let (questions, reponses) = charger();
            let total: u32 = questions.iter().map(|q| q.points).sum();
            let mut scores: BTreeMap<String, u32> = BTreeMap::new();
            let mut deja: HashSet<(String, String)> = HashSet::new();
            let mut stats: Vec<(u32, u32)> = vec![(0, 0); questions.len()]; // (réussites, réponses)
            for r in &reponses {
                let (user, id, rep) = (&r[0], &r[1], &r[2]);
                scores.entry(user.clone()).or_insert(0);
                let Some(i) = questions.iter().position(|q| &q.id == id) else {
                    println!("{} / {} : question inconnue", user, id);
                    continue;
                };
                if !deja.insert((user.clone(), id.clone())) {
                    println!("{} / {} : doublon ignoré", user, id);
                    continue;
                }
                stats[i].1 += 1;
                if correcte(&questions[i], rep) {
                    stats[i].0 += 1;
                    *scores.get_mut(user).unwrap() += questions[i].points;
                }
            }
            println!("== Scores ==");
            for (u, s) in &scores {
                println!("{} : {}/{}", u, s, total);
            }
            println!("== Classement ==");
            let mut v: Vec<(&String, &u32)> = scores.iter().collect();
            v.sort_by(|a, b| b.1.cmp(a.1).then(a.0.cmp(b.0)));
            for (k, (u, s)) in v.iter().enumerate() {
                // Rang « olympique » : les ex æquo partagent le même rang.
                let rang = v.iter().position(|(_, s2)| s2 == s).unwrap() + 1;
                let _ = k;
                println!("{}. {} ({} pts)", rang, u, s);
            }
            println!("== Questions ==");
            let mut pire: Option<(usize, u32, u32)> = None;
            for (i, q) in questions.iter().enumerate() {
                let (ok, n) = stats[i];
                if n == 0 {
                    println!("{} : aucune réponse", q.id);
                    continue;
                }
                println!("{} : {}/{} réussite(s) ({}%)", q.id, ok, n, ok * 100 / n);
                // Comparaison exacte des taux ok/n par produit en croix.
                if pire.map_or(true, |(_, po, pn)| ok * pn < po * n) {
                    pire = Some((i, ok, n));
                }
            }
            if let Some((i, _, _)) = pire {
                println!("question la plus difficile : {}", questions[i].id);
            }
        }
