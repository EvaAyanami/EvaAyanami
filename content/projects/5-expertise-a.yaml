                scores[user];
                auto it = find_if(questions.begin(), questions.end(), [&](const Question& q) { return q.id == id; });
                if (it == questions.end()) { cout << user << " / " << id << " : question inconnue\n"; continue; }
                if (!deja.insert({user, id}).second) { cout << user << " / " << id << " : doublon ignoré\n"; continue; }
                size_t i = it - questions.begin();
                stats[i].second++;
