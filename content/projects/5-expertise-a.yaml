                for (int k = 0; k < v.size(); k++) {
                    // Rang « olympique » : les ex æquo partagent le même rang.
                    int rang = k;
                    while (rang > 0 && v.get(rang - 1).getValue().equals(v.get(k).getValue())) rang--;
                    System.out.println((rang + 1) + ". " + v.get(k).getKey() + " (" + v.get(k).getValue() + " pts)");
                }
                System.out.println("== Questions ==");
                int pire = -1;
                for (int i = 0; i < questions.size(); i++) {
                    int ok = stats[i][0], n = stats[i][1];
                    if (n == 0) { System.out.println(questions.get(i).id() + " : aucune réponse"); continue; }
                    System.out.println(questions.get(i).id() + " : " + ok + "/" + n + " réussite(s) (" + ok * 100 / n + "%)");
                    // Comparaison exacte des taux ok/n par produit en croix.
                    if (pire < 0 || ok * stats[pire][1] < stats[pire][0] * n) pire = i;
                }
                if (pire >= 0) System.out.println("question la plus difficile : " + questions.get(pire).id());
            }
        }
