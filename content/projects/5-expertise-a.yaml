        #include <algorithm>
        #include <iostream>
        #include <map>
        #include <memory>
        #include <optional>
        #include <set>
        #include <sstream>
        #include <string>
        #include <vector>
        using namespace std;

        // Contrat que tout plugin doit respecter.
        struct Plugin {
            virtual ~Plugin() = default;
            virtual string nom() const = 0;
            virtual string description() const = 0;
            // Lève un runtime_error en cas d'erreur.
            virtual string executer(const vector<string>& args) const = 0;
        };

        string joindre(const vector<string>& v) {
            string r;
            for (size_t i = 0; i < v.size(); i++) r += (i ? " " : "") + v[i];
            return r;
        }

        struct Echo : Plugin {
            string nom() const override { return "echo"; }
            string description() const override { return "répète le texte"; }
            string executer(const vector<string>& a) const override { return joindre(a); }
        };

        struct Majuscules : Plugin {
            string nom() const override { return "majuscules"; }
            string description() const override { return "met le texte en majuscules"; }
            string executer(const vector<string>& a) const override {
                string s = joindre(a);
                for (char& c : s) c = toupper((unsigned char)c);
                return s;
            }
        };

        struct Inverser : Plugin {
            string nom() const override { return "inverser"; }
            string description() const override { return "inverse l'ordre des mots"; }
            string executer(const vector<string>& a) const override { return joindre(vector<string>(a.rbegin(), a.rend())); }
        };

        struct Calc : Plugin {
            string nom() const override { return "calc"; }
            string description() const override { return "calcule a op b"; }
            string executer(const vector<string>& a) const override {
                if (a.size() != 3) throw runtime_error("usage : calc a op b");
                long long x, y;
                try {
                    size_t p1, p2;
                    x = stoll(a[0], &p1);
                    y = stoll(a[2], &p2);
                    if (p1 != a[0].size() || p2 != a[2].size()) throw 0;
                } catch (...) {
                    throw runtime_error("nombres invalides");
                }
                const string& op = a[1];
                if (op == "+") return to_string(x + y);
                if (op == "-") return to_string(x - y);
                if (op == "*") return to_string(x * y);
                if (op == "/") {
                    if (y == 0) throw runtime_error("division par zéro");
                    return to_string(x / y);
                }
                throw runtime_error("opérateur inconnu " + op);
            }
        };

        // Le registre ne connaît que l'interface : ajouter un plugin ne modifie pas le cœur.
        struct Registre {
            map<string, unique_ptr<Plugin>> plugins;
            void ajouter(unique_ptr<Plugin> p) { string n = p->nom(); plugins[n] = move(p); }
            string executer(const string& cmd, const vector<string>& args) const {
                if (cmd == "aide") {
                    string r;
                    for (auto& [n, p] : plugins) r += (r.empty() ? "" : "\n") + n + " : " + p->description();
                    return r;
                }
                auto it = plugins.find(cmd);
                if (it == plugins.end()) return "commande inconnue : " + cmd;
                try {
                    return it->second->executer(args);
                } catch (const runtime_error& e) {
                    return "erreur [" + cmd + "] : " + e.what();
                }
            }
        };

        Registre registre() {
            Registre r;
            r.ajouter(make_unique<Echo>());
            r.ajouter(make_unique<Majuscules>());
            r.ajouter(make_unique<Inverser>());
            r.ajouter(make_unique<Calc>());
            return r;
        }

        vector<string> mots(const string& l) {
            istringstream in(l);
            vector<string> t;
            for (string w; in >> w;) t.push_back(w);
            return t;
        }


        // Une requête traverse une chaîne de middlewares avant d'atteindre le registre.
        struct Requete {
            string utilisateur, cmd;
            vector<string> args;
        };

        struct Middleware {
            virtual ~Middleware() = default;
            // Une réponse = court-circuit : la requête s'arrête ici.
            virtual optional<string> avant(const Requete& r) = 0;
        };

        struct Authentification : Middleware {
            set<string> autorises;
            optional<string> avant(const Requete& r) override {
                if (!autorises.count(r.utilisateur)) return "refusé : utilisateur inconnu";
                return nullopt;
            }
        };

        struct LimiteDebit : Middleware {
            unsigned max = 3;
            map<string, unsigned> compteurs;
            optional<string> avant(const Requete& r) override {
                if (++compteurs[r.utilisateur] > max) return "refusé : limite atteinte";
                return nullopt;
            }
        };

        struct Metriques : Middleware {
            map<string, unsigned> appels;
            optional<string> avant(const Requete& r) override {
                appels[r.cmd]++;
                return nullopt;
            }
        };

        int main() {
            string entete;
            getline(cin, entete);
            auto auth = make_unique<Authentification>();
            auto metriques = make_unique<Metriques>();
            Metriques* m = metriques.get();
            for (auto& u : mots(entete.substr(entete.find(':') + 1))) auth->autorises.insert(u);
            vector<unique_ptr<Middleware>> chaine;
            chaine.push_back(move(auth));
            chaine.push_back(make_unique<LimiteDebit>());
            chaine.push_back(move(metriques));
            Registre reg = registre();
            int acceptees = 0, refusees = 0;
            string ligne;
            while (getline(cin, ligne)) {
                auto t = mots(ligne);
                if (t.size() < 2) continue;
                Requete req{t[0], t[1], vector<string>(t.begin() + 2, t.end())};
                if (req.cmd == "stats" && req.utilisateur == "admin") {
                    for (auto& [c, n] : m->appels) cout << "[admin] " << c << " : " << n << " appel(s)\n";
                    continue;
                }
                optional<string> reponse;
                for (auto& mw : chaine)
                    if ((reponse = mw->avant(req))) break;
                if (reponse) { refusees++; cout << "[" << req.utilisateur << "] " << *reponse << "\n"; }
                else { acceptees++; cout << "[" << req.utilisateur << "] " << reg.executer(req.cmd, req.args) << "\n"; }
            }
            cout << "journal : " << acceptees + refusees << " requête(s), " << acceptees << " acceptée(s), " << refusees << " refusée(s)\n";
        }
