    solutions:
      rust: |
        use std::collections::{BTreeMap, HashSet};
        use std::io::{self, BufRead};

        // ---- modèle ----
        struct Question {
            id: String,
            reponse: String,
            points: u32,
        }

        // ---- chargement ----
        fn champs(l: &str) -> Vec<String> {
            l.split('|').map(|s| s.trim().to_string()).collect()
        }

        /// Lit les questions jusqu'à la ligne « --- », puis renvoie les lignes de réponses.
        fn charger() -> (Vec<Question>, Vec<Vec<String>>) {
            let stdin = io::stdin();
            let mut questions = vec![];
            let mut reponses = vec![];
            let mut dans_reponses = false;
            for l in stdin.lock().lines() {
                let l = l.unwrap();
                if l.trim().is_empty() {
                    continue;
                }
                if l.trim() == "---" {
                    dans_reponses = true;
                } else if dans_reponses {
                    reponses.push(champs(&l));
                } else {
                    let c = champs(&l);
                    // Q id | énoncé | réponse | points
                    questions.push(Question { id: c[0].trim_start_matches("Q ").trim().to_string(), reponse: c[2].clone(), points: c[3].parse().unwrap() });
                }
            }
            (questions, reponses)
        }

        // ---- correction ----
        fn normaliser(s: &str) -> String {
            s.split_whitespace().collect::<Vec<_>>().join(" ").to_lowercase()
        }

        fn correcte(q: &Question, r: &str) -> bool {
            normaliser(&q.reponse) == normaliser(r)
        }

        fn main() {
            let (questions, reponses) = charger();
            let total: u32 = questions.iter().map(|q| q.points).sum();
            let mut score = 0;
            let mut repondues = HashSet::new();
            for r in &reponses {
                let Some(q) = questions.iter().find(|q| q.id == r[0]) else {
                    println!("{} : question inconnue", r[0]);
                    continue;
                };
                repondues.insert(q.id.clone());
                if correcte(q, &r[1]) {
                    score += q.points;
                    println!("{} : correct (+{})", q.id, q.points);
                } else {
                    println!("{} : incorrect (attendu : {})", q.id, q.reponse);
                }
            }
            let sans = questions.iter().filter(|q| !repondues.contains(&q.id)).count();
            println!("sans réponse : {}", sans);
            let pct = if total == 0 { 0 } else { score * 100 / total };
            println!("score : {}/{} ({}%) — {}", score, total, pct, if pct >= 50 { "réussi" } else { "à retravailler" });
            let _ = BTreeMap::<u8, u8>::new();
        }
      cpp: |
        #include <algorithm>
        #include <cctype>
        #include <iostream>
        #include <map>
        #include <set>
        #include <sstream>
        #include <string>
        #include <vector>
        using namespace std;

        // ---- modèle ----
        struct Question {
            string id, reponse;
            unsigned points;
        };

        // ---- chargement ----
        string rogner(const string& s) {
            size_t a = s.find_first_not_of(" \t\r"), b = s.find_last_not_of(" \t\r");
            return a == string::npos ? "" : s.substr(a, b - a + 1);
        }

        vector<string> champs(const string& l) {
            vector<string> v;
            stringstream ss(l);
            for (string c; getline(ss, c, '|');) v.push_back(rogner(c));
            if (!l.empty() && l.back() == '|') v.push_back("");
            return v;
        }

        // Lit les questions jusqu'à la ligne « --- », puis les lignes de réponses.
        void charger(vector<Question>& questions, vector<vector<string>>& reponses) {
            bool dansReponses = false;
            for (string l; getline(cin, l);) {
                if (rogner(l).empty()) continue;
                if (rogner(l) == "---") dansReponses = true;
                else if (dansReponses) reponses.push_back(champs(l));
                else {
                    auto c = champs(l);  // Q id | énoncé | réponse | points
                    questions.push_back({rogner(c[0].substr(1)), c[2], (unsigned)stoul(c[3])});
                }
            }
        }

        // ---- correction ----
        string normaliser(const string& s) {
            istringstream in(s);
            string r, m;
            while (in >> m) r += (r.empty() ? "" : " ") + m;
            for (char& c : r) c = tolower((unsigned char)c);
            return r;
        }

        bool correcte(const Question& q, const string& r) { return normaliser(q.reponse) == normaliser(r); }

        int main() {
            vector<Question> questions;
            vector<vector<string>> reponses;
            charger(questions, reponses);
            unsigned total = 0, score = 0;
            for (auto& q : questions) total += q.points;
            set<string> repondues;
            for (auto& r : reponses) {
                auto it = find_if(questions.begin(), questions.end(), [&](const Question& q) { return q.id == r[0]; });
                if (it == questions.end()) { cout << r[0] << " : question inconnue\n"; continue; }
                repondues.insert(it->id);
                if (correcte(*it, r[1])) { score += it->points; cout << it->id << " : correct (+" << it->points << ")\n"; }
                else cout << it->id << " : incorrect (attendu : " << it->reponse << ")\n";
            }
            int sans = 0;
            for (auto& q : questions) sans += !repondues.count(q.id);
            cout << "sans réponse : " << sans << "\n";
            unsigned pct = total ? score * 100 / total : 0;
            cout << "score : " << score << "/" << total << " (" << pct << "%) — " << (pct >= 50 ? "réussi" : "à retravailler") << "\n";
        }
