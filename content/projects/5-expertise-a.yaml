  - id: modulaire-middlewares
    title: Chaîne de middlewares
    prompt: |-
      Première ligne : `utilisateurs: nom1 nom2…` (les utilisateurs autorisés). Chaque ligne suivante : `utilisateur commande arguments…`. La requête traverse, dans l’ordre :

      1. **authentification** : utilisateur non autorisé → `refusé : utilisateur inconnu` ;
      2. **limite de débit** : au-delà de 3 requêtes (comptées dès qu’elles passent l’authentification) pour un même utilisateur → `refusé : limite atteinte` ;
      3. **métriques** : compte les appels par commande.

      Affiche `[utilisateur] réponse`. Cas spécial : `admin stats` (hors chaîne) affiche `[admin] commande : N appel(s)` pour chaque commande comptée (par nom). Termine par `journal : N requête(s), A acceptée(s), R refusée(s)` (sans les `admin stats`).
    hints:
    - Un middleware = une interface avec une seule méthode qui renvoie « rien » (continuer) ou une réponse (arrêter).
    - Parcours la chaîne dans l’ordre et arrête-toi au premier court-circuit.
    starters: *id001
    solutions:
      rust: |
        use std::collections::{BTreeMap, HashMap, HashSet};
        use std::io::{self, BufRead};

        /// Contrat que tout plugin doit respecter.
        trait Plugin {
            fn nom(&self) -> &str;
            fn description(&self) -> &str;
            fn executer(&self, args: &[&str]) -> Result<String, String>;
        }

        struct Echo;
        impl Plugin for Echo {
            fn nom(&self) -> &str { "echo" }
            fn description(&self) -> &str { "répète le texte" }
            fn executer(&self, args: &[&str]) -> Result<String, String> { Ok(args.join(" ")) }
        }

        struct Majuscules;
        impl Plugin for Majuscules {
            fn nom(&self) -> &str { "majuscules" }
            fn description(&self) -> &str { "met le texte en majuscules" }
            fn executer(&self, args: &[&str]) -> Result<String, String> { Ok(args.join(" ").to_uppercase()) }
        }

        struct Inverser;
        impl Plugin for Inverser {
            fn nom(&self) -> &str { "inverser" }
            fn description(&self) -> &str { "inverse l'ordre des mots" }
            fn executer(&self, args: &[&str]) -> Result<String, String> {
                Ok(args.iter().rev().copied().collect::<Vec<_>>().join(" "))
            }
        }

        struct Calc;
        impl Plugin for Calc {
            fn nom(&self) -> &str { "calc" }
            fn description(&self) -> &str { "calcule a op b" }
            fn executer(&self, args: &[&str]) -> Result<String, String> {
                let [a, op, b] = args else { return Err("usage : calc a op b".into()) };
                let (Ok(a), Ok(b)) = (a.parse::<i64>(), b.parse::<i64>()) else { return Err("nombres invalides".into()) };
                match *op {
                    "+" => Ok((a + b).to_string()),
                    "-" => Ok((a - b).to_string()),
                    "*" => Ok((a * b).to_string()),
                    "/" if b == 0 => Err("division par zéro".into()),
                    "/" => Ok((a / b).to_string()),
                    _ => Err(format!("opérateur inconnu {}", op)),
                }
            }
        }

        /// Le registre ne connaît que le trait : ajouter un plugin ne modifie pas le cœur.
        struct Registre {
            plugins: BTreeMap<String, Box<dyn Plugin>>,
        }

        impl Registre {
            fn new(liste: Vec<Box<dyn Plugin>>) -> Self {
                Registre { plugins: liste.into_iter().map(|p| (p.nom().to_string(), p)).collect() }
            }
            fn executer(&self, cmd: &str, args: &[&str]) -> String {
                if cmd == "aide" {
                    return self.plugins.values().map(|p| format!("{} : {}", p.nom(), p.description())).collect::<Vec<_>>().join("\n");
                }
                match self.plugins.get(cmd) {
                    None => format!("commande inconnue : {}", cmd),
                    Some(p) => p.executer(args).unwrap_or_else(|e| format!("erreur [{}] : {}", cmd, e)),
                }
            }
        }

        fn registre() -> Registre {
            Registre::new(vec![Box::new(Echo), Box::new(Majuscules), Box::new(Inverser), Box::new(Calc)])
        }


        /// Une requête traverse une chaîne de middlewares avant d'atteindre le registre.
        struct Requete<'a> {
            utilisateur: &'a str,
            cmd: &'a str,
            args: &'a [&'a str],
        }

        trait Middleware {
            /// Some(réponse) = court-circuit : la requête s'arrête ici.
            fn avant(&mut self, req: &Requete) -> Option<String>;
        }

        struct Authentification {
            autorises: HashSet<String>,
        }
        impl Middleware for Authentification {
            fn avant(&mut self, req: &Requete) -> Option<String> {
                (!self.autorises.contains(req.utilisateur)).then(|| "refusé : utilisateur inconnu".to_string())
            }
        }

        struct LimiteDebit {
            max: u32,
            compteurs: HashMap<String, u32>,
        }
        impl Middleware for LimiteDebit {
            fn avant(&mut self, req: &Requete) -> Option<String> {
                let c = self.compteurs.entry(req.utilisateur.to_string()).or_insert(0);
                *c += 1;
                (*c > self.max).then(|| "refusé : limite atteinte".to_string())
            }
        }

        #[derive(Default)]
        struct Metriques {
            appels: BTreeMap<String, u32>,
        }
        impl Middleware for Metriques {
            fn avant(&mut self, req: &Requete) -> Option<String> {
                *self.appels.entry(req.cmd.to_string()).or_insert(0) += 1;
                None
            }
        }

        fn main() {
            let stdin = io::stdin();
            let mut lignes = stdin.lock().lines().map(|l| l.unwrap());
            let entete = lignes.next().unwrap();
            let autorises: HashSet<String> = entete.trim_start_matches("utilisateurs:").split_whitespace().map(String::from).collect();
            let reg = registre();
            let mut auth = Authentification { autorises };
            let mut limite = LimiteDebit { max: 3, compteurs: HashMap::new() };
            let mut metriques = Metriques::default();
            let (mut acceptees, mut refusees) = (0, 0);
            for ligne in lignes {
                let t: Vec<&str> = ligne.split_whitespace().collect();
                if t.len() < 2 {
                    continue;
                }
                let req = Requete { utilisateur: t[0], cmd: t[1], args: &t[2..] };
                if req.cmd == "stats" && req.utilisateur == "admin" {
                    for (c, n) in &metriques.appels {
                        println!("[admin] {} : {} appel(s)", c, n);
                    }
                    continue;
                }
                let chaine: [&mut dyn Middleware; 3] = [&mut auth, &mut limite, &mut metriques];
                let mut reponse = None;
                for mw in chaine {
                    reponse = mw.avant(&req);
                    if reponse.is_some() {
                        break;
                    }
                }
                match reponse {
                    Some(r) => {
                        refusees += 1;
                        println!("[{}] {}", req.utilisateur, r);
                    }
                    None => {
                        acceptees += 1;
                        println!("[{}] {}", req.utilisateur, reg.executer(req.cmd, req.args));
                    }
                }
            }
            println!("journal : {} requête(s), {} acceptée(s), {} refusée(s)", acceptees + refusees, acceptees, refusees);
        }
