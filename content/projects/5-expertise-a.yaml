        #include <algorithm>
        #include <iostream>
        #include <map>
        #include <memory>
        #include <optional>
        #include <set>
        #include <sstream>
        #include <string>
        #include <vector>
        using namespace std;

        // Contrat que tout plugin doit respecter.
        struct Plugin {
            virtual ~Plugin() = default;
            virtual string nom() const = 0;
            virtual string description() const = 0;
            // Lève un runtime_error en cas d'erreur.
            virtual string executer(const vector<string>& args) const = 0;
        };

        string joindre(const vector<string>& v) {
            string r;
            for (size_t i = 0; i < v.size(); i++) r += (i ? " " : "") + v[i];
            return r;
        }

        struct Echo : Plugin {
            string nom() const override { return "echo"; }
            string description() const override { return "répète le texte"; }
            string executer(const vector<string>& a) const override { return joindre(a); }
        };

        struct Majuscules : Plugin {
            string nom() const override { return "majuscules"; }
            string description() const override { return "met le texte en majuscules"; }
            string executer(const vector<string>& a) const override {
                string s = joindre(a);
                for (char& c : s) c = toupper((unsigned char)c);
                return s;
            }
        };

        struct Inverser : Plugin {
            string nom() const override { return "inverser"; }
            string description() const override { return "inverse l'ordre des mots"; }
            string executer(const vector<string>& a) const override { return joindre(vector<string>(a.rbegin(), a.rend())); }
        };

        struct Calc : Plugin {
            string nom() const override { return "calc"; }
            string description() const override { return "calcule a op b"; }
            string executer(const vector<string>& a) const override {
                if (a.size() != 3) throw runtime_error("usage : calc a op b");
                long long x, y;
                try {
                    size_t p1, p2;
                    x = stoll(a[0], &p1);
                    y = stoll(a[2], &p2);
                    if (p1 != a[0].size() || p2 != a[2].size()) throw 0;
                } catch (...) {
                    throw runtime_error("nombres invalides");
                }
                const string& op = a[1];
                if (op == "+") return to_string(x + y);
                if (op == "-") return to_string(x - y);
                if (op == "*") return to_string(x * y);
                if (op == "/") {
                    if (y == 0) throw runtime_error("division par zéro");
                    return to_string(x / y);
                }
                throw runtime_error("opérateur inconnu " + op);
            }
        };

        // Le registre ne connaît que l'interface : ajouter un plugin ne modifie pas le cœur.
        struct Registre {
            map<string, unique_ptr<Plugin>> plugins;
            void ajouter(unique_ptr<Plugin> p) { string n = p->nom(); plugins[n] = move(p); }
            string executer(const string& cmd, const vector<string>& args) const {
                if (cmd == "aide") {
                    string r;
                    for (auto& [n, p] : plugins) r += (r.empty() ? "" : "\n") + n + " : " + p->description();
                    return r;
                }
                auto it = plugins.find(cmd);
                if (it == plugins.end()) return "commande inconnue : " + cmd;
                try {
                    return it->second->executer(args);
                } catch (const runtime_error& e) {
                    return "erreur [" + cmd + "] : " + e.what();
                }
            }
        };

        Registre registre() {
            Registre r;
            r.ajouter(make_unique<Echo>());
            r.ajouter(make_unique<Majuscules>());
            r.ajouter(make_unique<Inverser>());
            r.ajouter(make_unique<Calc>());
            return r;
        }

        vector<string> mots(const string& l) {
            istringstream in(l);
            vector<string> t;
            for (string w; in >> w;) t.push_back(w);
            return t;
        }

        int main() {
            Registre reg = registre();
            string ligne;
            while (getline(cin, ligne)) {
                auto t = mots(ligne);
                if (t.empty()) continue;
                cout << reg.executer(t[0], vector<string>(t.begin() + 1, t.end())) << "\n";
            }
        }
      java: |
        import java.util.*;

        public class Main {
            /** Contrat que tout plugin doit respecter. */
            interface Plugin {
                String nom();
                String description();
                String executer(List<String> args) throws ErreurPlugin;
            }

            static class ErreurPlugin extends Exception {
                ErreurPlugin(String m) { super(m); }
            }

            record Echo() implements Plugin {
                public String nom() { return "echo"; }
                public String description() { return "répète le texte"; }
                public String executer(List<String> a) { return String.join(" ", a); }
            }

            record Majuscules() implements Plugin {
                public String nom() { return "majuscules"; }
                public String description() { return "met le texte en majuscules"; }
                public String executer(List<String> a) { return String.join(" ", a).toUpperCase(Locale.ROOT); }
            }

            record Inverser() implements Plugin {
                public String nom() { return "inverser"; }
                public String description() { return "inverse l'ordre des mots"; }
                public String executer(List<String> a) {
                    List<String> r = new ArrayList<>(a);
                    Collections.reverse(r);
                    return String.join(" ", r);
                }
            }

            record Calc() implements Plugin {
                public String nom() { return "calc"; }
                public String description() { return "calcule a op b"; }
                public String executer(List<String> a) throws ErreurPlugin {
                    if (a.size() != 3) throw new ErreurPlugin("usage : calc a op b");
                    long x, y;
                    try { x = Long.parseLong(a.get(0)); y = Long.parseLong(a.get(2)); }
                    catch (NumberFormatException e) { throw new ErreurPlugin("nombres invalides"); }
                    return switch (a.get(1)) {
                        case "+" -> String.valueOf(x + y);
                        case "-" -> String.valueOf(x - y);
                        case "*" -> String.valueOf(x * y);
                        case "/" -> { if (y == 0) throw new ErreurPlugin("division par zéro"); yield String.valueOf(x / y); }
                        default -> throw new ErreurPlugin("opérateur inconnu " + a.get(1));
                    };
                }
            }

            /** Le registre ne connaît que l'interface : ajouter un plugin ne modifie pas le cœur. */
            static class Registre {
                final TreeMap<String, Plugin> plugins = new TreeMap<>();
                Registre(Plugin... ps) { for (Plugin p : ps) plugins.put(p.nom(), p); }
                String executer(String cmd, List<String> args) {
                    if (cmd.equals("aide")) {
                        StringJoiner j = new StringJoiner("\n");
                        plugins.values().forEach(p -> j.add(p.nom() + " : " + p.description()));
                        return j.toString();
                    }
                    Plugin p = plugins.get(cmd);
                    if (p == null) return "commande inconnue : " + cmd;
                    try { return p.executer(args); }
                    catch (ErreurPlugin e) { return "erreur [" + cmd + "] : " + e.getMessage(); }
                }
            }

            static Registre registre() { return new Registre(new Echo(), new Majuscules(), new Inverser(), new Calc()); }

            public static void main(String[] args) {
                Registre reg = registre();
                Scanner sc = new Scanner(System.in);
                while (sc.hasNextLine()) {
                    String l = sc.nextLine().trim();
                    if (l.isEmpty()) continue;
                    List<String> t = List.of(l.split("\\s+"));
                    System.out.println(reg.executer(t.get(0), t.subList(1, t.size())));
                }
            }
        }
