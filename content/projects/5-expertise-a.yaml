                // Rang « olympique » : les ex æquo partagent le même rang.
                size_t rang = k;
                while (rang > 0 && v[rang - 1].second == v[k].second) rang--;
                cout << rang + 1 << ". " << v[k].first << " (" << v[k].second << " pts)\n";
            }
