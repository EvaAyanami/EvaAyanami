# Projets — niveau expertise (1/2)
# Chaque étape a un énoncé, des tests (dont cachés) et une solution par langage.
- slug: application-quiz
  level: 5
  title: 'Application complète : plateforme de quiz'
  summary: 'Concevoir une application complète et bien structurée : chargement de données, correction, multi-utilisateurs, classement et statistiques.'
  description: |-
    Tu réalises une application **complète**, de l’entrée des données aux statistiques — avec une **architecture en modules** clairement séparés, comme dans un vrai projet :

    | Module | Responsabilité |
    |---|---|
    | modèle | les types (`Question`…) |
    | chargement | lire et analyser l’entrée |
    | correction | comparer une réponse à la solution |
    | statistiques | scores, classement, indicateurs |

    L’entrée commence par la définition du quiz, une question par ligne :

    ```
    Q id | énoncé | bonne réponse | points
    ```

    puis une ligne `---`, puis les réponses. Une réponse est correcte si elle est égale à la solution **sans tenir compte de la casse ni des espaces superflus** (`garbage  COLLECTOR` = `Garbage Collector`).
  objectives:
  - Structurer une application en modules à responsabilité unique
  - Analyser un format de données
  - Normaliser des chaînes pour les comparer
  - Calculer classements et statistiques sans erreur d’arrondi
  constraints:
  - Pourcentages entiers arrondis à l’inférieur
  - Comparer les taux de réussite sans nombres à virgule (produit en croix)
  - Champs séparés par « | », espaces autour ignorés
  languages:
  - rust
  - cpp
  - java
  steps:
  - id: quiz-correction
    title: Correction d’une copie
    prompt: |-
      Après `---`, chaque ligne est une réponse : `id | réponse`. Affiche pour chacune `id : correct (+points)`, `id : incorrect (attendu : solution)` ou `id : question inconnue`.

      Puis `sans réponse : N` et `score : S/T (P%) — réussi` (si P ≥ 50) ou `— à retravailler`.
    hints:
    - 'Normalise : découpe sur les espaces, rejoins avec un seul espace, passe en minuscules.'
    - 'Le pourcentage entier : score × 100 / total (division entière).'
