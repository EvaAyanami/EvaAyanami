- slug: architecture-modulaire
  level: 5
  title: 'Logiciel modulaire : plugins et middlewares'
  summary: 'Concevoir une architecture extensible : un cœur stable, des plugins interchangeables derrière une interface, et une chaîne de middlewares.'
  description: |-
    Les grands logiciels (navigateurs, éditeurs de code, serveurs web, frameworks) sont **extensibles** : leur cœur ne change pas quand on ajoute une fonctionnalité. Deux patrons rendent cela possible :

    - les **plugins** : chaque fonctionnalité implémente une **interface commune** (trait Rust, classe abstraite C++, interface Java) et s’enregistre auprès d’un **registre** ; le cœur ne connaît que l’interface (principe ouvert/fermé, inversion des dépendances) ;
    - les **middlewares** : une requête traverse une **chaîne de traitements** (authentification, limitation de débit, métriques…) avant d’atteindre sa cible. Chaque maillon peut **court-circuiter** la chaîne. C’est le modèle d’Express, d’ASP.NET, de Tower (Rust) ou des filtres de servlets Java.

    Plugins fournis : `echo` (répète le texte), `majuscules`, `inverser` (l’ordre des mots) et `calc a op b` (entiers, `+ - * /`). La commande `aide` liste les plugins (par nom) avec leur description.
  objectives:
  - Définir une interface et plusieurs implémentations
  - Découpler le cœur des extensions (registre)
  - Construire une chaîne de responsabilité (middlewares)
  - Gérer les erreurs des extensions sans faire tomber le cœur
  constraints:
  - Le registre ne connaît aucun plugin concret
  - Une erreur dans un plugin ne doit jamais arrêter le programme
  - 'Ordre de la chaîne : authentification, limite de débit, métriques'
  languages:
  - rust
  - cpp
  - java
  steps:
  - id: modulaire-plugins
    title: Registre de plugins
    prompt: 'Chaque ligne : `commande arguments…`. Affiche le résultat du plugin, `commande inconnue : X`, ou `erreur [plugin] : message` (`usage : calc a op b`, `nombres invalides`, `division par zéro`, `opérateur inconnu OP`).'
    hints:
    - Range les plugins dans un dictionnaire nom → plugin (trié par nom pour l’aide).
    - 'Le registre transforme les erreurs des plugins en message : il ne plante jamais.'
    starters: *id001
    solutions:
      rust: |
        use std::collections::{BTreeMap, HashMap, HashSet};
        use std::io::{self, BufRead};

        /// Contrat que tout plugin doit respecter.
        trait Plugin {
            fn nom(&self) -> &str;
            fn description(&self) -> &str;
            fn executer(&self, args: &[&str]) -> Result<String, String>;
        }

        struct Echo;
        impl Plugin for Echo {
            fn nom(&self) -> &str { "echo" }
            fn description(&self) -> &str { "répète le texte" }
            fn executer(&self, args: &[&str]) -> Result<String, String> { Ok(args.join(" ")) }
        }

        struct Majuscules;
        impl Plugin for Majuscules {
            fn nom(&self) -> &str { "majuscules" }
            fn description(&self) -> &str { "met le texte en majuscules" }
            fn executer(&self, args: &[&str]) -> Result<String, String> { Ok(args.join(" ").to_uppercase()) }
        }

        struct Inverser;
        impl Plugin for Inverser {
            fn nom(&self) -> &str { "inverser" }
            fn description(&self) -> &str { "inverse l'ordre des mots" }
            fn executer(&self, args: &[&str]) -> Result<String, String> {
                Ok(args.iter().rev().copied().collect::<Vec<_>>().join(" "))
            }
        }

        struct Calc;
        impl Plugin for Calc {
            fn nom(&self) -> &str { "calc" }
            fn description(&self) -> &str { "calcule a op b" }
            fn executer(&self, args: &[&str]) -> Result<String, String> {
                let [a, op, b] = args else { return Err("usage : calc a op b".into()) };
                let (Ok(a), Ok(b)) = (a.parse::<i64>(), b.parse::<i64>()) else { return Err("nombres invalides".into()) };
                match *op {
                    "+" => Ok((a + b).to_string()),
                    "-" => Ok((a - b).to_string()),
                    "*" => Ok((a * b).to_string()),
                    "/" if b == 0 => Err("division par zéro".into()),
                    "/" => Ok((a / b).to_string()),
                    _ => Err(format!("opérateur inconnu {}", op)),
                }
            }
        }

        /// Le registre ne connaît que le trait : ajouter un plugin ne modifie pas le cœur.
        struct Registre {
            plugins: BTreeMap<String, Box<dyn Plugin>>,
        }

        impl Registre {
            fn new(liste: Vec<Box<dyn Plugin>>) -> Self {
                Registre { plugins: liste.into_iter().map(|p| (p.nom().to_string(), p)).collect() }
            }
            fn executer(&self, cmd: &str, args: &[&str]) -> String {
                if cmd == "aide" {
                    return self.plugins.values().map(|p| format!("{} : {}", p.nom(), p.description())).collect::<Vec<_>>().join("\n");
                }
                match self.plugins.get(cmd) {
                    None => format!("commande inconnue : {}", cmd),
                    Some(p) => p.executer(args).unwrap_or_else(|e| format!("erreur [{}] : {}", cmd, e)),
                }
            }
        }

        fn registre() -> Registre {
            Registre::new(vec![Box::new(Echo), Box::new(Majuscules), Box::new(Inverser), Box::new(Calc)])
        }

        fn main() {
            let reg = registre();
            for ligne in io::stdin().lock().lines() {
                let ligne = ligne.unwrap();
                let t: Vec<&str> = ligne.split_whitespace().collect();
                if let Some((cmd, args)) = t.split_first() {
                    println!("{}", reg.executer(cmd, args));
                }
            }
            let _ = (HashMap::<u8, u8>::new(), HashSet::<u8>::new());
        }
