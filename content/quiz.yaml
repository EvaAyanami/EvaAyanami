# Banque de questions du mini-jeu « Blind test » (duels entre amis).
# theme : code (culture du code), hardware, blind (devine le langage à partir d'un extrait)
# answer : index de la bonne réponse (0 = première)

- { id: c01, theme: code, q: "Qui est considérée comme la première programmeuse de l’histoire ?", choices: [Grace Hopper, Ada Lovelace, Margaret Hamilton, Hedy Lamarr], answer: 1, explain: "Ada Lovelace a écrit en 1843 un algorithme pour la machine analytique de Babbage." }
- { id: c02, theme: code, q: "Quel langage a été créé par Guido van Rossum ?", choices: [Ruby, Perl, Python, Lua], answer: 2, explain: "Python est sorti en 1991. Son nom vient des Monty Python, pas du serpent !" }
- { id: c03, theme: code, q: "Que signifie « HTML » ?", choices: [HyperText Markup Language, High Tech Modern Language, Home Tool Markup Language, Hyperlink Text Machine Language], answer: 0, explain: "HTML est un langage de balisage, pas un langage de programmation." }
- { id: c04, theme: code, q: "Qui a créé le noyau Linux en 1991 ?", choices: [Richard Stallman, Linus Torvalds, Ken Thompson, Bill Gates], answer: 1, explain: "Linus Torvalds l’a annoncé sur Usenet comme « un simple hobby »." }
- { id: c05, theme: code, q: "Quel est le nom de la mascotte officieuse de Rust ?", choices: [Gopher, Duke, Ferris, Tux], answer: 2, explain: "Ferris le crabe. Gopher est la mascotte de Go, Duke celle de Java, Tux celle de Linux." }
- { id: c06, theme: code, q: "Que veut dire « bug » en informatique, d’après la légende de 1947 ?", choices: [Un virus, Un insecte coincé dans un relais, Un câble coupé, Une erreur de frappe], answer: 1, explain: "L’équipe de Grace Hopper a trouvé un papillon de nuit dans un relais du Harvard Mark II." }
- { id: c07, theme: code, q: "Quel langage est utilisé pour styliser une page web ?", choices: [HTML, CSS, SQL, JSON], answer: 1, explain: "CSS (Cascading Style Sheets) gère les couleurs, polices, marges, mises en page…" }
- { id: c08, theme: code, q: "Que fait la commande Git « git commit » ?", choices: [Envoie le code sur GitHub, Enregistre un instantané des changements, Supprime une branche, Télécharge un dépôt], answer: 1, explain: "Le commit enregistre localement ; c’est « git push » qui envoie sur le serveur." }
- { id: c09, theme: code, q: "Combien vaut 0.1 + 0.2 en virgule flottante (double) ?", choices: ["0.3", "0.30000000000000004", "0.2999", Une erreur], answer: 1, explain: "0,1 et 0,2 n’ont pas de représentation binaire exacte, d’où une petite erreur d’arrondi." }
- { id: c10, theme: code, q: "Quel langage tourne nativement dans tous les navigateurs web ?", choices: [Java, Python, JavaScript, C#], answer: 2, explain: "JavaScript (et WebAssembly) sont exécutés par le navigateur. Java et JavaScript n’ont rien à voir !" }
- { id: c11, theme: code, q: "Que signifie « open source » ?", choices: [Le logiciel est gratuit, Le code source est public et réutilisable selon une licence, Le logiciel n’a pas de bug, Le logiciel est en ligne], answer: 1, explain: "Open source = code accessible, modifiable et redistribuable selon la licence (MIT, GPL…)." }
- { id: c12, theme: code, q: "Quel est l’indice du premier élément d’un tableau en C, Java ou Python ?", choices: ["0", "1", "-1", Ça dépend du jour], answer: 0, explain: "La plupart des langages commencent à 0 (Lua et Fortran commencent à 1)." }
- { id: c13, theme: code, q: "Que fait un compilateur ?", choices: [Il exécute le code ligne par ligne, Il traduit le code source en code machine, Il dessine l’interface, Il compresse les fichiers], answer: 1, explain: "Un interpréteur exécute directement ; un compilateur traduit avant l’exécution." }
- { id: c14, theme: code, q: "Quelle structure de données suit le principe « dernier entré, premier sorti » ?", choices: [La file, La pile, L’arbre, Le graphe], answer: 1, explain: "LIFO = pile (stack). La file est FIFO : premier entré, premier sorti." }
- { id: c15, theme: code, q: "Quelle est la complexité d’une recherche dichotomique dans un tableau trié ?", choices: ["O(1)", "O(log n)", "O(n)", "O(n²)"], answer: 1, explain: "On divise l’intervalle par deux à chaque étape." }
- { id: c16, theme: code, q: "Que signifie « SQL » ?", choices: [Structured Query Language, Simple Question Logic, Server Quick Link, Sequential Query Loop], answer: 0, explain: "SQL sert à interroger des bases de données relationnelles." }
- { id: c17, theme: code, q: "Quel symbole commence les variables en PHP ?", choices: ["@", "#", "$", "&"], answer: 2, explain: "Exemple : $nom = \"Kiri\";" }
- { id: c18, theme: code, q: "Quelle entreprise a créé le langage Java (1995) ?", choices: [Microsoft, Sun Microsystems, Apple, IBM], answer: 1, explain: "Java a été conçu chez Sun par James Gosling ; Oracle a racheté Sun en 2010." }
- { id: c19, theme: code, q: "Que représente « 404 » sur le web ?", choices: [Serveur en panne, Page introuvable, Accès interdit, Redirection], answer: 1, explain: "404 Not Found. 403 = interdit, 500 = erreur serveur, 301 = redirection." }
- { id: c20, theme: code, q: "En Python, que produit len(\"Kiri\") ?", choices: ["3", "4", "5", Une erreur], answer: 1, explain: "len renvoie le nombre de caractères : K, i, r, i." }
- { id: c21, theme: code, q: "Qu’est-ce qu’une boucle infinie ?", choices: [Une boucle très rapide, Une boucle dont la condition de sortie n’est jamais atteinte, Une boucle sur un tableau infini, Une fonction récursive], answer: 1, explain: "Le programme tourne sans fin : il faut que la condition finisse par devenir fausse." }
- { id: c22, theme: code, q: "Que signifie « API » ?", choices: [Application Programming Interface, Advanced Program Installer, Automatic Process Index, Applied Python Integration], answer: 0, explain: "Une API est un contrat qui permet à des programmes de communiquer." }
- { id: c23, theme: code, q: "Quel est le résultat de 7 // 2 en Python ?", choices: ["3.5", "3", "4", "1"], answer: 1, explain: "// est la division entière." }
- { id: c24, theme: code, q: "Quel langage a été créé par Bjarne Stroustrup ?", choices: [C, C++, C#, Objective-C], answer: 1, explain: "C++ a commencé en 1979 sous le nom « C with Classes »." }
- { id: c25, theme: code, q: "Qu’est-ce que la récursivité ?", choices: [Une fonction qui s’appelle elle-même, Une boucle while, Une variable globale, Un type de tableau], answer: 0, explain: "Il faut toujours un cas de base pour s’arrêter." }
- { id: c26, theme: code, q: "Que signifie « CSS » ?", choices: [Computer Style Sheets, Cascading Style Sheets, Creative Script System, Colorful Style Syntax], answer: 1, explain: "« Cascading » : plusieurs règles peuvent s’appliquer, la plus spécifique gagne." }
- { id: c27, theme: code, q: "Que contient un fichier .json ?", choices: [Du code machine, Des données structurées en texte, Une image, Un programme Java], answer: 1, explain: "JSON = JavaScript Object Notation, très utilisé par les API." }
- { id: c28, theme: code, q: "Quelle balise HTML crée un lien ?", choices: ["<link>", "<a>", "<href>", "<url>"], answer: 1, explain: "<a href=\"…\">texte</a>. <link> sert à lier une feuille de style." }
- { id: c29, theme: code, q: "Qui a inventé le World Wide Web ?", choices: [Tim Berners-Lee, Vint Cerf, Steve Jobs, Alan Turing], answer: 0, explain: "Au CERN, en 1989-1991, avec HTML, HTTP et le premier navigateur." }
- { id: c30, theme: code, q: "Qu’est-ce qu’un « commit » qui « casse le build » ?", choices: [Un commit qui empêche la compilation ou les tests de passer, Un commit trop gros, Un commit sans message, Un commit supprimé], answer: 0, explain: "L’intégration continue (CI) détecte ces commits automatiquement." }
- { id: c31, theme: code, q: "Que veut dire « Hello, World! » ?", choices: [Un virus célèbre, Le premier programme traditionnel quand on apprend un langage, Une commande Linux, Un protocole], answer: 1, explain: "Popularisé par le livre « The C Programming Language » (1978)." }
- { id: c32, theme: code, q: "En Rust, quelle notion garantit la sécurité mémoire sans ramasse-miettes ?", choices: [Les pointeurs nuls, L’ownership (propriété), Les macros, Le JIT], answer: 1, explain: "Chaque valeur a un propriétaire ; le compilateur vérifie les emprunts." }
- { id: c33, theme: code, q: "Quel est le rôle d’un « debugger » ?", choices: [Supprimer les bugs automatiquement, Exécuter le programme pas à pas pour comprendre ce qu’il fait, Compiler plus vite, Formater le code], answer: 1, explain: "Points d’arrêt, inspection des variables, pile d’appels…" }
- { id: c34, theme: code, q: "Que signifie « IDE » ?", choices: [Integrated Development Environment, Internet Data Exchange, Internal Debug Engine, Instant Deploy Editor], answer: 0, explain: "VS Code, IntelliJ, CLion… regroupent éditeur, compilation et débogage." }
- { id: c35, theme: code, q: "Quel opérateur teste l’égalité en Python, Java ou C++ ?", choices: ["=", "==", "===", ":="], answer: 1, explain: "= affecte une valeur ; == compare (=== existe en JavaScript et PHP)." }
- { id: c36, theme: code, q: "Que veut dire « Ctrl+Z » dans un éditeur ?", choices: [Fermer, Annuler la dernière action, Zoomer, Sauvegarder], answer: 1, explain: "Ctrl+Y ou Ctrl+Maj+Z refait l’action annulée." }
- { id: c37, theme: code, q: "Quelle structure associe des clés à des valeurs ?", choices: [Une liste, Un dictionnaire (table de hachage), Une pile, Un tuple], answer: 1, explain: "dict en Python, HashMap en Rust et Java, std::unordered_map en C++, tableau associatif en PHP." }
- { id: c38, theme: code, q: "En quelle année est sorti le premier iPhone ?", choices: ["2004", "2007", "2010", "2012"], answer: 1, explain: "Présenté par Steve Jobs en janvier 2007." }
- { id: c39, theme: code, q: "Quel est le nombre maximal représentable sur un octet non signé ?", choices: ["127", "255", "256", "1024"], answer: 1, explain: "8 bits → 2⁸ = 256 valeurs, de 0 à 255." }
- { id: c40, theme: code, q: "Que signifie « GPU » dans « shader GPU » ?", choices: [General Processing Unit, Graphics Processing Unit, Global Power Unit, Game Pixel Unit], answer: 1, explain: "Le processeur graphique exécute les shaders en parallèle sur des milliers de cœurs." }

- { id: h01, theme: hardware, q: "Quel composant exécute les instructions d’un programme ?", choices: [La RAM, Le processeur (CPU), Le disque dur, L’alimentation], answer: 1, explain: "Le CPU lit, décode et exécute les instructions." }
- { id: h02, theme: hardware, q: "Que perd la RAM quand on éteint l’ordinateur ?", choices: [Rien, Tout son contenu, Seulement les images, La moitié], answer: 1, explain: "La RAM est volatile ; le SSD et le disque dur conservent les données." }
- { id: h03, theme: hardware, q: "Combien de bits dans un octet ?", choices: ["4", "8", "16", "1024"], answer: 1, explain: "1 octet = 8 bits = 256 valeurs possibles." }
- { id: h04, theme: hardware, q: "Lequel est le plus rapide ?", choices: [Disque dur, SSD, Cache L1, RAM], answer: 2, explain: "Registres > cache L1 > L2/L3 > RAM > SSD > disque dur." }
- { id: h05, theme: hardware, q: "Sur quelle carte branche-t-on le processeur, la RAM et la carte graphique ?", choices: [La carte réseau, La carte mère, La carte son, Le boîtier], answer: 1, explain: "La carte mère relie tous les composants." }
- { id: h06, theme: hardware, q: "Que mesure la fréquence d’un processeur (en GHz) ?", choices: [Sa température, Le nombre de cycles d’horloge par seconde, Sa mémoire, Sa consommation], answer: 1, explain: "3 GHz = 3 milliards de cycles par seconde." }
- { id: h07, theme: hardware, q: "Qu’est-ce qu’un transistor dans un processeur ?", choices: [Une petite pile, Un interrupteur électronique commandé, Un câble, Un ventilateur], answer: 1, explain: "Les processeurs modernes contiennent des dizaines de milliards de transistors." }
- { id: h08, theme: hardware, q: "Que donne la porte logique ET avec les entrées 1 et 0 ?", choices: ["0", "1", "2", "Indéfini"], answer: 0, explain: "ET vaut 1 seulement si les deux entrées valent 1." }
- { id: h09, theme: hardware, q: "Que donne 1 XOR 1 ?", choices: ["0", "1", "2", "11"], answer: 0, explain: "XOR (ou exclusif) vaut 1 seulement si les entrées sont différentes." }
- { id: h10, theme: hardware, q: "Que vaut 1010 (binaire) en décimal ?", choices: ["8", "10", "12", "1010"], answer: 1, explain: "8 + 0 + 2 + 0 = 10." }
- { id: h11, theme: hardware, q: "Que vaut 0xFF en décimal ?", choices: ["15", "100", "255", "256"], answer: 2, explain: "F = 15 ; 15 × 16 + 15 = 255." }
- { id: h12, theme: hardware, q: "Quel composant est spécialisé dans le calcul parallèle et la 3D ?", choices: [CPU, GPU, PSU, SSD], answer: 1, explain: "Le GPU a des milliers de petits cœurs." }
- { id: h13, theme: hardware, q: "Que signifie « PSU » ?", choices: [Processor Speed Unit, Power Supply Unit (alimentation), Primary Storage Unit, Pixel Shading Unit], answer: 1, explain: "Le bloc d’alimentation convertit le courant du secteur pour les composants." }
- { id: h14, theme: hardware, q: "À quoi sert la pâte thermique ?", choices: [À coller le processeur, À améliorer le transfert de chaleur vers le refroidisseur, À isoler électriquement, À décorer], answer: 1, explain: "Elle comble les micro-aspérités entre le processeur et le ventirad." }
- { id: h15, theme: hardware, q: "Quel stockage n’a aucune pièce mobile ?", choices: [Disque dur, SSD, Disquette, Lecteur DVD], answer: 1, explain: "Le SSD utilise de la mémoire flash." }
- { id: h16, theme: hardware, q: "Que signifie « BIOS / UEFI » ?", choices: [Le micrologiciel qui démarre l’ordinateur, Un antivirus, Un système d’exploitation, Un port USB], answer: 0, explain: "Il initialise le matériel puis lance le chargeur du système." }
- { id: h17, theme: hardware, q: "Quel port sert habituellement à brancher une carte graphique ?", choices: [SATA, PCIe x16, USB, HDMI], answer: 1, explain: "PCI Express x16 offre la bande passante nécessaire." }
- { id: h18, theme: hardware, q: "Que fait la mémoire cache ?", choices: [Elle cache des fichiers secrets, Elle garde près du CPU les données utilisées souvent, Elle remplace la RAM, Elle refroidit le CPU], answer: 1, explain: "Elle évite d’attendre la RAM, beaucoup plus lente." }
- { id: h19, theme: hardware, q: "Combien de valeurs différentes peut-on coder sur 10 bits ?", choices: ["10", "100", "512", "1024"], answer: 3, explain: "2¹⁰ = 1024." }
- { id: h20, theme: hardware, q: "Que signifie « cœur » (core) pour un processeur ?", choices: [Le centre de la puce, Une unité capable d’exécuter des instructions indépendamment, La mémoire cache, Le ventilateur], answer: 1, explain: "Un processeur à 8 cœurs peut exécuter 8 flots d’instructions en parallèle." }
- { id: h21, theme: hardware, q: "Qu’est-ce que l’overclocking ?", choices: [Remplacer l’horloge système, Augmenter la fréquence au-delà de la valeur d’origine, Refroidir à l’azote, Changer l’heure], answer: 1, explain: "Plus de performances, mais plus de chaleur et de risques." }
- { id: h22, theme: hardware, q: "Quel est le rôle de l’UAL (ALU) ?", choices: [Gérer l’alimentation, Faire les calculs arithmétiques et logiques, Stocker les fichiers, Afficher les pixels], answer: 1, explain: "Additions, comparaisons, ET/OU… se font dans l’UAL." }
- { id: h23, theme: hardware, q: "Que veut dire « 1 Ko » au sens strict (kibioctet, Kio) ?", choices: ["1000 octets", "1024 octets", "1024 bits", "8 octets"], answer: 1, explain: "1 Kio = 2¹⁰ octets ; 1 ko (SI) = 1000 octets." }
- { id: h24, theme: hardware, q: "Quel connecteur alimente principalement la carte mère ?", choices: [ATX 24 broches, USB-C, SATA, RJ45], answer: 0, explain: "Le gros connecteur 24 broches de l’alimentation." }
- { id: h25, theme: hardware, q: "À quoi sert une carte réseau ?", choices: [À afficher l’image, À communiquer avec d’autres machines, À stocker des données, À refroidir], answer: 1, explain: "Ethernet (câble RJ45) ou Wi-Fi." }
- { id: h26, theme: hardware, q: "Que signifie « NVMe » pour un SSD ?", choices: [Un protocole rapide via PCIe, Une marque, Un type de RAM, Un câble SATA], answer: 0, explain: "Les SSD NVMe M.2 sont plusieurs fois plus rapides que les SSD SATA." }
- { id: h27, theme: hardware, q: "Le compteur ordinal (PC) d’un processeur contient…", choices: [La température, L’adresse de la prochaine instruction, Le nombre de cœurs, Le résultat du dernier calcul], answer: 1, explain: "Après chaque instruction, il avance (ou saute en cas de branchement)." }
- { id: h28, theme: hardware, q: "Quelle loi prédisait le doublement du nombre de transistors environ tous les deux ans ?", choices: [Loi d’Ohm, Loi de Moore, Loi de Murphy, Loi de Newton], answer: 1, explain: "Gordon Moore, cofondateur d’Intel, en 1965 (révisée en 1975)." }
- { id: h29, theme: hardware, q: "Le « framebuffer » du GPU contient…", choices: [Les textures, L’image à afficher à l’écran, Les shaders, Le pilote], answer: 1, explain: "C’est la zone mémoire de l’image finale." }
- { id: h30, theme: hardware, q: "Qu’est-ce qu’un pipeline d’instructions ?", choices: [Un tuyau de refroidissement, L’exécution en chaîne de plusieurs instructions à des étapes différentes, Une file d’attente réseau, Un câble], answer: 1, explain: "Comme une chaîne de montage : lecture, décodage, exécution, écriture en parallèle." }
- { id: h31, theme: hardware, q: "Quelle mémoire garde les données sans courant et sert au démarrage du firmware ?", choices: [RAM, ROM / flash, Cache L1, Registre], answer: 1, explain: "La ROM/flash de la carte mère contient l’UEFI." }
- { id: h32, theme: hardware, q: "Quel est le rôle du chipset ?", choices: [Faire les calculs 3D, Relier le CPU aux périphériques (USB, SATA, réseau…), Fournir le courant, Stocker le système], answer: 1, explain: "C’est le « carrefour » de la carte mère." }
- { id: h33, theme: hardware, q: "En OpenGL, quel shader calcule la couleur de chaque pixel ?", choices: [Vertex shader, Fragment shader, Compute shader, Geometry shader], answer: 1, explain: "Le fragment shader est exécuté pour chaque fragment produit par la rastérisation." }
- { id: h34, theme: hardware, q: "Vulkan est…", choices: [Un moteur de jeu, Une API graphique bas niveau et explicite, Une carte graphique, Un langage de shaders], answer: 1, explain: "Successeur d’OpenGL par le Khronos Group, sorti en 2016." }
- { id: h35, theme: hardware, q: "Que veut dire « 60 Hz » pour un écran ?", choices: [60 couleurs, 60 images par seconde, 60 pixels par pouce, 60 watts], answer: 1, explain: "Le taux de rafraîchissement." }

