          from collections import Counter
          print(Counter("mississippi").most_common(2))
        output: "[('i', 4), ('s', 4)]"
      - id: py-dec-q1
        type: mcq
        prompt: Les annotations de type en Python…
        choices: ['Documentent et permettent la vérification par des outils, mais ne sont pas vérifiées à l’exécution', Rendent le programme plus rapide, Sont obligatoires, Provoquent une erreur si le type est faux]
        answer: 0
      - id: py-dec-code
        type: code
        title: Fibonacci mémorisé
        prompt: Lis `n` (jusqu’à 200) et affiche le n-ième nombre de Fibonacci (F(0) = 0, F(1) = 1) avec une fonction **récursive** mémorisée.
        starter: |
          from functools import lru_cache

          def fib(n):
              ...

          print(fib(int(input())))
        solution: |
          from functools import lru_cache
          import sys
          sys.setrecursionlimit(10000)

          @lru_cache(maxsize=None)
          def fib(n):
              return n if n < 2 else fib(n - 1) + fib(n - 2)

          print(fib(int(input())))
        tests:
          - { input: '10', output: '55' }
          - { input: '90', output: '2880067194370816120', hidden: true }
          - { input: '200', output: '280571172992510140037611932413038677189525', hidden: true }
        require:
          - { pattern: 'lru_cache|cache', message: Mémoriser avec functools }
    project:
      id: py-dec-projet
      type: code
      title: Le plus court chemin
      difficulty: 3
      prompt: |
        Une grille de `.` (libre) et `#` (mur) est donnée ligne par ligne. Le départ est `S`, l’arrivée `E`. On se déplace en haut, bas, gauche, droite. Affiche le nombre minimal de pas de `S` à `E`, ou `-1` si c’est impossible.

        Utilise un **parcours en largeur** avec `collections.deque`.
      starter: |
        import sys
        from collections import deque

        grille = sys.stdin.read().split()
      solution: |
        import sys
        from collections import deque

        grille = sys.stdin.read().split()
        h, w = len(grille), len(grille[0])
        for y in range(h):
            for x in range(w):
                if grille[y][x] == "S":
                    depart = (y, x)
        dist = {depart: 0}
        file = deque([depart])
        resultat = -1
        while file:
            y, x = file.popleft()
            if grille[y][x] == "E":
                resultat = dist[(y, x)]
                break
            for dy, dx in ((1, 0), (-1, 0), (0, 1), (0, -1)):
                ny, nx = y + dy, x + dx
                if 0 <= ny < h and 0 <= nx < w and grille[ny][nx] != "#" and (ny, nx) not in dist:
                    dist[(ny, nx)] = dist[(y, x)] + 1
                    file.append((ny, nx))
        print(resultat)
      tests:
        - { input: "S.#\n..#\n#.E", output: '4' }
        - { input: "S#E", output: '-1', hidden: true }
        - { input: "S....\n####.\nE....", output: '10', hidden: true }
