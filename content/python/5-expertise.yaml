        type: predict
        prompt: Que va afficher ce programme ?
        code: |
          def double(f):
              def g(x):
                  return 2 * f(x)
              return g

          @double
          def plus_un(x):
              return x + 1

          print(plus_un(4))
        output: "10"
      - id: py-dec-p2
