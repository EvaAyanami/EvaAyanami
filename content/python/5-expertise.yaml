language: python
level: 5
chapters:
  # ------------------------------------------------------------------
  - slug: py-decorateurs-typage
    title: Décorateurs, typage et code idiomatique
    summary: Écrire des décorateurs, annoter les types, utiliser les gestionnaires de contexte et le module collections.
    minutes: 35
    concepts: [decorateurs, typage, contexte, collections]
    sections:
      - title: Les décorateurs
        body: |
          Un décorateur est une fonction qui **enveloppe** une autre fonction pour ajouter un comportement :

          ```python
          from functools import wraps

          def compter_appels(f):
              @wraps(f)
              def enveloppe(*args, **kwargs):
                  enveloppe.appels += 1
                  return f(*args, **kwargs)
              enveloppe.appels = 0
              return enveloppe

          @compter_appels
          def carre(x):
              return x * x
          ```

          `functools.lru_cache` est un décorateur prêt à l’emploi qui **mémorise** les résultats : idéal pour la programmation dynamique.
      - title: Le typage
        body: |
          Les annotations ne changent pas l’exécution, mais les éditeurs et des outils comme **mypy** les vérifient :

          ```python
          def moyenne(notes: list[float]) -> float:
              return sum(notes) / len(notes)

          def trouver(nom: str, annuaire: dict[str, int]) -> int | None:
              return annuaire.get(nom)
          ```
      - title: collections et with
        body: |
          ```python
          from collections import Counter, defaultdict, deque

          Counter("abracadabra").most_common(2)  # [('a', 5), ('b', 2)]
          groupes = defaultdict(list)              # liste créée automatiquement
          file = deque([1, 2, 3]); file.popleft()  # file efficace aux deux bouts
          ```

          Le mot-clé `with` garantit qu’une ressource est libérée (fichier fermé, verrou relâché), même en cas d’exception.
    exercises:
