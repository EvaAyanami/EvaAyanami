language: rust
level: 5
chapters:
  # ------------------------------------------------------------------
  - slug: rust-architecture
    title: Architecture logicielle
    summary: Structurer une application Rust — couches, architecture hexagonale, traits comme ports, typestate et newtypes pour rendre les états invalides impossibles.
    minutes: 40
    concepts: [architecture, traits]
    sections:
      - title: Séparer le domaine de l’infrastructure
        body: |
          Une application maintenable sépare :

          - le **domaine** (règles métier pures, sans E/S) ;
          - les **ports** : des traits qui décrivent ce dont le domaine a besoin (`trait DepotUtilisateurs`) ;
          - les **adaptateurs** : implémentations concrètes (PostgreSQL, mémoire pour les tests, API HTTP).

          ```rust
          pub trait DepotComptes {
              fn charger(&self, id: u32) -> Option<Compte>;
              fn sauver(&mut self, c: Compte);
          }

          pub struct ServiceVirement<D: DepotComptes> { depot: D }

          impl<D: DepotComptes> ServiceVirement<D> {
              pub fn virer(&mut self, de: u32, vers: u32, montant: u64) -> Result<(), ErreurVirement> {
                  // logique métier testable avec un dépôt en mémoire
                  # todo!()
              }
          }
          ```

          C’est l’**architecture hexagonale** (ports et adaptateurs) : le domaine ne dépend de rien, tout dépend du domaine.
      - title: Rendre les états invalides irreprésentables
        body: |
          Le système de types de Rust permet d’encoder des règles métier :

          **Newtype** — un type distinct pour chaque notion :

          ```rust
          pub struct Email(String);
          impl Email {
              pub fn parse(s: &str) -> Result<Email, String> {
                  if s.contains('@') { Ok(Email(s.to_string())) } else { Err(format!("email invalide : {s}")) }
              }
          }
          // Impossible de passer une chaîne non validée là où un Email est attendu.
          ```

          **Typestate** — l’état fait partie du type :

          ```rust
          struct Brouillon; struct Publie;
          struct Article<Etat> { texte: String, _e: std::marker::PhantomData<Etat> }
          impl Article<Brouillon> {
              fn publier(self) -> Article<Publie> { Article { texte: self.texte, _e: std::marker::PhantomData } }
          }
          impl Article<Publie> { fn url(&self) -> String { /* … */ String::new() } }
          // article_brouillon.url() ne compile pas !
          ```
      - title: Organisation d’un projet
        body: |
          ```text
          mon-app/
          ├── Cargo.toml          ← workspace
          ├── domaine/            ← crate bibliothèque : entités, règles, ports (traits)
          ├── infra/              ← adaptateurs : base de données, HTTP, fichiers
          ├── api/                ← binaire : serveur web (axum/actix)
          └── cli/                ← binaire : outil en ligne de commande
          ```

          Principes : dépendances orientées vers le domaine, erreurs typées par couche (`thiserror`) et converties aux frontières (`From`), configuration chargée une fois au démarrage, injection des dépendances par les génériques ou `Box<dyn Trait>`.
    exercises:
      - id: rust-arch-q1
        type: mcq
        prompt: Dans une architecture hexagonale, que représente un « port » en Rust ?
        choices: [Un trait décrivant un besoin du domaine, Un numéro de port TCP, Un module privé, Une macro]
        answer: 0
        concepts: [architecture]
      - id: rust-arch-q2
        type: mcq
        prompt: Quel est l’intérêt du motif newtype `struct Email(String)` ?
        choices: [Garantir par le type qu’une valeur a été validée, Accélérer les String, Économiser de la mémoire, Rendre la String mutable]
        answer: 0
      - id: rust-arch-q3
        type: mcq
        prompt: Avec le motif typestate, appeler une méthode non disponible dans l’état courant provoque…
        choices: [Une erreur de compilation, Une panique, Un avertissement, Rien]
        answer: 0
      - id: rust-arch-predict
        type: predict
        prompt: Que va afficher ce programme ?
        code: |
          trait Horloge { fn maintenant(&self) -> u32; }
          struct HorlogeFixe(u32);
          impl Horloge for HorlogeFixe { fn maintenant(&self) -> u32 { self.0 } }

          struct Salutation<H: Horloge> { h: H }
          impl<H: Horloge> Salutation<H> {
              fn message(&self) -> &str {
                  match self.h.maintenant() { 5..=11 => "Bonjour", 12..=17 => "Bon après-midi", _ => "Bonsoir" }
              }
          }

          fn main() {
              for h in [8, 14, 22] {
                  print!("{} / ", Salutation { h: HorlogeFixe(h) }.message());
              }
              println!();
          }
        output: Bonjour / Bon après-midi / Bonsoir /
        explanation: Injecter l’horloge via un trait rend la logique testable de façon déterministe.
      - id: rust-arch-code
        type: code
        title: Service de virement testable
        prompt: |
          Implémente le domaine bancaire :

          - `trait Depot { fn solde(&self, id: &str) -> Option<i64>; fn definir(&mut self, id: &str, solde: i64); }`
          - un adaptateur `DepotMemoire` basé sur un `HashMap` ;
          - `enum ErreurVirement { CompteInconnu(String), SoldeInsuffisant, MontantInvalide }` ;
          - `fn virer<D: Depot>(d: &mut D, de: &str, vers: &str, montant: i64) -> Result<(), ErreurVirement>` (montant > 0, comptes existants, solde suffisant ; opération atomique).

          Entrée : lignes `ouvrir id solde` ou `virer de vers montant`. Pour chaque virement, affiche `ok`, `compte inconnu : id`, `solde insuffisant` ou `montant invalide`. Termine par les soldes triés par id (`id=solde` séparés par des espaces).
        starter: |
          use std::collections::HashMap;
          use std::io::{self, Read};

          fn main() {
              let mut e = String::new();
              io::stdin().read_to_string(&mut e).unwrap();
          }
        solution: |
          use std::collections::HashMap;
          use std::io::{self, Read};

          trait Depot {
              fn solde(&self, id: &str) -> Option<i64>;
              fn definir(&mut self, id: &str, solde: i64);
          }

          struct DepotMemoire(HashMap<String, i64>);

          impl Depot for DepotMemoire {
              fn solde(&self, id: &str) -> Option<i64> { self.0.get(id).copied() }
              fn definir(&mut self, id: &str, solde: i64) { self.0.insert(id.to_string(), solde); }
          }

          enum ErreurVirement { CompteInconnu(String), SoldeInsuffisant, MontantInvalide }

          fn virer<D: Depot>(d: &mut D, de: &str, vers: &str, montant: i64) -> Result<(), ErreurVirement> {
              if montant <= 0 { return Err(ErreurVirement::MontantInvalide); }
              let s1 = d.solde(de).ok_or_else(|| ErreurVirement::CompteInconnu(de.to_string()))?;
              let s2 = d.solde(vers).ok_or_else(|| ErreurVirement::CompteInconnu(vers.to_string()))?;
              if s1 < montant { return Err(ErreurVirement::SoldeInsuffisant); }
              if de == vers { return Ok(()); }
              d.definir(de, s1 - montant);
              d.definir(vers, s2 + montant);
              Ok(())
          }

          fn main() {
              let mut e = String::new();
              io::stdin().read_to_string(&mut e).unwrap();
              let mut depot = DepotMemoire(HashMap::new());
              for l in e.lines() {
                  let p: Vec<&str> = l.split_whitespace().collect();
                  if p[0] == "ouvrir" {
                      depot.definir(p[1], p[2].parse().unwrap());
                  } else {
                      match virer(&mut depot, p[1], p[2], p[3].parse().unwrap()) {
                          Ok(()) => println!("ok"),
                          Err(ErreurVirement::CompteInconnu(id)) => println!("compte inconnu : {}", id),
                          Err(ErreurVirement::SoldeInsuffisant) => println!("solde insuffisant"),
                          Err(ErreurVirement::MontantInvalide) => println!("montant invalide"),
                      }
                  }
              }
              let mut v: Vec<(&String, &i64)> = depot.0.iter().collect();
              v.sort();
              let s: Vec<String> = v.iter().map(|(k, s)| format!("{}={}", k, s)).collect();
              println!("{}", s.join(" "));
          }
        tests:
          - { input: "ouvrir a 100\nouvrir b 0\nvirer a b 30\nvirer b a 50\nvirer a z 1\nvirer a b -5", output: "ok\nsolde insuffisant\ncompte inconnu : z\nmontant invalide\na=70 b=30" }
          - { input: "ouvrir x 5\nvirer x x 5", output: "ok\nx=5", hidden: true }
        require:
          - { pattern: 'trait\s+Depot', message: Définir le trait Depot (port) }
          - { pattern: 'fn\s+virer\s*<', message: virer doit être générique sur le dépôt }
        concepts: [architecture, traits]
    project:
      id: rust-arch-projet
      type: code
      title: Machine à états de commande (typestate)
      difficulty: 3
      prompt: |
        Modélise une commande e-commerce avec le motif **typestate** : `Commande<Panier>`, `Commande<Payee>`, `Commande<Expediee>` (états = structs vides, `PhantomData`).

        - `Commande<Panier>` : `ajouter(&mut self, prix: u32)`, `payer(self) -> Result<Commande<Payee>, Commande<Panier>>` (échoue si le panier est vide) ;
        - `Commande<Payee>` : `expedier(self, suivi: &str) -> Commande<Expediee>` ;
        - `Commande<Expediee>` : `suivi(&self) -> &str`, `total(&self) -> u32`.

        L’entrée est une suite de commandes : `ajouter N`, `payer`, `expedier CODE`. Affiche `payée` / `paiement refusé : panier vide` / `expédiée : CODE (total T)`. Les commandes invalides pour l’état courant affichent `action impossible`. (Indice : stocke l’état courant dans une `enum` qui enveloppe les trois types.)
      starter: |
        use std::io::{self, Read};
        use std::marker::PhantomData;

        fn main() {
            let mut e = String::new();
            io::stdin().read_to_string(&mut e).unwrap();
        }
      solution: |
        use std::io::{self, Read};
        use std::marker::PhantomData;

        struct Panier;
        struct Payee;
        struct Expediee;

        struct Commande<E> {
            articles: Vec<u32>,
            suivi: String,
            _e: PhantomData<E>,
        }

        impl Commande<Panier> {
            fn new() -> Self { Commande { articles: vec![], suivi: String::new(), _e: PhantomData } }
            fn ajouter(&mut self, prix: u32) { self.articles.push(prix); }
            fn payer(self) -> Result<Commande<Payee>, Commande<Panier>> {
                if self.articles.is_empty() { Err(self) } else { Ok(Commande { articles: self.articles, suivi: self.suivi, _e: PhantomData }) }
            }
        }
        impl Commande<Payee> {
            fn expedier(self, suivi: &str) -> Commande<Expediee> {
                Commande { articles: self.articles, suivi: suivi.to_string(), _e: PhantomData }
            }
        }
        impl Commande<Expediee> {
            fn suivi(&self) -> &str { &self.suivi }
            fn total(&self) -> u32 { self.articles.iter().sum() }
        }

        enum Etat {
            Panier(Commande<Panier>),
            Payee(Commande<Payee>),
            Expediee(Commande<Expediee>),
        }

        fn main() {
            let mut e = String::new();
            io::stdin().read_to_string(&mut e).unwrap();
            let mut etat = Etat::Panier(Commande::new());
            for l in e.lines() {
                let p: Vec<&str> = l.split_whitespace().collect();
                etat = match (p[0], etat) {
                    ("ajouter", Etat::Panier(mut c)) => { c.ajouter(p[1].parse().unwrap()); Etat::Panier(c) }
                    ("payer", Etat::Panier(c)) => match c.payer() {
                        Ok(c) => { println!("payée"); Etat::Payee(c) }
                        Err(c) => { println!("paiement refusé : panier vide"); Etat::Panier(c) }
                    },
                    ("expedier", Etat::Payee(c)) => {
                        let c = c.expedier(p[1]);
                        println!("expédiée : {} (total {})", c.suivi(), c.total());
                        Etat::Expediee(c)
                    }
                    (_, autre) => { println!("action impossible"); autre }
                };
            }
        }
      tests:
        - { input: "payer\najouter 10\najouter 25\nexpedier X1\npayer\najouter 5\nexpedier FR42", output: "paiement refusé : panier vide\naction impossible\npayée\naction impossible\nexpédiée : FR42 (total 35)" }
        - { input: "ajouter 1\npayer\nexpedier A\nexpedier B\npayer", output: "payée\nexpédiée : A (total 1)\naction impossible\naction impossible", hidden: true }
      require:
        - { pattern: 'PhantomData', message: 'Utiliser PhantomData pour le typestate' }
    exam:
      pass: 70
      questions:
        - id: rust-arch-ex1
          type: mcq
          prompt: Dans quelle direction doivent pointer les dépendances en architecture hexagonale ?
          choices: [Vers le domaine, Vers la base de données, Vers l’interface web, Peu importe]
          answer: 0
        - id: rust-arch-ex2
          type: mcq
          prompt: Pourquoi injecter une dépendance via un trait générique plutôt que de l’instancier dans le service ?
          choices: [Pour pouvoir la remplacer (tests, autres implémentations), Pour réduire la taille du binaire, Pour éviter le borrow checker, Aucune raison]
          answer: 0
        - id: rust-arch-ex3
          type: mcq
          prompt: 'À quoi sert `PhantomData<E>` dans le motif typestate ?'
          choices: [À utiliser le paramètre de type E sans stocker de donnée, À allouer E sur le tas, À rendre la struct thread-safe, À rien]
          answer: 0
        - id: rust-arch-ex4
          type: mcq
          prompt: Quelle crate facilite la définition d’erreurs typées par couche ?
          choices: [thiserror, rayon, regex, rand]
          answer: 0

  # ------------------------------------------------------------------
  - slug: rust-bibliotheques
    title: Développement de bibliothèques
    summary: Concevoir une API publique idiomatique — visibilité, builders, traits d’extension, compatibilité SemVer, documentation et features.
    minutes: 35
    concepts: [modules, traits, build]
    sections:
      - title: Une API idiomatique
        body: |
          Les *Rust API Guidelines* recommandent notamment :

          - noms explicites (`as_`/`to_`/`into_` selon le coût de la conversion) ;
          - implémenter les traits communs (`Debug`, `Clone`, `Default`, `PartialEq`, `Display`, `From`, `Error`) ;
          - accepter des paramètres génériques flexibles (`impl AsRef<str>`, `impl Into<String>`, `impl IntoIterator`) ;
          - renvoyer des types concrets ou `impl Trait`, et des `Result` avec des erreurs typées ;
          - champs privés + constructeurs/builders pour pouvoir évoluer sans casser les utilisateurs.

          ```rust
          pub fn saluer(nom: impl AsRef<str>) -> String {
              format!("Bonjour, {} !", nom.as_ref())
          }
          saluer("Kiri"); saluer(String::from("Ada"));   // les deux fonctionnent
          ```
      - title: Le motif Builder
        body: |
          ```rust
          #[derive(Debug, Default)]
          pub struct Requete { url: String, delai_ms: u64, essais: u32 }

          pub struct RequeteBuilder { r: Requete }

          impl Requete {
              pub fn builder(url: impl Into<String>) -> RequeteBuilder {
                  RequeteBuilder { r: Requete { url: url.into(), delai_ms: 5000, essais: 1 } }
              }
          }
          impl RequeteBuilder {
              pub fn delai(mut self, ms: u64) -> Self { self.r.delai_ms = ms; self }
              pub fn essais(mut self, n: u32) -> Self { self.r.essais = n; self }
              pub fn construire(self) -> Requete { self.r }
          }

          let r = Requete::builder("https://exemple.fr").delai(200).essais(3).construire();
          ```
      - title: Stabilité et documentation
        body: |
          - **SemVer** : retirer une fonction publique, ajouter un champ public à une struct, ajouter une variante à une enum publique… sont des changements **majeurs**. `#[non_exhaustive]` sur une enum/struct permet d’ajouter des variantes/champs plus tard.
          - **Traits scellés** (*sealed*) : empêcher les utilisateurs d’implémenter un trait public.
          - **Documentation** : `//!` pour la crate, `///` avec des exemples testés (`cargo test --doc`), sections `# Errors`, `# Panics`, `# Safety`.
          - `#![deny(missing_docs)]`, `cargo semver-checks` pour détecter les ruptures, `features` pour les dépendances optionnelles.
    exercises:
      - id: rust-lib-q1
        type: mcq
        prompt: Quel type de paramètre accepte à la fois `&str` et `String` sans conversion explicite ?
        choices: ['impl AsRef<str>', '&String', 'String', 'Box<str>']
        answer: 0
      - id: rust-lib-q2
        type: mcq
        prompt: Ajouter une variante à une enum publique est…
        choices: ['Un changement potentiellement cassant (sauf avec #[non_exhaustive])', 'Toujours compatible', 'Interdit par le compilateur', 'Sans effet']
        answer: 0
      - id: rust-lib-fill
        type: fill
        prompt: Complète le builder pour qu’il soit chaînable.
        code: |
          #[derive(Debug)]
          struct Config { verbeux: bool, niveau: u8 }
          struct Builder { c: Config }
          impl Builder {
              fn new() -> Self { Builder { c: Config { verbeux: false, niveau: 1 } } }
              fn verbeux(mut self) -> {{?}} { self.c.verbeux = true; self }
              fn niveau(mut self, n: u8) -> Self { self.c.niveau = n; self }
              fn construire(self) -> Config { self.c }
          }
          fn main() {
              println!("{:?}", Builder::new().niveau(3).verbeux().construire());
          }
        blanks: [[Self, Builder]]
        tests:
          - { input: '', output: 'Config { verbeux: true, niveau: 3 }' }
      - id: rust-lib-predict
        type: predict
        prompt: Que va afficher ce programme ?
        code: |
          trait ExtTexte {
              fn initiales(&self) -> String;
          }
          impl ExtTexte for str {
              fn initiales(&self) -> String {
                  self.split_whitespace().filter_map(|m| m.chars().next()).flat_map(|c| c.to_uppercase()).collect()
              }
          }
          fn main() {
              println!("{}", "programmation orientée objet".initiales());
          }
        output: POO
        explanation: Un trait d’extension ajoute des méthodes à un type existant (ici `str`).
      - id: rust-lib-code
        type: code
        title: Builder de requête validé
        prompt: |
          Implémente `Requete::builder(url)` avec les méthodes chaînables `methode(&str)`, `entete(cle, valeur)` (cumulables), `delai(ms)` et `construire(self) -> Result<Requete, String>` qui valide :

          - l’URL commence par `http://` ou `https://` → sinon `Err("url invalide")` ;
          - la méthode est `GET`, `POST`, `PUT` ou `DELETE` (par défaut `GET`) → sinon `Err("méthode invalide")` ;
          - le délai est entre 1 et 60000 (défaut 5000) → sinon `Err("délai invalide")`.

          Implémente `Display` pour `Requete` : `METHODE url (délai ms, N en-têtes)`.

          Chaque ligne d’entrée est une suite d’instructions séparées par ` | ` : `url …`, `methode …`, `entete cle valeur`, `delai n`. Affiche la requête ou `erreur : …`.
        starter: |
          use std::fmt;
          use std::io::{self, Read};

          fn main() {
              let mut e = String::new();
              io::stdin().read_to_string(&mut e).unwrap();
          }
        solution: |
          use std::fmt;
          use std::io::{self, Read};

          struct Requete {
              url: String,
              methode: String,
              entetes: Vec<(String, String)>,
              delai: u64,
          }

          struct RequeteBuilder {
              r: Requete,
          }

          impl Requete {
              fn builder(url: impl Into<String>) -> RequeteBuilder {
                  RequeteBuilder { r: Requete { url: url.into(), methode: "GET".into(), entetes: vec![], delai: 5000 } }
              }
          }

          impl RequeteBuilder {
              fn methode(mut self, m: &str) -> Self { self.r.methode = m.to_string(); self }
              fn entete(mut self, k: &str, v: &str) -> Self { self.r.entetes.push((k.into(), v.into())); self }
              fn delai(mut self, ms: u64) -> Self { self.r.delai = ms; self }
              fn construire(self) -> Result<Requete, String> {
                  let r = self.r;
                  if !(r.url.starts_with("http://") || r.url.starts_with("https://")) { return Err("url invalide".into()); }
                  if !["GET", "POST", "PUT", "DELETE"].contains(&r.methode.as_str()) { return Err("méthode invalide".into()); }
                  if !(1..=60000).contains(&r.delai) { return Err("délai invalide".into()); }
                  Ok(r)
              }
          }

          impl fmt::Display for Requete {
              fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
                  write!(f, "{} {} ({} ms, {} en-têtes)", self.methode, self.url, self.delai, self.entetes.len())
              }
          }

          fn main() {
              let mut e = String::new();
              io::stdin().read_to_string(&mut e).unwrap();
              for l in e.lines() {
                  let mut b: Option<RequeteBuilder> = None;
                  for instr in l.split(" | ") {
                      let p: Vec<&str> = instr.split_whitespace().collect();
                      b = Some(match (p[0], b) {
                          ("url", _) => Requete::builder(p[1]),
                          ("methode", Some(b)) => b.methode(p[1]),
                          ("entete", Some(b)) => b.entete(p[1], p[2]),
                          ("delai", Some(b)) => b.delai(p[1].parse().unwrap()),
                          (_, b) => b.unwrap(),
                      });
                  }
                  match b.unwrap().construire() {
                      Ok(r) => println!("{}", r),
                      Err(m) => println!("erreur : {}", m),
                  }
              }
          }
        tests:
          - { input: "url https://api.fr/v1 | methode POST | entete Auth jeton | entete Accept json | delai 200\nurl ftp://x.fr", output: "POST https://api.fr/v1 (200 ms, 2 en-têtes)\nerreur : url invalide" }
          - { input: "url http://a.b\nurl http://a.b | methode PATCH\nurl http://a.b | delai 0", output: "GET http://a.b (5000 ms, 0 en-têtes)\nerreur : méthode invalide\nerreur : délai invalide", hidden: true }
    project:
      id: rust-lib-projet
      type: code
      title: Bibliothèque de statistiques
      difficulty: 3
      prompt: |
        Conçois une mini bibliothèque `stats` (dans un module `pub mod stats`) avec une API soignée :

        - `pub trait Statistiques { fn moyenne(&self) -> Option<f64>; fn variance(&self) -> Option<f64>; fn ecart_type(&self) -> Option<f64> { … par défaut … } }` implémenté pour `[f64]` ;
        - `pub fn resumer<I: IntoIterator<Item = f64>>(donnees: I) -> Resume` où `Resume` (champs privés + accesseurs) implémente `Display` au format `n=… moyenne=… écart-type=…` (2 décimales, `-` si vide).

        La variance est la variance de population (division par n). Pour chaque ligne de nombres, affiche le résumé.
      starter: |
        use std::fmt;
        use std::io::{self, Read};

        fn main() {
            let mut e = String::new();
            io::stdin().read_to_string(&mut e).unwrap();
        }
      solution: |
        use std::io::{self, Read};

        pub mod stats {
            use std::fmt;

            pub trait Statistiques {
                fn moyenne(&self) -> Option<f64>;
                fn variance(&self) -> Option<f64>;
                fn ecart_type(&self) -> Option<f64> {
                    self.variance().map(f64::sqrt)
                }
            }

            impl Statistiques for [f64] {
                fn moyenne(&self) -> Option<f64> {
                    if self.is_empty() { None } else { Some(self.iter().sum::<f64>() / self.len() as f64) }
                }
                fn variance(&self) -> Option<f64> {
                    let m = self.moyenne()?;
                    Some(self.iter().map(|x| (x - m).powi(2)).sum::<f64>() / self.len() as f64)
                }
            }

            pub struct Resume {
                n: usize,
                moyenne: Option<f64>,
                ecart_type: Option<f64>,
            }

            impl Resume {
                pub fn n(&self) -> usize { self.n }
            }

            pub fn resumer<I: IntoIterator<Item = f64>>(donnees: I) -> Resume {
                let v: Vec<f64> = donnees.into_iter().collect();
                Resume { n: v.len(), moyenne: v.moyenne(), ecart_type: v.ecart_type() }
            }

            fn fmt_opt(x: Option<f64>) -> String {
                x.map(|v| format!("{:.2}", v)).unwrap_or_else(|| "-".into())
            }

            impl fmt::Display for Resume {
                fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
                    write!(f, "n={} moyenne={} écart-type={}", self.n, fmt_opt(self.moyenne), fmt_opt(self.ecart_type))
                }
            }
        }

        fn main() {
            let mut e = String::new();
            io::stdin().read_to_string(&mut e).unwrap();
            for l in e.lines() {
                let r = stats::resumer(l.split_whitespace().map(|x| x.parse::<f64>().unwrap()));
                println!("{}", r);
            }
        }
      tests:
        - { input: "2 4 4 4 5 5 7 9\n10", output: "n=8 moyenne=5.00 écart-type=2.00\nn=1 moyenne=10.00 écart-type=0.00" }
        - { input: "\n1 2", output: "n=0 moyenne=- écart-type=-\nn=2 moyenne=1.50 écart-type=0.50", hidden: true }
      require:
        - { pattern: 'pub\s+mod\s+stats', message: Créer le module public stats }
        - { pattern: 'IntoIterator', message: 'resumer doit accepter un IntoIterator' }
