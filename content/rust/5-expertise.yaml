  # ------------------------------------------------------------------
  - slug: rust-performance
    title: Performance
    summary: Performance de haut niveau — cache CPU, disposition des données, SIMD, parallélisme de données, allocations et lecture des benchmarks.
    minutes: 35
    concepts: [performance]
    sections:
      - title: Le cache avant tout
        body: |
          Un accès à la RAM coûte ~100 cycles, au cache L1 ~4 cycles. Les données **contiguës** et parcourues **séquentiellement** sont donc bien plus rapides :

          - `Vec<T>` plutôt que des listes chaînées ;
          - **Structure de tableaux** (SoA) plutôt que tableau de structures (AoS) quand on ne traite qu’un champ :

          ```rust
          // AoS : chaque particule = 32 octets, on charge tout pour lire x
          struct Particule { x: f32, y: f32, vx: f32, vy: f32, masse: f32, id: u64 }
          // SoA : les x sont contigus → idéal pour un parcours ou la vectorisation
          struct Particules { x: Vec<f32>, y: Vec<f32>, vx: Vec<f32>, vy: Vec<f32> }
          ```

          - parcourir une matrice ligne par ligne (ordre mémoire), pas colonne par colonne.
      - title: Parallélisme et vectorisation
        body: |
          - **rayon** : `v.par_iter().map(f).sum()` répartit le travail sur tous les cœurs (*work stealing*).
          - **SIMD** : le compilateur vectorise automatiquement les boucles simples sur des tranches (aide-le avec `chunks_exact`, des types alignés, `-C target-cpu=native`) ; `std::simd` (nightly) ou les intrinsèques `std::arch` pour le contrôle total.
          - Éviter le **faux partage** (*false sharing*) : des compteurs écrits par des threads différents ne doivent pas partager la même ligne de cache (64 octets) → `#[repr(align(64))]`.

          Mesurer avec **criterion** (statistiques, détection des régressions), `perf stat` (cache misses, branch misses), **cargo-flamegraph**.
    exercises:
      - id: rust-perf-q1
        type: mcq
        prompt: Pourquoi un Vec est-il généralement plus rapide qu’une liste chaînée pour un parcours ?
        choices: [Ses éléments sont contigus en mémoire (meilleure localité de cache), Il utilise moins de CPU par instruction, Il est trié, Il est alloué sur la pile]
        answer: 0
        concepts: [performance]
      - id: rust-perf-q2
        type: mcq
        prompt: Qu’est-ce que le faux partage (false sharing) ?
        choices: [Des threads qui écrivent des données distinctes sur une même ligne de cache, Un Rc partagé, Un bug de Mutex, Une fuite mémoire]
        answer: 0
      - id: rust-perf-q3
        type: mcq
        prompt: Pour parcourir une matrice stockée ligne par ligne, quel ordre de boucles est le plus rapide ?
        choices: [Lignes à l’extérieur, colonnes à l’intérieur, Colonnes à l’extérieur, Indifférent, Aléatoire]
        answer: 0
      - id: rust-perf-predict
        type: predict
        prompt: Que va afficher ce programme ?
        code: |
          fn main() {
              let n: usize = 4;
              let m: Vec<u64> = (0..(n * n) as u64).collect();
              let mut lignes = 0;
              for i in 0..n { for j in 0..n { lignes += m[i * n + j] * (j as u64); } }
              let mut colonnes = 0;
              for j in 0..n { for i in 0..n { colonnes += m[i * n + j] * (j as u64); } }
              println!("{} {}", lignes, lignes == colonnes);
          }
        output: 200 true
        explanation: Même résultat, mais le parcours ligne par ligne respecte l’ordre mémoire.
      - id: rust-perf-code
        type: code
        title: Plus longue sous-suite croissante
        prompt: |
          Lis `n` puis `n` entiers. Affiche la longueur de la **plus longue sous-suite strictement croissante** (non nécessairement contiguë).

          ⚠️ Les tests cachés vont jusqu’à 200 000 éléments : l’algorithme O(n²) est trop lent. Utilise la méthode O(n log n) (« patience sorting » avec `binary_search` / `partition_point`).
        starter: |
          use std::io::{self, Read};

          fn main() {
              let mut e = String::new();
              io::stdin().read_to_string(&mut e).unwrap();
              let v: Vec<i64> = e.split_whitespace().skip(1).map(|x| x.parse().unwrap()).collect();
          }
        solution: |
          use std::io::{self, Read};

          fn main() {
              let mut e = String::new();
              io::stdin().read_to_string(&mut e).unwrap();
              let v: Vec<i64> = e.split_whitespace().skip(1).map(|x| x.parse().unwrap()).collect();
              let mut fins: Vec<i64> = Vec::with_capacity(v.len());
              for x in v {
                  let pos = fins.partition_point(|&f| f < x);
                  if pos == fins.len() { fins.push(x); } else { fins[pos] = x; }
              }
              println!("{}", fins.len());
          }
        tests:
          - { input: "8\n10 9 2 5 3 7 101 18", output: '4' }
          - { input: "5\n5 4 3 2 1", output: '1', hidden: true }
          - { input: "6\n1 2 2 3 3 4", output: '4', hidden: true }
        concepts: [performance]
    project:
      id: rust-perf-projet
      type: code
      title: Simulation de particules (SoA)
      difficulty: 3
      prompt: |
        Simule `n` particules en 1D organisées en **structure de tableaux** (`Vec<f64>` séparés pour positions et vitesses).

        Entrée : `n pas dt`, puis `n` lignes `x v`. À chaque pas : `v = v - 9.81 × dt`, puis `x = x + v × dt` ; si `x < 0`, la particule rebondit : `x = -x` et `v = -v × 0.8`.

        Affiche à la fin la position moyenne et la vitesse maximale en valeur absolue (4 décimales, séparées par un espace).
      starter: |
        use std::io::{self, Read};

        fn main() {
            let mut e = String::new();
            io::stdin().read_to_string(&mut e).unwrap();
        }
      solution: |
        use std::io::{self, Read};

        struct Particules {
            x: Vec<f64>,
            v: Vec<f64>,
        }

        impl Particules {
            fn pas(&mut self, dt: f64) {
                for (x, v) in self.x.iter_mut().zip(self.v.iter_mut()) {
                    *v -= 9.81 * dt;
                    *x += *v * dt;
                    if *x < 0.0 {
                        *x = -*x;
                        *v = -*v * 0.8;
                    }
                }
            }
        }

        fn main() {
            let mut e = String::new();
            io::stdin().read_to_string(&mut e).unwrap();
            let mut l = e.lines();
            let t: Vec<f64> = l.next().unwrap().split_whitespace().map(|x| x.parse().unwrap()).collect();
            let (n, pas, dt) = (t[0] as usize, t[1] as usize, t[2]);
            let mut p = Particules { x: Vec::with_capacity(n), v: Vec::with_capacity(n) };
            for ligne in l.take(n) {
                let q: Vec<f64> = ligne.split_whitespace().map(|x| x.parse().unwrap()).collect();
                p.x.push(q[0]);
                p.v.push(q[1]);
            }
            for _ in 0..pas {
                p.pas(dt);
            }
            let moy = p.x.iter().sum::<f64>() / n as f64;
            let vmax = p.v.iter().fold(0.0f64, |m, v| m.max(v.abs()));
            println!("{:.4} {:.4}", moy, vmax);
        }
      tests:
        - { input: "1 1 0.1\n10 0", output: 9.9019 0.9810 }
        - { input: "2 3 0.5\n1 0\n0 5", output: 1.9050 4.7088, hidden: true }
    exam:
      pass: 70
      questions:
        - id: rust-perf-ex1
          type: mcq
          prompt: Que signifie « SoA » ?
