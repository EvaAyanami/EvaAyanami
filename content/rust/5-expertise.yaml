          - Toujours propager les erreurs d’E/S (`?`) avec un **contexte** utile (« impossible d’ouvrir config.toml »).
          - Écrire de façon **atomique** : écrire dans un fichier temporaire puis `fs::rename` (évite un fichier à moitié écrit en cas de crash).
          - Lire de gros fichiers en flux (`BufReader`) plutôt qu’en entier.
          - Distinguer `stdout` (résultats) et `stderr` (diagnostics) : les outils Unix se composent par tubes (`|`).
