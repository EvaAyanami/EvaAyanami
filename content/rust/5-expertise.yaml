          choices: [Épuiser la mémoire et le temps CPU en changements de contexte, Des data races, Des fuites de sockets automatiques, Aucun]
          answer: 0
        - id: rust-net-ex4
          type: mcq
          prompt: UDP garantit-il l’ordre et la livraison des messages ?
          choices: [Non, Oui, Seulement en local, Seulement avec tokio]
          answer: 0

  # ------------------------------------------------------------------
  - slug: rust-cli
    title: Applications CLI
    summary: Construire des outils en ligne de commande professionnels — arguments, sous-commandes, codes de sortie, couleurs, tests et distribution.
    minutes: 35
    concepts: [cli, systeme]
    sections:
      - title: Analyse des arguments avec clap
        body: |
          ```rust
          use clap::{Parser, Subcommand};

          /// Gestionnaire de tâches en ligne de commande
          #[derive(Parser)]
          #[command(version, about)]
          struct Cli {
              /// Affiche plus de détails
              #[arg(short, long)]
              verbeux: bool,
              #[command(subcommand)]
              commande: Commande,
          }

          #[derive(Subcommand)]
          enum Commande {
              Ajouter { titre: String, #[arg(long, default_value_t = 1)] priorite: u8 },
              Lister,
              Terminer { id: u32 },
          }

          fn main() {
              let cli = Cli::parse();      // gère --help, --version et les erreurs
              match cli.commande { /* … */ _ => {} }
          }
          ```

          `clap` génère l’aide, valide les types et propose des corrections (« did you mean ‘lister’ ? »).
      - title: Les bonnes pratiques d’un outil Unix
        body: |
          - Résultats sur **stdout**, messages et erreurs sur **stderr**.
          - **Code de sortie** : 0 succès, 1 erreur générale, 2 mauvaise utilisation.
          - Lire depuis **stdin** si aucun fichier n’est donné (composable avec `|`).
          - Respecter `NO_COLOR` et ne colorer que si la sortie est un terminal (`std::io::IsTerminal`).
          - Fournir `--help`, `--version`, une option `--json` pour une sortie lisible par les machines.
          - Tester avec **assert_cmd** + **predicates** (exécuter le binaire et vérifier sa sortie).
          - Distribuer : `cargo install`, binaires précompilés (cargo-dist), paquets.

          Crates utiles : `anyhow` (erreurs), `indicatif` (barres de progression), `dialoguer` (questions interactives), `owo-colors` (couleurs).
    exercises:
      - id: rust-cli-q1
        type: mcq
        prompt: Quel code de sortie signale par convention une mauvaise utilisation (arguments invalides) ?
        choices: ['0', '1', '2', '127']
        answer: 2
      - id: rust-cli-q2
        type: mcq
        prompt: Quand un outil CLI devrait-il désactiver les couleurs ?
        choices: [Si la sortie n’est pas un terminal ou si NO_COLOR est défini, Jamais, Toujours, Le vendredi]
        answer: 0
      - id: rust-cli-q3
        type: mcq
        prompt: Quelle crate est la référence pour analyser les arguments ?
        choices: [clap, tokio, serde_json, rayon]
        answer: 0
      - id: rust-cli-code
        type: code
        title: Analyseur d’arguments maison
        prompt: |
          Écris un analyseur d’arguments pour l’outil `todo`. Chaque ligne d’entrée est une ligne de commande. Grammaire :

          - options globales avant la sous-commande : `-v`/`--verbose` ;
          - `ajouter <titre…> [--priorite N]` (N entre 1 et 5, défaut 1) ;
          - `lister [--toutes]` ; `terminer <id>`.

          Affiche la structure analysée : `Ajouter { titre: "…", priorite: N } verbose=bool`, `Lister { toutes: bool } verbose=…`, `Terminer { id: N } verbose=…`, ou `erreur : <message>` avec les messages `sous-commande manquante`, `sous-commande inconnue : X`, `titre manquant`, `priorité invalide`, `id invalide`.
        starter: |
          use std::io::{self, Read};

          fn main() {
              let mut e = String::new();
              io::stdin().read_to_string(&mut e).unwrap();
          }
        solution: |
          use std::io::{self, Read};

          #[derive(Debug)]
          enum Commande {
              Ajouter { titre: String, priorite: u8 },
              Lister { toutes: bool },
              Terminer { id: u32 },
          }

          fn analyser(args: &[&str]) -> Result<(Commande, bool), String> {
              let mut i = 0;
              let mut verbose = false;
              while i < args.len() && (args[i] == "-v" || args[i] == "--verbose") {
                  verbose = true;
                  i += 1;
              }
              let sous = *args.get(i).ok_or("sous-commande manquante")?;
              let reste = &args[i + 1..];
              let cmd = match sous {
                  "ajouter" => {
                      let mut titre = vec![];
                      let mut priorite = 1u8;
                      let mut j = 0;
                      while j < reste.len() {
                          if reste[j] == "--priorite" {
                              priorite = reste.get(j + 1).and_then(|p| p.parse().ok()).filter(|p| (1..=5).contains(p)).ok_or("priorité invalide")?;
                              j += 2;
                          } else {
                              titre.push(reste[j]);
                              j += 1;
                          }
                      }
                      if titre.is_empty() { return Err("titre manquant".into()); }
                      Commande::Ajouter { titre: titre.join(" "), priorite }
                  }
                  "lister" => Commande::Lister { toutes: reste.contains(&"--toutes") },
                  "terminer" => Commande::Terminer { id: reste.first().and_then(|x| x.parse().ok()).ok_or("id invalide")? },
                  autre => return Err(format!("sous-commande inconnue : {}", autre)),
              };
              Ok((cmd, verbose))
          }

          fn main() {
              let mut e = String::new();
              io::stdin().read_to_string(&mut e).unwrap();
              for l in e.lines() {
                  let args: Vec<&str> = l.split_whitespace().collect();
                  match analyser(&args) {
                      Ok((c, v)) => println!("{:?} verbose={}", c, v),
                      Err(m) => println!("erreur : {}", m),
                  }
              }
          }
        tests:
          - { input: "-v ajouter Lire le livre --priorite 3\nlister --toutes\nterminer 7", output: "Ajouter { titre: \"Lire le livre\", priorite: 3 } verbose=true\nLister { toutes: true } verbose=false\nTerminer { id: 7 } verbose=false" }
          - { input: "--verbose\nsupprimer 3\najouter --priorite 9 x\najouter\nterminer abc", output: "erreur : sous-commande manquante\nerreur : sous-commande inconnue : supprimer\nerreur : priorité invalide\nerreur : titre manquant\nerreur : id invalide", hidden: true }
        concepts: [cli]
    project:
      id: rust-cli-projet
      type: code
      title: Gestionnaire de tâches en ligne de commande
      difficulty: 3
      prompt: |
        Réalise le moteur d’un gestionnaire de tâches. Chaque ligne d’entrée est une commande :

        - `ajouter <titre> [--priorite N]` → `Tâche #id ajoutée` (ids à partir de 1) ;
        - `terminer <id>` → `Tâche #id terminée` ou `erreur : tâche #id introuvable` ;
        - `lister` → les tâches **non terminées** triées par priorité décroissante puis id, au format `#id [P] titre`, ou `(aucune tâche)` ;
        - `stats` → `X terminée(s), Y en cours`.
      starter: |
        use std::io::{self, Read};

        fn main() {
            let mut e = String::new();
            io::stdin().read_to_string(&mut e).unwrap();
        }
      solution: |
        use std::io::{self, Read};

        struct Tache {
            id: u32,
            titre: String,
            priorite: u8,
            terminee: bool,
        }

        fn main() {
            let mut e = String::new();
            io::stdin().read_to_string(&mut e).unwrap();
            let mut taches: Vec<Tache> = Vec::new();
            for l in e.lines() {
                let args: Vec<&str> = l.split_whitespace().collect();
                match args.first().copied() {
                    Some("ajouter") => {
                        let mut titre = vec![];
                        let mut priorite = 1;
                        let mut i = 1;
                        while i < args.len() {
                            if args[i] == "--priorite" {
                                priorite = args[i + 1].parse().unwrap();
                                i += 2;
                            } else {
                                titre.push(args[i]);
                                i += 1;
                            }
                        }
                        let id = taches.len() as u32 + 1;
                        taches.push(Tache { id, titre: titre.join(" "), priorite, terminee: false });
                        println!("Tâche #{} ajoutée", id);
                    }
                    Some("terminer") => {
                        let id: u32 = args[1].parse().unwrap();
                        match taches.iter_mut().find(|t| t.id == id) {
                            Some(t) => { t.terminee = true; println!("Tâche #{} terminée", id); }
                            None => println!("erreur : tâche #{} introuvable", id),
                        }
                    }
                    Some("lister") => {
                        let mut en_cours: Vec<&Tache> = taches.iter().filter(|t| !t.terminee).collect();
                        en_cours.sort_by(|a, b| b.priorite.cmp(&a.priorite).then(a.id.cmp(&b.id)));
                        if en_cours.is_empty() { println!("(aucune tâche)"); }
                        for t in en_cours { println!("#{} [{}] {}", t.id, t.priorite, t.titre); }
                    }
                    _ => {
                        let fini = taches.iter().filter(|t| t.terminee).count();
                        println!("{} terminée(s), {} en cours", fini, taches.len() - fini);
                    }
                }
            }
        }
      tests:
        - { input: "ajouter Écrire le rapport --priorite 2\najouter Faire les courses\najouter Réparer le serveur --priorite 5\nterminer 2\nterminer 9\nlister\nstats", output: "Tâche #1 ajoutée\nTâche #2 ajoutée\nTâche #3 ajoutée\nTâche #2 terminée\nerreur : tâche #9 introuvable\n#3 [5] Réparer le serveur\n#1 [2] Écrire le rapport\n1 terminée(s), 2 en cours" }
