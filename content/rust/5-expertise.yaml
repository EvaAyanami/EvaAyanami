  - slug: rust-backend
    title: Services backend
    summary: Concevoir un service web en Rust — routage HTTP, JSON avec serde, état partagé, middlewares, base de données et observabilité.
    minutes: 40
    concepts: [backend, async, reseau]
    sections:
      - title: Un service avec axum
        body: |
          ```rust
          use axum::{routing::{get, post}, Router, Json, extract::{Path, State}};
          use serde::{Deserialize, Serialize};
          use std::sync::{Arc, Mutex};

          #[derive(Serialize, Deserialize, Clone)]
          struct Tache { id: u32, titre: String, faite: bool }

          type Etat = Arc<Mutex<Vec<Tache>>>;

          async fn lister(State(e): State<Etat>) -> Json<Vec<Tache>> {
              Json(e.lock().unwrap().clone())
          }

          async fn creer(State(e): State<Etat>, Json(t): Json<Tache>) -> Json<Tache> {
              e.lock().unwrap().push(t.clone());
              Json(t)
          }

          #[tokio::main]
          async fn main() {
              let etat: Etat = Arc::new(Mutex::new(vec![]));
              let app = Router::new()
                  .route("/taches", get(lister).post(creer))
                  .with_state(etat);
              let l = tokio::net::TcpListener::bind("0.0.0.0:3000").await.unwrap();
              axum::serve(l, app).await.unwrap();
          }
          ```
      - title: Les briques d’un backend de production
        body: |
          | Besoin | Outils |
          |---|---|
          | Sérialisation | `serde`, `serde_json` |
          | Base de données | `sqlx` (requêtes vérifiées à la compilation), `diesel`, `sea-orm` |
          | Middlewares | `tower` / `tower-http` (CORS, compression, délais, traces) |
          | Configuration | variables d’environnement, `figment`, `config` |
          | Observabilité | `tracing` + `tracing-subscriber`, métriques Prometheus |
          | Auth | `argon2` (mots de passe), JWT ou sessions |
          | Tests | tests d’intégration en appelant le `Router` directement (`tower::ServiceExt::oneshot`) |

          Principes REST : ressources nommées au pluriel (`/taches`), verbes HTTP (`GET` lire, `POST` créer, `PUT`/`PATCH` modifier, `DELETE` supprimer), codes de statut corrects (200, 201, 400, 404, 409, 500).
