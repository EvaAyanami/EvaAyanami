    project:
      id: rust-sys-projet
      type: code
      title: Mini wc
      difficulty: 3
      prompt: |
        Réimplémente l’outil Unix `wc`. Chaque ligne d’entrée est une **option** suivie d’un texte, séparés par `::` : `-l::texte`, `-w::texte`, `-c::texte` ou `::texte` (sans option).

        Le texte peut contenir la séquence littérale `\n` qui représente un saut de ligne. Affiche :

        - `-l` : le nombre de sauts de ligne ;
        - `-w` : le nombre de mots ;
        - `-c` : le nombre d’**octets** ;
        - sans option : `lignes mots octets` séparés par des espaces.

        Une option inconnue affiche sur la sortie standard `wc: option invalide -- X`.
      starter: |
        use std::io::{self, Read};

        fn main() {
            let mut e = String::new();
            io::stdin().read_to_string(&mut e).unwrap();
        }
      solution: |
        use std::io::{self, Read};

        fn main() {
            let mut e = String::new();
            io::stdin().read_to_string(&mut e).unwrap();
            for l in e.lines() {
                let (opt, texte) = l.split_once("::").unwrap();
                let t = texte.replace("\\n", "\n");
                let lignes = t.matches('\n').count();
                let mots = t.split_whitespace().count();
                let octets = t.len();
                match opt {
                    "-l" => println!("{}", lignes),
                    "-w" => println!("{}", mots),
                    "-c" => println!("{}", octets),
                    "" => println!("{} {} {}", lignes, mots, octets),
                    autre => println!("wc: option invalide -- {}", autre.trim_start_matches('-')),
                }
            }
        }
      tests:
        - { input: "-l::un\\ndeux\\n\n-w::la vie est belle\n::été\\n", output: "2\n4\n1 1 6" }
        - { input: "-c::abc\n-x::zzz", output: "3\nwc: option invalide -- x", hidden: true }
