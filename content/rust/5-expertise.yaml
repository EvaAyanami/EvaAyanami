    sections:
      - title: Fichiers et répertoires
        body: |
          ```rust
          use std::fs::{self, File, OpenOptions};
          use std::io::{BufRead, BufReader, Write};

          fs::write("note.txt", "ligne 1\nligne 2\n")?;
          let contenu = fs::read_to_string("note.txt")?;

          let f = File::open("note.txt")?;
          for ligne in BufReader::new(f).lines() {   // lecture ligne par ligne
              println!("{}", ligne?);
          }

          let mut journal = OpenOptions::new().create(true).append(true).open("app.log")?;
          writeln!(journal, "démarrage")?;

          fs::create_dir_all("donnees/cache")?;
          for entree in fs::read_dir(".")? {
              let e = entree?;
              println!("{:?} {}", e.file_name(), e.metadata()?.len());
          }
          ```

          `std::path::{Path, PathBuf}` manipule les chemins de façon portable (`join`, `extension`, `parent`).
      - title: Processus et environnement
        body: |
          ```rust
          use std::process::{Command, exit};
          use std::env;

          let args: Vec<String> = env::args().collect();
          let home = env::var("HOME").unwrap_or_default();

          let sortie = Command::new("ls").arg("-l").output()?;
          println!("{}", String::from_utf8_lossy(&sortie.stdout));

          if args.len() < 2 {
              eprintln!("usage : {} <fichier>", args[0]);
              exit(2);           // code de sortie non nul = erreur
          }
          ```

          Les signaux (Ctrl+C) se gèrent avec des crates comme `ctrlc` ou `signal-hook` ; `nix` et `libc` exposent les appels système POSIX.
