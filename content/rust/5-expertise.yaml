      - id: rust-back-code
        type: code
        title: Routeur HTTP minimal
        prompt: |
          Écris le cœur d’une API REST de tâches **sans framework** : une fonction `fn traiter(methode: &str, chemin: &str, corps: &str, db: &mut Vec<Tache>) -> (u16, String)`.

          Routes :

          - `GET /taches` → `200` et le JSON de toutes les tâches ;
          - `POST /taches` avec un corps JSON `{"titre": "..."}` → `201` et la tâche créée (`id` auto-incrémenté à partir de 1, `faite: false`), ou `400` + `{"erreur":"corps invalide"}` ;
          - `PATCH /taches/<id>` → marque la tâche faite : `200` + tâche, ou `404` + `{"erreur":"introuvable"}` ;
          - `DELETE /taches/<id>` → `204` et un corps vide, ou `404` ;
          - autre → `404` + `{"erreur":"route inconnue"}`.

          Chaque ligne d’entrée : `METHODE chemin [corps JSON]`. Affiche `code corps`. Utilise `serde_json`.
        starter: |
          use serde::{Deserialize, Serialize};
          use std::io::{self, Read};

          #[derive(Serialize, Clone)]
          struct Tache { id: u32, titre: String, faite: bool }

          fn main() {
              let mut e = String::new();
              io::stdin().read_to_string(&mut e).unwrap();
              let mut db: Vec<Tache> = Vec::new();
              for l in e.lines() {
                  let mut p = l.splitn(3, ' ');
                  let m = p.next().unwrap();
                  let c = p.next().unwrap();
                  let corps = p.next().unwrap_or("");
                  let (code, rep) = traiter(m, c, corps, &mut db);
                  println!("{} {}", code, rep);
              }
          }
        solution: |
          use serde::{Deserialize, Serialize};
          use std::io::{self, Read};

          #[derive(Serialize, Clone)]
          struct Tache { id: u32, titre: String, faite: bool }

          #[derive(Deserialize)]
          struct Creation { titre: String }

          fn erreur(code: u16, msg: &str) -> (u16, String) {
              (code, serde_json::json!({ "erreur": msg }).to_string())
          }

          fn traiter(methode: &str, chemin: &str, corps: &str, db: &mut Vec<Tache>) -> (u16, String) {
              let morceaux: Vec<&str> = chemin.trim_matches('/').split('/').collect();
              match (methode, morceaux.as_slice()) {
                  ("GET", ["taches"]) => (200, serde_json::to_string(db).unwrap()),
                  ("POST", ["taches"]) => match serde_json::from_str::<Creation>(corps) {
                      Ok(c) => {
                          let id = db.iter().map(|t| t.id).max().unwrap_or(0) + 1;
                          let t = Tache { id, titre: c.titre, faite: false };
                          db.push(t.clone());
                          (201, serde_json::to_string(&t).unwrap())
                      }
                      Err(_) => erreur(400, "corps invalide"),
                  },
                  ("PATCH", ["taches", id]) => match id.parse::<u32>().ok().and_then(|id| db.iter_mut().find(|t| t.id == id)) {
                      Some(t) => { t.faite = true; (200, serde_json::to_string(t).unwrap()) }
                      None => erreur(404, "introuvable"),
                  },
                  ("DELETE", ["taches", id]) => {
                      let avant = db.len();
                      if let Ok(id) = id.parse::<u32>() { db.retain(|t| t.id != id); }
                      if db.len() < avant { (204, String::new()) } else { erreur(404, "introuvable") }
                  }
                  _ => erreur(404, "route inconnue"),
              }
          }

          fn main() {
              let mut e = String::new();
              io::stdin().read_to_string(&mut e).unwrap();
              let mut db: Vec<Tache> = Vec::new();
              for l in e.lines() {
                  let mut p = l.splitn(3, ' ');
                  let m = p.next().unwrap();
                  let c = p.next().unwrap();
                  let corps = p.next().unwrap_or("");
                  let (code, rep) = traiter(m, c, corps, &mut db);
                  println!("{} {}", code, rep);
              }
          }
        tests:
          - { input: "POST /taches {\"titre\":\"Coder\"}\nPOST /taches {\"oups\":1}\nPATCH /taches/1\nGET /taches\nDELETE /taches/1\nDELETE /taches/1\nGET /utilisateurs", output: "201 {\"id\":1,\"titre\":\"Coder\",\"faite\":false}\n400 {\"erreur\":\"corps invalide\"}\n200 {\"id\":1,\"titre\":\"Coder\",\"faite\":true}\n200 [{\"id\":1,\"titre\":\"Coder\",\"faite\":true}]\n204\n404 {\"erreur\":\"introuvable\"}\n404 {\"erreur\":\"route inconnue\"}" }
          - { input: "GET /taches\nPATCH /taches/abc", output: "200 []\n404 {\"erreur\":\"introuvable\"}", hidden: true }
        concepts: [backend]
    project:
      id: rust-back-projet
      type: code
      title: Limiteur de débit (rate limiter)
      difficulty: 3
      prompt: |
        Implémente un **limiteur de débit à seau à jetons** (*token bucket*), brique classique des API : chaque client dispose d’un seau de capacité `C` jetons, rechargé de `R` jetons par seconde (sans dépasser `C`). Une requête consomme 1 jeton ; s’il n’y en a pas, elle est refusée (`429`).

        Première ligne : `C R`. Lignes suivantes : `temps_ms client`. Les seaux démarrent pleins à la première requête du client. Pour chaque requête, affiche `200` ou `429`, puis à la fin, pour chaque client par ordre alphabétique, `client : acceptées/total`.

        Utilise des jetons fractionnaires (`f64`) : recharge = `(t - dernier_t) / 1000 × R`.
      starter: |
        use std::collections::BTreeMap;
        use std::io::{self, Read};

        fn main() {
            let mut e = String::new();
            io::stdin().read_to_string(&mut e).unwrap();
        }
      solution: |
        use std::collections::BTreeMap;
        use std::io::{self, Read};

        struct Seau {
            jetons: f64,
            dernier: u64,
            acceptees: u32,
            total: u32,
        }

        fn main() {
            let mut e = String::new();
            io::stdin().read_to_string(&mut e).unwrap();
            let mut l = e.lines();
            let p: Vec<f64> = l.next().unwrap().split_whitespace().map(|x| x.parse().unwrap()).collect();
            let (cap, recharge) = (p[0], p[1]);
            let mut seaux: BTreeMap<String, Seau> = BTreeMap::new();
            for ligne in l {
                let q: Vec<&str> = ligne.split_whitespace().collect();
                let t: u64 = q[0].parse().unwrap();
                let s = seaux.entry(q[1].to_string()).or_insert(Seau { jetons: cap, dernier: t, acceptees: 0, total: 0 });
                s.jetons = (s.jetons + (t - s.dernier) as f64 / 1000.0 * recharge).min(cap);
                s.dernier = t;
                s.total += 1;
                if s.jetons >= 1.0 {
                    s.jetons -= 1.0;
                    s.acceptees += 1;
                    println!("200");
                } else {
                    println!("429");
                }
            }
            for (c, s) in &seaux {
                println!("{} : {}/{}", c, s.acceptees, s.total);
            }
        }
      tests:
        - { input: "2 1\n0 alice\n100 alice\n200 alice\n1300 alice\n1400 bob", output: "200\n200\n429\n200\n200\nalice : 3/4\nbob : 1/1" }
        - { input: "1 2\n0 a\n400 a\n500 a\n1000 a", output: "200\n429\n200\n200\na : 3/4", hidden: true }
