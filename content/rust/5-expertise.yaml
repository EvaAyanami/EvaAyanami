    project:
      id: rust-net-projet
      type: code
      title: Serveur clé-valeur
      difficulty: 3
      prompt: |
        Implémente un petit serveur clé-valeur TCP (style Redis) qui accepte **plusieurs clients** (un thread par client) et partage un `Arc<Mutex<HashMap<String, String>>>`.

        Protocole (une commande par ligne) : `SET cle valeur` → `OK` ; `GET cle` → la valeur ou `(nil)` ; `DEL cle` → `1` ou `0` ; autre → `ERR commande inconnue`.

        Entrée : chaque ligne est `client:commande` (client = 1 ou 2). Le programme ouvre deux connexions clientes et envoie chaque commande par la connexion indiquée, **en attendant la réponse** avant la commande suivante. Affiche `client > réponse`.
      starter: |
        use std::collections::HashMap;
        use std::io::{self, BufRead, BufReader, Read, Write};
        use std::net::{TcpListener, TcpStream};
        use std::sync::{Arc, Mutex};
        use std::thread;

        fn main() {
            let mut e = String::new();
            io::stdin().read_to_string(&mut e).unwrap();
        }
      solution: |
        use std::collections::HashMap;
        use std::io::{self, BufRead, BufReader, Read, Write};
        use std::net::{TcpListener, TcpStream};
        use std::sync::{Arc, Mutex};
        use std::thread;

        fn traiter(cmd: &str, db: &Mutex<HashMap<String, String>>) -> String {
            let p: Vec<&str> = cmd.splitn(3, ' ').collect();
            let mut m = db.lock().unwrap();
            match (p[0], p.len()) {
                ("SET", 3) => { m.insert(p[1].into(), p[2].into()); "OK".into() }
                ("GET", 2) => m.get(p[1]).cloned().unwrap_or_else(|| "(nil)".into()),
                ("DEL", 2) => if m.remove(p[1]).is_some() { "1".into() } else { "0".into() },
                _ => "ERR commande inconnue".into(),
            }
        }

        fn main() {
            let mut e = String::new();
            io::stdin().read_to_string(&mut e).unwrap();
            let ecoute = TcpListener::bind("127.0.0.1:0").unwrap();
            let adresse = ecoute.local_addr().unwrap();
            let db = Arc::new(Mutex::new(HashMap::new()));
            thread::spawn(move || {
                for flux in ecoute.incoming() {
                    let flux = flux.unwrap();
                    let db = Arc::clone(&db);
                    thread::spawn(move || {
                        let mut w = flux.try_clone().unwrap();
                        for l in BufReader::new(flux).lines() {
                            let rep = traiter(&l.unwrap(), &db);
                            writeln!(w, "{}", rep).unwrap();
                        }
                    });
                }
            });
            let mut clients: Vec<(TcpStream, BufReader<TcpStream>)> = (0..2)
                .map(|_| {
                    let c = TcpStream::connect(adresse).unwrap();
                    let r = BufReader::new(c.try_clone().unwrap());
                    (c, r)
                })
                .collect();
            for l in e.lines() {
                let (id, cmd) = l.split_once(':').unwrap();
                let (c, r) = &mut clients[id.parse::<usize>().unwrap() - 1];
                writeln!(c, "{}", cmd).unwrap();
                let mut rep = String::new();
                r.read_line(&mut rep).unwrap();
                println!("{} > {}", id, rep.trim_end());
            }
        }
      tests:
        - { input: "1:SET langage Rust\n2:GET langage\n2:DEL langage\n1:GET langage\n1:PING", output: "1 > OK\n2 > Rust\n2 > 1\n1 > (nil)\n1 > ERR commande inconnue" }
        - { input: "2:SET a deux mots\n1:GET a\n1:DEL z", output: "2 > OK\n1 > deux mots\n1 > 0", hidden: true }
    exam:
      pass: 70
      questions:
        - id: rust-net-ex1
          type: mcq
          prompt: Quelle crate est un framework web populaire basé sur tokio ?
          choices: [axum, serde, rand, regex]
          answer: 0
        - id: rust-net-ex2
          type: mcq
          prompt: Pourquoi cloner un TcpStream avec try_clone ?
          choices: [Pour lire et écrire depuis deux objets distincts sur la même connexion, Pour ouvrir une seconde connexion, Pour copier les données, Pour fermer la connexion]
          answer: 0
        - id: rust-net-ex3
