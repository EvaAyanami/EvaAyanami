          }
        solution: |
          use std::fs::{self, File};
          use std::io::{self, BufRead, BufReader, Read, Write};

          fn main() -> io::Result<()> {
              let mut e = String::new();
              io::stdin().read_to_string(&mut e)?;
              let chemin = format!("/tmp/journal-{}.log", std::process::id());
              {
                  let mut f = File::create(&chemin)?;
                  for (i, l) in e.lines().enumerate() {
                      writeln!(f, "{:03} {}", i + 1, l)?;
                  }
              }
              let mut total = 0;
              for ligne in BufReader::new(File::open(&chemin)?).lines() {
                  let ligne = ligne?;
                  total += 1;
                  if ligne.contains("ERREUR") {
                      println!("{}", ligne);
                  }
              }
              println!("total : {} lignes", total);
              fs::remove_file(&chemin)?;
              Ok(())
          }
