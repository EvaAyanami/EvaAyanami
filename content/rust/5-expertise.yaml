  # ------------------------------------------------------------------
  - slug: rust-securite-memoire
    title: Sécurité mémoire
    summary: Ce que Rust garantit (et ne garantit pas) — classes de vulnérabilités évitées, entrées non fiables, débordements, dépendances et fuzzing.
    minutes: 35
    concepts: [securite, unsafe]
    sections:
      - title: Les bugs que Rust élimine
        body: |
          ~70 % des vulnérabilités graves de Chrome ou Windows sont des **erreurs mémoire**. En Rust *safe*, elles sont impossibles :

          | Bug | Comment Rust l’empêche |
          |---|---|
          | Use-after-free | ownership + borrow checker |
          | Double free | un seul propriétaire |
          | Pointeur pendant | durées de vie vérifiées |
          | Dépassement de tampon | vérification des bornes (`panic` au lieu d’écraser la mémoire) |
          | Data race | `Send` / `Sync` |
          | Variable non initialisée | interdit par le compilateur |
          | Déréférencement de null | pas de null (`Option`) |

          C’est pourquoi l’ANSSI, la NSA et la Maison-Blanche recommandent les langages à mémoire sûre.
      - title: Ce que Rust ne garantit pas
        body: |
          - Les **bugs logiques** (vérifier un mauvais mot de passe reste possible !).
          - Les **dépassements arithmétiques** en release (*wrapping* silencieux) : utiliser `checked_*`, `saturating_*`, ou `overflow-checks = true`.
          - Les **paniques** (déni de service si une entrée provoque un `unwrap` sur `None`).
          - Les **fuites** mémoire et les **interblocages**.
          - Les failles dans le code `unsafe` et les **dépendances** (chaîne d’approvisionnement).

          Défenses : valider toutes les entrées non fiables (taille max, format), ne jamais `unwrap` une donnée externe, `cargo audit`, `cargo deny`, **fuzzing** (`cargo fuzz`), Miri pour l’`unsafe`, `#![forbid(unsafe_code)]` quand c’est possible.
    exercises:
      - id: rust-secu-q1
        type: mcq
        prompt: En Rust safe, que se passe-t-il lors d’un accès hors limites `v[100]` ?
        choices: [Le programme panique au lieu de corrompre la mémoire, La mémoire voisine est lue silencieusement, Erreur de compilation systématique, Rien]
        answer: 0
        concepts: [securite]
      - id: rust-secu-q2
        type: mcq
        prompt: Lequel de ces problèmes Rust safe n’empêche-t-il PAS ?
        choices: [Un bug logique de contrôle d’accès, Un use-after-free, Une data race, Un double free]
        answer: 0
      - id: rust-secu-q3
        type: mcq
        prompt: Quel attribut interdit tout code unsafe dans une crate ?
        choices: ['#![forbid(unsafe_code)]', '#[safe]', '#![no_std]', '#[deny(warnings)]']
        answer: 0
      - id: rust-secu-predict
        type: predict
        prompt: Que va afficher ce programme ?
        code: |
          fn main() {
              let a: u8 = 250;
              println!("{:?} {} {}", a.checked_add(10), a.saturating_add(10), a.wrapping_add(10));
          }
        output: None 255 4
      - id: rust-secu-code
        type: code
        title: Analyseur de paquets robuste
        prompt: |
          Un paquet réseau est une suite d’octets en hexadécimal : `[type:1 octet][longueur:2 octets big-endian][charge utile : longueur octets]`.

          Écris `fn analyser(octets: &[u8]) -> Result<(u8, &[u8]), String>` **sans jamais paniquer** sur une entrée malveillante. Erreurs : `trop court`, `longueur incohérente`, `charge trop grande` (> 1024 octets).

          Chaque ligne d’entrée est un paquet en hexadécimal (ligne invalide → `hex invalide`). Affiche `type T : N octets` (avec la charge en texte si elle est en ASCII imprimable : `type T : N octets "texte"`) ou `rejeté : raison`.
        starter: |
          use std::io::{self, Read};

          fn main() {
              let mut e = String::new();
              io::stdin().read_to_string(&mut e).unwrap();
          }
        solution: |
          use std::io::{self, Read};

          fn decoder_hex(s: &str) -> Result<Vec<u8>, String> {
              let s = s.trim();
              if s.len() % 2 != 0 { return Err("hex invalide".into()); }
              (0..s.len()).step_by(2).map(|i| s.get(i..i + 2).and_then(|h| u8::from_str_radix(h, 16).ok()).ok_or_else(|| "hex invalide".to_string())).collect()
          }

          fn analyser(o: &[u8]) -> Result<(u8, &[u8]), String> {
              if o.len() < 3 { return Err("trop court".into()); }
              let longueur = u16::from_be_bytes([o[1], o[2]]) as usize;
              if longueur > 1024 { return Err("charge trop grande".into()); }
              let charge = o.get(3..3 + longueur).ok_or("longueur incohérente")?;
              if o.len() != 3 + longueur { return Err("longueur incohérente".into()); }
              Ok((o[0], charge))
          }

          fn main() {
              let mut e = String::new();
              io::stdin().read_to_string(&mut e).unwrap();
              for l in e.lines() {
                  let r = decoder_hex(l).and_then(|o| analyser(&o).map(|(t, c)| (t, c.to_vec())));
                  match r {
                      Ok((t, c)) => {
                          if !c.is_empty() && c.iter().all(|b| b.is_ascii_graphic() || *b == b' ') {
                              println!("type {} : {} octets \"{}\"", t, c.len(), String::from_utf8_lossy(&c));
                          } else {
                              println!("type {} : {} octets", t, c.len());
                          }
                      }
                      Err(m) => println!("rejeté : {}", m),
                  }
              }
          }
        tests:
          - { input: "0100026869\n02000548656c6c6f\n01ff\n01000a00\n0204010000\nzz", output: "type 1 : 2 octets \"hi\"\ntype 2 : 5 octets \"Hello\"\nrejeté : trop court\nrejeté : longueur incohérente\nrejeté : charge trop grande\nrejeté : hex invalide" }
          - { input: "070000\n0300020102", output: "type 7 : 0 octets\ntype 3 : 2 octets", hidden: true }
        forbid:
          - { pattern: '\.unwrap\(\)\s*;?\s*$', message: 'Pas d’unwrap sur les données du paquet' }
        concepts: [securite]
    project:
      id: rust-secu-projet
      type: code
      title: Coffre de mots de passe (validation stricte)
      difficulty: 3
      prompt: |
        Implémente le cœur d’un coffre de secrets **robuste face aux entrées malveillantes**. Commandes (une par ligne) :

        - `ajouter <service> <secret>` : service = 1 à 32 caractères `[a-z0-9._-]`, secret = 8 à 64 caractères ASCII imprimables sans espace ; refus si le service existe déjà ;
        - `lire <service>` : affiche le secret **masqué** (2 premiers caractères puis `*` pour le reste) ;
        - `supprimer <service>` ;
        - toute autre entrée (y compris vide ou trop d’arguments) est rejetée.

        Les réponses : `ok`, `masqué : xx******`, ou `erreur : <raison>` avec les raisons `service invalide`, `secret invalide`, `service existant`, `service inconnu`, `commande invalide`. Aucune entrée ne doit faire paniquer le programme.
      starter: |
        use std::collections::HashMap;
        use std::io::{self, Read};

        fn main() {
            let mut e = String::new();
            io::stdin().read_to_string(&mut e).unwrap();
        }
      solution: |
        use std::collections::HashMap;
        use std::io::{self, Read};

        fn service_valide(s: &str) -> bool {
            (1..=32).contains(&s.len()) && s.chars().all(|c| c.is_ascii_lowercase() || c.is_ascii_digit() || "._-".contains(c))
        }

        fn secret_valide(s: &str) -> bool {
            (8..=64).contains(&s.len()) && s.chars().all(|c| c.is_ascii_graphic())
        }

        fn executer(l: &str, coffre: &mut HashMap<String, String>) -> Result<String, &'static str> {
            let p: Vec<&str> = l.split_whitespace().collect();
            match p.as_slice() {
                ["ajouter", s, secret] => {
                    if !service_valide(s) { return Err("service invalide"); }
                    if !secret_valide(secret) { return Err("secret invalide"); }
                    if coffre.contains_key(*s) { return Err("service existant"); }
                    coffre.insert(s.to_string(), secret.to_string());
                    Ok("ok".into())
                }
                ["lire", s] => {
                    let secret = coffre.get(*s).ok_or("service inconnu")?;
                    let debut: String = secret.chars().take(2).collect();
                    Ok(format!("masqué : {}{}", debut, "*".repeat(secret.len() - 2)))
                }
                ["supprimer", s] => coffre.remove(*s).map(|_| "ok".to_string()).ok_or("service inconnu"),
                _ => Err("commande invalide"),
            }
        }

        fn main() {
            let mut e = String::new();
            io::stdin().read_to_string(&mut e).unwrap();
            let mut coffre = HashMap::new();
            for l in e.lines() {
                match executer(l, &mut coffre) {
                    Ok(m) => println!("{}", m),
                    Err(m) => println!("erreur : {}", m),
                }
            }
        }
      tests:
        - { input: "ajouter mail.perso S3cr3t!Kiri\nlire mail.perso\najouter mail.perso autreSecret\najouter Banque abcdefgh\najouter banque court\nsupprimer mail.perso\nlire mail.perso", output: "ok\nmasqué : S3*********\nerreur : service existant\nerreur : service invalide\nerreur : secret invalide\nok\nerreur : service inconnu" }
        - { input: "\nlire\najouter a b c d\nsupprimer zz\nAJOUTER x 12345678", output: "erreur : commande invalide\nerreur : commande invalide\nerreur : commande invalide\nerreur : service inconnu\nerreur : commande invalide", hidden: true }
    exam:
      pass: 70
      questions:
        - id: rust-secu-ex1
          type: mcq
          prompt: Quel outil génère des entrées aléatoires pour trouver des paniques ou des failles ?
          choices: [cargo fuzz, cargo fmt, cargo doc, cargo tree]
