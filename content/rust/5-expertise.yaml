  - slug: rust-reseau
    title: Réseau
    summary: Sockets TCP et UDP avec std::net, protocole ligne par ligne, serveur multi-clients et versions asynchrones avec tokio.
    minutes: 40
    concepts: [reseau, concurrence]
    sections:
      - title: TCP avec std::net
        body: |
          ```rust
          use std::io::{BufRead, BufReader, Write};
          use std::net::{TcpListener, TcpStream};
          use std::thread;

          // Serveur d’écho
          let ecoute = TcpListener::bind("127.0.0.1:0")?;   // port 0 = choisi par l’OS
          let adresse = ecoute.local_addr()?;
          thread::spawn(move || {
              for flux in ecoute.incoming() {
                  let mut flux = flux.unwrap();
                  thread::spawn(move || {
                      let mut lecteur = BufReader::new(flux.try_clone().unwrap());
                      let mut ligne = String::new();
                      while lecteur.read_line(&mut ligne).unwrap() > 0 {
                          flux.write_all(ligne.to_uppercase().as_bytes()).unwrap();
                          ligne.clear();
                      }
                  });
              }
          });

          // Client
          let mut c = TcpStream::connect(adresse)?;
          c.write_all(b"bonjour\n")?;
          ```

          TCP est un **flux d’octets** : il faut définir un **protocole de délimitation** (une ligne, un préfixe de longueur…), car un `read` peut renvoyer un message partiel ou plusieurs messages collés.
      - title: UDP et tokio
        body: |
          **UDP** : datagrammes indépendants, sans connexion ni garantie de livraison (DNS, jeux, streaming).

          ```rust
          let s = std::net::UdpSocket::bind("127.0.0.1:0")?;
          s.send_to(b"ping", "127.0.0.1:9000")?;
          ```

          Avec **tokio**, un serveur gère des milliers de clients avec quelques threads :

          ```rust
          let ecoute = tokio::net::TcpListener::bind("127.0.0.1:8080").await?;
          loop {
              let (mut socket, _) = ecoute.accept().await?;
              tokio::spawn(async move {
                  let (lecture, mut ecriture) = socket.split();
                  // tokio::io::copy, BufReader::lines()…
              });
          }
          ```

          Pour HTTP, on utilise des crates comme **hyper**, **axum** ou **reqwest** plutôt que de réimplémenter le protocole.
