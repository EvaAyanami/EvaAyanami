      - id: rust-sys-code
        type: code
        title: Journal sur disque
        prompt: |
          Écris les lignes lues dans un fichier `/tmp/journal-<pid>.log` (utilise `std::process::id()`), une par ligne, préfixées par leur numéro (`001 texte`). Relis ensuite le fichier avec un `BufReader`, affiche uniquement les lignes contenant `ERREUR`, puis `total : N lignes` et supprime le fichier.
        starter: |
          use std::fs::{self, File};
          use std::io::{self, BufRead, BufReader, Read, Write};

          fn main() -> io::Result<()> {
              let mut e = String::new();
              io::stdin().read_to_string(&mut e)?;
