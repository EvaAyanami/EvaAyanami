      - id: rust-fn-code1
        type: code
        title: Est-ce un nombre premier ?
        prompt: |
          Écris la fonction `est_premier(n: u64) -> bool` qui renvoie `true` si `n` est premier.

          Le programme lit plusieurs nombres (un par ligne) et affiche `premier` ou `pas premier` pour chacun — cette partie est déjà écrite.

          Rappel : un nombre premier est supérieur à 1 et n’est divisible que par 1 et lui-même. Il suffit de tester les diviseurs `d` tant que `d * d <= n`.
        starter: |
          use std::io::{self, Read};

          fn est_premier(n: u64) -> bool {
              // À compléter
              false
          }

          fn main() {
              let mut entree = String::new();
              io::stdin().read_to_string(&mut entree).unwrap();
              for ligne in entree.lines() {
                  let n: u64 = ligne.trim().parse().unwrap();
                  if est_premier(n) {
                      println!("premier");
                  } else {
                      println!("pas premier");
                  }
              }
          }
        solution: |
          use std::io::{self, Read};

          fn est_premier(n: u64) -> bool {
              if n < 2 {
                  return false;
              }
              let mut d = 2;
              while d * d <= n {
                  if n % d == 0 {
                      return false;
                  }
                  d += 1;
              }
              true
          }

          fn main() {
              let mut entree = String::new();
              io::stdin().read_to_string(&mut entree).unwrap();
              for ligne in entree.lines() {
                  let n: u64 = ligne.trim().parse().unwrap();
                  if est_premier(n) {
                      println!("premier");
                  } else {
                      println!("pas premier");
                  }
              }
          }
        tests:
          - { input: "7\n8", output: "premier\npas premier" }
          - { input: "0\n1\n2\n3\n4", output: "pas premier\npas premier\npremier\npremier\npas premier", hidden: true }
          - { input: "97\n91\n1000003", output: "premier\npas premier\npremier", hidden: true }
        require:
          - { pattern: 'fn\s+est_premier\s*\(', message: Définir la fonction est_premier }
        concepts: [fonctions]
      - id: rust-fn-code2
        type: code
        title: Factorielle récursive
        prompt: |
          Écris une fonction **récursive** `factorielle(n: u64) -> u64` et affiche `factorielle(n)` pour l’entier lu.

          Rappel : `0! = 1` et `n! = n × (n−1)!`.
        starter: |
          use std::io;

          fn factorielle(n: u64) -> u64 {
              todo!()
          }

          fn main() {
              let mut s = String::new();
              io::stdin().read_line(&mut s).unwrap();
              let n: u64 = s.trim().parse().unwrap();
              println!("{}", factorielle(n));
          }
        solution: |
          use std::io;

          fn factorielle(n: u64) -> u64 {
              if n == 0 { 1 } else { n * factorielle(n - 1) }
          }

          fn main() {
              let mut s = String::new();
              io::stdin().read_line(&mut s).unwrap();
              let n: u64 = s.trim().parse().unwrap();
              println!("{}", factorielle(n));
          }
        tests:
          - { input: '5', output: '120' }
          - { input: '0', output: '1', hidden: true }
          - { input: '20', output: '2432902008176640000', hidden: true }
        require:
          - { pattern: 'factorielle\s*\(\s*n\s*-\s*1\s*\)', message: 'La fonction doit s’appeler elle-même (factorielle(n - 1))' }
        concepts: [fonctions, recursivite]
