                let valeur: f64 = morceaux[0].parse().unwrap();
                let unite = morceaux[1];
                if unite == "C" {
                    println!("{:.1} C = {:.1} F", valeur, celsius_vers_fahrenheit(valeur));
                } else {
                    println!("{:.1} F = {:.1} C", valeur, fahrenheit_vers_celsius(valeur));
                }
            }
        }
