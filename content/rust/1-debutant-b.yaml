  # ------------------------------------------------------------------
  - slug: rust-fonctions
    title: Fonctions
    summary: Déclare des fonctions avec paramètres et valeur de retour, comprends le retour implicite et découpe ton programme.
    minutes: 30
    concepts: [fonctions]
    sections:
      - title: Déclarer et appeler une fonction
        body: |
          ```rust
          fn saluer(prenom: &str) {
              println!("Bonjour, {prenom} !");
          }

          fn main() {
              saluer("Kiri");
              saluer("Ada");
          }
          ```

          - `fn` + nom en `snake_case` + parenthèses + corps entre accolades.
          - Chaque paramètre a un **type obligatoire** : `nom: Type`.
          - L’ordre de déclaration n’a pas d’importance : `saluer` peut être définie avant ou après `main`.
      - title: Valeur de retour
        body: |
          Le type de retour s’écrit après `->`. La **dernière expression sans `;`** est la valeur renvoyée :

          ```rust
          fn carre(x: i32) -> i32 {
              x * x            // retour implicite
          }

          fn valeur_absolue(x: i32) -> i32 {
              if x < 0 {
                  return -x;   // retour anticipé explicite
              }
              x
          }
          ```

          ⚠️ Piège classique : `x * x;` avec un point-virgule devient une instruction, la fonction renverrait alors `()` → erreur `mismatched types`.

          Une fonction peut renvoyer plusieurs valeurs grâce à un **tuple** :

          ```rust
          fn division(a: i32, b: i32) -> (i32, i32) {
              (a / b, a % b)
          }
          let (q, r) = division(17, 5); // 3, 2
          ```
      - title: Bien découper son code
        body: |
          Une bonne fonction :

          - fait **une seule chose**, bien nommée (`calculer_tva`, `est_premier`) ;
          - est courte (quelques lignes à quelques dizaines) ;
          - reçoit ce dont elle a besoin en paramètres plutôt que d’utiliser des variables globales.

          Une fonction peut appeler d’autres fonctions… et même **s’appeler elle-même** (récursivité) :

          ```rust
          fn factorielle(n: u64) -> u64 {
              if n == 0 { 1 } else { n * factorielle(n - 1) }
          }
          ```
    exercises:
      - id: rust-fn-q1
        type: mcq
        prompt: Quelle signature déclare une fonction qui prend deux `f64` et renvoie un `f64` ?
