    project:
      id: rust-com-projet
      type: code
      title: Calculateur d’IMC documenté
      difficulty: 2
      prompt: |
        Écris un programme bien commenté qui lit un **poids** (kg) et une **taille** (m), calcule l’IMC (`poids / taille²`) dans une fonction documentée `imc`, et affiche :

        ```
        IMC : <valeur avec une décimale>
        Catégorie : <catégorie>
        ```

        Catégories : `insuffisance` (< 18.5), `normal` (< 25), `surpoids` (< 30), `obésité` (≥ 30).
      starter: |
        use std::io;

        fn lire() -> f64 {
            let mut s = String::new();
            io::stdin().read_line(&mut s).unwrap();
            s.trim().parse().unwrap()
        }

        fn main() {
            let poids = lire();
            let taille = lire();
        }
      solution: |
        use std::io;

        /// Lit un nombre décimal sur l’entrée standard.
        fn lire() -> f64 {
            let mut s = String::new();
            io::stdin().read_line(&mut s).unwrap();
            s.trim().parse().unwrap()
        }

        /// Calcule l’indice de masse corporelle.
        fn imc(poids: f64, taille: f64) -> f64 {
            poids / (taille * taille)
        }

        /// Renvoie la catégorie correspondant à un IMC (seuils de l’OMS).
        fn categorie(valeur: f64) -> &'static str {
            if valeur < 18.5 {
                "insuffisance"
            } else if valeur < 25.0 {
                "normal"
            } else if valeur < 30.0 {
                "surpoids"
            } else {
                "obésité"
            }
        }

        fn main() {
            let poids = lire();
            let taille = lire();
            let valeur = imc(poids, taille);
            println!("IMC : {:.1}", valeur);
            println!("Catégorie : {}", categorie(valeur));
        }
      tests:
        - { input: "70\n1.75", output: "IMC : 22.9\nCatégorie : normal" }
        - { input: "50\n1.80", output: "IMC : 15.4\nCatégorie : insuffisance", hidden: true }
        - { input: "95\n1.70", output: "IMC : 32.9\nCatégorie : obésité", hidden: true }
        - { input: "80\n1.70", output: "IMC : 27.7\nCatégorie : surpoids", hidden: true }
      require:
        - { pattern: '///', message: Documenter au moins une fonction avec /// }
        - { pattern: 'fn\s+imc\s*\(', message: Définir la fonction imc }
    exam:
      pass: 70
      questions:
