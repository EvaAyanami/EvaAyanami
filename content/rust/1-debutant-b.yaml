        use std::io;

        fn main() {
            let mut s = String::new();
            io::stdin().read_line(&mut s).unwrap();
            let n: u32 = s.trim().parse().unwrap();
            for i in 1..=n {
                if i % 15 == 0 {
                    println!("FizzBuzz");
                } else if i % 3 == 0 {
                    println!("Fizz");
                } else if i % 5 == 0 {
                    println!("Buzz");
                } else {
