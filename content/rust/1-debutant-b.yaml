      - id: rust-com-code
        type: code
        title: Documente ta fonction
        prompt: |
          Écris une fonction `perimetre_cercle(rayon: f64) -> f64` précédée d’un **commentaire de documentation** `///`, et affiche le périmètre (2πr) du rayon lu avec deux décimales.

          Utilise la constante `std::f64::consts::PI`.
        starter: |
          use std::io;

          fn main() {
              let mut s = String::new();
              io::stdin().read_line(&mut s).unwrap();
              let r: f64 = s.trim().parse().unwrap();
          }
        solution: |
          use std::io;

          /// Calcule le périmètre d’un cercle de rayon donné.
          fn perimetre_cercle(rayon: f64) -> f64 {
              2.0 * std::f64::consts::PI * rayon
          }

          fn main() {
              let mut s = String::new();
