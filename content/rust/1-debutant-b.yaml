  # ------------------------------------------------------------------
  - slug: rust-commentaires
    title: Commentaires et documentation
    summary: Commente ton code avec //, /* */, rédige de la documentation avec /// et apprends à écrire des commentaires utiles.
    minutes: 15
    concepts: [commentaires]
    sections:
      - title: Les différents commentaires
        body: |
          ```rust
          // Commentaire sur une ligne

          /* Commentaire
             sur plusieurs lignes */

          /// Commentaire de documentation : décrit l’élément qui suit.
          /// Il accepte le **Markdown** et des exemples de code.
          fn aire_cercle(rayon: f64) -> f64 {
              std::f64::consts::PI * rayon * rayon
          }

          //! Documentation du module ou de la crate (en tête de fichier).
          ```

          Les commentaires sont **ignorés** par le compilateur : ils servent uniquement aux humains.
      - title: Générer la documentation
        body: |
          `cargo doc --open` génère un site web de documentation à partir des commentaires `///`. C’est ainsi qu’est produite la documentation de toutes les crates sur *docs.rs*.

          Les exemples placés dans la documentation sont même **compilés et testés** par `cargo test` (*doc-tests*) :

          ````rust
          /// Double un nombre.
          ///
          /// ```
          /// assert_eq!(double(4), 8);
          /// ```
          fn double(x: i32) -> i32 { x * 2 }
          ````
      - title: Écrire de bons commentaires
        body: |
          Un bon commentaire explique le **pourquoi**, pas le **quoi** :

          ```rust
          // ❌ Inutile : répète le code
          i += 1; // incrémente i

          // ✅ Utile : explique une décision
          // On commence à 1 car l’indice 0 contient l’en-tête du fichier CSV.
          let mut i = 1;
          ```

          Conseils :

          - un nom de variable clair vaut mieux qu’un commentaire ;
          - mets à jour les commentaires quand le code change ;
          - utilise `// TODO:` pour marquer ce qui reste à faire.
    exercises:
      - id: rust-com-q1
        type: mcq
        prompt: Quel commentaire apparaît dans la documentation générée par `cargo doc` ?
        choices: ['// commentaire', '/* commentaire */', '/// commentaire', '# commentaire']
        answer: 2
      - id: rust-com-q2
        type: mcq
        prompt: Lequel de ces commentaires est le plus utile ?
        choices:
          - '// additionne a et b'
          - '// On arrondit au centime supérieur : exigence légale pour les factures'
          - '// variable x'
          - '// boucle for'
        answer: 1
        explanation: Un bon commentaire apporte une information que le code seul ne donne pas.
      - id: rust-com-predict
        type: predict
        prompt: Que va afficher ce programme ?
        code: |
          fn main() {
              let x = 5; // x = 10;
              /* let x = 20; */
              // println!("{}", x * 100);
              println!("{}", x); // affiche x
          }
        output: '5'
        explanation: Tout ce qui est en commentaire est ignoré.
      - id: rust-com-bug
        type: bugfix
        prompt: Ce programme ne compile pas. Trouve l’erreur.
        code: |
          fn main() {
              /* Calcul du prix
              let prix = 10;
              println!("{}", prix * 2);
          }
        bugLines: [2]
        choices:
