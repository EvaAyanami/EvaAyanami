      - id: rust-mref-code
        type: code
        title: Échanger deux valeurs
        prompt: |
          Écris `fn echanger(a: &mut i32, b: &mut i32)` qui échange les valeurs pointées **sans utiliser** `std::mem::swap`.

          Le programme lit deux entiers, les échange et les affiche.
        starter: |
          use std::io;

          fn main() {
              let mut s = String::new();
              io::stdin().read_line(&mut s).unwrap();
              let v: Vec<i32> = s.split_whitespace().map(|x| x.parse().unwrap()).collect();
              let (mut x, mut y) = (v[0], v[1]);
              echanger(&mut x, &mut y);
              println!("{} {}", x, y);
          }
        solution: |
          use std::io;

          fn echanger(a: &mut i32, b: &mut i32) {
              let tmp = *a;
              *a = *b;
              *b = tmp;
          }

          fn main() {
              let mut s = String::new();
              io::stdin().read_line(&mut s).unwrap();
              let v: Vec<i32> = s.split_whitespace().map(|x| x.parse().unwrap()).collect();
              let (mut x, mut y) = (v[0], v[1]);
              echanger(&mut x, &mut y);
              println!("{} {}", x, y);
          }
        tests:
          - { input: '3 8', output: '8 3' }
          - { input: '-1 -1', output: '-1 -1', hidden: true }
          - { input: '0 42', output: '42 0', hidden: true }
        forbid:
