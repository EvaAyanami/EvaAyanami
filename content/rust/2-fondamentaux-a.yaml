  - slug: rust-strings-slices
    title: Strings et slices
    summary: String vs &str, tranches (slices) de chaînes et de tableaux, UTF-8 et méthodes indispensables sur le texte.
    minutes: 35
    concepts: [chaines, slices]
    sections:
      - title: String et &str
        body: |
          - **`String`** : chaîne **possédée**, modifiable, allouée sur le tas.
          - **`&str`** (*string slice*) : **vue empruntée** sur une suite d’octets UTF-8. Les littéraux `"abc"` sont des `&'static str`.

          ```rust
          let litteral: &str = "Bonjour";
          let mut possedee: String = String::from("Bon");
          possedee.push_str("jour");
          let vue: &str = &possedee;        // String → &str (gratuit)
          let copie: String = litteral.to_string(); // &str → String (allocation)
          ```

          👉 Pour un paramètre en **lecture seule**, préfère `&str` : il accepte à la fois `"littéral"` et `&ma_string`.
      - title: Les slices
        body: |
          Une **slice** est une vue sur une portion contiguë d’une collection :

          ```rust
          let s = String::from("bonjour le monde");
          let debut: &str = &s[0..7];   // "bonjour"
          let fin = &s[11..];           // "monde"

          let tab = [10, 20, 30, 40];
          let milieu: &[i32] = &tab[1..3]; // [20, 30]
          ```

          ⚠️ Les indices de `&s[a..b]` sont en **octets**. En UTF-8, « é » occupe 2 octets : couper au milieu provoque un *panic*. Pour manipuler des caractères, utilise `.chars()`.

          Une fonction qui accepte `&[i32]` fonctionne avec un tableau, un `Vec` ou une portion de l’un d’eux.
      - title: Méthodes utiles
        body: |
          | Méthode | Effet |
          |---|---|
          | `len()` | longueur en **octets** |
          | `chars().count()` | nombre de caractères |
          | `trim()` | enlève les espaces au début et à la fin |
          | `to_uppercase()` / `to_lowercase()` | casse |
          | `contains("x")`, `starts_with`, `ends_with` | recherche |
          | `replace("a", "b")` | remplacement |
          | `split(',')`, `split_whitespace()` | découpage |
          | `chars().rev().collect::<String>()` | inversion |
          | `format!("{a}-{b}")` | construction |

          Concaténation : `s1 + &s2` (consomme `s1`) ou `format!("{s1}{s2}")` (n’en consomme aucune).
