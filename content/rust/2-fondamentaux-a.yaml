  # ------------------------------------------------------------------
  - slug: rust-references-mutables
    title: Mutabilité des références
    summary: Modifie une valeur empruntée avec &mut, comprends l’exclusivité et évite les conflits d’emprunts.
    minutes: 25
    concepts: [references, mutabilite]
    sections:
      - title: Emprunt mutable
        body: |
          Pour qu’une fonction **modifie** une valeur sans en prendre la propriété :

          ```rust
          fn ajouter_exclamation(s: &mut String) {
              s.push('!');
          }

          fn main() {
              let mut cri = String::from("Rust");   // 1. variable mut
              ajouter_exclamation(&mut cri);        // 2. emprunt &mut
              println!("{cri}");                    // Rust!
          }
          ```

          Trois conditions : la variable est `mut`, on passe `&mut`, et le paramètre est de type `&mut T`.

          Pour modifier un entier pointé, il faut **déréférencer** :

          ```rust
          fn doubler(n: &mut i32) { *n *= 2; }
          ```
      - title: L’exclusivité
        body: |
          Un `&mut` est **exclusif** : pendant qu’il est actif, aucune autre référence (même en lecture) n’est permise.

          ```rust
          let mut x = 1;
          let a = &mut x;
          let b = &mut x;      // ❌ E0499: cannot borrow `x` as mutable more than once
          *a += 1;
          ```

          C’est ce qui rend impossibles les **data races** : deux morceaux de code ne peuvent jamais modifier la même donnée en même temps.

          Solutions habituelles : réduire la portée de l’emprunt (bloc `{}`), terminer l’utilisation du premier emprunt avant de créer le second, ou découper la donnée (`split_at_mut` pour les tranches).
      - title: Modifier une collection
        body: |
          ```rust
          let mut notes = vec![8, 12, 15];
          for n in &mut notes {     // n : &mut i32
              *n += 2;              // bonus pour tout le monde
          }
          println!("{:?}", notes);  // [10, 14, 17]
          ```

          `{:?}` est le format **Debug** : il permet d’afficher un vecteur entier.
