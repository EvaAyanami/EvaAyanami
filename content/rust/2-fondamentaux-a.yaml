    project:
      id: rust-mref-projet
      type: code
      title: Compte bancaire
      difficulty: 3
      prompt: |
        Le solde initial est lu sur la première ligne. Chaque ligne suivante est une opération : `depot N` ou `retrait N`.

        Écris `fn appliquer(solde: &mut i64, op: &str, montant: i64) -> bool` qui modifie le solde et renvoie `false` si un retrait est refusé (fonds insuffisants — le solde ne change pas).

        Pour chaque opération refusée, affiche `Refusé : retrait N`. À la fin, affiche `Solde final : X`.
      starter: |
        use std::io::{self, Read};

        fn main() {
            let mut entree = String::new();
            io::stdin().read_to_string(&mut entree).unwrap();
            let mut lignes = entree.lines();
            let mut solde: i64 = lignes.next().unwrap().trim().parse().unwrap();
            for ligne in lignes {
                let p: Vec<&str> = ligne.split_whitespace().collect();
                let montant: i64 = p[1].parse().unwrap();
                // appliquer(&mut solde, p[0], montant)
            }
            println!("Solde final : {}", solde);
        }
      solution: |
        use std::io::{self, Read};

        fn appliquer(solde: &mut i64, op: &str, montant: i64) -> bool {
            if op == "depot" {
                *solde += montant;
                true
            } else if *solde >= montant {
                *solde -= montant;
                true
            } else {
                false
            }
        }

        fn main() {
            let mut entree = String::new();
            io::stdin().read_to_string(&mut entree).unwrap();
            let mut lignes = entree.lines();
            let mut solde: i64 = lignes.next().unwrap().trim().parse().unwrap();
            for ligne in lignes {
                let p: Vec<&str> = ligne.split_whitespace().collect();
                let montant: i64 = p[1].parse().unwrap();
                if !appliquer(&mut solde, p[0], montant) {
                    println!("Refusé : {} {}", p[0], montant);
                }
            }
            println!("Solde final : {}", solde);
        }
      tests:
        - { input: "100\ndepot 50\nretrait 120\nretrait 40", output: "Refusé : retrait 40\nSolde final : 30" }
        - { input: "0\nretrait 1\ndepot 1\nretrait 1", output: "Refusé : retrait 1\nSolde final : 0", hidden: true }
        - { input: "500\ndepot 0", output: 'Solde final : 500', hidden: true }
      require:
        - { pattern: 'solde\s*:\s*&mut\s+i64', message: 'appliquer doit recevoir le solde en &mut i64' }
