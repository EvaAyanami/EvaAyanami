  # ------------------------------------------------------------------
  - slug: rust-stack-heap
    title: Stack et Heap
    summary: Comprends où vivent tes données — la pile (stack) et le tas (heap) — et ce que cela implique pour Box, Vec et String.
    minutes: 25
    concepts: [memoire]
    sections:
      - title: Deux zones de mémoire
        body: |
          **La pile (stack)** : rapide, organisée en « assiettes empilées ». Chaque appel de fonction y réserve un cadre (*frame*) pour ses variables locales, libéré au retour. Les données doivent avoir une **taille connue à la compilation**.

          **Le tas (heap)** : zone plus grande et flexible, pour les données de taille **dynamique** (texte saisi, listes qui grandissent). L’allocation y est plus lente ; on y accède via un **pointeur** stocké, lui, sur la pile.

          | | Pile | Tas |
          |---|---|---|
          | Vitesse | très rapide | plus lente |
          | Taille | fixe, connue | dynamique |
          | Libération | automatique (fin de fonction) | via le propriétaire (Rust), `delete` (C++), GC (Java) |
      - title: Anatomie d’une String
        body: |
          ```rust
          let s = String::from("Kiri");
          ```

          Sur la **pile**, `s` occupe 3 mots machine : un **pointeur** vers les octets, la **longueur** (4) et la **capacité** (place réservée). Les caractères `K i r i` sont sur le **tas**.

          `Vec<T>` a exactement la même structure. Quand la capacité est dépassée, le vecteur **réalloue** une zone plus grande et y copie ses éléments :

          ```rust
          let mut v = Vec::with_capacity(2);
          v.push(1); v.push(2);
          println!("{} {}", v.len(), v.capacity()); // 2 2
          v.push(3);                                // réallocation
          ```
      - title: Box, une valeur sur le tas
        body: |
          `Box<T>` place une valeur sur le tas et garde un pointeur unique vers elle :

          ```rust
          let b = Box::new(5);
          println!("{}", *b + 1); // 6
          ```

          Usages typiques :

          - grosses structures qu’on veut déplacer sans les copier ;
          - **types récursifs** (une liste chaînée contient… une liste) dont la taille serait infinie sans indirection :

          ```rust
          enum Liste {
              Fin,
              Noeud(i32, Box<Liste>),
          }
          ```

          `std::mem::size_of::<T>()` donne la taille en octets d’un type sur la pile.
    exercises:
      - id: rust-mem-q1
        type: mcq
        prompt: Où sont stockés les caractères d’une `String` ?
        choices: [Sur la pile, Sur le tas, Dans le binaire, Dans un registre]
        answer: 1
        concepts: [memoire]
      - id: rust-mem-q2
        type: mcq
        prompt: Pourquoi un `enum Liste { Fin, Noeud(i32, Liste) }` ne compile-t-il pas ?
        choices: [Le type a une taille infinie (récursif sans indirection), Les enum ne peuvent pas contenir d’i32, Il manque derive(Debug), Le nom Liste est réservé]
        answer: 0
        explanation: Il faut une indirection, par exemple `Box<Liste>`, dont la taille est fixe (un pointeur).
      - id: rust-mem-predict
        type: predict
        prompt: Que va afficher ce programme (sur une machine 64 bits) ?
        code: |
          use std::mem::size_of;
          fn main() {
              println!("{} {} {}", size_of::<u8>(), size_of::<i64>(), size_of::<Box<[u8; 1000]>>());
          }
        output: 1 8 8
        explanation: Un `Box` n’est qu’un pointeur (8 octets), quelle que soit la taille des données pointées.
      - id: rust-mem-fill
        type: fill
        prompt: Complète pour allouer 42 sur le tas puis l’afficher.
        code: |
          fn main() {
              let b = {{?}}::new(42);
              println!("{}", {{?}}b);
          }
        blanks: [[Box], ['*', '']]
        tests:
          - { input: '', output: '42' }
      - id: rust-mem-code
        type: code
        title: Somme d’une liste chaînée
        prompt: |
          On donne une liste chaînée récursive. Complète la fonction **récursive** `somme(l: &Liste) -> i64`.

          Le programme construit la liste à partir des entiers lus et affiche la somme.
        starter: |
          use std::io;

          enum Liste {
              Fin,
              Noeud(i64, Box<Liste>),
          }

          fn somme(l: &Liste) -> i64 {
              match l {
                  Liste::Fin => 0,
                  Liste::Noeud(valeur, suite) => todo!(),
              }
          }

          fn main() {
              let mut s = String::new();
              io::stdin().read_line(&mut s).unwrap();
              let mut liste = Liste::Fin;
              for x in s.split_whitespace().rev() {
                  liste = Liste::Noeud(x.parse().unwrap(), Box::new(liste));
              }
              println!("{}", somme(&liste));
          }
        solution: |
          use std::io;

          enum Liste {
              Fin,
              Noeud(i64, Box<Liste>),
          }

          fn somme(l: &Liste) -> i64 {
              match l {
                  Liste::Fin => 0,
                  Liste::Noeud(valeur, suite) => valeur + somme(suite),
              }
          }

          fn main() {
              let mut s = String::new();
              io::stdin().read_line(&mut s).unwrap();
              let mut liste = Liste::Fin;
              for x in s.split_whitespace().rev() {
                  liste = Liste::Noeud(x.parse().unwrap(), Box::new(liste));
              }
              println!("{}", somme(&liste));
          }
        tests:
          - { input: '1 2 3 4', output: '10' }
          - { input: '', output: '0', hidden: true }
          - { input: '-5 100', output: '95', hidden: true }
