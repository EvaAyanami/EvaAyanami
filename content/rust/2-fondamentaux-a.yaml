      - id: rust-str-code
        type: code
        title: Palindrome
        prompt: |
          Écris `fn est_palindrome(s: &str) -> bool` qui ignore la casse et les espaces. Pour chaque ligne lue, affiche `oui` ou `non`.

          Exemple : `Esope reste ici et se repose` → `oui`.
        starter: |
          use std::io::{self, Read};

          fn main() {
              let mut entree = String::new();
              io::stdin().read_to_string(&mut entree).unwrap();
              for ligne in entree.lines() {
                  println!("{}", if est_palindrome(ligne) { "oui" } else { "non" });
              }
          }
        solution: |
          use std::io::{self, Read};

          fn est_palindrome(s: &str) -> bool {
              let lettres: Vec<char> = s.to_lowercase().chars().filter(|c| !c.is_whitespace()).collect();
              let inverse: Vec<char> = lettres.iter().rev().cloned().collect();
              lettres == inverse
          }

          fn main() {
              let mut entree = String::new();
              io::stdin().read_to_string(&mut entree).unwrap();
              for ligne in entree.lines() {
                  println!("{}", if est_palindrome(ligne) { "oui" } else { "non" });
              }
          }
        tests:
          - { input: "Esope reste ici et se repose\nRust", output: "oui\nnon" }
          - { input: "kayak\nÉté\nA", output: "oui\noui\noui", hidden: true }
          - { input: 'ab', output: non, hidden: true }
        concepts: [chaines]
    project:
      id: rust-str-projet
      type: code
      title: Formateur de noms
      difficulty: 3
      prompt: |
        Chaque ligne contient un nom complet mal formaté (espaces superflus, casse aléatoire), par exemple `   jEAN   dupont `.

        Écris `fn formater(nom: &str) -> String` qui renvoie le nom au format `Jean DUPONT` : le **dernier** mot en majuscules, les précédents avec une majuscule initiale puis des minuscules, séparés par un seul espace.
      starter: |
        use std::io::{self, Read};

        fn main() {
            let mut entree = String::new();
            io::stdin().read_to_string(&mut entree).unwrap();
            for ligne in entree.lines() {
                println!("{}", formater(ligne));
            }
        }
      solution: |
        use std::io::{self, Read};

        fn capitaliser(mot: &str) -> String {
            let mut c = mot.chars();
            match c.next() {
                Some(premiere) => premiere.to_uppercase().collect::<String>() + &c.as_str().to_lowercase(),
                None => String::new(),
            }
        }

        fn formater(nom: &str) -> String {
            let mots: Vec<&str> = nom.split_whitespace().collect();
            let mut morceaux: Vec<String> = Vec::new();
            for (i, m) in mots.iter().enumerate() {
                if i == mots.len() - 1 {
                    morceaux.push(m.to_uppercase());
                } else {
                    morceaux.push(capitaliser(m));
                }
            }
            morceaux.join(" ")
        }

        fn main() {
            let mut entree = String::new();
            io::stdin().read_to_string(&mut entree).unwrap();
            for ligne in entree.lines() {
                println!("{}", formater(ligne));
            }
        }
      tests:
        - { input: '   jEAN   dupont ', output: Jean DUPONT }
        - { input: "ada lovelace\nmarie   sKLODOWSKA curie", output: "Ada LOVELACE\nMarie Sklodowska CURIE", hidden: true }
        - { input: 'émile zola', output: Émile ZOLA, hidden: true }
      hints: ['Découpe avec `split_whitespace()`.', 'Pour la majuscule initiale : récupère le premier `char` avec `.chars().next()`, puis le reste avec `.as_str()`.']
