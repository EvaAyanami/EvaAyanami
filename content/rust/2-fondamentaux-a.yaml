language: rust
level: 2
chapters:
  # ------------------------------------------------------------------
  - slug: rust-ownership
    title: Ownership (propriété)
    summary: La règle d’or de Rust — chaque valeur a un unique propriétaire. Comprends les déplacements (move), les copies et la libération automatique.
    minutes: 35
    concepts: [ownership, memoire]
    sections:
      - title: Les trois règles
        body: |
          1. Chaque valeur a **un propriétaire** (une variable).
          2. Il n’y a **qu’un seul propriétaire** à la fois.
          3. Quand le propriétaire sort de sa portée, la valeur est **libérée** (*dropped*).

          ```rust
          {
              let s = String::from("bonjour"); // s possède la chaîne
              println!("{s}");
          } // ← fin de portée : la mémoire de s est libérée automatiquement
          ```

          Pas de `free()` à oublier comme en C, pas de ramasse-miettes comme en Java : la libération est **déterministe** et décidée à la compilation.
      - title: Le déplacement (move)
        body: |
          ```rust
          let a = String::from("Kiri");
          let b = a;            // la propriété est DÉPLACÉE vers b
          println!("{a}");      // ❌ error[E0382]: borrow of moved value: `a`
          ```

          Pourquoi ? Une `String` contient un pointeur vers des données sur le tas. Si `a` et `b` pointaient tous deux vers la même mémoire, elle serait libérée **deux fois** à la fin. Rust invalide donc `a`.

          Même chose lors d’un appel de fonction :

          ```rust
          fn afficher(s: String) { println!("{s}"); } // s est libérée ici

          let nom = String::from("Ada");
          afficher(nom);     // nom est déplacé dans la fonction
          // afficher(nom);  // ❌ nom n’est plus valide
          ```

          Une fonction peut **rendre** la propriété en renvoyant la valeur.
      - title: Copy et clone
        body: |
          Les types simples stockés entièrement sur la pile (`i32`, `f64`, `bool`, `char`, et les tuples de ces types) implémentent le trait **`Copy`** : ils sont **copiés** au lieu d’être déplacés.

          ```rust
          let x = 5;
          let y = x;           // copie
          println!("{x} {y}"); // ✅ 5 5
          ```

          Pour dupliquer explicitement une valeur qui n’est pas `Copy`, on utilise **`.clone()`** (copie profonde, potentiellement coûteuse) :

          ```rust
          let a = String::from("Kiri");
          let b = a.clone();
          println!("{a} {b}"); // ✅
          ```

          > 💡 Le plus souvent, on ne clone pas : on **emprunte** (`&`). C’est l’objet du chapitre suivant.
    exercises:
      - id: rust-own-q1
        type: mcq
        prompt: Que se passe-t-il après `let b = a;` si `a` est une `String` ?
        choices: [a et b partagent la chaîne, La chaîne est copiée, La propriété est déplacée vers b et a devient inutilisable, Erreur de compilation immédiate]
        answer: 2
        concepts: [ownership]
      - id: rust-own-q2
        type: mcq
        multiple: true
        prompt: Quels types sont `Copy` (copiés au lieu d’être déplacés) ? (plusieurs réponses)
        choices: [i32, String, bool, 'Vec<i32>', '(i32, char)']
        answer: [0, 2, 4]
        concepts: [ownership]
        explanation: Les types primitifs et les tuples de types `Copy` sont `Copy`. `String` et `Vec` possèdent de la mémoire sur le tas.
      - id: rust-own-predict
        type: predict
        prompt: Ce programme compile. Que va-t-il afficher ?
        code: |
          fn prendre_et_rendre(s: String) -> String {
              let mut t = s;
              t.push_str("!");
              t
          }

          fn main() {
              let a = String::from("salut");
              let b = prendre_et_rendre(a);
              let c = b.clone();
              println!("{} {}", b, c.len());
          }
        output: salut! 6
        concepts: [ownership]
      - id: rust-own-bug
        type: bugfix
        prompt: Ce programme ne compile pas (E0382). Trouve et corrige l’erreur en gardant l’appel à `afficher`.
        code: |
          fn afficher(s: String) {
              println!("{}", s);
          }

          fn main() {
              let message = String::from("Bonjour");
              afficher(message);
              println!("Longueur : {}", message.len());
          }
        bugLines: [8]
        choices:
          - '`message` a été déplacé dans `afficher` : il n’est plus utilisable ensuite'
          - '`len()` n’existe pas pour String'
          - afficher devrait renvoyer un i32
        answer: 0
        solution: |
          fn afficher(s: String) {
              println!("{}", s);
          }

          fn main() {
              let message = String::from("Bonjour");
              let longueur = message.len();
              afficher(message);
              println!("Longueur : {}", longueur);
          }
        tests:
          - { input: '', output: "Bonjour\nLongueur : 7" }
        explanation: On peut calculer la longueur avant le déplacement, cloner, ou (mieux) faire prendre `&String`/`&str` à la fonction.
        concepts: [ownership]
      - id: rust-own-fill
        type: fill
        prompt: Complète pour que les deux variables restent utilisables.
        code: |
          fn main() {
              let original = String::from("Rust");
              let copie = original.{{?}}();
              println!("{} {}", original, copie);
          }
        blanks: [[clone]]
        tests:
          - { input: '', output: Rust Rust }
      - id: rust-own-code
        type: code
        title: Rendre la propriété
        prompt: |
          Écris une fonction `ajouter_signature(texte: String) -> String` qui **prend possession** du texte, ajoute `" -- Kiri"` à la fin et le **rend**.

          Le programme lit une ligne et affiche le résultat.
        starter: |
          use std::io;

          fn main() {
              let mut ligne = String::new();
              io::stdin().read_line(&mut ligne).unwrap();
              let ligne = ligne.trim().to_string();
              let signe = ajouter_signature(ligne);
              println!("{}", signe);
          }
        solution: |
          use std::io;

          fn ajouter_signature(mut texte: String) -> String {
              texte.push_str(" -- Kiri");
              texte
          }

          fn main() {
              let mut ligne = String::new();
              io::stdin().read_line(&mut ligne).unwrap();
              let ligne = ligne.trim().to_string();
              let signe = ajouter_signature(ligne);
              println!("{}", signe);
          }
        tests:
          - { input: 'Bonne journée', output: 'Bonne journée -- Kiri' }
          - { input: 'Merci', output: 'Merci -- Kiri', hidden: true }
        hints: ['Le paramètre peut être déclaré `mut texte: String` pour pouvoir le modifier.', '`texte.push_str("...")` ajoute du texte.']
        concepts: [ownership]
    project:
      id: rust-own-projet
      type: code
      title: Chaîne de traitements
      difficulty: 2
      prompt: |
        Écris trois fonctions qui **prennent et rendent** une `String` :

        - `majuscules(s: String) -> String` (utilise `.to_uppercase()`),
        - `encadrer(s: String) -> String` qui renvoie `[` + s + `]`,
        - `repeter(s: String) -> String` qui renvoie `s` répété deux fois, séparé par un espace.

        Pour chaque ligne d’entrée, affiche `repeter(encadrer(majuscules(ligne)))`.

        Exemple : `kiri` → `[KIRI] [KIRI]`.
      starter: |
        use std::io::{self, Read};

        fn main() {
            let mut entree = String::new();
            io::stdin().read_to_string(&mut entree).unwrap();
            for ligne in entree.lines() {
                let s = ligne.to_string();
                // println!("{}", repeter(encadrer(majuscules(s))));
            }
        }
      solution: |
        use std::io::{self, Read};

        fn majuscules(s: String) -> String {
            s.to_uppercase()
        }

        fn encadrer(s: String) -> String {
            format!("[{}]", s)
        }

        fn repeter(s: String) -> String {
            format!("{} {}", s, s)
        }

        fn main() {
            let mut entree = String::new();
            io::stdin().read_to_string(&mut entree).unwrap();
            for ligne in entree.lines() {
                let s = ligne.to_string();
                println!("{}", repeter(encadrer(majuscules(s))));
            }
        }
      tests:
        - { input: 'kiri', output: '[KIRI] [KIRI]' }
        - { input: "rust\nété", output: "[RUST] [RUST]\n[ÉTÉ] [ÉTÉ]", hidden: true }
      hints: ['`format!` fonctionne comme `println!` mais renvoie une `String`.']
      concepts: [ownership]
    exam:
      pass: 70
      questions:
        - id: rust-own-ex1
          type: mcq
          prompt: Quand la mémoire d’une `String` est-elle libérée ?
          choices: [Quand le ramasse-miettes passe, Quand son propriétaire sort de portée, À la fin du programme seulement, Quand on appelle free()]
          answer: 1
        - id: rust-own-ex2
          type: mcq
          prompt: 'Lequel de ces codes compile ?'
          choices:
            - 'let a = vec![1]; let b = a; println!("{:?}", a);'
            - 'let a = 3; let b = a; println!("{}", a);'
            - 'let a = String::new(); drop(a); println!("{}", a);'
          answer: 1
          explanation: '`i32` est `Copy` : `a` reste utilisable.'
        - id: rust-own-ex3
          type: predict
          prompt: Que va afficher ce programme ?
          code: |
            fn main() {
                let a = String::from("ab");
                let b = a.clone() + "cd";
                let c = b;
                println!("{} {}", a, c);
            }
          output: ab abcd
        - id: rust-own-ex4
          type: mcq
          prompt: Pourquoi Rust invalide-t-il `a` après `let b = a;` pour une `String` ?
          choices: [Pour éviter une double libération de la même mémoire, Parce que les String sont constantes, Pour gagner du temps de compilation, Parce que a est trop longue]
          answer: 0

  # ------------------------------------------------------------------
  - slug: rust-borrowing
    title: Borrowing (emprunt)
    summary: Accède à une valeur sans en prendre la propriété grâce aux emprunts (&), et découvre les règles du borrow checker.
    minutes: 30
    concepts: [references, ownership]
    sections:
      - title: Emprunter plutôt que prendre
        body: |
          Plutôt que de déplacer une valeur dans une fonction, on peut lui **prêter** une référence avec `&` :

          ```rust
          fn longueur(s: &String) -> usize {
              s.len()
          } // s est une référence : rien n’est libéré ici

          fn main() {
              let nom = String::from("Kiri");
              let n = longueur(&nom);   // on prête nom
              println!("{nom} fait {n} lettres"); // ✅ nom est toujours valide
          }
          ```

          - `&nom` crée une **référence** (un emprunt) ;
          - la fonction reçoit `&String` ;
          - le propriétaire reste `nom`.
      - title: Les règles de l’emprunt
        body: |
          À tout moment, pour une donnée, tu peux avoir **soit** :

          - **autant de références partagées** `&T` que tu veux (lecture seule),
          - **soit une seule référence mutable** `&mut T` (lecture + écriture).

          Et une référence ne doit **jamais survivre** à la valeur qu’elle désigne.

          Ces règles sont vérifiées par le **borrow checker** du compilateur. Elles éliminent les *data races* et les pointeurs pendants **avant l’exécution**.

          ```rust
          let mut v = vec![1, 2, 3];
          let premier = &v[0];   // emprunt partagé
          v.push(4);             // ❌ E0502 : v est emprunté en lecture
          println!("{premier}");
          ```

          Ici, `push` pourrait réallouer le vecteur et rendre `premier` invalide : Rust refuse !
      - title: Portée des emprunts
        body: |
          Un emprunt dure jusqu’à sa **dernière utilisation** (*non-lexical lifetimes*) :

          ```rust
          let mut s = String::from("a");
          let r1 = &s;
          let r2 = &s;
          println!("{r1} {r2}"); // dernière utilisation de r1 et r2
          let r3 = &mut s;       // ✅ OK : r1 et r2 ne sont plus utilisés
          r3.push('b');
          ```

          Astuce : `&str` est encore plus pratique que `&String` comme paramètre, car il accepte aussi les littéraux (`"abc"`). Tu le verras au chapitre *Strings et slices*.
    exercises:
      - id: rust-bor-q1
        type: mcq
        prompt: 'Que reçoit une fonction déclarée `fn f(s: &String)` ?'
        choices: [La propriété de la chaîne, Une copie de la chaîne, Une référence empruntée à la chaîne, Un pointeur nul]
        answer: 2
        concepts: [references]
      - id: rust-bor-q2
        type: mcq
        prompt: Combien de références mutables vers la même donnée peuvent coexister ?
        choices: ['0', '1', '2', Autant qu’on veut]
        answer: 1
        concepts: [references]
      - id: rust-bor-fill
        type: fill
        prompt: Complète pour prêter `texte` à la fonction sans le déplacer.
        code: |
          fn compter_voyelles(s: {{?}}String) -> usize {
              s.chars().filter(|c| "aeiouy".contains(*c)).count()
          }

          fn main() {
              let texte = String::from("programmation");
              let n = compter_voyelles({{?}}texte);
              println!("{} : {}", texte, n);
          }
        blanks: [['&'], ['&']]
        tests:
          - { input: '', output: 'programmation : 5' }
        concepts: [references]
      - id: rust-bor-predict
        type: predict
        prompt: Que va afficher ce programme ?
        code: |
          fn somme(v: &Vec<i32>) -> i32 {
              let mut s = 0;
              for x in v {
                  s += x;
              }
              s
          }

          fn main() {
              let nombres = vec![3, 4, 5];
              let a = somme(&nombres);
              let b = somme(&nombres);
              println!("{} {}", a + b, nombres.len());
          }
        output: 24 3
      - id: rust-bor-bug
        type: bugfix
        prompt: Le compilateur refuse ce code (E0502). Trouve la ligne qui pose problème.
        code: |
          fn main() {
              let mut liste = vec![10, 20, 30];
              let premier = &liste[0];
              liste.push(40);
              println!("premier = {}", premier);
          }
        bugLines: [4]
        choices:
          - On modifie la liste alors qu’une référence partagée vers elle est encore utilisée
          - push n’existe pas sur Vec
          - On ne peut pas emprunter un élément de vecteur
        answer: 0
        solution: |
          fn main() {
              let mut liste = vec![10, 20, 30];
              let premier = liste[0];
              liste.push(40);
              println!("premier = {}", premier);
          }
        tests:
          - { input: '', output: premier = 10 }
        explanation: '`push` peut réallouer le vecteur, ce qui invaliderait la référence. Ici, copier la valeur (`i32` est `Copy`) résout le problème.'
      - id: rust-bor-code
        type: code
        title: Statistiques empruntées
        prompt: |
          Écris deux fonctions qui **empruntent** le vecteur (paramètre `&Vec<i64>`) :

          - `minimum(v: &Vec<i64>) -> i64`
          - `maximum(v: &Vec<i64>) -> i64`

          Le programme lit des entiers séparés par des espaces et affiche `min max` (déjà écrit).
        starter: |
          use std::io;

          fn main() {
              let mut ligne = String::new();
              io::stdin().read_line(&mut ligne).unwrap();
              let v: Vec<i64> = ligne.split_whitespace().map(|x| x.parse().unwrap()).collect();
              println!("{} {}", minimum(&v), maximum(&v));
          }
        solution: |
          use std::io;

          fn minimum(v: &Vec<i64>) -> i64 {
              let mut m = v[0];
              for &x in v {
                  if x < m { m = x; }
              }
              m
          }

          fn maximum(v: &Vec<i64>) -> i64 {
              let mut m = v[0];
              for &x in v {
                  if x > m { m = x; }
              }
              m
          }

          fn main() {
              let mut ligne = String::new();
              io::stdin().read_line(&mut ligne).unwrap();
              let v: Vec<i64> = ligne.split_whitespace().map(|x| x.parse().unwrap()).collect();
              println!("{} {}", minimum(&v), maximum(&v));
          }
        tests:
          - { input: '4 -2 9 7', output: '-2 9' }
          - { input: '5', output: '5 5', hidden: true }
          - { input: '-1 -8 -3', output: '-8 -1', hidden: true }
        require:
          - { pattern: 'fn\s+minimum\s*\(\s*v\s*:\s*&', message: minimum doit emprunter le vecteur (&) }
        concepts: [references, fonctions]
    project:
      id: rust-bor-projet
      type: code
      title: Analyseur de texte
      difficulty: 2
      prompt: |
        Lis tout le texte de l’entrée. Écris des fonctions qui **empruntent** le texte (`&String`) :

        - `nombre_lignes`, `nombre_mots`, `nombre_caracteres` (caractères hors retours à la ligne, avec `.chars()`).

        Affiche :

        ```
        Lignes : …
        Mots : …
        Caractères : …
        ```
      starter: |
        use std::io::{self, Read};

        fn main() {
            let mut texte = String::new();
            io::stdin().read_to_string(&mut texte).unwrap();
        }
      solution: |
        use std::io::{self, Read};

        fn nombre_lignes(t: &String) -> usize {
            t.lines().count()
        }

        fn nombre_mots(t: &String) -> usize {
            t.split_whitespace().count()
        }

        fn nombre_caracteres(t: &String) -> usize {
            t.chars().filter(|c| *c != '\n' && *c != '\r').count()
        }

        fn main() {
            let mut texte = String::new();
            io::stdin().read_to_string(&mut texte).unwrap();
            println!("Lignes : {}", nombre_lignes(&texte));
            println!("Mots : {}", nombre_mots(&texte));
            println!("Caractères : {}", nombre_caracteres(&texte));
        }
      tests:
        - { input: "Bonjour le monde\nRust est génial", output: "Lignes : 2\nMots : 6\nCaractères : 31" }
        - { input: 'été', output: "Lignes : 1\nMots : 1\nCaractères : 3", hidden: true }
        - { input: "a b\n\nc", output: "Lignes : 3\nMots : 3\nCaractères : 4", hidden: true }
      hints: ['`.lines()`, `.split_whitespace()` et `.chars()` sont tes amis.', 'Attention : `.len()` compte des **octets**, pas des caractères (« é » occupe 2 octets).']
    exam:
      pass: 70
      questions:
        - id: rust-bor-ex1
          type: mcq
          prompt: Quelle combinaison d’emprunts est autorisée simultanément ?
          choices: ['Deux &mut', 'Un & et un &mut', 'Trois &', 'Un &mut et deux &']
          answer: 2
        - id: rust-bor-ex2
          type: mcq
          prompt: Quel composant du compilateur vérifie les règles d’emprunt ?
          choices: [Le linker, Le borrow checker, Le préprocesseur, Le garbage collector]
          answer: 1
        - id: rust-bor-ex3
          type: predict
          prompt: Que va afficher ce programme ?
          code: |
            fn premier_mot(s: &String) -> usize {
                s.split(' ').next().unwrap().len()
            }
            fn main() {
                let s = String::from("emprunt partagé");
                println!("{} {}", premier_mot(&s), s);
            }
          output: 7 emprunt partagé
        - id: rust-bor-ex4
          type: mcq
          prompt: Jusqu’à quand dure un emprunt ?
          choices: [Jusqu’à la fin de la fonction, Jusqu’à sa dernière utilisation, Jusqu’à la fin du programme, Une seule instruction]
          answer: 1

  # ------------------------------------------------------------------
  - slug: rust-references
    title: Références en détail
    summary: Déréférencement avec *, références de références, comparaison avec les pointeurs et durée de vie d’une référence.
    minutes: 25
    concepts: [references]
    sections:
      - title: Déréférencer
        body: |
          Une référence contient l’**adresse** d’une valeur. L’opérateur `*` permet d’accéder à la valeur pointée :

          ```rust
          let x = 10;
          let r = &x;
          println!("{}", *r + 1);   // 11
          println!("{}", r);        // 10 : println! déréférence automatiquement
          assert_eq!(*r, 10);
          ```

          Les appels de méthode déréférencent automatiquement (*auto-deref*) : `r.len()` fonctionne sur `&String` comme sur `String`.

          Comparer deux références compare les **valeurs** pointées : `&3 == &3` vaut `true`.
      - title: Pas de référence pendante
        body: |
          En C, on peut renvoyer l’adresse d’une variable locale déjà détruite. En Rust, c’est impossible :

          ```rust
          fn pendante() -> &String {   // ❌ E0106: missing lifetime specifier
              let s = String::from("oups");
              &s                       // s serait détruite à la fin de la fonction
          }
          ```

          La solution : renvoyer la valeur **possédée** (`String`) et non une référence.

          | | Référence Rust | Pointeur C/C++ |
          |---|---|---|
          | Peut être nulle | ❌ jamais | ✅ |
          | Peut pendre (*dangling*) | ❌ vérifié | ✅ comportement indéfini |
          | Arithmétique | ❌ | ✅ |
      - title: Itérer par référence
        body: |
          Parcourir une collection **par référence** évite de la consommer :

          ```rust
          let mots = vec![String::from("a"), String::from("b")];
          for m in &mots {          // m : &String
              println!("{m}");
          }
          println!("{}", mots.len()); // ✅ mots toujours disponible

          for m in mots { }         // consomme mots (déplacement)
          ```

          Le motif `&x` dans une boucle déstructure la référence : `for &n in &vec_d_entiers` donne directement des `i32`.
    exercises:
      - id: rust-ref-predict1
        type: predict
        prompt: Que va afficher ce programme ?
        code: |
          fn main() {
              let a = 5;
              let r = &a;
              let rr = &r;
              println!("{} {}", *r * 2, **rr + 1);
          }
        output: 10 6
      - id: rust-ref-q1
        type: mcq
        prompt: Pourquoi ce code ne compile-t-il pas ? `fn f() -> &String { let s = String::new(); &s }`
        choices:
          - La référence pointerait vers une valeur détruite à la fin de la fonction
          - On ne peut pas créer de String vide
          - Les fonctions ne peuvent pas renvoyer de références
        answer: 0
      - id: rust-ref-q2
        type: mcq
        prompt: Une référence Rust peut-elle être nulle ?
        choices: [Oui, avec null, Oui, avec nullptr, 'Non, jamais (on utilise Option<&T>)', Seulement en mode release]
        answer: 2
      - id: rust-ref-bug
        type: bugfix
        prompt: Ce programme ne compile pas. Trouve la ligne qui pose problème.
        code: |
          fn main() {
              let noms = vec![String::from("Ada"), String::from("Linus")];
              for n in noms {
                  println!("{}", n);
              }
              println!("{} noms", noms.len());
          }
        bugLines: [3]
        choices:
          - La boucle consomme (déplace) le vecteur ; il faut itérer sur &noms
          - Les vecteurs de String sont interdits
          - println! ne peut pas afficher une String
        answer: 0
        solution: |
          fn main() {
              let noms = vec![String::from("Ada"), String::from("Linus")];
              for n in &noms {
                  println!("{}", n);
              }
              println!("{} noms", noms.len());
          }
        tests:
          - { input: '', output: "Ada\nLinus\n2 noms" }
      - id: rust-ref-code
        type: code
        title: Le plus long mot
        prompt: |
          Écris `fn plus_long(mots: &Vec<String>) -> String` qui renvoie (une copie du) mot le plus long. En cas d’égalité, garde le premier.

          L’entrée contient des mots séparés par des espaces.
        starter: |
          use std::io;

          fn main() {
              let mut ligne = String::new();
              io::stdin().read_line(&mut ligne).unwrap();
              let mots: Vec<String> = ligne.split_whitespace().map(|m| m.to_string()).collect();
              println!("{}", plus_long(&mots));
          }
        solution: |
          use std::io;

          fn plus_long(mots: &Vec<String>) -> String {
              let mut meilleur = &mots[0];
              for m in mots {
                  if m.chars().count() > meilleur.chars().count() {
                      meilleur = m;
                  }
              }
              meilleur.clone()
          }

          fn main() {
              let mut ligne = String::new();
              io::stdin().read_line(&mut ligne).unwrap();
              let mots: Vec<String> = ligne.split_whitespace().map(|m| m.to_string()).collect();
              println!("{}", plus_long(&mots));
          }
        tests:
          - { input: 'le borrow checker veille', output: checker }
          - { input: 'un deux six', output: deux, hidden: true }
          - { input: 'éléphant zèbre', output: éléphant, hidden: true }
    project:
      id: rust-ref-projet
      type: code
      title: Classement des scores
      difficulty: 3
      prompt: |
        Chaque ligne contient un **nom** et un **score** entier. Stocke les noms dans un `Vec<String>` et les scores dans un `Vec<i32>`.

        Écris `fn indice_du_meilleur(scores: &Vec<i32>) -> usize` et `fn moyenne(scores: &Vec<i32>) -> f64`, puis affiche :

        ```
        Meilleur : <nom> (<score>)
        Moyenne : <moyenne avec 1 décimale>
        Participants : <nombre>
        ```

        En cas d’égalité, le premier rencontré l’emporte.
      starter: |
        use std::io::{self, Read};

        fn main() {
            let mut entree = String::new();
            io::stdin().read_to_string(&mut entree).unwrap();
            let mut noms: Vec<String> = Vec::new();
            let mut scores: Vec<i32> = Vec::new();
            for ligne in entree.lines() {
                let p: Vec<&str> = ligne.split_whitespace().collect();
                noms.push(p[0].to_string());
                scores.push(p[1].parse().unwrap());
            }
        }
      solution: |
        use std::io::{self, Read};

        fn indice_du_meilleur(scores: &Vec<i32>) -> usize {
            let mut idx = 0;
            for (i, s) in scores.iter().enumerate() {
                if *s > scores[idx] {
                    idx = i;
                }
            }
            idx
        }

        fn moyenne(scores: &Vec<i32>) -> f64 {
            let total: i32 = scores.iter().sum();
            total as f64 / scores.len() as f64
        }

        fn main() {
            let mut entree = String::new();
            io::stdin().read_to_string(&mut entree).unwrap();
            let mut noms: Vec<String> = Vec::new();
            let mut scores: Vec<i32> = Vec::new();
            for ligne in entree.lines() {
                let p: Vec<&str> = ligne.split_whitespace().collect();
                noms.push(p[0].to_string());
                scores.push(p[1].parse().unwrap());
            }
            let i = indice_du_meilleur(&scores);
            println!("Meilleur : {} ({})", noms[i], scores[i]);
            println!("Moyenne : {:.1}", moyenne(&scores));
            println!("Participants : {}", noms.len());
        }
      tests:
        - { input: "Ada 12\nLinus 18\nGrace 15", output: "Meilleur : Linus (18)\nMoyenne : 15.0\nParticipants : 3" }
        - { input: "Kiri 10\nRei 10", output: "Meilleur : Kiri (10)\nMoyenne : 10.0\nParticipants : 2", hidden: true }
        - { input: "Solo -3", output: "Meilleur : Solo (-3)\nMoyenne : -3.0\nParticipants : 1", hidden: true }
