          choices: [Dans src/tests.rs, Dans le dossier tests/ à la racine, Dans Cargo.toml, Dans un module privé]
          answer: 1
        - id: rust-test-ex3
          type: mcq
          prompt: Quand un test Rust échoue-t-il ?
          choices: [Quand il panique, Quand il renvoie false, Quand il affiche une erreur, Quand il est trop lent]
          answer: 0
        - id: rust-test-ex4
          type: mcq
          prompt: Pourquoi écrire `use super::*;` dans le module tests ?
          choices: [Pour accéder aux fonctions du module parent, Pour importer la bibliothèque standard, Pour activer les assertions, C’est obligatoire pour cargo]
          answer: 0

  # ------------------------------------------------------------------
  - slug: rust-cargo
    title: Cargo en profondeur
    summary: Profils de compilation, workspaces, features, scripts de build, publication et outils de l’écosystème Cargo.
    minutes: 25
    concepts: [build]
    sections:
      - title: Profils et commandes
        body: |
          | Commande | Rôle |
          |---|---|
          | `cargo build` / `--release` | compile (debug / optimisé) |
          | `cargo run -- arg1` | exécute avec des arguments |
          | `cargo test`, `cargo bench` | tests, benchmarks |
          | `cargo doc --open` | documentation |
          | `cargo fmt`, `cargo clippy` | formatage, analyse |
          | `cargo tree` | arbre des dépendances |
          | `cargo update` | met à jour Cargo.lock |
          | `cargo publish` | publie sur crates.io |

          Les profils se configurent dans `Cargo.toml` :

          ```toml
          [profile.release]
          opt-level = 3
          lto = true          # optimisation à l’édition de liens
          codegen-units = 1
          panic = "abort"
          ```
      - title: Workspaces et features
        body: |
          Un **workspace** regroupe plusieurs crates qui partagent un `Cargo.lock` et un dossier `target/` :

          ```toml
          # Cargo.toml à la racine
          [workspace]
          members = ["noyau", "cli", "serveur"]
          ```

          Les **features** activent du code optionnel :

          ```toml
          [features]
          default = ["json"]
          json = ["dep:serde_json"]

          [dependencies]
          serde_json = { version = "1", optional = true }
          ```

          ```rust
          #[cfg(feature = "json")]
          pub fn exporter_json() { /* … */ }
          ```

          `cargo build --no-default-features --features json` choisit précisément les features.
      - title: build.rs et outils
        body: |
          Un fichier `build.rs` à la racine est exécuté **avant** la compilation (génération de code, liaison avec une bibliothèque C…).

          Outils à installer avec `cargo install` :

          - `cargo-watch` : recompile à chaque modification ;
          - `cargo-audit` : vérifie les vulnérabilités connues des dépendances ;
          - `cargo-edit`, `cargo-expand` (affiche le code après expansion des macros), `cargo-flamegraph` (profilage).

          Les **dev-dependencies** (`[dev-dependencies]`) ne servent qu’aux tests et exemples.
    exercises:
      - id: rust-cargo-q1
        type: mcq
        prompt: Quelle section de Cargo.toml déclare une dépendance utilisée uniquement par les tests ?
        choices: ['[dependencies]', '[dev-dependencies]', '[test]', '[features]']
        answer: 1
      - id: rust-cargo-q2
        type: mcq
        prompt: À quoi sert un workspace Cargo ?
        choices: [À regrouper plusieurs crates qui partagent Cargo.lock et target/, À installer Rust, À publier sur GitHub, À créer une interface graphique]
        answer: 0
      - id: rust-cargo-fill
        type: fill
        prompt: Complète la configuration d’une dépendance optionnelle activée par une feature.
        code: |
          [features]
          stats = ["dep:statrs"]

          [dependencies]
          statrs = { version = "0.16", {{?}} = true }
        blanks: [[optional]]
      - id: rust-cargo-order
        type: order
        prompt: Remets dans l’ordre la publication d’une crate.
        lines:
          - Créer un compte sur crates.io et récupérer un jeton
          - cargo login <jeton>
          - Renseigner description, licence et dépôt dans Cargo.toml
          - cargo publish --dry-run
          - cargo publish
      - id: rust-cargo-code
        type: code
        title: Arguments de ligne de commande
        prompt: |
          Avec `cargo run -- add 2 3`, un programme reçoit ses arguments via `std::env::args()`. Ici, nous simulons cela : chaque ligne d’entrée contient une « ligne de commande » `commande arg1 arg2…`.

          Écris `fn executer(args: &[&str]) -> Result<String, String>` qui gère :

          - `add a b …` → la somme ; `max a b …` → le maximum ;
          - `--version` → `calc 1.0.0` ;
          - sinon → `Err("commande inconnue : X")` ; un argument non numérique → `Err("nombre invalide : X")`.

          Affiche le résultat ou `erreur : <message>`.
        starter: |
          use std::io::{self, Read};

          fn main() {
              let mut e = String::new();
              io::stdin().read_to_string(&mut e).unwrap();
              for l in e.lines() {
                  let args: Vec<&str> = l.split_whitespace().collect();
                  match executer(&args) {
                      Ok(r) => println!("{}", r),
                      Err(m) => println!("erreur : {}", m),
                  }
              }
          }
        solution: |
          use std::io::{self, Read};

          fn nombres(args: &[&str]) -> Result<Vec<i64>, String> {
              args.iter().map(|a| a.parse::<i64>().map_err(|_| format!("nombre invalide : {}", a))).collect()
          }

          fn executer(args: &[&str]) -> Result<String, String> {
              match args.first().copied() {
                  Some("add") => Ok(nombres(&args[1..])?.iter().sum::<i64>().to_string()),
                  Some("max") => Ok(nombres(&args[1..])?.into_iter().max().map(|m| m.to_string()).unwrap_or_default()),
                  Some("--version") => Ok(String::from("calc 1.0.0")),
                  Some(c) => Err(format!("commande inconnue : {}", c)),
                  None => Err(String::from("commande inconnue : ")),
              }
          }

          fn main() {
              let mut e = String::new();
              io::stdin().read_to_string(&mut e).unwrap();
              for l in e.lines() {
                  let args: Vec<&str> = l.split_whitespace().collect();
                  match executer(&args) {
                      Ok(r) => println!("{}", r),
                      Err(m) => println!("erreur : {}", m),
                  }
              }
          }
        tests:
          - { input: "add 2 3 4\nmax 7 -1 9\n--version", output: "9\n9\ncalc 1.0.0" }
          - { input: "mul 2 3\nadd 1 x", output: "erreur : commande inconnue : mul\nerreur : nombre invalide : x", hidden: true }
    project:
      id: rust-cargo-projet
      type: code
      title: Générateur reproductible avec rand
      difficulty: 3
      prompt: |
        Avec la crate `rand` (pré-installée), crée un générateur **reproductible** : `StdRng::seed_from_u64(graine)`.

        Chaque ligne contient `graine n max`. Génère `n` nombres avec `rng.gen_range(1..=max)` et affiche-les séparés par des espaces, puis sur la ligne suivante leur somme.

        (Avec la même graine, le résultat est toujours identique : c’est ce qui rend les tests possibles.)
      starter: |
        use rand::{rngs::StdRng, Rng, SeedableRng};
        use std::io::{self, Read};

        fn main() {
            let mut e = String::new();
            io::stdin().read_to_string(&mut e).unwrap();
        }
      solution: |
        use rand::{rngs::StdRng, Rng, SeedableRng};
        use std::io::{self, Read};

        fn main() {
            let mut e = String::new();
            io::stdin().read_to_string(&mut e).unwrap();
            for l in e.lines() {
                let p: Vec<u64> = l.split_whitespace().map(|x| x.parse().unwrap()).collect();
                let mut rng = StdRng::seed_from_u64(p[0]);
                let v: Vec<u64> = (0..p[1]).map(|_| rng.gen_range(1..=p[2])).collect();
                let s: Vec<String> = v.iter().map(|x| x.to_string()).collect();
                println!("{}", s.join(" "));
                println!("{}", v.iter().sum::<u64>());
            }
        }
      tests:
        - { input: '42 5 6', output: "4 4 3 1 3\n15" }
        - { input: '7 3 100', output: "4 31 15\n50", hidden: true }
      require:
        - { pattern: 'seed_from_u64', message: Utiliser StdRng::seed_from_u64 }
    exam:
      pass: 70
      questions:
        - id: rust-cargo-ex1
          type: mcq
          prompt: Quelle commande affiche l’arbre des dépendances ?
          choices: [cargo deps, cargo tree, cargo list, cargo graph]
