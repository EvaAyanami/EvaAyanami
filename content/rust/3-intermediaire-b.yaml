        code: |
          fn main() {
              let mut n = 0;
              let incrementer = || n += 1;
              incrementer();
              println!("{}", n);
          }
        bugLines: [3]
        choices:
          - La closure modifie son état (FnMut) et doit donc être déclarée mut
          - Les closures ne peuvent pas modifier de variables
          - Il faut écrire fn incrementer()
        answer: 0
        solution: |
          fn main() {
              let mut n = 0;
              let mut incrementer = || n += 1;
              incrementer();
              println!("{}", n);
          }
        tests:
          - { input: '', output: '1' }
      - id: rust-clo-code
        type: code
        title: Composer des fonctions
        prompt: |
          Écris `fn composer<F, G>(f: F, g: G) -> impl Fn(i64) -> i64` (avec les bornes adéquates) qui renvoie la closure `x ↦ g(f(x))`.

          Le programme lit un entier et affiche `composer(|x| x + 3, |x| x * x)(n)` puis `composer(|x| x * x, |x| x + 3)(n)`.
        starter: |
          use std::io;

          fn main() {
              let mut s = String::new();
              io::stdin().read_line(&mut s).unwrap();
              let n: i64 = s.trim().parse().unwrap();
              println!("{}", composer(|x| x + 3, |x| x * x)(n));
              println!("{}", composer(|x| x * x, |x| x + 3)(n));
          }
        solution: |
          use std::io;

          fn composer<F, G>(f: F, g: G) -> impl Fn(i64) -> i64
          where
              F: Fn(i64) -> i64,
              G: Fn(i64) -> i64,
          {
              move |x| g(f(x))
          }

          fn main() {
              let mut s = String::new();
              io::stdin().read_line(&mut s).unwrap();
              let n: i64 = s.trim().parse().unwrap();
              println!("{}", composer(|x| x + 3, |x| x * x)(n));
              println!("{}", composer(|x| x * x, |x| x + 3)(n));
          }
        tests:
          - { input: '2', output: "25\n7" }
          - { input: '-3', output: "0\n12", hidden: true }
        concepts: [closures, generiques]
    project:
      id: rust-clo-projet
      type: code
      title: Pipeline de filtres
      difficulty: 3
      prompt: |
        La première ligne contient des entiers. Les lignes suivantes décrivent des opérations à appliquer **dans l’ordre** sur chaque nombre : `ajouter N`, `multiplier N`, `garder_pairs`, `garder_superieurs N`.

        Construis un `Vec<Box<dyn Fn(i64) -> Option<i64>>>` (une opération de filtre renvoie `None` pour éliminer le nombre) et affiche les nombres restants séparés par des espaces (ligne vide s’il n’en reste aucun).
      starter: |
        use std::io::{self, Read};

        fn main() {
            let mut e = String::new();
            io::stdin().read_to_string(&mut e).unwrap();
            let mut lignes = e.lines();
            let nombres: Vec<i64> = lignes.next().unwrap().split_whitespace().map(|x| x.parse().unwrap()).collect();
            let mut etapes: Vec<Box<dyn Fn(i64) -> Option<i64>>> = Vec::new();
        }
      solution: |
        use std::io::{self, Read};

        fn main() {
            let mut e = String::new();
            io::stdin().read_to_string(&mut e).unwrap();
            let mut lignes = e.lines();
            let nombres: Vec<i64> = lignes.next().unwrap().split_whitespace().map(|x| x.parse().unwrap()).collect();
            let mut etapes: Vec<Box<dyn Fn(i64) -> Option<i64>>> = Vec::new();
            for l in lignes {
                let p: Vec<&str> = l.split_whitespace().collect();
                let arg: i64 = p.get(1).map(|x| x.parse().unwrap()).unwrap_or(0);
                match p[0] {
                    "ajouter" => etapes.push(Box::new(move |x| Some(x + arg))),
                    "multiplier" => etapes.push(Box::new(move |x| Some(x * arg))),
                    "garder_pairs" => etapes.push(Box::new(|x| if x % 2 == 0 { Some(x) } else { None })),
                    _ => etapes.push(Box::new(move |x| if x > arg { Some(x) } else { None })),
                }
            }
            let res: Vec<String> = nombres
                .iter()
                .filter_map(|&n| etapes.iter().try_fold(n, |acc, f| f(acc)))
                .map(|x| x.to_string())
                .collect();
            println!("{}", res.join(" "));
        }
      tests:
        - { input: "1 2 3 4 5\nmultiplier 3\ngarder_pairs\najouter 1", output: 7 13 }
        - { input: "10 20 30\ngarder_superieurs 15\nmultiplier -1", output: -20 -30, hidden: true }
        - { input: "1 3\ngarder_pairs", output: '', hidden: true }
      hints: ['`try_fold` enchaîne des fonctions qui renvoient `Option` et s’arrête au premier `None`.']
    exam:
