language: rust
level: 3
chapters:
  # ------------------------------------------------------------------
  - slug: rust-closures
    title: Closures
    summary: Fonctions anonymes qui capturent leur environnement — syntaxe, modes de capture, traits Fn/FnMut/FnOnce et move.
    minutes: 30
    concepts: [closures]
    sections:
      - title: Syntaxe
        body: |
          ```rust
          let carre = |x: i32| x * x;              // types optionnels
          let additionner = |a, b| a + b;
          let saluer = || println!("Bonjour !");
          let complexe = |x: i32| -> i32 {
              let y = x + 1;
              y * 2
          };
          println!("{} {}", carre(4), additionner(2, 3));
          ```

          Une closure peut **capturer** les variables de son environnement :

          ```rust
          let seuil = 10;
          let grand = |x: i32| x > seuil;   // capture seuil par référence
          let v: Vec<i32> = vec![5, 12, 30].into_iter().filter(|&x| grand(x)).collect();
          ```
      - title: Modes de capture et traits
        body: |
          Le compilateur choisit le mode de capture le plus léger possible :

          | Trait | Capture | Peut être appelée |
          |---|---|---|
          | `Fn` | emprunt partagé `&` | plusieurs fois |
          | `FnMut` | emprunt mutable `&mut` | plusieurs fois (modifie l’état) |
          | `FnOnce` | par valeur (déplacement) | une seule fois |

          ```rust
          let mut compteur = 0;
          let mut incr = || compteur += 1;   // FnMut
          incr(); incr();
          println!("{compteur}");            // 2

          let nom = String::from("Kiri");
          let consommer = move || nom;       // FnOnce : renvoie la String capturée
          ```

          `move` force la capture **par valeur** — indispensable pour envoyer une closure dans un autre thread.
      - title: Passer et renvoyer des closures
        body: |
          ```rust
          fn appliquer<F: Fn(i32) -> i32>(f: F, x: i32) -> i32 { f(x) }
          fn appliquer2(f: impl Fn(i32) -> i32, x: i32) -> i32 { f(x) }   // équivalent

          fn multiplicateur(n: i32) -> impl Fn(i32) -> i32 {
              move |x| x * n
          }
          let triple = multiplicateur(3);
          println!("{}", appliquer(&triple, 5));   // 15

          // Collection de closures de types différents :
          let ops: Vec<Box<dyn Fn(i32) -> i32>> = vec![Box::new(|x| x + 1), Box::new(|x| x * 10)];
          ```

          Les fonctions normales peuvent aussi être passées là où une closure est attendue : `v.iter().map(i32::abs)`.
