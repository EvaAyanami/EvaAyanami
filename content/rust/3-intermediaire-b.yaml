        prompt: |
          Le programme exécute des « tests » maison sur ta fonction `fn est_bissextile(annee: u32) -> bool`.

          Une année est bissextile si elle est divisible par 4, sauf les années séculaires (divisibles par 100) qui ne le sont que si elles sont divisibles par 400.

          Écris la fonction **et** au moins un module `#[cfg(test)]` avec des `#[test]` (vérifié par une consigne). Pour chaque année lue, le programme affiche `true`/`false`.
        starter: |
          use std::io::{self, Read};

          fn est_bissextile(annee: u32) -> bool {
              todo!()
