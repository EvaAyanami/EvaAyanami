      - id: rust-gen-code
        type: code
        title: Pile générique
        prompt: |
          Implémente `struct Pile<T> { elements: Vec<T> }` avec `new`, `empiler(&mut self, x: T)`, `depiler(&mut self) -> Option<T>`, `sommet(&self) -> Option<&T>` et `taille(&self) -> usize`.

          Le programme (fourni) l’utilise avec des `String` et des `i32`.
        starter: |
          use std::io::{self, Read};

          fn main() {
              let mut e = String::new();
              io::stdin().read_to_string(&mut e).unwrap();
              let mut mots: Pile<String> = Pile::new();
              let mut longueurs: Pile<usize> = Pile::new();
              for m in e.split_whitespace() {
                  if m == "-" {
                      if let Some(x) = mots.depiler() { println!("dépilé {}", x); }
                      longueurs.depiler();
                  } else {
                      mots.empiler(m.to_string());
                      longueurs.empiler(m.len());
                  }
              }
              println!("{} {:?} {:?}", mots.taille(), mots.sommet(), longueurs.sommet());
          }
        solution: |
          use std::io::{self, Read};

          struct Pile<T> {
              elements: Vec<T>,
          }

          impl<T> Pile<T> {
              fn new() -> Self { Pile { elements: Vec::new() } }
              fn empiler(&mut self, x: T) { self.elements.push(x); }
              fn depiler(&mut self) -> Option<T> { self.elements.pop() }
              fn sommet(&self) -> Option<&T> { self.elements.last() }
              fn taille(&self) -> usize { self.elements.len() }
          }

          fn main() {
              let mut e = String::new();
              io::stdin().read_to_string(&mut e).unwrap();
              let mut mots: Pile<String> = Pile::new();
              let mut longueurs: Pile<usize> = Pile::new();
              for m in e.split_whitespace() {
                  if m == "-" {
                      if let Some(x) = mots.depiler() { println!("dépilé {}", x); }
                      longueurs.depiler();
                  } else {
                      mots.empiler(m.to_string());
                      longueurs.empiler(m.len());
                  }
              }
              println!("{} {:?} {:?}", mots.taille(), mots.sommet(), longueurs.sommet());
          }
        tests:
          - { input: 'un deux - trois', output: "dépilé deux\n2 Some(\"trois\") Some(5)" }
          - { input: '- -', output: 0 None None, hidden: true }
        concepts: [generiques, structs]
    project:
      id: rust-gen-projet
      type: code
      title: Statistiques génériques
      difficulty: 3
      prompt: |
        Écris une fonction générique `fn min_max<T: PartialOrd + Copy>(v: &[T]) -> Option<(T, T)>` et une struct générique `Compteur<T>` (basée sur un `Vec<(T, usize)>`) avec `ajouter(&mut self, x: T)` (nécessite `T: PartialEq`) et `plus_frequent(&self) -> Option<&T>` (le premier en cas d’égalité).

        La première ligne contient des entiers, la seconde des mots. Pour chacune, affiche `min max` et l’élément le plus fréquent.
      starter: |
        use std::io::{self, Read};

        fn main() {
            let mut e = String::new();
            io::stdin().read_to_string(&mut e).unwrap();
            let mut l = e.lines();
            let nombres: Vec<i64> = l.next().unwrap().split_whitespace().map(|x| x.parse().unwrap()).collect();
            let mots: Vec<&str> = l.next().unwrap().split_whitespace().collect();
        }
      solution: |
        use std::io::{self, Read};

        fn min_max<T: PartialOrd + Copy>(v: &[T]) -> Option<(T, T)> {
            let mut it = v.iter();
            let premier = *it.next()?;
            let (mut mi, mut ma) = (premier, premier);
            for &x in it {
                if x < mi { mi = x; }
                if x > ma { ma = x; }
            }
            Some((mi, ma))
        }

        struct Compteur<T> {
            donnees: Vec<(T, usize)>,
        }

        impl<T: PartialEq> Compteur<T> {
            fn new() -> Self { Compteur { donnees: Vec::new() } }
            fn ajouter(&mut self, x: T) {
                for (v, n) in self.donnees.iter_mut() {
                    if *v == x { *n += 1; return; }
                }
                self.donnees.push((x, 1));
            }
            fn plus_frequent(&self) -> Option<&T> {
                let mut best: Option<&(T, usize)> = None;
                for d in &self.donnees {
                    if best.map_or(true, |b| d.1 > b.1) { best = Some(d); }
                }
                best.map(|(v, _)| v)
            }
        }

        fn main() {
            let mut e = String::new();
            io::stdin().read_to_string(&mut e).unwrap();
            let mut l = e.lines();
            let nombres: Vec<i64> = l.next().unwrap().split_whitespace().map(|x| x.parse().unwrap()).collect();
            let mots: Vec<&str> = l.next().unwrap().split_whitespace().collect();
            let (a, b) = min_max(&nombres).unwrap();
            let mut c1 = Compteur::new();
            for &n in &nombres { c1.ajouter(n); }
            println!("{} {} {}", a, b, c1.plus_frequent().unwrap());
            let (a, b) = min_max(&mots).unwrap();
            let mut c2 = Compteur::new();
            for &m in &mots { c2.ajouter(m); }
            println!("{} {} {}", a, b, c2.plus_frequent().unwrap());
        }
      tests:
        - { input: "4 1 4 9 1 4\npomme kiwi pomme abricot", output: "1 9 4\nabricot pomme pomme" }
        - { input: "7\nz a z a", output: "7 7 7\na z z", hidden: true }
      concepts: [generiques]
    exam:
      pass: 70
