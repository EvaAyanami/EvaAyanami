          prompt: Quelle erreur indique qu’une valeur est détruite alors qu’une référence vers elle est encore utilisée ?
          choices: [E0597 does not live long enough, E0308 mismatched types, E0382 use of moved value, E0425 cannot find value]
          answer: 0
