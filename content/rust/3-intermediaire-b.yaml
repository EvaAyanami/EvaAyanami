          prompt: Complète la déclaration de struct.
          code: "struct Vue<{{?}}> { tranche: &'a [i32] }"
          blanks: [["'a"]]

  # ------------------------------------------------------------------
  - slug: rust-tests
    title: Tests unitaires
    summary: 'Écris des tests avec #[test], assert!, assert_eq!, should_panic, organise-les en modules et pratique le développement piloté par les tests.'
    minutes: 30
    concepts: [tests]
    sections:
      - title: Un premier test
        body: |
          ```rust
          pub fn ajouter(a: i32, b: i32) -> i32 { a + b }

          #[cfg(test)]              // compilé uniquement pour les tests
          mod tests {
              use super::*;          // importe les fonctions du module parent

              #[test]
              fn addition_simple() {
                  assert_eq!(ajouter(2, 3), 5);
              }

              #[test]
              fn addition_negative() {
                  assert_eq!(ajouter(-2, -3), -5, "les négatifs doivent fonctionner");
              }
          }
          ```

          `cargo test` compile le projet en mode test et exécute chaque fonction `#[test]`. Un test **échoue** s’il panique.
      - title: Les assertions
        body: |
          | Macro | Vérifie |
          |---|---|
          | `assert!(cond)` | `cond` est vrai |
          | `assert_eq!(a, b)` | `a == b` (affiche les deux valeurs sinon) |
          | `assert_ne!(a, b)` | `a != b` |

          Tester une panique attendue :

          ```rust
          #[test]
          #[should_panic(expected = "division par zéro")]
          fn division_zero() { diviser(1, 0); }
          ```

          Un test peut aussi renvoyer `Result<(), String>` et utiliser `?`. `#[ignore]` met un test de côté (`cargo test -- --ignored` pour le lancer).
      - title: Organisation et TDD
        body: |
          - **Tests unitaires** : dans le même fichier, module `tests`, accès aux fonctions privées.
          - **Tests d’intégration** : dossier `tests/` à la racine, utilisent la crate comme un utilisateur externe.
          - **Doc-tests** : exemples dans les commentaires `///`.

          Le **TDD** (*Test-Driven Development*) : 1) écrire un test qui échoue, 2) écrire le minimum de code pour le faire passer, 3) refactoriser. Répéter.

          > 💡 Sur Codemori, chaque exercice de code est vérifié par une batterie de tests — visibles et cachés — selon exactement ce principe.
    exercises:
      - id: rust-test-q1
        type: mcq
        prompt: Que fait `#[cfg(test)]` devant un module ?
        choices: [Le module n’est compilé que lors de cargo test, Il désactive les tests, Il rend le module public, Il exécute les tests à chaque compilation]
        answer: 0
        concepts: [tests]
