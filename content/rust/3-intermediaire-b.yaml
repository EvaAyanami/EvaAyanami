    project:
      id: rust-test-projet
      type: code
      title: Validateur de numéro de carte (Luhn)
      difficulty: 3
      prompt: |
        Implémente `fn luhn_valide(numero: &str) -> bool` (algorithme de Luhn) et un module de tests complet.

        Algorithme : on ignore les espaces ; tout autre caractère non numérique rend le numéro invalide ; il faut au moins 2 chiffres. En partant de la droite, on double un chiffre sur deux (le 2e, 4e…) ; si le résultat dépasse 9, on retire 9. Le numéro est valide si la somme totale est divisible par 10.

        Pour chaque ligne, affiche `valide` ou `invalide`.
      starter: |
        use std::io::{self, Read};

        fn luhn_valide(numero: &str) -> bool {
            todo!()
        }

        fn main() {
            let mut e = String::new();
            io::stdin().read_to_string(&mut e).unwrap();
            for l in e.lines() {
                println!("{}", if luhn_valide(l) { "valide" } else { "invalide" });
            }
        }
      solution: |
        use std::io::{self, Read};

        fn luhn_valide(numero: &str) -> bool {
            let sans_espaces: String = numero.chars().filter(|c| !c.is_whitespace()).collect();
            if sans_espaces.len() < 2 || !sans_espaces.chars().all(|c| c.is_ascii_digit()) {
                return false;
            }
            let somme: u32 = sans_espaces
                .chars()
                .rev()
                .map(|c| c.to_digit(10).unwrap())
                .enumerate()
                .map(|(i, d)| if i % 2 == 1 { let x = d * 2; if x > 9 { x - 9 } else { x } } else { d })
                .sum();
            somme % 10 == 0
        }

        #[cfg(test)]
        mod tests {
            use super::*;
            #[test]
            fn numero_valide() { assert!(luhn_valide("4539 3195 0343 6467")); }
            #[test]
            fn numero_invalide() { assert!(!luhn_valide("8273 1232 7352 0569")); }
            #[test]
            fn caracteres_interdits() { assert!(!luhn_valide("055-444-285")); }
            #[test]
            fn trop_court() { assert!(!luhn_valide("0")); }
        }

        fn main() {
            let mut e = String::new();
            io::stdin().read_to_string(&mut e).unwrap();
            for l in e.lines() {
                println!("{}", if luhn_valide(l) { "valide" } else { "invalide" });
            }
        }
      tests:
        - { input: "4539 3195 0343 6467\n8273 1232 7352 0569", output: "valide\ninvalide" }
        - { input: "0\n 0 0 \n059a\n091", output: "invalide\nvalide\ninvalide\nvalide", hidden: true }
        - { input: "79927398713\n79927398710", output: "valide\ninvalide", hidden: true }
      require:
        - { pattern: '#\[test\]', message: 'Écrire des tests #[test]' }
    exam:
      pass: 70
      questions:
        - id: rust-test-ex1
          type: mcq
          prompt: Quelle commande exécute les tests d’un projet ?
          choices: [cargo run --test, cargo test, rustc --test-all, cargo check]
          answer: 1
        - id: rust-test-ex2
          type: mcq
