        solution: |
          use std::io::{self, Read};

          fn est_bissextile(annee: u32) -> bool {
              (annee % 4 == 0 && annee % 100 != 0) || annee % 400 == 0
          }

          #[cfg(test)]
          mod tests {
              use super::*;

              #[test]
              fn annees_classiques() {
                  assert!(est_bissextile(2024));
                  assert!(!est_bissextile(2023));
              }

              #[test]
              fn annees_seculaires() {
                  assert!(!est_bissextile(1900));
                  assert!(est_bissextile(2000));
              }
          }

          fn main() {
              let mut e = String::new();
              io::stdin().read_to_string(&mut e).unwrap();
              for l in e.lines() {
                  println!("{}", est_bissextile(l.trim().parse().unwrap()));
              }
          }
