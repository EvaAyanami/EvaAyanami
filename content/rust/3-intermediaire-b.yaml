          - { input: '', output: 21.5 °C }
      - id: rust-trait-bug
        type: bugfix
        prompt: Ce programme ne compile pas (E0046). Trouve le problème.
        code: |
          trait Vehicule {
              fn roues(&self) -> u32;
              fn vitesse_max(&self) -> u32;
          }
          struct Velo;
          impl Vehicule for Velo {
              fn roues(&self) -> u32 { 2 }
          }
          fn main() {
              let v = Velo;
              println!("{} {}", v.roues(), v.vitesse_max());
          }
        bugLines: [6]
        choices:
          - L’implémentation ne fournit pas la méthode vitesse_max exigée par le trait
          - Une struct vide ne peut pas implémenter de trait
          - Il faut dériver Debug
        answer: 0
        solution: |
          trait Vehicule {
              fn roues(&self) -> u32;
              fn vitesse_max(&self) -> u32;
          }
          struct Velo;
          impl Vehicule for Velo {
              fn roues(&self) -> u32 { 2 }
              fn vitesse_max(&self) -> u32 { 45 }
          }
          fn main() {
              let v = Velo;
              println!("{} {}", v.roues(), v.vitesse_max());
          }
        tests:
          - { input: '', output: 2 45 }
      - id: rust-trait-code
        type: code
        title: Vecteurs et opérateurs
        prompt: |
          Définis `#[derive(Debug, Clone, Copy, PartialEq)] struct V2 { x: i64, y: i64 }` et implémente :

          - `std::ops::Add` (addition composante par composante) ;
          - `std::ops::Mul<i64>` (multiplication par un scalaire) ;
          - `Display` au format `(x, y)`.

          Chaque ligne contient `x1 y1 x2 y2 k` : affiche `(v1 + v2) * k`.
        starter: |
          use std::io::{self, Read};

          fn main() {
              let mut e = String::new();
              io::stdin().read_to_string(&mut e).unwrap();
              for l in e.lines() {
                  let n: Vec<i64> = l.split_whitespace().map(|x| x.parse().unwrap()).collect();
                  let v1 = V2 { x: n[0], y: n[1] };
                  let v2 = V2 { x: n[2], y: n[3] };
                  println!("{}", (v1 + v2) * n[4]);
              }
          }
        solution: |
          use std::fmt;
          use std::io::{self, Read};
          use std::ops::{Add, Mul};

          #[derive(Debug, Clone, Copy, PartialEq)]
          struct V2 {
              x: i64,
              y: i64,
          }

          impl Add for V2 {
              type Output = V2;
              fn add(self, o: V2) -> V2 {
                  V2 { x: self.x + o.x, y: self.y + o.y }
              }
          }

          impl Mul<i64> for V2 {
              type Output = V2;
              fn mul(self, k: i64) -> V2 {
                  V2 { x: self.x * k, y: self.y * k }
              }
          }

          impl fmt::Display for V2 {
              fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
                  write!(f, "({}, {})", self.x, self.y)
              }
          }

          fn main() {
              let mut e = String::new();
              io::stdin().read_to_string(&mut e).unwrap();
              for l in e.lines() {
                  let n: Vec<i64> = l.split_whitespace().map(|x| x.parse().unwrap()).collect();
                  let v1 = V2 { x: n[0], y: n[1] };
                  let v2 = V2 { x: n[2], y: n[3] };
                  println!("{}", (v1 + v2) * n[4]);
              }
          }
        tests:
          - { input: '1 2 3 4 2', output: '(8, 12)' }
          - { input: "0 0 0 0 9\n-1 5 1 -5 3", output: "(0, 0)\n(0, 0)", hidden: true }
          - { input: '7 -2 3 1 -1', output: '(-10, 1)', hidden: true }
        concepts: [traits]
    project:
      id: rust-trait-projet
      type: code
      title: Ménagerie de formes
      difficulty: 3
      prompt: |
        Définis un trait `Forme` avec `aire(&self) -> f64`, `perimetre(&self) -> f64` et une méthode par défaut `resume(&self) -> String` qui renvoie `"<nom> : aire A, périmètre P"` (2 décimales) en s’appuyant sur une méthode `nom(&self) -> &str`.

        Implémente-le pour `Cercle`, `Rectangle` et `Triangle` (côtés a, b, c ; aire par la formule de Héron). Chaque ligne d’entrée : `cercle r`, `rectangle l h` ou `triangle a b c`.

        Affiche le résumé de chaque forme, puis `Plus grande aire : <nom>` (la première en cas d’égalité), en stockant les formes dans un `Vec<Box<dyn Forme>>`. Utilise π = `std::f64::consts::PI`.
      starter: |
        use std::io::{self, Read};

        fn main() {
            let mut e = String::new();
            io::stdin().read_to_string(&mut e).unwrap();
        }
      solution: |
        use std::f64::consts::PI;
        use std::io::{self, Read};

        trait Forme {
            fn nom(&self) -> &str;
            fn aire(&self) -> f64;
            fn perimetre(&self) -> f64;
            fn resume(&self) -> String {
                format!("{} : aire {:.2}, périmètre {:.2}", self.nom(), self.aire(), self.perimetre())
            }
        }

        struct Cercle(f64);
        struct Rectangle(f64, f64);
        struct Triangle(f64, f64, f64);

        impl Forme for Cercle {
            fn nom(&self) -> &str { "cercle" }
            fn aire(&self) -> f64 { PI * self.0 * self.0 }
            fn perimetre(&self) -> f64 { 2.0 * PI * self.0 }
        }
        impl Forme for Rectangle {
            fn nom(&self) -> &str { "rectangle" }
            fn aire(&self) -> f64 { self.0 * self.1 }
            fn perimetre(&self) -> f64 { 2.0 * (self.0 + self.1) }
        }
        impl Forme for Triangle {
            fn nom(&self) -> &str { "triangle" }
            fn aire(&self) -> f64 {
                let s = self.perimetre() / 2.0;
                (s * (s - self.0) * (s - self.1) * (s - self.2)).sqrt()
            }
            fn perimetre(&self) -> f64 { self.0 + self.1 + self.2 }
        }

        fn main() {
            let mut e = String::new();
            io::stdin().read_to_string(&mut e).unwrap();
            let mut formes: Vec<Box<dyn Forme>> = Vec::new();
            for l in e.lines() {
                let p: Vec<&str> = l.split_whitespace().collect();
                let n: Vec<f64> = p[1..].iter().map(|x| x.parse().unwrap()).collect();
                let f: Box<dyn Forme> = match p[0] {
                    "cercle" => Box::new(Cercle(n[0])),
                    "rectangle" => Box::new(Rectangle(n[0], n[1])),
                    _ => Box::new(Triangle(n[0], n[1], n[2])),
                };
                println!("{}", f.resume());
                formes.push(f);
            }
            let mut meilleure = &formes[0];
            for f in &formes {
                if f.aire() > meilleure.aire() {
                    meilleure = f;
                }
            }
            println!("Plus grande aire : {}", meilleure.nom());
        }
      tests:
        - { input: "cercle 1\nrectangle 2 3\ntriangle 3 4 5", output: "cercle : aire 3.14, périmètre 6.28\nrectangle : aire 6.00, périmètre 10.00\ntriangle : aire 6.00, périmètre 12.00\nPlus grande aire : rectangle" }
        - { input: "triangle 2 2 2\ncercle 2", output: "triangle : aire 1.73, périmètre 6.00\ncercle : aire 12.57, périmètre 12.57\nPlus grande aire : cercle", hidden: true }
      require:
        - { pattern: 'trait\s+Forme', message: Définir le trait Forme }
        - { pattern: 'Box\s*<\s*dyn\s+Forme\s*>', message: 'Utiliser Box<dyn Forme>' }
      concepts: [traits, polymorphisme]
    exam:
      pass: 70
      questions:
        - id: rust-trait-ex1
          type: mcq
          prompt: Quelle différence entre `&impl Forme` et `&dyn Forme` en paramètre ?
          choices: ['impl : résolution à la compilation (statique) ; dyn : à l’exécution (dynamique)', Aucune, dyn est plus rapide, impl permet les collections hétérogènes]
          answer: 0
        - id: rust-trait-ex2
          type: mcq
          prompt: Quel trait faut-il dériver pour comparer deux structs avec `==` ?
          choices: [Eq seulement, PartialEq, Compare, Ord]
          answer: 1
        - id: rust-trait-ex3
          type: mcq
          prompt: Peut-on implémenter `Display` (de std) pour `Vec<i32>` (de std) dans sa propre crate ?
          choices: [Oui, 'Non, à cause de la règle de l’orphelin', Seulement en mode unsafe, Seulement avec derive]
          answer: 1
        - id: rust-trait-ex4
          type: predict
          prompt: Que va afficher ce programme ?
          code: |
            trait Double { fn double(&self) -> Self; }
            impl Double for i32 { fn double(&self) -> i32 { self * 2 } }
            impl Double for String { fn double(&self) -> String { format!("{}{}", self, self) } }
            fn main() {
                println!("{} {}", 21.double(), String::from("ab").double());
            }
          output: 42 abab

  # ------------------------------------------------------------------
  - slug: rust-generics
    title: Generics
    summary: Écris du code générique avec des paramètres de type, des bornes de traits, des clauses where et des structs génériques.
    minutes: 30
    concepts: [generiques]
    sections:
      - title: Fonctions génériques
        body: |
          ```rust
          fn plus_grand<T: PartialOrd>(liste: &[T]) -> &T {
              let mut max = &liste[0];
              for x in liste {
                  if x > max { max = x; }
              }
              max
          }

          println!("{}", plus_grand(&[3, 9, 2]));        // 9
          println!("{}", plus_grand(&['a', 'z', 'm']));  // z
          ```

          `T: PartialOrd` est une **borne** : `T` peut être n’importe quel type qui sait se comparer. Plusieurs bornes : `T: Clone + Debug`. Pour la lisibilité, on utilise `where` :

          ```rust
          fn resumer<T, U>(a: T, b: U) -> String
          where
              T: std::fmt::Display,
              U: std::fmt::Debug + Clone,
          { format!("{a} {:?}", b) }
          ```
      - title: Types génériques
        body: |
          ```rust
          #[derive(Debug)]
          struct Paire<T> { a: T, b: T }

          impl<T: PartialOrd + Copy> Paire<T> {
              fn max(&self) -> T { if self.a > self.b { self.a } else { self.b } }
          }

          impl Paire<f64> {                    // méthode seulement pour f64
              fn moyenne(&self) -> f64 { (self.a + self.b) / 2.0 }
          }

          enum MonOption<T> { Rien, Quelque(T) }  // c’est exactement Option<T> !
          ```

          Les génériques sont **monomorphisés** : `Paire<i32>` et `Paire<f64>` deviennent deux types distincts compilés séparément. Aucun coût à l’exécution, mais un binaire un peu plus gros.
      - title: Types associés et constantes génériques
        body: |
          Certains traits utilisent un **type associé** plutôt qu’un paramètre :

          ```rust
          trait Conteneur {
              type Item;
              fn premier(&self) -> Option<&Self::Item>;
          }
          ```

          Les **const generics** paramètrent par une valeur :

          ```rust
          struct Matrice<const L: usize, const C: usize> { d: [[i32; C]; L] }
          fn somme<const N: usize>(t: [i32; N]) -> i32 { t.iter().sum() }
          ```
