          choices: ['Vec<impl Fn()>', 'Vec<Box<dyn Fn()>>', 'Vec<fn>', 'Vec<Closure>']
          answer: 1

  # ------------------------------------------------------------------
  - slug: rust-traits
    title: Traits
    summary: Définis des comportements partagés avec les traits, implémentations par défaut, traits de la bibliothèque standard et objets dyn Trait.
    minutes: 35
    concepts: [traits, polymorphisme]
    sections:
      - title: Définir et implémenter un trait
        body: |
          ```rust
          trait Forme {
              fn aire(&self) -> f64;
              fn nom(&self) -> String { String::from("forme") }   // implémentation par défaut
              fn decrire(&self) -> String {
                  format!("{} d’aire {:.2}", self.nom(), self.aire())
              }
          }

          struct Cercle { r: f64 }
          struct Carre { c: f64 }

          impl Forme for Cercle {
              fn aire(&self) -> f64 { std::f64::consts::PI * self.r * self.r }
              fn nom(&self) -> String { "cercle".into() }
          }
          impl Forme for Carre {
              fn aire(&self) -> f64 { self.c * self.c }
          }
          ```

          Un trait est un **contrat** : tout type qui l’implémente garantit fournir ces méthodes.
      - title: Polymorphisme statique et dynamique
        body: |
          **Statique** (génériques) : le compilateur génère une version par type, aucun surcoût.

          ```rust
          fn afficher(f: &impl Forme) { println!("{}", f.decrire()); }
          fn plus_grande<T: Forme>(a: T, b: T) -> T { if a.aire() > b.aire() { a } else { b } }
          ```

          **Dynamique** (`dyn Trait`) : une collection hétérogène, résolution à l’exécution via une table virtuelle.

          ```rust
          let formes: Vec<Box<dyn Forme>> = vec![Box::new(Cercle { r: 1.0 }), Box::new(Carre { c: 2.0 })];
          let total: f64 = formes.iter().map(|f| f.aire()).sum();
          ```
      - title: Les traits de la bibliothèque standard
        body: |
          | Trait | Permet | Dérivable |
          |---|---|---|
          | `Debug` | `{:?}` | ✅ |
          | `Display` | `{}` | ❌ (à écrire) |
          | `Clone` / `Copy` | dupliquer | ✅ |
          | `PartialEq` / `Eq` | `==` | ✅ |
          | `PartialOrd` / `Ord` | `<`, tri | ✅ |
          | `Hash` | clé de HashMap | ✅ |
          | `Default` | `T::default()` | ✅ |
          | `From` / `Into` | conversions | ❌ |
          | `Add`, `Mul`… (`std::ops`) | surcharge d’opérateurs | ❌ |

          ```rust
          use std::ops::Add;
          #[derive(Debug, Clone, Copy, PartialEq)]
          struct V2 { x: i32, y: i32 }
          impl Add for V2 {
              type Output = V2;
              fn add(self, o: V2) -> V2 { V2 { x: self.x + o.x, y: self.y + o.y } }
          }
          ```

          **Règle de l’orphelin** : on ne peut implémenter un trait pour un type que si le trait **ou** le type est défini dans ta crate.
    exercises:
      - id: rust-trait-q1
        type: mcq
        prompt: Que contient un trait ?
        choices: [Des données, Des signatures de méthodes (avec éventuellement des implémentations par défaut), Uniquement des constantes, Un constructeur obligatoire]
        answer: 1
        concepts: [traits]
      - id: rust-trait-predict
        type: predict
        prompt: Que va afficher ce programme ?
        code: |
