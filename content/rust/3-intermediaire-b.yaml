          }
          fn main() {
              let zoo: Vec<Box<dyn Animal>> = vec![Box::new(Chat), Box::new(Poisson)];
              for a in &zoo {
                  println!("{}", a.presenter());
              }
          }
        output: "Le chat fait miaou\nLe poisson fait ..."
        concepts: [traits, polymorphisme]
      - id: rust-trait-fill
        type: fill
        prompt: Complète l’implémentation de Display.
        code: |
          use std::fmt;
          struct Temp(f64);
          impl fmt::{{?}} for Temp {
              fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
                  {{?}}!(f, "{:.1} °C", self.0)
              }
