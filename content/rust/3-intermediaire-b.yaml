  # ------------------------------------------------------------------
  - slug: rust-lifetimes
    title: Lifetimes (durées de vie)
    summary: Annote les durées de vie ('a) pour relier entrées et sorties, comprends l’élision et les structs contenant des références.
    minutes: 35
    concepts: [lifetimes, references]
    sections:
      - title: Le problème
        body: |
          ```rust
          fn plus_long(a: &str, b: &str) -> &str {      // ❌ E0106
              if a.len() > b.len() { a } else { b }
          }
          ```

          La référence renvoyée vient-elle de `a` ou de `b` ? Le compilateur ne peut pas savoir combien de temps elle reste valide. On l’annote :

          ```rust
          fn plus_long<'a>(a: &'a str, b: &'a str) -> &'a str {
              if a.len() > b.len() { a } else { b }
          }
          ```

          `'a` se lit « durée de vie a ». L’annotation dit : *le résultat vit au moins aussi longtemps que la plus courte des deux entrées*. Elle **ne change pas** la durée de vie des valeurs : elle décrit une relation que le compilateur vérifie.
      - title: Vérification à l’usage
        body: |
          ```rust
          let s1 = String::from("long texte");
          let resultat;
          {
              let s2 = String::from("court");
              resultat = plus_long(&s1, &s2);
          } // s2 est détruite ici
          println!("{resultat}"); // ❌ E0597: `s2` does not live long enough
          ```

          Le compilateur refuse : `resultat` pourrait désigner `s2`, déjà détruite.

          **Règles d’élision** (pourquoi on n’écrit presque jamais `'a`) :

          1. chaque référence en paramètre reçoit sa propre durée de vie ;
          2. s’il y a **une seule** référence en entrée, la sortie reçoit sa durée de vie ;
          3. pour une méthode avec `&self`, la sortie reçoit la durée de vie de `self`.
      - title: Structs qui empruntent
        body: |
          Une struct qui contient une référence doit déclarer sa durée de vie :

          ```rust
          struct Extrait<'a> {
              texte: &'a str,
          }

          impl<'a> Extrait<'a> {
              fn premier_mot(&self) -> &'a str {
                  self.texte.split_whitespace().next().unwrap_or("")
              }
          }

          let roman = String::from("Il était une fois...");
          let e = Extrait { texte: &roman };   // e ne doit pas survivre à roman
          ```

          `'static` désigne une référence valide pendant tout le programme (littéraux de chaînes, constantes).
    exercises:
      - id: rust-life-q1
        type: mcq
        prompt: Que fait une annotation de durée de vie `'a` ?
        choices: [Elle prolonge la vie d’une variable, Elle décrit une relation entre durées de vie que le compilateur vérifie, Elle libère la mémoire plus tôt, Elle rend la variable globale]
        answer: 1
        concepts: [lifetimes]
      - id: rust-life-fill
        type: fill
        prompt: Complète la signature.
        code: |
          fn premier<{{?}}>(a: &'a str, _b: &str) -> &'a str {
              a
          }
          fn main() {
              println!("{}", premier("gauche", "droite"));
          }
        blanks: [["'a"]]
        tests:
          - { input: '', output: gauche }
      - id: rust-life-q2
        type: mcq
        prompt: 'Pourquoi `fn f(s: &str) -> &str` compile-t-il sans annotation ?'
        choices: [Grâce aux règles d’élision (une seule référence en entrée), Parce que &str est toujours 'static, Parce que la fonction est courte, Il ne compile pas]
        answer: 0
      - id: rust-life-bug
        type: bugfix
        prompt: Ce programme ne compile pas (E0597). Trouve la ligne qui pose problème et corrige-le.
        code: |
          fn plus_long<'a>(a: &'a str, b: &'a str) -> &'a str {
              if a.len() >= b.len() { a } else { b }
          }
          fn main() {
              let s1 = String::from("bonjour");
              let r;
              {
                  let s2 = String::from("salut tout le monde");
                  r = plus_long(&s1, &s2);
              }
              println!("{}", r);
          }
        bugLines: [8, 9, 10]
        choices:
          - s2 est détruite à la fin du bloc alors que r pourrait encore y faire référence
          - plus_long devrait renvoyer une String
          - r doit être déclarée mut
        answer: 0
        solution: |
          fn plus_long<'a>(a: &'a str, b: &'a str) -> &'a str {
              if a.len() >= b.len() { a } else { b }
          }
          fn main() {
              let s1 = String::from("bonjour");
              let s2 = String::from("salut tout le monde");
              let r = plus_long(&s1, &s2);
              println!("{}", r);
          }
        tests:
          - { input: '', output: salut tout le monde }
      - id: rust-life-code
        type: code
        title: Analyseur de mots
        prompt: |
          Crée `struct Analyseur<'a> { texte: &'a str }` avec les méthodes :

          - `mots(&self) -> Vec<&'a str>` ;
          - `plus_long(&self) -> Option<&'a str>` (le premier en cas d’égalité, longueur en caractères).

          Pour chaque ligne, affiche le nombre de mots et le plus long (`aucun` si la ligne est vide).
        starter: |
          use std::io::{self, Read};

          fn main() {
              let mut e = String::new();
              io::stdin().read_to_string(&mut e).unwrap();
              for ligne in e.lines() {
                  let a = Analyseur { texte: ligne };
                  println!("{} {}", a.mots().len(), a.plus_long().unwrap_or("aucun"));
              }
          }
        solution: |
          use std::io::{self, Read};

          struct Analyseur<'a> {
              texte: &'a str,
          }

          impl<'a> Analyseur<'a> {
              fn mots(&self) -> Vec<&'a str> {
                  self.texte.split_whitespace().collect()
              }
              fn plus_long(&self) -> Option<&'a str> {
                  let mut best: Option<&'a str> = None;
                  for m in self.mots() {
                      if best.map_or(true, |b| m.chars().count() > b.chars().count()) {
                          best = Some(m);
                      }
                  }
                  best
              }
          }

          fn main() {
              let mut e = String::new();
              io::stdin().read_to_string(&mut e).unwrap();
              for ligne in e.lines() {
                  let a = Analyseur { texte: ligne };
                  println!("{} {}", a.mots().len(), a.plus_long().unwrap_or("aucun"));
              }
          }
        tests:
          - { input: "les durées de vie\nok", output: "4 durées\n1 ok" }
          - { input: "\nab cd", output: "0 aucun\n2 ab", hidden: true }
        concepts: [lifetimes]
    project:
      id: rust-life-projet
      type: code
      title: Découpeur sans copie
      difficulty: 3
      prompt: |
        Écris un découpeur de CSV qui **ne copie aucune chaîne** : `struct LigneCsv<'a> { champs: Vec<&'a str> }` avec `fn analyser(ligne: &'a str) -> LigneCsv<'a>` (séparateur `;`, espaces autour supprimés par `trim`) et `fn champ(&self, i: usize) -> Option<&'a str>`.

        La première ligne est l’en-tête. Pour chaque ligne suivante, affiche `<valeur de la colonne "nom"> (<valeur de la colonne "ville">)`, ou `?` pour une valeur manquante.
      starter: |
        use std::io::{self, Read};

        fn main() {
            let mut e = String::new();
            io::stdin().read_to_string(&mut e).unwrap();
        }
      solution: |
        use std::io::{self, Read};

        struct LigneCsv<'a> {
            champs: Vec<&'a str>,
        }

        impl<'a> LigneCsv<'a> {
            fn analyser(ligne: &'a str) -> LigneCsv<'a> {
                LigneCsv { champs: ligne.split(';').map(|c| c.trim()).collect() }
            }
            fn champ(&self, i: usize) -> Option<&'a str> {
                self.champs.get(i).copied().filter(|c| !c.is_empty())
            }
        }

        fn main() {
            let mut e = String::new();
            io::stdin().read_to_string(&mut e).unwrap();
            let mut lignes = e.lines();
            let entete = LigneCsv::analyser(lignes.next().unwrap());
            let i_nom = entete.champs.iter().position(|c| *c == "nom").unwrap();
            let i_ville = entete.champs.iter().position(|c| *c == "ville").unwrap();
            for l in lignes {
                let ligne = LigneCsv::analyser(l);
                println!("{} ({})", ligne.champ(i_nom).unwrap_or("?"), ligne.champ(i_ville).unwrap_or("?"));
            }
        }
      tests:
        - { input: "id;nom;ville\n1; Ada ;Londres\n2;Linus;", output: "Ada (Londres)\nLinus (?)" }
        - { input: "ville;nom\nParis;Kiri\n;\nLyon", output: "Kiri (Paris)\n? (?)\n? (Lyon)", hidden: true }
      require:
        - { pattern: "struct\\s+LigneCsv\\s*<\\s*'a\\s*>", message: "Définir LigneCsv<'a>" }
    exam:
      pass: 70
      questions:
        - id: rust-life-ex1
          type: mcq
          prompt: Que signifie la durée de vie `'static` ?
          choices: [La référence est valide pendant tout le programme, La variable est constante, La valeur est sur la pile, Elle est réservée aux threads]
          answer: 0
        - id: rust-life-ex2
          type: mcq
          prompt: 'Pour une méthode `fn f(&self, x: &str) -> &str`, quelle durée de vie l’élision donne-t-elle au résultat ?'
          choices: ['Celle de x', 'Celle de self', "'static", 'Aucune (erreur)']
          answer: 1
        - id: rust-life-ex3
