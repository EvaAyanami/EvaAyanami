    project:
      id: rust-vec-projet
      type: code
      title: Médiane et quartiles
      difficulty: 3
      prompt: |
        Lis des nombres décimaux (un par ligne). Trie-les et affiche (2 décimales) :

        ```
        Min : …
        Médiane : …
        Max : …
        Écart interquartile : …
        ```

        La médiane d’un nombre pair d’éléments est la moyenne des deux valeurs centrales. Q1 est la médiane de la moitié inférieure, Q3 celle de la moitié supérieure (sans inclure la médiane si n est impair). L’écart interquartile vaut Q3 − Q1. Il y a toujours au moins 2 nombres.
      starter: |
        use std::io::{self, Read};

        fn mediane(v: &[f64]) -> f64 {
            todo!()
        }

        fn main() {
            let mut e = String::new();
            io::stdin().read_to_string(&mut e).unwrap();
            let mut v: Vec<f64> = e.lines().map(|l| l.trim().parse().unwrap()).collect();
        }
      solution: |
        use std::io::{self, Read};

        fn mediane(v: &[f64]) -> f64 {
            let n = v.len();
            if n % 2 == 0 { (v[n / 2 - 1] + v[n / 2]) / 2.0 } else { v[n / 2] }
        }

        fn main() {
            let mut e = String::new();
            io::stdin().read_to_string(&mut e).unwrap();
            let mut v: Vec<f64> = e.lines().map(|l| l.trim().parse().unwrap()).collect();
            v.sort_by(f64::total_cmp);
            let n = v.len();
            let bas = &v[..n / 2];
            let haut = &v[(n + 1) / 2..];
            println!("Min : {:.2}", v[0]);
            println!("Médiane : {:.2}", mediane(&v));
            println!("Max : {:.2}", v[n - 1]);
            println!("Écart interquartile : {:.2}", mediane(haut) - mediane(bas));
        }
      tests:
        - { input: "7\n1\n3\n9\n5", output: "Min : 1.00\nMédiane : 5.00\nMax : 9.00\nÉcart interquartile : 6.00" }
        - { input: "4\n2", output: "Min : 2.00\nMédiane : 3.00\nMax : 4.00\nÉcart interquartile : 2.00", hidden: true }
        - { input: "1.5\n2.5\n10\n4\n3\n8", output: "Min : 1.50\nMédiane : 3.50\nMax : 10.00\nÉcart interquartile : 5.50", hidden: true }
