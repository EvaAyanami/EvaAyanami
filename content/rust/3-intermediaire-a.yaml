      type: code
      title: Index de livre
      difficulty: 3
      prompt: |
        L’entrée contient des lignes de texte (les pages, numérotées à partir de 1). Construis un **index** : pour chaque mot (en minuscules, d’au moins 4 lettres), la liste des pages où il apparaît, sans doublon.

        Affiche les mots par ordre alphabétique : `mot : p1, p2, …`.
      starter: |
        use std::collections::{BTreeMap, BTreeSet};
        use std::io::{self, Read};

        fn main() {
            let mut t = String::new();
            io::stdin().read_to_string(&mut t).unwrap();
        }
      solution: |
        use std::collections::{BTreeMap, BTreeSet};
        use std::io::{self, Read};

        fn main() {
            let mut t = String::new();
            io::stdin().read_to_string(&mut t).unwrap();
            let mut index: BTreeMap<String, BTreeSet<usize>> = BTreeMap::new();
            for (i, page) in t.lines().enumerate() {
                for mot in page.split_whitespace() {
                    let m = mot.to_lowercase();
                    if m.chars().count() >= 4 {
                        index.entry(m).or_default().insert(i + 1);
                    }
                }
            }
            for (mot, pages) in &index {
                let p: Vec<String> = pages.iter().map(|x| x.to_string()).collect();
                println!("{} : {}", mot, p.join(", "));
            }
        }
      tests:
