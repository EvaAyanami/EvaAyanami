  - slug: rust-vecteurs
    title: Vecteurs
    summary: Crée, modifie, trie et parcours des Vec<T> ; maîtrise get, retain, dedup, sort_by et les fenêtres.
    minutes: 30
    concepts: [collections, vecteurs]
    sections:
      - title: Créer et modifier
        body: |
          ```rust
          let mut v: Vec<i32> = Vec::new();
          let w = vec![1, 2, 3];
          let zeros = vec![0; 10];

          v.push(4);             // ajoute à la fin
          v.extend([5, 6]);      // ajoute plusieurs éléments
          v.insert(0, 3);        // insère à l’indice 0 (décale le reste)
          let dernier = v.pop(); // Option<i32>
          v.remove(0);           // retire l’indice 0
          v.clear();             // vide tout
          ```

          Accès : `v[i]` panique hors limites, `v.get(i)` renvoie un `Option`. `v.len()`, `v.is_empty()`, `v.contains(&x)`, `v.first()`, `v.last()`.
      - title: Trier et filtrer
        body: |
          ```rust
          let mut n = vec![5, 3, 8, 3, 1];
          n.sort();                       // [1, 3, 3, 5, 8]
          n.dedup();                      // supprime les doublons consécutifs → [1, 3, 5, 8]
          n.reverse();                    // [8, 5, 3, 1]
          n.retain(|&x| x > 2);           // garde ceux qui vérifient → [8, 5, 3]
          n.sort_by(|a, b| b.cmp(a));     // tri décroissant
          n.sort_by_key(|x| x % 3);       // tri selon une clé
          ```

          Pour les flottants (qui n’implémentent pas `Ord`) : `v.sort_by(|a, b| a.partial_cmp(b).unwrap())` ou `v.sort_by(f64::total_cmp)`.

          Recherche dans un vecteur trié : `n.binary_search(&5)` → `Ok(indice)` ou `Err(position_d_insertion)`.
      - title: Tranches et fenêtres
        body: |
          ```rust
          let v = vec![1, 2, 3, 4, 5];
          for paire in v.windows(2) { print!("{:?} ", paire); }   // [1,2] [2,3] [3,4] [4,5]
          for bloc in v.chunks(2) { print!("{:?} ", bloc); }      // [1,2] [3,4] [5]
          let (gauche, droite) = v.split_at(2);                   // [1,2] et [3,4,5]
          println!("{}", v.iter().max().unwrap());                // 5
          ```
