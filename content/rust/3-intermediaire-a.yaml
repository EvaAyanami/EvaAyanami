  - slug: rust-hashmap
    title: HashMap
    summary: Associe des clés à des valeurs, compte des occurrences avec l’API entry et parcours un dictionnaire.
    minutes: 30
    concepts: [hashmap, collections]
    sections:
      - title: Bases
        body: |
          ```rust
          use std::collections::HashMap;

          let mut capitales = HashMap::new();
          capitales.insert("France", "Paris");
          capitales.insert("Japon", "Tokyo");

          if let Some(c) = capitales.get("Japon") { println!("{c}"); }
          capitales.remove("France");
          println!("{}", capitales.contains_key("France")); // false
          println!("{}", capitales.len());

          for (pays, ville) in &capitales {     // ordre NON garanti
              println!("{pays} → {ville}");
          }
          ```

          `insert` sur une clé existante **remplace** la valeur (et renvoie l’ancienne dans un `Option`).
      - title: L’API entry
        body: |
          Le motif le plus courant : compter ou regrouper.

          ```rust
          let texte = "le chat et le chien";
          let mut freq: HashMap<&str, u32> = HashMap::new();
          for mot in texte.split_whitespace() {
              *freq.entry(mot).or_insert(0) += 1;
          }
          // freq["le"] == 2

          let mut groupes: HashMap<usize, Vec<&str>> = HashMap::new();
          for mot in texte.split_whitespace() {
              groupes.entry(mot.len()).or_default().push(mot);
          }
          ```

          `entry(k)` renvoie une « entrée » sur laquelle `or_insert(v)` insère `v` si la clé est absente, puis renvoie une `&mut` vers la valeur.
      - title: Ordonner les résultats
        body: |
          Un `HashMap` n’a pas d’ordre. Pour un affichage stable :

          ```rust
          let mut paires: Vec<(&&str, &u32)> = freq.iter().collect();
          paires.sort_by(|a, b| b.1.cmp(a.1).then(a.0.cmp(b.0))); // fréquence ↓ puis alphabétique
          ```

          Ou utiliser un `BTreeMap` dont les clés sont toujours triées.

          Les clés possédées (`String`) sont déplacées dans la map ; pour éviter de les cloner, on peut utiliser des `&str` qui empruntent le texte d’origine.
