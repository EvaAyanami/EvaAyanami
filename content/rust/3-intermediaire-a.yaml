  # ------------------------------------------------------------------
  - slug: rust-iterateurs
    title: Itérateurs
    summary: Le trait Iterator, les adaptateurs paresseux (map, filter, zip, enumerate…) et les consommateurs (collect, sum, fold…).
    minutes: 35
    concepts: [iterateurs]
    sections:
      - title: Le trait Iterator
        body: |
          Un itérateur produit des éléments un par un via `next()` :

          ```rust
          let v = vec![1, 2, 3];
          let mut it = v.iter();
          assert_eq!(it.next(), Some(&1));
          ```

          Trois façons d’itérer sur une collection :

          | Méthode | Éléments | Effet sur la collection |
          |---|---|---|
          | `iter()` | `&T` | empruntée |
          | `iter_mut()` | `&mut T` | empruntée mutablement |
          | `into_iter()` | `T` | consommée |
      - title: Adaptateurs et consommateurs
        body: |
          Les **adaptateurs** transforment un itérateur en un autre, **paresseusement** (rien n’est calculé tant qu’un **consommateur** ne le demande) :

          ```rust
          let resultat: Vec<i32> = (1..=10)
              .filter(|x| x % 2 == 0)     // 2, 4, 6, 8, 10
              .map(|x| x * x)             // 4, 16, 36, 64, 100
              .take(3)                    // 4, 16, 36
              .collect();                 // consommateur
          ```

          Adaptateurs : `map`, `filter`, `filter_map`, `enumerate`, `zip`, `chain`, `skip`, `take`, `rev`, `flat_map`, `take_while`, `skip_while`, `peekable`, `step_by`, `cloned`.

          Consommateurs : `collect`, `sum`, `product`, `count`, `min`, `max`, `min_by_key`, `fold`, `any`, `all`, `find`, `position`, `last`, `for_each`.

          ```rust
          let total = v.iter().fold(0, |acc, x| acc + x);
          let tous_positifs = v.iter().all(|&x| x > 0);
          let paires: Vec<(char, i32)> = "abc".chars().zip(1..).collect();
          ```
      - title: Créer son propre itérateur
        body: |
          ```rust
          struct Compteur { n: u32 }

          impl Iterator for Compteur {
              type Item = u32;
              fn next(&mut self) -> Option<u32> {
                  if self.n < 5 { self.n += 1; Some(self.n) } else { None }
              }
          }

          let s: u32 = Compteur { n: 0 }.zip(Compteur { n: 0 }.skip(1))
              .map(|(a, b)| a * b)
              .sum();   // 1*2 + 2*3 + 3*4 + 4*5 = 40
          ```

          En implémentant seulement `next`, on obtient gratuitement **toutes** les méthodes d’adaptation. Et grâce à la monomorphisation, une chaîne d’itérateurs est compilée aussi efficacement qu’une boucle écrite à la main (*zero-cost abstraction*).
    exercises:
      - id: rust-it-predict1
        type: predict
        prompt: Que va afficher ce programme ?
        code: |
          fn main() {
              let v = vec![3, 8, 1, 6, 4];
              let a: Vec<i32> = v.iter().filter(|&&x| x > 3).map(|x| x * 10).collect();
              let b: i32 = v.iter().skip(1).step_by(2).sum();
