        use std::collections::VecDeque;
        use std::io::{self, Read};

        fn main() {
            let mut e = String::new();
            io::stdin().read_to_string(&mut e).unwrap();
            let mut prio: VecDeque<String> = VecDeque::new();
            let mut normale: VecDeque<String> = VecDeque::new();
            for l in e.lines() {
                let p: Vec<&str> = l.split_whitespace().collect();
                match p[0] {
                    "arrivee" => normale.push_back(p[1].to_string()),
                    "arrivee_prio" => prio.push_back(p[1].to_string()),
                    "appel" => match prio.pop_front().or_else(|| normale.pop_front()) {
                        Some(n) => println!("Guichet : {}", n),
                        None => println!("Personne en attente"),
                    },
                    _ => println!("En attente : {} prioritaires, {} normales", prio.len(), normale.len()),
                }
            }
        }
