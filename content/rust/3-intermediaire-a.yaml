      difficulty: 3
      prompt: |
        Simule un guichet avec deux files : une file **prioritaire** et une file **normale** (deux `VecDeque<String>`).

        Commandes :

        - `arrivee NOM` / `arrivee_prio NOM` : ajoute la personne dans la file correspondante ;
