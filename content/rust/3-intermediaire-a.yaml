language: rust
level: 3
chapters:
  # ------------------------------------------------------------------
  - slug: rust-modules
    title: Modules
    summary: Organise ton code avec mod, contrôle la visibilité avec pub et importe des éléments avec use.
    minutes: 25
    concepts: [modules]
    sections:
      - title: Déclarer des modules
        body: |
          Un **module** regroupe des fonctions, types et constantes sous un même nom :

          ```rust
          mod geometrie {
              pub const PI: f64 = 3.14159;

              pub fn aire_cercle(r: f64) -> f64 {
                  PI * r * r
              }

              fn secret() {}            // privé : invisible hors du module

              pub mod volumes {         // module imbriqué
                  pub fn cube(c: f64) -> f64 { c * c * c }
              }
          }

          fn main() {
              println!("{}", geometrie::aire_cercle(2.0));
              println!("{}", geometrie::volumes::cube(3.0));
          }
          ```

          **Tout est privé par défaut.** `pub` rend un élément visible depuis le module parent.
      - title: Chemins et use
        body: |
          ```rust
          use geometrie::volumes::cube;          // importe une fonction
          use std::collections::{HashMap, HashSet}; // plusieurs éléments
          use std::fmt::Result as FmtResult;     // renommage
          ```

          Chemins relatifs et absolus :

          - `crate::a::b` part de la racine de la crate ;
          - `self::x` désigne le module courant, `super::x` le module parent.

          Dans un projet Cargo, `mod reseau;` dans `main.rs` charge le fichier `src/reseau.rs` (ou `src/reseau/mod.rs`). Les champs d’une struct `pub` restent privés sauf s’ils sont eux-mêmes marqués `pub`.
    exercises:
      - id: rust-mod-q1
        type: mcq
        prompt: Par défaut, une fonction déclarée dans un module est…
        choices: [publique, privée, globale, constante]
        answer: 1
        concepts: [modules]
      - id: rust-mod-predict
        type: predict
        prompt: Que va afficher ce programme ?
        code: |
          mod banque {
              pub struct Compte {
                  pub titulaire: String,
                  solde: i64,
              }
              impl Compte {
                  pub fn new(t: &str) -> Self { Compte { titulaire: t.to_string(), solde: 0 } }
                  pub fn deposer(&mut self, m: i64) { self.solde += m; }
                  pub fn solde(&self) -> i64 { self.solde }
              }
          }
          use banque::Compte;
          fn main() {
              let mut c = Compte::new("Kiri");
              c.deposer(30);
              c.deposer(12);
              println!("{} {}", c.titulaire, c.solde());
          }
        output: Kiri 42
      - id: rust-mod-bug
        type: bugfix
        prompt: Ce programme ne compile pas (E0603). Trouve la ligne à corriger.
        code: |
          mod outils {
              fn doubler(x: i32) -> i32 {
                  x * 2
              }
          }

          fn main() {
              println!("{}", outils::doubler(21));
          }
        bugLines: [2]
        choices:
          - La fonction doubler est privée ; il faut la déclarer pub
          - Les modules ne peuvent pas contenir de fonctions
          - Il faut écrire outils.doubler
        answer: 0
        solution: |
          mod outils {
              pub fn doubler(x: i32) -> i32 {
                  x * 2
              }
          }

          fn main() {
              println!("{}", outils::doubler(21));
          }
        tests:
          - { input: '', output: '42' }
      - id: rust-mod-fill
        type: fill
        prompt: Complète pour appeler une fonction du module parent depuis un sous-module.
        code: |
          fn salut() -> &'static str { "salut" }

          mod enfant {
              pub fn parler() -> String {
                  format!("{} !", {{?}}::salut())
              }
          }

          fn main() {
              println!("{}", enfant::parler());
          }
        blanks: [[super, crate]]
        tests:
          - { input: '', output: salut ! }
      - id: rust-mod-code
        type: code
        title: Module de conversions
        prompt: |
          Crée un module `conversions` contenant deux sous-modules publics :

          - `longueur` avec `pub fn km_vers_miles(km: f64) -> f64` (× 0.621371) ;
          - `masse` avec `pub fn kg_vers_livres(kg: f64) -> f64` (× 2.20462).

          Chaque ligne d’entrée est `valeur unite` (`km` ou `kg`). Affiche la conversion avec 2 décimales (`5.00 km = 3.11 mi`, `2.00 kg = 4.41 lb`).
        starter: |
          use std::io::{self, Read};

          fn main() {
              let mut e = String::new();
              io::stdin().read_to_string(&mut e).unwrap();
          }
        solution: |
          use std::io::{self, Read};

          mod conversions {
              pub mod longueur {
                  pub fn km_vers_miles(km: f64) -> f64 { km * 0.621371 }
              }
              pub mod masse {
                  pub fn kg_vers_livres(kg: f64) -> f64 { kg * 2.20462 }
              }
          }

          use conversions::{longueur, masse};

          fn main() {
              let mut e = String::new();
              io::stdin().read_to_string(&mut e).unwrap();
              for l in e.lines() {
                  let p: Vec<&str> = l.split_whitespace().collect();
                  let v: f64 = p[0].parse().unwrap();
                  if p[1] == "km" {
                      println!("{:.2} km = {:.2} mi", v, longueur::km_vers_miles(v));
                  } else {
                      println!("{:.2} kg = {:.2} lb", v, masse::kg_vers_livres(v));
                  }
              }
          }
        tests:
          - { input: "5 km\n2 kg", output: "5.00 km = 3.11 mi\n2.00 kg = 4.41 lb" }
          - { input: "42.195 km\n0 kg", output: "42.20 km = 26.22 mi\n0.00 kg = 0.00 lb", hidden: true }
        require:
          - { pattern: 'mod\s+conversions', message: Créer le module conversions }
          - { pattern: 'pub\s+mod\s+longueur', message: Créer le sous-module public longueur }
        concepts: [modules]
    project:
      id: rust-mod-projet
      type: code
      title: Bibliothèque modulaire
      difficulty: 3
      prompt: |
        Organise un petit gestionnaire de bibliothèque en modules :

        - `modele` : `pub struct Livre { pub titre: String, pub auteur: String, emprunte: bool }` avec `new`, `emprunter(&mut self) -> bool` (false si déjà emprunté), `rendre(&mut self)`, `est_disponible(&self) -> bool` ;
        - `catalogue` : `pub struct Catalogue` contenant un `Vec<Livre>` (champ privé) avec `ajouter`, `chercher_mut(&mut self, titre: &str) -> Option<&mut Livre>`, `disponibles(&self) -> usize`.

        Commandes : `ajouter Titre;Auteur`, `emprunter Titre`, `rendre Titre`, `stats`. Les sorties attendues :

        - `emprunter` → `OK` ou `indisponible` ou `introuvable` ;
        - `rendre` → `OK` ou `introuvable` ;
        - `stats` → `disponibles : N`.
      starter: |
        use std::io::{self, Read};

        fn main() {
            let mut e = String::new();
            io::stdin().read_to_string(&mut e).unwrap();
            for l in e.lines() {
                let (cmd, arg) = l.split_once(' ').unwrap_or((l, ""));
                // …
            }
        }
      solution: |
        use std::io::{self, Read};

        mod modele {
            pub struct Livre {
                pub titre: String,
                pub auteur: String,
                emprunte: bool,
            }
            impl Livre {
                pub fn new(titre: &str, auteur: &str) -> Self {
                    Livre { titre: titre.into(), auteur: auteur.into(), emprunte: false }
                }
                pub fn emprunter(&mut self) -> bool {
                    if self.emprunte { false } else { self.emprunte = true; true }
                }
                pub fn rendre(&mut self) { self.emprunte = false; }
                pub fn est_disponible(&self) -> bool { !self.emprunte }
            }
        }

        mod catalogue {
            use super::modele::Livre;
            pub struct Catalogue { livres: Vec<Livre> }
            impl Catalogue {
                pub fn new() -> Self { Catalogue { livres: Vec::new() } }
                pub fn ajouter(&mut self, l: Livre) { self.livres.push(l); }
                pub fn chercher_mut(&mut self, titre: &str) -> Option<&mut Livre> {
                    self.livres.iter_mut().find(|l| l.titre == titre)
                }
                pub fn disponibles(&self) -> usize {
                    self.livres.iter().filter(|l| l.est_disponible()).count()
                }
            }
        }

        use catalogue::Catalogue;
        use modele::Livre;

        fn main() {
            let mut e = String::new();
            io::stdin().read_to_string(&mut e).unwrap();
            let mut cat = Catalogue::new();
            for l in e.lines() {
                let (cmd, arg) = l.split_once(' ').unwrap_or((l, ""));
                match cmd {
                    "ajouter" => {
                        let (t, a) = arg.split_once(';').unwrap();
                        cat.ajouter(Livre::new(t, a));
                    }
                    "emprunter" => match cat.chercher_mut(arg) {
                        Some(livre) => println!("{}", if livre.emprunter() { "OK" } else { "indisponible" }),
                        None => println!("introuvable"),
                    },
                    "rendre" => match cat.chercher_mut(arg) {
                        Some(livre) => { livre.rendre(); println!("OK"); }
                        None => println!("introuvable"),
                    },
                    _ => println!("disponibles : {}", cat.disponibles()),
                }
            }
        }
      tests:
        - { input: "ajouter Dune;Herbert\najouter Fondation;Asimov\nemprunter Dune\nemprunter Dune\nstats\nrendre Dune\nstats\nemprunter Hypérion", output: "OK\nindisponible\ndisponibles : 1\nOK\ndisponibles : 2\nintrouvable" }
        - { input: "stats\nrendre X\najouter A B;C\nemprunter A B\nstats", output: "disponibles : 0\nintrouvable\nOK\ndisponibles : 0", hidden: true }
      require:
        - { pattern: 'mod\s+modele', message: Créer le module modele }
        - { pattern: 'mod\s+catalogue', message: Créer le module catalogue }
    exam:
      pass: 70
      questions:
        - id: rust-mod-ex1
          type: mcq
          prompt: Que désigne `super` dans un chemin ?
          choices: [La racine de la crate, Le module parent, La bibliothèque standard, Le module courant]
          answer: 1
        - id: rust-mod-ex2
          type: mcq
          prompt: Avec `mod reseau;` dans `src/main.rs`, quel fichier Cargo charge-t-il ?
          choices: [src/reseau.rs ou src/reseau/mod.rs, reseau.toml, lib/reseau.rs, Aucun]
          answer: 0
        - id: rust-mod-ex3
          type: mcq
          prompt: Une struct `pub` a des champs sans `pub`. Peut-on les lire depuis un autre module ?
          choices: [Oui, 'Non, ils restent privés', Seulement en lecture, Seulement avec unsafe]
          answer: 1
        - id: rust-mod-ex4
          type: fill
          prompt: Complète l’import groupé.
          code: 'use std::collections::{{{?}}, HashSet};'
          blanks: [[HashMap, BTreeMap, VecDeque]]

  # ------------------------------------------------------------------
  - slug: rust-crates
    title: Crates
    summary: Crates binaires et bibliothèques, crates.io, versionnage sémantique et utilisation de crates populaires (rand, serde_json, regex).
    minutes: 25
    concepts: [build, modules]
    sections:
      - title: Qu’est-ce qu’une crate ?
        body: |
          Une **crate** est l’unité de compilation de Rust :

          - **crate binaire** : produit un exécutable (contient `fn main`, racine `src/main.rs`) ;
          - **crate bibliothèque** : du code réutilisable (racine `src/lib.rs`).

          Un **package** (défini par `Cargo.toml`) contient au plus une bibliothèque et autant de binaires que nécessaire.

          L’écosystème partage ses bibliothèques sur **crates.io** (plus de 150 000 crates). La documentation de chacune est sur **docs.rs**.
      - title: Ajouter une dépendance
        body: |
          ```toml
          [dependencies]
          rand = "0.8"          # ^0.8 : toute version 0.8.x compatible
          serde = { version = "1", features = ["derive"] }
          regex = "1.10"
          ```

          Ou en ligne de commande : `cargo add rand`.

          Le **versionnage sémantique** (SemVer) `MAJEUR.MINEUR.CORRECTIF` : une version majeure différente peut casser la compatibilité. `Cargo.lock` fige les versions exactes pour des compilations reproductibles.

          > 💡 Sur Codemori, les crates `rand`, `serde`, `serde_json`, `regex` et `tokio` sont pré-installées dans le bac à sable.
      - title: Quelques crates incontournables
        body: |
          ```rust
          use rand::{rngs::StdRng, Rng, SeedableRng};

          let mut rng = StdRng::seed_from_u64(42);   // générateur reproductible
          let de = rng.gen_range(1..=6);
          ```

          ```rust
          use serde_json::{json, Value};

          let v: Value = serde_json::from_str(r#"{"nom": "Kiri", "age": 16}"#).unwrap();
          println!("{}", v["nom"]);                  // "Kiri"
          let j = json!({ "langages": ["Rust", "C++", "Java"] });
          ```

          ```rust
          use regex::Regex;
          let re = Regex::new(r"\d{4}-\d{2}-\d{2}").unwrap();
          assert!(re.is_match("le 2026-11-20"));
          ```

          Autres classiques : `clap` (arguments CLI), `tokio` (asynchrone), `reqwest` (HTTP), `anyhow`/`thiserror` (erreurs), `chrono` (dates).
    exercises:
      - id: rust-crate-q1
        type: mcq
        prompt: Quel fichier est la racine d’une crate bibliothèque ?
        choices: [src/main.rs, src/lib.rs, Cargo.toml, lib/mod.rs]
        answer: 1
      - id: rust-crate-q2
        type: mcq
        prompt: 'Que signifie `rand = "0.8"` dans Cargo.toml ?'
        choices: [Exactement la version 0.8.0, Toute version 0.8.x compatible, La version 8, La dernière version disponible]
        answer: 1
      - id: rust-crate-order
        type: order
        prompt: Remets dans l’ordre les étapes pour utiliser une nouvelle crate.
        lines:
          - Chercher la crate sur crates.io
          - Lire sa documentation sur docs.rs
          - Ajouter la dépendance avec cargo add
          - Importer ses éléments avec use
          - Compiler avec cargo build
      - id: rust-crate-predict
        type: predict
        prompt: Que va afficher ce programme ?
        code: |
          use serde_json::Value;

          fn main() {
              let v: Value = serde_json::from_str(r#"{"nom": "Kiri", "notes": [12, 17, 15]}"#).unwrap();
              let somme: i64 = v["notes"].as_array().unwrap().iter().map(|n| n.as_i64().unwrap()).sum();
              println!("{} {}", v["nom"].as_str().unwrap(), somme);
          }
        output: Kiri 44
      - id: rust-crate-code
        type: code
        title: Extraire des dates avec regex
        prompt: |
          À l’aide de la crate `regex`, extrais toutes les dates au format `AAAA-MM-JJ` du texte lu et affiche-les au format français `JJ/MM/AAAA`, une par ligne, dans l’ordre d’apparition.
        starter: |
          use regex::Regex;
          use std::io::{self, Read};

          fn main() {
              let mut texte = String::new();
              io::stdin().read_to_string(&mut texte).unwrap();
              let re = Regex::new(r"(\d{4})-(\d{2})-(\d{2})").unwrap();
              // re.captures_iter(&texte)
          }
        solution: |
          use regex::Regex;
          use std::io::{self, Read};

          fn main() {
              let mut texte = String::new();
              io::stdin().read_to_string(&mut texte).unwrap();
              let re = Regex::new(r"(\d{4})-(\d{2})-(\d{2})").unwrap();
              for c in re.captures_iter(&texte) {
                  println!("{}/{}/{}", &c[3], &c[2], &c[1]);
              }
          }
        tests:
          - { input: 'Réunion le 2026-11-20, rendu le 2026-12-01.', output: "20/11/2026\n01/12/2026" }
          - { input: "Aucune date ici\nmais 1999-01-31 là", output: 31/01/1999, hidden: true }
        require:
          - { pattern: 'use\s+regex', message: Utiliser la crate regex }
    project:
      id: rust-crate-projet
      type: code
      title: Statistiques JSON
      difficulty: 3
      prompt: |
        L’entrée est un tableau JSON d’élèves : `[{"nom": "...", "notes": [..]}, ...]`.

        Avec `serde_json`, affiche pour chaque élève `nom : moyenne` (1 décimale ; `nom : aucune note` si la liste est vide), puis `Meilleur : nom` (meilleure moyenne, le premier en cas d’égalité, en ignorant les élèves sans note).
      starter: |
        use serde_json::Value;
        use std::io::{self, Read};

        fn main() {
            let mut e = String::new();
            io::stdin().read_to_string(&mut e).unwrap();
            let v: Value = serde_json::from_str(&e).unwrap();
        }
      solution: |
        use serde_json::Value;
        use std::io::{self, Read};

        fn main() {
            let mut e = String::new();
            io::stdin().read_to_string(&mut e).unwrap();
            let v: Value = serde_json::from_str(&e).unwrap();
            let mut meilleur: Option<(String, f64)> = None;
            for eleve in v.as_array().unwrap() {
                let nom = eleve["nom"].as_str().unwrap();
                let notes: Vec<f64> = eleve["notes"].as_array().unwrap().iter().map(|n| n.as_f64().unwrap()).collect();
                if notes.is_empty() {
                    println!("{} : aucune note", nom);
                    continue;
                }
                let moy = notes.iter().sum::<f64>() / notes.len() as f64;
                println!("{} : {:.1}", nom, moy);
                if meilleur.as_ref().map_or(true, |(_, m)| moy > *m) {
                    meilleur = Some((nom.to_string(), moy));
                }
            }
            if let Some((nom, _)) = meilleur {
                println!("Meilleur : {}", nom);
            }
        }
      tests:
        - { input: '[{"nom": "Ada", "notes": [15, 18]}, {"nom": "Bob", "notes": [12]}]', output: "Ada : 16.5\nBob : 12.0\nMeilleur : Ada" }
        - { input: '[{"nom": "Zoé", "notes": []}, {"nom": "Lou", "notes": [10, 10.5]}, {"nom": "Max", "notes": [10.25]}]', output: "Zoé : aucune note\nLou : 10.2\nMax : 10.2\nMeilleur : Lou", hidden: true }
    exam:
      pass: 70
      questions:
        - id: rust-crate-ex1
          type: mcq
          prompt: Quel fichier fige les versions exactes des dépendances ?
          choices: [Cargo.toml, Cargo.lock, rust-toolchain, deps.txt]
          answer: 1
        - id: rust-crate-ex2
          type: mcq
          prompt: Sur quel site sont publiées les crates ?
          choices: [npmjs.com, crates.io, pypi.org, maven.org]
          answer: 1
        - id: rust-crate-ex3
          type: mcq
          prompt: Quelle commande ajoute une dépendance au projet ?
          choices: [cargo install, cargo add, cargo get, rustup add]
          answer: 1
        - id: rust-crate-ex4
          type: mcq
          prompt: En SemVer, que signale un changement de version MAJEURE ?
          choices: [Une correction de bug, Une nouvelle fonctionnalité compatible, Un changement potentiellement incompatible, Rien]
          answer: 2

  # ------------------------------------------------------------------
  - slug: rust-collections
    title: Collections
    summary: Panorama des collections standard (Vec, VecDeque, HashMap, BTreeMap, HashSet, BinaryHeap) et choix de la bonne structure.
    minutes: 30
    concepts: [collections]
    sections:
      - title: Le panorama
        body: |
          | Collection | Usage | Accès typique |
          |---|---|---|
          | `Vec<T>` | liste dynamique | indice O(1), ajout en fin O(1) |
          | `VecDeque<T>` | file à double entrée | ajout/retrait aux deux bouts O(1) |
          | `HashMap<K, V>` | dictionnaire | recherche O(1) moyen |
          | `BTreeMap<K, V>` | dictionnaire **trié** | O(log n), parcours ordonné |
          | `HashSet<T>` / `BTreeSet<T>` | ensemble sans doublons | appartenance O(1) / O(log n) |
          | `BinaryHeap<T>` | file de priorité (max en tête) | sommet O(1), insertion O(log n) |

          Toutes se trouvent dans `std::collections` (sauf `Vec`, présent dans le prélude).
      - title: Exemples
        body: |
          ```rust
          use std::collections::{VecDeque, BTreeMap, HashSet, BinaryHeap};

          let mut file = VecDeque::new();
          file.push_back("a"); file.push_back("b");
          let premier = file.pop_front();         // Some("a")

          let mut tri = BTreeMap::new();
          tri.insert("zèbre", 1); tri.insert("ane", 2);
          for (k, v) in &tri { println!("{k} {v}"); } // ane puis zèbre

          let vus: HashSet<i32> = [3, 1, 3, 2].into_iter().collect(); // {1, 2, 3}
          let mut tas = BinaryHeap::from(vec![4, 9, 1]);
          println!("{:?}", tas.pop());             // Some(9)
          ```

          Pour un tas **min**, on enveloppe les valeurs dans `std::cmp::Reverse`.
      - title: Choisir
        body: |
          - Besoin d’un ordre et d’indices ? → `Vec`.
          - File d’attente (FIFO) ? → `VecDeque`.
          - Associer clé → valeur ? → `HashMap` (ou `BTreeMap` si l’ordre des clés compte).
          - Éliminer des doublons, tester l’appartenance ? → `HashSet`.
          - Toujours traiter l’élément le plus prioritaire ? → `BinaryHeap`.

          Les éléments d’un `HashMap`/`HashSet` doivent implémenter `Eq + Hash` ; ceux d’un `BTreeMap`/`BTreeSet` ou `BinaryHeap`, `Ord`.
    exercises:
      - id: rust-coll-q1
        type: mcq
        prompt: Quelle collection choisir pour une file d’attente (premier arrivé, premier servi) ?
        choices: ['Vec', 'VecDeque', 'HashSet', 'BinaryHeap']
        answer: 1
        concepts: [collections]
      - id: rust-coll-q2
        type: mcq
        prompt: Quelle collection parcourt ses clés dans l’ordre trié ?
        choices: ['HashMap', 'BTreeMap', 'HashSet', 'VecDeque']
        answer: 1
      - id: rust-coll-predict
        type: predict
        prompt: Que va afficher ce programme ?
        code: |
          use std::collections::{BinaryHeap, HashSet, VecDeque};
          use std::cmp::Reverse;

          fn main() {
              let s: HashSet<char> = "mississippi".chars().collect();
              let mut q: VecDeque<i32> = VecDeque::new();
              q.push_back(1); q.push_front(0); q.push_back(2);
              let mut h = BinaryHeap::new();
              for x in [5, 2, 8] { h.push(Reverse(x)); }
              let Reverse(min) = h.pop().unwrap();
              println!("{} {:?} {}", s.len(), q, min);
          }
        output: 4 [0, 1, 2] 2
      - id: rust-coll-code
        type: code
        title: Mots uniques triés
        prompt: |
          Lis un texte et affiche ses mots **uniques** (en minuscules), triés par ordre alphabétique, séparés par des espaces. Utilise un `BTreeSet`.
        starter: |
          use std::collections::BTreeSet;
          use std::io::{self, Read};

          fn main() {
              let mut t = String::new();
              io::stdin().read_to_string(&mut t).unwrap();
          }
        solution: |
          use std::collections::BTreeSet;
          use std::io::{self, Read};

          fn main() {
              let mut t = String::new();
              io::stdin().read_to_string(&mut t).unwrap();
              let mots: BTreeSet<String> = t.split_whitespace().map(|m| m.to_lowercase()).collect();
              let v: Vec<String> = mots.into_iter().collect();
              println!("{}", v.join(" "));
          }
        tests:
          - { input: 'le chat et le Chien et la souris', output: chat chien et la le souris }
