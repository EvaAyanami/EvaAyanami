language: rust
level: 4
chapters:
  # ------------------------------------------------------------------
  - slug: rust-async
    title: Async/Await
    summary: Programmation asynchrone avec async fn, .await et le runtime tokio — tâches, join!, select! et temporisations.
    minutes: 35
    concepts: [async]
    sections:
      - title: Pourquoi l’asynchrone ?
        body: |
          Un serveur qui gère 10 000 connexions ne peut pas créer 10 000 threads système (mémoire, changements de contexte). L’**asynchrone** permet à quelques threads de gérer des milliers de tâches qui passent leur temps à **attendre** (réseau, disque, minuteries).

          ```rust
          async fn telecharger(id: u32) -> String {
              // ... attente réseau ...
              format!("page {id}")
          }
          ```

          Une `async fn` ne s’exécute pas immédiatement : elle renvoie un **Future**, une valeur qui représente un calcul **à venir**. Il faut l’`.await`er dans un contexte asynchrone, et un **runtime** (comme `tokio`) pour faire avancer les futures.
      - title: tokio en pratique
        body: |
          ```rust
          use tokio::time::{sleep, Duration};

          async fn tache(nom: &str, ms: u64) -> String {
              sleep(Duration::from_millis(ms)).await;   // n’occupe PAS le thread
              format!("{nom} terminée")
          }

          #[tokio::main]
          async fn main() {
              // Séquentiel : ~300 ms
              let a = tache("A", 100).await;
              let b = tache("B", 200).await;

              // Concurrent : ~200 ms
              let (c, d) = tokio::join!(tache("C", 100), tache("D", 200));

              // Tâche indépendante (comme un thread léger)
              let h = tokio::spawn(async { 21 * 2 });
              println!("{a} {b} {c} {d} {}", h.await.unwrap());
          }
          ```

          `tokio::select!` attend **la première** de plusieurs futures (utile pour les délais : `tokio::time::timeout`).
      - title: Pièges classiques
        body: |
          - **Ne jamais bloquer** dans du code async (`std::thread::sleep`, calcul lourd, I/O bloquante) : cela gèle tout le runtime. Utilise `tokio::time::sleep`, `tokio::fs`, ou `tokio::task::spawn_blocking` pour le calcul lourd.
          - `.await` n’est possible que dans une fonction ou un bloc `async`.
          - Les données partagées entre tâches : `Arc<tokio::sync::Mutex<T>>` (un mutex qui peut être tenu à travers un `.await`), canaux `tokio::sync::mpsc`.
          - Une future non `.await`ée ne fait **rien**.

          > 💡 tokio est pré-installé dans le bac à sable Codemori.
    exercises:
      - id: rust-async-q1
        type: mcq
        prompt: Que renvoie l’appel d’une `async fn` sans `.await` ?
        choices: [Le résultat calculé, Une Future qui ne s’exécute pas encore, Un thread, Une erreur]
        answer: 1
        concepts: [async]
      - id: rust-async-q2
        type: mcq
        prompt: Pourquoi éviter `std::thread::sleep` dans une tâche async ?
        choices: [Il bloque le thread du runtime et gèle les autres tâches, Il est trop précis, Il ne compile pas, Il consomme de la mémoire]
        answer: 0
      - id: rust-async-predict
        type: predict
        prompt: Que va afficher ce programme ?
        code: |
          async fn carre(x: u32) -> u32 { x * x }

          #[tokio::main]
          async fn main() {
              let (a, b) = tokio::join!(carre(3), carre(4));
              let h = tokio::spawn(async move { a + b });
              println!("{}", h.await.unwrap());
          }
        output: '25'
      - id: rust-async-fill
        type: fill
        prompt: Complète pour attendre le résultat de la tâche.
        code: |
          async fn salut() -> &'static str { "bonjour" }

          #[tokio::main]
          async fn main() {
              let s = salut().{{?}};
              println!("{}", s);
          }
        blanks: [[await]]
        tests:
          - { input: '', output: bonjour }
      - id: rust-async-code
        type: code
        title: Téléchargements simultanés
        prompt: |
          Chaque ligne d’entrée contient `nom durée_ms`. Simule un téléchargement par ligne avec `tokio::time::sleep`, en lançant **toutes** les tâches en parallèle avec `tokio::spawn`.

          Chaque tâche renvoie `(nom, durée)`. Affiche les noms **dans l’ordre de fin** (le plus rapide d’abord ; les durées sont toutes différentes et espacées d’au moins 30 ms), puis `durée totale ≈ max` (la plus grande durée).

          Astuce : envoie chaque résultat dans un canal `tokio::sync::mpsc` dès que la tâche se termine.
        starter: |
          use std::io::{self, Read};
          use tokio::sync::mpsc;
          use tokio::time::{sleep, Duration};

          #[tokio::main]
          async fn main() {
              let mut e = String::new();
              io::stdin().read_to_string(&mut e).unwrap();
          }
        solution: |
          use std::io::{self, Read};
          use tokio::sync::mpsc;
          use tokio::time::{sleep, Duration};

          #[tokio::main]
          async fn main() {
              let mut e = String::new();
              io::stdin().read_to_string(&mut e).unwrap();
              let (tx, mut rx) = mpsc::channel::<(String, u64)>(100);
              for l in e.lines() {
                  let p: Vec<&str> = l.split_whitespace().collect();
                  let nom = p[0].to_string();
                  let ms: u64 = p[1].parse().unwrap();
                  let tx = tx.clone();
                  tokio::spawn(async move {
                      sleep(Duration::from_millis(ms)).await;
                      tx.send((nom, ms)).await.unwrap();
                  });
              }
              drop(tx);
              let mut max = 0;
              while let Some((nom, ms)) = rx.recv().await {
                  println!("{}", nom);
                  max = max.max(ms);
              }
              println!("durée totale ≈ {}", max);
          }
        tests:
          - { input: "image.png 120\npage.html 30\nstyle.css 80", output: "page.html\nstyle.css\nimage.png\ndurée totale ≈ 120" }
          - { input: "a 200\nb 100", output: "b\na\ndurée totale ≈ 200", hidden: true }
        require:
          - { pattern: 'tokio::spawn', message: Lancer les tâches avec tokio::spawn }
        concepts: [async]
    project:
      id: rust-async-projet
      type: code
      title: Délai d’expiration
      difficulty: 3
      prompt: |
        Chaque ligne contient `nom durée_ms limite_ms`. Pour chaque requête simulée (un `sleep` de `durée_ms`), utilise `tokio::time::timeout` avec `limite_ms` :

        - si la requête se termine à temps, affiche `nom : OK` ;
        - sinon `nom : expirée`.

        Les requêtes sont traitées **concurremment** avec `futures`… sans crate supplémentaire : lance-les avec `tokio::spawn`, garde les `JoinHandle` dans un `Vec` et attends-les **dans l’ordre des lignes** pour l’affichage. Termine par `réussies : X/N`.
      starter: |
        use std::io::{self, Read};
        use tokio::time::{sleep, timeout, Duration};

        #[tokio::main]
        async fn main() {
            let mut e = String::new();
            io::stdin().read_to_string(&mut e).unwrap();
        }
      solution: |
        use std::io::{self, Read};
        use tokio::time::{sleep, timeout, Duration};

        #[tokio::main]
        async fn main() {
            let mut e = String::new();
            io::stdin().read_to_string(&mut e).unwrap();
            let mut handles = vec![];
            for l in e.lines() {
                let p: Vec<&str> = l.split_whitespace().collect();
                let nom = p[0].to_string();
                let duree: u64 = p[1].parse().unwrap();
                let limite: u64 = p[2].parse().unwrap();
                handles.push(tokio::spawn(async move {
                    let ok = timeout(Duration::from_millis(limite), sleep(Duration::from_millis(duree))).await.is_ok();
                    (nom, ok)
                }));
            }
            let n = handles.len();
            let mut reussies = 0;
            for h in handles {
                let (nom, ok) = h.await.unwrap();
                if ok { reussies += 1; }
                println!("{} : {}", nom, if ok { "OK" } else { "expirée" });
            }
            println!("réussies : {}/{}", reussies, n);
        }
      tests:
        - { input: "api 50 200\nbdd 300 100\ncache 10 100", output: "api : OK\nbdd : expirée\ncache : OK\nréussies : 2/3" }
        - { input: "lent 400 50", output: "lent : expirée\nréussies : 0/1", hidden: true }
    exam:
      pass: 70
      questions:
        - id: rust-async-ex1
          type: mcq
          prompt: Que fait `tokio::join!(a, b)` ?
          choices: [Exécute a puis b séquentiellement, Attend a et b concurremment et renvoie leurs résultats, Crée deux threads système, Annule b si a échoue]
          answer: 1
        - id: rust-async-ex2
          type: mcq
          prompt: Pour un calcul CPU lourd dans un programme tokio, on utilise…
          choices: ['tokio::task::spawn_blocking', 'tokio::time::sleep', 'async move', 'select!']
          answer: 0
        - id: rust-async-ex3
          type: mcq
          prompt: Quel attribut transforme main en point d’entrée asynchrone ?
          choices: ['#[async]', '#[tokio::main]', '#[await]', '#[runtime]']
          answer: 1
        - id: rust-async-ex4
          type: mcq
          prompt: Quel est l’intérêt principal de l’asynchrone ?
          choices: [Gérer de très nombreuses attentes d’E/S avec peu de threads, Accélérer les calculs mathématiques, Remplacer les traits, Éviter le borrow checker]
          answer: 0

  # ------------------------------------------------------------------
  - slug: rust-futures
    title: Futures
    summary: Sous le capot de async — le trait Future, Poll, Waker, Pin, et l’écriture d’un mini exécuteur.
    minutes: 35
    concepts: [async]
    sections:
      - title: Le trait Future
        body: |
          ```rust
          pub trait Future {
              type Output;
              fn poll(self: Pin<&mut Self>, cx: &mut Context<'_>) -> Poll<Self::Output>;
          }

          pub enum Poll<T> { Ready(T), Pending }
          ```

          L’exécuteur appelle `poll` :

          - `Poll::Ready(v)` : terminé ;
          - `Poll::Pending` : pas encore prêt. La future doit alors s’arranger pour appeler `cx.waker().wake()` quand elle pourra progresser — l’exécuteur la re-pollera.

          Le compilateur transforme chaque `async fn` en **machine à états** qui implémente `Future` : chaque `.await` est un point de suspension.
      - title: Écrire une future à la main
        body: |
          ```rust
          use std::future::Future;
          use std::pin::Pin;
          use std::task::{Context, Poll};

          struct Compte { restant: u32 }

          impl Future for Compte {
              type Output = &'static str;
              fn poll(mut self: Pin<&mut Self>, cx: &mut Context<'_>) -> Poll<Self::Output> {
                  if self.restant == 0 {
                      Poll::Ready("décollage !")
                  } else {
                      self.restant -= 1;
                      cx.waker().wake_by_ref();   // « re-polle-moi »
                      Poll::Pending
                  }
              }
          }
          ```

          **Pin** garantit que la future ne sera plus déplacée en mémoire une fois pollée : indispensable car les machines à états générées peuvent contenir des références vers leurs propres champs.
      - title: Un mini exécuteur
        body: |
          ```rust
          use std::task::Waker;

          fn bloquer_sur<F: Future>(fut: F) -> F::Output {
              let mut fut = Box::pin(fut);
              let mut cx = Context::from_waker(Waker::noop());
              loop {
                  if let Poll::Ready(v) = fut.as_mut().poll(&mut cx) {
                      return v;
                  }
              }
          }
          ```

          Cet exécuteur « actif » boucle sans arrêt : un vrai runtime (tokio) met les tâches en attente et ne les re-polle que lorsque leur `Waker` est réveillé par un événement (socket prête, minuterie écoulée…).
    exercises:
      - id: rust-fut-q1
        type: mcq
        prompt: Que signifie `Poll::Pending` ?
        choices: [La future a échoué, La future n’est pas encore prête, La future est annulée, Le résultat est vide]
        answer: 1
        concepts: [async]
      - id: rust-fut-q2
        type: mcq
        prompt: À quoi sert le Waker ?
        choices: [À signaler à l’exécuteur qu’une future peut progresser, À réveiller l’ordinateur, À annuler une tâche, À libérer la mémoire]
        answer: 0
      - id: rust-fut-q3
        type: mcq
        prompt: En quoi le compilateur transforme-t-il une async fn ?
        choices: [En thread, En machine à états implémentant Future, En closure FnOnce, En macro]
        answer: 1
      - id: rust-fut-predict
        type: predict
        prompt: Que va afficher ce programme ?
        code: |
          use std::future::Future;
          use std::pin::Pin;
          use std::task::{Context, Poll, Waker};

          struct Compte { restant: u32, polls: u32 }
          impl Future for Compte {
              type Output = u32;
              fn poll(mut self: Pin<&mut Self>, cx: &mut Context<'_>) -> Poll<u32> {
                  self.polls += 1;
                  if self.restant == 0 { Poll::Ready(self.polls) }
                  else { self.restant -= 1; cx.waker().wake_by_ref(); Poll::Pending }
              }
          }

          fn bloquer_sur<F: Future>(f: F) -> F::Output {
              let mut f = Box::pin(f);
              let mut cx = Context::from_waker(Waker::noop());
              loop { if let Poll::Ready(v) = f.as_mut().poll(&mut cx) { return v; } }
          }

          fn main() {
              println!("{}", bloquer_sur(Compte { restant: 3, polls: 0 }));
              println!("{}", bloquer_sur(async { 40 + 2 }));
          }
        output: "4\n42"
      - id: rust-fut-code
        type: code
        title: Exécuteur à tour de rôle
        prompt: |
          Écris un exécuteur **coopératif** qui fait progresser plusieurs futures à tour de rôle.

          On te donne la future `Travail { nom, etapes }` : à chaque `poll`, elle affiche `nom étape i` puis renvoie `Pending`, jusqu’à avoir effectué toutes ses étapes ; elle renvoie alors `Ready(nom)`.

          Écris `fn executer(taches: Vec<Pin<Box<dyn Future<Output = String>>>>)` qui polle les tâches **en tourniquet** (round-robin, dans l’ordre) jusqu’à ce que toutes soient finies, et affiche `fin de nom` dès qu’une tâche se termine.

          Chaque ligne d’entrée : `nom etapes`.
        starter: |
          use std::future::Future;
          use std::io::{self, Read};
          use std::pin::Pin;
          use std::task::{Context, Poll, Waker};

          struct Travail { nom: String, etapes: u32, fait: u32 }

          impl Future for Travail {
              type Output = String;
              fn poll(mut self: Pin<&mut Self>, _cx: &mut Context<'_>) -> Poll<String> {
                  if self.fait == self.etapes {
                      return Poll::Ready(self.nom.clone());
                  }
                  self.fait += 1;
                  println!("{} étape {}", self.nom, self.fait);
                  Poll::Pending
              }
          }

          fn executer(taches: Vec<Pin<Box<dyn Future<Output = String>>>>) {
              todo!()
          }

          fn main() {
              let mut e = String::new();
              io::stdin().read_to_string(&mut e).unwrap();
              let taches: Vec<Pin<Box<dyn Future<Output = String>>>> = e
                  .lines()
                  .map(|l| {
                      let p: Vec<&str> = l.split_whitespace().collect();
                      Box::pin(Travail { nom: p[0].to_string(), etapes: p[1].parse().unwrap(), fait: 0 }) as Pin<Box<dyn Future<Output = String>>>
                  })
                  .collect();
              executer(taches);
          }
        solution: |
          use std::future::Future;
          use std::io::{self, Read};
          use std::pin::Pin;
          use std::task::{Context, Poll, Waker};

          struct Travail { nom: String, etapes: u32, fait: u32 }

          impl Future for Travail {
              type Output = String;
              fn poll(mut self: Pin<&mut Self>, _cx: &mut Context<'_>) -> Poll<String> {
                  if self.fait == self.etapes {
                      return Poll::Ready(self.nom.clone());
                  }
                  self.fait += 1;
                  println!("{} étape {}", self.nom, self.fait);
                  Poll::Pending
              }
          }

          fn executer(mut taches: Vec<Pin<Box<dyn Future<Output = String>>>>) {
              let mut cx = Context::from_waker(Waker::noop());
              while !taches.is_empty() {
                  let mut restantes = Vec::new();
                  for mut t in taches {
                      match t.as_mut().poll(&mut cx) {
                          Poll::Ready(nom) => println!("fin de {}", nom),
                          Poll::Pending => restantes.push(t),
                      }
                  }
                  taches = restantes;
              }
          }

          fn main() {
              let mut e = String::new();
              io::stdin().read_to_string(&mut e).unwrap();
              let taches: Vec<Pin<Box<dyn Future<Output = String>>>> = e
                  .lines()
                  .map(|l| {
                      let p: Vec<&str> = l.split_whitespace().collect();
                      Box::pin(Travail { nom: p[0].to_string(), etapes: p[1].parse().unwrap(), fait: 0 }) as Pin<Box<dyn Future<Output = String>>>
                  })
                  .collect();
              executer(taches);
          }
        tests:
          - { input: "A 2\nB 1", output: "A étape 1\nB étape 1\nA étape 2\nfin de B\nfin de A" }
          - { input: "X 0\nY 3", output: "fin de X\nY étape 1\nY étape 2\nY étape 3\nfin de Y", hidden: true }
        concepts: [async]
    project:
      id: rust-fut-projet
      type: code
      title: Minuterie maison
      difficulty: 3
      prompt: |
        Crée une future `Minuterie { tics: u32 }` qui devient prête après avoir été pollée `tics` fois (elle réveille son waker à chaque `Pending`), puis un exécuteur `bloquer_sur` comme dans le cours.

        Écris ensuite une `async fn etape(nom: &str, tics: u32) -> u32` qui attend une `Minuterie` puis affiche `nom prête`, et renvoie `tics`.

        Chaque ligne d’entrée est `nom tics`. Dans un seul bloc `async` exécuté par `bloquer_sur`, attends chaque étape **séquentiellement** dans l’ordre, puis affiche `total : <somme des tics>`.
      starter: |
        use std::future::Future;
        use std::io::{self, Read};
        use std::pin::Pin;
        use std::task::{Context, Poll, Waker};

        fn main() {
            let mut e = String::new();
            io::stdin().read_to_string(&mut e).unwrap();
        }
      solution: |
        use std::future::Future;
        use std::io::{self, Read};
        use std::pin::Pin;
        use std::task::{Context, Poll, Waker};

        struct Minuterie { tics: u32 }

        impl Future for Minuterie {
            type Output = ();
            fn poll(mut self: Pin<&mut Self>, cx: &mut Context<'_>) -> Poll<()> {
                if self.tics == 0 {
                    Poll::Ready(())
                } else {
                    self.tics -= 1;
                    cx.waker().wake_by_ref();
                    Poll::Pending
                }
            }
        }

        fn bloquer_sur<F: Future>(f: F) -> F::Output {
            let mut f = Box::pin(f);
            let mut cx = Context::from_waker(Waker::noop());
            loop {
                if let Poll::Ready(v) = f.as_mut().poll(&mut cx) {
                    return v;
                }
            }
        }

        async fn etape(nom: &str, tics: u32) -> u32 {
            Minuterie { tics }.await;
            println!("{} prête", nom);
            tics
        }

        fn main() {
            let mut e = String::new();
            io::stdin().read_to_string(&mut e).unwrap();
            let total = bloquer_sur(async {
                let mut t = 0;
                for l in e.lines() {
                    let p: Vec<&str> = l.split_whitespace().collect();
                    t += etape(p[0], p[1].parse().unwrap()).await;
                }
                t
            });
            println!("total : {}", total);
        }
      tests:
        - { input: "chargement 3\ncalcul 5", output: "chargement prête\ncalcul prête\ntotal : 8" }
        - { input: 'instantané 0', output: "instantané prête\ntotal : 0", hidden: true }
      require:
        - { pattern: 'impl\s+Future\s+for\s+Minuterie', message: Implémenter Future pour Minuterie }
    exam:
      pass: 70
      questions:
        - id: rust-fut-ex1
          type: mcq
          prompt: Pourquoi la méthode poll reçoit-elle `Pin<&mut Self>` ?
          choices: [Pour garantir que la future ne sera plus déplacée en mémoire, Pour la rendre thread-safe, Pour la copier, Pour l’annuler]
          answer: 0
        - id: rust-fut-ex2
          type: mcq
          prompt: Que fait un runtime comme tokio quand une future renvoie Pending ?
          choices: [Il la re-polle immédiatement en boucle, Il attend que son Waker soit réveillé avant de la re-poller, Il l’abandonne, Il crée un thread]
          answer: 1
        - id: rust-fut-ex3
          type: mcq
          prompt: Que représente chaque .await dans la machine à états générée ?
          choices: [Un point de suspension possible, Un nouveau thread, Une allocation, Un verrou]
          answer: 0
        - id: rust-fut-ex4
          type: fill
          prompt: Complète la variante qui signale que la future est terminée.
          code: 'return Poll::{{?}}(valeur);'
          blanks: [[Ready]]

  # ------------------------------------------------------------------
  - slug: rust-macros
    title: Macros
    summary: Écris des macros déclaratives avec macro_rules! — motifs, répétitions, récursion — et découvre les macros procédurales.
    minutes: 30
    concepts: [macros]
    sections:
      - title: macro_rules!
        body: |
          Une macro **génère du code** à la compilation, à partir de motifs sur la syntaxe :

          ```rust
          macro_rules! carre {
              ($x:expr) => { $x * $x };
          }

          macro_rules! maximum {
              ($a:expr) => { $a };
              ($a:expr, $($reste:expr),+) => {{
                  let r = maximum!($($reste),+);   // récursion
                  if $a > r { $a } else { r }
              }};
          }

          println!("{}", carre!(7));             // 49
          println!("{}", maximum!(3, 9, 4));     // 9
          ```

          Fragments courants : `expr` (expression), `ident` (identifiant), `ty` (type), `tt` (jeton), `literal`, `pat` (motif), `block`.
      - title: Répétitions
        body: |
          `$( ... ),*` répète un motif zéro ou plusieurs fois (séparé par des virgules), `+` au moins une fois :

          ```rust
          macro_rules! dict {
              ($($cle:expr => $val:expr),* $(,)?) => {{
                  let mut m = std::collections::HashMap::new();
                  $( m.insert($cle, $val); )*
                  m
              }};
          }
          let notes = dict! { "Ada" => 18, "Bob" => 12 };
          ```

          C’est ainsi que fonctionne `vec![1, 2, 3]` !

          Les macros sont **hygiéniques** : les variables créées à l’intérieur ne se mélangent pas avec celles du code appelant.
      - title: Macros procédurales
        body: |
          Les **macros procédurales** sont des fonctions Rust qui manipulent un flux de jetons (`TokenStream`). Elles vivent dans une crate dédiée (`proc-macro = true`) :

          - `#[derive(MonTrait)]` : dérive une implémentation (comme `Serialize` de serde) ;
          - `#[mon_attribut]` : transforme un élément (comme `#[tokio::main]`) ;
          - `ma_macro!(...)` de type fonction (comme `sqlx::query!`).

          Elles s’écrivent avec les crates `syn` (analyse) et `quote` (génération). `cargo expand` montre le code généré.

          > ⚠️ Préfère une fonction ou un générique quand c’est possible : les macros sont plus difficiles à lire et à déboguer.
    exercises:
      - id: rust-mac-predict
        type: predict
        prompt: Que va afficher ce programme ?
        code: |
          macro_rules! somme {
              () => { 0 };
              ($x:expr $(, $reste:expr)*) => { $x + somme!($($reste),*) };
