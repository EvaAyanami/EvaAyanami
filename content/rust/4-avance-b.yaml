      - id: rust-mac-code
        type: code
        title: Macro de getters
        prompt: |
          Écris une macro `point!` qui génère une struct avec des champs `f64` et une méthode `norme(&self) -> f64` (racine de la somme des carrés) :

          ```rust
          point!(Point2 { x, y });
          point!(Point3 { x, y, z });
          ```

          Le programme lit des lignes de 2 ou 3 nombres et affiche la norme avec 2 décimales.
        starter: |
          use std::io::{self, Read};

          // macro_rules! point { ... }

          point!(Point2 { x, y });
          point!(Point3 { x, y, z });

          fn main() {
              let mut e = String::new();
              io::stdin().read_to_string(&mut e).unwrap();
              for l in e.lines() {
                  let v: Vec<f64> = l.split_whitespace().map(|x| x.parse().unwrap()).collect();
                  let n = if v.len() == 2 { Point2 { x: v[0], y: v[1] }.norme() } else { Point3 { x: v[0], y: v[1], z: v[2] }.norme() };
                  println!("{:.2}", n);
              }
          }
        solution: |
          use std::io::{self, Read};

          macro_rules! point {
              ($nom:ident { $($champ:ident),+ }) => {
                  struct $nom { $($champ: f64),+ }
                  impl $nom {
                      fn norme(&self) -> f64 {
                          (0.0 $(+ self.$champ * self.$champ)+).sqrt()
                      }
                  }
              };
          }

          point!(Point2 { x, y });
          point!(Point3 { x, y, z });

          fn main() {
              let mut e = String::new();
              io::stdin().read_to_string(&mut e).unwrap();
              for l in e.lines() {
                  let v: Vec<f64> = l.split_whitespace().map(|x| x.parse().unwrap()).collect();
                  let n = if v.len() == 2 { Point2 { x: v[0], y: v[1] }.norme() } else { Point3 { x: v[0], y: v[1], z: v[2] }.norme() };
                  println!("{:.2}", n);
              }
          }
        tests:
          - { input: "3 4\n1 2 2", output: "5.00\n3.00" }
          - { input: "0 0 0\n1 1", output: "0.00\n1.41", hidden: true }
        require:
          - { pattern: 'macro_rules!\s*point', message: Définir la macro point! }
        concepts: [macros]
    project:
      id: rust-mac-projet
      type: code
      title: Mini langage de tests
      difficulty: 3
      prompt: |
        Écris une macro `verifier!` qui prend une liste de cas `nom: expression_obtenue => attendu;` et génère, pour chacun, l’affichage `✔ nom` ou `✘ nom (obtenu X, attendu Y)`, puis un récapitulatif `R/N réussis`.

        Le `main` (fourni) l’utilise sur des fonctions que tu dois écrire : `pgcd(a, b)` et `inverse(s: &str) -> String`. Lis deux entiers `a b` et un mot `m` sur l’entrée pour construire les cas.
      starter: |
        use std::io::{self, Read};

        fn pgcd(a: u64, b: u64) -> u64 { todo!() }
        fn inverse(s: &str) -> String { todo!() }

        // macro_rules! verifier { ... }

        fn main() {
            let mut e = String::new();
            io::stdin().read_to_string(&mut e).unwrap();
            let p: Vec<&str> = e.split_whitespace().collect();
            let a: u64 = p[0].parse().unwrap();
            let b: u64 = p[1].parse().unwrap();
            let m = p[2];
            verifier! {
                pgcd_commutatif: pgcd(a, b) => pgcd(b, a);
                pgcd_divise_a: a % pgcd(a, b) => 0;
                double_inversion: inverse(&inverse(m)) => m.to_string();
                inversion_simple: inverse("abc") => String::from("cba");
            }
        }
      solution: |
        use std::io::{self, Read};

        fn pgcd(a: u64, b: u64) -> u64 {
            if b == 0 { a } else { pgcd(b, a % b) }
        }
        fn inverse(s: &str) -> String {
            s.chars().rev().collect()
        }

        macro_rules! verifier {
            ($($nom:ident : $obtenu:expr => $attendu:expr;)+) => {{
                let mut reussis = 0;
                let mut total = 0;
                $(
                    total += 1;
                    let o = $obtenu;
                    let a = $attendu;
                    if o == a {
                        reussis += 1;
                        println!("✔ {}", stringify!($nom));
                    } else {
                        println!("✘ {} (obtenu {:?}, attendu {:?})", stringify!($nom), o, a);
                    }
                )+
                println!("{}/{} réussis", reussis, total);
            }};
        }

        fn main() {
            let mut e = String::new();
            io::stdin().read_to_string(&mut e).unwrap();
            let p: Vec<&str> = e.split_whitespace().collect();
            let a: u64 = p[0].parse().unwrap();
            let b: u64 = p[1].parse().unwrap();
            let m = p[2];
            verifier! {
                pgcd_commutatif: pgcd(a, b) => pgcd(b, a);
                pgcd_divise_a: a % pgcd(a, b) => 0;
                double_inversion: inverse(&inverse(m)) => m.to_string();
                inversion_simple: inverse("abc") => String::from("cba");
            }
        }
      tests:
        - { input: '12 18 kiri', output: "✔ pgcd_commutatif\n✔ pgcd_divise_a\n✔ double_inversion\n✔ inversion_simple\n4/4 réussis" }
        - { input: '7 0 été', output: "✔ pgcd_commutatif\n✔ pgcd_divise_a\n✔ double_inversion\n✔ inversion_simple\n4/4 réussis", hidden: true }
      hints: ['`stringify!($nom)` transforme un identifiant en chaîne.']
    exam:
      pass: 70
      questions:
        - id: rust-mac-ex1
          type: mcq
          prompt: Quand une macro est-elle développée ?
          choices: [À la compilation, À l’exécution, Au chargement du programme, Jamais]
          answer: 0
        - id: rust-mac-ex2
          type: mcq
          prompt: Que signifie qu’une macro_rules! est « hygiénique » ?
          choices: [Ses variables internes ne se mélangent pas avec celles de l’appelant, Elle est sans bug, Elle ne génère pas de code, Elle libère la mémoire]
          answer: 0
        - id: rust-mac-ex3
          type: mcq
          prompt: '`#[derive(Serialize)]` est une macro…'
          choices: [déclarative, procédurale de type derive, du préprocesseur C, inexistante]
          answer: 1
        - id: rust-mac-ex4
          type: predict
          prompt: Que va afficher ce programme ?
          code: |
            macro_rules! repete {
                ($s:expr; $n:expr) => { $s.repeat($n) };
            }
            fn main() {
                println!("{}", repete!("ab"; 3));
            }
          output: ababab

  # ------------------------------------------------------------------
  - slug: rust-unsafe
    title: Unsafe Rust
    summary: Les cinq super-pouvoirs d’unsafe, pointeurs bruts, FFI, invariants de sûreté et comment encapsuler du code unsafe dans une API sûre.
    minutes: 30
    concepts: [unsafe, pointeurs]
    sections:
      - title: Les super-pouvoirs
        body: |
          Un bloc `unsafe` autorise cinq opérations que le compilateur ne peut pas vérifier :

          1. déréférencer un **pointeur brut** (`*const T`, `*mut T`) ;
          2. appeler une fonction `unsafe` (dont FFI : fonctions C) ;
          3. accéder ou modifier une variable `static mut` ;
          4. implémenter un trait `unsafe` (`Send`, `Sync` manuellement) ;
          5. accéder aux champs d’une `union`.

          `unsafe` **ne désactive pas** le borrow checker ni les vérifications de types : il transfère simplement au programmeur la responsabilité de certaines garanties.
      - title: Pointeurs bruts
        body: |
          ```rust
          let mut x = 10;
          let p = &mut x as *mut i32;    // créer un pointeur brut est sûr
          unsafe {
              *p += 1;                    // le déréférencer ne l’est pas
          }
          println!("{x}");                // 11

          let v = [1, 2, 3, 4];
          let ptr = v.as_ptr();
          let troisieme = unsafe { *ptr.add(2) };   // arithmétique de pointeurs
          ```

          Un pointeur brut peut être nul, pendant ou mal aligné : le déréférencer dans ces cas est un **comportement indéfini** (UB).
      - title: Encapsuler l’unsafe
        body: |
          La bonne pratique : un petit noyau `unsafe` bien documenté derrière une **API sûre**.

          ```rust
          /// Sépare une tranche en deux parties mutables disjointes.
          fn couper_en_deux(t: &mut [i32], milieu: usize) -> (&mut [i32], &mut [i32]) {
              let n = t.len();
              assert!(milieu <= n);                    // garantit l’invariant
              let p = t.as_mut_ptr();
              // SAFETY : [0, milieu) et [milieu, n) ne se chevauchent pas
              // et sont dans les limites grâce à l’assert.
              unsafe {
                  (std::slice::from_raw_parts_mut(p, milieu),
                   std::slice::from_raw_parts_mut(p.add(milieu), n - milieu))
              }
          }
          ```

          Convention : un commentaire `// SAFETY:` justifie chaque bloc. Outils : **Miri** (`cargo +nightly miri test`) détecte de nombreux UB.

          FFI : `extern "C" { fn abs(x: i32) -> i32; }` puis `unsafe { abs(-3) }`.
    exercises:
      - id: rust-unsafe-q1
        type: mcq
        prompt: Que désactive un bloc unsafe ?
        choices: [Le borrow checker, Rien — il autorise seulement quelques opérations supplémentaires, Toutes les vérifications de types, Les paniques]
        answer: 1
        concepts: [unsafe]
      - id: rust-unsafe-q2
        type: mcq
        prompt: Laquelle de ces opérations exige unsafe ?
        choices: [Créer un pointeur brut, Déréférencer un pointeur brut, Utiliser Box, Appeler une closure]
        answer: 1
      - id: rust-unsafe-predict
        type: predict
        prompt: Que va afficher ce programme ?
        code: |
          fn main() {
              let mut tab = [1, 2, 3, 4, 5];
              let p = tab.as_mut_ptr();
              unsafe {
                  *p.add(1) = 20;
                  *p.add(4) += *p;
              }
              println!("{:?}", tab);
          }
        output: '[1, 20, 3, 4, 6]'
      - id: rust-unsafe-fill
        type: fill
        prompt: Complète la déclaration d’une fonction C de la libc.
        code: |
          extern "C" {
              fn abs(x: i32) -> i32;
          }
          fn main() {
              let r = {{?}} { abs(-42) };
              println!("{}", r);
          }
        blanks: [[unsafe]]
        tests:
          - { input: '', output: '42' }
      - id: rust-unsafe-code
        type: code
        title: Inversion par pointeurs
        prompt: |
          Écris `fn inverser(t: &mut [i32])` qui inverse la tranche **en utilisant des pointeurs bruts** (`as_mut_ptr`, `add`, `std::ptr::swap`) dans un bloc `unsafe` commenté par `// SAFETY:`.

          L’API reste sûre : la fonction prend une `&mut [i32]`. Le programme lit des entiers et affiche le résultat.
        starter: |
          use std::io;

          fn inverser(t: &mut [i32]) {
              todo!()
          }

          fn main() {
              let mut s = String::new();
              io::stdin().read_line(&mut s).unwrap();
              let mut v: Vec<i32> = s.split_whitespace().map(|x| x.parse().unwrap()).collect();
              inverser(&mut v);
              println!("{:?}", v);
          }
        solution: |
          use std::io;

          fn inverser(t: &mut [i32]) {
              let n = t.len();
              let p = t.as_mut_ptr();
              for i in 0..n / 2 {
                  // SAFETY : i et n-1-i sont des indices distincts dans [0, n).
                  unsafe {
                      std::ptr::swap(p.add(i), p.add(n - 1 - i));
                  }
              }
          }

          fn main() {
              let mut s = String::new();
              io::stdin().read_line(&mut s).unwrap();
              let mut v: Vec<i32> = s.split_whitespace().map(|x| x.parse().unwrap()).collect();
              inverser(&mut v);
              println!("{:?}", v);
          }
        tests:
          - { input: '1 2 3 4 5', output: '[5, 4, 3, 2, 1]' }
          - { input: '', output: '[]', hidden: true }
          - { input: '7 8', output: '[8, 7]', hidden: true }
        require:
          - { pattern: '\bunsafe\b', message: Utiliser un bloc unsafe }
          - { pattern: 'SAFETY', message: 'Justifier le bloc avec un commentaire // SAFETY:' }
        concepts: [unsafe]
    project:
      id: rust-unsafe-projet
      type: code
      title: Tampon circulaire bas niveau
      difficulty: 3
      prompt: |
        Implémente `struct Anneau { tampon: Vec<i32>, tete: usize, longueur: usize }` (capacité fixe) avec :

        - `pousser(&mut self, x: i32)` : si plein, écrase l’élément le plus ancien ;
        - `extraire(&mut self) -> Option<i32>` : retire le plus ancien ;
        - accès internes par pointeurs bruts (`as_ptr`/`as_mut_ptr` + `add`) dans des blocs `unsafe` justifiés, mais une API publique entièrement sûre.

        Première ligne : la capacité. Lignes suivantes : `+ x` (pousser) ou `-` (extraire, affiche la valeur ou `vide`). Termine en affichant le contenu restant du plus ancien au plus récent (`[a, b, …]`).
      starter: |
        use std::io::{self, Read};

        fn main() {
            let mut e = String::new();
            io::stdin().read_to_string(&mut e).unwrap();
        }
      solution: |
        use std::io::{self, Read};

        struct Anneau {
            tampon: Vec<i32>,
            tete: usize,
            longueur: usize,
        }

        impl Anneau {
            fn new(cap: usize) -> Self {
                Anneau { tampon: vec![0; cap], tete: 0, longueur: 0 }
            }
            fn pousser(&mut self, x: i32) {
                let cap = self.tampon.len();
                let pos = (self.tete + self.longueur) % cap;
                // SAFETY : pos < cap = longueur du tampon.
                unsafe { *self.tampon.as_mut_ptr().add(pos) = x; }
                if self.longueur == cap {
                    self.tete = (self.tete + 1) % cap;
                } else {
                    self.longueur += 1;
                }
            }
            fn extraire(&mut self) -> Option<i32> {
                if self.longueur == 0 {
                    return None;
                }
                // SAFETY : tete < cap.
                let v = unsafe { *self.tampon.as_ptr().add(self.tete) };
                self.tete = (self.tete + 1) % self.tampon.len();
                self.longueur -= 1;
                Some(v)
            }
            fn contenu(&self) -> Vec<i32> {
                let cap = self.tampon.len();
                // SAFETY : chaque indice calculé modulo cap est valide.
                (0..self.longueur).map(|i| unsafe { *self.tampon.as_ptr().add((self.tete + i) % cap) }).collect()
            }
        }

        fn main() {
            let mut e = String::new();
            io::stdin().read_to_string(&mut e).unwrap();
            let mut l = e.lines();
            let cap: usize = l.next().unwrap().trim().parse().unwrap();
            let mut a = Anneau::new(cap);
            for ligne in l {
                let p: Vec<&str> = ligne.split_whitespace().collect();
                if p[0] == "+" {
                    a.pousser(p[1].parse().unwrap());
                } else {
                    match a.extraire() {
                        Some(v) => println!("{}", v),
                        None => println!("vide"),
                    }
                }
            }
            println!("{:?}", a.contenu());
        }
      tests:
        - { input: "3\n+ 1\n+ 2\n+ 3\n+ 4\n-\n+ 5", output: "2\n[3, 4, 5]" }
        - { input: "2\n-\n+ 9\n-\n-", output: "vide\n9\nvide\n[]", hidden: true }
      require:
        - { pattern: '\bunsafe\b', message: Utiliser des pointeurs bruts dans des blocs unsafe }
    exam:
      pass: 70
      questions:
        - id: rust-unsafe-ex1
          type: mcq
          prompt: Quel outil détecte les comportements indéfinis dans le code unsafe ?
          choices: [Miri, Clippy, rustfmt, cargo doc]
          answer: 0
        - id: rust-unsafe-ex2
          type: mcq
          prompt: Quelle convention documente un bloc unsafe ?
          choices: ['// SAFETY: …', '// TODO', '/// unsafe', '#[safe]']
          answer: 0
        - id: rust-unsafe-ex3
          type: mcq
          prompt: Modifier une variable `static mut` nécessite…
          choices: [Un bloc unsafe, Un Mutex obligatoirement, Rien, Un Box]
          answer: 0
        - id: rust-unsafe-ex4
          type: mcq
          prompt: Quel est le bon usage de unsafe ?
          choices: [Un petit noyau unsafe vérifié derrière une API sûre, Mettre tout le programme en unsafe pour aller plus vite, L’éviter même quand il est nécessaire, Remplacer les tests]
          answer: 0

  # ------------------------------------------------------------------
  - slug: rust-gestion-memoire
    title: Gestion mémoire avancée
    summary: Disposition mémoire, taille des types, alignement, optimisation des niches, allocateurs, Cow et éviter les allocations inutiles.
    minutes: 30
    concepts: [memoire]
    sections:
      - title: Taille et disposition
        body: |
          ```rust
          use std::mem::{size_of, align_of};
          println!("{}", size_of::<(u8, u32)>());     // 8 (alignement sur 4)
          println!("{}", size_of::<Option<Box<i32>>>()); // 8 : optimisation de niche !
          println!("{}", size_of::<&str>());          // 16 : pointeur + longueur (fat pointer)
          ```

          - Le compilateur **réordonne** les champs d’une struct pour minimiser le remplissage (*padding*). `#[repr(C)]` impose l’ordre du C (FFI).
          - **Optimisation de niche** : `Option<&T>`, `Option<Box<T>>`, `Option<NonZeroU32>` ont la même taille que le type intérieur, car la valeur « nulle » (impossible pour ces types) code `None`.
          - Les **fat pointers** (`&str`, `&[T]`, `&dyn Trait`) contiennent une métadonnée en plus de l’adresse (longueur ou vtable).
      - title: Éviter les allocations
        body: |
          - Réserver la capacité : `Vec::with_capacity(n)`, `String::with_capacity(n)`.
          - Réutiliser un tampon : `buf.clear()` garde la capacité.
          - Emprunter (`&str`, `&[T]`) plutôt que cloner.
          - `Cow<'a, str>` (*Clone on Write*) : emprunte quand c’est possible, ne clone que si une modification est nécessaire.

          ```rust
          use std::borrow::Cow;
          fn normaliser(s: &str) -> Cow<str> {
              if s.contains(' ') { Cow::Owned(s.replace(' ', "_")) }  // allocation
              else { Cow::Borrowed(s) }                                // aucune allocation
          }
          ```

          `std::mem::take(&mut v)` remplace une valeur par sa valeur par défaut et renvoie l’ancienne (sans clone) ; `std::mem::replace` et `std::mem::swap` sont ses cousins.
      - title: Allocateurs et fuites
        body: |
          - L’allocateur global peut être remplacé (`#[global_allocator]`), par ex. par **mimalloc** ou **jemalloc** pour les serveurs.
          - Une fuite reste possible en Rust *safe* (cycles de `Rc`, `Box::leak`, `mem::forget`) : ce n’est pas une violation de la sûreté mémoire, mais un bug.
          - Outils : `valgrind`, `heaptrack`, `dhat` (crate) pour profiler les allocations.
    exercises:
      - id: rust-gm-predict
        type: predict
        prompt: Que va afficher ce programme (64 bits) ?
        code: |
          use std::mem::size_of;
          fn main() {
              println!("{} {} {}", size_of::<Option<Box<u64>>>(), size_of::<&[u8]>(), size_of::<Option<u64>>());
          }
        output: 8 16 16
        explanation: '`Option<Box<_>>` profite de la niche du pointeur non nul ; `Option<u64>` n’a pas de niche et ajoute un discriminant (aligné sur 8).'
        concepts: [memoire]
      - id: rust-gm-q1
        type: mcq
        prompt: À quoi sert `Cow<str>` ?
        choices: [À n’allouer une String que si une modification est nécessaire, À compter les références, À verrouiller une chaîne, À convertir en majuscules]
        answer: 0
      - id: rust-gm-q2
        type: mcq
        prompt: Que fait `std::mem::take(&mut v)` sur un Vec ?
        choices: [Renvoie l’ancien Vec et laisse un Vec vide à sa place, Clone le Vec, Supprime le Vec, Panique]
        answer: 0
      - id: rust-gm-fill
        type: fill
        prompt: Complète pour réserver la place de 100 éléments d’avance.
        code: |
          fn main() {
              let mut v: Vec<u32> = Vec::{{?}}(100);
              for i in 0..100 { v.push(i); }
              println!("{} {}", v.len(), v.capacity() >= 100);
          }
        blanks: [[with_capacity]]
        tests:
          - { input: '', output: 100 true }
      - id: rust-gm-code
        type: code
        title: Normalisation sans allocation superflue
        prompt: |
          Écris `fn slug(s: &str) -> Cow<str>` qui renvoie la chaîne **empruntée** si elle ne contient que des minuscules ASCII, chiffres et `-`, sinon une version possédée où les espaces deviennent `-`, les majuscules ASCII des minuscules, et les autres caractères sont supprimés.

          Pour chaque ligne, affiche `emprunté : X` ou `possédé : X`.
        starter: |
          use std::borrow::Cow;
          use std::io::{self, Read};

          fn main() {
              let mut e = String::new();
              io::stdin().read_to_string(&mut e).unwrap();
              for l in e.lines() {
                  match slug(l) {
                      Cow::Borrowed(s) => println!("emprunté : {}", s),
                      Cow::Owned(s) => println!("possédé : {}", s),
                  }
              }
          }
        solution: |
          use std::borrow::Cow;
          use std::io::{self, Read};

          fn slug(s: &str) -> Cow<str> {
              if s.chars().all(|c| c.is_ascii_lowercase() || c.is_ascii_digit() || c == '-') {
                  return Cow::Borrowed(s);
              }
              let mut out = String::with_capacity(s.len());
              for c in s.chars() {
                  if c == ' ' {
                      out.push('-');
                  } else if c.is_ascii_alphanumeric() || c == '-' {
                      out.push(c.to_ascii_lowercase());
                  }
              }
              Cow::Owned(out)
          }

          fn main() {
              let mut e = String::new();
              io::stdin().read_to_string(&mut e).unwrap();
              for l in e.lines() {
                  match slug(l) {
                      Cow::Borrowed(s) => println!("emprunté : {}", s),
