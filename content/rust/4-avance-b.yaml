  # ------------------------------------------------------------------
  - slug: rust-optimisation
    title: Optimisation
    summary: Mesure avant d’optimiser — profils release, benchmarks, complexité algorithmique, itérateurs, inlining et pièges de performance.
    minutes: 30
    concepts: [performance]
    sections:
      - title: Mesurer d’abord
        body: |
          « L’optimisation prématurée est la racine de tous les maux » (Knuth). La démarche :

          1. compiler en **release** (`cargo build --release`) — souvent 10 à 100× plus rapide que debug ;
          2. **mesurer** : `std::time::Instant`, benchmarks avec **criterion**, profilage avec `perf` / **cargo-flamegraph** ;
          3. optimiser le **point chaud** identifié ;
          4. re-mesurer.

          ```rust
          use std::time::Instant;
          let t = Instant::now();
          let s: u64 = (0..10_000_000u64).sum();
          println!("{s} en {:?}", t.elapsed());
          ```
      - title: Les vrais gains
        body: |
          Par ordre d’impact habituel :

          1. **Algorithme** : passer de O(n²) à O(n log n) bat toutes les micro-optimisations.
          2. **Structure de données** : `HashSet` pour l’appartenance, `Vec` contigu pour le cache CPU.
          3. **Allocations** : réutiliser les tampons, `with_capacity`, éviter les `clone()`.
          4. **E/S** : `BufReader`/`BufWriter`, verrouiller `stdout` une fois (`let mut out = io::stdout().lock();`).
          5. **Micro** : itérateurs (souvent mieux vectorisés que les boucles indexées), `#[inline]`, `lto = true`, `codegen-units = 1`, `target-cpu=native`.

          ```rust
          use std::io::Write;
          let out = std::io::stdout();
          let mut w = std::io::BufWriter::new(out.lock());
          for i in 0..1000 { writeln!(w, "{i}").unwrap(); }   // 1 seul appel système à la fin
          ```
      - title: Pièges fréquents
        body: |
          - `println!` dans une boucle chaude (verrou + appel système à chaque ligne).
          - `v.contains(x)` dans une boucle → O(n²) : utiliser un `HashSet`.
          - `String` construite par `+=` répétés sans capacité réservée.
          - Récursion naïve (Fibonacci exponentiel) → mémoïsation ou version itérative.
          - Copie de grosses structures par valeur au lieu de références.
          - Vérification des bornes : `iter()` les élimine souvent, contrairement à `v[i]` dans une boucle indexée.
    exercises:
      - id: rust-opt2-q1
        type: mcq
        prompt: Quelle est la première étape avant toute optimisation ?
        choices: ['Mesurer et profiler', 'Réécrire en unsafe', 'Ajouter #[inline] partout', 'Passer en C']
        answer: 0
        concepts: [performance]
      - id: rust-opt2-q2
        type: mcq
        prompt: Pourquoi `v.contains(&x)` dans une boucle sur n éléments est-il coûteux ?
        choices: [Complexité O(n²) au total, Il alloue de la mémoire, Il bloque un mutex, Il n’est pas coûteux]
        answer: 0
      - id: rust-opt2-fill
        type: fill
        prompt: Complète pour bufferiser les écritures.
        code: |
          use std::io::{self, Write};
          fn main() {
              let out = io::stdout();
              let mut w = io::{{?}}::new(out.lock());
              for i in 1..=3 { writeln!(w, "{}", i * i).unwrap(); }
          }
        blanks: [[BufWriter]]
        tests:
          - { input: '', output: "1\n4\n9" }
      - id: rust-opt2-predict
        type: predict
        prompt: Que va afficher ce programme ?
        code: |
          use std::collections::HashSet;
          fn main() {
              let a: Vec<u32> = (0..1000).collect();
              let b: HashSet<u32> = (500..1500).collect();
              let communs = a.iter().filter(|x| b.contains(x)).count();
              println!("{}", communs);
          }
        output: '500'
      - id: rust-opt2-code
        type: code
        title: Paires de somme cible
        prompt: |
          Première ligne : `n cible`. Seconde ligne : `n` entiers distincts. Compte les **paires** (i < j) dont la somme vaut `cible`.

          ⚠️ Les tests cachés contiennent jusqu’à 200 000 nombres avec une limite de temps : une solution O(n²) sera trop lente. Utilise un `HashSet` (O(n)).
        starter: |
          use std::collections::HashSet;
          use std::io::{self, Read};

          fn main() {
              let mut e = String::new();
              io::stdin().read_to_string(&mut e).unwrap();
          }
        solution: |
          use std::collections::HashSet;
          use std::io::{self, Read};

          fn main() {
              let mut e = String::new();
              io::stdin().read_to_string(&mut e).unwrap();
              let mut it = e.split_whitespace().map(|x| x.parse::<i64>().unwrap());
              let n = it.next().unwrap() as usize;
              let cible = it.next().unwrap();
              let mut vus: HashSet<i64> = HashSet::with_capacity(n);
              let mut paires = 0u64;
              for x in it.take(n) {
                  if vus.contains(&(cible - x)) {
                      paires += 1;
                  }
                  vus.insert(x);
              }
              println!("{}", paires);
          }
        tests:
          - { input: "5 10\n1 9 3 7 5", output: '2' }
          - { input: "4 0\n-2 2 -5 5", output: '2', hidden: true }
          - { input: "3 100\n1 2 3", output: '0', hidden: true }
        concepts: [performance, hashmap]
    project:
      id: rust-opt2-projet
      type: code
      title: Crible d’Ératosthène
      difficulty: 3
      prompt: |
        Lis plusieurs requêtes `n` (une par ligne, n ≤ 5 000 000). Pour chacune, affiche le **nombre de nombres premiers ≤ n**.

        Pour tenir dans la limite de temps, calcule **une seule fois** un crible d’Ératosthène jusqu’au maximum des requêtes, puis un tableau de cumuls, et réponds à chaque requête en O(1). Utilise un `BufWriter` pour la sortie.
      starter: |
        use std::io::{self, Read, Write};

        fn main() {
            let mut e = String::new();
            io::stdin().read_to_string(&mut e).unwrap();
        }
      solution: |
        use std::io::{self, Read, Write};

        fn main() {
            let mut e = String::new();
            io::stdin().read_to_string(&mut e).unwrap();
            let requetes: Vec<usize> = e.split_whitespace().map(|x| x.parse().unwrap()).collect();
            let max = requetes.iter().copied().max().unwrap_or(0);
            let mut premier = vec![true; max + 1];
            premier[0] = false;
            if max >= 1 { premier[1] = false; }
            let mut i = 2;
            while i * i <= max {
                if premier[i] {
                    let mut j = i * i;
                    while j <= max {
                        premier[j] = false;
                        j += i;
                    }
                }
                i += 1;
            }
            let mut cumul = vec![0u32; max + 1];
            let mut c = 0;
            for k in 0..=max {
                if premier[k] { c += 1; }
                cumul[k] = c;
            }
            let out = io::stdout();
            let mut w = io::BufWriter::new(out.lock());
            for n in requetes {
                writeln!(w, "{}", cumul[n]).unwrap();
            }
        }
      tests:
        - { input: "10\n100\n1", output: "4\n25\n0" }
        - { input: "5000000\n2\n1000000", output: "348513\n1\n78498", hidden: true }
      require:
        - { pattern: 'BufWriter', message: Utiliser un BufWriter }
