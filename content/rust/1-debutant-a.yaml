        - { input: "2.5\n2.5", output: "Aire : 6.2\nPérimètre : 10.0\nCarré : true", hidden: true }
        - { input: "10\n0.5", output: "Aire : 5.0\nPérimètre : 21.0\nCarré : false", hidden: true }
      hints: ['Déstructure le tuple : `let (l, h) = dimensions;`', 'Une comparaison `l == h` produit directement un `bool`.']
    exam:
      pass: 70
      questions:
        - id: rust-types-ex1
          type: mcq
          prompt: Quel est le type entier utilisé par défaut ?
          choices: [i8, i32, i64, usize]
          answer: 1
        - id: rust-types-ex2
          type: predict
          prompt: Que va afficher ce programme ?
          code: |
            fn main() {
                let x = 9.7_f64 as i32;
                let y = (x as f64) / 2.0;
                println!("{} {}", x, y);
            }
          output: '9 4.5'
          explanation: '`as i32` tronque (ne fait pas d’arrondi).'
        - id: rust-types-ex3
          type: mcq
          prompt: Combien d’octets occupe un `char` en Rust ?
          choices: ['1', '2', '4', Variable]
          answer: 2
        - id: rust-types-ex4
          type: predict
          prompt: Que va afficher ce programme ?
          code: |
            fn main() {
                let tab = [5; 3];
                let (a, b) = (tab[0] + tab[1], tab.len());
                println!("{} {}", a, b);
            }
          output: '10 3'
        - id: rust-types-ex5
          type: mcq
          prompt: Que se passe-t-il en mode debug si un `u8` valant 255 est incrémenté ?
          choices: [Il vaut 0, Il vaut 256, Le programme panique (dépassement), Erreur de compilation systématique]
          answer: 2
          explanation: En mode debug, Rust détecte le dépassement et arrête le programme. En mode release, la valeur « boucle » (wrapping) sauf vérification explicite.
