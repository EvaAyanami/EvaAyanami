            - 'let x: i64 = 1;'
          answer: 2
          explanation: Même avec `mut`, le type d’une variable ne peut pas changer. Le masquage (`let x = "un"`), lui, crée une nouvelle variable.
        - id: rust-var-ex3
          type: fill
