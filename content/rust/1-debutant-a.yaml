            }
          output: '6'
          explanation: Le masquage crée un nouveau `s` de type `i32`.

  # ------------------------------------------------------------------
  - slug: rust-types
    title: Types primitifs
    summary: Entiers signés et non signés, flottants, booléens, caractères, tuples et tableaux — et les conversions avec as.
    minutes: 30
    concepts: [types]
    sections:
      - title: Les nombres
        body: |
          **Entiers** : la lettre indique le signe (`i` = signé, `u` = non signé), le nombre la taille en bits.

          | Type | Plage |
          |---|---|
          | `i8` | -128 à 127 |
          | `u8` | 0 à 255 |
          | `i32` (par défaut) | ≈ ±2,1 milliards |
          | `i64` | ≈ ±9,2 × 10¹⁸ |
          | `u64` | 0 à ≈ 1,8 × 10¹⁹ |
          | `usize` | taille d’un pointeur (index, longueurs) |

          **Flottants** : `f64` (par défaut, double précision) et `f32`.

          ```rust
          let a = 42;          // i32
          let b: u8 = 255;
          let c = 3.14;        // f64
          let d = 1_000_000;   // les _ améliorent la lisibilité
          ```

          ⚠️ La division entière tronque : `7 / 2` vaut `3`, alors que `7.0 / 2.0` vaut `3.5`.

          En mode debug, un **dépassement** (`255u8 + 1`) provoque un *panic*. Rust ne laisse pas passer silencieusement ce genre de bug.
      - title: Booléens et caractères
        body: |
          ```rust
          let actif: bool = true;
          let lettre: char = 'é';     // apostrophes simples !
          let emoji = '🦀';            // un char Rust est un caractère Unicode
          ```

          - `bool` vaut `true` ou `false`.
          - `char` occupe **4 octets** et représente n’importe quel caractère Unicode.
          - Attention : `'a'` est un `char`, `"a"` est une chaîne (`&str`).
      - title: Tuples, tableaux et conversions
        body: |
          Un **tuple** regroupe des valeurs de types différents :

          ```rust
          let point = (3, 4.5, 'x');
          println!("{}", point.0);      // 3
          let (a, b, c) = point;        // déstructuration
          ```

          Un **tableau** a une taille fixe et des éléments de même type :

          ```rust
          let notes = [12, 15, 9];
          let zeros = [0; 5];           // [0, 0, 0, 0, 0]
          println!("{}", notes[0]);     // 12
          println!("{}", notes.len());  // 3
          ```

          **Conversions** : Rust ne convertit jamais implicitement entre types numériques. On utilise `as` :

          ```rust
          let entier = 7;
          let moitie = entier as f64 / 2.0;   // 3.5
          let tronque = 9.99_f64 as i32;      // 9 (troncature)
          ```
    exercises:
      - id: rust-types-q1
        type: mcq
