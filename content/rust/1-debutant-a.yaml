  # ------------------------------------------------------------------
  - slug: rust-variables
    title: Variables et mutabilité
    summary: Déclare des variables avec let, rends-les modifiables avec mut, découvre les constantes et le masquage (shadowing).
    minutes: 25
    concepts: [variables, mutabilite]
    sections:
      - title: Déclarer une variable
        body: |
          ```rust
          let age = 25;
          let prenom = "Kiri";
          let taille: f64 = 1.62;   // type précisé explicitement
          ```

          Le compilateur **déduit** (*infère*) le type à partir de la valeur. On peut l’écrire explicitement après `:`.

          En Rust, une variable est **immuable par défaut** :

          ```rust
          let score = 10;
          score = 20; // ❌ error[E0384]: cannot assign twice to immutable variable
          ```

          Ce choix évite des modifications accidentelles et rend le code plus facile à comprendre.
      - title: Rendre une variable modifiable avec mut
        body: |
          ```rust
          let mut score = 10;
          score = score + 5;   // ✅ OK
          score += 5;          // raccourci équivalent
          println!("{score}"); // 20
          ```

          Le mot-clé `mut` signale clairement : « cette valeur va changer ». Ne l’ajoute que si c’est nécessaire — le compilateur t’avertit d’ailleurs si une variable `mut` n’est jamais modifiée.

          Le **type**, lui, ne peut jamais changer :

          ```rust
          let mut x = 5;
          x = "texte"; // ❌ mismatched types
          ```
      - title: Constantes et masquage (shadowing)
        body: |
          Une **constante** est toujours immuable, son type est obligatoire, et sa valeur doit être connue à la compilation :

          ```rust
          const SECONDES_PAR_HEURE: u32 = 60 * 60;
          ```

          Le **masquage** consiste à redéclarer une variable du même nom avec `let`. C’est une **nouvelle** variable, qui peut même avoir un autre type :

          ```rust
          let saisie = "42";             // &str
          let saisie: i32 = saisie.parse().unwrap(); // i32 : nouvelle variable
          let saisie = saisie * 2;       // 84
          ```

          | | `let mut` | masquage `let` |
          |---|---|---|
          | même variable ? | oui | non, une nouvelle |
          | changer de type ? | non | oui |
    exercises:
      - id: rust-var-q1
        type: mcq
        prompt: Quelle est la différence entre `let x = 5;` et `let mut x = 5;` ?
        choices:
          - Aucune, mut est facultatif
          - Avec mut, la valeur de x peut être modifiée par la suite
          - Avec mut, x devient une constante
          - mut permet de changer le type de x
        answer: 1
        concepts: [mutabilite]
        explanation: Sans `mut`, toute réaffectation provoque l’erreur E0384.
      - id: rust-var-fill
        type: fill
        prompt: Complète pour que le compteur puisse être incrémenté.
        code: |
          fn main() {
              let {{?}} compteur = 0;
              compteur += 1;
              compteur += 1;
              println!("{}", compteur);
          }
        blanks: [[mut]]
        tests:
          - { input: '', output: '2' }
        concepts: [mutabilite]
      - id: rust-var-predict
        type: predict
        prompt: Que va afficher ce programme (attention au masquage) ?
        code: |
          fn main() {
              let x = 3;
              let x = x + 2;
              {
                  let x = x * 10;
                  println!("{}", x);
              }
              println!("{}", x);
          }
        output: "50\n5"
        explanation: Dans le bloc intérieur, un nouveau `x` vaut 50. À la sortie du bloc, on retrouve le `x` extérieur qui vaut 5.
      - id: rust-var-bug
        type: bugfix
        prompt: Le programme doit afficher 15. Trouve et corrige l’erreur.
        code: |
          fn main() {
              let total = 10;
              total = total + 5;
              println!("{}", total);
          }
        bugLines: [2, 3]
        choices:
          - '`total` est immuable : il faut le déclarer avec `let mut`'
          - On ne peut pas additionner deux entiers
          - println! ne peut pas afficher une variable
        answer: 0
        solution: |
          fn main() {
              let mut total = 10;
              total = total + 5;
              println!("{}", total);
          }
        tests:
          - { input: '', output: '15' }
        concepts: [mutabilite]
      - id: rust-var-q2
        type: mcq
        prompt: Laquelle de ces déclarations de constante est correcte ?
        choices:
          - const max = 100;
          - 'const MAX: u32 = 100;'
          - let const MAX = 100;
          - 'const mut MAX: u32 = 100;'
        answer: 1
        explanation: Une constante exige un type explicite et ne peut jamais être `mut`.
      - id: rust-var-code
        type: code
        title: Tirelire
        prompt: |
          Lis un montant initial puis un dépôt (deux entiers, un par ligne). Utilise une variable **mutable** `solde` : ajoute le dépôt, puis double le solde (intérêts magiques ✨). Affiche le solde final.

