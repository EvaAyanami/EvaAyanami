        concepts: [mutabilite, variables]
    project:
      id: rust-var-projet
      type: code
      title: Convertisseur de durée
      difficulty: 2
      prompt: |
        Lis un nombre de **secondes** (entier positif). Utilise des constantes `SECONDES_PAR_MINUTE` et `SECONDES_PAR_HEURE`, puis affiche la durée au format :

        ```
        <h> h <m> min <s> s
        ```

        Exemple : `3725` → `1 h 2 min 5 s`.

        Astuce : `/` est la division entière et `%` le reste de la division.
      starter: |
        use std::io;

        // Déclare tes constantes ici

        fn main() {
            let mut s = String::new();
            io::stdin().read_line(&mut s).unwrap();
            let total: u64 = s.trim().parse().unwrap();
            // Calcule heures, minutes, secondes
        }
      solution: |
        use std::io;

        const SECONDES_PAR_MINUTE: u64 = 60;
        const SECONDES_PAR_HEURE: u64 = 60 * SECONDES_PAR_MINUTE;

        fn main() {
            let mut s = String::new();
            io::stdin().read_line(&mut s).unwrap();
            let total: u64 = s.trim().parse().unwrap();
            let h = total / SECONDES_PAR_HEURE;
            let reste = total % SECONDES_PAR_HEURE;
            let m = reste / SECONDES_PAR_MINUTE;
            let sec = reste % SECONDES_PAR_MINUTE;
            println!("{} h {} min {} s", h, m, sec);
        }
      tests:
        - { input: '3725', output: '1 h 2 min 5 s' }
        - { input: '59', output: '0 h 0 min 59 s', hidden: true }
        - { input: '86399', output: '23 h 59 min 59 s', hidden: true }
        - { input: '7200', output: '2 h 0 min 0 s', hidden: true }
      require:
        - { pattern: 'const\s+SECONDES_PAR_HEURE', message: Déclarer la constante SECONDES_PAR_HEURE }
      hints:
        - Les heures valent `total / 3600`. Ce qui reste après les heures vaut `total % 3600`.
      concepts: [variables]
