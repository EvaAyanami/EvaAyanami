              let depot = lire();
              // Déclare solde, modifie-le, puis affiche-le
          }
        solution: |
          use std::io;

          fn lire() -> i64 {
              let mut s = String::new();
              io::stdin().read_line(&mut s).unwrap();
              s.trim().parse().unwrap()
          }

          fn main() {
