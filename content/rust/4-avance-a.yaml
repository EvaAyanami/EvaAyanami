          type: mcq
          prompt: Dans quel ordre les variables locales sont-elles détruites ?
          choices: [Ordre de création, Ordre inverse de création, Ordre alphabétique, Aléatoire]
          answer: 1
        - id: rust-sp-ex2
          type: mcq
          prompt: Quelle combinaison permet un état partagé et modifiable entre plusieurs threads ?
          choices: ['Rc<RefCell<T>>', 'Arc<Mutex<T>>', 'Box<Cell<T>>', 'Rc<Mutex<T>>']
          answer: 1
        - id: rust-sp-ex3
          type: mcq
          prompt: Quand les règles d’emprunt d’un RefCell sont-elles vérifiées ?
          choices: [À la compilation, À l’exécution, Jamais, À l’édition de liens]
          answer: 1
        - id: rust-sp-ex4
          type: mcq
          prompt: Cell<T> est adapté pour…
          choices: [Les types Copy, Les String, Les Vec, Les threads]
          answer: 0

  # ------------------------------------------------------------------
  - slug: rust-rc-arc
    title: Rc et Arc
    summary: Partage la propriété d’une valeur grâce au comptage de références (Rc en mono-thread, Arc en multi-threads), et évite les cycles avec Weak.
    minutes: 30
    concepts: [smart-pointers, concurrence]
    sections:
      - title: Rc, plusieurs propriétaires
        body: |
          `Rc<T>` (*Reference Counted*) permet à **plusieurs** variables de posséder la même valeur. Elle n’est libérée que lorsque le dernier propriétaire disparaît.

          ```rust
          use std::rc::Rc;

          let a = Rc::new(String::from("partagé"));
          let b = Rc::clone(&a);        // copie du POINTEUR, pas de la chaîne
          let c = a.clone();            // équivalent
          println!("{}", Rc::strong_count(&a)); // 3
          drop(b);
          println!("{}", Rc::strong_count(&a)); // 2
          ```

          `Rc` donne un accès **en lecture**. Pour modifier : `Rc<RefCell<T>>`.
      - title: Arc pour les threads
        body: |
          Le compteur de `Rc` n’est pas protégé contre les accès simultanés : `Rc` n’implémente pas `Send`, le compilateur refuse de l’envoyer dans un thread.

          `Arc<T>` (*Atomically Reference Counted*) utilise des opérations atomiques : un peu plus lent, mais sûr entre threads.

          ```rust
          use std::sync::Arc;
          use std::thread;

          let donnees = Arc::new(vec![1, 2, 3]);
          let mut handles = vec![];
          for i in 0..3 {
              let d = Arc::clone(&donnees);
              handles.push(thread::spawn(move || d[i] * 10));
          }
          let r: Vec<i32> = handles.into_iter().map(|h| h.join().unwrap()).collect();
          ```
      - title: Cycles et Weak
        body: |
          Deux `Rc` qui se référencent mutuellement ne descendent jamais à 0 : **fuite mémoire**. On casse le cycle avec `Weak<T>`, une référence qui **ne possède pas** :

          ```rust
          use std::rc::{Rc, Weak};
          use std::cell::RefCell;

          struct Noeud {
              valeur: i32,
              parent: RefCell<Weak<Noeud>>,
              enfants: RefCell<Vec<Rc<Noeud>>>,
          }
          // parent.borrow().upgrade() renvoie Option<Rc<Noeud>>
          ```

          `Rc::downgrade(&rc)` crée un `Weak` ; `weak.upgrade()` renvoie `Some(rc)` si la valeur existe encore.
    exercises:
