      - id: rust-conc-code
        type: code
        title: Producteurs et consommateur
        prompt: |
          Chaque ligne d’entrée correspond à un **producteur** (un thread) qui envoie, via un canal `mpsc`, la longueur (en caractères) de chacun de ses mots.

          Le thread principal (consommateur) reçoit tous les messages et affiche : le nombre de messages reçus, la somme des longueurs et la longueur maximale.
        starter: |
          use std::io::{self, Read};
          use std::sync::mpsc;
          use std::thread;

          fn main() {
              let mut e = String::new();
              io::stdin().read_to_string(&mut e).unwrap();
