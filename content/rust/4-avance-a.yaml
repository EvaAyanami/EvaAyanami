      solution: |
        use std::io;
        use std::sync::{Arc, Barrier, Mutex};
        use std::thread;

        fn main() {
            let mut s = String::new();
            io::stdin().read_line(&mut s).unwrap();
            let v: Vec<usize> = s.split_whitespace().map(|x| x.parse().unwrap()).collect();
            let (n, t) = (v[0], v[1]);
            let positions = Arc::new(Mutex::new(vec![0u32; n]));
            let leaders = Arc::new(Mutex::new(Vec::new()));
            let barriere = Arc::new(Barrier::new(n));
            let mut hs = vec![];
            for i in 0..n {
                let pos = Arc::clone(&positions);
                let lead = Arc::clone(&leaders);
                let b = Arc::clone(&barriere);
                hs.push(thread::spawn(move || {
                    for k in 1..=t {
                        pos.lock().unwrap()[i] += (((i + 1) * k) % 5 + 1) as u32;
                        if b.wait().is_leader() {
                            let p = pos.lock().unwrap();
                            let max = *p.iter().max().unwrap();
                            let tete = p.iter().position(|&x| x == max).unwrap();
                            lead.lock().unwrap().push((k, tete));
                        }
                        b.wait();
                    }
                }));
            }
            for h in hs { h.join().unwrap(); }
            for (k, i) in leaders.lock().unwrap().iter() {
                println!("tour {} : tortue {}", k, i);
            }
            let p: Vec<String> = positions.lock().unwrap().iter().map(|x| x.to_string()).collect();
            println!("{}", p.join(" "));
        }
      tests:
        - { input: '3 3', output: "tour 1 : tortue 2\ntour 2 : tortue 1\ntour 3 : tortue 2\n9 10 11" }
        - { input: '1 2', output: "tour 1 : tortue 0\ntour 2 : tortue 0\n5", hidden: true }
      hints: ['Un second `wait()` après la section du leader garantit que personne n’entame le tour suivant avant l’enregistrement.']
