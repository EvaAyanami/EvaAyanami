          - { input: '', output: '[1, 2]' }
      - id: rust-rc-code
        type: code
        title: Arbre généalogique
        prompt: |
          Chaque ligne `parent enfant` décrit une filiation. Représente les personnes par `Rc<Personne>` avec `struct Personne { nom: String, parent: RefCell<Weak<Personne>>, enfants: RefCell<Vec<Rc<Personne>>> }`.

          Après lecture, pour la dernière personne mentionnée sur la dernière ligne, affiche sa lignée ascendante jusqu’à la racine, séparée par ` <- ` (en remontant avec `upgrade()`).
        starter: |
          use std::cell::RefCell;
          use std::collections::HashMap;
          use std::io::{self, Read};
          use std::rc::{Rc, Weak};

          struct Personne {
              nom: String,
              parent: RefCell<Weak<Personne>>,
              enfants: RefCell<Vec<Rc<Personne>>>,
          }

          fn main() {
              let mut e = String::new();
              io::stdin().read_to_string(&mut e).unwrap();
          }
        solution: |
          use std::cell::RefCell;
          use std::collections::HashMap;
          use std::io::{self, Read};
          use std::rc::{Rc, Weak};

          struct Personne {
              nom: String,
              parent: RefCell<Weak<Personne>>,
              enfants: RefCell<Vec<Rc<Personne>>>,
          }

          fn obtenir(m: &mut HashMap<String, Rc<Personne>>, nom: &str) -> Rc<Personne> {
              m.entry(nom.to_string())
                  .or_insert_with(|| Rc::new(Personne { nom: nom.to_string(), parent: RefCell::new(Weak::new()), enfants: RefCell::new(vec![]) }))
                  .clone()
          }

          fn main() {
              let mut e = String::new();
              io::stdin().read_to_string(&mut e).unwrap();
              let mut m: HashMap<String, Rc<Personne>> = HashMap::new();
              let mut dernier = String::new();
              for l in e.lines() {
                  let p: Vec<&str> = l.split_whitespace().collect();
                  let parent = obtenir(&mut m, p[0]);
                  let enfant = obtenir(&mut m, p[1]);
                  *enfant.parent.borrow_mut() = Rc::downgrade(&parent);
                  parent.enfants.borrow_mut().push(Rc::clone(&enfant));
                  dernier = p[1].to_string();
              }
              let mut chemin = vec![];
              let mut courant = Some(Rc::clone(&m[&dernier]));
              while let Some(p) = courant {
                  chemin.push(p.nom.clone());
                  courant = p.parent.borrow().upgrade();
              }
              println!("{}", chemin.join(" <- "));
          }
        tests:
          - { input: "Ada Bob\nBob Cleo\nAda Dan\nCleo Eve", output: Eve <- Cleo <- Bob <- Ada }
          - { input: 'X Y', output: Y <- X, hidden: true }
    project:
      id: rust-rc-projet
      type: code
      title: Calcul parallèle partagé
      difficulty: 3
      prompt: |
        Lis une liste d’entiers et un nombre de threads `t` (première ligne : `t`, seconde : les nombres). Partage la liste avec un `Arc<Vec<i64>>` : le thread `i` calcule la somme des éléments d’indice `j` tels que `j % t == i`.

        Affiche la somme partielle de chaque thread dans l’ordre (`thread i : s`) puis `total : S`.
      starter: |
        use std::io::{self, Read};
        use std::sync::Arc;
        use std::thread;

        fn main() {
            let mut e = String::new();
            io::stdin().read_to_string(&mut e).unwrap();
        }
      solution: |
        use std::io::{self, Read};
        use std::sync::Arc;
        use std::thread;

        fn main() {
            let mut e = String::new();
            io::stdin().read_to_string(&mut e).unwrap();
            let mut l = e.lines();
            let t: usize = l.next().unwrap().trim().parse().unwrap();
            let v: Arc<Vec<i64>> = Arc::new(l.next().unwrap().split_whitespace().map(|x| x.parse().unwrap()).collect());
            let handles: Vec<_> = (0..t)
                .map(|i| {
                    let v = Arc::clone(&v);
                    thread::spawn(move || v.iter().enumerate().filter(|(j, _)| j % t == i).map(|(_, x)| x).sum::<i64>())
                })
                .collect();
            let mut total = 0;
            for (i, h) in handles.into_iter().enumerate() {
                let s = h.join().unwrap();
                println!("thread {} : {}", i, s);
                total += s;
            }
            println!("total : {}", total);
        }
      tests:
        - { input: "2\n1 2 3 4 5", output: "thread 0 : 9\nthread 1 : 6\ntotal : 15" }
        - { input: "3\n10 20", output: "thread 0 : 10\nthread 1 : 20\nthread 2 : 0\ntotal : 30", hidden: true }
      require:
        - { pattern: 'Arc::', message: Partager les données avec Arc }
        - { pattern: 'thread::spawn', message: Créer des threads }
      concepts: [concurrence]
    exam:
      pass: 70
      questions:
        - id: rust-rc-ex1
          type: mcq
          prompt: Comment éviter une fuite mémoire due à un cycle de Rc ?
          choices: [Utiliser Weak pour l’une des directions, Utiliser Box, Appeler drop deux fois, C’est impossible]
          answer: 0
        - id: rust-rc-ex2
          type: mcq
          prompt: Que renvoie `weak.upgrade()` ?
          choices: ['Option<Rc<T>>', 'Rc<T>', 'T', 'Result<T, E>']
          answer: 0
        - id: rust-rc-ex3
          type: mcq
          prompt: Quelle est la différence principale entre Rc et Arc ?
          choices: [Arc utilise un compteur atomique, utilisable entre threads, Arc permet la modification, Rc est plus lent, Aucune]
          answer: 0
        - id: rust-rc-ex4
          type: predict
          prompt: Que va afficher ce programme ?
          code: |
            use std::rc::Rc;
            fn main() {
                let a = Rc::new(vec![1, 2]);
                let b = a.clone();
                let w = Rc::downgrade(&a);
                drop(a);
                println!("{} {}", b.len(), w.upgrade().is_some());
                drop(b);
                println!("{}", w.upgrade().is_some());
            }
          output: "2 true\nfalse"

  # ------------------------------------------------------------------
  - slug: rust-mutex-rwlock
    title: Mutex et RwLock
    summary: Protège des données partagées avec Mutex et RwLock, comprends les gardes (guards), le poisoning et les interblocages.
    minutes: 30
    concepts: [concurrence]
    sections:
      - title: Mutex
        body: |
          Un `Mutex<T>` (*mutual exclusion*) garantit qu’**un seul** thread à la fois accède à la donnée :

          ```rust
          use std::sync::{Arc, Mutex};
          use std::thread;

          let compteur = Arc::new(Mutex::new(0));
          let mut handles = vec![];
          for _ in 0..10 {
              let c = Arc::clone(&compteur);
              handles.push(thread::spawn(move || {
                  let mut garde = c.lock().unwrap();   // attend le verrou
                  *garde += 1;
              }));                                     // garde libérée ici (Drop)
          }
          for h in handles { h.join().unwrap(); }
          println!("{}", *compteur.lock().unwrap());   // 10
          ```

          `lock()` renvoie une **garde** (`MutexGuard`) : le verrou est relâché automatiquement quand elle sort de portée (RAII). Impossible d’oublier de déverrouiller !
      - title: RwLock
        body: |
          `RwLock<T>` autorise **plusieurs lecteurs OU un seul écrivain** — idéal quand les lectures dominent :

          ```rust
          use std::sync::RwLock;
          let config = RwLock::new(String::from("v1"));
          {
              let r1 = config.read().unwrap();
              let r2 = config.read().unwrap();   // ✅ lectures simultanées
              println!("{r1} {r2}");
          }
          config.write().unwrap().push_str("-maj");
          ```

          **Poisoning** : si un thread panique en tenant le verrou, celui-ci devient « empoisonné » et `lock()` renvoie `Err`. On peut récupérer la donnée avec `e.into_inner()`.
      - title: Interblocages et bonnes pratiques
        body: |
          Un **interblocage** (*deadlock*) survient quand deux threads attendent chacun un verrou détenu par l’autre. Rust ne l’empêche pas !

          Bonnes pratiques :

          - garder les verrous le **moins longtemps possible** (copier la donnée puis relâcher) ;
          - toujours acquérir plusieurs verrous **dans le même ordre** ;
          - ne pas appeler de code inconnu en tenant un verrou ;
          - pour un simple compteur, préférer les **atomiques** (`AtomicUsize::fetch_add`) ;
          - envisager les canaux (`mpsc`) : « partager la mémoire en communiquant ».
    exercises:
      - id: rust-mutex-q1
        type: mcq
        prompt: Quand le verrou d’un Mutex est-il relâché ?
        choices: [Quand la garde (MutexGuard) est détruite, Quand on appelle unlock(), À la fin du programme, Après 1 seconde]
        answer: 0
        concepts: [concurrence]
      - id: rust-mutex-q2
        type: mcq
        prompt: Quel verrou permet plusieurs lecteurs simultanés ?
        choices: [Mutex, RwLock, Cell, Barrier]
        answer: 1
      - id: rust-mutex-predict
        type: predict
        prompt: Que va afficher ce programme ?
        code: |
          use std::sync::{Arc, Mutex};
          use std::thread;
          fn main() {
              let v = Arc::new(Mutex::new(Vec::new()));
              let hs: Vec<_> = (1..=4).map(|i| {
                  let v = Arc::clone(&v);
                  thread::spawn(move || v.lock().unwrap().push(i * i))
              }).collect();
              for h in hs { h.join().unwrap(); }
              let mut r = v.lock().unwrap().clone();
              r.sort();
              println!("{:?} {}", r, r.iter().sum::<i32>());
          }
        output: '[1, 4, 9, 16] 30'
