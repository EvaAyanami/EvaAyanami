      - id: rust-thr-code
        type: code
        title: Recherche de nombres premiers en parallèle
        prompt: |
          Lis `n` et `t`. Découpe l’intervalle `[2, n]` en `t` tranches contiguës de tailles aussi égales que possible et compte les nombres premiers de chaque tranche dans un thread différent.

          Affiche le total des nombres premiers ≤ n.
        starter: |
          use std::io;
          use std::thread;

          fn est_premier(n: u64) -> bool {
              n >= 2 && (2..).take_while(|d| d * d <= n).all(|d| n % d != 0)
          }

          fn main() {
              let mut s = String::new();
              io::stdin().read_line(&mut s).unwrap();
              let v: Vec<u64> = s.split_whitespace().map(|x| x.parse().unwrap()).collect();
              let (n, t) = (v[0], v[1]);
          }
        solution: |
          use std::io;
          use std::thread;

          fn est_premier(n: u64) -> bool {
              n >= 2 && (2..).take_while(|d| d * d <= n).all(|d| n % d != 0)
          }

          fn main() {
              let mut s = String::new();
              io::stdin().read_line(&mut s).unwrap();
              let v: Vec<u64> = s.split_whitespace().map(|x| x.parse().unwrap()).collect();
              let (n, t) = (v[0], v[1]);
              let total_nombres = if n >= 2 { n - 1 } else { 0 };
              let taille = (total_nombres + t - 1) / t.max(1);
              let mut hs = vec![];
              for i in 0..t {
                  let debut = 2 + i * taille;
                  let fin = (debut + taille).min(n + 1);
                  hs.push(thread::spawn(move || (debut..fin).filter(|&x| est_premier(x)).count()));
              }
              let total: usize = hs.into_iter().map(|h| h.join().unwrap()).sum();
              println!("{}", total);
          }
        tests:
          - { input: '100 4', output: '25' }
          - { input: '1 3', output: '0', hidden: true }
          - { input: '100000 8', output: '9592', hidden: true }
        require:
          - { pattern: 'thread::spawn', message: Utiliser des threads }
        concepts: [concurrence]
    project:
      id: rust-thr-projet
      type: code
      title: Course de tortues synchronisée
      difficulty: 3
      prompt: |
        `N` tortues (threads) avancent en `T` tours. Au tour `k` (de 1 à T), la tortue `i` avance de `((i + 1) * k) % 5 + 1` cases. Une `Barrier` synchronise les tortues à la fin de chaque tour ; les positions sont stockées dans un `Arc<Mutex<Vec<u32>>>`.

        Après chaque tour, **un seul** thread (celui dont `barrier.wait()` renvoie `is_leader()`) enregistre la tortue en tête (la plus petite d’indice en cas d’égalité) dans un vecteur partagé. Affiche la liste des leaders par tour (`tour k : tortue i`) puis les positions finales séparées par des espaces.
      starter: |
        use std::io;
        use std::sync::{Arc, Barrier, Mutex};
        use std::thread;

        fn main() {
            let mut s = String::new();
            io::stdin().read_line(&mut s).unwrap();
