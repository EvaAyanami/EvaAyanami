language: rust
level: 4
chapters:
  # ------------------------------------------------------------------
  - slug: rust-smart-pointers
    title: Smart pointers
    summary: Box, Deref, Drop, RefCell et la mutabilité intérieure — les pointeurs intelligents qui possèdent leurs données.
    minutes: 35
    concepts: [smart-pointers]
    sections:
      - title: Box, Deref et Drop
        body: |
          Un **pointeur intelligent** est une struct qui se comporte comme un pointeur (trait `Deref`) et gère une ressource (trait `Drop`).

          ```rust
          use std::ops::Deref;

          struct MaBoite<T>(T);
          impl<T> Deref for MaBoite<T> {
              type Target = T;
              fn deref(&self) -> &T { &self.0 }
          }

          struct Journal(&'static str);
          impl Drop for Journal {
              fn drop(&mut self) { println!("libération de {}", self.0); }
          }

          let b = MaBoite(5);
          assert_eq!(*b, 5);            // *b appelle deref()
          {
              let _j = Journal("A");
          }                              // affiche « libération de A »
          ```

          Les valeurs sont détruites dans l’ordre **inverse** de leur création. `drop(x)` force une libération anticipée.
      - title: Mutabilité intérieure avec RefCell
        body: |
          Parfois, il faut modifier une donnée accessible seulement via `&` (par ex. un cache dans une méthode `&self`). `RefCell<T>` déplace les règles d’emprunt **à l’exécution** :

          ```rust
          use std::cell::{Cell, RefCell};

          struct Compteur { appels: Cell<u32>, cache: RefCell<Vec<u64>> }

          impl Compteur {
              fn calculer(&self, n: u64) -> u64 {
                  self.appels.set(self.appels.get() + 1);   // Cell : valeurs Copy
                  self.cache.borrow_mut().push(n * n);      // RefCell : emprunt dynamique
                  n * n
              }
          }
          ```

          `borrow()` et `borrow_mut()` paniquent si les règles sont violées (deux `borrow_mut` simultanés). `Cell<T>` est réservé aux types `Copy`, sans emprunt.
      - title: Tableau récapitulatif
        body: |
          | Type | Propriété | Mutabilité | Threads |
          |---|---|---|---|
          | `Box<T>` | unique | selon la variable | ✅ si T l’est |
          | `Rc<T>` | partagée (comptage) | lecture | ❌ |
          | `Arc<T>` | partagée (atomique) | lecture | ✅ |
          | `Cell<T>` / `RefCell<T>` | unique | intérieure | ❌ |
          | `Mutex<T>` / `RwLock<T>` | — | intérieure, verrouillée | ✅ |

          Combinaisons classiques : `Rc<RefCell<T>>` (graphe partagé mono-thread), `Arc<Mutex<T>>` (état partagé multi-threads).
    exercises:
      - id: rust-sp-predict
        type: predict
        prompt: Que va afficher ce programme ?
        code: |
