        solution: |
          use std::io::{self, Read};
          use std::sync::mpsc;
          use std::thread;

          fn main() {
              let mut e = String::new();
              io::stdin().read_to_string(&mut e).unwrap();
              let (tx, rx) = mpsc::channel::<usize>();
              for ligne in e.lines() {
                  let tx = tx.clone();
                  let ligne = ligne.to_string();
                  thread::spawn(move || {
                      for m in ligne.split_whitespace() {
                          tx.send(m.chars().count()).unwrap();
                      }
                  });
              }
              drop(tx);
              let recus: Vec<usize> = rx.iter().collect();
              println!("{} {} {}", recus.len(), recus.iter().sum::<usize>(), recus.iter().max().unwrap_or(&0));
          }
        tests:
