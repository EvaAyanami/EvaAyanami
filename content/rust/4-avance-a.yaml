  # ------------------------------------------------------------------
  - slug: rust-concurrence
    title: Concurrence
    summary: Send et Sync, canaux mpsc, scoped threads et parallélisme sans data race — la « concurrence sans peur » de Rust.
    minutes: 35
    concepts: [concurrence]
    sections:
      - title: Send et Sync
        body: |
          Deux traits marqueurs automatiques garantissent la sûreté des threads :

          - **`Send`** : la valeur peut être **transférée** à un autre thread (`String`, `Vec`, `Arc`… mais pas `Rc`) ;
          - **`Sync`** : la valeur peut être **partagée** par référence entre threads (`&T` est `Send`) — `Mutex<T>` est `Sync`, `RefCell<T>` ne l’est pas.

          Le compilateur refuse tout programme qui pourrait provoquer une *data race*. C’est la « **concurrence sans peur** » (*fearless concurrency*).
      - title: Canaux (message passing)
        body: |
          « Ne communiquez pas en partageant la mémoire ; partagez la mémoire en communiquant. »

          ```rust
          use std::sync::mpsc;
          use std::thread;

          let (tx, rx) = mpsc::channel();
          for id in 0..3 {
              let tx = tx.clone();                 // plusieurs producteurs
              thread::spawn(move || {
                  tx.send(format!("bonjour de {id}")).unwrap();
              });
          }
          drop(tx);                                // ferme le canal original
          for msg in rx {                          // itère jusqu’à fermeture
              println!("{msg}");
          }
          ```

          `mpsc` = *multiple producer, single consumer*. `recv()` bloque, `try_recv()` non. `sync_channel(n)` crée un canal borné (contre-pression).
      - title: Scoped threads
        body: |
          `thread::scope` (Rust 1.63+) crée des threads qui **peuvent emprunter** des variables locales, car ils sont garantis terminés à la fin du bloc :

          ```rust
          let donnees = vec![1, 2, 3, 4, 5, 6];
          let (gauche, droite) = donnees.split_at(3);
          let (a, b) = thread::scope(|s| {
              let h1 = s.spawn(|| gauche.iter().sum::<i32>());
              let h2 = s.spawn(|| droite.iter().sum::<i32>());
              (h1.join().unwrap(), h2.join().unwrap())
          });
          println!("{}", a + b); // 21 — pas besoin d’Arc !
          ```

          Pour du parallélisme de données à grande échelle, la crate **rayon** transforme `iter()` en `par_iter()`.
