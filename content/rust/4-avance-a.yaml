    project:
      id: rust-conc-projet
      type: code
      title: Pool de travailleurs
      difficulty: 3
      prompt: |
        Implémente un mini **pool de threads** : `N` travailleurs partagent un canal de tâches (`Arc<Mutex<mpsc::Receiver<u64>>>`). Chaque tâche est un nombre `n` ; le travailleur calcule la somme des diviseurs propres de `n` et renvoie `(n, somme)` sur un canal de résultats.

        Première ligne : `N`. Seconde ligne : les tâches. Affiche les résultats **triés par n** au format `n : somme (parfait|abondant|déficient)` — parfait si somme = n, abondant si somme > n.
      starter: |
        use std::io::{self, Read};
        use std::sync::{mpsc, Arc, Mutex};
        use std::thread;

        fn main() {
            let mut e = String::new();
            io::stdin().read_to_string(&mut e).unwrap();
        }
      solution: |
        use std::io::{self, Read};
        use std::sync::{mpsc, Arc, Mutex};
        use std::thread;

        fn somme_diviseurs(n: u64) -> u64 {
            (1..n).filter(|d| n % d == 0).sum()
        }

        fn main() {
            let mut e = String::new();
            io::stdin().read_to_string(&mut e).unwrap();
            let mut l = e.lines();
            let n: usize = l.next().unwrap().trim().parse().unwrap();
            let taches: Vec<u64> = l.next().unwrap().split_whitespace().map(|x| x.parse().unwrap()).collect();
            let (tx_t, rx_t) = mpsc::channel::<u64>();
            let (tx_r, rx_r) = mpsc::channel::<(u64, u64)>();
            let rx_t = Arc::new(Mutex::new(rx_t));
            let mut hs = vec![];
            for _ in 0..n {
                let rx = Arc::clone(&rx_t);
                let tx = tx_r.clone();
                hs.push(thread::spawn(move || loop {
                    let tache = rx.lock().unwrap().recv();
                    match tache {
                        Ok(x) => tx.send((x, somme_diviseurs(x))).unwrap(),
                        Err(_) => break,
                    }
                }));
            }
            drop(tx_r);
            for t in taches { tx_t.send(t).unwrap(); }
            drop(tx_t);
            for h in hs { h.join().unwrap(); }
            let mut res: Vec<(u64, u64)> = rx_r.iter().collect();
            res.sort();
            for (x, s) in res {
                let genre = if s == x { "parfait" } else if s > x { "abondant" } else { "déficient" };
                println!("{} : {} ({})", x, s, genre);
            }
        }
      tests:
        - { input: "3\n6 12 7 28", output: "6 : 6 (parfait)\n7 : 1 (déficient)\n12 : 16 (abondant)\n28 : 28 (parfait)" }
        - { input: "1\n1 496", output: "1 : 0 (déficient)\n496 : 496 (parfait)", hidden: true }
