      - id: rust-mutex-code
        type: code
        title: Banque concurrente
        prompt: |
          Plusieurs guichets (threads) traitent des opérations en parallèle sur un même compte `Arc<Mutex<i64>>`.

          Première ligne : solde initial. Chaque ligne suivante est la liste des opérations d’un guichet (entiers positifs = dépôts, négatifs = retraits). Un retrait qui rendrait le solde négatif est refusé.

          Lance un thread par guichet, attends-les, puis affiche le solde final et le nombre total de retraits refusés (compté dans un `Arc<AtomicUsize>` ou un second Mutex). Les tests sont conçus pour que le résultat ne dépende pas de l’ordre d’exécution.
        starter: |
          use std::io::{self, Read};
          use std::sync::{Arc, Mutex};
          use std::thread;

          fn main() {
              let mut e = String::new();
              io::stdin().read_to_string(&mut e).unwrap();
          }
        solution: |
          use std::io::{self, Read};
          use std::sync::atomic::{AtomicUsize, Ordering};
          use std::sync::{Arc, Mutex};
          use std::thread;

          fn main() {
              let mut e = String::new();
              io::stdin().read_to_string(&mut e).unwrap();
              let mut l = e.lines();
              let solde = Arc::new(Mutex::new(l.next().unwrap().trim().parse::<i64>().unwrap()));
              let refus = Arc::new(AtomicUsize::new(0));
              let mut hs = vec![];
              for ligne in l {
                  let ops: Vec<i64> = ligne.split_whitespace().map(|x| x.parse().unwrap()).collect();
                  let s = Arc::clone(&solde);
                  let r = Arc::clone(&refus);
                  hs.push(thread::spawn(move || {
                      for op in ops {
                          let mut g = s.lock().unwrap();
                          if *g + op < 0 {
                              r.fetch_add(1, Ordering::SeqCst);
                          } else {
                              *g += op;
                          }
                      }
                  }));
              }
              for h in hs { h.join().unwrap(); }
              println!("{}", solde.lock().unwrap());
              println!("{}", refus.load(Ordering::SeqCst));
          }
        tests:
          - { input: "1000\n100 200 -50\n-30 10\n5 5 5", output: "1245\n0" }
          - { input: "0\n-10\n-20", output: "0\n2", hidden: true }
        require:
          - { pattern: 'Mutex', message: Utiliser un Mutex }
        concepts: [concurrence]
    project:
      id: rust-mutex-projet
      type: code
      title: Cache de configuration
      difficulty: 3
      prompt: |
        Un `Arc<RwLock<HashMap<String, String>>>` stocke une configuration. Les lignes d’entrée sont des commandes **séquentielles** exécutées chacune par un thread lancé puis attendu (`join`) immédiatement :

        - `set cle valeur` (écriture) ;
        - `get cle` (lecture) → affiche `cle = valeur` ou `cle absente` ;
        - `dump` → affiche toutes les paires triées par clé, `cle=valeur` séparées par des espaces (ligne vide si la config est vide).

        Termine par `lectures : R, écritures : W` (comptés avec des `AtomicUsize`).
      starter: |
        use std::collections::HashMap;
        use std::io::{self, Read};
        use std::sync::{Arc, RwLock};
        use std::thread;

        fn main() {
            let mut e = String::new();
            io::stdin().read_to_string(&mut e).unwrap();
        }
      solution: |
        use std::collections::HashMap;
        use std::io::{self, Read};
        use std::sync::atomic::{AtomicUsize, Ordering};
        use std::sync::{Arc, RwLock};
        use std::thread;

        fn main() {
            let mut e = String::new();
            io::stdin().read_to_string(&mut e).unwrap();
            let conf: Arc<RwLock<HashMap<String, String>>> = Arc::new(RwLock::new(HashMap::new()));
            let lectures = Arc::new(AtomicUsize::new(0));
            let ecritures = Arc::new(AtomicUsize::new(0));
            for ligne in e.lines() {
                let ligne = ligne.to_string();
                let c = Arc::clone(&conf);
                let lec = Arc::clone(&lectures);
                let ecr = Arc::clone(&ecritures);
                thread::spawn(move || {
                    let p: Vec<&str> = ligne.split_whitespace().collect();
                    match p[0] {
                        "set" => {
                            c.write().unwrap().insert(p[1].to_string(), p[2].to_string());
                            ecr.fetch_add(1, Ordering::SeqCst);
                        }
                        "get" => {
                            let g = c.read().unwrap();
                            match g.get(p[1]) {
                                Some(v) => println!("{} = {}", p[1], v),
                                None => println!("{} absente", p[1]),
                            }
                            lec.fetch_add(1, Ordering::SeqCst);
                        }
                        _ => {
                            let g = c.read().unwrap();
                            let mut paires: Vec<String> = g.iter().map(|(k, v)| format!("{}={}", k, v)).collect();
                            paires.sort();
                            println!("{}", paires.join(" "));
                            lec.fetch_add(1, Ordering::SeqCst);
                        }
                    }
                })
                .join()
                .unwrap();
            }
            println!("lectures : {}, écritures : {}", lectures.load(Ordering::SeqCst), ecritures.load(Ordering::SeqCst));
        }
      tests:
        - { input: "set port 80\nget port\nset port 8080\nset hote local\ndump\nget tls", output: "port = 80\nhote=local port=8080\ntls absente\nlectures : 3, écritures : 3" }
        - { input: "dump", output: "\nlectures : 1, écritures : 0", hidden: true }
      require:
        - { pattern: 'RwLock', message: Utiliser un RwLock }
