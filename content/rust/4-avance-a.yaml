  # ------------------------------------------------------------------
  - slug: rust-threads
    title: Threads
    summary: Crée et coordonne des threads système — spawn, join, valeurs de retour, move, sleep, Barrier et atomiques.
    minutes: 30
    concepts: [concurrence]
    sections:
      - title: Créer un thread
        body: |
          ```rust
          use std::thread;
          use std::time::Duration;

          let handle = thread::spawn(|| {
              for i in 1..=3 {
                  println!("thread : {i}");
                  thread::sleep(Duration::from_millis(10));
              }
              42                      // valeur de retour
          });

          println!("principal");
          let resultat = handle.join().unwrap();   // attend la fin et récupère 42
          ```

          ⚠️ L’ordre d’affichage entre threads **n’est pas déterministe**. Quand le thread principal se termine, le programme s’arrête, même si d’autres threads tournent encore : pense à `join()`.

          `join()` renvoie `Err` si le thread a paniqué : une panique ne se propage pas automatiquement.
      - title: move et données
        body: |
          Une closure passée à `spawn` doit être `'static` : elle ne peut pas emprunter des variables locales (le thread pourrait leur survivre). On utilise `move` :

          ```rust
          let v = vec![1, 2, 3];
          let h = thread::spawn(move || v.iter().sum::<i32>()); // v est déplacé
          ```

          Outils de coordination :

          - `std::sync::Barrier` : attendre que N threads atteignent un point ;
          - `std::sync::atomic::{AtomicUsize, AtomicBool, Ordering}` : compteurs et drapeaux sans verrou ;
          - `thread::Builder::new().name("worker".into()).spawn(...)` : nommer un thread ;
          - `thread::available_parallelism()` : nombre de cœurs disponibles.
