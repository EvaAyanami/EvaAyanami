          - { input: '', output: '3' }
      - id: rust-sp-q2
        type: mcq
        prompt: Quel trait permet d’utiliser `*` sur un type personnalisé ?
        choices: [Drop, Deref, Copy, Display]
        answer: 1
      - id: rust-sp-code
        type: code
        title: Arbre binaire de recherche
        prompt: |
          Implémente un arbre binaire de recherche :

          ```rust
          enum Arbre { Vide, Noeud(Box<Arbre>, i32, Box<Arbre>) }
          ```

          avec `inserer(self, x: i32) -> Arbre` (les doublons sont ignorés), `contient(&self, x: i32) -> bool` et `parcours(&self, out: &mut Vec<i32>)` (ordre croissant).

          Première ligne : les valeurs à insérer. Seconde ligne : les valeurs à chercher. Affiche le parcours, puis `oui`/`non` pour chaque recherche.
        starter: |
          use std::io::{self, Read};

          enum Arbre {
              Vide,
              Noeud(Box<Arbre>, i32, Box<Arbre>),
          }

          fn main() {
              let mut e = String::new();
              io::stdin().read_to_string(&mut e).unwrap();
          }
        solution: |
          use std::io::{self, Read};

          enum Arbre {
              Vide,
              Noeud(Box<Arbre>, i32, Box<Arbre>),
          }

          impl Arbre {
              fn inserer(self, x: i32) -> Arbre {
                  match self {
                      Arbre::Vide => Arbre::Noeud(Box::new(Arbre::Vide), x, Box::new(Arbre::Vide)),
                      Arbre::Noeud(g, v, d) => {
                          if x < v {
                              Arbre::Noeud(Box::new(g.inserer(x)), v, d)
                          } else if x > v {
                              Arbre::Noeud(g, v, Box::new(d.inserer(x)))
                          } else {
                              Arbre::Noeud(g, v, d)
                          }
                      }
                  }
              }
              fn contient(&self, x: i32) -> bool {
                  match self {
                      Arbre::Vide => false,
                      Arbre::Noeud(g, v, d) => {
                          if x == *v { true } else if x < *v { g.contient(x) } else { d.contient(x) }
                      }
                  }
              }
              fn parcours(&self, out: &mut Vec<i32>) {
                  if let Arbre::Noeud(g, v, d) = self {
                      g.parcours(out);
                      out.push(*v);
                      d.parcours(out);
                  }
              }
          }

          fn main() {
              let mut e = String::new();
              io::stdin().read_to_string(&mut e).unwrap();
              let mut l = e.lines();
              let mut a = Arbre::Vide;
              for x in l.next().unwrap().split_whitespace() {
                  a = a.inserer(x.parse().unwrap());
              }
              let mut out = Vec::new();
              a.parcours(&mut out);
              let s: Vec<String> = out.iter().map(|x| x.to_string()).collect();
              println!("{}", s.join(" "));
              for x in l.next().unwrap_or("").split_whitespace() {
                  println!("{}", if a.contient(x.parse().unwrap()) { "oui" } else { "non" });
              }
          }
        tests:
          - { input: "8 3 10 1 6 3 14\n6 7", output: "1 3 6 8 10 14\noui\nnon" }
          - { input: "5\n5 0", output: "5\noui\nnon", hidden: true }
        concepts: [smart-pointers]
    project:
      id: rust-sp-projet
      type: code
      title: Cache mémoïsé
      difficulty: 3
      prompt: |
        Crée `struct Calculateur { cache: RefCell<HashMap<u64, u64>>, calculs: Cell<u32> }` avec une méthode **`&self`** `fn collatz(&self, n: u64) -> u64` qui renvoie le nombre d’étapes de la suite de Syracuse pour atteindre 1 (n pair → n/2, sinon 3n+1), en **mémoïsant** chaque résultat. `calculs` compte le nombre de valeurs réellement calculées (absentes du cache).

        Pour chaque nombre lu, affiche `n : étapes`. Termine par `calculs : X`.
      starter: |
        use std::cell::{Cell, RefCell};
        use std::collections::HashMap;
        use std::io::{self, Read};

        fn main() {
            let mut e = String::new();
            io::stdin().read_to_string(&mut e).unwrap();
        }
      solution: |
        use std::cell::{Cell, RefCell};
        use std::collections::HashMap;
        use std::io::{self, Read};

        struct Calculateur {
            cache: RefCell<HashMap<u64, u64>>,
            calculs: Cell<u32>,
        }

        impl Calculateur {
            fn collatz(&self, n: u64) -> u64 {
                if n == 1 {
                    return 0;
                }
                if let Some(&v) = self.cache.borrow().get(&n) {
                    return v;
                }
                self.calculs.set(self.calculs.get() + 1);
                let suivant = if n % 2 == 0 { n / 2 } else { 3 * n + 1 };
                let r = 1 + self.collatz(suivant);
                self.cache.borrow_mut().insert(n, r);
                r
            }
        }

        fn main() {
            let mut e = String::new();
            io::stdin().read_to_string(&mut e).unwrap();
            let c = Calculateur { cache: RefCell::new(HashMap::new()), calculs: Cell::new(0) };
            for x in e.split_whitespace() {
                let n: u64 = x.parse().unwrap();
                println!("{} : {}", n, c.collatz(n));
            }
            println!("calculs : {}", c.calculs.get());
        }
      tests:
        - { input: '6 3 1', output: "6 : 8\n3 : 7\n1 : 0\ncalculs : 8" }
        - { input: '27 27', output: "27 : 111\n27 : 111\ncalculs : 111", hidden: true }
      hints: ['Attention : ne garde pas un `borrow()` actif pendant l’appel récursif, sinon `borrow_mut()` paniquera.']
    exam:
      pass: 70
      questions:
