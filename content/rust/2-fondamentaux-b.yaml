  # ------------------------------------------------------------------
  - slug: rust-result
    title: Result
    summary: Représente le succès ou l’échec d’une opération avec Result<T, E>, et propage les erreurs avec ?.
    minutes: 30
    concepts: [erreurs, result]
    sections:
      - title: Ok ou Err
        body: |
          ```rust
          enum Result<T, E> {
              Ok(T),    // succès, avec la valeur
              Err(E),   // échec, avec l’erreur
          }
          ```

          Exemple de la bibliothèque standard :

          ```rust
          let r: Result<i32, std::num::ParseIntError> = "42".parse::<i32>();
          match r {
              Ok(n) => println!("nombre : {n}"),
              Err(e) => println!("erreur : {e}"),
          }
          ```

          `"abc".parse::<i32>()` renvoie `Err(...)` avec le message *invalid digit found in string*.
      - title: Créer ses propres erreurs
        body: |
          ```rust
          fn racine(x: f64) -> Result<f64, String> {
              if x < 0.0 {
                  Err(format!("{x} est négatif"))
              } else {
                  Ok(x.sqrt())
              }
          }
          ```

          Pour un code plus robuste, on utilise une **enum d’erreurs** :

          ```rust
          #[derive(Debug)]
          enum ErreurRetrait {
              SoldeInsuffisant { manque: u64 },
              CompteBloque,
          }

          fn retirer(solde: u64, montant: u64) -> Result<u64, ErreurRetrait> {
              if montant > solde {
                  return Err(ErreurRetrait::SoldeInsuffisant { manque: montant - solde });
              }
              Ok(solde - montant)
          }
          ```
      - title: Propager avec ?
        body: |
          `?` extrait la valeur d’un `Ok`… ou **renvoie l’erreur** à l’appelant :

          ```rust
          fn somme_texte(a: &str, b: &str) -> Result<i32, std::num::ParseIntError> {
              let x = a.trim().parse::<i32>()?;
              let y = b.trim().parse::<i32>()?;
              Ok(x + y)
          }
          ```

          Méthodes pratiques : `unwrap_or`, `unwrap_or_else`, `map`, `map_err` (convertir l’erreur), `ok()` (→ `Option`), `is_ok()`, `expect("message")`.

          | Situation | Outil |
          |---|---|
          | Valeur peut manquer, ce n’est pas une erreur | `Option` |
          | Opération qui peut échouer, avec une raison | `Result` |
          | Bug impossible à récupérer | `panic!` |
    exercises:
