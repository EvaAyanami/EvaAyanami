    project:
      id: rust-opt-projet
      type: code
      title: Annuaire
      difficulty: 3
      prompt: |
        La première ligne contient un nombre `n` de contacts, suivis de `n` lignes `nom telephone`. Les lignes suivantes sont des recherches (un nom par ligne).

        Écris `fn chercher<'a>(annuaire: &'a [(String, String)], nom: &str) -> Option<&'a String>` et, pour chaque recherche, affiche `nom : telephone` ou `nom : inconnu`.

        Termine en affichant le nom le plus long de l’annuaire avec `iter().max_by_key(...)` (en cas d’égalité, le dernier rencontré).
      starter: |
        use std::io::{self, Read};

        fn main() {
            let mut e = String::new();
            io::stdin().read_to_string(&mut e).unwrap();
            let mut lignes = e.lines();
            let n: usize = lignes.next().unwrap().trim().parse().unwrap();
            let mut annuaire: Vec<(String, String)> = Vec::new();
            for _ in 0..n {
                let p: Vec<&str> = lignes.next().unwrap().split_whitespace().collect();
                annuaire.push((p[0].to_string(), p[1].to_string()));
            }
            for nom in lignes {
                // recherche
            }
        }
      solution: |
        use std::io::{self, Read};

        fn chercher<'a>(annuaire: &'a [(String, String)], nom: &str) -> Option<&'a String> {
            annuaire.iter().find(|(n, _)| n == nom).map(|(_, t)| t)
        }

        fn main() {
            let mut e = String::new();
            io::stdin().read_to_string(&mut e).unwrap();
            let mut lignes = e.lines();
            let n: usize = lignes.next().unwrap().trim().parse().unwrap();
            let mut annuaire: Vec<(String, String)> = Vec::new();
            for _ in 0..n {
                let p: Vec<&str> = lignes.next().unwrap().split_whitespace().collect();
                annuaire.push((p[0].to_string(), p[1].to_string()));
            }
            for nom in lignes {
                let nom = nom.trim();
                match chercher(&annuaire, nom) {
                    Some(t) => println!("{} : {}", nom, t),
                    None => println!("{} : inconnu", nom),
                }
            }
            if let Some((plus_long, _)) = annuaire.iter().max_by_key(|(n, _)| n.chars().count()) {
                println!("Nom le plus long : {}", plus_long);
            }
        }
      tests:
        - { input: "2\nAda 0601\nLinus 0702\nLinus\nGrace", output: "Linus : 0702\nGrace : inconnu\nNom le plus long : Linus" }
        - { input: "3\nBob 1\nAlice 2\nEve 3\nEve\nAlice\nbob", output: "Eve : 3\nAlice : 2\nbob : inconnu\nNom le plus long : Alice", hidden: true }
      hints: ['`iter().find(...)` renvoie un `Option`, que tu peux transformer avec `.map(...)`.']
