        concepts: [structs, classes]
      - id: rust-struct-code
        type: code
        title: Fraction
        prompt: |
          Crée une struct `Fraction { num: i64, den: i64 }` avec :

          - `fn new(num: i64, den: i64) -> Self` qui **simplifie** la fraction (via le PGCD) ;
          - `fn plus(&self, autre: &Fraction) -> Fraction`.

          Le programme lit deux fractions `a b` et `c d` (une par ligne) et affiche leur somme simplifiée `num/den`. Les dénominateurs sont positifs.
        starter: |
          use std::io;

          fn pgcd(a: i64, b: i64) -> i64 {
              if b == 0 { a.abs() } else { pgcd(b, a % b) }
          }

          // struct Fraction + impl ici

          fn lire() -> (i64, i64) {
              let mut s = String::new();
              io::stdin().read_line(&mut s).unwrap();
              let v: Vec<i64> = s.split_whitespace().map(|x| x.parse().unwrap()).collect();
              (v[0], v[1])
          }

          fn main() {
              let (a, b) = lire();
              let (c, d) = lire();
              let f = Fraction::new(a, b).plus(&Fraction::new(c, d));
              println!("{}/{}", f.num, f.den);
          }
        solution: |
          use std::io;

          fn pgcd(a: i64, b: i64) -> i64 {
              if b == 0 { a.abs() } else { pgcd(b, a % b) }
          }

          struct Fraction {
              num: i64,
              den: i64,
          }

          impl Fraction {
              fn new(num: i64, den: i64) -> Self {
                  let g = pgcd(num, den).max(1);
                  Self { num: num / g, den: den / g }
              }
              fn plus(&self, autre: &Fraction) -> Fraction {
                  Fraction::new(self.num * autre.den + autre.num * self.den, self.den * autre.den)
              }
          }

          fn lire() -> (i64, i64) {
              let mut s = String::new();
              io::stdin().read_line(&mut s).unwrap();
              let v: Vec<i64> = s.split_whitespace().map(|x| x.parse().unwrap()).collect();
              (v[0], v[1])
          }

          fn main() {
              let (a, b) = lire();
              let (c, d) = lire();
              let f = Fraction::new(a, b).plus(&Fraction::new(c, d));
              println!("{}/{}", f.num, f.den);
          }
        tests:
          - { input: "1 2\n1 3", output: 5/6 }
          - { input: "1 4\n1 4", output: 1/2, hidden: true }
          - { input: "-1 2\n1 2", output: 0/1, hidden: true }
          - { input: "2 6\n5 10", output: 5/6, hidden: true }
        concepts: [structs, classes]
    project:
      id: rust-struct-projet
      type: code
      title: Inventaire de jeu
      difficulty: 3
      prompt: |
        Crée une struct `Objet { nom: String, quantite: u32, prix: f64 }` et une struct `Inventaire { objets: Vec<Objet> }` avec les méthodes :

        - `ajouter(&mut self, nom: &str, quantite: u32, prix: f64)` — si l’objet existe déjà, augmente sa quantité ;
        - `valeur_totale(&self) -> f64`.

        Chaque ligne contient `nom quantite prix`. Affiche ensuite chaque objet (dans l’ordre d’ajout) au format `nom x quantite` puis `Total : <valeur avec 2 décimales>`.
      starter: |
        use std::io::{self, Read};

        fn main() {
            let mut entree = String::new();
            io::stdin().read_to_string(&mut entree).unwrap();
        }
      solution: |
        use std::io::{self, Read};

        struct Objet {
            nom: String,
            quantite: u32,
            prix: f64,
        }

        struct Inventaire {
            objets: Vec<Objet>,
        }

        impl Inventaire {
            fn new() -> Self {
                Self { objets: Vec::new() }
            }
            fn ajouter(&mut self, nom: &str, quantite: u32, prix: f64) {
                for o in &mut self.objets {
                    if o.nom == nom {
                        o.quantite += quantite;
                        return;
                    }
                }
                self.objets.push(Objet { nom: nom.to_string(), quantite, prix });
            }
            fn valeur_totale(&self) -> f64 {
                self.objets.iter().map(|o| o.quantite as f64 * o.prix).sum()
            }
        }

        fn main() {
            let mut entree = String::new();
            io::stdin().read_to_string(&mut entree).unwrap();
            let mut inv = Inventaire::new();
            for ligne in entree.lines() {
                let p: Vec<&str> = ligne.split_whitespace().collect();
                inv.ajouter(p[0], p[1].parse().unwrap(), p[2].parse().unwrap());
            }
            for o in &inv.objets {
                println!("{} x {}", o.nom, o.quantite);
            }
            println!("Total : {:.2}", inv.valeur_totale());
        }
      tests:
        - { input: "potion 3 2.5\nepee 1 40\npotion 2 2.5", output: "potion x 5\nepee x 1\nTotal : 52.50" }
        - { input: "pomme 10 0.3", output: "pomme x 10\nTotal : 3.00", hidden: true }
        - { input: "a 1 1\nb 2 2\na 3 1\nc 0 9.99", output: "a x 4\nb x 2\nc x 0\nTotal : 8.00", hidden: true }
      require:
        - { pattern: 'struct\s+Inventaire', message: Définir la struct Inventaire }
        - { pattern: 'fn\s+ajouter\s*\(\s*&mut\s+self', message: 'ajouter doit prendre &mut self' }
      concepts: [structs, classes]
    exam:
