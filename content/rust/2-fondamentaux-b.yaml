  # ------------------------------------------------------------------
  - slug: rust-pattern-matching
    title: Pattern matching
    summary: Maîtrise match, if let, while let, les gardes, les intervalles, la déstructuration et les liaisons avec @.
    minutes: 30
    concepts: [pattern-matching]
    sections:
      - title: Les motifs possibles
        body: |
          ```rust
          match valeur {
              0 => "zéro",                    // littéral
              1 | 2 => "un ou deux",          // alternative
              3..=9 => "chiffre",             // intervalle
              n if n < 0 => "négatif",        // garde (condition)
              n @ 10..=99 => { println!("{n}"); "deux chiffres" } // liaison @
              _ => "grand",                   // joker
          }
          ```

          Déstructuration de tuples, structs et tableaux :

          ```rust
          let (a, b) = (1, 2);
          match point {
              Point { x: 0, y } => println!("sur l’axe Y à {y}"),
              Point { x, y: 0 } => println!("sur l’axe X à {x}"),
              Point { .. } => println!("ailleurs"),   // .. ignore le reste
          }
          match tableau {
              [premier, .., dernier] => println!("{premier}…{dernier}"),
          }
          ```
      - title: if let et while let
        body: |
          Quand un seul cas t’intéresse, `if let` est plus concis qu’un `match` :

          ```rust
          let config: Option<u32> = Some(3);
          if let Some(n) = config {
              println!("valeur : {n}");
          } else {
              println!("pas de valeur");
          }
          ```

          `while let` boucle tant que le motif correspond :

          ```rust
          let mut pile = vec![1, 2, 3];
          while let Some(sommet) = pile.pop() {
              println!("{sommet}");   // 3, 2, 1
          }
          ```

          Et `let … else` (Rust 1.65+) sort tôt si le motif échoue :

          ```rust
          let Some(x) = valeur else { return; };
          ```
      - title: matches! et bonnes pratiques
        body: |
          La macro `matches!` renvoie un booléen :

          ```rust
          let est_voyelle = matches!(c, 'a' | 'e' | 'i' | 'o' | 'u' | 'y');
          ```

          Bonnes pratiques :

          - préfère un `match` exhaustif à un joker `_` quand c’est possible : le compilateur te protège lors des évolutions ;
          - l’ordre des bras compte : le **premier** motif qui correspond l’emporte ;
          - `match` est une expression : tous les bras renvoient le même type.
