      - id: rust-res-code
        type: code
        title: Validation de mot de passe
        prompt: |
          Écris `fn valider(mdp: &str) -> Result<(), String>` qui renvoie la **première** erreur rencontrée, dans cet ordre :

          1. `trop court` (moins de 8 caractères) ;
          2. `il manque un chiffre` ;
          3. `il manque une majuscule`.

          Pour chaque ligne, affiche `valide` ou `invalide : <raison>`.
        starter: |
          use std::io::{self, Read};

          fn main() {
              let mut e = String::new();
              io::stdin().read_to_string(&mut e).unwrap();
              for l in e.lines() {
