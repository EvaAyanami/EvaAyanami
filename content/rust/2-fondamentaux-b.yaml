      - id: rust-pm-code
        type: code
        title: Quadrants
        prompt: |
          Pour chaque ligne contenant deux entiers `x y`, affiche la position du point avec un `match` sur le tuple `(x, y)` :

          - `origine`, `axe X`, `axe Y`,
          - `quadrant 1` (x>0, y>0), `quadrant 2` (x<0, y>0), `quadrant 3` (x<0, y<0), `quadrant 4` (x>0, y<0).
        starter: |
          use std::io::{self, Read};

          fn position(x: i32, y: i32) -> &'static str {
              match (x, y) {
                  (0, 0) => "origine",
                  _ => todo!(),
              }
          }

          fn main() {
              let mut e = String::new();
              io::stdin().read_to_string(&mut e).unwrap();
              for l in e.lines() {
                  let v: Vec<i32> = l.split_whitespace().map(|x| x.parse().unwrap()).collect();
