          - { input: "12345678\nAZERTYUI9", output: "invalide : il manque une majuscule\nvalide", hidden: true }
        concepts: [result, erreurs]
    project:
      id: rust-res-projet
      type: code
      title: Lecteur de configuration
      difficulty: 3
      prompt: |
        Chaque ligne est censée être de la forme `cle=valeur_entiere`. Écris `fn analyser(ligne: &str) -> Result<(String, i64), String>` qui renvoie :

        - `Err("ligne N : '=' manquant")` si la ligne ne contient pas `=` ;
        - `Err("ligne N : valeur invalide")` si la valeur n’est pas un entier ;

        (`N` = numéro de ligne, à partir de 1 — passe-le en paramètre.)

        Affiche chaque erreur au fur et à mesure, puis `Somme : S` (somme des valeurs valides) et `Clés : k1, k2, …` (clés valides dans l’ordre).
      starter: |
        use std::io::{self, Read};

        fn main() {
            let mut e = String::new();
            io::stdin().read_to_string(&mut e).unwrap();
            for (i, ligne) in e.lines().enumerate() {
                // analyser(ligne, i + 1)
            }
        }
      solution: |
        use std::io::{self, Read};

        fn analyser(ligne: &str, num: usize) -> Result<(String, i64), String> {
            let (cle, valeur) = ligne.split_once('=').ok_or(format!("ligne {} : '=' manquant", num))?;
            let v = valeur.trim().parse::<i64>().map_err(|_| format!("ligne {} : valeur invalide", num))?;
            Ok((cle.trim().to_string(), v))
        }

        fn main() {
            let mut e = String::new();
            io::stdin().read_to_string(&mut e).unwrap();
            let mut somme = 0;
            let mut cles = Vec::new();
            for (i, ligne) in e.lines().enumerate() {
                match analyser(ligne, i + 1) {
                    Ok((c, v)) => {
                        somme += v;
                        cles.push(c);
                    }
                    Err(err) => println!("{}", err),
                }
            }
            println!("Somme : {}", somme);
            println!("Clés : {}", cles.join(", "));
        }
      tests:
        - { input: "port=8080\nhote\ntimeout=abc\nretries=3", output: "ligne 2 : '=' manquant\nligne 3 : valeur invalide\nSomme : 8083\nClés : port, retries" }
        - { input: "a=1\nb = -5", output: "Somme : -4\nClés : a, b", hidden: true }
        - { input: "x=\n=3", output: "ligne 1 : valeur invalide\nSomme : 3\nClés : ", hidden: true }
      hints: ['`split_once(''='')` renvoie un `Option<(&str, &str)>` ; `ok_or(...)` le transforme en `Result`.', '`map_err` permet de remplacer l’erreur de `parse` par ton propre message.']
