      - id: rust-struct-bug
        type: bugfix
        prompt: Ce programme ne compile pas. Trouve l’erreur.
        code: |
          struct Compteur { valeur: u32 }

          impl Compteur {
              fn incrementer(&self) {
                  self.valeur += 1;
              }
          }

          fn main() {
              let mut c = Compteur { valeur: 0 };
              c.incrementer();
              println!("{}", c.valeur);
          }
        bugLines: [4]
        choices:
          - La méthode modifie self mais ne le reçoit qu’en lecture (&self au lieu de &mut self)
          - Les struct ne peuvent pas contenir de u32
          - Il faut appeler Compteur::incrementer()
        answer: 0
        solution: |
          struct Compteur { valeur: u32 }

          impl Compteur {
              fn incrementer(&mut self) {
                  self.valeur += 1;
              }
          }

          fn main() {
              let mut c = Compteur { valeur: 0 };
              c.incrementer();
              println!("{}", c.valeur);
          }
        tests:
