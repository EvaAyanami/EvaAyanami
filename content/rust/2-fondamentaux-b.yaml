  # ------------------------------------------------------------------
  - slug: rust-enums
    title: Enums
    summary: Modélise des choix exclusifs avec les énumérations, y compris des variantes qui portent des données.
    minutes: 30
    concepts: [enums]
    sections:
      - title: Des variantes simples… ou riches
        body: |
          ```rust
          enum Direction {
              Nord,
              Sud,
              Est,
              Ouest,
          }
          let d = Direction::Nord;
          ```

          Contrairement à beaucoup de langages, chaque variante peut **porter des données différentes** :

          ```rust
          enum Message {
              Quitter,                         // aucune donnée
              Deplacer { x: i32, y: i32 },     // champs nommés
              Ecrire(String),                  // une String
              Couleur(u8, u8, u8),             // trois u8
          }
          ```

          On appelle cela un **type somme** : une valeur `Message` est *soit* `Quitter`, *soit* `Deplacer`, *soit*… jamais deux à la fois.
      - title: Exploiter une enum avec match
        body: |
          ```rust
          fn decrire(m: &Message) -> String {
              match m {
                  Message::Quitter => String::from("quitter"),
                  Message::Deplacer { x, y } => format!("aller en ({x}, {y})"),
                  Message::Ecrire(texte) => format!("écrire « {texte} »"),
                  Message::Couleur(r, g, b) => format!("couleur #{:02x}{:02x}{:02x}", r, g, b),
              }
          }
          ```

          Le compilateur **vérifie que toutes les variantes sont traitées**. Si tu ajoutes une variante plus tard, chaque `match` incomplet devient une erreur : impossible d’oublier un cas !
      - title: Méthodes sur une enum
        body: |
          Comme les structs, les enums peuvent avoir un bloc `impl` :

          ```rust
          #[derive(Debug, Clone, Copy, PartialEq)]
          enum Feu { Rouge, Orange, Vert }

          impl Feu {
              fn suivant(self) -> Feu {
                  match self {
                      Feu::Vert => Feu::Orange,
                      Feu::Orange => Feu::Rouge,
                      Feu::Rouge => Feu::Vert,
                  }
              }
              fn duree(&self) -> u32 {
                  match self { Feu::Rouge => 30, Feu::Orange => 5, Feu::Vert => 25 }
              }
          }
          ```

          `use Feu::*;` permet d’écrire `Rouge` au lieu de `Feu::Rouge`.
