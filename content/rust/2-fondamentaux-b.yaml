  # ------------------------------------------------------------------
  - slug: rust-gestion-erreurs
    title: Gestion des erreurs
    summary: panic! ou Result ? Conçois des types d’erreur, implémente Display, convertis avec From et organise la gestion d’erreurs d’un programme.
    minutes: 35
    concepts: [erreurs]
    sections:
      - title: Erreurs récupérables et irrécupérables
        body: |
          - **`panic!`** : bug ou état impossible. Le programme s’arrête (déroulement de la pile, message, code de sortie ≠ 0).
          - **`Result`** : échec prévisible (fichier absent, saisie invalide, réseau coupé) que l’appelant peut traiter.

          ```rust
          fn indice_valide(i: usize, n: usize) {
              assert!(i < n, "indice {} hors limites ({})", i, n); // panique si faux
          }
          ```

          Règle pratique : dans une **bibliothèque**, renvoie des `Result` ; `unwrap`/`expect` sont acceptables dans les prototypes, les tests, ou quand l’échec est réellement impossible.
      - title: Un type d’erreur soigné
        body: |
          ```rust
          use std::fmt;
          use std::num::ParseIntError;

          #[derive(Debug)]
          enum ErreurApp {
              Format(ParseIntError),
              Negatif(i64),
          }

          impl fmt::Display for ErreurApp {
              fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
                  match self {
                      ErreurApp::Format(e) => write!(f, "format invalide ({e})"),
                      ErreurApp::Negatif(n) => write!(f, "{n} est négatif"),
                  }
              }
          }

          impl std::error::Error for ErreurApp {}

          // Conversion automatique utilisée par `?`
          impl From<ParseIntError> for ErreurApp {
              fn from(e: ParseIntError) -> Self { ErreurApp::Format(e) }
          }

          fn lire_positif(s: &str) -> Result<i64, ErreurApp> {
              let n: i64 = s.trim().parse()?;   // ParseIntError → ErreurApp via From
              if n < 0 { return Err(ErreurApp::Negatif(n)); }
              Ok(n)
          }
          ```
      - title: Box<dyn Error> et l’écosystème
        body: |
          Pour une application, on peut accepter **n’importe quelle erreur** :

          ```rust
          use std::error::Error;

          fn main() -> Result<(), Box<dyn Error>> {
              let n: i32 = "42".parse()?;
              let contenu = std::fs::read_to_string("config.txt")?;
              println!("{n} {}", contenu.len());
              Ok(())
          }
          ```

          Dans l’écosystème, deux crates sont très répandues :

          - **thiserror** : dérive `Display`/`From` pour tes enums d’erreurs (bibliothèques) ;
          - **anyhow** : un type d’erreur unique avec contexte (`.context("lecture de la config")`) pour les applications.
    exercises:
      - id: rust-err-q1
        type: mcq
        prompt: Dans quel cas `panic!` est-il le choix approprié ?
        choices: [Une saisie utilisateur invalide, Un fichier introuvable, Un invariant interne violé (bug), Une connexion réseau coupée]
        answer: 2
        concepts: [erreurs]
      - id: rust-err-q2
        type: mcq
        prompt: Que permet d’implémenter `From<ParseIntError> for MonErreur` ?
        choices: ['Que ? convertisse automatiquement l’erreur', Que l’erreur s’affiche, Que l’erreur soit ignorée, Rien de particulier]
        answer: 0
      - id: rust-err-predict
        type: predict
        prompt: Que va afficher ce programme ?
        code: |
          use std::fmt;

          enum E { Vide, TropLong(usize) }

          impl fmt::Display for E {
              fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
                  match self {
                      E::Vide => write!(f, "vide"),
                      E::TropLong(n) => write!(f, "trop long ({})", n),
                  }
              }
          }

          fn check(s: &str) -> Result<&str, E> {
              if s.is_empty() { Err(E::Vide) }
              else if s.len() > 5 { Err(E::TropLong(s.len())) }
              else { Ok(s) }
          }

          fn main() {
              for s in ["", "abc", "abcdefgh"] {
                  match check(s) {
                      Ok(v) => println!("ok {}", v),
                      Err(e) => println!("{}", e),
                  }
              }
          }
        output: "vide\nok abc\ntrop long (8)"
      - id: rust-err-fill
        type: fill
        prompt: Complète la signature de `main` pour pouvoir utiliser `?` avec n’importe quelle erreur.
        code: |
