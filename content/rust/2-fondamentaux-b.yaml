        bugLines: [4]
        choices:
          - Le match n’est pas exhaustif, la variante Hiver n’est pas traitée
          - Une enum ne peut pas avoir quatre variantes
          - Il faut écrire Hiver en minuscules
        answer: 0
        solution: |
          enum Saison { Printemps, Ete, Automne, Hiver }

          fn temperature(s: Saison) -> i32 {
              match s {
                  Saison::Printemps => 15,
                  Saison::Ete => 28,
                  Saison::Automne => 12,
                  Saison::Hiver => 3,
              }
          }

          fn main() {
              println!("{}", temperature(Saison::Hiver));
          }
        tests:
          - { input: '', output: '3' }
      - id: rust-enum-code
        type: code
        title: Feu tricolore
        prompt: |
          Définis `enum Feu { Rouge, Orange, Vert }` avec une méthode `suivant(&self) -> Feu` (Vert → Orange → Rouge → Vert) et une méthode `nom(&self) -> &str`.

          Le programme lit le feu de départ (`Rouge`, `Orange` ou `Vert`) et un nombre `n`, puis affiche les `n` feux suivants, un par ligne.
        starter: |
          use std::io;

          // enum Feu + impl ici

          fn main() {
              let mut s = String::new();
              io::stdin().read_line(&mut s).unwrap();
              let p: Vec<&str> = s.split_whitespace().collect();
              let n: u32 = p[1].parse().unwrap();
              let mut feu = match p[0] {
                  "Rouge" => Feu::Rouge,
                  "Orange" => Feu::Orange,
                  _ => Feu::Vert,
              };
              for _ in 0..n {
                  feu = feu.suivant();
                  println!("{}", feu.nom());
              }
          }
        solution: |
          use std::io;

          enum Feu {
              Rouge,
              Orange,
              Vert,
          }

          impl Feu {
              fn suivant(&self) -> Feu {
                  match self {
                      Feu::Vert => Feu::Orange,
                      Feu::Orange => Feu::Rouge,
                      Feu::Rouge => Feu::Vert,
                  }
              }
              fn nom(&self) -> &str {
                  match self {
                      Feu::Rouge => "Rouge",
                      Feu::Orange => "Orange",
                      Feu::Vert => "Vert",
                  }
              }
          }

          fn main() {
              let mut s = String::new();
              io::stdin().read_line(&mut s).unwrap();
              let p: Vec<&str> = s.split_whitespace().collect();
              let n: u32 = p[1].parse().unwrap();
              let mut feu = match p[0] {
                  "Rouge" => Feu::Rouge,
                  "Orange" => Feu::Orange,
                  _ => Feu::Vert,
              };
              for _ in 0..n {
                  feu = feu.suivant();
                  println!("{}", feu.nom());
              }
          }
        tests:
          - { input: 'Vert 4', output: "Orange\nRouge\nVert\nOrange" }
          - { input: 'Rouge 1', output: Vert, hidden: true }
          - { input: 'Orange 3', output: "Rouge\nVert\nOrange", hidden: true }
        concepts: [enums]
    project:
      id: rust-enum-projet
      type: code
      title: Robot sur une grille
      difficulty: 3
      prompt: |
        Un robot démarre en `(0, 0)` orienté vers le **Nord**. Définis `enum Direction { Nord, Est, Sud, Ouest }` et `enum Commande { Avancer(i32), Gauche, Droite }`.

        Chaque ligne d’entrée est une commande : `A n` (avancer de n cases), `G` (tourner à gauche), `D` (tourner à droite). Nord = y+1, Est = x+1.

        À la fin, affiche `x y direction` (direction en toutes lettres : `Nord`, `Est`, `Sud`, `Ouest`).
      starter: |
        use std::io::{self, Read};

        fn main() {
            let mut entree = String::new();
            io::stdin().read_to_string(&mut entree).unwrap();
        }
      solution: |
        use std::io::{self, Read};

        #[derive(Clone, Copy)]
        enum Direction { Nord, Est, Sud, Ouest }

        enum Commande { Avancer(i32), Gauche, Droite }

        impl Direction {
            fn droite(self) -> Direction {
                match self {
                    Direction::Nord => Direction::Est,
                    Direction::Est => Direction::Sud,
                    Direction::Sud => Direction::Ouest,
                    Direction::Ouest => Direction::Nord,
                }
            }
            fn gauche(self) -> Direction {
                self.droite().droite().droite()
            }
            fn nom(self) -> &'static str {
                match self {
                    Direction::Nord => "Nord",
                    Direction::Est => "Est",
                    Direction::Sud => "Sud",
                    Direction::Ouest => "Ouest",
                }
            }
        }

        fn main() {
            let mut entree = String::new();
            io::stdin().read_to_string(&mut entree).unwrap();
            let (mut x, mut y, mut dir) = (0i32, 0i32, Direction::Nord);
            for ligne in entree.lines() {
                let p: Vec<&str> = ligne.split_whitespace().collect();
                let cmd = match p[0] {
                    "A" => Commande::Avancer(p[1].parse().unwrap()),
                    "G" => Commande::Gauche,
                    _ => Commande::Droite,
                };
                match cmd {
                    Commande::Gauche => dir = dir.gauche(),
                    Commande::Droite => dir = dir.droite(),
                    Commande::Avancer(n) => match dir {
                        Direction::Nord => y += n,
                        Direction::Sud => y -= n,
                        Direction::Est => x += n,
                        Direction::Ouest => x -= n,
                    },
                }
            }
            println!("{} {} {}", x, y, dir.nom());
        }
      tests:
        - { input: "A 3\nD\nA 2\nG\nG\nA 5", output: -3 3 Ouest }
        - { input: G, output: 0 0 Ouest, hidden: true }
        - { input: "D\nD\nA 4\nD\nA 1", output: -1 -4 Ouest, hidden: true }
      require:
        - { pattern: 'enum\s+Direction', message: Définir enum Direction }
        - { pattern: 'enum\s+Commande', message: Définir enum Commande }
      concepts: [enums]
    exam:
      pass: 70
