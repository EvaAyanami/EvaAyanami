        solution: |
          use std::io::{self, Read};

          fn position(x: i32, y: i32) -> &'static str {
              match (x, y) {
                  (0, 0) => "origine",
                  (_, 0) => "axe X",
                  (0, _) => "axe Y",
                  (x, y) if x > 0 && y > 0 => "quadrant 1",
                  (x, y) if x < 0 && y > 0 => "quadrant 2",
                  (x, y) if x < 0 && y < 0 => "quadrant 3",
                  _ => "quadrant 4",
              }
          }

          fn main() {
              let mut e = String::new();
              io::stdin().read_to_string(&mut e).unwrap();
              for l in e.lines() {
                  let v: Vec<i32> = l.split_whitespace().map(|x| x.parse().unwrap()).collect();
                  println!("{}", position(v[0], v[1]));
              }
          }
