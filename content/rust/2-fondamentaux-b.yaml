      solution: |
        use std::io::{self, Read};

        fn main() {
            let mut e = String::new();
            io::stdin().read_to_string(&mut e).unwrap();
            for l in e.lines() {
                let p: Vec<&str> = l.split_whitespace().collect();
                let a: i64 = p[0].parse().unwrap();
                let b: i64 = p[2].parse().unwrap();
                match (p[1], b) {
                    ("/" | "%", 0) => println!("erreur : division par zéro"),
                    ("+", b) => println!("{}", a + b),
                    ("-", b) => println!("{}", a - b),
                    ("*", b) => println!("{}", a * b),
                    ("/", b) => println!("{}", a / b),
                    ("%", b) => println!("{}", a % b),
                    _ => println!("erreur : opérateur inconnu"),
                }
            }
        }
