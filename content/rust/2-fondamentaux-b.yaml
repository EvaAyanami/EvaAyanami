language: rust
level: 2
chapters:
  # ------------------------------------------------------------------
  - slug: rust-structs
    title: Structs
    summary: Crée tes propres types avec struct, ajoute des méthodes avec impl et des constructeurs associés.
    minutes: 35
    concepts: [structs, classes]
    sections:
      - title: Définir et instancier une struct
        body: |
          ```rust
          struct Joueur {
              nom: String,
              niveau: u32,
              actif: bool,
          }

          fn main() {
              let mut j = Joueur {
                  nom: String::from("Kiri"),
                  niveau: 1,
                  actif: true,
              };
              j.niveau += 1;               // la variable entière doit être mut
              println!("{} niv. {}", j.nom, j.niveau);
          }
          ```

          Raccourcis utiles :

          ```rust
          let nom = String::from("Ada");
          let a = Joueur { nom, niveau: 3, actif: true };   // nom: nom
          let b = Joueur { nom: String::from("Bob"), ..a };  // reste copié de a
          ```

          Variantes : la **tuple struct** `struct Point(i32, i32);` et la **unit struct** `struct Marqueur;`.
      - title: Méthodes avec impl
        body: |
          ```rust
          struct Rectangle { largeur: f64, hauteur: f64 }

          impl Rectangle {
              // Fonction associée (constructeur) : pas de self
              fn new(largeur: f64, hauteur: f64) -> Self {
                  Self { largeur, hauteur }
              }
              fn carre(c: f64) -> Self { Self::new(c, c) }

              // Méthodes : premier paramètre self
              fn aire(&self) -> f64 { self.largeur * self.hauteur }
              fn agrandir(&mut self, facteur: f64) {
                  self.largeur *= facteur;
                  self.hauteur *= facteur;
              }
              fn peut_contenir(&self, autre: &Rectangle) -> bool {
                  self.largeur >= autre.largeur && self.hauteur >= autre.hauteur
              }
          }

          let mut r = Rectangle::new(2.0, 3.0);  // appel avec ::
          r.agrandir(2.0);                        // appel avec .
          println!("{}", r.aire());               // 24
          ```

          - `&self` : lecture ; `&mut self` : modification ; `self` : consomme l’objet.
          - `Self` désigne le type en cours (`Rectangle`).
      - title: Afficher une struct
        body: |
          `println!("{}", r)` ne compile pas : Rust ne sait pas comment afficher ton type. Deux solutions :

          ```rust
          #[derive(Debug)]                 // affichage développeur automatique
          struct Point { x: i32, y: i32 }

          println!("{:?}", Point { x: 1, y: 2 });  // Point { x: 1, y: 2 }
          println!("{:#?}", Point { x: 1, y: 2 }); // version indentée
          ```

          Ou implémenter le trait `Display` pour un affichage personnalisé :

          ```rust
          use std::fmt;
          impl fmt::Display for Point {
              fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
                  write!(f, "({}, {})", self.x, self.y)
              }
          }
          ```

          D’autres traits se dérivent : `Clone`, `Copy`, `PartialEq` (pour `==`), `Default`…
    exercises:
