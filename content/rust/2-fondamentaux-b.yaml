  # ------------------------------------------------------------------
  - slug: rust-option
    title: Option
    summary: Représente l’absence de valeur sans null grâce à Option<T>, et manipule-la avec match, unwrap_or, map et ?.
    minutes: 30
    concepts: [option]
    sections:
      - title: Pas de null en Rust
        body: |
          Tony Hoare, l’inventeur de `null`, l’a qualifié d’« erreur à un milliard de dollars ». Rust ne l’a pas : une valeur qui peut être absente est de type **`Option<T>`** :

          ```rust
          enum Option<T> {
              Some(T),
              None,
          }
          ```

          ```rust
          fn trouver_indice(v: &[i32], cible: i32) -> Option<usize> {
              for (i, &x) in v.iter().enumerate() {
                  if x == cible { return Some(i); }
              }
              None
          }
          ```

          Le type `Option<usize>` **force** l’appelant à envisager l’absence : impossible d’utiliser la valeur comme un `usize` directement.
      - title: Extraire la valeur
        body: |
          ```rust
          let r = trouver_indice(&[4, 8, 15], 8);

          match r {                                // exhaustif
              Some(i) => println!("trouvé en {i}"),
              None => println!("absent"),
          }
          if let Some(i) = r { /* … */ }           // un seul cas

          let i = r.unwrap_or(0);                  // valeur par défaut
          let i = r.unwrap_or_default();           // défaut du type (0)
          let i = r.expect("doit exister");        // panique avec message si None
          let i = r.unwrap();                      // panique si None (à éviter !)
          ```

          `is_some()` / `is_none()` testent la présence.
      - title: Transformer sans extraire
        body: |
          ```rust
          let age: Option<u32> = Some(17);
          let majeur = age.map(|a| a >= 18);          // Some(false)
          let double = age.map(|a| a * 2);            // Some(34)
          let filtre = age.filter(|&a| a > 20);       // None
          let suivant = age.and_then(|a| a.checked_sub(20)); // None (évite le dépassement)
          ```

          Dans une fonction qui renvoie elle-même un `Option`, l’opérateur **`?`** renvoie `None` immédiatement si la valeur est absente :

          ```rust
          fn initiale_du_premier(noms: &[&str]) -> Option<char> {
              let premier = noms.first()?;    // None → la fonction renvoie None
              premier.chars().next()
          }
          ```

          De nombreuses méthodes de la bibliothèque standard renvoient des `Option` : `v.get(i)`, `v.first()`, `s.find('x')`, `iter.max()`, `str.parse().ok()`…
