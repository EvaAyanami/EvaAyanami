      - id: rust-enum-bug
        type: bugfix
        prompt: Ce programme ne compile pas (E0004). Trouve la ligne du problème.
        code: |
          enum Saison { Printemps, Ete, Automne, Hiver }

          fn temperature(s: Saison) -> i32 {
              match s {
                  Saison::Printemps => 15,
                  Saison::Ete => 28,
                  Saison::Automne => 12,
