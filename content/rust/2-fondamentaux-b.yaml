        solution: |
          use std::io::{self, Read};

          fn valider(mdp: &str) -> Result<(), String> {
              if mdp.chars().count() < 8 {
                  return Err(String::from("trop court"));
              }
              if !mdp.chars().any(|c| c.is_ascii_digit()) {
                  return Err(String::from("il manque un chiffre"));
              }
              if !mdp.chars().any(|c| c.is_uppercase()) {
                  return Err(String::from("il manque une majuscule"));
              }
              Ok(())
          }

          fn main() {
              let mut e = String::new();
              io::stdin().read_to_string(&mut e).unwrap();
              for l in e.lines() {
                  match valider(l) {
                      Ok(()) => println!("valide"),
                      Err(raison) => println!("invalide : {}", raison),
                  }
              }
          }
