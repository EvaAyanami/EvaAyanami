        output: 'Point { x: 4, y: 0 } false'
        concepts: [structs]
      - id: rust-struct-fill
        type: fill
        prompt: Complète la méthode `aire` et le constructeur.
        code: |
          struct Carre { cote: u32 }

          impl Carre {
