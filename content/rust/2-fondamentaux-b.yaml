      - id: rust-err-code
        type: code
        title: Moyenne robuste
        prompt: |
          Chaque ligne doit contenir une note entière entre 0 et 20. Écris `fn lire_note(s: &str) -> Result<u32, String>` qui renvoie `Err("'<s>' n'est pas un nombre")` ou `Err("<n> hors limites")`.

          Affiche chaque erreur, puis `Moyenne : X` (2 décimales) des notes valides, ou `Aucune note valide`.
        starter: |
          use std::io::{self, Read};

          fn main() {
              let mut e = String::new();
              io::stdin().read_to_string(&mut e).unwrap();
          }
        solution: |
          use std::io::{self, Read};

          fn lire_note(s: &str) -> Result<u32, String> {
              let n: i64 = s.trim().parse().map_err(|_| format!("'{}' n'est pas un nombre", s.trim()))?;
              if !(0..=20).contains(&n) {
                  return Err(format!("{} hors limites", n));
              }
              Ok(n as u32)
          }

          fn main() {
              let mut e = String::new();
              io::stdin().read_to_string(&mut e).unwrap();
              let mut notes = Vec::new();
              for l in e.lines() {
                  match lire_note(l) {
                      Ok(n) => notes.push(n),
                      Err(err) => println!("{}", err),
                  }
              }
              if notes.is_empty() {
                  println!("Aucune note valide");
              } else {
                  let total: u32 = notes.iter().sum();
                  println!("Moyenne : {:.2}", total as f64 / notes.len() as f64);
              }
          }
        tests:
          - { input: "12\nabc\n25\n15", output: "'abc' n'est pas un nombre\n25 hors limites\nMoyenne : 13.50" }
          - { input: "-1\nx", output: "-1 hors limites\n'x' n'est pas un nombre\nAucune note valide", hidden: true }
          - { input: "20\n0\n7", output: 'Moyenne : 9.00', hidden: true }
        concepts: [erreurs, result]
    project:
      id: rust-err-projet
      type: code
      title: Distributeur automatique
      difficulty: 3
      prompt: |
        Implémente un distributeur avec une enum `ErreurDistrib { ProduitInconnu(String), StockEpuise(String), CreditInsuffisant { manque: u32 } }` qui implémente `Display`.

        Le stock initial : `cafe` (prix 120, stock 2), `the` (100, 1), `eau` (80, 5). Chaque ligne d’entrée est une commande `produit credit`.

        Pour chaque commande, affiche `OK : <produit>, monnaie <credit - prix>` ou `Erreur : <message>` avec les messages :

        - `produit inconnu (<nom>)`
        - `stock épuisé (<nom>)`
        - `crédit insuffisant, il manque <manque>`
      starter: |
        use std::io::{self, Read};

        fn main() {
            let mut e = String::new();
            io::stdin().read_to_string(&mut e).unwrap();
        }
      solution: |
        use std::fmt;
        use std::io::{self, Read};

        enum ErreurDistrib {
            ProduitInconnu(String),
            StockEpuise(String),
            CreditInsuffisant { manque: u32 },
        }

        impl fmt::Display for ErreurDistrib {
            fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
                match self {
                    ErreurDistrib::ProduitInconnu(n) => write!(f, "produit inconnu ({})", n),
                    ErreurDistrib::StockEpuise(n) => write!(f, "stock épuisé ({})", n),
                    ErreurDistrib::CreditInsuffisant { manque } => write!(f, "crédit insuffisant, il manque {}", manque),
                }
            }
        }

        struct Produit {
            nom: String,
            prix: u32,
            stock: u32,
        }

        fn acheter(stock: &mut Vec<Produit>, nom: &str, credit: u32) -> Result<u32, ErreurDistrib> {
            let p = stock
                .iter_mut()
                .find(|p| p.nom == nom)
                .ok_or(ErreurDistrib::ProduitInconnu(nom.to_string()))?;
            if p.stock == 0 {
                return Err(ErreurDistrib::StockEpuise(nom.to_string()));
            }
            if credit < p.prix {
                return Err(ErreurDistrib::CreditInsuffisant { manque: p.prix - credit });
            }
            p.stock -= 1;
            Ok(credit - p.prix)
        }

        fn main() {
            let mut e = String::new();
            io::stdin().read_to_string(&mut e).unwrap();
            let mut stock = vec![
                Produit { nom: "cafe".into(), prix: 120, stock: 2 },
                Produit { nom: "the".into(), prix: 100, stock: 1 },
                Produit { nom: "eau".into(), prix: 80, stock: 5 },
            ];
            for l in e.lines() {
                let p: Vec<&str> = l.split_whitespace().collect();
                let credit: u32 = p[1].parse().unwrap();
                match acheter(&mut stock, p[0], credit) {
                    Ok(monnaie) => println!("OK : {}, monnaie {}", p[0], monnaie),
                    Err(err) => println!("Erreur : {}", err),
                }
            }
        }
      tests:
        - { input: "cafe 200\nthe 50\nsoda 100\nthe 100\nthe 100", output: "OK : cafe, monnaie 80\nErreur : crédit insuffisant, il manque 50\nErreur : produit inconnu (soda)\nOK : the, monnaie 0\nErreur : stock épuisé (the)" }
        - { input: "cafe 120\ncafe 120\ncafe 500\neau 79", output: "OK : cafe, monnaie 0\nOK : cafe, monnaie 0\nErreur : stock épuisé (cafe)\nErreur : crédit insuffisant, il manque 1", hidden: true }
      require:
        - { pattern: 'enum\s+ErreurDistrib', message: Définir enum ErreurDistrib }
        - { pattern: 'impl\s+(std::)?fmt::Display\s+for\s+ErreurDistrib|impl\s+Display\s+for\s+ErreurDistrib', message: Implémenter Display pour ErreurDistrib }
    exam:
      pass: 70
      questions:
        - id: rust-err-ex1
          type: mcq
          prompt: Quel trait faut-il implémenter pour afficher une erreur avec `{}` ?
          choices: [Debug, Display, Error, From]
          answer: 1
        - id: rust-err-ex2
          type: mcq
          prompt: Quelle crate est conçue pour simplifier les erreurs dans une **application** (avec contexte) ?
          choices: [serde, anyhow, tokio, rand]
          answer: 1
        - id: rust-err-ex3
          type: predict
          prompt: Que va afficher ce programme ?
          code: |
            fn etape(n: i32) -> Result<i32, String> {
                if n > 10 { Err(format!("{} trop grand", n)) } else { Ok(n * 3) }
            }
            fn chaine(n: i32) -> Result<i32, String> {
                let a = etape(n)?;
                let b = etape(a)?;
                Ok(b)
            }
            fn main() {
                println!("{:?}", chaine(2));
                println!("{:?}", chaine(5));
            }
          output: "Ok(18)\nErr(\"15 trop grand\")"
        - id: rust-err-ex4
          type: mcq
          prompt: Que fait `assert!(cond, "msg")` si `cond` est faux ?
          choices: [Renvoie Err, Panique avec le message, Affiche un avertissement, Rien en mode debug]
          answer: 1
