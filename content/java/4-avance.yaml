  - slug: java-gc
    title: Garbage Collector
    summary: Comment la JVM libère la mémoire — accessibilité, générations, G1/ZGC, fuites de mémoire en Java et références faibles.
    minutes: 30
    concepts: [memoire]
    sections:
      - title: Accessibilité et générations
        body: |
          Le GC libère les objets **inaccessibles** : aucun chemin de références depuis les **racines** (variables locales des threads actifs, attributs statiques, références JNI). Les cycles d’objets inaccessibles sont collectés aussi (contrairement au comptage de références).

          **Hypothèse générationnelle** : la plupart des objets meurent jeunes. Le tas est découpé :

          - **jeune génération** (Eden + survivants) : collectée souvent et rapidement ;
          - **vieille génération** : objets ayant survécu à plusieurs collectes.

          Collecteurs : **G1** (défaut, équilibré), **ZGC** (pauses < 1 ms, gros tas), **Parallel** (débit), **Serial** (petits conteneurs).
      - title: Fuites et réglages
        body: |
          Une « fuite » en Java = des objets encore **référencés** par erreur :

          - collections statiques qui grossissent sans fin (caches) ;
          - listeners jamais désinscrits ;
          - `ThreadLocal` non nettoyés dans les pools.

          Outils : `-Xmx512m` (taille max), `-XX:+UseZGC`, `-Xlog:gc`, `jcmd <pid> GC.heap_info`, analyse de *heap dump* (Eclipse MAT, VisualVM, JFR).

          `WeakReference<T>` / `WeakHashMap` : références qui n’empêchent pas la collecte — utiles pour des caches. `System.gc()` n’est qu’une **suggestion**.
    exercises:
      - id: java-gc-q1
        type: mcq
        prompt: Quand un objet devient-il éligible au garbage collector ?
        choices: ['Quand il n’est plus accessible depuis les racines', 'Quand on appelle delete', 'Après 1 seconde', 'Quand son compteur de références vaut 0 uniquement']
        answer: 0
      - id: java-gc-q2
        type: mcq
        prompt: Deux objets qui se référencent mutuellement mais inaccessibles seront-ils collectés ?
        choices: ['Oui', 'Non, c’est une fuite', 'Seulement avec ZGC', 'Seulement après System.gc()']
        answer: 0
      - id: java-gc-q3
        type: mcq
        prompt: Quelle situation provoque une fuite mémoire en Java ?
        choices: ['Un cache statique qui ne supprime jamais d’entrées', 'Créer beaucoup d’objets temporaires', 'Utiliser des lambdas', 'Appeler new dans une boucle']
        answer: 0
      - id: java-gc-code
        type: code
        title: Simulateur mark & sweep
        prompt: |
          Simule un GC. Lignes : `obj A`, `ref A B` (A référence B), `unref A B`, `racine A`, `noracine A`, `gc`. Lors d’un `gc`, marque tous les objets accessibles depuis les racines (parcours de graphe), supprime les autres (et leurs références) et affiche `gc : collectés [triés]` (`aucun` si vide). Termine par `vivants : [triés]`.
        starter: |
          import java.util.*;

          public class Main {
              public static void main(String[] args) {
                  Scanner sc = new Scanner(System.in);
              }
          }
        solution: |
          import java.util.*;

          public class Main {
              public static void main(String[] args) {
                  Scanner sc = new Scanner(System.in);
                  Map<String, Set<String>> tas = new TreeMap<>();
                  Set<String> racines = new HashSet<>();
                  while (sc.hasNext()) {
                      switch (sc.next()) {
                          case "obj" -> tas.put(sc.next(), new HashSet<>());
                          case "ref" -> { String a = sc.next(), b = sc.next(); tas.get(a).add(b); }
                          case "unref" -> { String a = sc.next(), b = sc.next(); tas.get(a).remove(b); }
                          case "racine" -> racines.add(sc.next());
                          case "noracine" -> racines.remove(sc.next());
                          default -> {
                              Set<String> marques = new HashSet<>();
                              Deque<String> pile = new ArrayDeque<>(racines);
                              while (!pile.isEmpty()) {
                                  String o = pile.pop();
                                  if (tas.containsKey(o) && marques.add(o)) pile.addAll(tas.get(o));
                              }
                              List<String> morts = new ArrayList<>();
                              for (String o : tas.keySet()) if (!marques.contains(o)) morts.add(o);
                              morts.forEach(tas::remove);
                              System.out.println("gc : " + (morts.isEmpty() ? "aucun" : String.join(" ", morts)));
                          }
                      }
                  }
                  System.out.println("vivants : " + tas.keySet());
              }
          }
        tests:
          - { input: "obj A\nobj B\nobj C\nobj D\nracine A\nref A B\nref C D\nref D C\ngc\nunref A B\ngc\nracine C\ngc", output: "gc : C D\ngc : B\ngc : aucun\nvivants : [A]" }
          - { input: "obj X\ngc", output: "gc : X\nvivants : []", hidden: true }
        concepts: [memoire]
    project:
      id: java-gc-projet
      type: code
      title: GC générationnel simplifié
      difficulty: 3
      prompt: |
        Simule un GC à deux générations. Commandes : `new NOM` (crée dans la jeune génération), `root NOM` / `unroot NOM`, `ref A B`, `minor` (collecte la jeune génération : un jeune objet accessible survit et son âge augmente ; à l’âge 2 il est promu en vieille génération), `major` (collecte tout le tas).

        L’accessibilité se calcule depuis les racines sur tout le graphe. Après chaque collecte affiche `minor : morts=[…] promus=[…]` ou `major : morts=[…]` (listes triées, crochets vides si rien). Termine par `jeunes=[…] vieux=[…]`.
      starter: |
        import java.util.*;

        public class Main {
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
            }
        }
      solution: |
        import java.util.*;

        public class Main {
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
                Map<String, Set<String>> refs = new HashMap<>();
                Map<String, Integer> jeunes = new TreeMap<>();
                Set<String> vieux = new TreeSet<>(), racines = new HashSet<>();
                while (sc.hasNext()) {
                    String c = sc.next();
                    switch (c) {
                        case "new" -> { String n = sc.next(); jeunes.put(n, 0); refs.put(n, new HashSet<>()); }
                        case "root" -> racines.add(sc.next());
                        case "unroot" -> racines.remove(sc.next());
                        case "ref" -> { String a = sc.next(), b = sc.next(); refs.get(a).add(b); }
                        default -> {
                            Set<String> vivants = new HashSet<>();
                            Deque<String> pile = new ArrayDeque<>(racines);
                            while (!pile.isEmpty()) {
                                String o = pile.pop();
                                if (refs.containsKey(o) && vivants.add(o)) pile.addAll(refs.get(o));
                            }
                            List<String> morts = new ArrayList<>(), promus = new ArrayList<>();
                            for (String o : new ArrayList<>(jeunes.keySet())) {
                                if (!vivants.contains(o)) { morts.add(o); jeunes.remove(o); refs.remove(o); }
                                else if (c.equals("minor")) {
                                    int age = jeunes.get(o) + 1;
                                    if (age >= 2) { jeunes.remove(o); vieux.add(o); promus.add(o); } else jeunes.put(o, age);
                                }
                            }
                            if (c.equals("major")) {
                                for (String o : new ArrayList<>(vieux)) if (!vivants.contains(o)) { morts.add(o); vieux.remove(o); refs.remove(o); }
                                Collections.sort(morts);
                                System.out.println("major : morts=" + morts);
                            } else {
                                System.out.println("minor : morts=" + morts + " promus=" + promus);
                            }
                        }
                    }
                }
                System.out.println("jeunes=" + jeunes.keySet() + " vieux=" + vieux);
            }
        }
      tests:
