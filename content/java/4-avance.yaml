        tests:
          - { input: '', output: '400' }
      - id: java-sync-code
        type: code
        title: Compteur de mots concurrent
        prompt: 'Chaque ligne d’entrée est traitée par **un thread** qui compte ses mots (en minuscules) dans une `ConcurrentHashMap<String, Integer>` partagée avec `merge`. Après avoir joint tous les threads, affiche les mots triés `mot : n`.'
        starter: |
          import java.util.*;
          import java.util.concurrent.*;

          public class Main {
              public static void main(String[] args) throws InterruptedException {
                  Scanner sc = new Scanner(System.in);
                  List<String> lignes = new ArrayList<>();
                  while (sc.hasNextLine()) lignes.add(sc.nextLine());
              }
          }
        solution: |
          import java.util.*;
          import java.util.concurrent.*;

          public class Main {
              public static void main(String[] args) throws InterruptedException {
                  Scanner sc = new Scanner(System.in);
                  List<String> lignes = new ArrayList<>();
                  while (sc.hasNextLine()) lignes.add(sc.nextLine());
                  ConcurrentHashMap<String, Integer> freq = new ConcurrentHashMap<>();
                  List<Thread> ts = new ArrayList<>();
                  for (String l : lignes) {
                      Thread t = new Thread(() -> {
                          for (String m : l.toLowerCase().split("\\s+")) if (!m.isEmpty()) freq.merge(m, 1, Integer::sum);
                      });
                      ts.add(t);
                      t.start();
                  }
                  for (Thread t : ts) t.join();
                  new TreeMap<>(freq).forEach((m, n) -> System.out.println(m + " : " + n));
              }
          }
        tests:
          - { input: "le chat\nLe chien\nle chat dort", output: "chat : 2\nchien : 1\ndort : 1\nle : 3" }
          - { input: a a a, output: 'a : 3', hidden: true }
        require:
          - { pattern: 'ConcurrentHashMap', message: Utiliser une ConcurrentHashMap }
    project:
      id: java-sync-projet
      type: code
      title: Virements sans interblocage
      difficulty: 3
      prompt: |
        `n` comptes (solde initial lu). Chaque virement `de vers montant` est exécuté dans **son propre thread** : il verrouille les deux comptes (`ReentrantLock` par compte) **toujours dans l’ordre croissant des identifiants** pour éviter l’interblocage, et n’effectue le virement que si le solde suffit (compte un refus sinon).

        Entrée : `n`, les soldes, puis des lignes de virements. Comme les threads s’exécutent dans un ordre quelconque, les refus dépendraient de l’ordre : ici, tous les virements sont **finançables** sauf mention contraire et la sortie attendue est `total : T` (conservé) puis `refus : R`.
      starter: |
        import java.util.*;
        import java.util.concurrent.locks.*;

        public class Main {
            public static void main(String[] args) throws InterruptedException {
                Scanner sc = new Scanner(System.in);
            }
        }
      solution: |
        import java.util.*;
        import java.util.concurrent.atomic.AtomicInteger;
        import java.util.concurrent.locks.*;

        public class Main {
            public static void main(String[] args) throws InterruptedException {
                Scanner sc = new Scanner(System.in);
                int n = sc.nextInt();
                long[] solde = new long[n];
                ReentrantLock[] verrous = new ReentrantLock[n];
                for (int i = 0; i < n; i++) { solde[i] = sc.nextLong(); verrous[i] = new ReentrantLock(); }
                AtomicInteger refus = new AtomicInteger();
                List<Thread> ts = new ArrayList<>();
                while (sc.hasNextInt()) {
                    int de = sc.nextInt(), vers = sc.nextInt();
                    long m = sc.nextLong();
                    Thread t = new Thread(() -> {
                        ReentrantLock a = verrous[Math.min(de, vers)], b = verrous[Math.max(de, vers)];
                        a.lock();
                        try {
                            b.lock();
                            try {
                                if (solde[de] >= m) { solde[de] -= m; solde[vers] += m; }
                                else refus.incrementAndGet();
                            } finally { b.unlock(); }
                        } finally { a.unlock(); }
                    });
                    ts.add(t);
                    t.start();
                }
                for (Thread t : ts) t.join();
                long total = 0;
                for (long s : solde) total += s;
                System.out.println("total : " + total);
                System.out.println("refus : " + refus.get());
            }
        }
      tests:
        - { input: "3\n1000 1000 1000\n0 1 10\n1 0 10\n1 2 20\n2 0 5\n0 2 7", output: "total : 3000\nrefus : 0" }
        - { input: "2\n0 10\n0 1 50", output: "total : 10\nrefus : 1", hidden: true }
      require:
        - { pattern: 'ReentrantLock', message: Utiliser des ReentrantLock }
    exam:
      pass: 70
      questions:
        - id: java-sync-ex1
          type: mcq
          prompt: Comment éviter un interblocage entre deux verrous ?
          choices: ['Toujours les acquérir dans le même ordre', 'Utiliser volatile', 'Ajouter des sleep', 'Utiliser plus de threads']
          answer: 0
        - id: java-sync-ex2
          type: mcq
          prompt: Pourquoi appeler unlock() dans un bloc finally ?
          choices: ['Pour libérer le verrou même si une exception est levée', 'Par convention de style', 'Pour la performance', 'C’est obligatoire syntaxiquement']
          answer: 0
        - id: java-sync-ex3
          type: mcq
          prompt: Quelle structure est adaptée au modèle producteur/consommateur ?
          choices: ['BlockingQueue', 'HashMap', 'ArrayList', 'TreeSet']
          answer: 0

