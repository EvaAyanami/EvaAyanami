  # ------------------------------------------------------------------
  - slug: java-jvm
    title: JVM
    summary: Fonctionnement de la JVM — bytecode, chargement des classes, zones mémoire, JIT, javap et options de démarrage.
    minutes: 30
    concepts: [compilation]
    sections:
      - title: Du source au bytecode
        body: |
          `javac` compile le Java en **bytecode** (`.class`), indépendant de la plateforme. La JVM l’exécute :

          1. **chargement** des classes à la demande par les *class loaders* (bootstrap → plateforme → application) ;
          2. **vérification** du bytecode (sécurité), préparation, résolution ;
          3. **initialisation** (blocs `static`) ;
          4. **exécution** : interprétée d’abord, puis compilée en code machine par le **JIT** (C1 puis C2) pour les méthodes « chaudes ».

          ```bash
          javap -c Main.class
          # 0: iconst_2   1: iconst_3   2: iadd   3: istore_1 ...
          ```

          Le bytecode est une **machine à pile** : les instructions dépilent leurs opérandes et empilent leur résultat.
      - title: Zones mémoire et options
        body: |
          | Zone | Contenu |
          |---|---|
          | Tas (heap) | objets, tableaux (partagé, géré par le GC) |
          | Pile de chaque thread | cadres d’appel, variables locales, pile d’opérandes |
          | Metaspace | métadonnées des classes |
          | Code cache | code compilé par le JIT |

          Options utiles : `-Xmx`/`-Xms` (tas), `-Xss` (pile), `-XX:+PrintFlagsFinal`, `-XX:TieredStopAtLevel=1` (démarrage rapide). Outils : `jcmd`, `jstack` (threads), **JFR** (profilage en production), **GraalVM native-image** (compilation AOT).

          Une récursion trop profonde → `StackOverflowError` ; un tas plein → `OutOfMemoryError`.
    exercises:
