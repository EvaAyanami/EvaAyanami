  - slug: java-reflexion
    title: Réflexion
    summary: Inspecter et manipuler les classes à l’exécution — Class, Field, Method, Constructor, invoke, setAccessible et usages en frameworks.
    minutes: 30
    concepts: [reflexion]
    sections:
      - title: Introspection
        body: |
          ```java
          Class<?> c = Personne.class;              // ou objet.getClass(), Class.forName("fr.Personne")
          c.getSimpleName();
          c.getSuperclass();
          for (Field f : c.getDeclaredFields()) System.out.println(f.getType().getSimpleName() + " " + f.getName());
          for (Method m : c.getDeclaredMethods()) System.out.println(m.getName() + " " + m.getParameterCount());
          Modifier.isPrivate(f.getModifiers());
          c.isRecord(); c.getRecordComponents();
          ```

          ⚠️ L’ordre renvoyé par `getDeclaredFields()`/`getDeclaredMethods()` **n’est pas garanti** : trie-les si l’ordre compte.
      - title: Manipulation dynamique
        body: |
          ```java
          Object o = c.getDeclaredConstructor(String.class).newInstance("Ada");
          Method m = c.getMethod("saluer", String.class);
          Object r = m.invoke(o, "Bob");                  // appel dynamique

          Field f = c.getDeclaredField("age");
          f.setAccessible(true);                          // contourne private (si les modules le permettent)
          f.set(o, 37);
          ```

          Usages : frameworks d’injection de dépendances (Spring), ORM (Hibernate), sérialisation (Jackson), tests (JUnit). Inconvénients : plus lent, pas de vérification à la compilation, casse l’encapsulation. Alternatives modernes : `MethodHandle`, génération de code à la compilation (annotation processors).
    exercises:
