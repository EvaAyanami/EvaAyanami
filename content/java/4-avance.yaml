        output: "début\ninit B\nB.f\ninit A\n2"
      - id: java-vm-code
        type: code
        title: Mini machine à pile
        prompt: |
          Interprète un mini-bytecode, une instruction par ligne : `push N`, `add`, `sub`, `mul`, `div` (division entière ; division par zéro → affiche `ArithmeticException` et arrête), `dup`, `swap`, `print` (affiche et dépile le sommet), `load i` / `store i` (variables locales 0..9, initialisées à 0), `jz L` (dépile ; saute à la ligne L — numérotée à partir de 0 — si la valeur vaut 0), `jmp L`, `halt`.

          Pour sécurité, arrête-toi après 10 000 instructions exécutées en affichant `limite atteinte`.
        starter: |
          import java.util.*;

          public class Main {
              public static void main(String[] args) {
                  Scanner sc = new Scanner(System.in);
                  List<String[]> prog = new ArrayList<>();
                  while (sc.hasNextLine()) { String l = sc.nextLine().trim(); if (!l.isEmpty()) prog.add(l.split("\\s+")); }
              }
          }
        solution: |
          import java.util.*;

          public class Main {
              public static void main(String[] args) {
                  Scanner sc = new Scanner(System.in);
                  List<String[]> prog = new ArrayList<>();
                  while (sc.hasNextLine()) { String l = sc.nextLine().trim(); if (!l.isEmpty()) prog.add(l.split("\\s+")); }
                  Deque<Long> pile = new ArrayDeque<>();
                  long[] locales = new long[10];
                  int pc = 0, pas = 0;
                  while (pc < prog.size()) {
                      if (++pas > 10000) { System.out.println("limite atteinte"); return; }
                      String[] ins = prog.get(pc++);
                      switch (ins[0]) {
                          case "push" -> pile.push(Long.parseLong(ins[1]));
                          case "add" -> { long b = pile.pop(), a = pile.pop(); pile.push(a + b); }
                          case "sub" -> { long b = pile.pop(), a = pile.pop(); pile.push(a - b); }
                          case "mul" -> { long b = pile.pop(), a = pile.pop(); pile.push(a * b); }
                          case "div" -> {
                              long b = pile.pop(), a = pile.pop();
                              if (b == 0) { System.out.println("ArithmeticException"); return; }
                              pile.push(a / b);
                          }
                          case "dup" -> pile.push(pile.peek());
                          case "swap" -> { long b = pile.pop(), a = pile.pop(); pile.push(b); pile.push(a); }
                          case "print" -> System.out.println(pile.pop());
                          case "load" -> pile.push(locales[Integer.parseInt(ins[1])]);
                          case "store" -> locales[Integer.parseInt(ins[1])] = pile.pop();
                          case "jz" -> { if (pile.pop() == 0) pc = Integer.parseInt(ins[1]); }
                          case "jmp" -> pc = Integer.parseInt(ins[1]);
                          case "halt" -> { return; }
                      }
                  }
              }
          }
        tests:
          - { input: "push 2\npush 3\nadd\npush 4\nmul\nprint", output: '20' }
          - { input: "push 5\nstore 0\npush 1\nstore 1\nload 0\njz 15\nload 1\nload 0\nmul\nstore 1\nload 0\npush 1\nsub\nstore 0\njmp 4\nload 1\nprint", output: '120', hidden: true }
          - { input: "push 1\npush 0\ndiv\nprint", output: ArithmeticException, hidden: true }
          - { input: jmp 0, output: limite atteinte, hidden: true }
    project:
      id: java-vm-projet
      type: code
      title: Compilateur d’expressions vers bytecode
      difficulty: 3
      prompt: |
        Comme `javac`, compile des expressions arithmétiques (entiers, `+ - * /`, parenthèses, priorités usuelles, associativité à gauche) vers des instructions de machine à pile, puis exécute-les.

        Pour chaque ligne, affiche le bytecode sur une ligne (`iconst 2 | iconst 3 | iadd …` avec `iadd`, `isub`, `imul`, `idiv`) puis `= résultat`.
      starter: |
        import java.util.*;

        public class Main {
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
            }
        }
      solution: |
        import java.util.*;

        public class Main {
            static String s;
            static int pos;
            static List<String> code;

            static void expr() {
                terme();
                while (pos < s.length() && (s.charAt(pos) == '+' || s.charAt(pos) == '-')) {
                    char op = s.charAt(pos++);
                    terme();
                    code.add(op == '+' ? "iadd" : "isub");
                }
            }
            static void terme() {
                facteur();
                while (pos < s.length() && (s.charAt(pos) == '*' || s.charAt(pos) == '/')) {
                    char op = s.charAt(pos++);
                    facteur();
                    code.add(op == '*' ? "imul" : "idiv");
                }
            }
            static void facteur() {
                if (s.charAt(pos) == '(') { pos++; expr(); pos++; return; }
                int debut = pos;
                while (pos < s.length() && Character.isDigit(s.charAt(pos))) pos++;
                code.add("iconst " + s.substring(debut, pos));
            }
            static long executer(List<String> c) {
                Deque<Long> p = new ArrayDeque<>();
                for (String i : c) {
                    if (i.startsWith("iconst")) { p.push(Long.parseLong(i.substring(7))); continue; }
                    long b = p.pop(), a = p.pop();
                    p.push(switch (i) { case "iadd" -> a + b; case "isub" -> a - b; case "imul" -> a * b; default -> a / b; });
                }
                return p.pop();
            }
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
                while (sc.hasNextLine()) {
                    s = sc.nextLine().replace(" ", "");
                    if (s.isEmpty()) continue;
                    pos = 0;
                    code = new ArrayList<>();
                    expr();
                    System.out.println(String.join(" | ", code));
                    System.out.println("= " + executer(code));
                }
            }
        }
      tests:
        - { input: "2 + 3 * 4\n(2 + 3) * 4\n10 - 4 - 3", output: "iconst 2 | iconst 3 | iconst 4 | imul | iadd\n= 14\niconst 2 | iconst 3 | iadd | iconst 4 | imul\n= 20\niconst 10 | iconst 4 | isub | iconst 3 | isub\n= 3" }
        - { input: 100/(2*5), output: "iconst 100 | iconst 2 | iconst 5 | imul | idiv\n= 10", hidden: true }
