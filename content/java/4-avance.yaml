  # ------------------------------------------------------------------
  - slug: java-jdbc
    title: JDBC
    summary: Accéder à une base de données relationnelle — Connection, PreparedStatement, ResultSet, transactions, injections SQL et pools.
    minutes: 35
    concepts: [base-de-donnees]
    sections:
      - title: Requêtes avec JDBC
        body: |
          ```java
          String url = "jdbc:postgresql://localhost:5432/codemori";
          try (Connection cx = DriverManager.getConnection(url, "user", "motdepasse");
               PreparedStatement ps = cx.prepareStatement("SELECT id, nom FROM eleves WHERE niveau >= ?")) {
              ps.setInt(1, 3);                              // paramètre lié (indice à partir de 1)
              try (ResultSet rs = ps.executeQuery()) {
                  while (rs.next()) System.out.println(rs.getLong("id") + " " + rs.getString("nom"));
              }
          }

          int lignes = cx.prepareStatement("UPDATE …").executeUpdate();
          ```

          Le pilote (`org.postgresql:postgresql`, `com.h2database:h2`…) s’ajoute comme dépendance Maven/Gradle.
      - title: Sécurité et transactions
        body: |
          **Injection SQL** : ne **jamais** concaténer une entrée utilisateur dans une requête.

          ```java
          // ❌ "SELECT * FROM comptes WHERE nom = '" + nom + "'"   → nom = "x' OR '1'='1"
          // ✅ PreparedStatement avec ?
          ```

          **Transactions** :

          ```java
          cx.setAutoCommit(false);
          try {
              debiter.executeUpdate();
              crediter.executeUpdate();
              cx.commit();
          } catch (SQLException e) {
              cx.rollback();
              throw e;
          }
          ```

          En production : un **pool de connexions** (HikariCP), et souvent une couche au-dessus (JdbcTemplate, jOOQ, JPA/Hibernate).

          > 💡 Le bac à sable n’a ni réseau ni base de données : les exercices simulent les mécanismes (liaison de paramètres, transactions) pour bien les comprendre.
    exercises:
      - id: java-jdbc-q1
        type: mcq
        prompt: Pourquoi utiliser PreparedStatement plutôt que concaténer des chaînes ?
        choices: ['Pour empêcher les injections SQL (et réutiliser le plan de requête)', 'Parce que Statement est supprimé', 'Pour avoir des résultats triés', 'Pour fermer la connexion']
        answer: 0
      - id: java-jdbc-q2
        type: mcq
        prompt: Quel est l’indice du premier paramètre ? d’un PreparedStatement ?
        choices: ['1', '0', '-1', 'Il se nomme :p1']
        answer: 0
      - id: java-jdbc-order
        type: order
        prompt: Remets dans l’ordre les étapes d’une requête JDBC.
        lines:
          - Ouvrir une Connection
          - Préparer un PreparedStatement
          - Lier les paramètres (setInt, setString…)
          - Exécuter (executeQuery)
          - Parcourir le ResultSet avec next()
          - Fermer les ressources (try-with-resources)
      - id: java-jdbc-code
        type: code
        title: Liaison de paramètres sécurisée
        prompt: |
          Simule ce que fait un pilote JDBC : première ligne, une requête contenant des `?`. Lignes suivantes : les valeurs à lier, chacune préfixée par son type (`int 42`, `str texte avec espaces`, `null`).

          Produis la requête finale : les entiers tels quels, `NULL`, et les chaînes entre apostrophes avec chaque `'` doublé (`''`). Si le nombre de valeurs ne correspond pas au nombre de `?` (hors chaînes déjà entre apostrophes dans la requête), affiche `SQLException : N paramètres attendus, M fournis`.
        starter: |
          import java.util.*;

          public class Main {
              public static void main(String[] args) {
                  Scanner sc = new Scanner(System.in);
                  String sql = sc.nextLine();
              }
          }
        solution: |
          import java.util.*;

          public class Main {
              public static void main(String[] args) {
                  Scanner sc = new Scanner(System.in);
                  String sql = sc.nextLine();
                  List<String> valeurs = new ArrayList<>();
                  while (sc.hasNextLine()) {
                      String l = sc.nextLine();
                      if (l.isEmpty()) continue;
                      if (l.equals("null")) valeurs.add("NULL");
                      else if (l.startsWith("int ")) valeurs.add(String.valueOf(Long.parseLong(l.substring(4).trim())));
                      else valeurs.add("'" + l.substring(4).replace("'", "''") + "'");
                  }
                  StringBuilder sb = new StringBuilder();
                  boolean dansChaine = false;
                  int n = 0;
                  List<Integer> positions = new ArrayList<>();
                  for (char c : sql.toCharArray()) {
                      if (c == '\'') dansChaine = !dansChaine;
                      if (c == '?' && !dansChaine) { positions.add(sb.length()); n++; sb.append('\0'); }
                      else sb.append(c);
                  }
                  if (n != valeurs.size()) { System.out.println("SQLException : " + n + " paramètres attendus, " + valeurs.size() + " fournis"); return; }
                  StringBuilder res = new StringBuilder();
                  int k = 0;
                  for (int i = 0; i < sb.length(); i++) {
                      if (sb.charAt(i) == '\0') res.append(valeurs.get(k++));
                      else res.append(sb.charAt(i));
                  }
                  System.out.println(res);
              }
          }
        tests:
          - { input: "SELECT * FROM comptes WHERE nom = ? AND age > ? AND note = ?\nstr x' OR '1'='1\nint 18\nnull", output: "SELECT * FROM comptes WHERE nom = 'x'' OR ''1''=''1' AND age > 18 AND note = NULL" }
          - { input: "INSERT INTO t VALUES (?, '?')\nint 1\nint 2", output: 'SQLException : 1 paramètres attendus, 2 fournis', hidden: true }
          - { input: "UPDATE t SET a = ? WHERE b = 'ok?'\nstr l'été", output: "UPDATE t SET a = 'l''été' WHERE b = 'ok?'", hidden: true }
    project:
      id: java-jdbc-projet
      type: code
      title: Transactions en mémoire
      difficulty: 3
      prompt: |
        Simule une base clé-valeur transactionnelle comme une connexion JDBC avec `setAutoCommit(false)`. Commandes : `set K V`, `get K` (affiche la valeur ou `NULL`), `delete K`, `begin`, `commit`, `rollback`. Les transactions peuvent être **imbriquées** (points de sauvegarde) : `rollback` annule uniquement la transaction la plus interne ; `commit` valide **toutes** les transactions ouvertes. `rollback` ou `commit` sans transaction : `aucune transaction`.

        Termine par l’état final trié `K=V` séparé par des espaces (ou `vide`).
      starter: |
        import java.util.*;

        public class Main {
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
            }
        }
      solution: |
        import java.util.*;

        public class Main {
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
                Map<String, String> donnees = new TreeMap<>();
                Deque<Map<String, Optional<String>>> journal = new ArrayDeque<>();
                while (sc.hasNext()) {
                    String c = sc.next();
                    switch (c) {
                        case "set", "delete" -> {
                            String k = sc.next();
                            String v = c.equals("set") ? sc.next() : null;
                            if (!journal.isEmpty()) journal.peek().putIfAbsent(k, Optional.ofNullable(donnees.get(k)));
                            if (v == null) donnees.remove(k); else donnees.put(k, v);
                        }
                        case "get" -> System.out.println(donnees.getOrDefault(sc.next(), "NULL"));
                        case "begin" -> journal.push(new HashMap<>());
                        case "rollback" -> {
                            if (journal.isEmpty()) { System.out.println("aucune transaction"); break; }
                            journal.pop().forEach((k, ancien) -> {
                                if (ancien.isPresent()) donnees.put(k, ancien.get()); else donnees.remove(k);
                            });
                        }
                        default -> {
                            if (journal.isEmpty()) System.out.println("aucune transaction");
                            journal.clear();
                        }
                    }
                }
                StringJoiner j = new StringJoiner(" ");
                donnees.forEach((k, v) -> j.add(k + "=" + v));
                System.out.println(donnees.isEmpty() ? "vide" : j.toString());
            }
        }
      tests:
        - { input: "set a 10\nbegin\nset a 20\nbegin\nset b 5\ndelete a\nget a\nrollback\nget a\nget b\nrollback\nget a\nrollback", output: "NULL\n20\nNULL\n10\naucune transaction\na=10" }
        - { input: "begin\nset x 1\nbegin\nset y 2\ncommit\nrollback\nget y", output: "aucune transaction\n2\nx=1 y=2", hidden: true }
