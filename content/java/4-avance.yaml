        type: mcq
        prompt: Que se passe-t-il si on appelle t.run() au lieu de t.start() ?
        choices: ['Le code s’exécute dans le thread courant, sans parallélisme', 'Le thread démarre normalement', 'Une exception est levée', 'Le thread est interrompu']
