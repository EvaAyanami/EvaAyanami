  - slug: java-annotations
    title: Annotations
    summary: Annotations standard, création d’annotations personnalisées, rétention, cibles, attributs et traitement par réflexion.
    minutes: 30
    concepts: [reflexion]
    sections:
      - title: Annotations standard et personnalisées
        body: |
          Annotations courantes : `@Override`, `@Deprecated`, `@SuppressWarnings("unchecked")`, `@FunctionalInterface`, `@SafeVarargs`.

          ```java
          @Retention(RetentionPolicy.RUNTIME)     // SOURCE, CLASS ou RUNTIME (lisible par réflexion)
          @Target({ElementType.FIELD})            // où l’annotation est autorisée
          @interface Longueur {
              int min() default 0;
              int max() default Integer.MAX_VALUE;
              String message() default "longueur invalide";
          }

          class Utilisateur {
              @Longueur(min = 3, max = 20) String pseudo;
          }
          ```

          Attributs autorisés : primitifs, `String`, `Class`, enums, annotations et tableaux de ceux-ci. Un attribut nommé `value` peut être passé sans nom : `@Role("admin")`.
      - title: Traiter les annotations
        body: |
          À l’exécution, par réflexion :

          ```java
          for (Field f : obj.getClass().getDeclaredFields()) {
              Longueur l = f.getAnnotation(Longueur.class);
              if (l != null) {
                  f.setAccessible(true);
                  String v = (String) f.get(obj);
                  if (v.length() < l.min() || v.length() > l.max()) erreurs.add(f.getName() + " : " + l.message());
              }
          }
          ```

          À la compilation : les **annotation processors** génèrent du code (Lombok, MapStruct, Dagger) sans coût à l’exécution. C’est ainsi que fonctionnent Bean Validation (`@NotNull`, `@Size`), JPA (`@Entity`, `@Id`) ou Spring (`@Component`, `@GetMapping`).
    exercises:
      - id: java-ann-q1
        type: mcq
        prompt: Quelle rétention permet de lire une annotation par réflexion à l’exécution ?
        choices: ['RetentionPolicy.RUNTIME', 'RetentionPolicy.SOURCE', 'RetentionPolicy.CLASS', 'Aucune n’est nécessaire']
        answer: 0
      - id: java-ann-q2
        type: mcq
        prompt: Que vérifie @Override ?
        choices: ['Que la méthode redéfinit bien une méthode du parent', 'Que la méthode est publique', 'Que la méthode est rapide', 'Rien']
        answer: 0
      - id: java-ann-fill
        type: fill
        prompt: Complète la déclaration de l’annotation.
        code: |
          import java.lang.annotation.*;
