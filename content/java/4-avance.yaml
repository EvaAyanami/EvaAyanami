  - slug: java-completablefuture
    title: CompletableFuture
    summary: Composer des calculs asynchrones — supplyAsync, thenApply, thenCompose, thenCombine, allOf, gestion d’erreurs.
    minutes: 30
    concepts: [async]
    sections:
      - title: Chaîner des étapes
        body: |
          ```java
          CompletableFuture<String> cf = CompletableFuture
              .supplyAsync(() -> chargerUtilisateur(42))          // dans le ForkJoinPool commun
              .thenApply(u -> u.nom())                            // transformation
              .thenCompose(nom -> chargerProfilAsync(nom))        // étape asynchrone (flatMap)
              .exceptionally(e -> "anonyme");                     // valeur de secours

          CompletableFuture<Integer> a = supplyAsync(() -> 2), b = supplyAsync(() -> 3);
          CompletableFuture<Integer> somme = a.thenCombine(b, Integer::sum);   // 5

          CompletableFuture.allOf(a, b).join();      // attendre toutes les étapes
          CompletableFuture.anyOf(a, b);             // la première terminée
          String r = cf.join();                      // comme get() mais exception non vérifiée
          ```
      - title: Erreurs et exécuteurs
        body: |
          - `exceptionally(fn)` : remplace une erreur par une valeur ;
          - `handle((valeur, erreur) -> …)` : traite les deux cas ;
          - `whenComplete` : effet de bord sans changer le résultat ;
          - `orTimeout(1, SECONDS)` / `completeOnTimeout(defaut, 1, SECONDS)`.

          Une exception dans une étape **saute** les `thenApply` suivants jusqu’au premier gestionnaire. `join()` la relance encapsulée dans une `CompletionException`.

          Passe un exécuteur dédié (`supplyAsync(tache, pool)`) pour les E/S bloquantes, afin de ne pas saturer le pool commun.
    exercises:
      - id: java-cf-predict
        type: predict
        prompt: Que va afficher ce programme ?
        code: |
          import java.util.concurrent.*;
          public class Main {
              public static void main(String[] args) {
                  CompletableFuture<Integer> a = CompletableFuture.supplyAsync(() -> 20);
                  CompletableFuture<Integer> b = CompletableFuture.supplyAsync(() -> 22);
                  String r = a.thenCombine(b, Integer::sum).thenApply(x -> "total=" + x).join();
                  String e = CompletableFuture.supplyAsync(() -> Integer.parseInt("x"))
                      .thenApply(x -> x * 2)
                      .handle((v, err) -> err == null ? "ok " + v : "erreur " + err.getCause().getClass().getSimpleName())
                      .join();
                  System.out.println(r + " | " + e);
              }
          }
        output: total=42 | erreur NumberFormatException
        concepts: [async]
