      - id: java-ann-code
        type: code
        title: Validation déclarative
        prompt: |
          Crée les annotations `@NonVide` et `@Plage(min, max)` (RUNTIME, sur champs) et un validateur `List<String> valider(Object)` qui parcourt les champs (triés par nom) et renvoie les erreurs `champ : ne doit pas être vide` / `champ : doit être entre MIN et MAX`.

          La classe `Inscription` (à annoter) a `pseudo` (`@NonVide`), `age` (`@Plage(min = 13, max = 120)`) et `email` (`@NonVide`). Chaque ligne d’entrée : `pseudo age email` (`_` représente une chaîne vide). Affiche `valide` ou les erreurs séparées par ` ; `.
        starter: |
          import java.lang.annotation.*;
          import java.lang.reflect.*;
          import java.util.*;

          public class Main {
              static class Inscription {
                  String pseudo;
                  int age;
                  String email;
                  Inscription(String p, int a, String e) { pseudo = p; age = a; email = e; }
              }

              public static void main(String[] args) throws Exception {
                  Scanner sc = new Scanner(System.in);
                  while (sc.hasNext()) {
                      String p = sc.next(); int a = sc.nextInt(); String e = sc.next();
                      Inscription i = new Inscription(p.equals("_") ? "" : p, a, e.equals("_") ? "" : e);
                  }
              }
          }
        solution: |
          import java.lang.annotation.*;
          import java.lang.reflect.*;
          import java.util.*;

          @Retention(RetentionPolicy.RUNTIME) @Target(ElementType.FIELD) @interface NonVide {}
          @Retention(RetentionPolicy.RUNTIME) @Target(ElementType.FIELD) @interface Plage { int min(); int max(); }

          public class Main {
              static class Inscription {
                  @NonVide String pseudo;
                  @Plage(min = 13, max = 120) int age;
                  @NonVide String email;
                  Inscription(String p, int a, String e) { pseudo = p; age = a; email = e; }
              }

              static List<String> valider(Object o) throws IllegalAccessException {
                  List<String> erreurs = new ArrayList<>();
                  Field[] champs = o.getClass().getDeclaredFields();
                  Arrays.sort(champs, Comparator.comparing(Field::getName));
                  for (Field f : champs) {
                      f.setAccessible(true);
                      if (f.isAnnotationPresent(NonVide.class)) {
                          Object v = f.get(o);
                          if (v == null || v.toString().isEmpty()) erreurs.add(f.getName() + " : ne doit pas être vide");
                      }
                      Plage p = f.getAnnotation(Plage.class);
                      if (p != null) {
                          int v = f.getInt(o);
                          if (v < p.min() || v > p.max()) erreurs.add(f.getName() + " : doit être entre " + p.min() + " et " + p.max());
                      }
                  }
                  return erreurs;
              }

              public static void main(String[] args) throws Exception {
                  Scanner sc = new Scanner(System.in);
                  while (sc.hasNext()) {
                      String p = sc.next(); int a = sc.nextInt(); String e = sc.next();
                      Inscription i = new Inscription(p.equals("_") ? "" : p, a, e.equals("_") ? "" : e);
                      List<String> err = valider(i);
                      System.out.println(err.isEmpty() ? "valide" : String.join(" ; ", err));
                  }
              }
          }
        tests:
          - { input: "kiri 16 k@ex.fr\n_ 8 _", output: "valide\nage : doit être entre 13 et 120 ; email : ne doit pas être vide ; pseudo : ne doit pas être vide" }
          - { input: a 200 b, output: 'age : doit être entre 13 et 120', hidden: true }
        require:
          - { pattern: '@interface', message: Déclarer des annotations }
    project:
      id: java-ann-projet
      type: code
      title: Routeur HTTP par annotations
      difficulty: 3
      prompt: |
        Recrée le routage de Spring MVC : annotation `@Get("/chemin")` (RUNTIME, méthodes) dont le chemin peut contenir un paramètre `{nom}`. Une classe `Controleur` expose :

        - `@Get("/")` → `Bienvenue sur Codemori`
        - `@Get("/cours")` → `Cours : rust, cpp, java`
        - `@Get("/cours/{id}")` → `Cours ID` (le paramètre est passé à la méthode en `String`)
        - `@Get("/utilisateurs/{nom}")` → `Profil de NOM`

        Ton routeur découvre les routes par réflexion. Pour chaque ligne `GET /chemin`, affiche `200 réponse` ou `404 Introuvable` (méthode autre que GET : `405 Méthode non autorisée`).
      starter: |
        import java.lang.annotation.*;
        import java.lang.reflect.*;
        import java.util.*;

        public class Main {
            public static void main(String[] args) throws Exception {
                Scanner sc = new Scanner(System.in);
            }
        }
      solution: |
        import java.lang.annotation.*;
        import java.lang.reflect.*;
        import java.util.*;

        @Retention(RetentionPolicy.RUNTIME) @Target(ElementType.METHOD) @interface Get { String value(); }

        class Controleur {
            @Get("/") public String accueil() { return "Bienvenue sur Codemori"; }
            @Get("/cours") public String cours() { return "Cours : rust, cpp, java"; }
            @Get("/cours/{id}") public String unCours(String id) { return "Cours " + id; }
            @Get("/utilisateurs/{nom}") public String profil(String nom) { return "Profil de " + nom; }
        }

        public class Main {
            public static void main(String[] args) throws Exception {
                Scanner sc = new Scanner(System.in);
                Controleur ctrl = new Controleur();
                Map<String, Method> routes = new HashMap<>();
                for (Method m : Controleur.class.getDeclaredMethods()) {
                    Get g = m.getAnnotation(Get.class);
                    if (g != null) routes.put(g.value(), m);
                }
                while (sc.hasNext()) {
                    String verbe = sc.next(), chemin = sc.next();
                    if (!verbe.equals("GET")) { System.out.println("405 Méthode non autorisée"); continue; }
                    String reponse = null;
                    String[] seg = chemin.split("/", -1);
                    for (var e : routes.entrySet()) {
                        String[] motif = e.getKey().split("/", -1);
                        if (motif.length != seg.length) continue;
                        List<Object> params = new ArrayList<>();
                        boolean ok = true;
                        for (int i = 0; i < motif.length && ok; i++) {
                            if (motif[i].startsWith("{")) { if (seg[i].isEmpty()) ok = false; else params.add(seg[i]); }
                            else if (!motif[i].equals(seg[i])) ok = false;
                        }
                        if (ok) { reponse = (String) e.getValue().invoke(ctrl, params.toArray()); break; }
                    }
                    System.out.println(reponse == null ? "404 Introuvable" : "200 " + reponse);
                }
            }
        }
      tests:
        - { input: "GET /\nGET /cours\nGET /cours/42\nGET /utilisateurs/kiri\nGET /inconnu\nPOST /cours", output: "200 Bienvenue sur Codemori\n200 Cours : rust, cpp, java\n200 Cours 42\n200 Profil de kiri\n404 Introuvable\n405 Méthode non autorisée" }
        - { input: GET /cours/42/plus, output: 404 Introuvable, hidden: true }
      require:
        - { pattern: 'getAnnotation', message: Lire les annotations par réflexion }
