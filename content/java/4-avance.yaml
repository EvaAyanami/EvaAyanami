      - id: java-refl-code
        type: code
        title: toString générique
        prompt: |
          Écris `static String decrire(Object o)` qui produit `NomClasse{champ1=valeur1, champ2=valeur2}` en listant **par réflexion** tous les champs déclarés non statiques, triés par nom.

          Le programme fourni l’applique à deux classes avec les données lues.
        starter: |
          import java.lang.reflect.*;
          import java.util.*;

          public class Main {
              static class Produit { private String nom; private double prix; private static int compteur = 0; Produit(String n, double p) { nom = n; prix = p; } }
              static class Point { int y; int x; Point(int x, int y) { this.x = x; this.y = y; } }

              public static void main(String[] args) throws Exception {
                  Scanner sc = new Scanner(System.in);
                  System.out.println(decrire(new Produit(sc.next(), sc.nextDouble())));
                  System.out.println(decrire(new Point(sc.nextInt(), sc.nextInt())));
              }
          }
        solution: |
          import java.lang.reflect.*;
          import java.util.*;

          public class Main {
              static class Produit { private String nom; private double prix; private static int compteur = 0; Produit(String n, double p) { nom = n; prix = p; } }
              static class Point { int y; int x; Point(int x, int y) { this.x = x; this.y = y; } }

              static String decrire(Object o) throws IllegalAccessException {
                  List<Field> champs = new ArrayList<>();
                  for (Field f : o.getClass().getDeclaredFields()) if (!Modifier.isStatic(f.getModifiers())) champs.add(f);
                  champs.sort(Comparator.comparing(Field::getName));
                  StringJoiner j = new StringJoiner(", ", o.getClass().getSimpleName() + "{", "}");
                  for (Field f : champs) { f.setAccessible(true); j.add(f.getName() + "=" + f.get(o)); }
                  return j.toString();
              }

              public static void main(String[] args) throws Exception {
                  Scanner sc = new Scanner(System.in);
                  System.out.println(decrire(new Produit(sc.next(), sc.nextDouble())));
                  System.out.println(decrire(new Point(sc.nextInt(), sc.nextInt())));
              }
          }
        tests:
