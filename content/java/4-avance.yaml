      - id: java-cf-code
        type: code
        title: Agrégateur de prix
        prompt: |
          Chaque ligne : `boutique prix` (prix = `indisponible` si la boutique ne répond pas). Lance une `supplyAsync` par boutique qui parse le prix (lève une exception si invalide), avec `exceptionally` → `Double.MAX_VALUE`. Attends tout avec `allOf`, puis affiche `meilleur : boutique (prix)` (2 décimales, Locale.US ; égalité : première en entrée) et `réponses : R/N`. Si aucune réponse : `aucune offre`.
        starter: |
          import java.util.*;
          import java.util.concurrent.*;

          public class Main {
              public static void main(String[] args) {
                  Scanner sc = new Scanner(System.in);
              }
          }
        solution: |
          import java.util.*;
          import java.util.concurrent.*;

          public class Main {
              public static void main(String[] args) {
                  Scanner sc = new Scanner(System.in);
                  List<String> noms = new ArrayList<>();
                  List<CompletableFuture<Double>> fs = new ArrayList<>();
                  while (sc.hasNext()) {
                      noms.add(sc.next());
                      String p = sc.next();
                      fs.add(CompletableFuture.supplyAsync(() -> Double.parseDouble(p)).exceptionally(e -> Double.MAX_VALUE));
                  }
                  CompletableFuture.allOf(fs.toArray(new CompletableFuture[0])).join();
                  int best = -1, rep = 0;
                  for (int i = 0; i < fs.size(); i++) {
                      double v = fs.get(i).join();
                      if (v == Double.MAX_VALUE) continue;
                      rep++;
                      if (best < 0 || v < fs.get(best).join()) best = i;
                  }
                  if (best < 0) System.out.println("aucune offre");
                  else System.out.println(String.format(Locale.US, "meilleur : %s (%.2f)", noms.get(best), fs.get(best).join()));
                  System.out.println("réponses : " + rep + "/" + fs.size());
              }
          }
        tests:
          - { input: "alpha 19.99\nbeta indisponible\ngamma 17.5\ndelta 17.5", output: "meilleur : gamma (17.50)\nréponses : 3/4" }
          - { input: x indisponible, output: "aucune offre\nréponses : 0/1", hidden: true }
        require:
          - { pattern: 'supplyAsync', message: Utiliser supplyAsync }
    project:
      id: java-cf-projet
      type: code
      title: Pipeline de commande asynchrone
      difficulty: 3
      prompt: |
        Pour chaque commande `id quantite stock`, construis un pipeline : `supplyAsync(valider)` (quantité > 0 sinon exception `quantité invalide`) → `thenCompose(reserver)` (asynchrone ; stock ≥ quantité sinon `stock insuffisant`) → `thenApply(facturer)` (montant = quantite × 12) → `handle` qui produit `id : facturée M €` ou `id : refusée (raison)`.

        Affiche les résultats dans l’ordre puis `CA : total €`.
      starter: |
        import java.util.*;
        import java.util.concurrent.*;

        public class Main {
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
            }
        }
      solution: |
        import java.util.*;
        import java.util.concurrent.*;

        public class Main {
            record Res(String texte, long montant) {}
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
                List<CompletableFuture<Res>> fs = new ArrayList<>();
                while (sc.hasNext()) {
                    String id = sc.next();
                    int q = sc.nextInt(), stock = sc.nextInt();
                    fs.add(CompletableFuture
                        .supplyAsync(() -> { if (q <= 0) throw new IllegalArgumentException("quantité invalide"); return q; })
                        .thenCompose(x -> CompletableFuture.supplyAsync(() -> { if (stock < x) throw new IllegalStateException("stock insuffisant"); return x; }))
                        .thenApply(x -> x * 12L)
                        .handle((m, e) -> e == null ? new Res(id + " : facturée " + m + " €", m)
                                                    : new Res(id + " : refusée (" + e.getCause().getMessage() + ")", 0)));
                }
                long ca = 0;
                for (var f : fs) { Res r = f.join(); System.out.println(r.texte()); ca += r.montant(); }
                System.out.println("CA : " + ca + " €");
            }
        }
      tests:
        - { input: "c1 2 10\nc2 0 10\nc3 5 3\nc4 1 1", output: "c1 : facturée 24 €\nc2 : refusée (quantité invalide)\nc3 : refusée (stock insuffisant)\nc4 : facturée 12 €\nCA : 36 €" }
        - { input: z 3 3, output: "z : facturée 36 €\nCA : 36 €", hidden: true }
