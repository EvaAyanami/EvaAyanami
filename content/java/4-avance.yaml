  # ------------------------------------------------------------------
  - slug: java-performances
    title: Gestion des performances
    summary: Mesurer avant d’optimiser — JMH, profilage, complexité, StringBuilder, boxing, structures adaptées et allocations.
    minutes: 30
    concepts: [performance]
    sections:
      - title: Mesurer correctement
        body: |
          Le JIT, le GC et le préchauffage faussent les mesures naïves avec `System.nanoTime()`. Utilise **JMH** :

          ```java
          @Benchmark
          @BenchmarkMode(Mode.AverageTime)
          public long somme(Etat e) { return e.liste.stream().mapToLong(x -> x).sum(); }
          ```

          Profilage : **JFR** + JDK Mission Control, async-profiler (flame graphs), VisualVM. Cherche d’abord les **points chauds** : 90 % du temps est souvent passé dans 10 % du code.
      - title: Pièges classiques
        body: |
          | Piège | Solution |
          |---|---|
          | `s += x` dans une boucle (O(n²)) | `StringBuilder` |
          | `List<Integer>` pour des millions de valeurs (boxing) | `int[]`, `IntStream` |
          | `list.contains` dans une boucle | `HashSet` |
          | `LinkedList.get(i)` | `ArrayList` |
          | regex recompilée à chaque appel | `Pattern` statique |
          | exceptions pour le contrôle de flux | tests explicites |
          | algorithme O(n²) | meilleur algorithme (tri, hachage, préfixes) |

          Le gain le plus important vient presque toujours de l’**algorithme** et des **structures de données**, pas des micro-optimisations.
    exercises:
      - id: java-perf-q1
        type: mcq
        prompt: Pourquoi s += x dans une boucle est-il lent sur de grandes chaînes ?
        choices: ['Chaque concaténation recopie toute la chaîne (O(n²))', 'Les String sont limitées', 'Le GC est désactivé', 'Ce n’est pas lent']
        answer: 0
      - id: java-perf-q2
        type: mcq
        prompt: Quel outil utiliser pour des micro-benchmarks fiables en Java ?
        choices: ['JMH', 'System.currentTimeMillis seul', 'JUnit', 'javap']
        answer: 0
      - id: java-perf-q3
        type: mcq
        prompt: Quelle optimisation apporte généralement le plus grand gain ?
        choices: ['Un meilleur algorithme ou une meilleure structure de données', 'Rendre les variables final', 'Supprimer les commentaires', 'Utiliser des noms courts']
        answer: 0
      - id: java-perf-code
        type: code
        title: Paires de somme cible
        prompt: |
          Première ligne : `n` et `cible`. Deuxième ligne : `n` entiers (n jusqu’à 200 000). Compte le nombre de paires d’indices `i < j` telles que `a[i] + a[j] == cible`.

          Une double boucle O(n²) sera trop lente : utilise une `HashMap` des occurrences vues (O(n)). Lis l’entrée rapidement (`BufferedReader` + `StreamTokenizer` ou `split`).
        starter: |
          import java.io.*;
          import java.util.*;

          public class Main {
              public static void main(String[] args) throws IOException {
                  BufferedReader br = new BufferedReader(new InputStreamReader(System.in));
              }
          }
        solution: |
          import java.io.*;
          import java.util.*;

          public class Main {
              public static void main(String[] args) throws IOException {
                  StreamTokenizer st = new StreamTokenizer(new BufferedReader(new InputStreamReader(System.in)));
                  st.nextToken(); int n = (int) st.nval;
                  st.nextToken(); long cible = (long) st.nval;
                  Map<Long, Integer> vus = new HashMap<>();
                  long paires = 0;
                  for (int i = 0; i < n; i++) {
                      st.nextToken();
                      long x = (long) st.nval;
                      paires += vus.getOrDefault(cible - x, 0);
                      vus.merge(x, 1, Integer::sum);
                  }
                  System.out.println(paires);
              }
          }
        tests:
          - { input: "6 7\n1 6 3 4 3 4", output: '5' }
          - { input: "4 0\n0 0 0 0", output: '6', hidden: true }
        concepts: [performance]
    project:
      id: java-perf-projet
      type: code
      title: Requêtes de sommes sur intervalles
      difficulty: 3
      prompt: |
        Première ligne : `n q`. Deuxième : `n` entiers. Puis `q` requêtes `l r` (indices à partir de 1, inclus). Pour chaque requête affiche la somme de `a[l..r]`, puis à la fin `max : M` (la plus grande somme demandée).

        Avec n et q jusqu’à 200 000, recalculer chaque somme serait O(n·q) : utilise des **sommes préfixes** (`long[]`) et une sortie bufferisée (`StringBuilder` ou `PrintWriter`).
      starter: |
        import java.io.*;
        import java.util.*;

        public class Main {
            public static void main(String[] args) throws IOException {
            }
        }
      solution: |
        import java.io.*;
        import java.util.*;

        public class Main {
            public static void main(String[] args) throws IOException {
                StreamTokenizer st = new StreamTokenizer(new BufferedReader(new InputStreamReader(System.in)));
                st.nextToken(); int n = (int) st.nval;
                st.nextToken(); int q = (int) st.nval;
                long[] pre = new long[n + 1];
                for (int i = 1; i <= n; i++) { st.nextToken(); pre[i] = pre[i - 1] + (long) st.nval; }
                StringBuilder sb = new StringBuilder();
                long max = Long.MIN_VALUE;
                for (int k = 0; k < q; k++) {
                    st.nextToken(); int l = (int) st.nval;
                    st.nextToken(); int r = (int) st.nval;
                    long s = pre[r] - pre[l - 1];
                    max = Math.max(max, s);
                    sb.append(s).append('\n');
                }
                sb.append("max : ").append(max);
                System.out.println(sb);
            }
        }
      tests:
        - { input: "5 3\n3 -1 4 1 5\n1 3\n2 5\n4 4", output: "6\n9\n1\nmax : 9" }
        - { input: "1 1\n-7\n1 1", output: "-7\nmax : -7", hidden: true }
      require:
        - { pattern: 'long\s*\[\]', message: Utiliser un tableau de sommes préfixes }
