  - slug: java-executor
    title: ExecutorService
    summary: Pools de threads, submit et Future, Callable, invokeAll, arrêt propre et choix de la taille du pool.
    minutes: 30
    concepts: [concurrence]
    sections:
      - title: Pools de threads
        body: |
          Créer un thread par tâche coûte cher. Un **ExecutorService** réutilise un pool de threads :

          ```java
          ExecutorService pool = Executors.newFixedThreadPool(4);
          Future<Integer> f = pool.submit(() -> calcul());   // Callable<Integer>
          int r = f.get();                                    // bloque jusqu’au résultat
          f.get(2, TimeUnit.SECONDS);                         // avec délai (TimeoutException)

          List<Callable<Long>> taches = …;
          List<Future<Long>> resultats = pool.invokeAll(taches);   // dans l’ordre des tâches

          pool.shutdown();                                    // plus de nouvelles tâches
          pool.awaitTermination(1, TimeUnit.MINUTES);
          ```

          Depuis Java 19, `ExecutorService` est `AutoCloseable` : `try (var pool = Executors.newFixedThreadPool(4)) { … }` attend la fin des tâches.
      - title: Bonnes pratiques
        body: |
          - Tâches **CPU** : pool ≈ nombre de cœurs (`Runtime.getRuntime().availableProcessors()`).
          - Tâches **E/S** : threads virtuels (`newVirtualThreadPerTaskExecutor`).
          - Une exception dans une tâche est encapsulée dans une `ExecutionException` levée par `get()`.
          - Toujours arrêter le pool, sinon la JVM peut ne pas se terminer.
          - `ScheduledExecutorService` exécute des tâches périodiques (`scheduleAtFixedRate`).
    exercises:
      - id: java-exe-q1
        type: mcq
        prompt: Que renvoie pool.submit(callable) ?
        choices: ['Un Future représentant le résultat à venir', 'Le résultat directement', 'Un Thread', 'void']
        answer: 0
      - id: java-exe-q2
        type: mcq
        prompt: Comment est propagée une exception levée dans une tâche soumise ?
        choices: ['Encapsulée dans une ExecutionException levée par Future.get()', 'Elle arrête la JVM', 'Elle est perdue silencieusement toujours', 'Elle est affichée et ignorée']
        answer: 0
      - id: java-exe-predict
        type: predict
        prompt: Que va afficher ce programme ?
        code: |
          import java.util.*;
          import java.util.concurrent.*;
          public class Main {
              public static void main(String[] args) throws Exception {
                  try (ExecutorService pool = Executors.newFixedThreadPool(3)) {
                      List<Callable<Integer>> t = new ArrayList<>();
                      for (int i = 1; i <= 4; i++) { final int x = i; t.add(() -> x * x); }
                      int s = 0;
                      for (Future<Integer> f : pool.invokeAll(t)) s += f.get();
                      Future<Integer> err = pool.submit(() -> 1 / 0);
                      try { err.get(); } catch (ExecutionException e) { System.out.println(e.getCause().getClass().getSimpleName()); }
                      System.out.println(s);
                  }
              }
          }
        output: "ArithmeticException\n30"
      - id: java-exe-code
        type: code
        title: Téléchargements simulés
        prompt: |
          Chaque ligne : `nom taille`. Avec un pool de 3 threads, soumets une tâche `Callable<String>` par fichier qui « télécharge » (calcule une somme de contrôle = somme des codes des caractères du nom × taille) et renvoie `nom : checksum`. Si la taille est négative, la tâche lève `IllegalArgumentException("taille invalide")`.

          Affiche les résultats **dans l’ordre d’entrée** (`nom : erreur (taille invalide)` pour les échecs), puis `succès : S/N`.
        starter: |
          import java.util.*;
          import java.util.concurrent.*;

          public class Main {
              public static void main(String[] args) throws Exception {
                  Scanner sc = new Scanner(System.in);
              }
          }
        solution: |
          import java.util.*;
          import java.util.concurrent.*;

          public class Main {
              public static void main(String[] args) throws Exception {
                  Scanner sc = new Scanner(System.in);
                  List<String> noms = new ArrayList<>();
                  List<Future<String>> fs = new ArrayList<>();
                  int ok = 0;
                  try (ExecutorService pool = Executors.newFixedThreadPool(3)) {
                      while (sc.hasNext()) {
                          String nom = sc.next();
                          long taille = sc.nextLong();
                          noms.add(nom);
                          fs.add(pool.submit(() -> {
                              if (taille < 0) throw new IllegalArgumentException("taille invalide");
                              long s = 0;
                              for (char c : nom.toCharArray()) s += c;
                              return nom + " : " + s * taille;
                          }));
                      }
                      for (int i = 0; i < fs.size(); i++) {
                          try { System.out.println(fs.get(i).get()); ok++; }
                          catch (ExecutionException e) { System.out.println(noms.get(i) + " : erreur (" + e.getCause().getMessage() + ")"); }
                      }
                  }
                  System.out.println("succès : " + ok + "/" + fs.size());
              }
          }
        tests:
          - { input: "a 2\nab -1\nbc 10", output: "a : 194\nab : erreur (taille invalide)\nbc : 1970\nsuccès : 2/3" }
          - { input: z 1, output: "z : 122\nsuccès : 1/1", hidden: true }
        require:
          - { pattern: 'Executors\.newFixedThreadPool', message: Utiliser un pool fixe }
    project:
      id: java-exe-projet
      type: code
      title: Traitement par lots avec délai
      difficulty: 3
      prompt: |
        Chaque ligne : `id duree_ms`. Soumets chaque tâche (qui dort `duree_ms` puis renvoie `id`) à un pool de 4 threads. Récupère chaque résultat avec `get(300, TimeUnit.MILLISECONDS)` **mesuré depuis la soumission de toutes les tâches** : pour simplifier, une tâche de durée > 250 ms est considérée comme expirée sans attendre (annule-la avec `cancel(true)`).

        Affiche pour chaque tâche dans l’ordre `id : ok` ou `id : expirée`, puis `terminées : N`.
      starter: |
        import java.util.*;
        import java.util.concurrent.*;

        public class Main {
            public static void main(String[] args) throws Exception {
                Scanner sc = new Scanner(System.in);
            }
        }
      solution: |
        import java.util.*;
        import java.util.concurrent.*;

        public class Main {
            public static void main(String[] args) throws Exception {
                Scanner sc = new Scanner(System.in);
                List<String> ids = new ArrayList<>();
                List<Long> durees = new ArrayList<>();
                while (sc.hasNext()) { ids.add(sc.next()); durees.add(sc.nextLong()); }
                ExecutorService pool = Executors.newFixedThreadPool(4);
                List<Future<String>> fs = new ArrayList<>();
                for (int i = 0; i < ids.size(); i++) {
                    final String id = ids.get(i);
                    final long d = durees.get(i);
                    fs.add(pool.submit(() -> { Thread.sleep(d); return id; }));
                }
                int termines = 0;
                for (int i = 0; i < fs.size(); i++) {
                    Future<String> f = fs.get(i);
                    if (durees.get(i) > 250) { f.cancel(true); System.out.println(ids.get(i) + " : expirée"); continue; }
                    try { f.get(300, TimeUnit.MILLISECONDS); termines++; System.out.println(ids.get(i) + " : ok"); }
                    catch (TimeoutException e) { f.cancel(true); System.out.println(ids.get(i) + " : expirée"); }
                }
                pool.shutdownNow();
                System.out.println("terminées : " + termines);
            }
        }
      tests:
