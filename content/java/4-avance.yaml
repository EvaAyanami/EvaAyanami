          - { pattern: 'getDeclaredFields', message: Utiliser la réflexion }
    project:
      id: java-refl-projet
      type: code
      title: Conteneur d’injection de dépendances
      difficulty: 3
      prompt: |
        Recrée le principe de Spring : un `Conteneur` qui, pour une classe demandée, choisit son **unique constructeur public**, résout récursivement chaque paramètre (en créant les dépendances une seule fois : singletons), détecte les cycles (`IllegalStateException("cycle : A -> B -> A")`) et affiche `création X` à chaque instanciation.

        Les classes (fournies) : `Config()`, `Depot(Config)`, `Mailer(Config)`, `ServiceUtilisateur(Depot, Mailer)`, `Controleur(ServiceUtilisateur, Mailer)`, et un cycle `Oeuf(Poule)` / `Poule(Oeuf)`. L’entrée liste les noms de classes à obtenir ; affiche ensuite `ok NomClasse` ou `erreur : message`.
      starter: |
        import java.lang.reflect.*;
        import java.util.*;

        public class Main {
            public static class Config { public Config() {} }
            public static class Depot { public Depot(Config c) {} }
            public static class Mailer { public Mailer(Config c) {} }
            public static class ServiceUtilisateur { public ServiceUtilisateur(Depot d, Mailer m) {} }
            public static class Controleur { public Controleur(ServiceUtilisateur s, Mailer m) {} }
            public static class Oeuf { public Oeuf(Poule p) {} }
            public static class Poule { public Poule(Oeuf o) {} }

            public static void main(String[] args) throws Exception {
                Scanner sc = new Scanner(System.in);
                while (sc.hasNext()) {
                    Class<?> c = Class.forName("Main$" + sc.next());
                }
            }
        }
      solution: |
        import java.lang.reflect.*;
        import java.util.*;

        public class Main {
            public static class Config { public Config() {} }
            public static class Depot { public Depot(Config c) {} }
            public static class Mailer { public Mailer(Config c) {} }
            public static class ServiceUtilisateur { public ServiceUtilisateur(Depot d, Mailer m) {} }
            public static class Controleur { public Controleur(ServiceUtilisateur s, Mailer m) {} }
            public static class Oeuf { public Oeuf(Poule p) {} }
            public static class Poule { public Poule(Oeuf o) {} }

            static class Conteneur {
                private final Map<Class<?>, Object> singletons = new HashMap<>();
                private final Deque<Class<?>> enCours = new ArrayDeque<>();

                <T> T obtenir(Class<T> c) throws ReflectiveOperationException {
                    if (singletons.containsKey(c)) return c.cast(singletons.get(c));
                    if (enCours.contains(c)) {
                        StringJoiner j = new StringJoiner(" -> ", "cycle : ", "");
                        List<Class<?>> chemin = new ArrayList<>(enCours);
                        Collections.reverse(chemin);
                        for (int i = chemin.indexOf(c); i < chemin.size(); i++) j.add(chemin.get(i).getSimpleName());
                        j.add(c.getSimpleName());
                        throw new IllegalStateException(j.toString());
                    }
                    enCours.push(c);
                    try {
                        Constructor<?> k = c.getConstructors()[0];
                        Object[] params = new Object[k.getParameterCount()];
                        Class<?>[] types = k.getParameterTypes();
                        for (int i = 0; i < params.length; i++) params[i] = obtenir(types[i]);
                        Object o = k.newInstance(params);
                        System.out.println("création " + c.getSimpleName());
                        singletons.put(c, o);
                        return c.cast(o);
                    } finally {
                        enCours.pop();
                    }
                }
            }

            public static void main(String[] args) throws Exception {
                Scanner sc = new Scanner(System.in);
                Conteneur ct = new Conteneur();
                while (sc.hasNext()) {
                    Class<?> c = Class.forName("Main$" + sc.next());
                    try { ct.obtenir(c); System.out.println("ok " + c.getSimpleName()); }
                    catch (IllegalStateException e) { System.out.println("erreur : " + e.getMessage()); }
                }
            }
        }
      tests:
        - { input: Controleur Depot Oeuf, output: "création Config\ncréation Depot\ncréation Mailer\ncréation ServiceUtilisateur\ncréation Controleur\nok Controleur\nok Depot\nerreur : cycle : Oeuf -> Poule -> Oeuf" }
        - { input: Mailer Mailer, output: "création Config\ncréation Mailer\nok Mailer\nok Mailer", hidden: true }
      require:
        - { pattern: 'getConstructors|getDeclaredConstructors', message: Utiliser la réflexion sur les constructeurs }
