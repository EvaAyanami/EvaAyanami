          choices: ['Non', 'Oui, dans l’ordre de start()', 'Oui, par ordre alphabétique des noms', 'Seulement avec des threads virtuels']
          answer: 0

  # ------------------------------------------------------------------
  - slug: java-synchronisation
    title: Synchronisation
    summary: Conditions de course, synchronized, volatile, verrous (ReentrantLock), classes atomiques, collections concurrentes et interblocages.
    minutes: 35
    concepts: [concurrence]
    sections:
      - title: Conditions de course
        body: |
          `compteur++` n’est **pas atomique** : lire, ajouter, écrire. Deux threads peuvent lire la même valeur et perdre une incrémentation.

          ```java
          class Compteur {
              private int valeur;
              synchronized void incrementer() { valeur++; }     // un seul thread à la fois sur cet objet
              synchronized int get() { return valeur; }
          }

          AtomicInteger a = new AtomicInteger();
          a.incrementAndGet();                                  // atomique, sans verrou (CAS)
          LongAdder adder = new LongAdder();                    // encore plus rapide sous forte contention

          private final ReentrantLock verrou = new ReentrantLock();
          verrou.lock();
          try { … } finally { verrou.unlock(); }               // toujours dans un finally
          ```

          `volatile` garantit la **visibilité** d’une écriture entre threads, mais pas l’atomicité d’un `++`.
      - title: Outils de haut niveau et interblocages
        body: |
          - `ConcurrentHashMap` (avec `merge`, `compute` atomiques), `CopyOnWriteArrayList`, `BlockingQueue` (producteur/consommateur) ;
          - `CountDownLatch` (attendre N événements), `Semaphore` (limiter l’accès), `CyclicBarrier`.

          **Interblocage** (deadlock) : T1 tient A et attend B, T2 tient B et attend A. Solutions : toujours prendre les verrous **dans le même ordre**, `tryLock` avec délai, limiter la portée des verrous.

          ```java
          BlockingQueue<String> file = new ArrayBlockingQueue<>(10);
          file.put("tâche");      // bloque si pleine
          String t = file.take(); // bloque si vide
          ```
    exercises:
      - id: java-sync-q1
        type: mcq
        prompt: Pourquoi compteur++ partagé entre threads peut-il perdre des incrémentations ?
        choices: ['Ce n’est pas une opération atomique (lecture-modification-écriture)', 'Les int sont limités', 'Le GC supprime des valeurs', 'Ça ne peut pas arriver']
        answer: 0
      - id: java-sync-q2
        type: mcq
        prompt: Que garantit volatile ?
        choices: ['La visibilité des écritures entre threads', 'L’atomicité de ++', 'L’exclusion mutuelle', 'L’absence d’interblocage']
        answer: 0
      - id: java-sync-bug
        type: bugfix
        prompt: Ce programme devrait afficher 400 mais affiche 0. Quelle ligne corriger ?
        code: |
          import java.util.*;
          public class Main {
              static int total = 0;
              static synchronized void ajouter(int n) { total += n; }
              public static void main(String[] args) {
                  List<Thread> ts = new ArrayList<>();
                  for (int i = 0; i < 4; i++) ts.add(new Thread(() -> {
                      try { Thread.sleep(50); ajouter(100); } catch (InterruptedException e) { }
                  }));
                  for (Thread t : ts) t.start();
                  for (Thread t : ts) t.interrupt();
                  System.out.println(total);
              }
          }
        bugLines: [11]
        choices:
          - On interrompt les threads au lieu d’attendre leur fin avec join()
          - ajouter ne doit pas être synchronized
          - Il faut appeler run() au lieu de start()
        answer: 0
        solution: |
          import java.util.*;
          public class Main {
              static int total = 0;
              static synchronized void ajouter(int n) { total += n; }
              public static void main(String[] args) throws InterruptedException {
