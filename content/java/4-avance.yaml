  - slug: java-async
    title: Programmation asynchrone
    summary: Modèles asynchrones — callbacks, boucle d’événements, producteur/consommateur, threads virtuels vs réactif, structured concurrency.
    minutes: 30
    concepts: [async]
    sections:
      - title: Modèles d’asynchronisme
        body: |
          | Modèle | Idée | Exemple Java |
          |---|---|---|
          | Callbacks | « rappelle-moi quand c’est fini » | listeners, `whenComplete` |
          | Futures | une valeur à venir | `CompletableFuture` |
          | Réactif | flux d’événements avec contre-pression | `Flow`, Reactor, RxJava |
          | Threads virtuels | code bloquant simple, mais pas cher | `Thread.ofVirtual()` |

          Avec les threads virtuels de Java 21, on peut souvent revenir à du **code séquentiel lisible** tout en gérant des milliers de connexions.
      - title: Boucle d’événements et file de messages
        body: |
          Une **boucle d’événements** traite les événements un par un depuis une file : aucun verrou nécessaire, car un seul thread touche à l’état.

          ```java
          BlockingQueue<Runnable> evenements = new LinkedBlockingQueue<>();
          Thread boucle = new Thread(() -> {
              try {
                  while (true) {
                      Runnable e = evenements.take();
                      if (e == ARRET) break;
                      e.run();
                  }
              } catch (InterruptedException ex) { Thread.currentThread().interrupt(); }
          });
          ```

          C’est le modèle de Node.js, des interfaces graphiques (Swing EDT, JavaFX) et de nombreux serveurs (Netty).
    exercises:
      - id: java-async-q1
        type: mcq
        prompt: Pourquoi une boucle d’événements mono-thread n’a-t-elle pas besoin de verrous pour son état ?
        choices: ['Un seul thread accède à l’état', 'Java verrouille automatiquement', 'Les événements sont immuables', 'Elle en a besoin']
        answer: 0
      - id: java-async-q2
        type: mcq
        prompt: Que signifie la contre-pression (backpressure) en programmation réactive ?
        choices: ['Le consommateur limite le débit du producteur', 'Le producteur accélère', 'Une erreur réseau', 'Un type de GC']
        answer: 0
      - id: java-async-code
        type: code
        title: Producteur / consommateur
        prompt: |
          Un thread **producteur** lit les entiers de l’entrée et les place dans une `ArrayBlockingQueue<Integer>` de capacité 2, puis envoie le marqueur `-1` (pas présent dans les données). Un thread **consommateur** les retire, affiche `traité x -> x²`, et compte. Le main joint les deux threads puis affiche `total : N`.
        starter: |
          import java.util.*;
          import java.util.concurrent.*;

          public class Main {
              public static void main(String[] args) throws InterruptedException {
                  Scanner sc = new Scanner(System.in);
                  List<Integer> donnees = new ArrayList<>();
                  while (sc.hasNextInt()) donnees.add(sc.nextInt());
              }
          }
        solution: |
          import java.util.*;
          import java.util.concurrent.*;

          public class Main {
              public static void main(String[] args) throws InterruptedException {
                  Scanner sc = new Scanner(System.in);
                  List<Integer> donnees = new ArrayList<>();
                  while (sc.hasNextInt()) donnees.add(sc.nextInt());
                  BlockingQueue<Integer> file = new ArrayBlockingQueue<>(2);
                  int[] compte = {0};
                  Thread prod = new Thread(() -> {
                      try { for (int x : donnees) file.put(x); file.put(-1); }
                      catch (InterruptedException e) { Thread.currentThread().interrupt(); }
                  });
                  Thread cons = new Thread(() -> {
                      try {
                          while (true) {
                              int x = file.take();
                              if (x == -1) break;
                              System.out.println("traité " + x + " -> " + x * x);
                              compte[0]++;
                          }
                      } catch (InterruptedException e) { Thread.currentThread().interrupt(); }
                  });
                  prod.start(); cons.start();
                  prod.join(); cons.join();
                  System.out.println("total : " + compte[0]);
              }
          }
        tests:
          - { input: 3 5 7 9, output: "traité 3 -> 9\ntraité 5 -> 25\ntraité 7 -> 49\ntraité 9 -> 81\ntotal : 4" }
          - { input: '', output: 'total : 0', hidden: true }
        require:
          - { pattern: 'BlockingQueue', message: Utiliser une BlockingQueue }
    project:
      id: java-async-projet
      type: code
      title: Boucle d’événements avec minuteries
      difficulty: 3
      prompt: |
        Simule une boucle d’événements à temps virtuel. Commandes : `timeout NOM DELAI` (planifie l’événement NOM à `maintenant + DELAI`), `tick N` (avance le temps de N unités en déclenchant dans l’ordre les événements échus : par heure d’échéance, puis ordre de planification), `annuler NOM`.

        Quand un événement se déclenche, affiche `[t=HEURE] NOM`. Un événement nommé `relance-X` replanifie automatiquement `X` 5 unités plus tard. Termine par `en attente : N`.
      starter: |
        import java.util.*;

        public class Main {
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
            }
        }
      solution: |
        import java.util.*;

        public class Main {
            record Ev(long heure, long seq, String nom) {}
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
                PriorityQueue<Ev> file = new PriorityQueue<>(Comparator.comparingLong(Ev::heure).thenComparingLong(Ev::seq));
                long maintenant = 0, seq = 0;
                while (sc.hasNext()) {
                    switch (sc.next()) {
                        case "timeout" -> { String n = sc.next(); file.add(new Ev(maintenant + sc.nextLong(), seq++, n)); }
                        case "annuler" -> { String n = sc.next(); file.removeIf(e -> e.nom().equals(n)); }
                        default -> {
                            long fin = maintenant + sc.nextLong();
                            while (!file.isEmpty() && file.peek().heure() <= fin) {
                                Ev e = file.poll();
                                maintenant = e.heure();
                                System.out.println("[t=" + maintenant + "] " + e.nom());
                                if (e.nom().startsWith("relance-")) file.add(new Ev(maintenant + 5, seq++, e.nom().substring(8)));
                            }
                            maintenant = fin;
                        }
                    }
                }
                System.out.println("en attente : " + file.size());
            }
        }
      tests:
        - { input: "timeout a 3\ntimeout b 1\ntimeout relance-c 2\ntimeout d 50\ntick 10\nannuler d\ntimeout e 1\ntick 1", output: "[t=1] b\n[t=2] relance-c\n[t=3] a\n[t=7] c\n[t=11] e\nen attente : 0" }
        - { input: "timeout x 5\ntick 4", output: 'en attente : 1', hidden: true }
