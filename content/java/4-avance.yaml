        output: 325 5050 TERMINATED
        concepts: [concurrence]
      - id: java-thr-code
        type: code
        title: Somme parallèle
        prompt: 'Lis `n` puis `k`. Découpe l’intervalle `1..n` en `k` tranches contiguës, calcule la somme des carrés de chaque tranche dans **un thread par tranche**, joins-les et affiche chaque somme partielle (une par ligne) puis `total : T`.'
        starter: |
          import java.util.*;

          public class Main {
              public static void main(String[] args) throws InterruptedException {
                  Scanner sc = new Scanner(System.in);
                  long n = sc.nextLong();
                  int k = sc.nextInt();
              }
          }
        solution: |
          import java.util.*;

          public class Main {
              public static void main(String[] args) throws InterruptedException {
                  Scanner sc = new Scanner(System.in);
                  long n = sc.nextLong();
                  int k = sc.nextInt();
                  long[] res = new long[k];
                  Thread[] ts = new Thread[k];
                  long taille = (n + k - 1) / k;
                  for (int i = 0; i < k; i++) {
                      final int id = i;
                      ts[i] = new Thread(() -> {
                          long debut = id * taille + 1, fin = Math.min(n, (id + 1) * taille);
                          for (long x = debut; x <= fin; x++) res[id] += x * x;
                      });
                      ts[i].start();
                  }
                  long total = 0;
                  for (int i = 0; i < k; i++) { ts[i].join(); System.out.println(res[i]); total += res[i]; }
                  System.out.println("total : " + total);
              }
          }
        tests:
          - { input: 10 3, output: "30\n174\n181\ntotal : 385" }
          - { input: 4 2, output: "5\n25\ntotal : 30", hidden: true }
        require:
          - { pattern: '\.join\(', message: Attendre les threads avec join }
    project:
      id: java-thr-projet
      type: code
      title: Recherche parallèle de nombres premiers
      difficulty: 3
      prompt: 'Lis `n` et `k`. Chaque thread `i` (0 ≤ i < k) teste les nombres `x` de 2 à n tels que `x % k == i` et les ajoute à sa propre liste. Une fois les threads joints, fusionne, trie et affiche le nombre de premiers, puis les 5 plus grands (ordre croissant), puis le nombre trouvé par chaque thread (`thread i : c`).'
      starter: |
        import java.util.*;

        public class Main {
            public static void main(String[] args) throws InterruptedException {
                Scanner sc = new Scanner(System.in);
            }
        }
      solution: |
        import java.util.*;

        public class Main {
            static boolean premier(int x) {
                if (x < 2) return false;
                for (int d = 2; (long) d * d <= x; d++) if (x % d == 0) return false;
                return true;
            }
            public static void main(String[] args) throws InterruptedException {
                Scanner sc = new Scanner(System.in);
                int n = sc.nextInt(), k = sc.nextInt();
                List<List<Integer>> listes = new ArrayList<>();
                Thread[] ts = new Thread[k];
                for (int i = 0; i < k; i++) {
                    List<Integer> l = new ArrayList<>();
                    listes.add(l);
                    final int id = i;
                    ts[i] = new Thread(() -> { for (int x = 2; x <= n; x++) if (x % k == id && premier(x)) l.add(x); });
                    ts[i].start();
                }
                for (Thread t : ts) t.join();
                List<Integer> tous = new ArrayList<>();
                listes.forEach(tous::addAll);
                Collections.sort(tous);
                System.out.println(tous.size());
                System.out.println(tous.subList(Math.max(0, tous.size() - 5), tous.size()));
                for (int i = 0; i < k; i++) System.out.println("thread " + i + " : " + listes.get(i).size());
            }
        }
      tests:
        - { input: 50 3, output: "15\n[31, 37, 41, 43, 47]\nthread 0 : 1\nthread 1 : 6\nthread 2 : 8" }
        - { input: 10 2, output: "4\n[2, 3, 5, 7]\nthread 0 : 1\nthread 1 : 3", hidden: true }
