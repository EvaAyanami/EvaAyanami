language: java
level: 4
chapters:
  # ------------------------------------------------------------------
  - slug: java-threads
    title: Multithreading
    summary: Créer et coordonner des threads — Thread, Runnable, start/join, threads virtuels (Java 21), états et interruption.
    minutes: 35
    concepts: [concurrence]
    sections:
      - title: Créer des threads
        body: |
          ```java
          Thread t = new Thread(() -> System.out.println("dans " + Thread.currentThread().getName()));
          t.start();          // lance l’exécution en parallèle (run() l’exécuterait dans le thread courant !)
          t.join();           // attend la fin du thread

          Thread v = Thread.ofVirtual().start(() -> travail());   // thread virtuel (Java 21)
          try (var ex = Executors.newVirtualThreadPerTaskExecutor()) {
              for (int i = 0; i < 10_000; i++) ex.submit(() -> appelReseau());
          }
          ```

          Les **threads virtuels** sont très légers (gérés par la JVM, pas par l’OS) : idéaux pour des milliers de tâches qui attendent des E/S.
      - title: Cycle de vie et interruption
        body: |
          États : `NEW` → `RUNNABLE` → (`BLOCKED`, `WAITING`, `TIMED_WAITING`) → `TERMINATED`.

          On n’arrête pas un thread de force : on lui **demande** de s’arrêter.

          ```java
          Thread t = new Thread(() -> {
              while (!Thread.currentThread().isInterrupted()) {
                  try { Thread.sleep(100); }
                  catch (InterruptedException e) { Thread.currentThread().interrupt(); }  // rétablir le drapeau
              }
          });
          t.start();
          t.interrupt();
          ```

          L’ordre d’exécution entre threads n’est **pas déterministe** : un programme correct ne doit pas en dépendre. Pour obtenir un résultat reproductible, on **joint** les threads puis on combine leurs résultats.
    exercises:
