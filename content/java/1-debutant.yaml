                public static void main(String[] args) {
                    int x = 10;
                    x -= 3;
                    x *= 2;
                    x %= 5;
                    System.out.println(x);
                }
            }
          output: '4'

  # ------------------------------------------------------------------
  - slug: java-types
    title: Types
    summary: Types primitifs et types référence, tailles fixes, conversions, casts, classes enveloppes et pièges du dépassement.
    minutes: 25
    concepts: [types]
    sections:
      - title: Les 8 types primitifs
        body: |
          | Type | Taille | Exemple |
          |---|---|---|
          | `byte` | 8 bits | `(byte) 100` |
          | `short` | 16 bits | `30000` |
          | `int` | 32 bits | `42` |
          | `long` | 64 bits | `9_000_000_000L` |
          | `float` | 32 bits | `3.14f` |
          | `double` | 64 bits | `3.14` |
          | `char` | 16 bits (UTF-16) | `'K'` |
          | `boolean` | — | `true` |

          Les tailles sont **identiques sur toutes les plateformes**. Tout le reste (`String`, tableaux, objets) est un **type référence**.

          Chaque primitif a une **classe enveloppe** : `Integer`, `Long`, `Double`, `Character`, `Boolean`… utilisée dans les collections (`List<Integer>`), avec conversion automatique (*autoboxing*).
      - title: Conversions et pièges
        body: |
          ```java
          int i = 42;
          long l = i;              // élargissement implicite
          double d = i;            // 42.0
          int t = (int) 9.99;      // cast explicite : 9 (troncature)
          int div = 7 / 2;         // 3
          double vraie = 7 / 2.0;  // 3.5

          int max = Integer.MAX_VALUE;
          System.out.println(max + 1);        // -2147483648 : dépassement silencieux !
          Math.addExact(max, 1);              // lève ArithmeticException

          int n = Integer.parseInt("123");    // texte → nombre
          String s = String.valueOf(3.5);     // nombre → texte
          ```

