              public static void main(String[] args) {
                  int n = 7;
                  String s = n > 0 {{?}} "positif" {{?}} "négatif ou nul";
                  System.out.println(s);
              }
          }
        blanks: [['?'], [':']]
        tests:
          - { input: '', output: positif }
      - id: java-op-code
        type: code
        title: Calculatrice
        prompt: Lis deux entiers `a` et `b` (b ≠ 0) et affiche sur cinq lignes `a + b = …`, `a - b = …`, `a * b = …`, `a / b = …`, `a % b = …`.
        starter: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner sc = new Scanner(System.in);
                  long a = sc.nextLong(), b = sc.nextLong();
              }
          }
        solution: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner sc = new Scanner(System.in);
                  long a = sc.nextLong(), b = sc.nextLong();
                  System.out.println(a + " + " + b + " = " + (a + b));
                  System.out.println(a + " - " + b + " = " + (a - b));
                  System.out.println(a + " * " + b + " = " + (a * b));
                  System.out.println(a + " / " + b + " = " + (a / b));
                  System.out.println(a + " % " + b + " = " + (a % b));
              }
          }
        tests:
          - { input: 17 5, output: "17 + 5 = 22\n17 - 5 = 12\n17 * 5 = 85\n17 / 5 = 3\n17 % 5 = 2" }
          - { input: -9 4, output: "-9 + 4 = -5\n-9 - 4 = -13\n-9 * 4 = -36\n-9 / 4 = -2\n-9 % 4 = -1", hidden: true }
