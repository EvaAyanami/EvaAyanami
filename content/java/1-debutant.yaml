        title: Palindrome
        prompt: Pour chaque ligne, affiche `oui` si c’est un palindrome en ignorant les espaces et la casse, `non` sinon.
        starter: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
