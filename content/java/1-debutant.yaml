  - slug: java-methodes
    title: Fonctions et méthodes
    summary: Méthodes statiques, paramètres et valeur de retour, passage par valeur, surcharge, récursivité et varargs.
    minutes: 30
    concepts: [fonctions]
    sections:
      - title: Déclarer une méthode
        body: |
          ```java
          public class Main {
              static int carre(int x) {             // méthode de classe (static)
                  return x * x;
              }
              static double moyenne(double... xs) { // varargs : nombre variable d’arguments
                  double s = 0;
                  for (double x : xs) s += x;
                  return xs.length == 0 ? 0 : s / xs.length;
              }
              static void saluer(String nom) { System.out.println("Bonjour " + nom); }

              public static void main(String[] args) {
                  System.out.println(carre(7));          // 49
                  System.out.println(moyenne(2, 4, 9));  // 5.0
              }
          }
          ```

          L’ordre des méthodes dans la classe n’a pas d’importance. `void` = ne renvoie rien.
      - title: Passage par valeur et surcharge
        body: |
          Java passe **toujours par valeur** : pour un primitif, la valeur est copiée ; pour un objet, c’est la **référence** qui est copiée (la méthode peut donc modifier l’objet, mais pas faire pointer la variable de l’appelant ailleurs).

          ```java
          static void f(int x) { x = 99; }                    // sans effet pour l’appelant
          static void g(int[] t) { t[0] = 99; }               // modifie le tableau partagé
          static void h(int[] t) { t = new int[]{1}; }        // sans effet pour l’appelant
          ```

          **Surcharge** : plusieurs méthodes de même nom avec des paramètres différents : `max(int, int)` et `max(double, double)`.
