  - slug: java-boucles
    title: Boucles
    summary: for, while, do…while, boucle for-each, break et continue, étiquettes et pièges classiques.
    minutes: 25
    concepts: [boucles]
    sections:
      - title: Les boucles
        body: |
          ```java
          for (int i = 0; i < 5; i++) { System.out.print(i + " "); }   // 0 1 2 3 4

          int n = 3;
          while (n > 0) { System.out.println(n-- + "…"); }

          int choix;
          do { choix = sc.nextInt(); } while (choix < 1 || choix > 3);  // au moins une fois

          int[] notes = {12, 17, 9};
          for (int note : notes) { System.out.println(note); }          // for-each
          ```

          `break` sort de la boucle, `continue` passe au tour suivant. Une **étiquette** permet de sortir de boucles imbriquées : `externe: for (…) { for (…) { break externe; } }`.
      - title: Pièges
        body: |
          - *Off-by-one* : `i <= n` fait un tour de trop pour un tableau de taille n.
          - Boucle infinie : la variable de contrôle ne change jamais.
          - Modifier une `List` pendant un for-each → `ConcurrentModificationException` (utiliser un `Iterator` et `remove()`, ou `removeIf`).
          - Concaténer des `String` dans une grande boucle est lent : utiliser un `StringBuilder`.
    exercises:
      - id: java-loop-predict
        type: predict
        prompt: Que va afficher ce programme ?
        code: |
          public class Main {
              public static void main(String[] args) {
                  int s = 0;
                  externe:
                  for (int i = 1; i <= 4; i++) {
                      for (int j = 1; j <= 4; j++) {
                          if (j > i) continue externe;
                          if (i * j > 6) break externe;
                          s += i * j;
                      }
                  }
                  System.out.println(s);
              }
          }
        output: '16'
