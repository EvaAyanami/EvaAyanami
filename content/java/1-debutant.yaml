      prompt: |
        Pour chaque ligne `a b` (entiers int), affiche la somme et le produit avec `Math.addExact` et `Math.multiplyExact` ; en cas de dépassement, affiche `dépassement` pour l’opération concernée. Format : `somme=… produit=…`.
      starter: |
        import java.util.Scanner;

        public class Main {
            public static void main(String[] args) {
