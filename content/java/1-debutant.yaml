  # ------------------------------------------------------------------
  - slug: java-tableaux
    title: Tableaux
    summary: Déclaration, initialisation, parcours, Arrays.sort/toString/fill, tableaux à deux dimensions et limites des tableaux.
    minutes: 25
    concepts: [tableaux, collections]
    sections:
      - title: Tableaux
        body: |
          ```java
          int[] notes = {12, 15, 9};          // initialisation directe
          int[] zeros = new int[5];           // [0, 0, 0, 0, 0] (valeurs par défaut)
          String[] noms = new String[3];      // [null, null, null]
          notes[0] = 18;
          System.out.println(notes.length);   // 3 (attribut, pas de parenthèses)

          import java.util.Arrays;
          Arrays.sort(notes);                         // tri
          System.out.println(Arrays.toString(notes)); // [9, 15, 18]
          Arrays.fill(zeros, 7);
          int[] copie = Arrays.copyOf(notes, 5);      // [9, 15, 18, 0, 0]
          int pos = Arrays.binarySearch(notes, 15);   // 1
          ```

          La taille d’un tableau est **fixe**. Pour une taille variable, on utilisera `ArrayList` (niveau Intermédiaire). Un indice invalide lève `ArrayIndexOutOfBoundsException`.
      - title: Deux dimensions
        body: |
          ```java
          int[][] grille = new int[3][4];         // 3 lignes, 4 colonnes
          grille[1][2] = 7;
          int[][] triangle = {{1}, {1, 1}, {1, 2, 1}};  // lignes de longueurs différentes
          for (int[] ligne : triangle) {
              System.out.println(Arrays.toString(ligne));
          }
          System.out.println(Arrays.deepToString(grille));
          ```

          ⚠️ `int[] b = a;` ne copie pas : `a` et `b` désignent le **même** tableau. Utilise `a.clone()` ou `Arrays.copyOf`. Pour comparer le contenu : `Arrays.equals(a, b)`.
