    project:
      id: java-str-projet
      type: code
      title: Formateur de noms
      difficulty: 2
      prompt: Chaque ligne contient un nom mal formaté (`   jEAN   dupont `). Affiche-le au format `Jean DUPONT` (dernier mot en majuscules, les autres capitalisés, un seul espace entre les mots).
      starter: |
        import java.util.Scanner;

        public class Main {
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
                while (sc.hasNextLine()) {
                }
            }
        }
      solution: |
        import java.util.Scanner;

        public class Main {
            static String capitaliser(String m) {
                return m.substring(0, 1).toUpperCase() + m.substring(1).toLowerCase();
            }
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
                while (sc.hasNextLine()) {
                    String[] mots = sc.nextLine().strip().split("\\s+");
                    StringBuilder sb = new StringBuilder();
                    for (int i = 0; i < mots.length; i++) {
                        if (i > 0) sb.append(' ');
                        sb.append(i == mots.length - 1 ? mots[i].toUpperCase() : capitaliser(mots[i]));
                    }
                    System.out.println(sb);
                }
            }
        }
      tests:
        - { input: '   jEAN   dupont ', output: Jean DUPONT }
        - { input: "ada lovelace\nmarie   sKLODOWSKA curie", output: "Ada LOVELACE\nMarie Sklodowska CURIE", hidden: true }
