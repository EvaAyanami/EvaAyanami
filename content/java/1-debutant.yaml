      solution: |
        import java.util.Scanner;

        public class Main {
            static String somme(int a, int b) {
                try { return String.valueOf(Math.addExact(a, b)); } catch (ArithmeticException e) { return "dépassement"; }
            }
            static String produit(int a, int b) {
                try { return String.valueOf(Math.multiplyExact(a, b)); } catch (ArithmeticException e) { return "dépassement"; }
            }
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
                while (sc.hasNextInt()) {
                    int a = sc.nextInt(), b = sc.nextInt();
                    System.out.println("somme=" + somme(a, b) + " produit=" + produit(a, b));
                }
            }
        }
