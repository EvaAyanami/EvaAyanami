  - slug: java-operateurs
    title: Opérateurs
    summary: Opérateurs arithmétiques, incrémentation, comparaison, logiques, ternaire, priorités et concaténation de chaînes.
    minutes: 20
    concepts: [operateurs]
    sections:
      - title: Les opérateurs
        body: |
          | Catégorie | Opérateurs |
          |---|---|
          | Arithmétiques | `+ - * / %` |
          | Incrémentation | `++ --` (pré et post) |
          | Comparaison | `== != < <= > >=` |
          | Logiques | `&& \|\| !` (paresseux) |
          | Affectation | `= += -= *= /= %=` |
          | Ternaire | `cond ? a : b` |

          ```java
          int a = 5;
          int b = a++;    // b = 5, a = 6
          int c = ++a;    // a = 7, c = 7
          String parite = a % 2 == 0 ? "pair" : "impair";
          ```
      - title: Le piège de +
        body: |
          `+` additionne des nombres… mais **concatène** dès qu’un opérande est une `String`, de gauche à droite :

          ```java
          System.out.println(1 + 2 + "3");   // "33"
          System.out.println("1" + 2 + 3);   // "123"
          System.out.println("1" + (2 + 3)); // "15"
          ```

          `Math` fournit `Math.pow`, `Math.sqrt`, `Math.abs`, `Math.max`, `Math.round`, `Math.floorMod` (modulo toujours positif). Le `%` Java garde le signe du dividende : `-7 % 3 == -1`.
    exercises:
      - id: java-op-predict
        type: predict
        prompt: Que va afficher ce programme ?
        code: |
          public class Main {
              public static void main(String[] args) {
                  int x = 4;
                  int y = x++ * 2 + --x;
                  System.out.println(x + " " + y + " " + (-7 % 3) + " " + Math.floorMod(-7, 3));
              }
          }
        output: 4 12 -1 2
      - id: java-op-q1
        type: mcq
        prompt: Que vaut "1" + 2 + 3 ?
        choices: ['"123"', '6', '"15"', 'Erreur']
        answer: 0
