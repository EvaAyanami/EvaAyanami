  # ------------------------------------------------------------------
  - slug: java-variables
    title: Variables
    summary: Déclarer et initialiser des variables, var, final, portée, constantes et conventions de nommage.
    minutes: 20
    concepts: [variables]
    sections:
      - title: Déclarer
        body: |
          ```java
          int age = 25;
          double taille = 1.62;
          String nom = "Kiri";
          boolean actif = true;
          var score = 100;          // type déduit (int), variables locales uniquement
          final int VIES = 3;       // non modifiable après initialisation
          ```

          - Une variable **locale** doit être initialisée avant d’être lue (sinon erreur de compilation : *might not have been initialized*).
          - `var` n’est pas un type dynamique : le type est fixé à la compilation.
          - Constantes de classe : `static final double TVA = 0.2;` (en `MAJUSCULES_AVEC_UNDERSCORES`).
      - title: Conventions et portée
        body: |
          | Élément | Convention | Exemple |
          |---|---|---|
          | variables, méthodes | camelCase | `nombreTotal`, `calculerPrix()` |
          | classes | PascalCase | `CompteBancaire` |
          | constantes | MAJUSCULES | `VITESSE_MAX` |
          | packages | minuscules | `fr.codemori.jeu` |

          Une variable n’existe que dans le bloc `{ }` où elle est déclarée. Java interdit de redéclarer une variable locale du même nom dans un bloc imbriqué (contrairement au C++).
    exercises:
      - id: java-var-predict
        type: predict
        prompt: Que va afficher ce programme ?
        code: |
          public class Main {
              public static void main(String[] args) {
                  int a = 5;
                  var b = a * 2;
                  a += 1;
                  int c = a++ + ++b;
                  System.out.println(a + " " + b + " " + c);
              }
          }
        output: 7 11 17
      - id: java-var-q1
        type: mcq
        prompt: Que signifie final devant une variable ?
        choices: ['Sa valeur ne peut plus être modifiée après initialisation', 'Elle est la dernière déclarée', 'Elle est globale', 'Elle est supprimée à la fin']
        answer: 0
      - id: java-var-bug
        type: bugfix
        prompt: Ce programme ne compile pas. Trouve l’erreur.
        code: |
          public class Main {
              public static void main(String[] args) {
                  int total;
                  for (int i = 1; i <= 3; i++) {
                      total += i;
                  }
                  System.out.println(total);
              }
          }
        bugLines: [3]
        choices:
          - total n’est pas initialisée avant d’être utilisée
          - On ne peut pas additionner dans une boucle
          - i doit être déclaré avant la boucle
        answer: 0
        solution: |
          public class Main {
              public static void main(String[] args) {
                  int total = 0;
                  for (int i = 1; i <= 3; i++) {
                      total += i;
                  }
                  System.out.println(total);
              }
          }
        tests:
          - { input: '', output: '6' }
      - id: java-var-code
        type: code
        title: Échange
        prompt: Lis deux entiers `a` et `b`, échange-les avec une variable temporaire et affiche `a b`.
        starter: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner sc = new Scanner(System.in);
                  int a = sc.nextInt(), b = sc.nextInt();
                  // échange
                  System.out.println(a + " " + b);
              }
          }
        solution: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner sc = new Scanner(System.in);
                  int a = sc.nextInt(), b = sc.nextInt();
                  int tmp = a;
                  a = b;
                  b = tmp;
                  System.out.println(a + " " + b);
              }
          }
        tests:
          - { input: 3 8, output: 8 3 }
          - { input: -1 0, output: 0 -1, hidden: true }
    project:
      id: java-var-projet
      type: code
      title: Convertisseur de durée
      difficulty: 2
      prompt: Lis un nombre de secondes et affiche `H h M min S s` en utilisant des constantes `static final`.
      starter: |
        import java.util.Scanner;

        public class Main {
            public static void main(String[] args) {
                long total = new Scanner(System.in).nextLong();
            }
        }
      solution: |
        import java.util.Scanner;

        public class Main {
            static final long SECONDES_PAR_MINUTE = 60;
            static final long SECONDES_PAR_HEURE = 60 * SECONDES_PAR_MINUTE;

            public static void main(String[] args) {
                long total = new Scanner(System.in).nextLong();
                long h = total / SECONDES_PAR_HEURE;
                long m = total % SECONDES_PAR_HEURE / SECONDES_PAR_MINUTE;
                long s = total % SECONDES_PAR_MINUTE;
                System.out.println(h + " h " + m + " min " + s + " s");
            }
        }
      tests:
        - { input: '3725', output: 1 h 2 min 5 s }
        - { input: '86399', output: 23 h 59 min 59 s, hidden: true }
      require:
        - { pattern: 'static\s+final', message: Utiliser des constantes static final }
    exam:
      pass: 70
      questions:
        - id: java-var-ex1
          type: mcq
          prompt: Où peut-on utiliser var ?
          choices: ['Pour les variables locales avec initialiseur', 'Partout, y compris les attributs', 'Seulement pour les String', 'Nulle part en Java 21']
          answer: 0
        - id: java-var-ex2
          type: mcq
          prompt: Quel nom de constante respecte les conventions ?
          choices: ['TAUX_MAX', 'tauxMax', 'TauxMax', 'taux_max']
          answer: 0
        - id: java-var-ex3
          type: predict
          prompt: Que va afficher ce programme ?
