                  Scanner sc = new Scanner(System.in);
                  while (sc.hasNextLine()) {
                      String l = sc.nextLine().replace(" ", "").toLowerCase();
                      String r = new StringBuilder(l).reverse().toString();
                      System.out.println(l.equals(r) ? "oui" : "non");
                  }
              }
          }
