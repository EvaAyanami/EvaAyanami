      - id: java-pp-code
        type: code
        title: Addition
        prompt: Lis deux entiers et affiche `a + b = résultat`.
        starter: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner sc = new Scanner(System.in);
                  long a = sc.nextLong();
                  long b = sc.nextLong();
              }
          }
        solution: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner sc = new Scanner(System.in);
                  long a = sc.nextLong();
                  long b = sc.nextLong();
                  System.out.println(a + " + " + b + " = " + (a + b));
              }
          }
        tests:
          - { input: 2 3, output: 2 + 3 = 5 }
          - { input: "10\n-4", output: 10 + -4 = 6, hidden: true }
        hints: ['Attention aux parenthèses : sans elles, `"…" + a + b` concatène au lieu d’additionner.']
    project:
