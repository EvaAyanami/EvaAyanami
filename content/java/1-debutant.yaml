    project:
      id: java-tab-projet
      type: code
      title: Matrice transposée
      difficulty: 2
      prompt: Lis `l c` puis une matrice `l × c`. Affiche sa transposée (`c × l`), puis la somme de chaque ligne de la matrice d’origine séparées par des espaces.
      starter: |
        import java.util.Scanner;

        public class Main {
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
                int l = sc.nextInt(), c = sc.nextInt();
                int[][] m = new int[l][c];
            }
        }
      solution: |
        import java.util.Scanner;

        public class Main {
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
                int l = sc.nextInt(), c = sc.nextInt();
                int[][] m = new int[l][c];
                for (int i = 0; i < l; i++) for (int j = 0; j < c; j++) m[i][j] = sc.nextInt();
                StringBuilder sb = new StringBuilder();
                for (int j = 0; j < c; j++) {
                    for (int i = 0; i < l; i++) sb.append(i > 0 ? " " : "").append(m[i][j]);
                    sb.append('\n');
                }
                for (int i = 0; i < l; i++) {
                    long s = 0;
                    for (int x : m[i]) s += x;
                    sb.append(i > 0 ? " " : "").append(s);
                }
                System.out.println(sb);
            }
        }
      tests:
        - { input: "2 3\n1 2 3\n4 5 6", output: "1 4\n2 5\n3 6\n6 15" }
        - { input: "1 1\n7", output: "7\n7", hidden: true }
