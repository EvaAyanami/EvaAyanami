  - slug: java-strings
    title: Strings
    summary: La classe String immuable, méthodes essentielles, StringBuilder, comparaisons, text blocks et formatage.
    minutes: 30
    concepts: [chaines]
    sections:
      - title: String est immuable
        body: |
          ```java
          String s = "Bonjour";
          s.length();                // 7
          s.charAt(0);               // 'B'
          s.substring(0, 3);         // "Bon"
          s.indexOf("jour");         // 3 (-1 si absent)
          s.toUpperCase();           // "BONJOUR" (nouvelle chaîne)
          s.contains("jour");        // true
          s.replace("o", "0");       // "B0nj0ur"
          s.split(" ");              // tableau de mots
          "  x ".strip();            // "x"
          String.join("-", "a", "b"); // "a-b"
          "ab".repeat(3);            // "ababab"
          ```

          Une `String` n’est **jamais modifiée** : chaque méthode renvoie une nouvelle chaîne. `s.toUpperCase();` seul ne change pas `s` !
      - title: StringBuilder, comparaisons, text blocks
        body: |
          Pour construire une chaîne par morceaux (dans une boucle), `StringBuilder` évite de créer une chaîne à chaque étape :

          ```java
          StringBuilder sb = new StringBuilder();
          for (int i = 0; i < 5; i++) sb.append(i).append(',');
          sb.setLength(sb.length() - 1);   // retire la dernière virgule
          sb.reverse();
          String resultat = sb.toString();
          ```

          Comparaisons : `equals`, `equalsIgnoreCase`, `compareTo` (ordre lexicographique), `isEmpty`, `isBlank`.

          **Text blocks** (Java 15) et formatage :

          ```java
          String json = """
              { "nom": "Kiri", "age": 16 }
              """;
          String msg = "%s a %d ans".formatted("Kiri", 16);
          ```
