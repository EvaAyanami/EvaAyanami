  - slug: java-premier-programme
    title: Premier programme
    summary: La classe Main, la méthode main, System.out.println et print, lire au clavier avec Scanner.
    minutes: 20
    concepts: [affichage, main]
    sections:
      - title: Anatomie
        body: |
          ```java
          public class Main {                          // classe publique = nom du fichier
              public static void main(String[] args) { // point d’entrée
                  System.out.println("Bonjour !");     // affiche + retour à la ligne
                  System.out.print("sans ");           // sans retour à la ligne
                  System.out.println("retour");
                  System.out.printf("%d + %d = %d%n", 2, 3, 5);  // format
              }
          }
          ```

          - En Java, **tout code est dans une classe**.
          - `public static void main(String[] args)` : signature exacte du point d’entrée.
          - Chaque instruction se termine par `;`, les blocs sont entre accolades.
          - Java distingue majuscules et minuscules (`System` ≠ `system`).
      - title: Lire au clavier
        body: |
          ```java
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner sc = new Scanner(System.in);
                  int age = sc.nextInt();          // lit un entier
                  sc.nextLine();                   // consomme la fin de ligne restante
                  String nom = sc.nextLine();      // lit une ligne entière
                  double taille = sc.nextDouble();
                  System.out.println(nom + " a " + age + " ans");
              }
          }
          ```

          `sc.hasNextInt()` / `sc.hasNextLine()` testent s’il reste des données. Pour de gros volumes, `BufferedReader` est plus rapide.
    exercises:
      - id: java-pp-predict
        type: predict
        prompt: Que va afficher ce programme ?
        code: |
          public class Main {
              public static void main(String[] args) {
                  System.out.print("A");
