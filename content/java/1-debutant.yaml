        import java.util.Scanner;

        public class Main {
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
                while (sc.hasNext()) {
                    long a = sc.nextLong();
                    String op = sc.next();
                    long b = sc.nextLong();
                    String r = switch (op) {
                        case "+" -> String.valueOf(a + b);
                        case "-" -> String.valueOf(a - b);
                        case "*" -> String.valueOf(a * b);
                        case "/", "%" -> b == 0 ? "erreur : division par zéro" : String.valueOf(op.equals("/") ? a / b : a % b);
                        default -> "erreur : opérateur inconnu";
                    };
                    System.out.println(r);
                }
            }
        }
