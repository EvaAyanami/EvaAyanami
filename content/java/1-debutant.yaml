language: java
level: 1
chapters:
  # ------------------------------------------------------------------
  - slug: java-presentation
    title: Présentation de Java
    summary: Histoire, philosophie « write once, run anywhere » et domaines d’utilisation de Java, l’un des langages les plus utilisés au monde.
    minutes: 15
    concepts: [java]
    sections:
      - title: Un langage partout
        body: |
          **Java** a été créé par **James Gosling** chez Sun Microsystems et publié en **1995**. Sa promesse : *Write Once, Run Anywhere* — le même programme compilé s’exécute sur Windows, Linux, macOS… grâce à la **machine virtuelle Java** (JVM).

          On le retrouve :

          - dans les **applications d’entreprise** (banques, assurances, administrations) et les services backend (Spring) ;
          - sur **Android** (avec Kotlin, qui tourne aussi sur la JVM) ;
          - dans le **big data** (Hadoop, Kafka, Spark), les outils de développement (IntelliJ, Eclipse), et même les jeux (Minecraft).

          Java est **orienté objet**, **fortement typé**, et sa mémoire est gérée automatiquement par un **ramasse-miettes** (*garbage collector*).
      - title: Java moderne
        body: |
          Une nouvelle version sort tous les six mois, avec une version **LTS** (support long) tous les deux ans : Java 8, 11, 17, **21**, 25…

          Le Java moderne est bien plus concis qu’autrefois : `var`, `record`, *text blocks*, `switch` avec flèches et motifs, streams et lambdas, threads virtuels.

          ```java
          record Point(int x, int y) {}
          var p = new Point(3, 4);
          System.out.println(p);   // Point[x=3, y=4]
          ```

          Sur Codemori, ton code est compilé avec `javac` et exécuté par un **OpenJDK 21** (LTS). La classe principale doit s’appeler `Main`.
    exercises:
      - id: java-pres-q1
        type: mcq
        prompt: Que signifie « Write Once, Run Anywhere » ?
        choices: ['Un programme compilé s’exécute sur tout système disposant d’une JVM', 'On n’écrit le code qu’une fois par an', 'Java est interprété ligne par ligne', 'Java fonctionne sans ordinateur']
        answer: 0
      - id: java-pres-q2
        type: mcq
        prompt: Qui gère la mémoire en Java ?
        choices: ['Le ramasse-miettes (garbage collector) de la JVM', 'Le programmeur avec free()', 'Le système d’exploitation uniquement', 'Personne']
        answer: 0
      - id: java-pres-q3
        type: mcq
        prompt: Qu’est-ce qu’une version LTS ?
        choices: ['Une version maintenue sur une longue durée', 'Une version expérimentale', 'Une version pour Android uniquement', 'Une version payante']
        answer: 0
      - id: java-pres-code
        type: code
        title: Bonjour, Java !
        prompt: |
          Modifie le programme pour qu’il affiche exactement :

          ```
          Bonjour, Java !
          ```
        starter: |
          public class Main {
              public static void main(String[] args) {
                  System.out.println("Hello");
              }
          }
        solution: |
          public class Main {
              public static void main(String[] args) {
                  System.out.println("Bonjour, Java !");
              }
          }
        tests:
          - { input: '', output: 'Bonjour, Java !' }
        require:
          - { pattern: 'System\.out\.print', message: Utiliser System.out.println }
    project:
      id: java-pres-projet
      type: code
      title: Carte de visite
      difficulty: 1
      prompt: |
        Lis un prénom (une ligne) et affiche :

        ```
        ~~~~~~~~~~
        Bonjour, <prénom> !
        ~~~~~~~~~~
        ```
      starter: |
        import java.util.Scanner;

        public class Main {
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
                String prenom = sc.nextLine();
                // À toi !
            }
        }
      solution: |
        import java.util.Scanner;

        public class Main {
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
                String prenom = sc.nextLine();
                System.out.println("~~~~~~~~~~");
                System.out.println("Bonjour, " + prenom + " !");
                System.out.println("~~~~~~~~~~");
            }
        }
      tests:
        - { input: Kiri, output: "~~~~~~~~~~\nBonjour, Kiri !\n~~~~~~~~~~" }
        - { input: James, output: "~~~~~~~~~~\nBonjour, James !\n~~~~~~~~~~", hidden: true }
