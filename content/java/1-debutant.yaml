  # ------------------------------------------------------------------
  - slug: java-jvm-jdk
    title: JVM et JDK
    summary: JDK, JRE et JVM, bytecode, compilation avec javac, exécution avec java, et outils de l’écosystème.
    minutes: 20
    concepts: [jvm, build]
    sections:
      - title: Du code source au bytecode
        body: |
          1. Tu écris `Main.java` (code source).
          2. `javac Main.java` le compile en **bytecode** : `Main.class`.
          3. `java Main` lance la **JVM**, qui charge le bytecode, le vérifie, l’interprète puis compile à la volée (**JIT**) les parties chaudes en code machine.

          | Sigle | Contenu |
          |---|---|
          | **JVM** | la machine virtuelle qui exécute le bytecode |
          | **JRE** | JVM + bibliothèques standard (pour exécuter) |
          | **JDK** | JRE + outils de développement (`javac`, `jar`, `jshell`, `javadoc`…) |

          Depuis Java 11, `java Main.java` compile et exécute directement un fichier unique.
      - title: Outils
        body: |
          ```bash
          java -version            # version installée (ex. OpenJDK 21)
          javac Main.java          # compile
          java Main                # exécute la classe Main
          jshell                   # console interactive pour expérimenter
          jar cf app.jar *.class   # archive
          ```

          Distributions de l’OpenJDK : Eclipse **Temurin**, Amazon Corretto, Microsoft, Oracle. Gestionnaires de projets : **Maven** et **Gradle**. IDE : **IntelliJ IDEA**, Eclipse, VS Code.

          Le JIT rend Java très rapide après une phase de « chauffe » ; d’autres langages profitent de la JVM : Kotlin, Scala, Groovy, Clojure.
    exercises:
      - id: java-jvm-q1
        type: mcq
        prompt: Que produit javac à partir de Main.java ?
        choices: ['Du bytecode (Main.class)', 'Un exécutable natif .exe', 'Du code C', 'Rien, il interprète']
        answer: 0
      - id: java-jvm-q2
        type: mcq
        prompt: Que contient le JDK en plus du JRE ?
        choices: ['Les outils de développement (javac, jar, jshell…)', 'Un navigateur', 'Rien de plus', 'Un système d’exploitation']
        answer: 0
      - id: java-jvm-order
        type: order
        prompt: Remets dans l’ordre la vie d’un programme Java.
        lines:
          - Écrire Main.java
          - Compiler avec javac
          - Obtenir Main.class (bytecode)
          - Exécuter avec java Main sur la JVM
      - id: java-jvm-bug
        type: bugfix
        prompt: Ce fichier Main.java ne compile pas. Trouve la ligne fautive.
        code: |
          public class Programme {
              public static void main(String[] args) {
                  System.out.println("Bonjour");
              }
          }
        bugLines: [1]
        choices:
          - Une classe publique doit porter le nom du fichier (Main)
          - main doit renvoyer int
          - println doit s’écrire Println
        answer: 0
        solution: |
          public class Main {
              public static void main(String[] args) {
                  System.out.println("Bonjour");
              }
          }
        tests:
          - { input: '', output: Bonjour }
    project:
      id: java-jvm-projet
      type: code
      title: Informations sur la JVM
      difficulty: 1
      prompt: |
        Lis un nom de programme puis affiche les commandes pour le compiler et l’exécuter, et vérifie que la JVM fonctionne :

        ```
        javac <Nom>.java
        java <Nom>
        JVM opérationnelle : oui
        ```

        Pour la dernière ligne, affiche `oui` si `System.getProperty("java.version")` n’est pas `null`.
      starter: |
        import java.util.Scanner;

        public class Main {
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
                String nom = sc.nextLine().trim();
            }
        }
      solution: |
        import java.util.Scanner;

        public class Main {
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
                String nom = sc.nextLine().trim();
                System.out.println("javac " + nom + ".java");
                System.out.println("java " + nom);
                System.out.println("JVM opérationnelle : " + (System.getProperty("java.version") != null ? "oui" : "non"));
            }
        }
      tests:
        - { input: Jeu, output: "javac Jeu.java\njava Jeu\nJVM opérationnelle : oui" }
        - { input: Calculatrice, output: "javac Calculatrice.java\njava Calculatrice\nJVM opérationnelle : oui", hidden: true }
    exam:
      pass: 70
      questions:
        - id: java-jvm-ex1
          type: mcq
          prompt: Que fait le compilateur JIT ?
          choices: ['Il compile en code machine les parties du bytecode souvent exécutées', 'Il compile le code source Java', 'Il supprime les objets inutiles', 'Il crée les fichiers .jar']
