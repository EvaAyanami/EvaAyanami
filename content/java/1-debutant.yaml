  - slug: java-conditions
    title: Conditions
    summary: if/else, switch classique et switch moderne avec flèches et expressions, comparaison de chaînes avec equals.
    minutes: 25
    concepts: [conditions]
    sections:
      - title: if et else
        body: |
          ```java
          int t = 22;
          if (t > 30) {
              System.out.println("chaud");
          } else if (t > 15) {
              System.out.println("bon");
          } else {
              System.out.println("frais");
          }
          ```

          La condition doit être un `boolean` (pas d’entier comme en C). Pour les **chaînes**, utilise `.equals()` et non `==` :

          ```java
          String r = sc.nextLine();
          if (r.equals("oui")) { … }
          if ("oui".equalsIgnoreCase(r)) { … }   // insensible à la casse, sûr si r est null
          ```
      - title: switch moderne
        body: |
          ```java
          String jour = "samedi";
          switch (jour) {                          // switch « flèche » : pas de fallthrough
              case "samedi", "dimanche" -> System.out.println("week-end");
              default -> System.out.println("semaine");
          }

          int note = 14;
          String mention = switch (note / 2) {     // switch EXPRESSION (Java 14+)
              case 10, 9, 8 -> "très bien";
              case 7 -> "bien";
              case 6 -> "assez bien";
              default -> {
                  String r = note >= 10 ? "passable" : "insuffisant";
                  yield r;                         // yield renvoie une valeur d’un bloc
              }
          };
          ```

          Le `switch` classique avec `case X:` et `break;` existe toujours (attention au *fallthrough*). Java 21 ajoute le **filtrage par motif** dans `switch` (`case Integer i when i > 0 ->`).
