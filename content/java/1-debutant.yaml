          - { input: 0 1 2 97 91 1000003, output: "pas premier\npas premier\npremier\npremier\npas premier\npremier", hidden: true }
        concepts: [fonctions]
    project:
      id: java-fn-projet
      type: code
      title: Factorielle et Fibonacci
      difficulty: 2
      prompt: |
        Écris une méthode **récursive** `long factorielle(int n)` et une méthode **itérative** `long fibonacci(int n)` (fib(0)=0, fib(1)=1). Pour chaque `n` lu, affiche `n! = …` puis `fib(n) = …`.
      starter: |
        import java.util.Scanner;

        public class Main {
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
                while (sc.hasNextInt()) {
                    int n = sc.nextInt();
                }
            }
        }
      solution: |
        import java.util.Scanner;

        public class Main {
            static long factorielle(int n) { return n <= 1 ? 1 : n * factorielle(n - 1); }
            static long fibonacci(int n) {
                long a = 0, b = 1;
                for (int i = 0; i < n; i++) { long c = a + b; a = b; b = c; }
                return a;
            }
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
                while (sc.hasNextInt()) {
                    int n = sc.nextInt();
                    System.out.println(n + "! = " + factorielle(n));
                    System.out.println("fib(" + n + ") = " + fibonacci(n));
                }
            }
        }
      tests:
        - { input: '5', output: "5! = 120\nfib(5) = 5" }
        - { input: 0 20, output: "0! = 1\nfib(0) = 0\n20! = 2432902008176640000\nfib(20) = 6765", hidden: true }
      require:
        - { pattern: 'factorielle\s*\(\s*n\s*-\s*1\s*\)', message: factorielle doit être récursive }
      concepts: [fonctions, recursivite]
