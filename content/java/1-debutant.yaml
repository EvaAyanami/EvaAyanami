                  System.out.println("C");
                  System.out.println(1 + 2 + "3" + 4 + 5);
              }
          }
        output: "ABC\n3345"
        explanation: '1 + 2 = 3 (addition), puis "3" fait passer en concaténation : "33", "334", "3345".'
      - id: java-pp-q1
