        title: Nombres premiers
        prompt: Écris `static boolean estPremier(long n)`. Pour chaque nombre lu, affiche `premier` ou `pas premier`.
        starter: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner sc = new Scanner(System.in);
                  while (sc.hasNextLong()) {
                      System.out.println(estPremier(sc.nextLong()) ? "premier" : "pas premier");
