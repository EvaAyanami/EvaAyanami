      - id: java-poo-code
        type: code
        title: Première classe
        prompt: |
          Écris une classe `Compteur` avec un attribut `int valeur` et deux méthodes `void incrementer()` et `int lire()`.

          Pour chaque mot lu (`+` ou `?`), incrémente le compteur ou affiche sa valeur.
        starter: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner sc = new Scanner(System.in);
                  Compteur c = new Compteur();
                  while (sc.hasNext()) {
                      if (sc.next().equals("+")) c.incrementer();
                      else System.out.println(c.lire());
                  }
              }
          }
        solution: |
          import java.util.Scanner;

          class Compteur {
              private int valeur;
              void incrementer() { valeur++; }
              int lire() { return valeur; }
          }

          public class Main {
              public static void main(String[] args) {
                  Scanner sc = new Scanner(System.in);
                  Compteur c = new Compteur();
                  while (sc.hasNext()) {
                      if (sc.next().equals("+")) c.incrementer();
                      else System.out.println(c.lire());
                  }
              }
          }
        tests:
          - { input: + + ? + ?, output: "2\n3" }
          - { input: '?', output: '0', hidden: true }
        concepts: [classes]
    project:
      id: java-poo-projet
      type: code
      title: Modéliser une lampe
      difficulty: 2
      prompt: |
        Écris une classe `Lampe` (attributs privés `allumee` et `intensite` de 0 à 100) avec `allumer()`, `eteindre()`, `regler(int)` (bornée entre 0 et 100, sans effet si la lampe est éteinte) et `toString()` qui renvoie `Lampe[allumée, 70%]` ou `Lampe[éteinte]`.

        Intensité initiale : 50. Commandes : `allumer`, `eteindre`, `regler N`, `etat`.
      starter: |
        import java.util.Scanner;

        public class Main {
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
            }
        }
      solution: |
        import java.util.Scanner;

        class Lampe {
            private boolean allumee;
            private int intensite = 50;
            void allumer() { allumee = true; }
            void eteindre() { allumee = false; }
            void regler(int i) { if (allumee) intensite = Math.max(0, Math.min(100, i)); }
            @Override
            public String toString() { return allumee ? "Lampe[allumée, " + intensite + "%]" : "Lampe[éteinte]"; }
        }

        public class Main {
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
                Lampe l = new Lampe();
                while (sc.hasNext()) {
                    switch (sc.next()) {
                        case "allumer" -> l.allumer();
                        case "eteindre" -> l.eteindre();
                        case "regler" -> l.regler(sc.nextInt());
                        default -> System.out.println(l);
                    }
                }
            }
        }
      tests:
        - { input: "etat\nregler 80\nallumer\netat\nregler 150\netat\neteindre\netat", output: "Lampe[éteinte]\nLampe[allumée, 50%]\nLampe[allumée, 100%]\nLampe[éteinte]" }
        - { input: "allumer\nregler -5\netat", output: 'Lampe[allumée, 0%]', hidden: true }
      concepts: [classes]
