        Classe abstraite `Personnage` (nom, points de vie, `boolean estVivant()`, `void subir(int degats)` qui ne descend pas sous 0, méthode abstraite `int attaque(int tour)`). Sous-classes : `Guerrier` (attaque 10 à chaque tour), `Mage` (25 un tour sur deux — tours impairs — sinon 0), `Archer` (7 + numéro du tour).

        Entrée : deux lignes `classe nom pv`. Les personnages s’attaquent **à tour de rôle** (le premier commence au tour 1, chaque attaque compte comme un tour) jusqu’à la mort de l’un. Affiche chaque attaque `tour T : A inflige D à B (pv restants)`, puis `vainqueur : nom`. Arrête au tour 100 au plus (`match nul`).
      starter: |
        import java.util.*;

        public class Main {
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
            }
        }
      solution: |
        import java.util.*;

        abstract class Personnage {
            protected final String nom;
            protected int pv;
            Personnage(String nom, int pv) { this.nom = nom; this.pv = pv; }
            boolean estVivant() { return pv > 0; }
            void subir(int d) { pv = Math.max(0, pv - d); }
            abstract int attaque(int tour);
        }
        class Guerrier extends Personnage { Guerrier(String n, int p) { super(n, p); } int attaque(int t) { return 10; } }
        class Mage extends Personnage { Mage(String n, int p) { super(n, p); } int attaque(int t) { return t % 2 == 1 ? 25 : 0; } }
        class Archer extends Personnage { Archer(String n, int p) { super(n, p); } int attaque(int t) { return 7 + t; } }

        public class Main {
            static Personnage lire(Scanner sc) {
                String c = sc.next(), n = sc.next();
                int pv = sc.nextInt();
                return switch (c) { case "guerrier" -> new Guerrier(n, pv); case "mage" -> new Mage(n, pv); default -> new Archer(n, pv); };
            }
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
                Personnage[] p = {lire(sc), lire(sc)};
                int tour = 1;
                while (p[0].estVivant() && p[1].estVivant() && tour <= 100) {
                    Personnage a = p[(tour - 1) % 2], b = p[tour % 2];
                    int d = a.attaque(tour);
                    b.subir(d);
                    System.out.println("tour " + tour + " : " + a.nom + " inflige " + d + " à " + b.nom + " (" + b.pv + ")");
                    tour++;
                }
                if (p[0].estVivant() && p[1].estVivant()) System.out.println("match nul");
                else System.out.println("vainqueur : " + (p[0].estVivant() ? p[0].nom : p[1].nom));
            }
        }
      tests:
        - { input: "mage Kiri 40\nguerrier Bob 45", output: "tour 1 : Kiri inflige 25 à Bob (20)\ntour 2 : Bob inflige 10 à Kiri (30)\ntour 3 : Kiri inflige 25 à Bob (0)\nvainqueur : Kiri" }
        - { input: "archer Ada 20\nguerrier Zed 30", output: "tour 1 : Ada inflige 8 à Zed (22)\ntour 2 : Zed inflige 10 à Ada (10)\ntour 3 : Ada inflige 10 à Zed (12)\ntour 4 : Zed inflige 10 à Ada (0)\nvainqueur : Zed", hidden: true }
