        output: "eau chaude, thé, tasse\neau chaude, café, mug"
      - id: java-abs-code
        type: code
        title: Rapports
        prompt: |
          Écris la classe abstraite `Rapport` du cours (titre, `generer()` final), et deux sous-classes : `RapportVentes(List<Integer> ventes)` dont le corps est `total : T` et `RapportNotes(List<Integer> notes)` dont le corps est `moyenne : M` (1 décimale, Locale.US) et qui redéfinit `pied()` en `-- confidentiel --`.

          Entrée : une ligne de ventes, puis une ligne de notes. Affiche les deux rapports (titres `Ventes` et `Notes`).
        starter: |
          import java.util.*;

          public class Main {
              public static void main(String[] args) {
                  Scanner sc = new Scanner(System.in);
              }
          }
        solution: |
          import java.util.*;

          abstract class Rapport {
              private final String titre;
              protected Rapport(String titre) { this.titre = titre; }
              public final String generer() { return "== " + titre + " ==\n" + corps() + "\n" + pied(); }
              protected abstract String corps();
              protected String pied() { return "-- fin --"; }
          }

          class RapportVentes extends Rapport {
              private final List<Integer> ventes;
              RapportVentes(List<Integer> v) { super("Ventes"); ventes = v; }
              protected String corps() { return "total : " + ventes.stream().mapToInt(Integer::intValue).sum(); }
          }

          class RapportNotes extends Rapport {
              private final List<Integer> notes;
              RapportNotes(List<Integer> n) { super("Notes"); notes = n; }
              protected String corps() { return String.format(Locale.US, "moyenne : %.1f", notes.stream().mapToInt(Integer::intValue).average().orElse(0)); }
              @Override protected String pied() { return "-- confidentiel --"; }
          }

          public class Main {
              static List<Integer> lire(String l) {
                  List<Integer> r = new ArrayList<>();
                  for (String s : l.trim().split("\\s+")) if (!s.isEmpty()) r.add(Integer.parseInt(s));
                  return r;
              }
              public static void main(String[] args) {
                  Scanner sc = new Scanner(System.in);
                  List<Rapport> rapports = List.of(new RapportVentes(lire(sc.nextLine())), new RapportNotes(lire(sc.nextLine())));
                  for (Rapport r : rapports) System.out.println(r.generer());
              }
          }
        tests:
          - { input: "100 250 50\n12 15 17", output: "== Ventes ==\ntotal : 400\n-- fin --\n== Notes ==\nmoyenne : 14.7\n-- confidentiel --" }
          - { input: "\n\n", output: "== Ventes ==\ntotal : 0\n-- fin --\n== Notes ==\nmoyenne : 0.0\n-- confidentiel --", hidden: true }
        require:
          - { pattern: 'abstract\s+class\s+Rapport', message: Rapport doit être abstraite }
