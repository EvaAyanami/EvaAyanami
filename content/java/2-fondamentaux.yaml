  # ------------------------------------------------------------------
  - slug: java-heritage
    title: Héritage
    summary: extends, super, redéfinition avec @Override, protected, final, et quand préférer la composition.
    minutes: 30
    concepts: [heritage, classes]
    sections:
      - title: Étendre une classe
        body: |
          ```java
          class Animal {
              protected final String nom;
              Animal(String nom) { this.nom = nom; }
              String cri() { return "..."; }
              String presenter() { return nom + " fait " + cri(); }
          }

          class Chien extends Animal {
              private final String race;
              Chien(String nom, String race) {
                  super(nom);                  // appel du constructeur parent (première instruction)
                  this.race = race;
              }
              @Override
              String cri() { return "Wouf"; }  // redéfinition
              @Override
              String presenter() { return super.presenter() + " (" + race + ")"; }  // réutilise le parent
          }
          ```

          Java n’autorise l’héritage que d’**une seule** classe (mais plusieurs interfaces).
      - title: Règles et bonnes pratiques
        body: |
          - `@Override` fait vérifier par le compilateur qu’on redéfinit bien une méthode.
          - Une redéfinition ne peut pas réduire la visibilité.
          - `final` sur une classe interdit d’en hériter (`String` est `final`) ; sur une méthode, interdit de la redéfinir.
          - **Composition plutôt qu’héritage** : si la relation est « a-un » (une voiture a un moteur), utilise un attribut. L’héritage profond rend le code fragile.
          - Principe de substitution de Liskov : une sous-classe doit pouvoir remplacer sa classe mère sans surprise.
