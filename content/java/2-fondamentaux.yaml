  - slug: java-constructeurs
    title: Constructeurs
    summary: Constructeur par défaut, surcharge, chaînage avec this(...), validation, blocs d’initialisation et fabriques statiques.
    minutes: 25
    concepts: [classes, constructeurs]
    sections:
      - title: Construire des objets valides
        body: |
          ```java
          public class Temperature {
              private final double celsius;

              public Temperature() { this(20.0); }                 // chaînage vers l’autre constructeur
              public Temperature(double celsius) {
                  if (celsius < -273.15) throw new IllegalArgumentException("sous le zéro absolu");
                  this.celsius = celsius;
              }
              public static Temperature depuisFahrenheit(double f) {   // fabrique statique nommée
                  return new Temperature((f - 32) * 5 / 9);
              }
          }
          ```

          - Si aucun constructeur n’est écrit, Java fournit un **constructeur par défaut** sans paramètre. Dès qu’on en écrit un, il disparaît.
          - `this(…)` doit être la **première** instruction du constructeur.
          - Les attributs `final` doivent être initialisés dans chaque constructeur.
      - title: Ordre d’initialisation
        body: |
          1. Les attributs reçoivent leur valeur par défaut (`0`, `false`, `null`) ;
          2. les initialisations d’attributs et blocs d’initialisation `{ … }` s’exécutent dans l’ordre ;
          3. puis le corps du constructeur.

          Les **fabriques statiques** (`of`, `from`, `valueOf`) ont des noms parlants, peuvent renvoyer un objet en cache ou un sous-type : `List.of(1, 2)`, `Integer.valueOf(42)`, `LocalDate.of(2026, 11, 20)`.
