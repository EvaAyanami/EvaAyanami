        answer: 0
      - id: java-poly-code
        type: code
        title: Formes scellées
        prompt: |
          Déclare `sealed interface Forme permits Cercle, Rectangle, Triangle` et trois records (`Triangle(a, b, c)` : formule de Héron). Écris `static double aire(Forme)` et `static double perimetre(Forme)` avec un **switch sur les types**.

          Chaque ligne : `cercle r`, `rectangle l h` ou `triangle a b c`. Affiche `aire A périmètre P` (2 décimales, Locale.US).
        starter: |
          import java.util.*;

          public class Main {
              public static void main(String[] args) {
                  Scanner sc = new Scanner(System.in).useLocale(Locale.US);
              }
          }
        solution: |
          import java.util.*;

          sealed interface Forme permits Cercle, Rectangle, Triangle {}
          record Cercle(double r) implements Forme {}
          record Rectangle(double l, double h) implements Forme {}
          record Triangle(double a, double b, double c) implements Forme {}

          public class Main {
              static double perimetre(Forme f) {
                  return switch (f) {
                      case Cercle c -> 2 * Math.PI * c.r();
                      case Rectangle(double l, double h) -> 2 * (l + h);
                      case Triangle(double a, double b, double c) -> a + b + c;
                  };
              }
              static double aire(Forme f) {
                  return switch (f) {
                      case Cercle c -> Math.PI * c.r() * c.r();
                      case Rectangle(double l, double h) -> l * h;
                      case Triangle t -> {
                          double s = perimetre(t) / 2;
                          yield Math.sqrt(s * (s - t.a()) * (s - t.b()) * (s - t.c()));
                      }
                  };
              }
              public static void main(String[] args) {
                  Scanner sc = new Scanner(System.in).useLocale(Locale.US);
                  while (sc.hasNext()) {
                      Forme f = switch (sc.next()) {
                          case "cercle" -> new Cercle(sc.nextDouble());
                          case "rectangle" -> new Rectangle(sc.nextDouble(), sc.nextDouble());
                          default -> new Triangle(sc.nextDouble(), sc.nextDouble(), sc.nextDouble());
                      };
                      System.out.println(String.format(Locale.US, "aire %.2f périmètre %.2f", aire(f), perimetre(f)));
                  }
              }
          }
        tests:
          - { input: "cercle 1\nrectangle 2 3\ntriangle 3 4 5", output: "aire 3.14 périmètre 6.28\naire 6.00 périmètre 10.00\naire 6.00 périmètre 12.00" }
          - { input: triangle 2 2 2, output: aire 1.73 périmètre 6.00, hidden: true }
        require:
          - { pattern: 'sealed\s+interface', message: Déclarer une interface sealed }
        concepts: [polymorphisme]
    project:
      id: java-poly-projet
      type: code
      title: Zoo polymorphe
      difficulty: 3
      prompt: |
        Classe abstraite `Animal` (nom, méthodes abstraites `cri()`, `nourriture()` en grammes et `espece()`, méthode concrète `presentation()` → `"<nom> le <espece> fait <cri>"`). Sous-classes `Lion` (roar, 7000), `Perroquet` (coco, 50), `Tortue` (…, 200).

        Chaque ligne : `espece nom`. Affiche les présentations puis `Nourriture totale : N g`, et enfin le nombre de chaque espèce triées par nom (`lion=1 perroquet=1 …`) calculé avec `instanceof`/`getClass`.
      starter: |
        import java.util.*;

        public class Main {
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
            }
        }
      solution: |
        import java.util.*;

        abstract class Animal {
            protected final String nom;
            Animal(String nom) { this.nom = nom; }
            abstract String cri();
            abstract int nourriture();
            abstract String espece();
            String presentation() { return nom + " le " + espece() + " fait " + cri(); }
        }
        class Lion extends Animal { Lion(String n) { super(n); } String cri() { return "roar"; } int nourriture() { return 7000; } String espece() { return "lion"; } }
        class Perroquet extends Animal { Perroquet(String n) { super(n); } String cri() { return "coco"; } int nourriture() { return 50; } String espece() { return "perroquet"; } }
        class Tortue extends Animal { Tortue(String n) { super(n); } String cri() { return "…"; } int nourriture() { return 200; } String espece() { return "tortue"; } }

        public class Main {
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
                List<Animal> zoo = new ArrayList<>();
                while (sc.hasNext()) {
                    String e = sc.next(), n = sc.next();
                    zoo.add(switch (e) { case "lion" -> new Lion(n); case "perroquet" -> new Perroquet(n); default -> new Tortue(n); });
                }
                int total = 0;
                Map<String, Integer> compte = new TreeMap<>();
                for (Animal a : zoo) {
                    System.out.println(a.presentation());
                    total += a.nourriture();
                    compte.merge(a.espece(), 1, Integer::sum);
                }
                System.out.println("Nourriture totale : " + total + " g");
                StringBuilder sb = new StringBuilder();
                compte.forEach((k, v) -> sb.append(sb.length() > 0 ? " " : "").append(k).append('=').append(v));
                System.out.println(sb);
            }
        }
      tests:
        - { input: "lion Simba\nperroquet Coco\ntortue Franklin\nlion Nala", output: "Simba le lion fait roar\nCoco le perroquet fait coco\nFranklin le tortue fait …\nNala le lion fait roar\nNourriture totale : 14250 g\nlion=2 perroquet=1 tortue=1" }
        - { input: '', output: "Nourriture totale : 0 g\n", hidden: true }
