      - id: java-pkg-code
        type: code
        title: Organisation par classes imbriquées
        prompt: |
          Dans un seul fichier, simule une organisation en « packages » avec des classes imbriquées statiques : `Main.Modele.Produit` (record nom/prix) et `Main.Service.Catalogue` (ajout, recherche par préfixe de nom, total des prix).

          Commandes : `ajouter nom prix`, `chercher prefixe` (noms trouvés triés, séparés par des virgules, ou `aucun`), `total`.
        starter: |
          import java.util.*;

          public class Main {
              public static void main(String[] args) {
                  Scanner sc = new Scanner(System.in);
              }
          }
        solution: |
          import java.util.*;

          public class Main {
              static class Modele {
                  record Produit(String nom, int prix) {}
              }
              static class Service {
                  static class Catalogue {
                      private final List<Modele.Produit> produits = new ArrayList<>();
                      void ajouter(String nom, int prix) { produits.add(new Modele.Produit(nom, prix)); }
                      List<String> chercher(String p) {
                          List<String> r = new ArrayList<>();
                          for (Modele.Produit x : produits) if (x.nom().startsWith(p)) r.add(x.nom());
                          Collections.sort(r);
                          return r;
                      }
                      int total() { int t = 0; for (Modele.Produit x : produits) t += x.prix(); return t; }
                  }
              }
              public static void main(String[] args) {
                  Scanner sc = new Scanner(System.in);
                  Service.Catalogue cat = new Service.Catalogue();
                  while (sc.hasNext()) {
                      switch (sc.next()) {
                          case "ajouter" -> cat.ajouter(sc.next(), sc.nextInt());
                          case "chercher" -> {
                              List<String> r = cat.chercher(sc.next());
                              System.out.println(r.isEmpty() ? "aucun" : String.join(",", r));
                          }
                          default -> System.out.println(cat.total());
                      }
                  }
              }
          }
        tests:
          - { input: "ajouter stylo 2\najouter stabilo 3\najouter cahier 5\nchercher st\nchercher z\ntotal", output: "stabilo,stylo\naucun\n10" }
          - { input: total, output: '0', hidden: true }
    project:
      id: java-pkg-projet
      type: code
      title: Résolveur d’imports
      difficulty: 3
      prompt: |
        Écris un petit outil qui analyse un fichier Java : lis toutes les lignes, repère la ligne `package …;` et les lignes `import …;` (y compris `import static`), puis affiche :

        - `package : <nom>` (ou `package : (défaut)`) ;
        - les imports normaux triés, un par ligne, préfixés de `+ ` ;
        - les imports statiques triés, préfixés de `s ` ;
        - `doublons : N` (imports identiques répétés).
      starter: |
        import java.util.*;

        public class Main {
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
            }
        }
      solution: |
        import java.util.*;

        public class Main {
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
                String pkg = "(défaut)";
                TreeSet<String> imports = new TreeSet<>(), statiques = new TreeSet<>();
                int doublons = 0;
                while (sc.hasNextLine()) {
                    String l = sc.nextLine().strip();
                    if (l.startsWith("package ")) pkg = l.substring(8, l.length() - 1).strip();
                    else if (l.startsWith("import static ")) { if (!statiques.add(l.substring(14, l.length() - 1).strip())) doublons++; }
                    else if (l.startsWith("import ")) { if (!imports.add(l.substring(7, l.length() - 1).strip())) doublons++; }
                }
                System.out.println("package : " + pkg);
                for (String i : imports) System.out.println("+ " + i);
                for (String s : statiques) System.out.println("s " + s);
                System.out.println("doublons : " + doublons);
            }
        }
      tests:
        - { input: "package fr.codemori.jeu;\n\nimport java.util.List;\nimport static java.lang.Math.max;\nimport java.io.File;\nimport java.util.List;\n\npublic class Jeu {}", output: "package : fr.codemori.jeu\n+ java.io.File\n+ java.util.List\ns java.lang.Math.max\ndoublons : 1" }
        - { input: 'public class A {}', output: "package : (défaut)\ndoublons : 0", hidden: true }
