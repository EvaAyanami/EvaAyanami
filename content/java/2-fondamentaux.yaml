  # ------------------------------------------------------------------
  - slug: java-packages
    title: Packages
    summary: Organiser le code en packages, imports, visibilité de package, classes imbriquées et modules Java (JPMS).
    minutes: 20
    concepts: [modules]
    sections:
      - title: Packages et imports
        body: |
          Un **package** regroupe des classes liées et définit un espace de noms. Il correspond à une arborescence de dossiers :

          ```java
          // src/main/java/fr/codemori/banque/Compte.java
          package fr.codemori.banque;

          import java.util.List;                 // une classe
          import java.util.*;                    // tout le package (déconseillé dans un gros projet)
          import static java.lang.Math.max;      // import statique d’un membre

          public class Compte { … }
          ```

          Convention : nom de domaine inversé, en minuscules (`fr.codemori.jeu.moteur`). `java.lang` (String, Math, System…) est importé automatiquement.

          La visibilité **package-private** (sans modificateur) permet de cacher des classes d’implémentation au reste de l’application.
      - title: Classes imbriquées et modules
        body: |
          ```java
          public class Panier {
              public static class Ligne { … }    // imbriquée statique : comme une classe normale, nommée Panier.Ligne
              private class Iterateur { … }      // interne : accès à l’instance englobante (Panier.this)
          }
          Runnable r = new Runnable() {          // classe anonyme
              public void run() { … }
          };
          ```

          Les **modules** (Java 9, `module-info.java`) regroupent des packages et déclarent explicitement ce qu’ils exportent et ce dont ils dépendent :

          ```java
          module fr.codemori.banque {
              requires java.sql;
              exports fr.codemori.banque.api;    // seul ce package est visible de l’extérieur
          }
          ```
