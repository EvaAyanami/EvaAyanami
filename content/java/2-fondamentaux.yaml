language: java
level: 2
chapters:
  # ------------------------------------------------------------------
  - slug: java-poo
    title: Programmation orientée objet
    summary: Les principes de la POO — objets, état et comportement, encapsulation, héritage, polymorphisme et abstraction.
    minutes: 20
    concepts: [classes, poo]
    sections:
      - title: Penser en objets
        body: |
          La **programmation orientée objet** (POO) organise un programme autour d’**objets** qui regroupent :

          - un **état** (des attributs : le solde d’un compte, la position d’un joueur) ;
          - un **comportement** (des méthodes : déposer, se déplacer).

          Une **classe** est le plan de construction ; un **objet** (ou **instance**) est un exemplaire construit à partir de ce plan.

          ```java
          class Chien {
              String nom;
              void aboyer() { System.out.println(nom + " : Wouf !"); }
          }
          Chien rex = new Chien();   // création d’une instance
          rex.nom = "Rex";
          rex.aboyer();
          ```
      - title: Les quatre piliers
        body: |
          | Pilier | Idée | En Java |
          |---|---|---|
          | **Encapsulation** | cacher l’état interne, exposer des méthodes | `private`, getters, méthodes métier |
          | **Héritage** | réutiliser et spécialiser | `extends` |
          | **Polymorphisme** | un même appel, des comportements différents | redéfinition (`@Override`), interfaces |
          | **Abstraction** | ne garder que l’essentiel | `interface`, `abstract` |

          En Java, **tout** est dans une classe, et toutes les classes héritent implicitement de `java.lang.Object` (qui fournit `toString`, `equals`, `hashCode`).
    exercises:
      - id: java-poo-q1
        type: mcq
        prompt: Quelle est la différence entre une classe et un objet ?
        choices: ['La classe est le plan, l’objet une instance construite à partir de ce plan', 'Aucune', 'Un objet contient plusieurs classes', 'Une classe est un objet spécial sans méthode']
        answer: 0
        concepts: [classes]
