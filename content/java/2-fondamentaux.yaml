      - id: java-enc-code
        type: code
        title: Thermostat
        prompt: |
          Écris une classe `Thermostat` dont la consigne reste **toujours entre 5.0 et 30.0** : `boolean regler(double)` (refuse hors limites), `augmenter()` / `diminuer()` (pas de 0.5, bornés), `double getConsigne()`. Consigne initiale : 19.

          Commandes : `regler X`, `+`, `-`. Affiche la consigne (1 décimale, Locale.US) après chaque commande.
        starter: |
          import java.util.*;

          public class Main {
              public static void main(String[] args) {
                  Scanner sc = new Scanner(System.in).useLocale(Locale.US);
              }
          }
        solution: |
          import java.util.*;

          class Thermostat {
              private double consigne = 19;
              boolean regler(double c) {
                  if (c < 5 || c > 30) return false;
                  consigne = c;
                  return true;
              }
              void augmenter() { consigne = Math.min(30, consigne + 0.5); }
              void diminuer() { consigne = Math.max(5, consigne - 0.5); }
              double getConsigne() { return consigne; }
          }

          public class Main {
              public static void main(String[] args) {
                  Scanner sc = new Scanner(System.in).useLocale(Locale.US);
                  Thermostat t = new Thermostat();
                  while (sc.hasNext()) {
                      String c = sc.next();
                      if (c.equals("regler")) t.regler(sc.nextDouble());
                      else if (c.equals("+")) t.augmenter();
                      else t.diminuer();
                      System.out.println(String.format(Locale.US, "%.1f", t.getConsigne()));
                  }
              }
          }
        tests:
          - { input: "+\nregler 40\nregler 29.8\n+\n+", output: "19.5\n19.5\n29.8\n30.0\n30.0" }
          - { input: "regler 5\n-", output: "5.0\n5.0", hidden: true }
        concepts: [encapsulation]
