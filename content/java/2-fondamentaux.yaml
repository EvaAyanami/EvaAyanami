      - id: java-her-code
        type: code
        title: Employés et managers
        prompt: |
          Écris `Employe` (nom, salaire de base, `double salaire()`) et `Manager extends Employe` qui redéfinit `salaire()` en ajoutant 200 par membre d’équipe.

          Lignes : `E nom base` ou `M nom base equipe`. Stocke tout dans une `List<Employe>`, affiche `nom : salaire` (0 décimale) puis `masse salariale : total`.
        starter: |
          import java.util.*;

          public class Main {
              public static void main(String[] args) {
                  Scanner sc = new Scanner(System.in);
              }
          }
        solution: |
          import java.util.*;

          class Employe {
              protected final String nom;
              protected final double base;
              Employe(String nom, double base) { this.nom = nom; this.base = base; }
              double salaire() { return base; }
              String getNom() { return nom; }
          }

          class Manager extends Employe {
              private final int equipe;
              Manager(String nom, double base, int equipe) { super(nom, base); this.equipe = equipe; }
              @Override double salaire() { return super.salaire() + 200.0 * equipe; }
          }

          public class Main {
              public static void main(String[] args) {
                  Scanner sc = new Scanner(System.in);
                  List<Employe> l = new ArrayList<>();
                  while (sc.hasNext()) {
                      String t = sc.next();
                      String nom = sc.next();
                      double base = sc.nextDouble();
                      l.add(t.equals("M") ? new Manager(nom, base, sc.nextInt()) : new Employe(nom, base));
                  }
                  double total = 0;
                  for (Employe e : l) {
                      System.out.println(e.getNom() + " : " + Math.round(e.salaire()));
                      total += e.salaire();
                  }
                  System.out.println("masse salariale : " + Math.round(total));
              }
          }
