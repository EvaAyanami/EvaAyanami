    project:
      id: java-her-projet
      type: code
      title: Comptes spécialisés
      difficulty: 3
      prompt: |
        Classe `Compte` (solde protégé, `deposer`, `boolean retirer(double)` qui refuse un solde négatif), `CompteEpargne extends Compte` (taux, `appliquerInterets()`), `CompteCourant extends Compte` qui **redéfinit** `retirer` pour autoriser un découvert.

        Première ligne : `epargne taux` ou `courant decouvert`. Puis `depot X`, `retrait X`, `interets` (sans effet sur un compte courant). Affiche le solde (2 décimales, Locale.US) après chaque opération ou `refusé`.
      starter: |
        import java.util.*;

        public class Main {
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in).useLocale(Locale.US);
            }
        }
      solution: |
        import java.util.*;

        class Compte {
            protected double solde;
            void deposer(double m) { solde += m; }
            boolean retirer(double m) {
                if (m > solde) return false;
                solde -= m;
                return true;
            }
            double getSolde() { return solde; }
        }

        class CompteEpargne extends Compte {
            private final double taux;
            CompteEpargne(double taux) { this.taux = taux; }
            void appliquerInterets() { solde *= 1 + taux; }
        }

        class CompteCourant extends Compte {
            private final double decouvert;
            CompteCourant(double decouvert) { this.decouvert = decouvert; }
            @Override boolean retirer(double m) {
                if (solde - m < -decouvert) return false;
                solde -= m;
                return true;
            }
        }

        public class Main {
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in).useLocale(Locale.US);
                String type = sc.next();
                double p = sc.nextDouble();
                Compte c = type.equals("epargne") ? new CompteEpargne(p) : new CompteCourant(p);
                while (sc.hasNext()) {
                    String cmd = sc.next();
                    boolean ok = true;
                    switch (cmd) {
                        case "depot" -> c.deposer(sc.nextDouble());
                        case "retrait" -> ok = c.retirer(sc.nextDouble());
                        default -> { if (c instanceof CompteEpargne e) e.appliquerInterets(); }
                    }
                    System.out.println(ok ? String.format(Locale.US, "%.2f", c.getSolde()) : "refusé");
                }
            }
        }
      tests:
        - { input: "epargne 0.1\ndepot 100\ninterets\nretrait 200\nretrait 10", output: "100.00\n110.00\nrefusé\n100.00" }
        - { input: "courant 50\nretrait 30\nretrait 30\ndepot 100\ninterets", output: "-30.00\nrefusé\n70.00\n70.00", hidden: true }
