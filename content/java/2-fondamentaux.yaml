  - slug: java-objets
    title: Objets
    summary: Références, null, alias, cycle de vie et ramasse-miettes, comparaison et copie d’objets.
    minutes: 25
    concepts: [classes, references]
    sections:
      - title: Des références
        body: |
          Une variable d’objet contient une **référence** (une sorte d’adresse gérée par la JVM), pas l’objet lui-même :

          ```java
          StringBuilder a = new StringBuilder("ab");
          StringBuilder b = a;     // b et a désignent LE MÊME objet
          b.append("c");
          System.out.println(a);   // abc
          ```

          `null` signifie « aucune référence ». Appeler une méthode sur `null` lève une **NullPointerException** (le bug le plus fréquent en Java).

          ```java
          String s = null;
          s.length();                         // 💥 NullPointerException
          if (s != null && s.length() > 0) {} // garde
          Objects.requireNonNull(param, "param ne doit pas être null");
          ```
      - title: Cycle de vie
        body: |
          1. `new` alloue l’objet sur le **tas** et appelle le constructeur.
          2. L’objet vit tant qu’il est **atteignable** depuis une référence active.
          3. Quand plus rien ne le référence, le **ramasse-miettes** (GC) peut récupérer sa mémoire, à un moment non déterminé.

          Pas de destructeur en Java : pour libérer une ressource (fichier, connexion), on utilise `try-with-resources` avec `AutoCloseable` (chapitre Exceptions).

          Copier un objet : écrire un constructeur de copie (`new Point(autre)`) ou une méthode `copier()`. Les records et `String` étant immuables, les partager est sans danger.
    exercises:
      - id: java-obj-predict
        type: predict
        prompt: Que va afficher ce programme ?
        code: |
          import java.util.*;
          public class Main {
              public static void main(String[] args) {
                  List<Integer> a = new ArrayList<>(List.of(1, 2));
                  List<Integer> b = a;
                  List<Integer> c = new ArrayList<>(a);
                  b.add(3);
                  c.add(4);
                  System.out.println(a + " " + b + " " + c + " " + (a == b));
              }
          }
        output: '[1, 2, 3] [1, 2, 3] [1, 2, 4] true'
      - id: java-obj-q1
        type: mcq
        prompt: Quand un objet peut-il être récupéré par le ramasse-miettes ?
        choices: ['Quand il n’est plus atteignable depuis aucune référence active', 'À la fin de la méthode qui l’a créé', 'Quand on appelle delete', 'Jamais']
        answer: 0
      - id: java-obj-bug
        type: bugfix
        prompt: Ce programme lève une NullPointerException. Trouve la ligne à l’origine du problème.
        code: |
          public class Main {
