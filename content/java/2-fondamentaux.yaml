  # ------------------------------------------------------------------
  - slug: java-encapsulation
    title: Encapsulation
    summary: Modificateurs d’accès, getters et setters raisonnés, invariants, immuabilité et méthodes métier.
    minutes: 25
    concepts: [classes, encapsulation]
    sections:
      - title: Modificateurs d’accès
        body: |
          | Modificateur | Classe | Package | Sous-classe | Partout |
          |---|---|---|---|---|
          | `private` | ✅ | ❌ | ❌ | ❌ |
          | *(aucun)* package-private | ✅ | ✅ | ❌ | ❌ |
          | `protected` | ✅ | ✅ | ✅ | ❌ |
          | `public` | ✅ | ✅ | ✅ | ✅ |

          Règle : **attributs `private`**, méthodes aussi restreintes que possible.
      - title: Protéger les invariants
        body: |
          ```java
          public class CompteBancaire {
              private final String titulaire;
              private long solde;                         // invariant : solde >= 0

              public CompteBancaire(String titulaire) { this.titulaire = Objects.requireNonNull(titulaire); }
              public void deposer(long montant) {
                  if (montant <= 0) throw new IllegalArgumentException("montant invalide");
                  solde += montant;
              }
              public boolean retirer(long montant) {
                  if (montant <= 0 || montant > solde) return false;
                  solde -= montant;
                  return true;
              }
              public long getSolde() { return solde; }    // lecture seule : pas de setSolde !
          }
          ```

          - Des **méthodes métier** (`deposer`, `retirer`) plutôt que des setters génériques.
          - **Immuabilité** (classe `final`, attributs `final`, pas de setter) : objets plus simples et sûrs, partageables entre threads.
          - Ne jamais exposer une collection interne modifiable (copie défensive ou `List.copyOf`).
