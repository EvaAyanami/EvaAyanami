      - id: java-obj-code
        type: code
        title: Copie défensive
        prompt: |
          Écris une classe `Equipe` qui stocke une liste de noms. Son constructeur et son accesseur `getMembres()` doivent faire des **copies défensives** (`new ArrayList<>(…)` et `List.copyOf(…)`) pour que l’extérieur ne puisse pas modifier l’état interne.

          Le programme (fourni) essaie de tricher : il modifie la liste d’origine et tente de modifier la liste renvoyée.
        starter: |
          import java.util.*;

          public class Main {
              public static void main(String[] args) {
                  Scanner sc = new Scanner(System.in);
                  List<String> noms = new ArrayList<>();
                  while (sc.hasNext()) noms.add(sc.next());
                  Equipe e = new Equipe(noms);
                  noms.add("intrus");
                  try { e.getMembres().add("pirate"); } catch (UnsupportedOperationException ex) { System.out.println("modification refusée"); }
                  System.out.println(e.getMembres());
              }
          }
        solution: |
          import java.util.*;

          class Equipe {
              private final List<String> membres;
              Equipe(List<String> membres) { this.membres = new ArrayList<>(membres); }
              List<String> getMembres() { return List.copyOf(membres); }
          }

          public class Main {
              public static void main(String[] args) {
                  Scanner sc = new Scanner(System.in);
                  List<String> noms = new ArrayList<>();
                  while (sc.hasNext()) noms.add(sc.next());
                  Equipe e = new Equipe(noms);
                  noms.add("intrus");
                  try { e.getMembres().add("pirate"); } catch (UnsupportedOperationException ex) { System.out.println("modification refusée"); }
                  System.out.println(e.getMembres());
              }
          }
        tests:
          - { input: Ada Kiri, output: "modification refusée\n[Ada, Kiri]" }
          - { input: '', output: "modification refusée\n[]", hidden: true }
    project:
      id: java-obj-projet
      type: code
      title: Liste chaînée
      difficulty: 3
      prompt: |
        Implémente une **liste chaînée** d’entiers : une classe `Noeud { int valeur; Noeud suivant; }` et une classe `Liste` avec `ajouterEnTete(int)`, `ajouterEnFin(int)`, `boolean supprimer(int)` (première occurrence), `int taille()` et `toString()` au format `[a -> b -> c]` (`[]` si vide).

        Commandes : `tete X`, `fin X`, `suppr X` (affiche `supprimé` ou `absent`), `afficher`.
      starter: |
        import java.util.Scanner;

        public class Main {
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
            }
        }
      solution: |
        import java.util.Scanner;

        class Noeud {
            int valeur;
            Noeud suivant;
            Noeud(int v, Noeud s) { valeur = v; suivant = s; }
        }

        class Liste {
            private Noeud tete;
            private int taille;
            void ajouterEnTete(int v) { tete = new Noeud(v, tete); taille++; }
            void ajouterEnFin(int v) {
                Noeud n = new Noeud(v, null);
                if (tete == null) tete = n;
                else { Noeud c = tete; while (c.suivant != null) c = c.suivant; c.suivant = n; }
                taille++;
            }
            boolean supprimer(int v) {
                if (tete == null) return false;
                if (tete.valeur == v) { tete = tete.suivant; taille--; return true; }
                for (Noeud c = tete; c.suivant != null; c = c.suivant) {
                    if (c.suivant.valeur == v) { c.suivant = c.suivant.suivant; taille--; return true; }
                }
                return false;
            }
            int taille() { return taille; }
            @Override public String toString() {
                StringBuilder sb = new StringBuilder("[");
                for (Noeud c = tete; c != null; c = c.suivant) sb.append(c == tete ? "" : " -> ").append(c.valeur);
                return sb.append("]").toString();
            }
        }

        public class Main {
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
                Liste l = new Liste();
                while (sc.hasNext()) {
                    switch (sc.next()) {
                        case "tete" -> l.ajouterEnTete(sc.nextInt());
                        case "fin" -> l.ajouterEnFin(sc.nextInt());
                        case "suppr" -> System.out.println(l.supprimer(sc.nextInt()) ? "supprimé" : "absent");
                        default -> System.out.println(l + " (" + l.taille() + ")");
                    }
                }
            }
        }
      tests:
        - { input: "fin 2\ntete 1\nfin 3\nafficher\nsuppr 2\nsuppr 9\nafficher", output: "[1 -> 2 -> 3] (3)\nsupprimé\nabsent\n[1 -> 3] (2)" }
        - { input: "afficher\nsuppr 1", output: "[] (0)\nabsent", hidden: true }
