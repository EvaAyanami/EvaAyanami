    project:
      id: java-ctor-projet
      type: code
      title: Date validée
      difficulty: 3
      prompt: |
        Écris une classe immuable `Date` dont le constructeur lève `IllegalArgumentException("date invalide")` si la date n’existe pas (années bissextiles comprises), une fabrique `static Date parse(String "JJ/MM/AAAA")`, une méthode `Date lendemain()` et `toString()` au format `JJ/MM/AAAA`.

        Pour chaque ligne, affiche `date -> lendemain` ou `date invalide` (n’utilise pas java.time).
      starter: |
        import java.util.Scanner;

        public class Main {
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
            }
        }
      solution: |
        import java.util.Scanner;

        final class Date {
            private final int jour, mois, annee;
            Date(int j, int m, int a) {
                if (m < 1 || m > 12 || j < 1 || j > joursDansMois(m, a)) throw new IllegalArgumentException("date invalide");
                jour = j; mois = m; annee = a;
            }
            static Date parse(String s) {
                String[] p = s.split("/");
                return new Date(Integer.parseInt(p[0]), Integer.parseInt(p[1]), Integer.parseInt(p[2]));
            }
            static boolean bissextile(int a) { return (a % 4 == 0 && a % 100 != 0) || a % 400 == 0; }
            static int joursDansMois(int m, int a) {
                int[] j = {31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31};
                return m == 2 && bissextile(a) ? 29 : j[m - 1];
            }
            Date lendemain() {
                if (jour < joursDansMois(mois, annee)) return new Date(jour + 1, mois, annee);
                if (mois < 12) return new Date(1, mois + 1, annee);
                return new Date(1, 1, annee + 1);
            }
            @Override public String toString() { return String.format("%02d/%02d/%d", jour, mois, annee); }
        }

        public class Main {
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
                while (sc.hasNextLine()) {
                    String l = sc.nextLine().trim();
                    if (l.isEmpty()) continue;
                    try {
                        Date d = Date.parse(l);
                        System.out.println(d + " -> " + d.lendemain());
                    } catch (IllegalArgumentException e) {
                        System.out.println("date invalide");
                    }
                }
            }
        }
      tests:
        - { input: "28/02/2024\n31/12/2025\n30/02/2023", output: "28/02/2024 -> 29/02/2024\n31/12/2025 -> 01/01/2026\ndate invalide" }
        - { input: "29/02/1900\n29/02/2000", output: "date invalide\n29/02/2000 -> 01/03/2000", hidden: true }
