  # ------------------------------------------------------------------
  - slug: java-polymorphisme
    title: Polymorphisme
    summary: Liaison dynamique, références de type parent, instanceof et filtrage par motif, classes scellées et switch sur types.
    minutes: 30
    concepts: [polymorphisme]
    sections:
      - title: Liaison dynamique
        body: |
          Une référence de type parent peut désigner un objet d’une sous-classe ; la méthode appelée est celle du **type réel** de l’objet (toutes les méthodes d’instance sont « virtuelles » en Java) :

          ```java
          List<Animal> zoo = List.of(new Chien("Rex"), new Chat("Tom"));
          for (Animal a : zoo) {
              System.out.println(a.cri());   // Wouf puis Miaou
          }
          ```

          Les méthodes `static`, `private` et `final` ne sont pas redéfinissables (pas de liaison dynamique).
      - title: instanceof, sealed et switch
        body: |
          ```java
          if (a instanceof Chien c) {          // filtrage par motif (Java 16)
              c.rapporterBalle();
          }

          sealed interface Forme permits Cercle, Rectangle {}     // hiérarchie fermée (Java 17)
          record Cercle(double r) implements Forme {}
          record Rectangle(double l, double h) implements Forme {}

          static double aire(Forme f) {
              return switch (f) {                                     // switch sur les types (Java 21)
                  case Cercle c -> Math.PI * c.r() * c.r();
                  case Rectangle(double l, double h) -> l * h;        // déconstruction de record
              };                                                      // exhaustif : pas de default
          }
          ```

          Avec une interface **scellée**, le compilateur sait que tous les cas sont couverts.
    exercises:
      - id: java-poly-predict
        type: predict
        prompt: Que va afficher ce programme ?
        code: |
          public class Main {
              static class Forme { String nom() { return "forme"; } static String type() { return "F"; } }
              static class Carre extends Forme { @Override String nom() { return "carré"; } static String type() { return "C"; } }
              public static void main(String[] args) {
                  Forme f = new Carre();
                  Object o = f;
                  String s = o instanceof Carre c ? c.nom() : "?";
                  System.out.println(f.nom() + " " + Forme.type() + " " + s);
