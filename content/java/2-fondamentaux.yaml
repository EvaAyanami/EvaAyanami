  - slug: java-interfaces
    title: Interfaces
    summary: Définir des contrats avec les interfaces, implémentations multiples, méthodes default et static, interfaces fonctionnelles.
    minutes: 30
    concepts: [traits, interfaces]
    sections:
      - title: Un contrat
        body: |
          ```java
          interface Payable {
              double montant();                                   // abstraite
              default String resume() { return "à payer : " + montant(); }   // méthode par défaut
              static Payable gratuit() { return () -> 0; }        // méthode statique
          }

          class Facture implements Payable, Comparable<Facture> {   // plusieurs interfaces
              private final double total;
              Facture(double t) { total = t; }
              public double montant() { return total; }
              public int compareTo(Facture o) { return Double.compare(total, o.total); }
          }
          ```

          Une classe peut implémenter **plusieurs** interfaces. Les interfaces décrivent **ce que sait faire** un objet, indépendamment de ce qu’il **est** (sa classe mère).
      - title: Interfaces de la bibliothèque standard
        body: |
          | Interface | Rôle |
          |---|---|
          | `Comparable<T>` | ordre naturel (`compareTo`) → `Collections.sort` |
          | `Comparator<T>` | ordre externe (`Comparator.comparing(…)`) |
          | `Iterable<T>` | utilisable dans un for-each |
          | `AutoCloseable` | utilisable dans try-with-resources |
          | `Runnable`, `Callable<V>` | tâches pour les threads |
          | `Function`, `Predicate`, `Supplier`, `Consumer` | interfaces fonctionnelles (lambdas) |

          Une **interface fonctionnelle** (une seule méthode abstraite) peut être implémentée par une **lambda** : `Payable p = () -> 42.0;`.
