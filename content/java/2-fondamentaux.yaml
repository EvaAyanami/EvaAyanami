      - id: java-class-code
        type: code
        title: Fraction
        prompt: |
          Écris un `record Fraction(long num, long den)` avec un constructeur compact qui **simplifie** (PGCD, dénominateur positif) et une méthode `Fraction plus(Fraction o)`. Son `toString()` doit renvoyer `num/den`.

          Lis deux fractions `a b c d` et affiche leur somme.
        starter: |
          import java.util.Scanner;

          public class Main {
              public static void main(String[] args) {
                  Scanner sc = new Scanner(System.in);
                  Fraction f = new Fraction(sc.nextLong(), sc.nextLong());
                  Fraction g = new Fraction(sc.nextLong(), sc.nextLong());
                  System.out.println(f.plus(g));
              }
          }
        solution: |
          import java.util.Scanner;

          record Fraction(long num, long den) {
              Fraction {
                  if (den < 0) { num = -num; den = -den; }
                  long g = pgcd(Math.abs(num), den);
                  if (g == 0) g = 1;
                  num /= g;
                  den /= g;
              }
              static long pgcd(long a, long b) { return b == 0 ? a : pgcd(b, a % b); }
              Fraction plus(Fraction o) { return new Fraction(num * o.den + o.num * den, den * o.den); }
              @Override public String toString() { return num + "/" + den; }
          }

          public class Main {
              public static void main(String[] args) {
                  Scanner sc = new Scanner(System.in);
                  Fraction f = new Fraction(sc.nextLong(), sc.nextLong());
                  Fraction g = new Fraction(sc.nextLong(), sc.nextLong());
                  System.out.println(f.plus(g));
              }
          }
        tests:
          - { input: 1 2 1 3, output: 5/6 }
          - { input: 1 4 1 4, output: 1/2, hidden: true }
          - { input: -1 2 1 2, output: 0/1, hidden: true }
        concepts: [classes]
    project:
      id: java-class-projet
      type: code
      title: Inventaire
      difficulty: 3
      prompt: |
        Écris un `record Objet(String nom, int quantite, double prix)` et une classe `Inventaire` (liste privée) avec `ajouter(String nom, int q, double prix)` (cumule les quantités si l’objet existe), `double valeurTotale()` et `afficher()` (`nom x quantite`, ordre d’ajout).

        Chaque ligne : `nom quantite prix`. Affiche l’inventaire puis `Total : X.XX` (Locale.US).
      starter: |
        import java.util.*;

        public class Main {
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
            }
        }
      solution: |
        import java.util.*;

        record Objet(String nom, int quantite, double prix) {}

        class Inventaire {
            private final List<Objet> objets = new ArrayList<>();
            void ajouter(String nom, int q, double prix) {
                for (int i = 0; i < objets.size(); i++) {
                    Objet o = objets.get(i);
                    if (o.nom().equals(nom)) { objets.set(i, new Objet(nom, o.quantite() + q, o.prix())); return; }
                }
                objets.add(new Objet(nom, q, prix));
            }
            double valeurTotale() {
                double t = 0;
                for (Objet o : objets) t += o.quantite() * o.prix();
                return t;
            }
            void afficher() { for (Objet o : objets) System.out.println(o.nom() + " x " + o.quantite()); }
        }

        public class Main {
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in).useLocale(Locale.US);
                Inventaire inv = new Inventaire();
                while (sc.hasNext()) inv.ajouter(sc.next(), sc.nextInt(), sc.nextDouble());
                inv.afficher();
                System.out.println(String.format(Locale.US, "Total : %.2f", inv.valeurTotale()));
            }
        }
      tests:
        - { input: "potion 3 2.5\nepee 1 40\npotion 2 2.5", output: "potion x 5\nepee x 1\nTotal : 52.50" }
        - { input: pomme 10 0.3, output: "pomme x 10\nTotal : 3.00", hidden: true }
      concepts: [classes]
