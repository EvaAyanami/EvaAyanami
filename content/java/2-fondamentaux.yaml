    project:
      id: java-itf-projet
      type: code
      title: Moyens de paiement
      difficulty: 3
      prompt: |
        Définis `interface MoyenPaiement { String nom(); boolean payer(double montant); default String recu(double m) { … } }` où `recu` renvoie `"<nom> : <montant 2 déc.> €"`. Implémente :

        - `CarteBancaire(plafond)` : refuse au-delà du plafond **cumulé** ;
        - `Portefeuille(solde)` : refuse si solde insuffisant ;
        - `BonAchat(valeur)` : utilisable une seule fois, pour un montant ≤ valeur.

        Première ligne : `plafond solde valeur`. Puis des achats `moyen montant` (`carte`, `portefeuille`, `bon`). Affiche le reçu ou `refusé (<nom>)`.
      starter: |
        import java.util.*;

        public class Main {
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in).useLocale(Locale.US);
            }
        }
      solution: |
        import java.util.*;

        interface MoyenPaiement {
            String nom();
            boolean payer(double montant);
            default String recu(double m) { return String.format(Locale.US, "%s : %.2f €", nom(), m); }
        }

        class CarteBancaire implements MoyenPaiement {
            private final double plafond;
            private double depense;
            CarteBancaire(double plafond) { this.plafond = plafond; }
            public String nom() { return "carte"; }
            public boolean payer(double m) {
                if (depense + m > plafond) return false;
                depense += m;
                return true;
            }
        }

        class Portefeuille implements MoyenPaiement {
            private double solde;
            Portefeuille(double s) { solde = s; }
            public String nom() { return "portefeuille"; }
            public boolean payer(double m) {
                if (m > solde) return false;
                solde -= m;
                return true;
            }
        }

        class BonAchat implements MoyenPaiement {
            private final double valeur;
            private boolean utilise;
            BonAchat(double v) { valeur = v; }
            public String nom() { return "bon"; }
            public boolean payer(double m) {
                if (utilise || m > valeur) return false;
                utilise = true;
                return true;
            }
        }

        public class Main {
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in).useLocale(Locale.US);
                Map<String, MoyenPaiement> moyens = Map.of(
                        "carte", new CarteBancaire(sc.nextDouble()),
                        "portefeuille", new Portefeuille(sc.nextDouble()),
                        "bon", new BonAchat(sc.nextDouble()));
                while (sc.hasNext()) {
                    MoyenPaiement mp = moyens.get(sc.next());
                    double m = sc.nextDouble();
                    System.out.println(mp.payer(m) ? mp.recu(m) : "refusé (" + mp.nom() + ")");
                }
            }
        }
      tests:
        - { input: "100 50 20\ncarte 60\ncarte 50\nportefeuille 30\nportefeuille 30\nbon 15\nbon 5", output: "carte : 60.00 €\nrefusé (carte)\nportefeuille : 30.00 €\nrefusé (portefeuille)\nbon : 15.00 €\nrefusé (bon)" }
        - { input: "0 0 10\nbon 11", output: refusé (bon), hidden: true }
