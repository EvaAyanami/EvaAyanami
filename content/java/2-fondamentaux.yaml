  - slug: java-classes
    title: Classes
    summary: Attributs, méthodes d’instance et de classe, this, toString, equals et hashCode, records.
    minutes: 30
    concepts: [classes]
    sections:
      - title: Anatomie d’une classe
        body: |
          ```java
          public class Rectangle {
              private double largeur;                 // attributs (état)
              private double hauteur;
              private static int crees = 0;           // attribut de classe (partagé)

              public Rectangle(double largeur, double hauteur) {
                  this.largeur = largeur;             // this = l’objet courant
                  this.hauteur = hauteur;
                  crees++;
              }
              public double aire() { return largeur * hauteur; }      // méthode d’instance
              public static int nombreCrees() { return crees; }       // méthode de classe

              @Override
              public String toString() { return "Rectangle(" + largeur + " x " + hauteur + ")"; }
          }
          ```

          Une seule classe `public` par fichier, du même nom que le fichier. Les autres classes du fichier sont « package-private ».
      - title: equals, hashCode et records
        body: |
          Par défaut, `equals` compare les **références** (même objet ?). Pour comparer le **contenu**, on redéfinit `equals` **et** `hashCode` (indispensable pour `HashMap`/`HashSet`) :

          ```java
          @Override public boolean equals(Object o) {
              return o instanceof Rectangle r && r.largeur == largeur && r.hauteur == hauteur;
          }
          @Override public int hashCode() { return java.util.Objects.hash(largeur, hauteur); }
          ```

          Les **records** (Java 16) génèrent tout cela pour les classes de données immuables :

          ```java
          record Point(int x, int y) {
              Point {                                     // constructeur compact : validation
                  if (x < 0) throw new IllegalArgumentException("x négatif");
              }
              double norme() { return Math.hypot(x, y); }
          }
          var p = new Point(3, 4);
          p.x();            // accesseur généré
          p.equals(new Point(3, 4));  // true
          ```
    exercises:
      - id: java-class-predict
        type: predict
        prompt: Que va afficher ce programme ?
        code: |
          public class Main {
              record Point(int x, int y) {
                  int somme() { return x + y; }
              }
              static class Boite { int v; Boite(int v) { this.v = v; } }
              public static void main(String[] args) {
                  Point a = new Point(1, 2), b = new Point(1, 2);
                  Boite c = new Boite(1), d = new Boite(1);
                  System.out.println(a.equals(b) + " " + c.equals(d) + " " + a + " " + a.somme());
              }
          }
        output: true false Point[x=1, y=2] 3
        concepts: [classes]
