  - slug: java-abstraites
    title: Classes abstraites
    summary: Classes et méthodes abstraites, patron de méthode (template method), et choix entre classe abstraite et interface.
    minutes: 25
    concepts: [heritage, polymorphisme]
    sections:
      - title: abstract
        body: |
          Une **classe abstraite** ne peut pas être instanciée ; elle sert de base commune et peut contenir :

          - de l’**état** (attributs) et des constructeurs ;
          - des méthodes concrètes ;
          - des méthodes **abstraites** (sans corps) que les sous-classes **doivent** implémenter.

          ```java
          abstract class Rapport {
              private final String titre;
              protected Rapport(String titre) { this.titre = titre; }

              public final String generer() {                // patron de méthode (template method)
                  return entete() + "\n" + corps() + "\n" + pied();
              }
              private String entete() { return "== " + titre + " =="; }
              protected abstract String corps();             // à fournir par chaque sous-classe
              protected String pied() { return "-- fin --"; }  // redéfinissable
          }
          ```
      - title: Abstraite ou interface ?
        body: |
          | | Classe abstraite | Interface |
          |---|---|---|
          | Héritage | une seule | plusieurs |
          | État (attributs) | ✅ | ❌ (constantes uniquement) |
          | Constructeur | ✅ | ❌ |
          | Méthodes concrètes | ✅ | `default` / `static` |

          Choisis une **interface** pour décrire une capacité (« sait se comparer », « est payable ») ; une **classe abstraite** pour partager du code et de l’état entre des classes étroitement liées. On combine souvent les deux (`AbstractList` implémente `List`).
    exercises:
      - id: java-abs-q1
        type: mcq
        prompt: Peut-on instancier une classe abstraite avec new ?
        choices: ['Non', 'Oui', 'Seulement sans paramètre', 'Seulement dans un test']
        answer: 0
      - id: java-abs-q2
        type: mcq
        prompt: Qu’est-ce que le patron de méthode (template method) ?
        choices: ['Une méthode qui fixe le squelette d’un algorithme et délègue certaines étapes aux sous-classes', 'Une méthode générique', 'Une méthode statique', 'Une annotation']
        answer: 0
      - id: java-abs-predict
        type: predict
        prompt: Que va afficher ce programme ?
        code: |
          public class Main {
              static abstract class Boisson {
                  final String preparer() { return chauffer() + ", " + infuser() + ", " + servir(); }
                  String chauffer() { return "eau chaude"; }
                  abstract String infuser();
                  String servir() { return "tasse"; }
              }
              static class The extends Boisson { String infuser() { return "thé"; } }
              static class Cafe extends Boisson { String infuser() { return "café"; } @Override String servir() { return "mug"; } }
              public static void main(String[] args) {
