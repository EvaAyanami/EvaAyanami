          Écris un `record Eleve(String nom, int note, int age)`. Lis des lignes `nom note age` et trie la liste avec un `Comparator` : note décroissante, puis âge croissant, puis nom (`Comparator.comparing(...).reversed().thenComparing(...)`). Affiche `nom note age` par ligne.
