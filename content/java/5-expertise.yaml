language: java
level: 5
chapters:
  # ------------------------------------------------------------------
  - slug: java-architecture
    title: Architecture logicielle
    summary: Organiser une application — couches, architecture hexagonale, dépendances vers le domaine, modules et frontières.
    minutes: 35
    concepts: [architecture]
    sections:
      - title: Architecture en couches
        body: |
          La structure classique d’une application d’entreprise :

          | Couche | Rôle | Exemple |
          |---|---|---|
          | Présentation | HTTP, JSON, validation des entrées | `CoursController` |
          | Application / service | cas d’utilisation, transactions | `InscriptionService` |
          | Domaine | règles métier pures | `Eleve`, `Progression` |
          | Infrastructure | base de données, e-mail, files | `EleveRepositoryJdbc` |

          Règle d’or : une couche ne dépend que des couches **inférieures**, et le **domaine ne dépend de rien** (pas de SQL ni de HTTP dans les règles métier).
      - title: Hexagonale (ports et adaptateurs)
        body: |
          Le domaine définit des **ports** (interfaces) ; l’infrastructure fournit des **adaptateurs** qui les implémentent :

          ```java
          // domaine
          public interface DepotEleves { Optional<Eleve> parId(long id); void sauver(Eleve e); }
          public class InscriptionService {
              private final DepotEleves depot;           // dépend d’une abstraction
              public InscriptionService(DepotEleves depot) { this.depot = depot; }
          }

          // infrastructure
          class DepotElevesPostgres implements DepotEleves { … }
          class DepotElevesMemoire implements DepotEleves { … }   // pour les tests
          ```

          Avantages : domaine testable sans base de données, technologies remplaçables. Les **modules Java** (`module-info.java`) ou des modules Maven/Gradle séparés rendent ces frontières vérifiables par le compilateur. Outil de vérification automatique : ArchUnit.
    exercises:
      - id: java-arch-q1
        type: mcq
        prompt: Dans une architecture hexagonale, de quoi dépend le domaine ?
        choices: ['De rien d’autre que lui-même (il définit des ports)', 'De la base de données', 'Du framework web', 'De l’infrastructure']
        answer: 0
      - id: java-arch-q2
        type: mcq
        prompt: Où placer une règle « un élève ne peut pas s’inscrire deux fois au même cours » ?
        choices: ['Dans le domaine / service', 'Dans le contrôleur HTTP', 'Dans le CSS', 'Dans le script SQL uniquement']
        answer: 0
      - id: java-arch-code
        type: code
        title: Vérificateur de dépendances
        prompt: |
          Comme ArchUnit, vérifie les règles d’architecture. Couches de la plus haute à la plus basse : `presentation`, `application`, `domaine`, avec `infrastructure` qui peut dépendre de `domaine` et `application` uniquement. Le `domaine` ne dépend d’aucune autre couche.

          Chaque ligne : `ClasseA couche -> ClasseB couche`. Une dépendance est autorisée si elle va vers une couche inférieure ou la même couche (`presentation → application → domaine`), ou de `infrastructure` vers `domaine`/`application`. Affiche `violation : A (couche) -> B (couche)` pour chaque infraction, puis `N violation(s)`.
        starter: |
          import java.util.*;

          public class Main {
              public static void main(String[] args) {
                  Scanner sc = new Scanner(System.in);
              }
          }
        solution: |
          import java.util.*;

          public class Main {
              static final Map<String, Set<String>> AUTORISE = Map.of(
                  "presentation", Set.of("presentation", "application", "domaine"),
                  "application", Set.of("application", "domaine"),
                  "domaine", Set.of("domaine"),
                  "infrastructure", Set.of("infrastructure", "application", "domaine"));

              public static void main(String[] args) {
                  Scanner sc = new Scanner(System.in);
                  int n = 0;
                  while (sc.hasNextLine()) {
                      String l = sc.nextLine().trim();
                      if (l.isEmpty()) continue;
                      String[] p = l.split("\\s+");
                      String a = p[0], ca = p[1], b = p[3], cb = p[4];
                      if (!AUTORISE.get(ca).contains(cb)) {
                          n++;
                          System.out.println("violation : " + a + " (" + ca + ") -> " + b + " (" + cb + ")");
                      }
                  }
                  System.out.println(n + " violation(s)");
              }
          }
        tests:
          - { input: "CoursController presentation -> InscriptionService application\nInscriptionService application -> Eleve domaine\nEleve domaine -> DepotPostgres infrastructure\nDepotPostgres infrastructure -> Eleve domaine\nInscriptionService application -> CoursController presentation", output: "violation : Eleve (domaine) -> DepotPostgres (infrastructure)\nviolation : InscriptionService (application) -> CoursController (presentation)\n2 violation(s)" }
          - { input: A presentation -> B infrastructure, output: "violation : A (presentation) -> B (infrastructure)\n1 violation(s)", hidden: true }
    project:
      id: java-arch-projet
      type: code
      title: Inscriptions en architecture hexagonale
      difficulty: 3
      prompt: |
        Implémente un mini-service d’inscription en séparant clairement :

        - **domaine** : `record Inscription(String eleve, String cours)`, interface (port) `DepotInscriptions` (`boolean existe(String, String)`, `void ajouter(Inscription)`, `List<Inscription> duCours(String)`), interface `Notifieur` (`void notifier(String eleve, String message)`) ;
        - **application** : `ServiceInscription` qui reçoit les ports par constructeur, refuse les doublons et les cours pleins (capacité 2 par cours), et notifie l’élève ;
        - **infrastructure** : `DepotMemoire` et `NotifieurConsole` (affiche `[mail eleve] message`).

        Commandes : `inscrire ELEVE COURS` → `inscrit`, `déjà inscrit` ou `cours complet` (la notification `Bienvenue en COURS` n’est envoyée qu’en cas de succès) ; `liste COURS` → élèves séparés par des virgules (ou `aucun`).
      starter: |
        import java.util.*;

        public class Main {
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
            }
        }
      solution: |
        import java.util.*;

        // ---- domaine ----
        record Inscription(String eleve, String cours) {}
        interface DepotInscriptions {
            boolean existe(String eleve, String cours);
            void ajouter(Inscription i);
            List<Inscription> duCours(String cours);
        }
        interface Notifieur { void notifier(String eleve, String message); }

        // ---- application ----
        class ServiceInscription {
            static final int CAPACITE = 2;
            private final DepotInscriptions depot;
            private final Notifieur notifieur;
            ServiceInscription(DepotInscriptions depot, Notifieur notifieur) { this.depot = depot; this.notifieur = notifieur; }
            String inscrire(String eleve, String cours) {
                if (depot.existe(eleve, cours)) return "déjà inscrit";
                if (depot.duCours(cours).size() >= CAPACITE) return "cours complet";
                depot.ajouter(new Inscription(eleve, cours));
                notifieur.notifier(eleve, "Bienvenue en " + cours);
                return "inscrit";
            }
            List<String> liste(String cours) { return depot.duCours(cours).stream().map(Inscription::eleve).toList(); }
        }

        // ---- infrastructure ----
        class DepotMemoire implements DepotInscriptions {
            private final List<Inscription> donnees = new ArrayList<>();
            public boolean existe(String e, String c) { return donnees.contains(new Inscription(e, c)); }
            public void ajouter(Inscription i) { donnees.add(i); }
            public List<Inscription> duCours(String c) { return donnees.stream().filter(i -> i.cours().equals(c)).toList(); }
        }
        class NotifieurConsole implements Notifieur {
            public void notifier(String eleve, String message) { System.out.println("[mail " + eleve + "] " + message); }
        }

        public class Main {
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
                ServiceInscription s = new ServiceInscription(new DepotMemoire(), new NotifieurConsole());
                while (sc.hasNext()) {
                    if (sc.next().equals("inscrire")) System.out.println(s.inscrire(sc.next(), sc.next()));
                    else {
                        List<String> l = s.liste(sc.next());
                        System.out.println(l.isEmpty() ? "aucun" : String.join(",", l));
                    }
                }
            }
        }
      tests:
        - { input: "inscrire ada rust\ninscrire ada rust\ninscrire bob rust\ninscrire zoe rust\nliste rust\nliste java", output: "[mail ada] Bienvenue en rust\ninscrit\ndéjà inscrit\n[mail bob] Bienvenue en rust\ninscrit\ncours complet\nada,bob\naucun" }
        - { input: liste cpp, output: aucun, hidden: true }
      require:
        - { pattern: 'interface\s+DepotInscriptions', message: Définir le port DepotInscriptions }
    exam:
      pass: 70
      questions:
        - id: java-arch-ex1
          type: mcq
          prompt: Qu’est-ce qu’un « adaptateur » en architecture hexagonale ?
          choices: ['Une implémentation technique d’un port défini par le domaine', 'Une classe du domaine', 'Un câble réseau', 'Un test unitaire']
          answer: 0
        - id: java-arch-ex2
          type: mcq
          prompt: Quel outil permet de tester automatiquement les règles d’architecture en Java ?
          choices: ['ArchUnit', 'Mockito', 'Gson', 'Lombok']
          answer: 0
        - id: java-arch-ex3
          type: mcq
          prompt: Pourquoi garder le domaine indépendant de la base de données ?
          choices: ['Pour le tester facilement et pouvoir changer de technologie', 'Pour la vitesse du réseau', 'Parce que SQL est interdit en Java', 'Pour réduire la taille du jar']
          answer: 0

  # ------------------------------------------------------------------
  - slug: java-design-patterns
    title: Design patterns
    summary: Les patrons de conception essentiels — Singleton, Factory, Builder, Strategy, Observer, Decorator, Adapter et Command.
    minutes: 40
    concepts: [patterns]
    sections:
      - title: Création et structure
        body: |
          **Builder** — construire un objet complexe lisiblement :

          ```java
          Requete r = Requete.builder().url("/cours").methode("GET").entete("Accept", "json").build();
          ```

          **Factory** — choisir l’implémentation sans exposer `new` :

          ```java
          static Forme creer(String type) { return switch (type) { case "cercle" -> new Cercle(); default -> new Carre(); }; }
          ```

          **Singleton** — une seule instance (préférer l’injection de dépendances ; sinon `enum Config { INSTANCE; }`).

          **Decorator** — ajouter un comportement en enveloppant : `new BufferedReader(new InputStreamReader(in))`.

          **Adapter** — rendre compatible une interface existante avec celle attendue.
      - title: Comportement
        body: |
          **Strategy** — un algorithme interchangeable (souvent une lambda) :

          ```java
          interface Tarif { double prix(double base); }
          Tarif etudiant = b -> b * 0.5;
          ```

          **Observer** — notifier des abonnés d’un changement (listeners, événements).

          **Command** — encapsuler une action dans un objet (annulation, file d’attente, historique) :

          ```java
          interface Commande { void executer(); void annuler(); }
          ```

          **Template Method**, **State**, **Visitor** (avec les `sealed` + `switch` de Java 21, souvent remplacé par le pattern matching).

          Un patron se justifie par un **problème réel** : ne pas en empiler « au cas où ».
    exercises:
      - id: java-pat-q1
        type: mcq
        prompt: Quel patron enveloppe un objet pour lui ajouter un comportement sans modifier sa classe ?
        choices: ['Decorator', 'Singleton', 'Factory', 'Builder']
        answer: 0
      - id: java-pat-q2
        type: mcq
        prompt: Quel patron permet de mettre en œuvre un « annuler / refaire » ?
        choices: ['Command', 'Adapter', 'Singleton', 'Factory']
        answer: 0
      - id: java-pat-predict
        type: predict
        prompt: Que va afficher ce programme (Decorator) ?
        code: |
          import java.util.function.*;
          public class Main {
              interface Texte { String rendu(); }
              record Brut(String s) implements Texte { public String rendu() { return s; } }
              record Gras(Texte t) implements Texte { public String rendu() { return "**" + t.rendu() + "**"; } }
              record Majuscules(Texte t) implements Texte { public String rendu() { return t.rendu().toUpperCase(); } }
              public static void main(String[] args) {
                  Texte t = new Gras(new Majuscules(new Brut("kiri")));
                  Texte u = new Majuscules(new Gras(new Brut("ok")));
                  System.out.println(t.rendu() + " " + u.rendu());
              }
          }
        output: '**KIRI** **OK**'
      - id: java-pat-code
        type: code
        title: Éditeur avec annulation (Command)
        prompt: |
          Implémente un éditeur de texte avec le patron **Command** : interface `Commande { void executer(); void annuler(); }`, commandes `Ajouter(texte)` et `Effacer(n)` (efface les n derniers caractères, en mémorisant ce qui a été effacé). Une pile d’historique permet `annuler` et une pile de rétablissement permet `refaire` (vidée par toute nouvelle commande).

          Entrée : `ajouter TEXTE` (le texte peut contenir des espaces : prends le reste de la ligne), `effacer N`, `annuler`, `refaire`, `afficher` (affiche `[contenu]`).
        starter: |
          import java.util.*;

          public class Main {
              public static void main(String[] args) {
                  Scanner sc = new Scanner(System.in);
              }
          }
        solution: |
          import java.util.*;

          public class Main {
              interface Commande { void executer(); void annuler(); }
              static StringBuilder doc = new StringBuilder();

              record Ajouter(String texte) implements Commande {
                  public void executer() { doc.append(texte); }
                  public void annuler() { doc.setLength(doc.length() - texte.length()); }
              }
              static class Effacer implements Commande {
                  private final int n;
                  private String efface = "";
                  Effacer(int n) { this.n = n; }
                  public void executer() {
                      int k = Math.min(n, doc.length());
                      efface = doc.substring(doc.length() - k);
                      doc.setLength(doc.length() - k);
                  }
                  public void annuler() { doc.append(efface); }
              }

              public static void main(String[] args) {
                  Scanner sc = new Scanner(System.in);
                  Deque<Commande> historique = new ArrayDeque<>(), refaire = new ArrayDeque<>();
                  while (sc.hasNextLine()) {
                      String l = sc.nextLine();
                      if (l.isBlank()) continue;
                      String cmd = l.split(" ", 2)[0];
                      switch (cmd) {
                          case "ajouter", "effacer" -> {
                              Commande c = cmd.equals("ajouter") ? new Ajouter(l.substring(8)) : new Effacer(Integer.parseInt(l.substring(8).trim()));
                              c.executer();
                              historique.push(c);
                              refaire.clear();
                          }
                          case "annuler" -> { if (!historique.isEmpty()) { Commande c = historique.pop(); c.annuler(); refaire.push(c); } }
                          case "refaire" -> { if (!refaire.isEmpty()) { Commande c = refaire.pop(); c.executer(); historique.push(c); } }
                          default -> System.out.println("[" + doc + "]");
                      }
                  }
              }
          }
        tests:
          - { input: "ajouter Bonjour\najouter  Kiri\nafficher\neffacer 4\nafficher\nannuler\nafficher\nannuler\nannuler\nafficher\nrefaire\nafficher", output: "[Bonjour Kiri]\n[Bonjour ]\n[Bonjour Kiri]\n[]\n[Bonjour]" }
          - { input: "ajouter ab\nannuler\najouter c\nrefaire\nafficher", output: '[c]', hidden: true }
        require:
          - { pattern: 'interface\s+Commande', message: Définir l’interface Commande }
    project:
      id: java-pat-projet
      type: code
      title: Boutique — Builder, Strategy et Observer
      difficulty: 3
      prompt: |
        Combine trois patrons :

        - **Builder** : `Commande.builder().client(nom).article(nom, prix, qte)….build()` ;
        - **Strategy** : `Remise` — `aucune`, `etudiant` (−20 %), `fidelite` (−5 € si total ≥ 50, sinon rien) ;
        - **Observer** : des observateurs `Journal` (affiche `[journal] commande de CLIENT : TOTAL`) et `Stock` (affiche `[stock] -QTE ARTICLE` pour chaque article) notifiés à la validation.

        Entrée : des blocs `client NOM`, lignes `article NOM PRIX QTE`, `remise TYPE`, `valider`. À la validation, notifie les observateurs (journal d’abord, puis stock) avec le total remisé formaté `%.2f` (Locale.US).
      starter: |
        import java.util.*;

        public class Main {
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
            }
        }
      solution: |
        import java.util.*;
        import java.util.function.*;

        public class Main {
            record Article(String nom, double prix, int qte) {}
            record Commande(String client, List<Article> articles) {
                double brut() { return articles.stream().mapToDouble(a -> a.prix() * a.qte()).sum(); }
                static Builder builder() { return new Builder(); }
                static class Builder {
                    private String client;
                    private final List<Article> articles = new ArrayList<>();
                    Builder client(String c) { client = c; return this; }
                    Builder article(String n, double p, int q) { articles.add(new Article(n, p, q)); return this; }
                    Commande build() { return new Commande(client, List.copyOf(articles)); }
                }
            }
            interface Remise extends DoubleUnaryOperator {}
            interface Observateur { void commandeValidee(Commande c, double total); }

            static Remise remise(String type) {
                return switch (type) {
                    case "etudiant" -> t -> t * 0.8;
                    case "fidelite" -> t -> t >= 50 ? t - 5 : t;
                    default -> t -> t;
                };
            }

            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
                List<Observateur> obs = List.of(
                    (c, t) -> System.out.println(String.format(Locale.US, "[journal] commande de %s : %.2f", c.client(), t)),
                    (c, t) -> c.articles().forEach(a -> System.out.println("[stock] -" + a.qte() + " " + a.nom())));
                Commande.Builder b = Commande.builder();
                Remise r = remise("aucune");
                while (sc.hasNext()) {
                    switch (sc.next()) {
                        case "client" -> { b = Commande.builder().client(sc.next()); r = remise("aucune"); }
                        case "article" -> b.article(sc.next(), sc.nextDouble(), sc.nextInt());
                        case "remise" -> r = remise(sc.next());
                        default -> {
                            Commande c = b.build();
                            double total = r.applyAsDouble(c.brut());
                            obs.forEach(o -> o.commandeValidee(c, total));
                        }
                    }
                }
            }
        }
      tests:
        - { input: "client ada\narticle livre 30 2\narticle stylo 1.5 4\nremise fidelite\nvalider\nclient bob\narticle cahier 3 2\nremise etudiant\nvalider", output: "[journal] commande de ada : 61.00\n[stock] -2 livre\n[stock] -4 stylo\n[journal] commande de bob : 4.80\n[stock] -2 cahier" }
        - { input: "client z\narticle a 10 1\nremise fidelite\nvalider", output: "[journal] commande de z : 10.00\n[stock] -1 a", hidden: true }
    exam:
      pass: 70
      questions:
        - id: java-pat-ex1
          type: mcq
          prompt: Quel patron est le plus adapté pour un objet avec de nombreux paramètres optionnels ?
          choices: ['Builder', 'Observer', 'Adapter', 'Command']
          answer: 0
        - id: java-pat-ex2
          type: mcq
          prompt: En Java moderne, comment implémente-t-on souvent une Strategy simple ?
          choices: ['Avec une lambda implémentant une interface fonctionnelle', 'Avec un Singleton', 'Avec l’héritage multiple', 'Avec la réflexion']
          answer: 0
        - id: java-pat-ex3
          type: mcq
          prompt: Quelle est la façon la plus sûre d’écrire un Singleton en Java ?
          choices: ['Un enum à une seule valeur', 'Un attribut public static non final', 'Un constructeur public', 'Une variable globale']
          answer: 0

  # ------------------------------------------------------------------
  - slug: java-solid
    title: SOLID
    summary: Les cinq principes SOLID illustrés en Java — responsabilité unique, ouvert/fermé, Liskov, ségrégation des interfaces, inversion des dépendances.
    minutes: 35
    concepts: [patterns, architecture]
    sections:
      - title: Les cinq principes
        body: |
          | Lettre | Principe | En pratique |
          |---|---|---|
          | **S** | Responsabilité unique | une classe = une raison de changer (calcul ≠ affichage ≠ persistance) |
          | **O** | Ouvert/fermé | ajouter un comportement par une **nouvelle classe**, sans modifier l’existant |
          | **L** | Substitution de Liskov | une sous-classe doit pouvoir remplacer sa mère sans surprise |
          | **I** | Ségrégation des interfaces | plusieurs petites interfaces plutôt qu’une énorme |
          | **D** | Inversion des dépendances | dépendre d’abstractions injectées, pas d’implémentations concrètes |
      - title: Exemples
        body: |
          **O** — plutôt qu’un `switch` sur le type à modifier à chaque nouvelle forme :

          ```java
          sealed interface Forme permits Cercle, Carre { double aire(); }
          record Cercle(double r) implements Forme { public double aire() { return Math.PI * r * r; } }
          ```

          **L** — l’exemple classique : `Carre extends Rectangle` viole Liskov si `setLargeur` modifie aussi la hauteur. Un code qui attend un `Rectangle` (« largeur × hauteur après avoir changé la largeur ») sera surpris.

          **D** :

          ```java
          class Rapport {
              private final Sortie sortie;                 // abstraction
              Rapport(Sortie sortie) { this.sortie = sortie; }   // injectée
          }
          ```

          SOLID est un guide, pas un dogme : l’objectif est un code **facile à faire évoluer et à tester**.
    exercises:
      - id: java-solid-q1
        type: mcq
        prompt: Une classe Facture calcule le total, génère un PDF et l’envoie par e-mail. Quel principe est violé ?
        choices: ['Responsabilité unique (S)', 'Liskov (L)', 'Ségrégation des interfaces (I)', 'Aucun']
        answer: 0
      - id: java-solid-q2
        type: mcq
        prompt: Une interface Imprimante impose scanner() et faxer() à une imprimante basique qui lève UnsupportedOperationException. Quel principe est violé ?
        choices: ['Ségrégation des interfaces (I)', 'Responsabilité unique (S)', 'Ouvert/fermé (O)', 'Inversion des dépendances (D)']
        answer: 0
      - id: java-solid-bug
        type: bugfix
        prompt: Ce code viole le principe de Liskov et affiche un résultat surprenant. Quelle ligne est la cause ?
        code: |
          public class Main {
              static class Rectangle {
                  protected int l, h;
                  void setLargeur(int x) { l = x; }
                  void setHauteur(int x) { h = x; }
                  int aire() { return l * h; }
              }
              static class Carre extends Rectangle {
                  @Override void setLargeur(int x) { l = x; h = x; }
                  @Override void setHauteur(int x) { l = x; h = x; }
              }
              static int test(Rectangle r) { r.setHauteur(4); r.setLargeur(5); return r.aire(); }
              public static void main(String[] args) {
                  System.out.println(test(new Rectangle()) + " " + test(new Carre()));
              }
          }
        bugLines: [8]
        choices:
          - Carre ne doit pas hériter de Rectangle (comportement incompatible) ; mieux vaut deux implémentations d’une interface Forme
          - aire() doit être static
          - setLargeur doit être private
        answer: 0
        solution: |
          public class Main {
              interface Forme { int aire(); }
              static class Rectangle implements Forme {
                  protected int l, h;
                  void setLargeur(int x) { l = x; }
                  void setHauteur(int x) { h = x; }
                  public int aire() { return l * h; }
              }
              record Carre(int cote) implements Forme { public int aire() { return cote * cote; } }
              static int test(Rectangle r) { r.setHauteur(4); r.setLargeur(5); return r.aire(); }
              public static void main(String[] args) {
                  System.out.println(test(new Rectangle()) + " " + new Carre(4).aire());
              }
          }
        tests:
          - { input: '', output: 20 16 }
      - id: java-solid-code
        type: code
        title: Calcul de primes ouvert/fermé
        prompt: |
          Refactorise un calcul de prime selon **O** et **D** : interface `RegleDePrime { boolean s’applique(Employe e); double montant(Employe e); }`, des règles indépendantes, et un `CalculateurPrime` qui reçoit la **liste des règles** par constructeur et additionne les montants des règles applicables.

          Règles : `anciennete` (≥ 5 ans → 500), `objectifs` (ventes ≥ 100 000 → 1 % des ventes), `manager` (rôle manager → 1000). Chaque ligne : `nom role annees ventes`. Affiche `nom : prime` (2 décimales, Locale.US).
        starter: |
          import java.util.*;

          public class Main {
              record Employe(String nom, String role, int annees, double ventes) {}

              public static void main(String[] args) {
                  Scanner sc = new Scanner(System.in);
              }
          }
        solution: |
          import java.util.*;

          public class Main {
              record Employe(String nom, String role, int annees, double ventes) {}
              interface RegleDePrime { boolean sApplique(Employe e); double montant(Employe e); }
              static class Anciennete implements RegleDePrime {
                  public boolean sApplique(Employe e) { return e.annees() >= 5; }
                  public double montant(Employe e) { return 500; }
              }
              static class Objectifs implements RegleDePrime {
                  public boolean sApplique(Employe e) { return e.ventes() >= 100_000; }
                  public double montant(Employe e) { return e.ventes() * 0.01; }
              }
              static class Manager implements RegleDePrime {
                  public boolean sApplique(Employe e) { return e.role().equals("manager"); }
                  public double montant(Employe e) { return 1000; }
              }
              static class CalculateurPrime {
                  private final List<RegleDePrime> regles;
                  CalculateurPrime(List<RegleDePrime> regles) { this.regles = regles; }
                  double calculer(Employe e) { return regles.stream().filter(r -> r.sApplique(e)).mapToDouble(r -> r.montant(e)).sum(); }
              }

              public static void main(String[] args) {
                  Scanner sc = new Scanner(System.in);
                  CalculateurPrime calc = new CalculateurPrime(List.of(new Anciennete(), new Objectifs(), new Manager()));
                  while (sc.hasNext()) {
                      Employe e = new Employe(sc.next(), sc.next(), sc.nextInt(), sc.nextDouble());
                      System.out.println(String.format(Locale.US, "%s : %.2f", e.nom(), calc.calculer(e)));
                  }
              }
          }
        tests:
          - { input: "ada manager 6 150000\nbob vendeur 2 120000\nzoe vendeur 1 5000", output: "ada : 3000.00\nbob : 1200.00\nzoe : 0.00" }
          - { input: kiri manager 5 0, output: 'kiri : 1500.00', hidden: true }
        require:
          - { pattern: 'interface\s+RegleDePrime', message: Définir l’interface RegleDePrime }
        forbid:
          - { pattern: 'switch', message: 'Pas de switch : chaque règle est une classe' }
    project:
      id: java-solid-projet
      type: code
      title: Générateur de rapports découplé
      difficulty: 3
      prompt: |
        Sépare les responsabilités d’un générateur de rapports :

        - `SourceDonnees` (abstraction) → `SourceTexte` qui lit les lignes `categorie montant` de l’entrée (après la première ligne) ;
        - `Agregateur` → totaux par catégorie triés ;
        - `Formateur` (abstraction) → `FormateurTexte` (`categorie : total`, puis `TOTAL : t`), `FormateurCsv` (`categorie;total` avec l’en-tête `categorie;total`) et `FormateurJson` (`{"categorie":total,…}` sur une ligne) ;
        - `Rapport` qui reçoit source, agrégateur et formateur par constructeur.

        La première ligne indique le format (`texte`, `csv`, `json`). Montants entiers.
      starter: |
        import java.util.*;

        public class Main {
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
            }
        }
      solution: |
        import java.util.*;

        public class Main {
            interface SourceDonnees { List<String[]> lignes(); }
            interface Formateur { String formater(SortedMap<String, Long> totaux); }

            static class SourceTexte implements SourceDonnees {
                private final Scanner sc;
                SourceTexte(Scanner sc) { this.sc = sc; }
                public List<String[]> lignes() {
                    List<String[]> l = new ArrayList<>();
                    while (sc.hasNextLine()) { String s = sc.nextLine().trim(); if (!s.isEmpty()) l.add(s.split("\\s+")); }
                    return l;
                }
            }
            static class Agregateur {
                SortedMap<String, Long> agreger(List<String[]> lignes) {
                    SortedMap<String, Long> m = new TreeMap<>();
                    for (String[] l : lignes) m.merge(l[0], Long.parseLong(l[1]), Long::sum);
                    return m;
                }
            }
            static class FormateurTexte implements Formateur {
                public String formater(SortedMap<String, Long> t) {
                    StringBuilder sb = new StringBuilder();
                    t.forEach((k, v) -> sb.append(k).append(" : ").append(v).append('\n'));
                    return sb.append("TOTAL : ").append(t.values().stream().mapToLong(Long::longValue).sum()).toString();
                }
            }
            static class FormateurCsv implements Formateur {
                public String formater(SortedMap<String, Long> t) {
                    StringJoiner j = new StringJoiner("\n");
                    j.add("categorie;total");
                    t.forEach((k, v) -> j.add(k + ";" + v));
                    return j.toString();
                }
            }
            static class FormateurJson implements Formateur {
                public String formater(SortedMap<String, Long> t) {
                    StringJoiner j = new StringJoiner(",", "{", "}");
                    t.forEach((k, v) -> j.add("\"" + k + "\":" + v));
                    return j.toString();
                }
            }
            static class Rapport {
                private final SourceDonnees source;
                private final Agregateur agregateur;
                private final Formateur formateur;
                Rapport(SourceDonnees s, Agregateur a, Formateur f) { source = s; agregateur = a; formateur = f; }
                String produire() { return formateur.formater(agregateur.agreger(source.lignes())); }
            }

            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
                String format = sc.nextLine().trim();
                Formateur f = switch (format) { case "csv" -> new FormateurCsv(); case "json" -> new FormateurJson(); default -> new FormateurTexte(); };
                System.out.println(new Rapport(new SourceTexte(sc), new Agregateur(), f).produire());
            }
        }
      tests:
        - { input: "texte\nloyer 800\ncourses 120\ncourses 80", output: "courses : 200\nloyer : 800\nTOTAL : 1000" }
        - { input: "json\nb 2\na 1\nb 3", output: '{"a":1,"b":5}' }
        - { input: "csv\nx 5", output: "categorie;total\nx;5", hidden: true }
