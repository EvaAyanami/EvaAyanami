        prompt: Qu’est-ce que le problème N+1 ?
        choices: ['Une requête pour la liste puis une requête par élément pour ses relations', 'Une erreur de clé primaire', 'Un dépassement d’entier', 'Une jointure en trop']
        answer: 0
