        type: mcq
        prompt: Quelle doublure vérifie qu’une méthode a bien été appelée avec certains arguments ?
        choices: ['Un mock', 'Un stub', 'Un fake', 'Un dummy']
        answer: 0
      - id: java-tauto-q2
        type: mcq
        prompt: Quel outil lance une vraie base PostgreSQL jetable pour les tests d’intégration ?
        choices: ['Testcontainers', 'Mockito', 'JaCoCo', 'Lombok']
        answer: 0
      - id: java-tauto-order
        type: order
        prompt: Remets dans l’ordre le cycle du TDD.
        lines:
          - Écrire un test qui échoue (rouge)
          - Écrire le code minimal pour le faire passer (vert)
