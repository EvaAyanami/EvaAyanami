      - id: java-hib-code
        type: code
        title: Générateur de SQL d’entité
        prompt: |
          Recrée le cœur d’un ORM : annotations `@Table(String nom)`, `@Id` et `@Colonne(String nom)` (RUNTIME). Écris `static String insert(Object o)` qui génère `INSERT INTO table (col1, col2) VALUES (v1, v2)` (sans la colonne `@Id`, chaînes entre apostrophes avec `'` doublé, colonnes dans l’ordre alphabétique des **noms de colonnes**), et `static String select(Class<?> c, Object id)` → `SELECT id, col1, col2 FROM table WHERE id = v` (colonne @Id en premier).

          Applique-les à la classe `Eleve` (à annoter : table `eleves`, `id` → `@Id`, `nom` → colonne `nom_complet`, `niveau` → `niveau`, `email` → `email`) avec les données lues : `id nom niveau email`.
        starter: |
          import java.lang.annotation.*;
          import java.lang.reflect.*;
          import java.util.*;

          public class Main {
              static class Eleve {
                  long id; String nom; int niveau; String email;
                  Eleve(long id, String nom, int niveau, String email) { this.id = id; this.nom = nom; this.niveau = niveau; this.email = email; }
              }

              public static void main(String[] args) throws Exception {
                  Scanner sc = new Scanner(System.in);
                  Eleve e = new Eleve(sc.nextLong(), sc.next(), sc.nextInt(), sc.next());
              }
          }
        solution: |
          import java.lang.annotation.*;
          import java.lang.reflect.*;
          import java.util.*;

          @Retention(RetentionPolicy.RUNTIME) @Target(ElementType.TYPE) @interface Table { String value(); }
          @Retention(RetentionPolicy.RUNTIME) @Target(ElementType.FIELD) @interface Id {}
          @Retention(RetentionPolicy.RUNTIME) @Target(ElementType.FIELD) @interface Colonne { String value(); }

          public class Main {
              @Table("eleves")
              static class Eleve {
                  @Id long id;
                  @Colonne("nom_complet") String nom;
                  @Colonne("niveau") int niveau;
                  @Colonne("email") String email;
                  Eleve(long id, String nom, int niveau, String email) { this.id = id; this.nom = nom; this.niveau = niveau; this.email = email; }
              }

              static String sql(Object v) { return v instanceof String s ? "'" + s.replace("'", "''") + "'" : String.valueOf(v); }

              static TreeMap<String, Field> colonnes(Class<?> c) {
                  TreeMap<String, Field> m = new TreeMap<>();
                  for (Field f : c.getDeclaredFields()) {
                      Colonne col = f.getAnnotation(Colonne.class);
                      if (col != null) { f.setAccessible(true); m.put(col.value(), f); }
                  }
                  return m;
              }
              static Field champId(Class<?> c) {
                  for (Field f : c.getDeclaredFields()) if (f.isAnnotationPresent(Id.class)) { f.setAccessible(true); return f; }
                  throw new IllegalStateException("pas d’@Id");
              }
              static String insert(Object o) throws IllegalAccessException {
                  Class<?> c = o.getClass();
                  StringJoiner cols = new StringJoiner(", "), vals = new StringJoiner(", ");
                  for (var e : colonnes(c).entrySet()) { cols.add(e.getKey()); vals.add(sql(e.getValue().get(o))); }
                  return "INSERT INTO " + c.getAnnotation(Table.class).value() + " (" + cols + ") VALUES (" + vals + ")";
              }
              static String select(Class<?> c, Object id) {
                  String nomId = champId(c).getName();
                  StringJoiner cols = new StringJoiner(", ");
                  cols.add(nomId);
                  colonnes(c).keySet().forEach(cols::add);
                  return "SELECT " + cols + " FROM " + c.getAnnotation(Table.class).value() + " WHERE " + nomId + " = " + sql(id);
              }

              public static void main(String[] args) throws Exception {
                  Scanner sc = new Scanner(System.in);
                  Eleve e = new Eleve(sc.nextLong(), sc.next(), sc.nextInt(), sc.next());
                  System.out.println(insert(e));
                  System.out.println(select(Eleve.class, e.id));
              }
          }
        tests:
          - { input: 7 Ada 3 ada@ex.fr, output: "INSERT INTO eleves (email, niveau, nom_complet) VALUES ('ada@ex.fr', 3, 'Ada')\nSELECT id, email, niveau, nom_complet FROM eleves WHERE id = 7" }
          - { input: 1 O'Neil 5 o@x.fr, output: "INSERT INTO eleves (email, niveau, nom_complet) VALUES ('o@x.fr', 5, 'O''Neil')\nSELECT id, email, niveau, nom_complet FROM eleves WHERE id = 1", hidden: true }
        require:
          - { pattern: '@interface\s+Colonne', message: Définir l’annotation @Colonne }
    project:
      id: java-hib-projet
      type: code
      title: Détecteur de N+1
      difficulty: 3
      prompt: |
        Simule un contexte de persistance avec chargement paresseux. Données : `cours ID TITRE` et `chapitre ID COURS_ID TITRE`. Puis un mode : `mode lazy` ou `mode fetch`, et la commande `lister` qui affiche chaque cours (`TITRE : n chapitres`, trié par id).

        Compte les « requêtes SQL » : en mode `lazy`, 1 requête pour les cours + 1 par cours pour ses chapitres (au premier accès, mis en cache dans le contexte) ; en mode `fetch`, 1 seule requête (jointure). Après chaque `lister`, affiche `requêtes : N` et, en mode lazy avec plus d’un cours, `⚠ N+1 détecté`. Le contexte (cache) est vidé à chaque changement de mode.
      starter: |
        import java.util.*;

        public class Main {
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
            }
        }
      solution: |
        import java.util.*;

        public class Main {
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
                TreeMap<Integer, String> cours = new TreeMap<>();
                Map<Integer, List<String>> chapitres = new HashMap<>();
                String mode = "lazy";
                Map<Integer, List<String>> cache = new HashMap<>();
                while (sc.hasNext()) {
                    switch (sc.next()) {
                        case "cours" -> cours.put(sc.nextInt(), sc.next());
                        case "chapitre" -> { sc.nextInt(); chapitres.computeIfAbsent(sc.nextInt(), k -> new ArrayList<>()).add(sc.next()); }
                        case "mode" -> { mode = sc.next(); cache.clear(); }
                        default -> {
                            int requetes = 1;
                            for (var e : cours.entrySet()) {
                                List<String> ch;
                                if (mode.equals("fetch")) ch = chapitres.getOrDefault(e.getKey(), List.of());
                                else {
                                    if (!cache.containsKey(e.getKey())) { requetes++; cache.put(e.getKey(), chapitres.getOrDefault(e.getKey(), List.of())); }
                                    ch = cache.get(e.getKey());
                                }
                                System.out.println(e.getValue() + " : " + ch.size() + " chapitres");
                            }
                            System.out.println("requêtes : " + requetes);
                            if (mode.equals("lazy") && cours.size() > 1 && requetes > 1) System.out.println("⚠ N+1 détecté");
                        }
                    }
                }
            }
        }
      tests:
        - { input: "cours 1 Rust\ncours 2 Java\ncours 3 Cpp\nchapitre 10 1 intro\nchapitre 11 1 ownership\nchapitre 12 2 jvm\nmode lazy\nlister\nlister\nmode fetch\nlister", output: "Rust : 2 chapitres\nJava : 1 chapitres\nCpp : 0 chapitres\nrequêtes : 4\n⚠ N+1 détecté\nRust : 2 chapitres\nJava : 1 chapitres\nCpp : 0 chapitres\nrequêtes : 1\nRust : 2 chapitres\nJava : 1 chapitres\nCpp : 0 chapitres\nrequêtes : 1" }
        - { input: "cours 1 A\nmode lazy\nlister", output: "A : 0 chapitres\nrequêtes : 2", hidden: true }
