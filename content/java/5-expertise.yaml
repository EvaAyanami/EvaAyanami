          type: mcq
          prompt: À quoi sert le sel dans le hachage d’un mot de passe ?
          choices: ['Rendre unique le haché de mots de passe identiques et contrer les tables précalculées', 'Accélérer le hachage', 'Chiffrer le mot de passe de façon réversible', 'Compresser le haché']
