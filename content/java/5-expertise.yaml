  # ------------------------------------------------------------------
  - slug: java-api-rest
    title: API REST
    summary: Concevoir une API REST — ressources, verbes HTTP, codes de statut, JSON, validation, pagination et versionnement.
    minutes: 35
    concepts: [reseau, framework]
    sections:
      - title: Principes REST
        body: |
          | Verbe | URL | Action | Statut succès |
          |---|---|---|---|
          | GET | `/api/cours` | lister | 200 |
          | GET | `/api/cours/42` | lire | 200 (404 si absent) |
          | POST | `/api/cours` | créer | 201 + en-tête `Location` |
          | PUT | `/api/cours/42` | remplacer | 200 / 204 |
          | PATCH | `/api/cours/42` | modifier partiellement | 200 |
          | DELETE | `/api/cours/42` | supprimer | 204 |

          Codes d’erreur : **400** requête invalide, **401** non authentifié, **403** interdit, **404** introuvable, **409** conflit, **422** validation, **500** erreur serveur.

          GET, PUT et DELETE sont **idempotents** : les répéter ne change pas le résultat.
      - title: Avec Spring
        body: |
          ```java
          @RestController
          @RequestMapping("/api/v1/cours")
          class CoursController {
              @GetMapping("/{id}")
              ResponseEntity<CoursDto> lire(@PathVariable long id) {
                  return service.parId(id).map(ResponseEntity::ok).orElse(ResponseEntity.notFound().build());
              }
              @PostMapping
              ResponseEntity<CoursDto> creer(@Valid @RequestBody NouveauCours req) {
                  CoursDto c = service.creer(req);
                  return ResponseEntity.created(URI.create("/api/v1/cours/" + c.id())).body(c);
              }
              @GetMapping
              Page<CoursDto> liste(@RequestParam(defaultValue = "0") int page) { … }
          }
          ```

          Bonnes pratiques : des **DTO** distincts des entités, des erreurs au format standard (RFC 9457 *Problem Details*), la pagination, le versionnement (`/v1`), une documentation OpenAPI (springdoc).
