  # ------------------------------------------------------------------
  - slug: java-securite
    title: Sécurité
    summary: Sécuriser une application Java — mots de passe hachés, authentification, autorisation, injections, XSS, CSRF, secrets et dépendances.
    minutes: 40
    concepts: [securite]
    sections:
      - title: Authentification et mots de passe
        body: |
          - Ne **jamais** stocker un mot de passe en clair ni avec un simple SHA-256 : utiliser un algorithme lent et salé — **Argon2**, **bcrypt** ou **PBKDF2** (`BCryptPasswordEncoder`, `Argon2PasswordEncoder` de Spring Security).
          - Comparer les secrets en **temps constant** (`MessageDigest.isEqual`) pour éviter les attaques temporelles.
          - Sessions : cookies `HttpOnly`, `Secure`, `SameSite`. JWT : signature vérifiée, durée courte, pas de données sensibles dedans.
          - Générer les jetons avec `SecureRandom`, jamais `Random`.

          ```java
          @Bean SecurityFilterChain securite(HttpSecurity http) throws Exception {
              return http.authorizeHttpRequests(a -> a
                      .requestMatchers("/api/public/**").permitAll()
                      .requestMatchers("/api/admin/**").hasRole("ADMIN")
                      .anyRequest().authenticated())
                  .formLogin(Customizer.withDefaults())
                  .build();
          }
          ```
      - title: OWASP Top 10 en Java
        body: |
          | Risque | Protection |
          |---|---|
          | Injection SQL | `PreparedStatement`, JPA avec paramètres |
          | XSS | échapper les sorties HTML (Thymeleaf le fait par défaut), CSP |
          | CSRF | jeton CSRF (activé par défaut dans Spring Security) |
          | Contrôle d’accès défaillant | vérifier **côté serveur** que l’utilisateur possède la ressource |
          | Désérialisation non sûre | éviter `ObjectInputStream` sur des données externes |
          | Dépendances vulnérables | OWASP Dependency-Check, Dependabot |
          | Secrets dans le code | variables d’environnement, coffre-fort (Vault) |

          Principe du **moindre privilège** et **défense en profondeur** : plusieurs couches de protection indépendantes.
