  - slug: java-tests-automatises
    title: Tests automatisés
    summary: Stratégie de test — pyramide, tests unitaires, doublures (mocks, stubs, fakes), tests d’intégration, Testcontainers, TDD et CI.
    minutes: 35
    concepts: [tests]
    sections:
      - title: La pyramide des tests
        body: |
          - **Base** : beaucoup de tests **unitaires** rapides (JUnit 5, AssertJ) ;
          - **Milieu** : tests d’**intégration** (base réelle avec **Testcontainers**, `@SpringBootTest`, `@DataJpaTest`, `MockMvc`) ;
          - **Sommet** : quelques tests **de bout en bout** (Playwright, Selenium).

          **Doublures de test** :

          | Type | Rôle |
          |---|---|
          | Stub | renvoie des réponses préprogrammées |
          | Mock | vérifie les interactions (`verify(mailer).envoyer(...)`) |
          | Fake | implémentation simplifiée fonctionnelle (dépôt en mémoire) |
          | Spy | enveloppe un vrai objet en enregistrant les appels |

          ```java
          DepotEleves depot = mock(DepotEleves.class);
          when(depot.parId(1L)).thenReturn(Optional.of(new Eleve(1L, "Ada")));
          service.inscrire(1L, "rust");
          verify(notifieur).notifier(eq("Ada"), contains("rust"));
          ```
      - title: TDD et intégration continue
        body: |
          **TDD** (*Test-Driven Development*) : **Rouge** (écrire un test qui échoue) → **Vert** (le code minimal qui passe) → **Refactoriser**.

          Un bon test est **FIRST** : *Fast, Independent, Repeatable, Self-validating, Timely*.

          En **CI** (GitHub Actions, GitLab CI) : chaque push lance `mvn verify`, avec rapport de couverture (JaCoCo) et analyse statique (SpotBugs, SonarQube). Les tests de mutation (PIT) mesurent la **qualité** des tests : si on modifie le code et qu’aucun test n’échoue, les tests sont trop faibles.
    exercises:
