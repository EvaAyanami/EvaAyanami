      - id: java-sec-code
        type: code
        title: Échappement HTML anti-XSS
        prompt: |
          Écris `static String echapper(String s)` qui remplace `&`, `<`, `>`, `"` et `'` par `&amp;`, `&lt;`, `&gt;`, `&quot;`, `&#39;`. Pour chaque ligne (un commentaire d’utilisateur), affiche `<p>` + commentaire échappé + `</p>`, puis, si le commentaire contenait `<script` (insensible à la casse), `⚠ tentative XSS bloquée`.
        starter: |
          import java.util.*;

          public class Main {
              public static void main(String[] args) {
                  Scanner sc = new Scanner(System.in);
                  while (sc.hasNextLine()) {
                      String c = sc.nextLine();
                  }
              }
          }
        solution: |
          import java.util.*;

          public class Main {
              static String echapper(String s) {
                  StringBuilder sb = new StringBuilder();
                  for (char c : s.toCharArray()) {
                      switch (c) {
                          case '&' -> sb.append("&amp;");
                          case '<' -> sb.append("&lt;");
                          case '>' -> sb.append("&gt;");
                          case '"' -> sb.append("&quot;");
                          case '\'' -> sb.append("&#39;");
                          default -> sb.append(c);
                      }
                  }
                  return sb.toString();
              }
              public static void main(String[] args) {
                  Scanner sc = new Scanner(System.in);
                  while (sc.hasNextLine()) {
                      String c = sc.nextLine();
                      System.out.println("<p>" + echapper(c) + "</p>");
                      if (c.toLowerCase().contains("<script")) System.out.println("⚠ tentative XSS bloquée");
                  }
              }
          }
        tests:
          - { input: "Super cours & merci !\n<SCRIPT>alert('x')</script>", output: "<p>Super cours &amp; merci !</p>\n<p>&lt;SCRIPT&gt;alert(&#39;x&#39;)&lt;/script&gt;</p>\n⚠ tentative XSS bloquée" }
          - { input: a "b" <i>, output: '<p>a &quot;b&quot; &lt;i&gt;</p>', hidden: true }
    project:
      id: java-sec-projet
      type: code
      title: Authentification sécurisée
      difficulty: 3
      prompt: |
        Implémente un service d’authentification :

        - mots de passe hachés avec **PBKDF2** (`SecretKeyFactory.getInstance("PBKDF2WithHmacSHA256")`, 10 000 itérations, 256 bits) et un **sel aléatoire** de 16 octets (`SecureRandom`) par utilisateur ;
        - comparaison en temps constant (`MessageDigest.isEqual`) ;
        - politique : mot de passe ≥ 8 caractères avec au moins un chiffre, sinon `refusé : mot de passe trop faible` ;
        - verrouillage après **3 échecs consécutifs** (`compte verrouillé`), un succès remet le compteur à zéro.

        Commandes : `inscrire NOM MDP` (`inscrit` / `refusé : nom déjà pris` / politique), `connexion NOM MDP` (`bienvenue NOM`, `identifiants invalides` — aussi pour un nom inconnu — ou `compte verrouillé`). Enfin affiche `hachés distincts : true/false` : vrai si deux utilisateurs inscrits avec le même mot de passe ont des hachés différents (grâce au sel), ou s’il n’y a pas de tel couple.
      starter: |
        import java.security.*;
        import java.security.spec.*;
        import java.util.*;
        import javax.crypto.*;
        import javax.crypto.spec.*;

        public class Main {
            public static void main(String[] args) throws Exception {
                Scanner sc = new Scanner(System.in);
            }
        }
      solution: |
        import java.security.*;
        import java.security.spec.*;
        import java.util.*;
        import javax.crypto.*;
        import javax.crypto.spec.*;

        public class Main {
            static class Compte { byte[] sel, hache; String mdpTest; int echecs; }
            static final SecureRandom ALEA = new SecureRandom();

            static byte[] hacher(String mdp, byte[] sel) throws GeneralSecurityException {
                PBEKeySpec spec = new PBEKeySpec(mdp.toCharArray(), sel, 10_000, 256);
                return SecretKeyFactory.getInstance("PBKDF2WithHmacSHA256").generateSecret(spec).getEncoded();
            }

            public static void main(String[] args) throws Exception {
                Scanner sc = new Scanner(System.in);
                Map<String, Compte> comptes = new LinkedHashMap<>();
                Map<String, List<byte[]>> parMdp = new HashMap<>();
                while (sc.hasNext()) {
                    String cmd = sc.next(), nom = sc.next(), mdp = sc.next();
                    if (cmd.equals("inscrire")) {
                        if (comptes.containsKey(nom)) { System.out.println("refusé : nom déjà pris"); continue; }
                        if (mdp.length() < 8 || !mdp.matches(".*\\d.*")) { System.out.println("refusé : mot de passe trop faible"); continue; }
                        Compte c = new Compte();
                        c.sel = new byte[16];
                        ALEA.nextBytes(c.sel);
                        c.hache = hacher(mdp, c.sel);
                        comptes.put(nom, c);
                        parMdp.computeIfAbsent(mdp, k -> new ArrayList<>()).add(c.hache);
                        System.out.println("inscrit");
                    } else {
                        Compte c = comptes.get(nom);
                        if (c == null) { System.out.println("identifiants invalides"); continue; }
                        if (c.echecs >= 3) { System.out.println("compte verrouillé"); continue; }
                        if (MessageDigest.isEqual(c.hache, hacher(mdp, c.sel))) { c.echecs = 0; System.out.println("bienvenue " + nom); }
                        else {
                            c.echecs++;
                            System.out.println(c.echecs >= 3 ? "compte verrouillé" : "identifiants invalides");
                        }
                    }
                }
                boolean distincts = true;
                for (List<byte[]> l : parMdp.values())
                    for (int i = 0; i < l.size(); i++)
                        for (int j = i + 1; j < l.size(); j++) if (Arrays.equals(l.get(i), l.get(j))) distincts = false;
                System.out.println("hachés distincts : " + distincts);
            }
        }
      tests:
        - { input: "inscrire ada secret\ninscrire ada motdepasse1\ninscrire bob motdepasse1\ninscrire ada x1234567\nconnexion ada motdepasse1\nconnexion ada faux\nconnexion ada faux\nconnexion ada motdepasse1\nconnexion bob faux\nconnexion bob faux\nconnexion bob faux\nconnexion bob motdepasse1\nconnexion zoe abc", output: "refusé : mot de passe trop faible\ninscrit\ninscrit\nrefusé : nom déjà pris\nbienvenue ada\nidentifiants invalides\nidentifiants invalides\nbienvenue ada\nidentifiants invalides\nidentifiants invalides\ncompte verrouillé\ncompte verrouillé\nidentifiants invalides\nhachés distincts : true" }
        - { input: connexion x y, output: "identifiants invalides\nhachés distincts : true", hidden: true }
      require:
        - { pattern: 'SecureRandom', message: Utiliser SecureRandom pour le sel }
        - { pattern: 'MessageDigest\.isEqual', message: Comparer en temps constant }
