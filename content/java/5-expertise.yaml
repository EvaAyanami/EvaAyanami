  # ------------------------------------------------------------------
  - slug: java-microservices
    title: Microservices
    summary: Découper un système en services — frontières, communication synchrone et asynchrone, résilience, observabilité et compromis.
    minutes: 35
    concepts: [architecture, reseau]
    sections:
      - title: Monolithe ou microservices ?
        body: |
          | | Monolithe modulaire | Microservices |
          |---|---|---|
          | Déploiement | un seul artefact | un par service |
          | Équipe | une équipe | plusieurs équipes autonomes |
          | Complexité | faible | réseau, données distribuées, observabilité |
          | Montée en charge | globale | par service |

          Commencer par un **monolithe bien modulaire** est souvent le meilleur choix ; on extrait un service quand une frontière claire (un *bounded context* du DDD) et un besoin réel apparaissent. Chaque service possède **sa propre base de données**.
      - title: Communication et résilience
        body: |
          - **Synchrone** : HTTP/REST, gRPC — simple mais couple les disponibilités.
          - **Asynchrone** : messages et événements (Kafka, RabbitMQ) — découplage, cohérence **à terme**.

          Patrons de résilience (Resilience4j) :

          - **timeout** sur chaque appel réseau ;
          - **retry** avec backoff exponentiel (pour les opérations idempotentes) ;
          - **circuit breaker** : après trop d’échecs, on « ouvre » le circuit et on échoue immédiatement pendant un temps, puis on teste à nouveau (« demi-ouvert ») ;
          - **bulkhead** : isoler les ressources ;
          - **saga** pour les transactions distribuées (actions compensatoires).

          Observabilité : logs structurés avec identifiant de corrélation, métriques (Micrometer/Prometheus), traces distribuées (OpenTelemetry).
    exercises:
      - id: java-micro-q1
        type: mcq
        prompt: Pourquoi chaque microservice doit-il avoir sa propre base de données ?
        choices: ['Pour rester autonome et ne pas coupler les services par le schéma', 'Pour la sauvegarde', 'Parce que PostgreSQL l’impose', 'Ce n’est pas recommandé']
        answer: 0
      - id: java-micro-q2
        type: mcq
        prompt: Que fait un circuit breaker ouvert ?
        choices: ['Il fait échouer immédiatement les appels pendant un délai', 'Il relance indéfiniment', 'Il coupe le serveur', 'Il chiffre les messages']
        answer: 0
      - id: java-micro-code
        type: code
        title: Circuit breaker
        prompt: |
          Implémente un circuit breaker à temps simulé : états `FERME`, `OUVERT`, `DEMI_OUVERT`. Seuil : 3 échecs consécutifs → `OUVERT` pendant 10 unités de temps. Après ce délai, l’appel suivant passe en `DEMI_OUVERT` : un succès referme le circuit, un échec le rouvre (nouveau délai de 10).

          Chaque ligne : `t resultat` (temps croissant, `ok` ou `ko` = ce que renverrait le service). Affiche pour chaque appel `t : appel ok|appel ko|rejeté` puis ` [ETAT]` (état après l’appel). Un appel rejeté n’atteint pas le service.
        starter: |
          import java.util.*;

          public class Main {
              public static void main(String[] args) {
                  Scanner sc = new Scanner(System.in);
              }
          }
        solution: |
          import java.util.*;

          public class Main {
              enum Etat { FERME, OUVERT, DEMI_OUVERT }
              public static void main(String[] args) {
                  Scanner sc = new Scanner(System.in);
                  Etat etat = Etat.FERME;
                  int echecs = 0;
                  long ouvertA = 0;
                  while (sc.hasNext()) {
                      long t = sc.nextLong();
                      boolean ok = sc.next().equals("ok");
                      if (etat == Etat.OUVERT) {
                          if (t - ouvertA < 10) { System.out.println(t + " : rejeté [" + etat + "]"); continue; }
                          etat = Etat.DEMI_OUVERT;
                      }
                      if (ok) { echecs = 0; etat = Etat.FERME; }
                      else {
                          echecs++;
                          if (etat == Etat.DEMI_OUVERT || echecs >= 3) { etat = Etat.OUVERT; ouvertA = t; }
                      }
                      System.out.println(t + " : appel " + (ok ? "ok" : "ko") + " [" + etat + "]");
                  }
              }
          }
        tests:
          - { input: "1 ok\n2 ko\n3 ko\n4 ko\n5 ok\n13 ok\n14 ko\n20 ko\n24 ko\n30 ok", output: "1 : appel ok [FERME]\n2 : appel ko [FERME]\n3 : appel ko [FERME]\n4 : appel ko [OUVERT]\n5 : rejeté [OUVERT]\n13 : rejeté [OUVERT]\n14 : appel ko [OUVERT]\n20 : rejeté [OUVERT]\n24 : appel ko [OUVERT]\n30 : rejeté [OUVERT]" }
          - { input: "1 ko\n2 ko\n3 ko\n13 ok\n14 ko", output: "1 : appel ko [FERME]\n2 : appel ko [FERME]\n3 : appel ko [OUVERT]\n13 : appel ok [FERME]\n14 : appel ko [FERME]", hidden: true }
    project:
      id: java-micro-projet
      type: code
      title: Saga de commande
      difficulty: 3
      prompt: |
        Une commande traverse trois services : `stock` (réserver), `paiement` (débiter), `livraison` (planifier). Si une étape échoue, la **saga** exécute les actions compensatoires des étapes déjà réussies, **dans l’ordre inverse** (`libérer stock`, `rembourser`).

        Chaque ligne : `commande ID` puis trois résultats `ok`/`ko` (stock, paiement, livraison). Affiche les étapes au format `ID > réserver stock : ok`… puis `ID > compensation : rembourser`… puis `ID : CONFIRMÉE` ou `ID : ANNULÉE`. Termine par `confirmées : C, annulées : A`.
      starter: |
        import java.util.*;

        public class Main {
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
            }
        }
      solution: |
        import java.util.*;

        public class Main {
            record Etape(String action, String compensation) {}
            static final List<Etape> ETAPES = List.of(
                new Etape("réserver stock", "libérer stock"),
                new Etape("débiter paiement", "rembourser"),
                new Etape("planifier livraison", "annuler livraison"));

            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
                int conf = 0, ann = 0;
                while (sc.hasNext()) {
                    sc.next();
                    String id = sc.next();
                    String[] r = {sc.next(), sc.next(), sc.next()};
                    Deque<Etape> faites = new ArrayDeque<>();
                    boolean ok = true;
                    for (int i = 0; i < 3; i++) {
                        System.out.println(id + " > " + ETAPES.get(i).action() + " : " + r[i]);
                        if (r[i].equals("ok")) faites.push(ETAPES.get(i));
                        else { ok = false; break; }
                    }
                    if (!ok) while (!faites.isEmpty()) System.out.println(id + " > compensation : " + faites.pop().compensation());
                    System.out.println(id + " : " + (ok ? "CONFIRMÉE" : "ANNULÉE"));
                    if (ok) conf++; else ann++;
                }
                System.out.println("confirmées : " + conf + ", annulées : " + ann);
            }
        }
      tests:
        - { input: "commande A1 ok ok ok\ncommande B2 ok ok ko\ncommande C3 ko ok ok", output: "A1 > réserver stock : ok\nA1 > débiter paiement : ok\nA1 > planifier livraison : ok\nA1 : CONFIRMÉE\nB2 > réserver stock : ok\nB2 > débiter paiement : ok\nB2 > planifier livraison : ko\nB2 > compensation : rembourser\nB2 > compensation : libérer stock\nB2 : ANNULÉE\nC3 > réserver stock : ko\nC3 : ANNULÉE\nconfirmées : 1, annulées : 2" }
        - { input: commande Z ok ko ok, output: "Z > réserver stock : ok\nZ > débiter paiement : ko\nZ > compensation : libérer stock\nZ : ANNULÉE\nconfirmées : 0, annulées : 1", hidden: true }
