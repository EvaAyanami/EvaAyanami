  # ------------------------------------------------------------------
  - slug: java-deploiement
    title: Déploiement
    summary: Mettre une application Java en production — jar exécutable, Docker multi-étapes, configuration, santé, CI/CD et supervision.
    minutes: 35
    concepts: [deploiement]
    sections:
      - title: Empaqueter
        body: |
          Spring Boot produit un **fat jar** exécutable : `java -jar app.jar`. En conteneur, un Dockerfile **multi-étapes** :

          ```dockerfile
          FROM eclipse-temurin:21-jdk AS build
          WORKDIR /src
          COPY . .
          RUN ./mvnw -q package -DskipTests

          FROM eclipse-temurin:21-jre
          RUN useradd -r app
          USER app
          COPY --from=build /src/target/app.jar /app/app.jar
          EXPOSE 8080
          ENTRYPOINT ["java", "-XX:MaxRAMPercentage=75", "-jar", "/app/app.jar"]
          ```

          La JVM respecte les limites mémoire du conteneur ; `-XX:MaxRAMPercentage` règle la part utilisée par le tas. Alternatives : `jlink` (JRE réduit), GraalVM `native-image` (démarrage en millisecondes).
      - title: Exploiter
        body: |
          - **Configuration externe** : variables d’environnement (`SPRING_DATASOURCE_URL`), jamais de secret dans l’image ;
          - **Santé** : `/actuator/health` (sondes *liveness*/*readiness* pour Kubernetes) ;
          - **Arrêt gracieux** : `server.shutdown=graceful` (finir les requêtes en cours au SIGTERM) ;
          - **Migrations** de base au démarrage (Flyway) ;
          - **CI/CD** : build → tests → image → déploiement progressif (rolling, blue/green, canary) ;
          - **Supervision** : logs JSON, métriques Prometheus + Grafana, alertes ;
          - **Versionnement sémantique** et retour arrière rapide.

          C’est exactement ce que fait Codemori : `docker compose up -d --build` démarre la base, l’API, le service d’exécution et le reverse proxy HTTPS.
    exercises:
      - id: java-dep-q1
        type: mcq
        prompt: Pourquoi utiliser un Dockerfile multi-étapes ?
        choices: ['Pour que l’image finale ne contienne que le JRE et le jar, sans les outils de build', 'Pour compiler plus vite', 'Parce que Docker l’exige', 'Pour chiffrer l’image']
        answer: 0
      - id: java-dep-q2
        type: mcq
        prompt: Que doit faire une application au signal SIGTERM ?
        choices: ['S’arrêter proprement en terminant les requêtes en cours', 'Ignorer le signal', 'Redémarrer', 'Supprimer ses données']
        answer: 0
      - id: java-dep-q3
        type: mcq
        prompt: Quel type de déploiement redirige une petite partie du trafic vers la nouvelle version ?
        choices: ['Canary', 'Big bang', 'Cold start', 'Rollback']
        answer: 0
      - id: java-dep-code
        type: code
        title: Configuration par l’environnement
        prompt: |
          Spring Boot associe les variables d’environnement aux propriétés : `SPRING_DATASOURCE_URL` → `spring.datasource.url` (minuscules, `_` → `.`). Les variables d’environnement **priment** sur le fichier de configuration.

          Entrée : des lignes `fichier cle=valeur` et `env NOM=valeur`, puis `? cle` pour chaque propriété demandée. Affiche `cle = valeur (source)` avec la source `env` ou `fichier`, ou `cle = ? (manquante)`. Les propriétés dont la clé contient `password` ou `secret` sont affichées masquées : `******`.
        starter: |
          import java.util.*;

          public class Main {
              public static void main(String[] args) {
                  Scanner sc = new Scanner(System.in);
              }
          }
        solution: |
          import java.util.*;

          public class Main {
              public static void main(String[] args) {
                  Scanner sc = new Scanner(System.in);
                  Map<String, String> fichier = new HashMap<>(), env = new HashMap<>();
                  while (sc.hasNextLine()) {
                      String l = sc.nextLine().trim();
                      if (l.isEmpty()) continue;
                      if (l.startsWith("? ")) {
                          String cle = l.substring(2).trim();
                          String source = env.containsKey(cle) ? "env" : fichier.containsKey(cle) ? "fichier" : null;
                          if (source == null) { System.out.println(cle + " = ? (manquante)"); continue; }
                          String v = source.equals("env") ? env.get(cle) : fichier.get(cle);
                          if (cle.contains("password") || cle.contains("secret")) v = "******";
                          System.out.println(cle + " = " + v + " (" + source + ")");
                          continue;
                      }
                      String[] p = l.split(" ", 2);
                      int i = p[1].indexOf('=');
                      String k = p[1].substring(0, i), v = p[1].substring(i + 1);
                      if (p[0].equals("env")) env.put(k.toLowerCase().replace('_', '.'), v);
                      else fichier.put(k, v);
                  }
              }
          }
        tests:
          - { input: "fichier server.port=8080\nfichier spring.datasource.url=jdbc:h2:mem\nenv SPRING_DATASOURCE_URL=jdbc:postgresql://db/codemori\nenv SPRING_DATASOURCE_PASSWORD=s3cr3t\n? server.port\n? spring.datasource.url\n? spring.datasource.password\n? codemori.ai.url", output: "server.port = 8080 (fichier)\nspring.datasource.url = jdbc:postgresql://db/codemori (env)\nspring.datasource.password = ****** (env)\ncodemori.ai.url = ? (manquante)" }
          - { input: "env SERVER_PORT=9000\n? server.port", output: 'server.port = 9000 (env)', hidden: true }
    project:
      id: java-dep-projet
      type: code
      title: Déploiement progressif (rolling update)
      difficulty: 3
      prompt: |
        Simule un déploiement progressif sur `n` instances (toutes en version `v1`). On met à jour **une instance à la fois** vers la nouvelle version : l’instance passe `en mise à jour`, puis sa sonde de santé est consultée. Les résultats de sonde sont donnés dans l’ordre (`ok`/`ko`).

        Si une sonde échoue, on arrête et on fait un **retour arrière** : toutes les instances déjà mises à jour repassent en `v1` (dans l’ordre inverse). Affiche chaque étape (`instance i : v2 ok`, `instance i : v2 ko`, `retour arrière instance i`), puis l’état final `[v…, v…]` et `déploiement réussi` ou `déploiement annulé`.

        Entrée : `n nouvelle_version`, puis les résultats de sonde.
      starter: |
        import java.util.*;

        public class Main {
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
            }
        }
      solution: |
        import java.util.*;

        public class Main {
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
                int n = sc.nextInt();
                String nouvelle = sc.next();
                String[] versions = new String[n];
                Arrays.fill(versions, "v1");
                Deque<Integer> majs = new ArrayDeque<>();
                boolean ok = true;
                for (int i = 0; i < n; i++) {
                    String sonde = sc.hasNext() ? sc.next() : "ko";
                    versions[i] = nouvelle;
                    System.out.println("instance " + i + " : " + nouvelle + " " + sonde);
                    if (sonde.equals("ok")) majs.push(i);
                    else { majs.push(i); ok = false; break; }
                }
                if (!ok) while (!majs.isEmpty()) {
                    int i = majs.pop();
                    versions[i] = "v1";
                    System.out.println("retour arrière instance " + i);
                }
                System.out.println(Arrays.toString(versions));
                System.out.println(ok ? "déploiement réussi" : "déploiement annulé");
            }
        }
      tests:
        - { input: "3 v2\nok ok ok", output: "instance 0 : v2 ok\ninstance 1 : v2 ok\ninstance 2 : v2 ok\n[v2, v2, v2]\ndéploiement réussi" }
        - { input: "4 v3\nok ok ko ok", output: "instance 0 : v3 ok\ninstance 1 : v3 ok\ninstance 2 : v3 ko\nretour arrière instance 2\nretour arrière instance 1\nretour arrière instance 0\n[v1, v1, v1, v1]\ndéploiement annulé" }
        - { input: "1 v2\nko", output: "instance 0 : v2 ko\nretour arrière instance 0\n[v1]\ndéploiement annulé", hidden: true }
