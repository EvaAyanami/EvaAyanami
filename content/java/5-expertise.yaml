      - id: java-tauto-code
        type: code
        title: Mock fait main
        prompt: |
          Teste un `ServiceRappel` sans vrai serveur e-mail. Écris :

          - une interface `Mailer { boolean envoyer(String a, String sujet); }` ;
          - une classe `MailerMock implements Mailer` qui **enregistre** chaque appel (`a|sujet`) et renvoie une réponse programmée (`false` pour les adresses listées comme en échec) ;
          - `ServiceRappel.rappeler(List<String> eleves)` qui envoie `Rappel : révisions` à chaque élève dont l’adresse contient `@`, et renvoie le nombre d’envois réussis.

          Entrée : première ligne, les élèves ; deuxième ligne, les adresses en échec (ou `-`). Affiche les appels enregistrés, puis `réussis : N`, puis `vérification : OK` si le mock a reçu exactement un appel par adresse valide, sinon `vérification : ÉCHEC`.
        starter: |
          import java.util.*;

          public class Main {
              public static void main(String[] args) {
                  Scanner sc = new Scanner(System.in);
                  List<String> eleves = List.of(sc.nextLine().trim().split("\\s+"));
                  Set<String> echecs = new HashSet<>(List.of(sc.nextLine().trim().split("\\s+")));
              }
          }
        solution: |
          import java.util.*;

          interface Mailer { boolean envoyer(String a, String sujet); }

          class MailerMock implements Mailer {
              final List<String> appels = new ArrayList<>();
              private final Set<String> echecs;
              MailerMock(Set<String> echecs) { this.echecs = echecs; }
              public boolean envoyer(String a, String sujet) { appels.add(a + "|" + sujet); return !echecs.contains(a); }
          }

          class ServiceRappel {
              private final Mailer mailer;
              ServiceRappel(Mailer mailer) { this.mailer = mailer; }
              int rappeler(List<String> eleves) {
                  int ok = 0;
                  for (String e : eleves) if (e.contains("@") && mailer.envoyer(e, "Rappel : révisions")) ok++;
                  return ok;
              }
          }

          public class Main {
              public static void main(String[] args) {
                  Scanner sc = new Scanner(System.in);
                  List<String> eleves = List.of(sc.nextLine().trim().split("\\s+"));
                  Set<String> echecs = new HashSet<>(List.of(sc.nextLine().trim().split("\\s+")));
                  MailerMock mock = new MailerMock(echecs);
                  int ok = new ServiceRappel(mock).rappeler(eleves);
                  mock.appels.forEach(System.out::println);
                  System.out.println("réussis : " + ok);
                  long valides = eleves.stream().filter(e -> e.contains("@")).count();
                  System.out.println("vérification : " + (mock.appels.size() == valides ? "OK" : "ÉCHEC"));
              }
          }
        tests:
          - { input: "ada@ex.fr bob zoe@ex.fr kiri@ex.fr\nzoe@ex.fr", output: "ada@ex.fr|Rappel : révisions\nzoe@ex.fr|Rappel : révisions\nkiri@ex.fr|Rappel : révisions\nréussis : 2\nvérification : OK" }
          - { input: "x\n-", output: "réussis : 0\nvérification : OK", hidden: true }
        require:
          - { pattern: 'implements\s+Mailer', message: Créer une doublure de Mailer }
    project:
      id: java-tauto-projet
      type: code
      title: Tests de mutation
      difficulty: 3
      prompt: |
        Simule un outil de mutation comme PIT. La fonction testée est `prix(age, etudiant)` : 0 si age < 4, 5 si age < 12, 7 si étudiant, 10 sinon. Les **mutants** modifient le code :

        - `M1` : `age < 4` devient `age <= 4`
        - `M2` : `age < 12` devient `age < 13`
        - `M3` : le tarif étudiant 7 devient 10
        - `M4` : la condition étudiant est inversée

        Représente la fonction et ses mutants par des `BiFunction<Integer, Boolean, Integer>`. L’entrée est la suite de tests `age etudiant attendu` (écrite pour la version correcte). Un mutant est **tué** si au moins un test échoue sur lui. Affiche `M1 : tué` / `M1 : survivant` puis `score : T/4`.
      starter: |
        import java.util.*;
        import java.util.function.*;

        public class Main {
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
            }
        }
      solution: |
        import java.util.*;
        import java.util.function.*;

        public class Main {
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
                Map<String, BiFunction<Integer, Boolean, Integer>> mutants = new LinkedHashMap<>();
                mutants.put("M1", (a, e) -> a <= 4 ? 0 : a < 12 ? 5 : e ? 7 : 10);
                mutants.put("M2", (a, e) -> a < 4 ? 0 : a < 13 ? 5 : e ? 7 : 10);
                mutants.put("M3", (a, e) -> a < 4 ? 0 : a < 12 ? 5 : e ? 10 : 10);
                mutants.put("M4", (a, e) -> a < 4 ? 0 : a < 12 ? 5 : !e ? 7 : 10);
                List<int[]> tests = new ArrayList<>();
                while (sc.hasNext()) tests.add(new int[]{sc.nextInt(), sc.nextBoolean() ? 1 : 0, sc.nextInt()});
                int tues = 0;
                for (var m : mutants.entrySet()) {
                    boolean tue = tests.stream().anyMatch(t -> m.getValue().apply(t[0], t[1] == 1) != t[2]);
                    if (tue) tues++;
                    System.out.println(m.getKey() + " : " + (tue ? "tué" : "survivant"));
                }
                System.out.println("score : " + tues + "/4");
            }
        }
      tests:
        - { input: "2 false 0\n8 false 5\n30 true 7\n30 false 10", output: "M1 : survivant\nM2 : survivant\nM3 : tué\nM4 : tué\nscore : 2/4" }
        - { input: "4 false 5\n12 false 10\n20 true 7", output: "M1 : tué\nM2 : tué\nM3 : tué\nM4 : tué\nscore : 4/4", hidden: true }
