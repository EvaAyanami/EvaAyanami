  - slug: java-spring-boot
    title: Spring Boot
    summary: Le framework phare de Java — conteneur IoC, beans, injection par constructeur, auto-configuration, profils et starters.
    minutes: 40
    concepts: [framework, architecture]
    sections:
      - title: Une application Spring Boot
        body: |
          ```java
          @SpringBootApplication
          public class CodemoriApplication {
              public static void main(String[] args) { SpringApplication.run(CodemoriApplication.class, args); }
          }

          @Service
          public class CoursService {
              private final CoursRepository repo;
              public CoursService(CoursRepository repo) { this.repo = repo; }   // injection par constructeur
              public List<Cours> tous() { return repo.findAll(); }
          }

          @RestController
          @RequestMapping("/api/cours")
          class CoursController {
              private final CoursService service;
              CoursController(CoursService service) { this.service = service; }
              @GetMapping List<Cours> liste() { return service.tous(); }
          }
          ```

          Le **conteneur IoC** (inversion de contrôle) crée les *beans* (`@Component`, `@Service`, `@Repository`, `@Controller`, méthodes `@Bean`), résout leurs dépendances et gère leur cycle de vie (singletons par défaut).
      - title: Auto-configuration et configuration
        body: |
          Les **starters** (`spring-boot-starter-web`, `-data-jpa`, `-security`, `-test`) apportent dépendances et configuration par défaut : un serveur Tomcat embarqué démarre tout seul.

          ```yaml
          # application.yml
          server:
            port: 8080
          spring:
            datasource:
              url: jdbc:postgresql://db:5432/codemori
          codemori:
            xp-par-exercice: 10
          ```

          ```java
          @ConfigurationProperties(prefix = "codemori")
          record CodemoriProps(int xpParExercice) {}
          ```

          **Profils** : `application-dev.yml`, `application-prod.yml`, activés par `SPRING_PROFILES_ACTIVE=prod`. **Actuator** expose `/actuator/health`, des métriques…

          > 💡 Spring n’est pas disponible dans le bac à sable : les exercices te font recréer ses mécanismes (conteneur, cycle de vie, propriétés) en Java pur.
