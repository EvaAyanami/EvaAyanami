      - id: java-rest-code
        type: code
        title: Mini JSON
        prompt: |
          Écris un sérialiseur JSON minimal : `static String json(Object o)` qui gère `null`, `String` (avec échappement de `"` et `\`), `Number`, `Boolean`, `List` (→ tableau), `Map` (→ objet, clés triées) et les **records** (→ objet avec les composants dans l’ordre de déclaration, via `getRecordComponents()`).

          Le programme fourni construit un objet à partir de l’entrée et l’affiche.
        starter: |
          import java.lang.reflect.*;
          import java.util.*;

          public class Main {
              record Lecon(String titre, int minutes, boolean faite) {}
              record Cours(long id, String nom, List<Lecon> lecons, Map<String, Object> meta) {}

              public static void main(String[] args) throws Exception {
                  Scanner sc = new Scanner(System.in);
                  long id = sc.nextLong(); sc.nextLine();
                  String nom = sc.nextLine();
                  List<Lecon> lecons = new ArrayList<>();
                  while (sc.hasNext()) lecons.add(new Lecon(sc.next(), sc.nextInt(), sc.nextBoolean()));
                  Map<String, Object> meta = new HashMap<>();
                  meta.put("niveau", 2);
                  meta.put("auteur", null);
                  System.out.println(json(new Cours(id, nom, lecons, meta)));
              }
          }
        solution: |
          import java.lang.reflect.*;
          import java.util.*;

          public class Main {
              record Lecon(String titre, int minutes, boolean faite) {}
              record Cours(long id, String nom, List<Lecon> lecons, Map<String, Object> meta) {}

              static String json(Object o) throws ReflectiveOperationException {
                  if (o == null) return "null";
                  if (o instanceof String s) return "\"" + s.replace("\\", "\\\\").replace("\"", "\\\"") + "\"";
                  if (o instanceof Number || o instanceof Boolean) return o.toString();
                  if (o instanceof List<?> l) {
                      StringJoiner j = new StringJoiner(",", "[", "]");
                      for (Object x : l) j.add(json(x));
                      return j.toString();
                  }
                  if (o instanceof Map<?, ?> m) {
                      StringJoiner j = new StringJoiner(",", "{", "}");
                      for (Object k : new TreeSet<>(m.keySet())) j.add(json(k.toString()) + ":" + json(m.get(k)));
                      return j.toString();
                  }
                  if (o.getClass().isRecord()) {
                      StringJoiner j = new StringJoiner(",", "{", "}");
                      for (RecordComponent rc : o.getClass().getRecordComponents()) {
                          Method acc = rc.getAccessor();
                          acc.setAccessible(true);
                          j.add(json(rc.getName()) + ":" + json(acc.invoke(o)));
                      }
                      return j.toString();
                  }
                  return json(o.toString());
              }

              public static void main(String[] args) throws Exception {
                  Scanner sc = new Scanner(System.in);
                  long id = sc.nextLong(); sc.nextLine();
                  String nom = sc.nextLine();
                  List<Lecon> lecons = new ArrayList<>();
                  while (sc.hasNext()) lecons.add(new Lecon(sc.next(), sc.nextInt(), sc.nextBoolean()));
                  Map<String, Object> meta = new HashMap<>();
                  meta.put("niveau", 2);
                  meta.put("auteur", null);
                  System.out.println(json(new Cours(id, nom, lecons, meta)));
              }
          }
        tests:
          - { input: "42\nJava \"pro\"\nintro 10 true\nstreams 25 false", output: '{"id":42,"nom":"Java \"pro\"","lecons":[{"titre":"intro","minutes":10,"faite":true},{"titre":"streams","minutes":25,"faite":false}],"meta":{"auteur":null,"niveau":2}}' }
          - { input: "1\nA\\B", output: '{"id":1,"nom":"A\\B","lecons":[],"meta":{"auteur":null,"niveau":2}}', hidden: true }
    project:
      id: java-rest-projet
      type: code
      title: API REST en mémoire
      difficulty: 3
      prompt: |
        Implémente le traitement des requêtes d’une API de tâches (sans réseau). Chaque requête tient sur une ligne : `VERBE /chemin [corps]` ; le corps est un titre (texte libre).

        - `GET /taches` → `200 [id:titre:etat, …]` (triés par id, `[]` si vide ; etat = `a_faire` ou `faite`)
        - `GET /taches/ID` → `200 id:titre:etat` ou `404`
        - `POST /taches TITRE` → `201 Location: /taches/ID` (ids à partir de 1) ; titre vide → `422 titre requis`
        - `PATCH /taches/ID` → marque faite, `200 id:titre:faite` ou `404`
        - `DELETE /taches/ID` → `204` ou `404`
        - ID non numérique → `400` ; autre chemin → `404` ; verbe non supporté sur un chemin existant → `405`
      starter: |
        import java.util.*;

        public class Main {
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
            }
        }
      solution: |
        import java.util.*;

        public class Main {
            record Tache(long id, String titre, boolean faite) {
                public String toString() { return id + ":" + titre + ":" + (faite ? "faite" : "a_faire"); }
            }
            static TreeMap<Long, Tache> taches = new TreeMap<>();
            static long prochainId = 1;

            static String traiter(String verbe, String chemin, String corps) {
                String[] seg = chemin.replaceAll("/+$", "").split("/");
                if (seg.length < 2 || !seg[1].equals("taches") || seg.length > 3) return "404";
                if (seg.length == 2) {
                    switch (verbe) {
                        case "GET": return "200 " + taches.values();
                        case "POST":
                            if (corps.isBlank()) return "422 titre requis";
                            long id = prochainId++;
                            taches.put(id, new Tache(id, corps.trim(), false));
                            return "201 Location: /taches/" + id;
                        default: return "405";
                    }
                }
                long id;
                try { id = Long.parseLong(seg[2]); } catch (NumberFormatException e) { return "400"; }
                if (!List.of("GET", "PATCH", "DELETE").contains(verbe)) return "405";
                Tache t = taches.get(id);
                if (t == null) return "404";
                switch (verbe) {
                    case "GET": return "200 " + t;
                    case "PATCH":
                        Tache f = new Tache(id, t.titre(), true);
                        taches.put(id, f);
                        return "200 " + f;
                    default:
                        taches.remove(id);
                        return "204";
                }
            }

            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
                while (sc.hasNextLine()) {
                    String l = sc.nextLine().trim();
                    if (l.isEmpty()) continue;
                    String[] p = l.split(" ", 3);
                    System.out.println(traiter(p[0], p.length > 1 ? p[1] : "/", p.length > 2 ? p[2] : ""));
                }
            }
        }
      tests:
        - { input: "GET /taches\nPOST /taches Apprendre les streams\nPOST /taches Réviser SOLID\nPOST /taches\nPATCH /taches/1\nGET /taches/1\nDELETE /taches/2\nDELETE /taches/2\nGET /taches/abc\nPUT /taches/1\nGET /cours\nGET /taches", output: "200 []\n201 Location: /taches/1\n201 Location: /taches/2\n422 titre requis\n200 1:Apprendre les streams:faite\n200 1:Apprendre les streams:faite\n204\n404\n400\n405\n404\n200 [1:Apprendre les streams:faite]" }
        - { input: "DELETE /taches\nGET /taches/9", output: "405\n404", hidden: true }
