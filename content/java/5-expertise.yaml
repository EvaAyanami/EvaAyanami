  - slug: java-hibernate
    title: Hibernate
    summary: ORM avec JPA/Hibernate — entités, relations, cycle de vie, requêtes JPQL, Spring Data, problème N+1 et chargement paresseux.
    minutes: 40
    concepts: [base-de-donnees, framework]
    sections:
      - title: Entités JPA
        body: |
          ```java
          @Entity
          @Table(name = "cours")
          public class Cours {
              @Id @GeneratedValue(strategy = GenerationType.IDENTITY)
              private Long id;

              @Column(nullable = false, length = 100)
              private String titre;

              @OneToMany(mappedBy = "cours", cascade = CascadeType.ALL, orphanRemoval = true)
              private List<Chapitre> chapitres = new ArrayList<>();
          }

          @Entity
          public class Chapitre {
              @Id @GeneratedValue private Long id;
              @ManyToOne(fetch = FetchType.LAZY) private Cours cours;
          }
          ```

          Avec Spring Data JPA, une interface suffit :

          ```java
          interface CoursRepository extends JpaRepository<Cours, Long> {
              List<Cours> findByTitreContainingIgnoreCase(String motCle);     // requête dérivée du nom
              @Query("select c from Cours c join fetch c.chapitres where c.id = :id")
              Optional<Cours> avecChapitres(long id);
          }
          ```
      - title: Cycle de vie et pièges
        body: |
          États d’une entité : **transient** (nouvelle), **managed** (suivie par le contexte de persistance : ses modifications sont détectées et écrites au `flush`/commit), **detached**, **removed**.

          **Problème N+1** : charger 100 cours puis accéder à `cours.getChapitres()` pour chacun déclenche 1 + 100 requêtes. Solutions : `join fetch`, `@EntityGraph`, `@BatchSize`.

          Autres pièges : `LazyInitializationException` (accès paresseux hors transaction), `equals/hashCode` sur des entités, `FetchType.EAGER` généralisé. Toujours regarder le SQL généré (`spring.jpa.show-sql=true`) et gérer le schéma avec **Flyway**/**Liquibase**.
    exercises:
