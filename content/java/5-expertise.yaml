      - id: java-spring-code
        type: code
        title: Propriétés avec profils
        prompt: |
          Recrée la résolution des propriétés de Spring Boot. L’entrée contient des sections `[defaut]`, `[dev]`, `[prod]` avec des lignes `cle=valeur`, puis une ligne `profil=NOM`, puis des lignes `? cle`.

          La valeur d’une clé est celle du profil actif si elle y est définie, sinon celle de `[defaut]`. Une valeur peut référencer une autre clé avec `${autre}` (résolution récursive, mêmes règles ; une clé inconnue reste `${autre}`). Affiche `cle = valeur` ou `cle = <non définie>`.
        starter: |
          import java.util.*;

          public class Main {
              public static void main(String[] args) {
                  Scanner sc = new Scanner(System.in);
              }
          }
        solution: |
          import java.util.*;
          import java.util.regex.*;

          public class Main {
              static Map<String, Map<String, String>> sections = new HashMap<>();
              static String profil = "defaut";

              static String brute(String cle) {
                  String v = sections.getOrDefault(profil, Map.of()).get(cle);
                  return v != null ? v : sections.getOrDefault("defaut", Map.of()).get(cle);
              }
              static String resoudre(String v, int profondeur) {
                  if (profondeur > 10) return v;
                  Matcher m = Pattern.compile("\\$\\{([^}]+)}").matcher(v);
                  StringBuilder sb = new StringBuilder();
                  while (m.find()) {
                      String r = brute(m.group(1));
                      m.appendReplacement(sb, Matcher.quoteReplacement(r == null ? m.group() : resoudre(r, profondeur + 1)));
                  }
                  m.appendTail(sb);
                  return sb.toString();
              }
              public static void main(String[] args) {
                  Scanner sc = new Scanner(System.in);
                  String courante = "defaut";
                  while (sc.hasNextLine()) {
                      String l = sc.nextLine().trim();
                      if (l.isEmpty()) continue;
                      if (l.startsWith("[")) courante = l.substring(1, l.length() - 1);
                      else if (l.startsWith("profil=")) profil = l.substring(7);
                      else if (l.startsWith("? ")) {
                          String cle = l.substring(2).trim(), v = brute(cle);
                          System.out.println(cle + " = " + (v == null ? "<non définie>" : resoudre(v, 0)));
                      } else {
                          int i = l.indexOf('=');
                          sections.computeIfAbsent(courante, k -> new HashMap<>()).put(l.substring(0, i).trim(), l.substring(i + 1).trim());
                      }
                  }
              }
          }
        tests:
          - { input: "[defaut]\nhote=localhost\nport=8080\nurl=http://${hote}:${port}/api\n[prod]\nhote=codemori.fr\nport=443\nprofil=prod\n? url\n? port\n? secret", output: "url = http://codemori.fr:443/api\nport = 443\nsecret = <non définie>" }
          - { input: "[defaut]\na=${b}-${c}\nb=1\nprofil=dev\n? a", output: 'a = 1-${c}', hidden: true }
    project:
      id: java-spring-projet
      type: code
      title: Mini conteneur IoC avec cycle de vie
      difficulty: 3
      prompt: |
        Recrée le cœur de Spring : des annotations `@Composant` (sur les classes) et `@ApresConstruction` (sur une méthode à appeler après création, comme `@PostConstruct`). Le conteneur reçoit une liste de classes, crée les beans **à la demande** par injection de constructeur (singletons), appelle les méthodes `@ApresConstruction`, et refuse une classe non annotée (`erreur : X n’est pas un composant`).

        Classes fournies : `Horloge` (composant, sans dépendance), `DepotCours(Horloge)` (avec `@ApresConstruction` qui affiche `DepotCours prêt`), `ServiceCours(DepotCours, Horloge)`, et `Intrus` (non annoté). L’entrée liste les beans demandés ; affiche `création X` à chaque instanciation et `bean X` pour chaque demande réussie, puis `beans : N`.
      starter: |
        import java.lang.annotation.*;
        import java.lang.reflect.*;
        import java.util.*;

        public class Main {
            public static void main(String[] args) throws Exception {
                Scanner sc = new Scanner(System.in);
            }
        }
      solution: |
        import java.lang.annotation.*;
        import java.lang.reflect.*;
        import java.util.*;

        @Retention(RetentionPolicy.RUNTIME) @Target(ElementType.TYPE) @interface Composant {}
        @Retention(RetentionPolicy.RUNTIME) @Target(ElementType.METHOD) @interface ApresConstruction {}

        public class Main {
            @Composant public static class Horloge { public Horloge() {} }
            @Composant public static class DepotCours {
                public DepotCours(Horloge h) {}
                @ApresConstruction void init() { System.out.println("DepotCours prêt"); }
            }
            @Composant public static class ServiceCours { public ServiceCours(DepotCours d, Horloge h) {} }
            public static class Intrus { public Intrus() {} }

            static class Conteneur {
                private final Map<Class<?>, Object> beans = new LinkedHashMap<>();
                Object obtenir(Class<?> c) throws ReflectiveOperationException {
                    if (beans.containsKey(c)) return beans.get(c);
                    if (!c.isAnnotationPresent(Composant.class)) throw new IllegalArgumentException(c.getSimpleName() + " n’est pas un composant");
                    Constructor<?> k = c.getConstructors()[0];
                    Object[] args = new Object[k.getParameterCount()];
                    for (int i = 0; i < args.length; i++) args[i] = obtenir(k.getParameterTypes()[i]);
                    Object o = k.newInstance(args);
                    System.out.println("création " + c.getSimpleName());
                    for (Method m : c.getDeclaredMethods()) {
                        if (m.isAnnotationPresent(ApresConstruction.class)) { m.setAccessible(true); m.invoke(o); }
                    }
                    beans.put(c, o);
                    return o;
                }
                int taille() { return beans.size(); }
            }

            public static void main(String[] args) throws Exception {
                Scanner sc = new Scanner(System.in);
                Conteneur ct = new Conteneur();
                while (sc.hasNext()) {
                    Class<?> c = Class.forName("Main$" + sc.next());
                    try { ct.obtenir(c); System.out.println("bean " + c.getSimpleName()); }
                    catch (IllegalArgumentException e) { System.out.println("erreur : " + e.getMessage()); }
                }
                System.out.println("beans : " + ct.taille());
            }
        }
      tests:
        - { input: ServiceCours Intrus Horloge, output: "création Horloge\ncréation DepotCours\nDepotCours prêt\ncréation ServiceCours\nbean ServiceCours\nerreur : Intrus n’est pas un composant\nbean Horloge\nbeans : 3" }
        - { input: Horloge, output: "création Horloge\nbean Horloge\nbeans : 1", hidden: true }
      require:
        - { pattern: '@interface\s+Composant', message: Définir l’annotation @Composant }
