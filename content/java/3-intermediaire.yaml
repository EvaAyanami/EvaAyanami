    project:
      id: java-exc-projet
      type: code
      title: Banque avec exceptions
      difficulty: 3
      prompt: |
        Crée `SoldeInsuffisantException extends Exception` (stocke le manque) et une classe `Compte` dont `retirer` lève cette exception et `deposer` lève `IllegalArgumentException` pour un montant ≤ 0.

        Commandes `depot X` / `retrait X`. Affiche le solde après chaque opération réussie, `erreur : montant invalide` ou `erreur : solde insuffisant (manque M)`.
      starter: |
        import java.util.Scanner;

        public class Main {
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
            }
        }
      solution: |
        import java.util.Scanner;

        class SoldeInsuffisantException extends Exception {
            private final long manque;
            SoldeInsuffisantException(long manque) { super("solde insuffisant"); this.manque = manque; }
            long getManque() { return manque; }
        }

        class Compte {
            private long solde;
            void deposer(long m) {
                if (m <= 0) throw new IllegalArgumentException("montant invalide");
                solde += m;
            }
            void retirer(long m) throws SoldeInsuffisantException {
                if (m <= 0) throw new IllegalArgumentException("montant invalide");
                if (m > solde) throw new SoldeInsuffisantException(m - solde);
                solde -= m;
            }
            long getSolde() { return solde; }
        }

        public class Main {
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
                Compte c = new Compte();
                while (sc.hasNext()) {
                    String op = sc.next();
                    long x = sc.nextLong();
                    try {
                        if (op.equals("depot")) c.deposer(x); else c.retirer(x);
                        System.out.println(c.getSolde());
                    } catch (SoldeInsuffisantException e) {
                        System.out.println("erreur : " + e.getMessage() + " (manque " + e.getManque() + ")");
                    } catch (IllegalArgumentException e) {
                        System.out.println("erreur : " + e.getMessage());
                    }
                }
            }
        }
      tests:
        - { input: "depot 100\nretrait 30\nretrait 100\ndepot -5", output: "100\n70\nerreur : solde insuffisant (manque 30)\nerreur : montant invalide" }
        - { input: retrait 1, output: 'erreur : solde insuffisant (manque 1)', hidden: true }
      require:
        - { pattern: 'extends\s+Exception', message: Créer une exception vérifiée }
