          }
        solution: |
          import java.util.*;

          public class Main {
              static TreeSet<String> lire(String l) {
                  TreeSet<String> s = new TreeSet<>();
                  for (String m : l.trim().split("\\s+")) if (!m.isEmpty()) s.add(m);
                  return s;
              }
              static String afficher(Set<String> s) { return s.isEmpty() ? "-" : String.join(" ", s); }
              public static void main(String[] args) {
                  Scanner sc = new Scanner(System.in);
                  TreeSet<String> a = lire(sc.nextLine()), b = lire(sc.nextLine());
                  TreeSet<String> inter = new TreeSet<>(a); inter.retainAll(b);
                  TreeSet<String> diff = new TreeSet<>(a); diff.removeAll(b);
                  TreeSet<String> uni = new TreeSet<>(a); uni.addAll(b);
                  System.out.println(afficher(inter));
                  System.out.println(afficher(diff));
                  System.out.println(uni.size());
              }
          }
        tests:
          - { input: "Zoe Ada Bob\nBob Kiri Ada", output: "Ada Bob\nZoe\n4" }
          - { input: "X\nY", output: "-\nX\n2", hidden: true }
