  - slug: java-junit
    title: Tests JUnit
    summary: Tests unitaires avec JUnit 5 — @Test, assertions, cycle de vie, tests paramétrés, exceptions attendues et bonnes pratiques.
    minutes: 30
    concepts: [tests]
    sections:
      - title: Un premier test JUnit 5
        body: |
          ```java
          import org.junit.jupiter.api.*;
          import static org.junit.jupiter.api.Assertions.*;

          class CalculatriceTest {
              private Calculatrice calc;

              @BeforeEach
              void setUp() { calc = new Calculatrice(); }     // avant chaque test

              @Test
              @DisplayName("2 + 3 = 5")
              void addition() { assertEquals(5, calc.ajouter(2, 3)); }

              @Test
              void divisionParZero() {
                  var e = assertThrows(ArithmeticException.class, () -> calc.diviser(1, 0));
                  assertEquals("division par zéro", e.getMessage());
              }

              @ParameterizedTest
              @CsvSource({"1, 1, 2", "2, 3, 5", "-1, 1, 0"})
              void additions(int a, int b, int attendu) { assertEquals(attendu, calc.ajouter(a, b)); }
          }
          ```

          Assertions : `assertEquals`, `assertTrue`, `assertNull`, `assertThrows`, `assertAll` (plusieurs vérifications groupées), `assertTimeout`.
      - title: Bonnes pratiques
        body: |
          - Un test = un comportement, nommé clairement (`retraitRefuseSiSoldeInsuffisant`).
          - Structure **Arrange / Act / Assert**.
          - Tests rapides, indépendants, reproductibles (pas d’ordre implicite, pas d’horloge réelle).
          - **Mocks** (Mockito) pour isoler une classe de ses dépendances.
          - Mesurer la **couverture** (JaCoCo) sans en faire un objectif absolu.

          Les tests vivent dans `src/test/java` et sont lancés par `mvn test` ou `./gradlew test`.

          > 💡 Dans le bac à sable Codemori, JUnit n’est pas disponible : les exercices te font écrire **ton propre mini-framework** de tests, ce qui t’aide à comprendre comment JUnit fonctionne.
    exercises:
      - id: java-junit-q1
        type: mcq
        prompt: Quelle annotation exécute une méthode avant chaque test ?
        choices: ['@BeforeEach', '@BeforeAll', '@Setup', '@Init']
        answer: 0
      - id: java-junit-q2
        type: mcq
        prompt: Comment vérifier qu’un appel lève une exception avec JUnit 5 ?
        choices: ['assertThrows(Type.class, () -> appel())', 'try/catch vide', '@Test(expected = …) uniquement', 'assertException()']
        answer: 0
      - id: java-junit-order
        type: order
        prompt: Remets dans l’ordre les étapes d’un test unitaire (motif AAA).
        lines:
          - 'Arrange : préparer les objets et les données'
          - 'Act : appeler la méthode testée'
          - 'Assert : vérifier le résultat'
      - id: java-junit-code
        type: code
        title: Mini framework de test
        prompt: |
          Écris une classe `Verif` avec `static void egal(Object attendu, Object obtenu)` qui lève une `AssertionError("attendu X mais obtenu Y")`, et une méthode `static void tester(String nom, Runnable test)` qui exécute le test, affiche `✔ nom` ou `✘ nom : message`, et compte les réussites.

          Le programme teste ta fonction `static boolean estBissextile(int)` (à écrire) avec les années lues sous la forme `annee attendu` (`true`/`false`), puis affiche `R/N réussis`.
        starter: |
          import java.util.*;

          public class Main {
              public static void main(String[] args) {
                  Scanner sc = new Scanner(System.in);
                  int n = 0;
                  while (sc.hasNext()) {
                      int annee = sc.nextInt();
                      boolean attendu = sc.nextBoolean();
                      n++;
                      Verif.tester("année " + annee, () -> Verif.egal(attendu, estBissextile(annee)));
                  }
                  System.out.println(Verif.reussis + "/" + n + " réussis");
              }
          }
        solution: |
          import java.util.*;

          class Verif {
              static int reussis = 0;
              static void egal(Object attendu, Object obtenu) {
                  if (!Objects.equals(attendu, obtenu)) throw new AssertionError("attendu " + attendu + " mais obtenu " + obtenu);
              }
              static void tester(String nom, Runnable test) {
                  try {
                      test.run();
                      reussis++;
                      System.out.println("✔ " + nom);
                  } catch (AssertionError e) {
                      System.out.println("✘ " + nom + " : " + e.getMessage());
                  }
              }
          }

          public class Main {
              static boolean estBissextile(int a) { return (a % 4 == 0 && a % 100 != 0) || a % 400 == 0; }
              public static void main(String[] args) {
                  Scanner sc = new Scanner(System.in);
                  int n = 0;
                  while (sc.hasNext()) {
                      int annee = sc.nextInt();
                      boolean attendu = sc.nextBoolean();
                      n++;
                      Verif.tester("année " + annee, () -> Verif.egal(attendu, estBissextile(annee)));
                  }
                  System.out.println(Verif.reussis + "/" + n + " réussis");
              }
          }
        tests:
          - { input: "2024 true\n1900 true\n2000 true", output: "✔ année 2024\n✘ année 1900 : attendu true mais obtenu false\n✔ année 2000\n2/3 réussis" }
          - { input: 2023 false, output: "✔ année 2023\n1/1 réussis", hidden: true }
        concepts: [tests]
    project:
      id: java-junit-projet
      type: code
      title: Runner d’annotations
      difficulty: 3
      prompt: |
        Recrée le cœur de JUnit : définis une annotation `@Test` (rétention RUNTIME) et une classe `TestsPanier` avec plusieurs méthodes annotées qui testent une classe `Panier` (à écrire : `ajouter(String, double prix, int qte)`, `double total()`, `retirer(String)` qui lève `NoSuchElementException` si absent).

        Ton runner découvre par **réflexion** les méthodes `@Test` (triées par nom), instancie la classe de test pour chacune (comme `@BeforeEach`), les invoque, et affiche `✔ nom` ou `✘ nom` (si l’invocation lève une exception), puis `R/N`.

        Les tests à écrire : `ajoutSimple` (total 3 × 2.5 = 7.5), `ajoutCumule` (même article ajouté deux fois), `retraitAbsentLeve` (vérifie que retirer un article absent lève l’exception), `totalVide` (0) et `bugVolontaire` (affirme que le total d’un panier vide vaut 1 : doit échouer). L’entrée est ignorée.
      starter: |
        import java.lang.annotation.*;
        import java.lang.reflect.*;
        import java.util.*;

        public class Main {
            public static void main(String[] args) throws Exception {
            }
        }
      solution: |
        import java.lang.annotation.*;
        import java.lang.reflect.*;
        import java.util.*;

        @Retention(RetentionPolicy.RUNTIME)
        @Target(ElementType.METHOD)
        @interface Test {}

        class Panier {
            private final Map<String, double[]> lignes = new LinkedHashMap<>();
            void ajouter(String a, double prix, int qte) {
                lignes.merge(a, new double[]{prix, qte}, (o, n) -> new double[]{o[0], o[1] + n[1]});
            }
            double total() { return lignes.values().stream().mapToDouble(l -> l[0] * l[1]).sum(); }
            void retirer(String a) { if (lignes.remove(a) == null) throw new NoSuchElementException(a); }
        }

        class TestsPanier {
            private final Panier p = new Panier();
            static void verifier(boolean c) { if (!c) throw new AssertionError(); }
            @Test void ajoutSimple() { p.ajouter("cafe", 2.5, 3); verifier(p.total() == 7.5); }
            @Test void ajoutCumule() { p.ajouter("the", 2, 1); p.ajouter("the", 2, 2); verifier(p.total() == 6); }
            @Test void retraitAbsentLeve() {
                try { p.retirer("x"); throw new AssertionError("pas d’exception"); } catch (NoSuchElementException e) { }
            }
            @Test void totalVide() { verifier(p.total() == 0); }
            @Test void bugVolontaire() { verifier(p.total() == 1); }
        }

        public class Main {
            public static void main(String[] args) throws Exception {
                List<Method> tests = new ArrayList<>();
                for (Method m : TestsPanier.class.getDeclaredMethods()) if (m.isAnnotationPresent(Test.class)) tests.add(m);
                tests.sort(Comparator.comparing(Method::getName));
                int ok = 0;
                for (Method m : tests) {
                    Object instance = TestsPanier.class.getDeclaredConstructor().newInstance();
                    try {
                        m.setAccessible(true);
                        m.invoke(instance);
                        ok++;
                        System.out.println("✔ " + m.getName());
                    } catch (InvocationTargetException e) {
                        System.out.println("✘ " + m.getName());
                    }
                }
                System.out.println(ok + "/" + tests.size());
            }
        }
      tests:
        - { input: '', output: "✔ ajoutCumule\n✔ ajoutSimple\n✘ bugVolontaire\n✔ retraitAbsentLeve\n✔ totalVide\n4/5" }
        - { input: x, output: "✔ ajoutCumule\n✔ ajoutSimple\n✘ bugVolontaire\n✔ retraitAbsentLeve\n✔ totalVide\n4/5", hidden: true }
      require:
        - { pattern: '@interface\s+Test', message: Définir l’annotation @Test }
        - { pattern: 'getDeclaredMethods', message: Découvrir les tests par réflexion }
