        body: |
          ```java
          import java.nio.file.*;
          import java.io.*;

          Path p = Path.of("donnees", "notes.txt");
          Files.createDirectories(p.getParent());
          Files.writeString(p, "Ada 18\nBob 12\n");                 // écrire
