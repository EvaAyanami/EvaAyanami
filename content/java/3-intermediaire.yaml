      - id: java-coll-code
        type: code
        title: Parenthèses équilibrées
        prompt: Pour chaque ligne, affiche `ok` si les parenthèses `()`, crochets `[]` et accolades `{}` sont correctement équilibrées et imbriquées, `erreur` sinon. Utilise un `Deque<Character>` comme pile.
        starter: |
          import java.util.*;

          public class Main {
              public static void main(String[] args) {
                  Scanner sc = new Scanner(System.in);
                  while (sc.hasNextLine()) {
                      String l = sc.nextLine();
                  }
              }
          }
        solution: |
          import java.util.*;

          public class Main {
              static boolean equilibre(String s) {
                  Deque<Character> pile = new ArrayDeque<>();
                  for (char c : s.toCharArray()) {
                      if ("([{".indexOf(c) >= 0) pile.push(c);
                      else if (")]}".indexOf(c) >= 0) {
                          if (pile.isEmpty()) return false;
                          char o = pile.pop();
                          if ("([{".indexOf(o) != ")]}".indexOf(c)) return false;
                      }
                  }
                  return pile.isEmpty();
              }
              public static void main(String[] args) {
                  Scanner sc = new Scanner(System.in);
                  while (sc.hasNextLine()) System.out.println(equilibre(sc.nextLine()) ? "ok" : "erreur");
              }
          }
        tests:
          - { input: "f(a[1]) { x }\n(]\n((", output: "ok\nerreur\nerreur" }
          - { input: "\n{[()()]}\n)(", output: "ok\nok\nerreur", hidden: true }
        require:
          - { pattern: 'Deque', message: Utiliser un Deque comme pile }
    project:
      id: java-coll-projet
      type: code
      title: Guichet avec priorité
      difficulty: 2
      prompt: |
        Deux files `ArrayDeque<String>` : prioritaire et normale. Commandes : `arrivee NOM`, `arrivee_prio NOM`, `appel` (`Guichet : NOM` en servant d’abord la file prioritaire, ou `Personne en attente`), `attente` (`En attente : P prioritaires, N normales`).
      starter: |
        import java.util.*;

        public class Main {
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
            }
        }
      solution: |
        import java.util.*;

        public class Main {
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
                Deque<String> prio = new ArrayDeque<>(), normale = new ArrayDeque<>();
                while (sc.hasNext()) {
                    switch (sc.next()) {
                        case "arrivee" -> normale.offer(sc.next());
                        case "arrivee_prio" -> prio.offer(sc.next());
                        case "appel" -> {
                            String n = !prio.isEmpty() ? prio.poll() : normale.poll();
                            System.out.println(n == null ? "Personne en attente" : "Guichet : " + n);
                        }
                        default -> System.out.println("En attente : " + prio.size() + " prioritaires, " + normale.size() + " normales");
                    }
                }
            }
        }
      tests:
        - { input: "arrivee Ada\narrivee Bob\narrivee_prio Zoe\nattente\nappel\nappel\nappel\nappel", output: "En attente : 1 prioritaires, 2 normales\nGuichet : Zoe\nGuichet : Ada\nGuichet : Bob\nPersonne en attente" }
        - { input: appel, output: Personne en attente, hidden: true }
