  - slug: java-lambdas
    title: Lambdas
    summary: Expressions lambda, références de méthodes, interfaces fonctionnelles standard, capture de variables et composition de fonctions.
    minutes: 30
    concepts: [closures]
    sections:
      - title: Syntaxe
        body: |
          ```java
          Function<Integer, Integer> carre = x -> x * x;
          BiFunction<Integer, Integer, Integer> somme = (a, b) -> a + b;
          Supplier<String> salut = () -> "bonjour";
          Consumer<String> afficher = s -> System.out.println(s);
          Predicate<String> vide = String::isEmpty;              // référence de méthode
          Comparator<String> parLongueur = Comparator.comparingInt(String::length);
          Runnable tache = () -> { System.out.println("a"); System.out.println("b"); };
          ```

          Références de méthodes : `Classe::methodeStatique`, `objet::methode`, `Classe::methodeInstance`, `Classe::new`.

          Une lambda implémente une **interface fonctionnelle** (une seule méthode abstraite), qu’on peut annoter `@FunctionalInterface`.
      - title: Capture et composition
        body: |
          Une lambda peut lire les variables locales **effectivement finales** (jamais réaffectées) :

          ```java
          int seuil = 10;
          Predicate<Integer> grand = x -> x > seuil;   // OK
          // seuil++;                                  // ❌ seuil ne serait plus effectivement finale
          ```

          Composition :

          ```java
          Function<Integer, Integer> plus1 = x -> x + 1;
          Function<Integer, Integer> f = carre.andThen(plus1);   // x² + 1
          Function<Integer, Integer> g = carre.compose(plus1);   // (x + 1)²
          Predicate<String> court = s -> s.length() < 5;
          Predicate<String> courtEtNonVide = court.and(vide.negate());
          ```
