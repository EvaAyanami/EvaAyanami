    project:
      id: java-hm-projet
      type: code
      title: Index de livre
      difficulty: 3
      prompt: 'Chaque ligne est une page (numérotée à partir de 1). Construis un index des mots d’au moins 4 lettres (en minuscules) vers l’ensemble trié des pages. Affiche les mots triés `mot : p1, p2, …` (`TreeMap<String, TreeSet<Integer>>`).'
      starter: |
        import java.util.*;

        public class Main {
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
            }
        }
      solution: |
        import java.util.*;

        public class Main {
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
                Map<String, TreeSet<Integer>> index = new TreeMap<>();
                int page = 0;
                while (sc.hasNextLine()) {
                    page++;
                    for (String m : sc.nextLine().toLowerCase().split("\\s+")) {
                        if (m.length() >= 4) index.computeIfAbsent(m, k -> new TreeSet<>()).add(page);
                    }
                }
                index.forEach((m, pages) -> {
                    StringJoiner j = new StringJoiner(", ");
                    for (int p : pages) j.add(String.valueOf(p));
                    System.out.println(m + " : " + j);
                });
            }
        }
      tests:
        - { input: "Java est rapide\nJava est sûr\nle code Java compile", output: "code : 3\ncompile : 3\njava : 1, 2, 3\nrapide : 1" }
        - { input: "Data data DATA\nnope\nData", output: "data : 1, 3\nnope : 2", hidden: true }
