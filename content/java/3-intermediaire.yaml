      - id: java-hs-code
        type: code
        title: Élèves communs
        prompt: 'Deux lignes : les élèves du club A puis du club B. Affiche les élèves des deux clubs (triés), ceux seulement dans A (triés), et le nombre total d’élèves distincts. Liste vide : `-`.'
        starter: |
          import java.util.*;

          public class Main {
              public static void main(String[] args) {
                  Scanner sc = new Scanner(System.in);
