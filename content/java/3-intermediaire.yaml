        solution: |
          import java.util.*;

          public class Main {
              public static void main(String[] args) {
                  Scanner sc = new Scanner(System.in);
                  Map<String, Integer> freq = new HashMap<>();
                  while (sc.hasNext()) freq.merge(sc.next().toLowerCase(), 1, Integer::sum);
                  List<Map.Entry<String, Integer>> l = new ArrayList<>(freq.entrySet());
                  l.sort(Map.Entry.<String, Integer>comparingByValue().reversed().thenComparing(Map.Entry.comparingByKey()));
                  for (int i = 0; i < Math.min(3, l.size()); i++) System.out.println(l.get(i).getKey() + " : " + l.get(i).getValue());
              }
          }
