                while (sc.hasNextLine()) entree.add(sc.nextLine());
                Path p = Files.createTempFile("ventes", ".csv");
                Files.write(p, entree);
                Map<String, Double> ca = new TreeMap<>();
                int ignorees = 0;
                List<String> lignes;
                try (Stream<String> s = Files.lines(p)) { lignes = s.skip(1).collect(Collectors.toList()); }
                for (String l : lignes) {
                    String[] c = l.split(";");
                    try {
                        if (c.length != 3 || c[0].isBlank()) throw new IllegalArgumentException();
                        ca.merge(c[0], Integer.parseInt(c[1]) * Double.parseDouble(c[2]), Double::sum);
                    } catch (IllegalArgumentException e) {
                        ignorees++;
                    }
                }
                double total = 0;
                for (var e : ca.entrySet()) {
                    System.out.println(String.format(Locale.US, "%s : %.2f", e.getKey(), e.getValue()));
                    total += e.getValue();
                }
                System.out.println(String.format(Locale.US, "Total : %.2f", total));
                System.out.println("lignes ignorées : " + ignorees);
                Files.delete(p);
            }
        }
      tests:
        - { input: "produit;quantite;prix\nstylo;10;1.5\ncahier;2;3.2\nstylo;4;1.5\ngomme;x;1\nrègle", output: "cahier : 6.40\nstylo : 21.00\nTotal : 27.40\nlignes ignorées : 2" }
        - { input: produit;quantite;prix, output: "Total : 0.00\nlignes ignorées : 0", hidden: true }
