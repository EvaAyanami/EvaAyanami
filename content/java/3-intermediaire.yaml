      - id: java-lam-code
        type: code
        title: Pipeline de fonctions
        prompt: 'Chaque ligne : une valeur `x` puis des opérations `+N`, `*N`, `^2`. Construis une `Function<Long, Long>` par opération et compose-les avec `andThen`, puis applique le résultat à `x`.'
        starter: |
          import java.util.*;
          import java.util.function.*;

          public class Main {
              public static void main(String[] args) {
                  Scanner sc = new Scanner(System.in);
                  while (sc.hasNextLine()) {
                      String[] p = sc.nextLine().trim().split("\\s+");
                  }
              }
          }
        solution: |
          import java.util.*;
          import java.util.function.*;

          public class Main {
              public static void main(String[] args) {
                  Scanner sc = new Scanner(System.in);
                  while (sc.hasNextLine()) {
                      String[] p = sc.nextLine().trim().split("\\s+");
                      long x = Long.parseLong(p[0]);
                      Function<Long, Long> f = Function.identity();
                      for (int i = 1; i < p.length; i++) {
                          String op = p[i];
                          Function<Long, Long> g;
                          if (op.equals("^2")) g = v -> v * v;
                          else {
                              long n = Long.parseLong(op.substring(1));
                              g = op.charAt(0) == '+' ? v -> v + n : v -> v * n;
                          }
                          f = f.andThen(g);
                      }
                      System.out.println(f.apply(x));
                  }
              }
          }
        tests:
          - { input: "2 +3 ^2 *2\n5", output: "50\n5" }
          - { input: -1 *-3 +1 ^2, output: '16', hidden: true }
        require:
          - { pattern: 'andThen', message: Composer avec andThen }
    project:
      id: java-lam-projet
      type: code
      title: Système d’événements
      difficulty: 3
      prompt: |
        Écris une classe `Bus` (`Map<String, List<Consumer<String>>>`) avec `abonner(evt, Consumer<String>)` et `publier(evt, donnee)`.

        Première ligne : abonnements `evenement action` (`afficher`, `compter`, `majuscules`). `compter` incrémente un compteur (`int[]` ou `AtomicInteger` capturé). Lignes suivantes : publications `evenement donnee`. Termine par `compteur : N`.
      starter: |
        import java.util.*;
        import java.util.function.*;

        public class Main {
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
            }
        }
      solution: |
        import java.util.*;
        import java.util.concurrent.atomic.AtomicInteger;
        import java.util.function.*;

        class Bus {
            private final Map<String, List<Consumer<String>>> abonnes = new HashMap<>();
            void abonner(String evt, Consumer<String> c) { abonnes.computeIfAbsent(evt, k -> new ArrayList<>()).add(c); }
            void publier(String evt, String d) { abonnes.getOrDefault(evt, List.of()).forEach(c -> c.accept(d)); }
        }

        public class Main {
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
                Bus bus = new Bus();
                AtomicInteger compteur = new AtomicInteger();
                String[] ab = sc.nextLine().trim().split("\\s+");
                for (int i = 0; i + 1 < ab.length; i += 2) {
                    String evt = ab[i];
                    switch (ab[i + 1]) {
                        case "afficher" -> bus.abonner(evt, d -> System.out.println("[" + evt + "] " + d));
                        case "compter" -> bus.abonner(evt, d -> compteur.incrementAndGet());
                        default -> bus.abonner(evt, d -> System.out.println(d.toUpperCase()));
                    }
                }
                while (sc.hasNext()) bus.publier(sc.next(), sc.next());
                System.out.println("compteur : " + compteur.get());
            }
        }
      tests:
        - { input: "login afficher login compter achat majuscules achat compter\nlogin kiri\nachat livre\nlogout bob", output: "[login] kiri\nLIVRE\ncompteur : 2" }
        - { input: "x compter\nx a\nx b\ny c", output: 'compteur : 2', hidden: true }
