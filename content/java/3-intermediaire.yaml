  - slug: java-exceptions
    title: Exceptions
    summary: try/catch/finally, exceptions vérifiées et non vérifiées, throw et throws, exceptions personnalisées et try-with-resources.
    minutes: 30
    concepts: [erreurs]
    sections:
      - title: Lever et attraper
        body: |
          ```java
          static int diviser(int a, int b) {
              if (b == 0) throw new ArithmeticException("division par zéro");
              return a / b;
          }

          try {
              int r = diviser(1, 0);
          } catch (ArithmeticException | NumberFormatException e) {   // multi-catch
              System.out.println("Erreur : " + e.getMessage());
          } finally {
              System.out.println("toujours exécuté");
          }
          ```

          Hiérarchie : `Throwable` → `Error` (graves, ne pas attraper : `OutOfMemoryError`) et `Exception` → `RuntimeException` (**non vérifiées** : `NullPointerException`, `IllegalArgumentException`, `IndexOutOfBoundsException`) et les autres (**vérifiées** : `IOException`, `SQLException`).
      - title: Vérifiées, personnalisées, ressources
        body: |
          Une exception **vérifiée** doit être attrapée ou déclarée avec `throws` :

          ```java
          static String lire(Path p) throws IOException { return Files.readString(p); }

          class SoldeInsuffisantException extends Exception {
              private final long manque;
              SoldeInsuffisantException(long manque) { super("solde insuffisant"); this.manque = manque; }
              long getManque() { return manque; }
          }

          try (BufferedReader r = Files.newBufferedReader(p)) {   // fermé automatiquement
              return r.readLine();
          }
          ```

          Bonnes pratiques : ne jamais avaler une exception (`catch (Exception e) {}`), attraper au bon niveau, conserver la cause (`new MonException("…", e)`), utiliser les exceptions pour les cas exceptionnels.
