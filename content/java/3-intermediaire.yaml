language: java
level: 3
chapters:
  # ------------------------------------------------------------------
  - slug: java-collections
    title: Collections
    summary: Le framework Collections — interfaces List, Set, Map, Queue, Deque, implémentations, collections immuables et utilitaires.
    minutes: 25
    concepts: [collections]
    sections:
      - title: Interfaces et implémentations
        body: |
          | Interface | Implémentations courantes | Particularité |
          |---|---|---|
          | `List<E>` | `ArrayList`, `LinkedList` | ordonnée, indices, doublons |
          | `Set<E>` | `HashSet`, `LinkedHashSet`, `TreeSet` | sans doublon |
          | `Map<K,V>` | `HashMap`, `LinkedHashMap`, `TreeMap` | clé → valeur |
          | `Queue<E>` / `Deque<E>` | `ArrayDeque`, `PriorityQueue` | file, pile, priorité |

          On déclare avec l’**interface** et on instancie avec l’implémentation : `List<String> noms = new ArrayList<>();` — on peut ainsi changer d’implémentation sans toucher au reste du code.
      - title: Immuables et utilitaires
        body: |
          ```java
          List<Integer> fixe = List.of(1, 2, 3);           // immuable (add → UnsupportedOperationException)
          Map<String, Integer> m = Map.of("a", 1, "b", 2);
          Set<String> s = Set.copyOf(liste);

          Collections.sort(liste);
          Collections.reverse(liste);
          Collections.max(liste);
          Collections.frequency(liste, "x");
          Collections.unmodifiableList(liste);              // vue non modifiable

          Deque<Integer> pile = new ArrayDeque<>();
          pile.push(1); pile.pop();                         // pile (LIFO)
          Queue<Integer> file = new ArrayDeque<>();
          file.offer(1); file.poll();                       // file (FIFO)
          PriorityQueue<Integer> tas = new PriorityQueue<>(); // plus petit en tête
          ```

          Java 21 ajoute les **SequencedCollection** : `getFirst()`, `getLast()`, `reversed()` sur les listes, deques et `LinkedHashSet`.
