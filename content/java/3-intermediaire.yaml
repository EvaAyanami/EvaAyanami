  - slug: java-arraylist
    title: ArrayList
    summary: Liste dynamique — ajout, accès, suppression, recherche, tri, removeIf, itérateurs et performances.
    minutes: 25
    concepts: [collections, vecteurs]
    sections:
      - title: Manipuler une ArrayList
        body: |
          ```java
          List<String> l = new ArrayList<>();
          l.add("b"); l.add("c");
          l.add(0, "a");               // insertion à l’indice 0
          l.get(1);                    // "b"
          l.set(1, "B");
          l.remove("c");               // par valeur
          l.remove(0);                 // par indice
          l.contains("B"); l.indexOf("B"); l.size(); l.isEmpty();
          l.addAll(List.of("x", "y"));
          l.removeIf(s -> s.startsWith("x"));
          l.sort(Comparator.naturalOrder());
          List<String> sous = l.subList(0, 1);   // vue
          ```

          ⚠️ `List<Integer>` : `l.remove(1)` supprime l’**indice** 1, `l.remove(Integer.valueOf(1))` supprime la **valeur** 1.
      - title: Performances
        body: |
          `ArrayList` repose sur un tableau qui s’agrandit (≈ ×1,5) :

          | Opération | Coût |
          |---|---|
          | `get(i)`, `set(i)` | O(1) |
          | `add(x)` en fin | O(1) amorti |
          | `add(0, x)`, `remove(0)` | O(n) (décalage) |
          | `contains(x)` | O(n) |

          `LinkedList` n’est presque jamais plus rapide en pratique (mauvaise localité mémoire). Pour des recherches fréquentes, utilise un `HashSet`.
