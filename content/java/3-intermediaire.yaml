  - slug: java-maven
    title: Maven
    summary: Gérer un projet Java avec Maven — pom.xml, coordonnées, dépendances et scopes, cycle de vie, plugins et dépôts.
    minutes: 25
    concepts: [build]
    sections:
      - title: Le pom.xml
        body: |
          ```xml
          <project>
            <modelVersion>4.0.0</modelVersion>
            <groupId>fr.codemori</groupId>          <!-- coordonnées GAV -->
            <artifactId>banque</artifactId>
            <version>1.0.0-SNAPSHOT</version>

            <properties>
              <maven.compiler.release>21</maven.compiler.release>
            </properties>

            <dependencies>
              <dependency>
                <groupId>org.junit.jupiter</groupId>
                <artifactId>junit-jupiter</artifactId>
                <version>5.11.0</version>
                <scope>test</scope>                 <!-- compile, test, provided, runtime -->
              </dependency>
            </dependencies>
          </project>
          ```

          Structure standard : `src/main/java`, `src/main/resources`, `src/test/java`, sortie dans `target/`.
      - title: Cycle de vie
        body: |
          ```bash
          mvn compile      # compile
          mvn test         # compile + tests
          mvn package      # crée le .jar dans target/
          mvn install      # copie dans le dépôt local ~/.m2
          mvn clean        # supprime target/
          mvn dependency:tree
          ```

          Les phases s’enchaînent : `validate → compile → test → package → verify → install → deploy`. Exécuter une phase exécute toutes les précédentes.

          Les dépendances sont téléchargées depuis **Maven Central** et mises en cache dans `~/.m2/repository`. Les dépendances **transitives** (dépendances des dépendances) sont résolues automatiquement.
    exercises:
      - id: java-mvn-q1
        type: mcq
        prompt: Que signifient les coordonnées GAV ?
        choices: ['groupId, artifactId, version', 'Git, Ant, Version', 'Global Artifact Value', 'Gradle And Version']
        answer: 0
      - id: java-mvn-q2
        type: mcq
        prompt: Quel scope pour une dépendance utilisée seulement par les tests ?
        choices: ['test', 'compile', 'provided', 'runtime']
        answer: 0
      - id: java-mvn-order
        type: order
        prompt: Remets dans l’ordre ces phases du cycle de vie Maven.
        lines:
          - validate
          - compile
          - test
          - package
          - install
      - id: java-mvn-fill
        type: fill
        prompt: Complète la dépendance.
        code: |
          <dependency>
            <{{?}}>com.google.code.gson</{{?}}>
            <artifactId>gson</artifactId>
            <{{?}}>2.11.0</{{?}}>
          </dependency>
        blanks: [[groupId], [groupId], [version], [version]]
      - id: java-mvn-code
        type: code
        title: Analyseur de pom.xml
        prompt: |
          Lis un pom.xml simplifié et affiche `projet : groupId:artifactId:version`, puis chaque dépendance au format `groupId:artifactId:version (scope)` (scope `compile` par défaut), dans l’ordre.

          Analyse le texte avec des expressions régulières (`Pattern`/`Matcher`) : les balises de dépendances sont dans des blocs `<dependency>…</dependency>`, et les coordonnées du projet sont les premières balises `groupId`/`artifactId`/`version` **hors** de ces blocs.
        starter: |
          import java.util.*;
          import java.util.regex.*;

          public class Main {
              public static void main(String[] args) {
                  String xml = new Scanner(System.in).useDelimiter("\\A").next();
              }
          }
        solution: |
          import java.util.*;
          import java.util.regex.*;

          public class Main {
              static String balise(String texte, String nom, String defaut) {
                  Matcher m = Pattern.compile("<" + nom + ">\\s*(.*?)\\s*</" + nom + ">", Pattern.DOTALL).matcher(texte);
                  return m.find() ? m.group(1) : defaut;
              }
              public static void main(String[] args) {
                  String xml = new Scanner(System.in).useDelimiter("\\A").next();
                  Pattern dep = Pattern.compile("<dependency>(.*?)</dependency>", Pattern.DOTALL);
                  String horsDeps = dep.matcher(xml).replaceAll("");
                  System.out.println("projet : " + balise(horsDeps, "groupId", "?") + ":" + balise(horsDeps, "artifactId", "?") + ":" + balise(horsDeps, "version", "?"));
                  Matcher m = dep.matcher(xml);
                  while (m.find()) {
                      String d = m.group(1);
                      System.out.println(balise(d, "groupId", "?") + ":" + balise(d, "artifactId", "?") + ":" + balise(d, "version", "?") + " (" + balise(d, "scope", "compile") + ")");
                  }
              }
          }
        tests:
          - { input: "<project>\n<groupId>fr.codemori</groupId>\n<artifactId>banque</artifactId>\n<version>1.0</version>\n<dependencies>\n<dependency><groupId>com.google.code.gson</groupId><artifactId>gson</artifactId><version>2.11.0</version></dependency>\n<dependency>\n<groupId>org.junit.jupiter</groupId>\n<artifactId>junit-jupiter</artifactId>\n<version>5.11.0</version>\n<scope>test</scope>\n</dependency>\n</dependencies>\n</project>", output: "projet : fr.codemori:banque:1.0\ncom.google.code.gson:gson:2.11.0 (compile)\norg.junit.jupiter:junit-jupiter:5.11.0 (test)" }
          - { input: "<project><groupId>a</groupId><artifactId>b</artifactId><version>2</version></project>", output: 'projet : a:b:2', hidden: true }
    project:
      id: java-mvn-projet
      type: code
      title: Comparateur de versions
      difficulty: 3
      prompt: |
        Maven compare les versions composant par composant. Écris un comparateur simplifié : les versions sont de la forme `X.Y.Z` (1 à 3 nombres, les composants manquants valent 0), éventuellement suivies de `-SNAPSHOT` (une version SNAPSHOT est **inférieure** à la même version finale).

        Chaque ligne : `v1 v2`. Affiche `v1 < v2`, `v1 > v2` ou `v1 = v2`. Puis, toutes versions confondues (sans doublon), affiche la liste triée séparée par des espaces.
      starter: |
        import java.util.*;

        public class Main {
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
            }
        }
      solution: |
        import java.util.*;

        public class Main {
            static int comparer(String a, String b) {
                boolean sa = a.endsWith("-SNAPSHOT"), sb = b.endsWith("-SNAPSHOT");
                String[] pa = a.replace("-SNAPSHOT", "").split("\\."), pb = b.replace("-SNAPSHOT", "").split("\\.");
                for (int i = 0; i < 3; i++) {
                    int x = i < pa.length ? Integer.parseInt(pa[i]) : 0;
                    int y = i < pb.length ? Integer.parseInt(pb[i]) : 0;
                    if (x != y) return Integer.compare(x, y);
                }
                if (sa != sb) return sa ? -1 : 1;
                return 0;
            }
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
                List<String> toutes = new ArrayList<>();
                while (sc.hasNext()) {
                    String a = sc.next(), b = sc.next();
                    int c = comparer(a, b);
                    System.out.println(a + (c < 0 ? " < " : c > 0 ? " > " : " = ") + b);
                    if (!toutes.contains(a)) toutes.add(a);
                    if (!toutes.contains(b)) toutes.add(b);
                }
                toutes.sort(Main::comparer);
                System.out.println(String.join(" ", toutes));
            }
        }
      tests:
        - { input: "1.10.0 1.9.3\n2.0 2.0.0\n1.0.0-SNAPSHOT 1.0.0\n3 2.99.99", output: "1.10.0 > 1.9.3\n2.0 = 2.0.0\n1.0.0-SNAPSHOT < 1.0.0\n3 > 2.99.99\n1.0.0-SNAPSHOT 1.0.0 1.9.3 1.10.0 2.0 2.0.0 2.99.99 3" }
        - { input: 0.1 0.1, output: "0.1 = 0.1\n0.1", hidden: true }
    exam:
      pass: 70
      questions:
        - id: java-mvn-ex1
          type: mcq
          prompt: Où Maven met-il en cache les dépendances téléchargées ?
          choices: ['~/.m2/repository', 'target/', 'src/lib', '/usr/java']
