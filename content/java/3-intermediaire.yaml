  - slug: java-optional
    title: Optional
    summary: Représenter l’absence de valeur sans null — création, orElse, map, flatMap, filter, ifPresent et bonnes pratiques.
    minutes: 25
    concepts: [option]
    sections:
      - title: Un conteneur de 0 ou 1 valeur
        body: |
          ```java
          Optional<String> plein = Optional.of("Kiri");
          Optional<String> vide = Optional.empty();
          Optional<String> peutEtre = Optional.ofNullable(valeurPossiblementNull);

          plein.isPresent(); vide.isEmpty();
          plein.orElse("inconnu");                     // valeur ou défaut
          plein.orElseGet(() -> calculCouteux());      // défaut calculé paresseusement
          plein.orElseThrow();                         // NoSuchElementException si vide
          plein.ifPresent(System.out::println);
          plein.ifPresentOrElse(v -> …, () -> …);
          ```

          De nombreuses API renvoient des `Optional` : `stream().findFirst()`, `max()`, `min()`.
      - title: Transformer
        body: |
          ```java
          Optional<Integer> longueur = plein.map(String::length);           // Optional[4]
          Optional<String> grand = plein.filter(s -> s.length() > 10);      // empty
          Optional<Adresse> a = trouverUtilisateur(id).flatMap(Utilisateur::adresse);
          ```

          Bonnes pratiques :

          - `Optional` sert de **type de retour** ; pas comme attribut ni paramètre ;
          - ne jamais appeler `get()` sans vérification (préférer `orElse…`) ;
          - ne jamais renvoyer `null` à la place d’un `Optional` !
          - pour les primitifs : `OptionalInt`, `OptionalDouble`.
