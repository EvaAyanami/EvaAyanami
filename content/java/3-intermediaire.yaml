          - `Files.walk(dossier)` parcourt une arborescence ; `Files.createTempFile` crée un fichier temporaire.
          - Pour les CSV réels (guillemets, virgules dans les champs), utilise une bibliothèque (OpenCSV, Jackson CSV).
