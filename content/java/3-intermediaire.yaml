  - slug: java-gradle
    title: Gradle
    summary: Construire avec Gradle — build.gradle.kts, plugins, configurations de dépendances, tâches, wrapper et comparaison avec Maven.
    minutes: 25
    concepts: [build]
    sections:
      - title: build.gradle.kts
        body: |
          ```kotlin
          plugins {
              java
              application
          }

          group = "fr.codemori"
          version = "1.0.0"

          java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }

          repositories { mavenCentral() }

          dependencies {
              implementation("com.google.code.gson:gson:2.11.0")       // compile + exécution
              testImplementation("org.junit.jupiter:junit-jupiter:5.11.0")
              testRuntimeOnly("org.junit.platform:junit-platform-launcher")
          }

          application { mainClass = "fr.codemori.Main" }
          tasks.test { useJUnitPlatform() }
          ```
      - title: Tâches et wrapper
        body: |
          ```bash
          ./gradlew build        # compile, teste, assemble
          ./gradlew test
          ./gradlew run          # avec le plugin application
          ./gradlew dependencies
          ./gradlew tasks        # liste des tâches
          ```

          Le **wrapper** (`gradlew`) télécharge la bonne version de Gradle : tout le monde compile avec la même version, sans installation préalable.

          | | Maven | Gradle |
          |---|---|---|
          | Configuration | XML déclaratif | Kotlin/Groovy (programmable) |
          | Performance | correcte | cache de build, compilation incrémentale |
          | Écosystème | très mature | Android, projets multi-modules |

          `implementation` cache une dépendance aux consommateurs de ta bibliothèque ; `api` (plugin `java-library`) l’expose.
    exercises:
      - id: java-gradle-q1
        type: mcq
        prompt: Quel est l’intérêt du Gradle Wrapper (gradlew) ?
        choices: ['Utiliser la même version de Gradle partout sans installation préalable', 'Accélérer la JVM', 'Remplacer Maven Central', 'Compiler en C++']
        answer: 0
      - id: java-gradle-q2
        type: mcq
        prompt: Quelle configuration utiliser pour une dépendance de test ?
        choices: ['testImplementation', 'implementation', 'api', 'compileOnly']
        answer: 0
      - id: java-gradle-fill
        type: fill
        prompt: Complète le bloc de dépendances.
        code: |
          dependencies {
              {{?}}("com.google.guava:guava:33.0.0-jre")
              {{?}}("org.junit.jupiter:junit-jupiter:5.11.0")
          }
        blanks: [[implementation], [testImplementation]]
      - id: java-gradle-code
        type: code
        title: Graphe de tâches
        prompt: |
          Gradle exécute les tâches selon leurs dépendances. Chaque ligne déclare `tache : dep1 dep2…` (éventuellement aucune dépendance). La dernière ligne est `executer cible`.

          Affiche l’ordre d’exécution (tri topologique **en profondeur** : on exécute d’abord les dépendances dans l’ordre déclaré, chaque tâche une seule fois), séparé par ` -> `. Si un cycle est détecté, affiche `cycle détecté`.
        starter: |
          import java.util.*;

          public class Main {
              public static void main(String[] args) {
                  Scanner sc = new Scanner(System.in);
              }
          }
        solution: |
          import java.util.*;

          public class Main {
              static Map<String, List<String>> deps = new LinkedHashMap<>();
              static List<String> ordre = new ArrayList<>();
              static Set<String> fait = new HashSet<>(), enCours = new HashSet<>();

              static boolean visiter(String t) {
                  if (fait.contains(t)) return true;
                  if (!enCours.add(t)) return false;
                  for (String d : deps.getOrDefault(t, List.of())) if (!visiter(d)) return false;
                  enCours.remove(t);
                  fait.add(t);
                  ordre.add(t);
                  return true;
              }

              public static void main(String[] args) {
                  Scanner sc = new Scanner(System.in);
                  String cible = null;
                  while (sc.hasNextLine()) {
                      String l = sc.nextLine().trim();
                      if (l.isEmpty()) continue;
                      if (l.startsWith("executer ")) { cible = l.substring(9).trim(); continue; }
                      String[] p = l.split(":");
                      List<String> d = new ArrayList<>();
                      if (p.length > 1) for (String x : p[1].trim().split("\\s+")) if (!x.isEmpty()) d.add(x);
                      deps.put(p[0].trim(), d);
                  }
                  System.out.println(visiter(cible) ? String.join(" -> ", ordre) : "cycle détecté");
              }
          }
        tests:
          - { input: "compileJava :\nprocessResources :\nclasses : compileJava processResources\njar : classes\ntest : classes\nbuild : jar test\nexecuter build", output: compileJava -> processResources -> classes -> jar -> test -> build }
          - { input: "a : b\nb : a\nexecuter a", output: cycle détecté, hidden: true }
    project:
      id: java-gradle-projet
      type: code
      title: Résolution de conflits de versions
      difficulty: 3
      prompt: |
        Gradle résout par défaut les conflits de versions en prenant la **plus récente**. Chaque ligne déclare une dépendance demandée par un module : `module -> groupe:artefact:version`.

        Pour chaque artefact (trié par `groupe:artefact`), affiche `groupe:artefact:versionRetenue` et, s’il y a eu conflit, ` (conflit : v1, v2…)` avec les versions demandées distinctes triées. Les versions sont de la forme `X.Y.Z` (comparaison numérique).
      starter: |
        import java.util.*;

        public class Main {
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
            }
        }
      solution: |
        import java.util.*;

        public class Main {
            static int cmp(String a, String b) {
                String[] x = a.split("\\."), y = b.split("\\.");
                for (int i = 0; i < Math.max(x.length, y.length); i++) {
                    int u = i < x.length ? Integer.parseInt(x[i]) : 0, v = i < y.length ? Integer.parseInt(y[i]) : 0;
                    if (u != v) return Integer.compare(u, v);
                }
                return 0;
            }
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
                Map<String, TreeSet<String>> versions = new TreeMap<>();
                while (sc.hasNextLine()) {
                    String l = sc.nextLine().trim();
                    if (l.isEmpty()) continue;
                    String coord = l.split("->")[1].trim();
                    int i = coord.lastIndexOf(':');
                    versions.computeIfAbsent(coord.substring(0, i), k -> new TreeSet<>(Main::cmp)).add(coord.substring(i + 1));
                }
                versions.forEach((art, vs) -> {
                    String s = art + ":" + vs.last();
                    if (vs.size() > 1) s += " (conflit : " + String.join(", ", vs) + ")";
                    System.out.println(s);
                });
            }
        }
      tests:
        - { input: "app -> com.google.code.gson:gson:2.10.1\nlib -> com.google.code.gson:gson:2.11.0\napp -> org.slf4j:slf4j-api:2.0.9\ncore -> com.google.code.gson:gson:2.9.0", output: "com.google.code.gson:gson:2.11.0 (conflit : 2.9.0, 2.10.1, 2.11.0)\norg.slf4j:slf4j-api:2.0.9" }
        - { input: "a -> x:y:1.0.0\nb -> x:y:1.0.0", output: 'x:y:1.0.0', hidden: true }
    exam:
      pass: 70
      questions:
        - id: java-gradle-ex1
          type: mcq
          prompt: En quels langages s’écrivent les scripts Gradle ?
          choices: ['Kotlin ou Groovy', 'XML', 'YAML', 'JSON']
