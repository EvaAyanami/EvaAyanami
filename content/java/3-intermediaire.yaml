  # ------------------------------------------------------------------
  - slug: java-generics
    title: Generics
    summary: Classes et méthodes génériques, bornes extends, jokers ? extends / ? super (PECS) et effacement de type.
    minutes: 30
    concepts: [generiques]
    sections:
      - title: Classes et méthodes génériques
        body: |
          ```java
          class Boite<T> {
              private T contenu;
              void mettre(T x) { contenu = x; }
              T prendre() { return contenu; }
          }
          Boite<String> b = new Boite<>();   // <> : type déduit (diamant)

          static <T extends Comparable<T>> T max(List<T> l) {   // borne
              T m = l.get(0);
              for (T x : l) if (x.compareTo(m) > 0) m = x;
              return m;
          }

          record Paire<A, B>(A premier, B second) {}
          ```

          Les génériques donnent la **sûreté de type à la compilation** : plus de casts ni de `ClassCastException`.
      - title: Jokers et effacement
        body: |
          `List<Integer>` n’est **pas** un sous-type de `List<Number>`. Les jokers assouplissent cela :

          ```java
          static double somme(List<? extends Number> l) { … }   // lecture : « producteur »
          static void remplir(List<? super Integer> l) { l.add(1); } // écriture : « consommateur »
          ```

          Règle **PECS** : *Producer Extends, Consumer Super*.

          **Effacement de type** : les génériques n’existent qu’à la compilation ; à l’exécution, `List<String>` et `List<Integer>` sont toutes deux de simples `List`. Conséquences : pas de `new T()`, pas de `T[]`, pas de génériques de primitifs (`List<int>` interdit → `List<Integer>`).
    exercises:
      - id: java-gen-predict
        type: predict
        prompt: Que va afficher ce programme ?
        code: |
          import java.util.*;
          public class Main {
              record Paire<A, B>(A a, B b) { Paire<B, A> inverser() { return new Paire<>(b, a); } }
              static <T extends Comparable<T>> T max(List<T> l) { T m = l.get(0); for (T x : l) if (x.compareTo(m) > 0) m = x; return m; }
              static double somme(List<? extends Number> l) { double s = 0; for (Number n : l) s += n.doubleValue(); return s; }
              public static void main(String[] args) {
                  System.out.println(new Paire<>(1, "un").inverser() + " " + max(List.of("kiwi", "pomme", "abricot")) + " " + somme(List.of(1, 2.5)));
              }
          }
        output: Paire[a=un, b=1] pomme 3.5
        concepts: [generiques]
      - id: java-gen-q1
        type: mcq
        prompt: Que signifie la règle PECS ?
        choices: ['Producer Extends, Consumer Super', 'Public Extends, Class Super', 'Pas d’Extends Sans Super', 'Une convention de nommage']
        answer: 0
      - id: java-gen-q2
        type: mcq
        prompt: Pourquoi ne peut-on pas écrire List<int> ?
        choices: ['Les génériques ne fonctionnent qu’avec des types référence (effacement de type)', 'int est déprécié', 'Par erreur du compilateur', 'On peut']
        answer: 0
      - id: java-gen-code
        type: code
        title: Pile générique
        prompt: |
          Implémente `class Pile<T>` (sur une `ArrayList<T>`) avec `empiler`, `T depiler()` (lève `IllegalStateException("pile vide")`), `Optional<T> sommet()`, `int taille()`.

          Le programme (fourni) l’utilise avec des `String` et des `Integer`.
        starter: |
          import java.util.*;

          public class Main {
              public static void main(String[] args) {
                  Scanner sc = new Scanner(System.in);
                  Pile<String> mots = new Pile<>();
                  Pile<Integer> longueurs = new Pile<>();
                  while (sc.hasNext()) {
                      String m = sc.next();
                      if (m.equals("-")) {
                          try { System.out.println("dépilé " + mots.depiler()); longueurs.depiler(); }
                          catch (IllegalStateException e) { System.out.println(e.getMessage()); }
                      } else { mots.empiler(m); longueurs.empiler(m.length()); }
                  }
                  System.out.println(mots.taille() + " " + mots.sommet() + " " + longueurs.sommet());
              }
          }
        solution: |
          import java.util.*;

          class Pile<T> {
              private final List<T> elements = new ArrayList<>();
              void empiler(T x) { elements.add(x); }
              T depiler() {
                  if (elements.isEmpty()) throw new IllegalStateException("pile vide");
                  return elements.remove(elements.size() - 1);
              }
              Optional<T> sommet() { return elements.isEmpty() ? Optional.empty() : Optional.of(elements.get(elements.size() - 1)); }
              int taille() { return elements.size(); }
          }

          public class Main {
              public static void main(String[] args) {
                  Scanner sc = new Scanner(System.in);
                  Pile<String> mots = new Pile<>();
                  Pile<Integer> longueurs = new Pile<>();
                  while (sc.hasNext()) {
                      String m = sc.next();
                      if (m.equals("-")) {
                          try { System.out.println("dépilé " + mots.depiler()); longueurs.depiler(); }
                          catch (IllegalStateException e) { System.out.println(e.getMessage()); }
                      } else { mots.empiler(m); longueurs.empiler(m.length()); }
                  }
                  System.out.println(mots.taille() + " " + mots.sommet() + " " + longueurs.sommet());
              }
          }
        tests:
          - { input: un deux - trois, output: "dépilé deux\n2 Optional[trois] Optional[5]" }
          - { input: '-', output: "pile vide\n0 Optional.empty Optional.empty", hidden: true }
        concepts: [generiques]
    project:
      id: java-gen-projet
      type: code
      title: Cache LRU générique
      difficulty: 3
      prompt: |
        Implémente `class CacheLRU<K, V>` de capacité fixe (en t’appuyant sur `LinkedHashMap` avec `accessOrder = true` et `removeEldestEntry`). Méthodes : `Optional<V> get(K)`, `void put(K, V)`, `List<K> cles()` (de la moins récemment utilisée à la plus récente).

        Première ligne : capacité. Commandes : `put k v`, `get k` (affiche la valeur ou `absent`), `etat` (affiche les clés).
      starter: |
        import java.util.*;

        public class Main {
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
            }
        }
      solution: |
        import java.util.*;

        class CacheLRU<K, V> {
            private final LinkedHashMap<K, V> m;
            CacheLRU(int capacite) {
                m = new LinkedHashMap<>(16, 0.75f, true) {
                    @Override protected boolean removeEldestEntry(Map.Entry<K, V> e) { return size() > capacite; }
                };
            }
            Optional<V> get(K k) { return Optional.ofNullable(m.get(k)); }
            void put(K k, V v) { m.put(k, v); }
            List<K> cles() { return new ArrayList<>(m.keySet()); }
        }

        public class Main {
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
                CacheLRU<String, String> c = new CacheLRU<>(sc.nextInt());
                while (sc.hasNext()) {
                    switch (sc.next()) {
                        case "put" -> c.put(sc.next(), sc.next());
                        case "get" -> System.out.println(c.get(sc.next()).orElse("absent"));
                        default -> System.out.println(c.cles());
                    }
                }
            }
        }
      tests:
        - { input: "2\nput a 1\nput b 2\nget a\nput c 3\nget b\netat", output: "1\nabsent\n[a, c]" }
        - { input: "1\nget x\nput x 9\nput y 8\netat", output: "absent\n[y]", hidden: true }
