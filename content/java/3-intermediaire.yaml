    project:
      id: java-al-projet
      type: code
      title: Bulletin de notes
      difficulty: 2
      prompt: |
        Lis des notes (0–20) dans une `ArrayList<Integer>`. Affiche `Moyenne : X.XX`, `Min : …`, `Max : …`, `Au-dessus de la moyenne : K`, puis `Notes triées : …` (Locale.US pour la moyenne). Il y a au moins une note.
      starter: |
        import java.util.*;

        public class Main {
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
                List<Integer> notes = new ArrayList<>();
                while (sc.hasNextInt()) notes.add(sc.nextInt());
            }
        }
      solution: |
        import java.util.*;

        public class Main {
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
                List<Integer> notes = new ArrayList<>();
                while (sc.hasNextInt()) notes.add(sc.nextInt());
                double somme = 0;
                for (int n : notes) somme += n;
                double moyenne = somme / notes.size();
                int dessus = 0;
                for (int n : notes) if (n > moyenne) dessus++;
                System.out.println(String.format(Locale.US, "Moyenne : %.2f", moyenne));
                System.out.println("Min : " + Collections.min(notes));
                System.out.println("Max : " + Collections.max(notes));
                System.out.println("Au-dessus de la moyenne : " + dessus);
                Collections.sort(notes);
                StringBuilder sb = new StringBuilder("Notes triées :");
                for (int n : notes) sb.append(' ').append(n);
                System.out.println(sb);
            }
        }
      tests:
        - { input: 12 8 15 10 20, output: "Moyenne : 13.00\nMin : 8\nMax : 20\nAu-dessus de la moyenne : 2\nNotes triées : 8 10 12 15 20" }
        - { input: '7', output: "Moyenne : 7.00\nMin : 7\nMax : 7\nAu-dessus de la moyenne : 0\nNotes triées : 7", hidden: true }
