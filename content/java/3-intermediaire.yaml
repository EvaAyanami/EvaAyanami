        prompt: 'Lis un texte, compte les mots (en minuscules) et affiche les 3 plus fréquents (`mot : n`) par fréquence décroissante puis ordre alphabétique.'
        starter: |
          import java.util.*;

          public class Main {
              public static void main(String[] args) {
                  Scanner sc = new Scanner(System.in);
