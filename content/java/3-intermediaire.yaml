  # ------------------------------------------------------------------
  - slug: java-hashset
    title: HashSet
    summary: Ensembles sans doublons — ajout, test d’appartenance, opérations ensemblistes, LinkedHashSet, TreeSet et hashCode.
    minutes: 20
    concepts: [collections]
    sections:
      - title: Ensembles
        body: |
          ```java
          Set<String> vus = new HashSet<>();
          boolean nouveau = vus.add("kiri");     // false si déjà présent
          vus.contains("kiri");                   // O(1) en moyenne
          vus.remove("kiri");

          Set<Integer> a = new TreeSet<>(List.of(1, 2, 3)), b = Set.of(2, 3, 4);
          Set<Integer> inter = new TreeSet<>(a); inter.retainAll(b);   // {2, 3}
          Set<Integer> union = new TreeSet<>(a); union.addAll(b);      // {1, 2, 3, 4}
          Set<Integer> diff = new TreeSet<>(a); diff.removeAll(b);     // {1}
          ```

          `HashSet` (aucun ordre), `LinkedHashSet` (ordre d’insertion), `TreeSet` (trié, avec `first()`, `ceiling(x)`, `headSet(x)`…).
      - title: equals et hashCode
        body: |
          Un `HashSet` range les objets selon leur `hashCode`, puis compare avec `equals`. Si une classe redéfinit `equals` sans `hashCode`, deux objets « égaux » peuvent tous deux entrer dans l’ensemble !

          Contrat : `a.equals(b)` ⇒ `a.hashCode() == b.hashCode()`. Les **records** respectent ce contrat automatiquement :

          ```java
          record Point(int x, int y) {}
          Set<Point> s = new HashSet<>();
          s.add(new Point(1, 2));
          s.contains(new Point(1, 2));   // true
          ```
    exercises:
      - id: java-hs-predict
        type: predict
        prompt: Que va afficher ce programme ?
        code: |
          import java.util.*;
          public class Main {
              record P(int x) {}
              static class Q { int x; Q(int x) { this.x = x; } }
              public static void main(String[] args) {
                  Set<P> a = new HashSet<>(List.of(new P(1), new P(1)));
                  Set<Q> b = new HashSet<>(List.of(new Q(1), new Q(1)));
                  TreeSet<Integer> t = new TreeSet<>(List.of(10, 5, 20));
                  System.out.println(a.size() + " " + b.size() + " " + t.ceiling(6) + " " + t.first());
              }
          }
        output: 1 2 10 5
