    project:
      id: java-opt-projet
      type: code
      title: Recherche chaînée
      difficulty: 3
      prompt: |
        Données : des utilisateurs (`U id nom idAdresse` — `idAdresse` vaut `-` s’il n’y en a pas) et des adresses (`A idAdresse ville`), puis des requêtes `? id`.

        Écris `Optional<Utilisateur> trouverUtilisateur(int)`, `Optional<String> ville(Utilisateur)` et, avec `flatMap`, affiche pour chaque requête `id : ville` ou `id : ville inconnue` (utilisateur inexistant, sans adresse, ou adresse introuvable).
      starter: |
        import java.util.*;

        public class Main {
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
            }
        }
      solution: |
        import java.util.*;

        public class Main {
            record Utilisateur(int id, String nom, Optional<Integer> adresse) {}
            static Map<Integer, Utilisateur> users = new HashMap<>();
            static Map<Integer, String> adresses = new HashMap<>();
            static Optional<Utilisateur> trouverUtilisateur(int id) { return Optional.ofNullable(users.get(id)); }
            static Optional<String> ville(Utilisateur u) { return u.adresse().flatMap(a -> Optional.ofNullable(adresses.get(a))); }
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
                while (sc.hasNext()) {
                    switch (sc.next()) {
                        case "U" -> {
                            int id = sc.nextInt();
                            String nom = sc.next(), a = sc.next();
                            users.put(id, new Utilisateur(id, nom, a.equals("-") ? Optional.empty() : Optional.of(Integer.parseInt(a))));
                        }
                        case "A" -> adresses.put(sc.nextInt(), sc.next());
                        default -> {
                            int id = sc.nextInt();
