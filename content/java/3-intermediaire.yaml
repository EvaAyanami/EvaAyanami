    project:
      id: java-str2-projet
      type: code
      title: Statistiques de ventes
      difficulty: 3
      prompt: |
        Chaque ligne : `vendeur region montant`. Avec les streams uniquement, affiche :

        1. `total : T` ;
        2. le CA par région trié par région (`region=CA`, séparés par des espaces) ;
        3. `meilleur : vendeur` (plus gros total cumulé, premier par ordre alphabétique en cas d’égalité) ;
        4. les vendeurs ayant au moins une vente > 1000, triés, séparés par des virgules (ou `aucun`).
      starter: |
        import java.util.*;
        import java.util.stream.*;

        public class Main {
            record Vente(String vendeur, String region, long montant) {}
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
                List<Vente> ventes = new ArrayList<>();
                while (sc.hasNext()) ventes.add(new Vente(sc.next(), sc.next(), sc.nextLong()));
            }
        }
      solution: |
        import java.util.*;
        import java.util.stream.*;

        public class Main {
            record Vente(String vendeur, String region, long montant) {}
            public static void main(String[] args) {
                Scanner sc = new Scanner(System.in);
                List<Vente> ventes = new ArrayList<>();
                while (sc.hasNext()) ventes.add(new Vente(sc.next(), sc.next(), sc.nextLong()));
                System.out.println("total : " + ventes.stream().mapToLong(Vente::montant).sum());
                System.out.println(ventes.stream()
                        .collect(Collectors.groupingBy(Vente::region, TreeMap::new, Collectors.summingLong(Vente::montant)))
                        .entrySet().stream().map(e -> e.getKey() + "=" + e.getValue()).collect(Collectors.joining(" ")));
                ventes.stream()
                        .collect(Collectors.groupingBy(Vente::vendeur, TreeMap::new, Collectors.summingLong(Vente::montant)))
                        .entrySet().stream()
                        .max(Map.Entry.<String, Long>comparingByValue().thenComparing(Map.Entry.<String, Long>comparingByKey().reversed()))
                        .ifPresent(e -> System.out.println("meilleur : " + e.getKey()));
                String gros = ventes.stream().filter(v -> v.montant() > 1000).map(Vente::vendeur).distinct().sorted().collect(Collectors.joining(","));
                System.out.println(gros.isEmpty() ? "aucun" : gros);
            }
        }
      tests:
        - { input: "ada nord 500\nbob sud 1500\nada sud 1200\nzoe nord 300\nbob nord 200", output: "total : 3700\nnord=1000 sud=2700\nmeilleur : ada\nada,bob" }
        - { input: x est 10, output: "total : 10\nest=10\nmeilleur : x\naucun", hidden: true }
