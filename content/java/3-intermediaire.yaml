  - slug: java-hashmap
    title: HashMap
    summary: Associer des clés à des valeurs — put, get, getOrDefault, merge, computeIfAbsent, parcours et ordre des clés.
    minutes: 30
    concepts: [hashmap, collections]
    sections:
      - title: Les bases
        body: |
          ```java
          Map<String, Integer> ages = new HashMap<>();
          ages.put("Ada", 36);
          ages.put("Bob", 25);
          ages.get("Ada");                    // 36
          ages.get("Zoe");                    // null !
          ages.getOrDefault("Zoe", 0);        // 0
          ages.containsKey("Bob");
          ages.remove("Bob");
          ages.putIfAbsent("Kiri", 16);

          for (Map.Entry<String, Integer> e : ages.entrySet()) {
              System.out.println(e.getKey() + " → " + e.getValue());
          }
          ages.forEach((k, v) -> System.out.println(k + " " + v));
          ```

          L’ordre de parcours d’un `HashMap` n’est **pas garanti** : `LinkedHashMap` conserve l’ordre d’insertion, `TreeMap` trie les clés.
      - title: Compter et regrouper
        body: |
          ```java
          Map<String, Integer> freq = new HashMap<>();
          for (String mot : mots) freq.merge(mot, 1, Integer::sum);       // compteur

          Map<Integer, List<String>> parLongueur = new TreeMap<>();
          for (String mot : mots) parLongueur.computeIfAbsent(mot.length(), k -> new ArrayList<>()).add(mot);
          ```

          Les clés doivent avoir un `equals`/`hashCode` cohérents (les `String`, `Integer` et records le font). Ne jamais modifier une clé après l’avoir insérée.
