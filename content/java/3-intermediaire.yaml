  - slug: java-streams
    title: Streams
    summary: L’API Stream — filter, map, sorted, distinct, reduce, collect, groupingBy, flux de primitifs et évaluation paresseuse.
    minutes: 35
    concepts: [iterateurs]
    sections:
      - title: Pipeline de traitement
        body: |
          Un **stream** décrit un traitement de données en trois temps : **source** → opérations **intermédiaires** (paresseuses) → opération **terminale**.

          ```java
          List<String> noms = List.of("kiri", "ada", "linus", "bob", "anna");
          List<String> r = noms.stream()
              .filter(n -> n.length() > 3)       // intermédiaire
              .map(String::toUpperCase)          // intermédiaire
              .sorted()                          // intermédiaire
              .toList();                         // terminale (Java 16)
          // [ANNA, KIRI, LINUS]

          int total = IntStream.rangeClosed(1, 10).sum();
          double moyenne = noms.stream().mapToInt(String::length).average().orElse(0);
          boolean ok = noms.stream().allMatch(n -> !n.isEmpty());
          Optional<String> premier = noms.stream().filter(n -> n.startsWith("l")).findFirst();
          ```

          Un stream ne peut être consommé **qu’une fois**.
      - title: Collecteurs
        body: |
          ```java
          import static java.util.stream.Collectors.*;

          Map<Integer, List<String>> parLongueur = noms.stream().collect(groupingBy(String::length));
          Map<Character, Long> compte = noms.stream().collect(groupingBy(n -> n.charAt(0), TreeMap::new, counting()));
          String joint = noms.stream().collect(joining(", ", "[", "]"));
          Map<Boolean, List<String>> parts = noms.stream().collect(partitioningBy(n -> n.length() > 3));
          Map<String, Integer> longueurs = noms.stream().collect(toMap(n -> n, String::length));
          int somme = notes.stream().reduce(0, Integer::sum);
          ```

          `flatMap` aplatit des collections imbriquées ; `parallelStream()` parallélise (à mesurer : souvent inutile pour de petits volumes).
